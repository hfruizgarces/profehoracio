<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Transformaciones Geométricas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg-1:#1e1147; --bg-2:#3b1785; --bg-3:#5b21b6;
  --primary:#34d399; --accent:#fbbf24; --error:#fb7185; --blue:#38bdf8; --pink:#f472b6;
  --text:#f6f3ff; --text-dim:#c9bdf0; --text-faint:#8f7fc4;
  --surface:rgba(255,255,255,.07); --surface-strong:rgba(255,255,255,.12); --surface-soft:rgba(255,255,255,.05);
  --border-soft:rgba(255,255,255,.16);
  --shadow:0 14px 34px rgba(0,0,0,0.4);
  --radius:20px; --radius-sm:12px;
  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;
  --transition: all .2s cubic-bezier(.4,0,.2,1);
}
*{ box-sizing:border-box; }
html,body{
  margin:0; font-family:var(--font-body); font-weight:600; color:var(--text);
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed; min-height:100vh; overflow-x:hidden;
}
button{ font-family:inherit; }
h1,h2,h3{ font-family:var(--font-display); margin:0; }

.wrap{ max-width:560px; margin:0 auto; padding:16px 16px 50px; }
.screen{ display:none; animation:fadeIn .35s ease; }
.screen.active{ display:block; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.card{
  background:var(--surface); border:1px solid var(--border-soft); backdrop-filter:blur(6px);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; width:100%;
}

/* ---------- Portada ---------- */
.hero{ text-align:center; padding:26px 6px 10px; }
.hero h1{ font-size:clamp(1.6rem,5.6vw,2.2rem); margin-bottom:10px; }
.hero .subtitle{ color:var(--text-dim); font-weight:600; }

.level-selector{
  display:grid; grid-template-columns:repeat(2,1fr); gap:clamp(10px,2.5vw,16px);
  width:100%; max-width:480px; margin:20px auto 0;
}
@media (max-width:480px){ .level-selector{ grid-template-columns:1fr; } }
.level-btn{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  padding:clamp(16px,4vw,22px) 10px; min-height:96px; border:none; border-radius:var(--radius-sm);
  cursor:pointer; transition:var(--transition); text-align:center; width:100%;
  color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.3);
}
.level-btn.easy{ background:linear-gradient(140deg,#0f9d70,#34d399); }
.level-btn.mid{ background:linear-gradient(140deg,#1d4ed8,#38bdf8); }
.level-btn.hard{ background:linear-gradient(140deg,#b91c66,#f472b6); }
.level-btn:hover{ transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.4); }
.level-btn:disabled{ opacity:.55; cursor:wait; transform:none; }
.level-btn .level-star{ font-size:clamp(1.4rem,4vw,1.7rem); }
.level-btn .level-name{ font-weight:800; font-size:clamp(1rem,2.6vw,1.1rem); font-family:var(--font-display); }
.level-btn .level-desc{ font-weight:600; font-size:.72rem; opacity:.9; }

footer.credits{ text-align:center; color:var(--text-faint); font-weight:700; font-size:.78rem; padding:24px 10px 4px; }
.loading-msg{ text-align:center; color:var(--text-dim); font-weight:700; margin-top:16px; display:none; }
.loading-msg.show{ display:block; }

/* ---------- Barra superior ---------- */
.app-topbar{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px;
  width:100%; margin-bottom:14px;
}
.icon-btn{
  grid-column:1; justify-self:start; display:inline-flex; align-items:center; gap:6px;
  background:var(--surface); border:1px solid var(--border-soft); color:var(--text);
  padding:9px 14px; border-radius:999px; font-weight:700; font-size:.9rem; cursor:pointer;
}
.icon-btn:hover{ background:var(--surface-strong); }
.moves-pill{
  grid-column:2; justify-self:center; display:inline-flex; align-items:center; gap:8px;
  background:rgba(56,189,248,.12); border:1px solid rgba(56,189,248,.4); color:var(--blue);
  padding:8px 16px; border-radius:999px; font-weight:800; font-family:var(--font-display); font-size:.95rem;
}
.moves-pill .par{ color:var(--text-faint); font-weight:700; font-size:.8rem; }

/* ---------- Tablero ---------- */
.hint-banner{
  text-align:center; font-weight:700; color:var(--text-dim); margin-top:0;
  background:var(--surface-soft); border:1.5px dashed var(--border-soft);
  border-radius:14px; padding:10px 16px; margin-bottom:14px; font-size:.86rem;
}
.hint-banner.warn{ border-color:var(--accent); color:var(--accent); border-style:solid; }

.board-wrap{ display:flex; justify-content:center; margin-bottom:16px; touch-action:none; }
.board-svg{ width:100%; max-width:420px; height:auto; user-select:none; }
.grid-line{ stroke:rgba(255,255,255,.12); stroke-width:1; }
.grid-border{ stroke:var(--border-soft); stroke-width:2; fill:none; }
.target-cell{ fill:rgba(251,191,36,.08); stroke:var(--accent); stroke-width:2; stroke-dasharray:5 4; }
.shape-cell{ fill:var(--blue); stroke:#0c4a6e; stroke-width:1.5; cursor:grab; transition:fill .2s ease; }
.shape-cell.dragging{ cursor:grabbing; }
.shape-cell.matched{ fill:var(--primary); stroke:#065f46; }
.wall-cell{ fill:#3f1d1d; stroke:#7f1d1d; stroke-width:1.5; }
.reflect-line{ stroke:var(--pink); stroke-width:3; stroke-dasharray:8 5; }
.reflect-preview{ fill:rgba(244,114,182,.28); stroke:var(--pink); stroke-width:1.5; stroke-dasharray:3 3; }

/* ---------- Controles ---------- */
.controls-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:10px; }
.ctrl-btn{
  display:flex; flex-direction:column; align-items:center; gap:4px; padding:14px 6px; border-radius:14px;
  border:2px solid var(--border-soft); background:var(--surface-soft); color:var(--text);
  font-weight:700; font-family:var(--font-display); cursor:pointer; font-size:.78rem; transition:var(--transition);
}
.ctrl-btn:hover{ transform:translateY(-2px); border-color:var(--blue); background:rgba(56,189,248,.12); }
.ctrl-btn .ctrl-icon{ font-size:1.5rem; }
.ctrl-btn.blocked{ opacity:.25; cursor:not-allowed; }
.ctrl-btn.activo{ border-color:var(--pink); background:rgba(244,114,182,.16); color:var(--pink); }

/* ---------- Paneles de modo (rotar / 2 puntos) ---------- */
.modo-panel{
  background:rgba(244,114,182,.08); border:2px solid var(--pink); border-radius:var(--radius-sm);
  padding:14px; margin-bottom:14px; text-align:center;
}
.modo-desc{ font-weight:700; color:var(--pink); margin:0 0 10px; font-size:.92rem; }
.tipo-row{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:10px; }
.modo-dir-btn{
  flex:1; padding:14px 4px; border-radius:12px; border:2px solid var(--pink); background:rgba(244,114,182,.1);
  color:var(--pink); font-family:var(--font-display); font-weight:800; font-size:.85rem; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:4px;
}
.modo-dir-icon{ font-size:1.3rem; }
.modo-dir-btn.activo{ background:var(--pink); color:#3b0a2a; }
.modo-actions{ display:flex; gap:10px; }
.modo-actions button{
  flex:1; padding:11px; border-radius:12px; border:none; font-family:var(--font-display); font-weight:800;
  cursor:pointer; font-size:.92rem;
}
.btn-confirmar-modo{ background:var(--pink); color:#3b0a2a; }
.btn-confirmar-modo:disabled{ opacity:.4; cursor:not-allowed; }
.btn-cancelar-modo{ background:var(--surface-soft); border:2px solid var(--border-soft) !important; color:var(--text); }

/* ---------- Marcadores de puntos, vectores, ejes, arcos (SVG) ---------- */
.vertice-candidato{ fill:rgba(244,114,182,.35); stroke:var(--pink); stroke-width:1.5; cursor:pointer; }
.vertice-candidato:hover{ fill:var(--pink); }
.punto-elegido{ fill:var(--pink); stroke:#fff; stroke-width:2; }
.vector-linea{ stroke:var(--pink); stroke-width:3; marker-end:url(#flechaVector); }
.eje-linea{ stroke:var(--pink); stroke-width:3; stroke-dasharray:8 5; }
.arco-rotacion{ fill:none; stroke:var(--pink); stroke-width:2; stroke-dasharray:4 4; opacity:.7; }

/* ---------- Final ---------- */
.win-overlay{
  position:fixed; inset:0; background:rgba(10,4,30,.65); display:flex; align-items:center; justify-content:center;
  z-index:1000; padding:18px; backdrop-filter:blur(3px); animation:fadeInWin .18s ease;
}
@keyframes fadeInWin{ from{opacity:0;} to{opacity:1;} }
.win-card{
  background:linear-gradient(160deg,#2c1468,#4c1d95); border:2px solid var(--primary); border-radius:var(--radius);
  padding:30px 26px; max-width:380px; width:100%; text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,.35), 0 0 0 6px rgba(52,211,153,.1);
  animation:popWin .22s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popWin{ from{transform:scale(.85); opacity:0;} to{transform:scale(1); opacity:1;} }
.win-card .star-burst{ display:inline-block; animation:pop .5s ease; font-size:1.8rem; }
@keyframes pop{ 0%{transform:scale(0);} 60%{transform:scale(1.3);} 100%{transform:scale(1);} }
.win-card h2{ color:var(--primary); font-size:1.4rem; margin:6px 0 10px; }
.win-card p{ color:var(--text-dim); font-weight:700; margin-bottom:22px; font-size:.92rem; }
.win-actions-row{ display:flex; gap:10px; justify-content:center; }
.win-btn-icon{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:14px 6px;
  border:2px solid var(--border-soft); border-radius:14px; background:var(--surface-soft); color:var(--text);
  cursor:pointer; transition:var(--transition); font-family:var(--font-display); font-weight:700; font-size:.72rem;
}
.win-btn-icon:hover{ transform:translateY(-2px); border-color:var(--primary); background:rgba(52,211,153,.14); }
.win-btn-icon-glyph{ font-size:1.6rem; line-height:1; }
#btnSiguiente.win-btn-icon{ border-color:var(--primary); background:rgba(52,211,153,.12); color:var(--primary); }

/* ---------- Colisión con pared ---------- */
.collision-overlay{
  position:fixed; inset:0; background:rgba(127,29,29,.5); display:flex; align-items:center; justify-content:center;
  z-index:1000; padding:18px; animation:fadeInWin .15s ease;
}
.collision-card{
  background:linear-gradient(160deg,#3f1d1d,#7f1d1d); border:2px solid var(--error); border-radius:var(--radius);
  padding:26px; max-width:340px; width:100%; text-align:center; box-shadow:0 30px 60px rgba(0,0,0,.4);
  animation:popWin .2s ease;
}
.collision-card .glyph{ font-size:2rem; }
.collision-card h2{ color:var(--error); font-size:1.25rem; margin:8px 0; }
.collision-card p{ color:var(--text-dim); font-weight:700; margin-bottom:18px; font-size:.9rem; }
.collision-card button{
  padding:12px 24px; border:none; border-radius:12px; background:var(--error); color:#3f1d1d;
  font-family:var(--font-display); font-weight:800; cursor:pointer;
}

.btn{
  display:block; width:100%; margin:0 auto; padding:14px; border:none; border-radius:14px;
  font-family:var(--font-display); font-weight:800; font-size:1.05rem; cursor:pointer;
  transition:var(--transition); color:#062339; background:var(--blue);
  box-shadow:0 4px 14px rgba(56,189,248,.35);
}
.btn:hover{ transform:translateY(-2px); }

/* ---------- Confeti ---------- */
.celebration{ position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden; }
.confetti-piece{ position:absolute; top:-20px; border-radius:2px; animation:fall linear forwards; }
@keyframes fall{ to{ transform:translateY(110vh) rotate(600deg); opacity:.3; } }
</style>
</head>

<div class="wrap">

    </div>
    <div class="card">
      <p class="hint-banner" id="hintBanner">Elige un movimiento y toca los puntos en la grilla.</p>

      <!-- Panel de rotación: aparece tras tocar el centro -->
      <div class="modo-panel" id="rotarPanel" style="display:none;">
        <div class="tipo-row">
          <button class="modo-dir-btn" id="btnRot90" onclick="elegirPasosRotacion(1)"><span class="modo-dir-icon">↻</span>90°</button>
          <button class="modo-dir-btn" id="btnRot180" onclick="elegirPasosRotacion(2)"><span class="modo-dir-icon">↻↻</span>180°</button>
          <button class="modo-dir-btn" id="btnRot270" onclick="elegirPasosRotacion(3)"><span class="modo-dir-icon">↺</span>270°</button>

        <div class="modo-actions">
          <button class="btn-cancelar-modo" onclick="cancelarModo()">Cancelar</button>
          <button class="btn-confirmar-modo" id="btnConfirmarRotar" onclick="confirmarRotar()" disabled>Confirmar rotación</button>
        </div>
      </div>

      <!-- Panel de reflejo/traslado: aparece tras tocar 2 puntos -->
      <div class="modo-panel" id="dosPuntosPanel" style="display:none;">
        <p class="modo-desc" id="dosPuntosDesc">Toca el primer punto.</p>
        <div class="modo-actions">
          <button class="btn-cancelar-modo" onclick="cancelarModo()">Cancelar</button>
          <button class="btn-confirmar-modo" id="btnConfirmarDosPuntos" onclick="confirmarDosPuntos()" disabled>Confirmar</button>
        </div>
      </div>

      <div id="controlesNormales">
        <div class="controls-grid">
          <button class="ctrl-btn" id="btnModoRotar" onclick="entrarModoRotar()"><span class="ctrl-icon">↻</span>Rotar (90°)</button>
          <button class="ctrl-btn" id="btnModoReflejar" onclick="entrarModoReflejar()"><span class="ctrl-icon">⇋</span>Reflejar</button>
          <button class="ctrl-btn" id="btnModoTrasladar" onclick="entrarModoTrasladar()"><span class="ctrl-icon">➜</span>Trasladar</button>

      </div>

    </div>
  </div>

</div>

<script>
/* ============================================================
   MOTOR (validado exhaustivamente antes de integrar aquí)
   ============================================================ */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function rotar90(celdas){ return celdas.map(([r,c]) => [c,-r]); }
function reflejarH_centro(celdas){ return celdas.map(([r,c]) => [r,-c]); }
function trasladar(celdas, dr, dc){ return celdas.map(([r,c]) => [r+dr, c+dc]); }
function normalizar(celdas){
  const minR = Math.min(...celdas.map(c=>c[0]));
  const minC = Math.min(...celdas.map(c=>c[1]));
  return celdas.map(([r,c]) => [r-minR, c-minC]).sort((a,b)=> a[0]-b[0] || a[1]-b[1]);
}
function claveDeForma(celdas){ return normalizar(celdas).map(c => c.join(',')).join('|'); }

function calcularOrientaciones(formaBase){
  const orientaciones = [];
  let base = formaBase;
  for(let rot=0; rot<4; rot++){ orientaciones.push(base); base = rotar90(base); }
  let espejo = reflejarH_centro(formaBase);
  for(let rot=0; rot<4; rot++){ orientaciones.push(espejo); espejo = rotar90(espejo); }
  return orientaciones;
}
function celdasAbsolutasDe(estado, orientaciones){
  return trasladar(orientaciones[estado.orient], estado.pivote[0], estado.pivote[1]);
}
function transformarPorTipo(celdas, tipo, param){
  if(tipo==='H') return celdas.map(([r,c]) => [2*param - r - 1, c]);
  if(tipo==='V') return celdas.map(([r,c]) => [r, 2*param - c - 1]);
  if(tipo==='D+') return celdas.map(([r,c]) => [c+param, r-param]);
  return celdas.map(([r,c]) => [param-1-c, param-1-r]);
}
function orientDeCeldasAbsolutas(celdasAbs, pivoteAbs, orientaciones){
  const relativas = trasladar(celdasAbs, -pivoteAbs[0], -pivoteAbs[1]);
  const clave = claveDeForma(relativas);
  for(let i=0;i<8;i++) if(claveDeForma(orientaciones[i]) === clave) return i;
  return -1;
}
function aplicarRotacion(estado, pasos){
  const esEspejo = estado.orient >= 4;
  const base = esEspejo ? 4 : 0;
  const rotActual = estado.orient - base;
  return { pivote: estado.pivote, orient: base + (rotActual + pasos) % 4 };
}
/** Rota la figura 90° (horario o antihorario) alrededor de un punto
 *  EXTERNO cualquiera (no necesariamente sobre la figura). Validado: el
 *  cambio de orientación es siempre el mismo (+1/-1 paso) sin importar el
 *  centro elegido -- solo cambia a dónde va a parar el pivote. */
/** Un solo paso de 90° horario alrededor de un centro externo (bloque base
 *  ya validado). */
function aplicarRotacionCentro90(estado, centro, horario){
  const [pr, pc] = estado.pivote;
  const [cr, cc] = centro;
  const dr = pr-cr, dc = pc-cc;
  const nuevoPivote = horario ? [cr+dc, cc-dr] : [cr-dc, cc+dr];
  const nuevoOrient = aplicarRotacion(estado, horario?1:3).orient;
  return { pivote: nuevoPivote, orient: nuevoOrient };
}
/** Rota `pasos` veces 90° horario alrededor del mismo centro (pasos=1,2,3
 *  para 90°/180°/270°) -- validado que aplicar 90° tres veces seguidas sobre
 *  el mismo centro da exactamente el mismo resultado que un salto directo
 *  de 270°, así que reutilizar el bloque base es seguro. */
function aplicarRotacionCentro(estado, centro, pasos){
  let resultado = estado;
  for(let i=0;i<pasos;i++) resultado = aplicarRotacionCentro90(resultado, centro, true);
  return resultado;
}
function vecinosRotacionCentro(estado, gridSize){
  const vecinos = [];
  for(let cr=0; cr<=gridSize; cr++) for(let cc=0; cc<=gridSize; cc++){
    for(const pasos of [1,2,3]) vecinos.push(aplicarRotacionCentro(estado, [cr,cc], pasos));
  }
  return vecinos;
}
function aplicarReflejo(estado, tipo, param, orientaciones){
  const absActual = celdasAbsolutasDe(estado, orientaciones);
  const absReflejada = transformarPorTipo(absActual, tipo, param);
  const idxPivoteEnLista = orientaciones[estado.orient].findIndex(([r,c])=>r===0&&c===0);
  const nuevoPivote = absReflejada[idxPivoteEnLista];
  const nuevoOrient = orientDeCeldasAbsolutas(absReflejada, nuevoPivote, orientaciones);
  return { pivote: nuevoPivote, orient: nuevoOrient };
}
function precalcularReflejos(orientaciones){
  // El orient resultante depende TANTO del tipo de línea como de la
  // orientación de partida -- no es constante por tipo, hay que calcular
  // la tabla completa (4 tipos x 8 orientaciones de partida).
  const tabla = {};
  for(const tipo of ['H','V','D+','D-']){
    tabla[tipo] = [];
    for(let origen=0; origen<8; origen++){
      const estadoRef = { pivote:[0,0], orient:origen };
      tabla[tipo][origen] = aplicarReflejo(estadoRef, tipo, 0, orientaciones).orient;
    }
  }
  return tabla;
}
function celdasChocanConParedes(celdas, paredes){
  if(!paredes || !paredes.length) return false;
  const setParedes = new Set(paredes.map(([r,c])=>r+','+c));
  return celdas.some(([r,c]) => setParedes.has(r+','+c));
}
function dentroDeGrilla(celdas, gridSize){
  return celdas.every(([r,c]) => r>=0&&r<gridSize&&c>=0&&c<gridSize);
}
function vecinosReflejo(estado, gridSize, orientPorTipo){
  const [pr, pc] = estado.pivote;
  const o = estado.orient;
  const vecinos = [];
  for(let r=0;r<gridSize;r++) if(r!==pr) vecinos.push({ pivote:[r,pc], orient:orientPorTipo['H'][o] });
  for(let c=0;c<gridSize;c++) if(c!==pc) vecinos.push({ pivote:[pr,c], orient:orientPorTipo['V'][o] });
  const sumaFija = pr+pc;
  for(let r=0;r<gridSize;r++){ const c = sumaFija-r; if(c>=0&&c<gridSize&&(r!==pr||c!==pc)) vecinos.push({ pivote:[r,c], orient:orientPorTipo['D+'][o] }); }
  const restaFija = pr-pc;
  for(let r=0;r<gridSize;r++){ const c = r-restaFija; if(c>=0&&c<gridSize&&(r!==pr||c!==pc)) vecinos.push({ pivote:[r,c], orient:orientPorTipo['D-'][o] }); }
  return vecinos;
}
function bfsAlcanzabilidad(estadoInicial, gridSize, orientaciones, permitidos, paredes){
  const orientPorTipo = precalcularReflejos(orientaciones);
  const clave = e => e.pivote[0]+','+e.pivote[1]+','+e.orient;
  const dist = new Map();
  const cabe = e => {
    const abs = celdasAbsolutasDe(e, orientaciones);
    return dentroDeGrilla(abs, gridSize) && !celdasChocanConParedes(abs, paredes);
  };
  if(!cabe(estadoInicial)) return dist;
  dist.set(clave(estadoInicial), 0);
  let frontera = [estadoInicial];
  while(frontera.length){
    const siguiente = [];
    for(const actual of frontera){
      const dActual = dist.get(clave(actual));
      const vecinos = [];
      if(permitidos.rotar) vecinos.push(...vecinosRotacionCentro(actual, gridSize));
      if(permitidos.trasladar){
        for(let r=0;r<gridSize;r++) for(let c=0;c<gridSize;c++){
          if(r!==actual.pivote[0] || c!==actual.pivote[1]) vecinos.push({ pivote:[r,c], orient:actual.orient });
        }
      }
      if(permitidos.reflejar) vecinos.push(...vecinosReflejo(actual, gridSize, orientPorTipo));
      for(const v of vecinos){
        if(!cabe(v)) continue;
        const k = clave(v);
        if(!dist.has(k)){ dist.set(k, dActual+1); siguiente.push(v); }
      }
    }
    frontera = siguiente;
  }
  return dist;
}

const FORMAS = {
  F:      [[-1,0],[-1,1],[0,-1],[0,0],[1,0]],
  N:      [[-1,0],[0,0],[1,-1],[1,0],[2,-1]],
  Y:      [[-1,0],[0,-1],[0,0],[1,0],[2,0]],
  gancho: [[0,0],[0,1],[0,2],[1,2],[2,2],[2,1]],
};

function generarParedes(gridSize, cantidad, evitarCeldas){
  const evitar = new Set(evitarCeldas.map(([r,c])=>r+','+c));
  const paredes = [];
  let intentos = 0;
  while(paredes.length < cantidad && intentos < 500){
    intentos++;
    const r = randInt(2, gridSize-3), c = randInt(2, gridSize-3);
    const clave = r+','+c;
    if(evitar.has(clave)) continue;
    if(paredes.some(([pr,pc])=>pr===r&&pc===c)) continue;
    paredes.push([r,c]);
  }
  return paredes;
}

/** Genera un nivel completo. `permitidos` define qué movimientos están
 *  disponibles; `conParedes` activa la generación de obstáculos. */
function generarNivel(gridSize, permitidos, conParedes){
  for(let intento=0; intento<25; intento++){
    const nombres = Object.keys(FORMAS);
    const nombreForma = nombres[randInt(0,nombres.length-1)];
    const forma = FORMAS[nombreForma];
    const orientaciones = calcularOrientaciones(forma);

    const inicio = { pivote:[randInt(3, gridSize-4), randInt(3, gridSize-4)], orient:0 };
    const celdasInicio = celdasAbsolutasDe(inicio, orientaciones);
    if(!dentroDeGrilla(celdasInicio, gridSize)) continue;
    const setCeldasInicio = new Set(celdasInicio.map(([r,c])=>r+','+c));

    const paredes = conParedes ? generarParedes(gridSize, randInt(10,18), celdasInicio) : [];

    const dist = bfsAlcanzabilidad(inicio, gridSize, orientaciones, permitidos, paredes);
    const candidatos = [...dist.entries()].filter(([k,par]) => {
      if(par < 1) return false;
      const [r,c,orient] = k.split(',').map(Number);
      const celdas = celdasAbsolutasDe({pivote:[r,c],orient}, orientaciones);
      return !celdas.some(([r2,c2]) => setCeldasInicio.has(r2+','+c2));
    });
    if(!candidatos.length) continue;

    const conVarios = candidatos.filter(([k,par]) => par >= 2);
    const pool = conVarios.length ? conVarios : candidatos;
    const [claveElegida, par] = pool[randInt(0, pool.length-1)];
    const [r,c,orient] = claveElegida.split(',').map(Number);
    const objetivo = { pivote:[r,c], orient };
    const celdasObjetivo = celdasAbsolutasDe(objetivo, orientaciones);

    return { nombreForma, forma, orientaciones, estadoInicial: inicio, celdasObjetivo, gridSize, par, paredes };
  }
  return null;
}

/* ============================================================
   INICIO
   ============================================================ */
function startGame(nivel){
  document.querySelectorAll('.level-btn').forEach(b => b.disabled = true);
  document.getElementById('loadingMsg').classList.add('show');

  setTimeout(() => {
    App.nivelActual = nivel;
    const cfg = LEVEL_CONFIG[nivel];
    let permitidos = cfg.permitidos;
    if(nivel === 'intermedio'){
      const tipos = ['rotar','reflejar','trasladar'];
      const faltante = tipos[randInt(0,2)];
      permitidos = { rotar:true, reflejar:true, trasladar:true };
      permitidos[faltante] = false;
      App.movimientoFaltante = faltante;
    } else {
      App.movimientoFaltante = null;
    }

    const resultado = generarNivel(cfg.gridSize, permitidos, cfg.paredes);

    App.gridSize = cfg.gridSize;
    App.forma = resultado.forma;
    App.orientaciones = resultado.orientaciones;
    App.orientPorTipo = precalcularReflejos(App.orientaciones);
    App.estado = { pivote: resultado.estadoInicial.pivote.slice(), orient: resultado.estadoInicial.orient };
    App.estadoInicial = { pivote: resultado.estadoInicial.pivote.slice(), orient: resultado.estadoInicial.orient };
    App.celdasObjetivo = resultado.celdasObjetivo;
    App.par = resultado.par;
    App.paredes = resultado.paredes;
    App.movimientos = 0;
    App.solved = false;
    App.permitidos = permitidos;
    App.modo = null;
    App.puntos = [];
    App.pasosRotacion = null;
    App.resultadoPendiente = null;

    document.getElementById('moveCount').textContent = '0';
    document.getElementById('parValue').textContent = App.par;
    document.getElementById('winModalRoot').innerHTML = '';
    document.getElementById('collisionModalRoot').innerHTML = '';

    actualizarControlesSegunPermitidos();
    actualizarHint();
    buildBoard();
    renderBoard(false);

    document.querySelectorAll('.level-btn').forEach(b => b.disabled = false);
    document.getElementById('loadingMsg').classList.remove('show');
    switchScreen('screen-game');
  }, 30);
}

function actualizarControlesSegunPermitidos(){
  document.getElementById('btnModoRotar').classList.toggle('blocked', !App.permitidos.rotar);
  document.getElementById('btnModoReflejar').classList.toggle('blocked', !App.permitidos.reflejar);
  document.getElementById('btnModoTrasladar').classList.toggle('blocked', !App.permitidos.trasladar);
}

function actualizarHint(){
  const hint = document.getElementById('hintBanner');
  if(App.movimientoFaltante){
    hint.textContent = 'Este desafío no permite ' + NOMBRES_MOVIMIENTO[App.movimientoFaltante] + '. Usa los otros dos movimientos.';
    hint.classList.add('warn');
  } else if(App.paredes && App.paredes.length){
    hint.textContent = 'Hay paredes en el camino — si tu figura las toca, se destruye y debes reintentar.';
    hint.classList.add('warn');
  } else {
    hint.textContent = 'Elige un movimiento y toca los puntos en la grilla.';
    hint.classList.remove('warn');
  }
}

/* ============================================================
   TABLERO (SVG)
   ============================================================ */
function buildBoard(){
  const svg = document.getElementById('boardSvg');
  const size = App.gridSize * CELL;
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  svg.innerHTML = '';

  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  defs.innerHTML = `<marker id="flechaVector" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
    <polygon points="0 0, 8 3.5, 0 7" fill="var(--pink)"/>
  </marker>`;
  svg.appendChild(defs);

  const gGrid = document.createElementNS('http://www.w3.org/2000/svg','g');
  for(let i=0;i<=App.gridSize;i++){
    const l1 = document.createElementNS('http://www.w3.org/2000/svg','line');
    l1.setAttribute('class','grid-line'); l1.setAttribute('x1',i*CELL); l1.setAttribute('y1',0); l1.setAttribute('x2',i*CELL); l1.setAttribute('y2',size);
    gGrid.appendChild(l1);
    const l2 = document.createElementNS('http://www.w3.org/2000/svg','line');
    l2.setAttribute('class','grid-line'); l2.setAttribute('x1',0); l2.setAttribute('y1',i*CELL); l2.setAttribute('x2',size); l2.setAttribute('y2',i*CELL);
    gGrid.appendChild(l2);
  }
  const border = document.createElementNS('http://www.w3.org/2000/svg','rect');
  border.setAttribute('class','grid-border'); border.setAttribute('x',0); border.setAttribute('y',0);
  border.setAttribute('width',size); border.setAttribute('height',size);
  gGrid.appendChild(border);
  svg.appendChild(gGrid);

  const gWalls = document.createElementNS('http://www.w3.org/2000/svg','g'); gWalls.id = 'gWalls';
  App.paredes.forEach(([r,c]) => {
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('class','wall-cell');
    rect.setAttribute('x', c*CELL+1); rect.setAttribute('y', r*CELL+1);
    rect.setAttribute('width', CELL-2); rect.setAttribute('height', CELL-2);
    gWalls.appendChild(rect);
  });
  svg.appendChild(gWalls);

  const gTarget = document.createElementNS('http://www.w3.org/2000/svg','g'); gTarget.id = 'gTarget';
  svg.appendChild(gTarget);
  const gGuia = document.createElementNS('http://www.w3.org/2000/svg','g'); gGuia.id = 'gGuia'; // eje / vector / arco
  svg.appendChild(gGuia);
  const gPreview = document.createElementNS('http://www.w3.org/2000/svg','g'); gPreview.id = 'gPreview';
  svg.appendChild(gPreview);
  const gShape = document.createElementNS('http://www.w3.org/2000/svg','g'); gShape.id = 'gShape';
  svg.appendChild(gShape);
  const gVertices = document.createElementNS('http://www.w3.org/2000/svg','g'); gVertices.id = 'gVertices';
  svg.appendChild(gVertices);

  attachTapHandler(svg);
}

function estadoCoincide(){
  const abs = celdasActuales();
  return mismasCeldasAbsolutas(abs, App.celdasObjetivo);
}
function mismasCeldasAbsolutas(a, b){
  const claveA = a.map(c=>c.join(',')).sort().join('|');
  const claveB = b.map(c=>c.join(',')).sort().join('|');
  return claveA === claveB;
}

function renderBoard(verificar){
  const gTarget = document.getElementById('gTarget');
  const gShape = document.getElementById('gShape');
  gTarget.innerHTML = ''; gShape.innerHTML = '';

  const absActual = celdasActuales();
  const coincide = estadoCoincide();

  App.celdasObjetivo.forEach(([r,c]) => {
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('class','target-cell');
    rect.setAttribute('x', c*CELL+2); rect.setAttribute('y', r*CELL+2);
    rect.setAttribute('width', CELL-4); rect.setAttribute('height', CELL-4);
    rect.setAttribute('rx', 6);
    gTarget.appendChild(rect);
  });

  absActual.forEach(([r,c]) => {
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('class','shape-cell' + (coincide ? ' matched' : ''));
    rect.setAttribute('x', c*CELL+3); rect.setAttribute('y', r*CELL+3);
    rect.setAttribute('width', CELL-6); rect.setAttribute('height', CELL-6);
    rect.setAttribute('rx', 6);
    gShape.appendChild(rect);
  });

  if(verificar && coincide && !App.solved){
    App.solved = true;
    setTimeout(() => mostrarFinal(), 350);
  }
}

   MODOS: seleccionar puntos por toque en la grilla

  if(App.solved || !App.permitidos.rotar) return;
  App.modo = 'rotar';
  App.puntos = [];

}

/** Puntos válidos como "segundo punto" del eje de reflexión: misma fila,
 *  misma columna, o diagonal a 45° respecto del primer punto. */
function segundosPuntosValidos(p1){
  const [r1,c1] = p1;
  const validos = [];
  for(let r=0;r<=App.gridSize;r++) for(let c=0;c<=App.gridSize;c++){
    if(r===r1 && c===c1) continue;
    if(r===r1 || c===c1 || Math.abs(r-r1)===Math.abs(c-c1)) validos.push([r,c]);
  }
  return validos;
}

function pintarVerticesCandidatos(){
  const gVertices = document.getElementById('gVertices');
  gVertices.innerHTML = '';

  let candidatos;
  if(App.modo === 'rotar'){
    candidatos = App.puntos.length === 0 ? todosLosVertices() : [];
  } else if(App.modo === 'reflejar'){
    candidatos = App.puntos.length === 0 ? todosLosVertices() : segundosPuntosValidos(App.puntos[0]);
  } else { // trasladar
    candidatos = App.puntos.length < 2 ? todosLosVertices() : [];
  }

  candidatos.forEach(([r,c]) => {
    const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('class','vertice-candidato');
    dot.setAttribute('cx', c*CELL); dot.setAttribute('cy', r*CELL); dot.setAttribute('r', 7);
    dot.addEventListener('click', () => onVerticeTocado(r,c));
    gVertices.appendChild(dot);
  });

  App.puntos.forEach(([r,c]) => {
    const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('class','punto-elegido');
    dot.setAttribute('cx', c*CELL); dot.setAttribute('cy', r*CELL); dot.setAttribute('r', 8);
    gVertices.appendChild(dot);
  });
}
function todosLosVertices(){
  const v = [];
  for(let r=0;r<=App.gridSize;r++) for(let c=0;c<=App.gridSize;c++) v.push([r,c]);
  return v;
}

function attachTapHandler(svg){
  // El toque de vértices se maneja directamente en cada círculo candidato
  // (pintados por pintarVerticesCandidatos); acá no hace falta nada extra.
}

function onVerticeTocado(r,c){
  if(App.modo === 'rotar'){
    App.puntos = [[r,c]];
    pintarVerticesCandidatos();
    document.getElementById('rotarPanel').style.display = 'block';
    document.getElementById('hintBanner').textContent = 'Elige el sentido de rotación.';
    document.getElementById('btnConfirmarRotar').disabled = true;
  } else {
    App.puntos.push([r,c]);
    pintarVerticesCandidatos();
    if(App.puntos.length === 1){
      document.getElementById('dosPuntosDesc').textContent = App.modo === 'reflejar'
        ? 'Toca el segundo punto del eje (resaltados en rosado).'
        : 'Toca el punto de destino del vector.';
    } else {
      actualizarVistaPreviaDosPuntos();
      document.getElementById('btnConfirmarDosPuntos').disabled = false;
      document.getElementById('dosPuntosDesc').textContent = '¿Confirmar este movimiento?';
    }
  }
}

function elegirPasosRotacion(pasos){
  App.pasosRotacion = pasos;
  document.getElementById('btnRot90').classList.toggle('activo', pasos===1);
  document.getElementById('btnRot180').classList.toggle('activo', pasos===2);
  document.getElementById('btnRot270').classList.toggle('activo', pasos===3);
  document.getElementById('btnConfirmarRotar').disabled = false;
  actualizarVistaPreviaRotar();
}

function pintarLinea(clase, x1,y1,x2,y2){
  const gGuia = document.getElementById('gGuia');
  const line = document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('class', clase);
  line.setAttribute('x1',x1); line.setAttribute('y1',y1); line.setAttribute('x2',x2); line.setAttribute('y2',y2);
  gGuia.appendChild(line);
}
function pintarPreview(celdas){
  const gPreview = document.getElementById('gPreview');
  gPreview.innerHTML = '';
  if(App.nivelActual !== 'facil') return; // en Intermedio y Difícil, el estudiante debe imaginar el resultado
  const choca = celdasChocanConParedes(celdas, App.paredes);
  celdas.forEach(([r,c]) => {
    if(r<0||c<0||r>=App.gridSize||c>=App.gridSize) return;
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('class','reflect-preview');
    rect.setAttribute('x', c*CELL+3); rect.setAttribute('y', r*CELL+3);
    rect.setAttribute('width', CELL-6); rect.setAttribute('height', CELL-6);
    rect.setAttribute('rx', 6);
    if(choca) rect.style.stroke = 'var(--error)';
    gPreview.appendChild(rect);
  });
}

function actualizarVistaPreviaRotar(){
  document.getElementById('gGuia').innerHTML = '';
  if(App.pasosRotacion === null || App.puntos.length === 0) return;
  const centro = App.puntos[0];
  const nuevoEstado = aplicarRotacionCentro(App.estado, centro, App.pasosRotacion);
  const celdas = trasladar(App.orientaciones[nuevoEstado.orient], nuevoEstado.pivote[0], nuevoEstado.pivote[1]);
  pintarPreview(celdas);
  // arco decorativo alrededor del centro
  const gGuia = document.getElementById('gGuia');
  const circ = document.createElementNS('http://www.w3.org/2000/svg','circle');
  circ.setAttribute('class','arco-rotacion');
  circ.setAttribute('cx', centro[1]*CELL); circ.setAttribute('cy', centro[0]*CELL); circ.setAttribute('r', CELL*1.2);
  gGuia.appendChild(circ);
}

function actualizarVistaPreviaDosPuntos(){
  document.getElementById('gGuia').innerHTML = '';
  const [p1, p2] = App.puntos;
  if(App.modo === 'reflejar'){
    const { tipo, param } = tipoYParamDeLineaEntre(p1, p2);
    // Reutiliza aplicarReflejo, la MISMA función ya validada (300/300 casos
    // contra fuerza bruta) que usa el motor -- nunca reinventar la fórmula.
    const resultado = aplicarReflejo(App.estado, tipo, param, App.orientaciones);
    const celdas = trasladar(App.orientaciones[resultado.orient], resultado.pivote[0], resultado.pivote[1]);
    pintarPreview(celdas);
    pintarLinea('eje-linea', p1[1]*CELL, p1[0]*CELL, p2[1]*CELL, p2[0]*CELL);
    App.resultadoPendiente = resultado;
  } else { // trasladar
    const dr = p2[0]-p1[0], dc = p2[1]-p1[1];
    const nuevoPivote = [App.estado.pivote[0]+dr, App.estado.pivote[1]+dc];
    const celdas = trasladar(App.orientaciones[App.estado.orient], nuevoPivote[0], nuevoPivote[1]);
    pintarPreview(celdas);
    pintarLinea('vector-linea', p1[1]*CELL, p1[0]*CELL, p2[1]*CELL, p2[0]*CELL);
    App.resultadoPendiente = { pivote: nuevoPivote, orient: App.estado.orient };
  }
}

/** Traduce los dos vértices tocados al (tipo, param) que espera
 *  aplicarReflejo. Los vértices están en coordenadas de vértice (bordes de
 *  grilla), que es EXACTAMENTE la convención de "param" que ya usa el motor
 *  (ej: k=3 es el borde entre la celda 2 y la celda 3) -- se pasan directo. */
function tipoYParamDeLineaEntre(p1, p2){
  const [r1,c1] = p1, [r2,c2] = p2;
  if(r1===r2) return { tipo:'H', param:r1 };
  if(c1===c2) return { tipo:'V', param:c1 };
  if(r1-c1 === r2-c2) return { tipo:'D+', param:r1-c1 };
  return { tipo:'D-', param:r1+c1+1 };
}

function confirmarRotar(){
  if(App.pasosRotacion === null) return;
  const centro = App.puntos[0];
  const pasos = App.pasosRotacion;
  const estadoInicial = App.estado;
  const nuevoEstado = aplicarRotacionCentro(App.estado, centro, pasos);
  const celdas = trasladar(App.orientaciones[nuevoEstado.orient], nuevoEstado.pivote[0], nuevoEstado.pivote[1]);
  cancelarModo();
  if(celdasChocanConParedes(celdas, App.paredes)){ mostrarColision(); return; }
  animarRotacion(estadoInicial, centro, pasos, () => finalizarMovimiento(nuevoEstado));
}

function confirmarDosPuntos(){
  const resultado = App.resultadoPendiente;
  if(!resultado) return;
  const modo = App.modo;
  const [p1, p2] = App.puntos;
  const estadoInicial = App.estado;
  const celdas = trasladar(App.orientaciones[resultado.orient], resultado.pivote[0], resultado.pivote[1]);
  if(!dentroDeGrilla(celdas, App.gridSize)){ cancelarModo(); return; }
  cancelarModo();
  if(celdasChocanConParedes(celdas, App.paredes)){ mostrarColision(); return; }
  if(modo === 'trasladar'){
    animarTraslacion(estadoInicial, resultado, () => finalizarMovimiento(resultado));
  } else {
    animarReflejo(estadoInicial, p1, p2, () => finalizarMovimiento(resultado));
  }
}

function finalizarMovimiento(nuevoEstado){
  App.estado = nuevoEstado;
  App.movimientos++;
  document.getElementById('moveCount').textContent = App.movimientos;
  renderBoard(true);
}

/* ============================================================
   ANIMACIÓN: la figura se desplaza visiblemente por el camino,
   nunca desaparece de un lado y reaparece en el otro.
   ============================================================ */
function easeInOutCubic(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }

/** Dibuja la figura en coordenadas de celda posiblemente fraccionarias
 *  (usadas solo durante la animación; el estado real de la app no cambia
 *  hasta que la animación termina). */
function dibujarFiguraAnimada(celdas){
  const gShape = document.getElementById('gShape');
  gShape.innerHTML = '';
  celdas.forEach(([r,c]) => {
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('class','shape-cell');
    rect.setAttribute('x', c*CELL+3); rect.setAttribute('y', r*CELL+3);
    rect.setAttribute('width', CELL-6); rect.setAttribute('height', CELL-6);
    rect.setAttribute('rx', 6);
    gShape.appendChild(rect);
  });
}

function animarTraslacion(estadoInicial, estadoFinal, callback){
  const duracion = 450;
  const t0 = performance.now();
  const celdasRelativas = App.orientaciones[estadoInicial.orient];
  function frame(now){
    const t = Math.min(1, (now-t0)/duracion);
    const eased = easeInOutCubic(t);
    const pr = estadoInicial.pivote[0] + (estadoFinal.pivote[0]-estadoInicial.pivote[0])*eased;
    const pc = estadoInicial.pivote[1] + (estadoFinal.pivote[1]-estadoInicial.pivote[1])*eased;
    dibujarFiguraAnimada(celdasRelativas.map(([r,c]) => [r+pr, c+pc]));
    if(t<1) requestAnimationFrame(frame); else callback();
  }
  requestAnimationFrame(frame);
}

/** Rotación animada en arco real alrededor del centro (fórmula continua,
 *  validada: coincide exacto con la discreta al llegar a 90°). El ángulo
 *  visual de la animación es el camino MÁS CORTO (270° se anima como -90°,
 *  antihorario), aunque el estado final coincida con 270° horario. */
function animarRotacion(estadoInicial, centro, pasos, callback){
  const anguloObjetivo = pasos===1 ? Math.PI/2 : pasos===2 ? Math.PI : -Math.PI/2;
  const duracion = 550;
  const t0 = performance.now();
  const celdasBaseAbs = trasladar(App.orientaciones[estadoInicial.orient], estadoInicial.pivote[0], estadoInicial.pivote[1]);
  const [cr, cc] = centro;
  function frame(now){
    const t = Math.min(1, (now-t0)/duracion);
    const eased = easeInOutCubic(t);
    const angulo = anguloObjetivo * eased;
    const cosA = Math.cos(angulo), sinA = Math.sin(angulo);
    const celdas = celdasBaseAbs.map(([r,c]) => {
      const cy = r+0.5, cx = c+0.5; // centro visual de la celda
      const dy = cy-cr, dx = cx-cc;
      const ndy = dy*cosA + dx*sinA, ndx = dx*cosA - dy*sinA;
      return [cr+ndy-0.5, cc+ndx-0.5];
    });
    dibujarFiguraAnimada(celdas);
    if(t<1) requestAnimationFrame(frame); else callback();
  }
  requestAnimationFrame(frame);
}

/** Reflejo animado como "volteo": la figura se escala a 0 y se expande al
 *  otro lado del eje, igual que voltear una carta -- la reflexión no es un
 *  movimiento rígido real dentro del plano, así que esta es la forma
 *  habitual de representarla visualmente sin que la figura desaparezca. */
function animarReflejo(estadoInicial, p1, p2, callback){
  const duracion = 550;
  const t0 = performance.now();
  const anguloEje = Math.atan2((p2[0]-p1[0])*CELL, (p2[1]-p1[1])*CELL) * 180/Math.PI;
  const origenX = p1[1]*CELL, origenY = p1[0]*CELL;
  const gShape = document.getElementById('gShape');
  dibujarFiguraAnimada(trasladar(App.orientaciones[estadoInicial.orient], estadoInicial.pivote[0], estadoInicial.pivote[1]));
  function frame(now){
    const t = Math.min(1, (now-t0)/duracion);
    const eased = easeInOutCubic(t);
    const escala = 1 - 2*eased;
    gShape.setAttribute('transform', `translate(${origenX} ${origenY}) rotate(${anguloEje}) scale(1 ${escala}) rotate(${-anguloEje}) translate(${-origenX} ${-origenY})`);
    if(t<1) requestAnimationFrame(frame);
    else { gShape.removeAttribute('transform'); callback(); }
  }
  requestAnimationFrame(frame);
}

/* ============================================================
   COLISIÓN CON PARED: destruye el intento, hay que reintentar
   ============================================================ */
function mostrarColision(){
  const root = document.getElementById('collisionModalRoot');
  root.innerHTML = `
    <div class="collision-overlay">
      <div class="collision-card">
        <div class="glyph">💥</div>
        <h2>¡Chocaste con una pared!</h2>
        <p>Tu figura se destruyó. Vuelve a intentarlo desde el inicio.</p>
        <button id="btnReintentarColision">Reintentar</button>
      </div>
    </div>
  `;
  document.getElementById('btnReintentarColision').onclick = () => {
    document.getElementById('collisionModalRoot').innerHTML = '';
    reintentarNivel();
  };
}

/* ============================================================
   FINALIZACIÓN
   ============================================================ */
function reintentarNivel(){
  App.estado = { pivote: App.estadoInicial.pivote.slice(), orient: App.estadoInicial.orient };
  App.movimientos = 0;
  App.solved = false;
  document.getElementById('moveCount').textContent = '0';
  document.getElementById('winModalRoot').innerHTML = '';
  cancelarModo();
  renderBoard(false);
}

function mostrarFinal(){
  const msg = App.movimientos <= App.par
    ? '¡Lo lograste en ' + App.movimientos + (App.movimientos===1?' movimiento':' movimientos') + ' — igual o mejor que el par!'
    : 'Lo lograste en ' + App.movimientos + ' movimientos (el par era ' + App.par + '). ¡Inténtalo de nuevo para mejorarlo!';

  const root = document.getElementById('winModalRoot');
  root.innerHTML = `
    <div class="win-overlay">
      <div class="win-card">
        <span class="star-burst">⭐</span>
        <h2>¡Calzó perfecto!</h2>
        <p>${msg}</p>
        <div class="win-actions-row">
          <button class="win-btn-icon" id="btnSiguiente" title="Siguiente">
            <span class="win-btn-icon-glyph">➜</span><span class="win-btn-icon-label">Siguiente</span>
          </button>
          <button class="win-btn-icon" id="btnVolverInicio" title="Volver al inicio">
            <span class="win-btn-icon-glyph">🏠</span><span class="win-btn-icon-label">Inicio</span>
          </button>
          <button class="win-btn-icon" id="btnReintentar" title="Reintentar">
            <span class="win-btn-icon-glyph">↻</span><span class="win-btn-icon-label">Reintentar</span>
          </button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('btnSiguiente').onclick = () => { root.innerHTML=''; startGame(App.nivelActual); };
  document.getElementById('btnVolverInicio').onclick = () => { root.innerHTML=''; goHome(); };
  document.getElementById('btnReintentar').onclick = () => { reintentarNivel(); };
  triggerCelebration();
}

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
function switchScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top:0, behavior:'smooth' });
}
function goHome(){ cancelarModo(); switchScreen('screen-home'); }

/* ============================================================
   CELEBRACIÓN
   ============================================================ */
function triggerCelebration(){
  const container = document.getElementById('celebration');
  const colors = ['#34d399','#38bdf8','#fbbf24','#f472b6','#a78bfa'];
  for(let i=0;i<28;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    const size = 6 + Math.random()*6;
    piece.style.width = size+'px';
    piece.style.height = (size*0.4)+'px';
    piece.style.left = Math.random()*100+'%';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration = (1.6 + Math.random()*1.2)+'s';
    piece.style.animationDelay = (Math.random()*0.3)+'s';
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 3200);
  }
}
</script>
