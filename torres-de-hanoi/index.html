<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Torres de Hanoi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{ color-scheme:dark; --bg-1:#1e1147; --bg-2:#3b1785; --bg-3:#5b21b6; --text:#f6f3ff; --text-dim:#c9bdf0; --accent:#fbbf24; --primary:#34d399; --error:#fb7185;
  --font-display:'Baloo 2',system-ui,sans-serif; --font-body:'Nunito',system-ui,sans-serif; }
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden;color:var(--text);font-family:var(--font-body);min-height:100vh;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 15% 0%,var(--bg-3),transparent 55%),radial-gradient(circle at 85% 100%,#2a0f66,transparent 55%),linear-gradient(160deg,var(--bg-1),var(--bg-2));background-attachment:fixed}
button{font-family:inherit}
.hidden{display:none !important}
.screen{display:none;flex-direction:column;align-items:center;position:relative;z-index:1}
.screen.active{display:flex}
#app{width:100%;max-width:900px;margin:0 auto;padding:clamp(10px,2.5vw,24px);display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column}
.card{width:100%;position:relative;max-width:980px;margin:0 auto;padding:6px 10px}
.home-title{text-align:center;font-family:var(--font-display);font-weight:800;margin:0 0 6px;line-height:1.1}
.items-sub{text-align:center;color:#c9bdf0;font-size:.92rem;margin:2px 0 6px;text-wrap:balance}
.mv-pregunta{text-align:center;text-wrap:balance;font-family:var(--font-display);font-size:1.25rem;margin:6px 0 2px}
.icon-btn{display:inline-flex;align-items:center;cursor:pointer}
.mv-fila-chip{margin-top:30px}
.mv-atras-home{position:absolute;left:6px;top:6px;z-index:5}
.mv-casa-home{position:absolute;right:6px;top:6px;z-index:5}
.mv-niveles.mv-p3.mv-lv{aspect-ratio:100/90}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n1{--x:7;--y:53;--w:34}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n2{--x:50;--y:48;--w:41}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n3{--x:27;--y:1;--w:47}
@media (min-width:700px){.mv-niveles.mv-p3.mv-lv{aspect-ratio:100/40}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n1{--x:10;--y:13;--w:22}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n2{--x:37;--y:8;--w:26}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n3{--x:66;--y:2;--w:31}}
.mv-nivel .ico{width:46%;height:auto;position:relative;z-index:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.mv-universo .mv-home .home-title{padding:0 48px}
@media (min-width:900px) and (orientation:landscape){.mv-universo .mv-home .home-title{padding:0}}
/* ---- pantalla de juego ---- */
#screen-juego{align-items:stretch;width:100%}
body.en-juego{overflow:hidden;height:100dvh;min-height:0}
body.en-juego #screen-juego{height:100dvh}
.app-header.app-topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:none;width:100%;max-width:900px;margin:0 auto;padding:2px 10px 0;flex-wrap:nowrap}
.app-topbar .side{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.app-topbar .icon-btn.btn-orbita{font-size:.92rem}
.mv-universo .app-header.app-topbar .mv-av{width:clamp(56px,14vw,84px);height:clamp(56px,14vw,84px)}
#mvCelebra{position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:99990;pointer-events:none;opacity:0;width:min(86vw,300px)}
#mvCelebra.on{animation:mvCelPop 1.6s ease both}
@keyframes mvCelPop{0%{opacity:0;transform:translateX(-50%) scale(.55)}14%{opacity:1;transform:translateX(-50%) scale(1.1)}24%{transform:translateX(-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}
#mvCelebra .mv-info{display:none}
.cuerpo{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:760px;margin:0 auto;padding:2px 12px 12px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex:none}
.chip{padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(196,181,253,.4);font-family:var(--font-display);font-weight:800;font-size:1rem}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#stage > svg{width:100%;height:100%;max-height:100%;overflow:visible}
.msg{flex:none;min-height:2.7em;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:clamp(1rem,.85rem + .7vw,1.3rem);line-height:1.25;text-wrap:balance;max-width:640px}
.msg.mal{color:#fda4af}.msg.bien{color:#6ee7b7}.msg.pista{color:#fde68a}
.fila{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;flex:none}
.btn-orbita.ancho{font-size:1.15rem;padding-right:2em}
.btn-orbita[disabled]{opacity:.45;pointer-events:none;filter:grayscale(.5)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .32s}


.disc{transition:transform .3s cubic-bezier(.3,.85,.3,1);pointer-events:none}
.disc text{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:17px;fill:#fff;stroke:rgba(0,0,0,.45);stroke-width:3px;paint-order:stroke;text-anchor:middle;dominant-baseline:central}
.disc.sel rect{filter:drop-shadow(0 0 10px #fde68a)}
.poste{fill:#e9d5ff;opacity:.85;transition:fill .2s}
.poste.ok{fill:#6ee7b7;filter:drop-shadow(0 0 8px #34d399)}
.poste.meta{filter:drop-shadow(0 0 7px #fbbf24)}
.zona{fill:transparent;cursor:pointer}
.etq-torre{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:19px;fill:#fff;text-anchor:middle}
.etq-meta{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;fill:#fde68a;text-anchor:middle}

<button type="button" class="level-btn mv-nivel n1" onclick="empezar(3)" aria-label="Fácil, 3 discos"><span class="fondo"></span><svg class="ico" viewBox="0 0 100 100" aria-hidden="true"><rect x="46" y="8" width="8" height="82" rx="4" fill="#e9d5ff" opacity=".9"/><rect x="39.0" y="46.0" width="22.0" height="12" rx="6" fill="#f87171" stroke="rgba(0,0,0,.35)" stroke-width="1.2"/><rect x="23.0" y="61.0" width="54.0" height="12" rx="6" fill="#fb923c" stroke="rgba(0,0,0,.35)" stroke-width="1.2"/><rect x="7.0" y="76.0" width="86.0" height="12" rx="6" fill="#fbbf24" stroke="rgba(0,0,0,.35)" stroke-width="1.2"/><rect x="10" y="88" width="80" height="7" rx="3.5" fill="#fff" opacity=".85"/></svg><span class="t">Fácil</span></button><button type="button" class="level-btn mv-nivel n2" onclick="empezar(4)" aria-label="Medio, 4 discos"><span class="fondo"></span><svg class="ico" viewBox="0 0 100 100" aria-hidden="true"><rect x="46" y="8" width="8" height="82" rx="4" fill="#e9d5ff" opacity=".9"/><rect x="39.0" y="31.0" width="22.0" height="12" rx="6" fill="#f87171" stroke="rgba(0,0,0,.35)" stroke-width="1.2"/><rect x="28.3" y="46.0" width="43.3" height="12" rx="6" fill="#fb923c" stroke="rgba(0,0,0,.35)" stroke-width="1.2"/><rect x="17.7" y="61.0" width="64.7" height="12" rx="6" fill="#fbbf24" stroke="rgba(0,0,0,.35)" stroke-width="1.2"/><rect x="7.0" y="76.0" width="86.0" height="12" rx="6" fill="#34d399" stroke="rgba(0,0,0,.35)" stroke-width="1.2"/><rect x="10" y="88" width="80" height="7" rx="3.5" fill="#fff" opacity=".85"/></svg><span class="t">Medio</span></button><button type="button" class="level-btn mv-nivel n3" onclick="empezar(5)" aria-label="Difícil, 5 discos"><span class="fondo"></span><svg class="ico" viewBox="0 0 100 100" aria-hidden="true"><rect x="46" y="8" width="8" height="82" rx="4" fill="#e9d5ff" opacity=".9"/><rect x="39.0" y="16.0" width="22.0" height="12" rx="6" fill="#f87171" stroke="rgba(0,0,0,.35)" stroke-width="1.2"/><rect x="31.0" y="31.0" width="38.0" height="12" rx="6" fill="#fb923c" stroke="rgba(0,0,0,.35)" stroke-width="1.2"/><rect x="23.0" y="46.0" width="54.0" height="12" rx="6" fill="#fbbf24" stroke="rgba(0,0,0,.35)" stroke-width="1.2"/><rect x="15.0" y="61.0" width="70.0" height="12" rx="6" fill="#34d399" stroke="rgba(0,0,0,.35)" stroke-width="1.2"/><rect x="7.0" y="76.0" width="86.0" height="12" rx="6" fill="#38bdf8" stroke="rgba(0,0,0,.35)" stroke-width="1.2"/><rect x="10" y="88" width="80" height="7" rx="3.5" fill="#fff" opacity=".85"/></svg><span class="t">Difícil</span></button>
</div></div></main></div></div>

<header class="app-header app-topbar"><div class="side left"><button class="icon-btn btn-orbita v-azul" id="btn-back" type="button" title="Niveles" aria-label="Niveles"><span class="bola"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 5l-7 7 7 7"/></svg></span></button></div><div class="mv-centro" id="mvChipHeader"></div><div class="side right"><a class="icon-btn btn-orbita v-violeta" id="btn-casa" href="../index.html" title="Ir al inicio" aria-label="Ir al inicio"><span class="bola"><svg viewBox="0 0 24 24"><path d="M3.5 11.5 12 4l8.5 7.5M6 10v9h12v-9M10 19v-5h4v5"/></svg></span></a></div></header>

<div class="cuerpo">
  <div class="chips"><span class="chip" id="chMov">Movimientos 0</span></div>
  <div id="stage"><svg id="svg" viewBox="0 0 600 290" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Tres torres con discos"></svg></div>
  <div class="msg" id="msg"></div>
  <div class="fila" id="filaAcc">
    <button class="btn-orbita v-azul" id="bDes" type="button"><span class="bola">↶</span>Deshacer</button>
    <button class="btn-orbita v-rosa" id="bRei" type="button"><span class="bola">↺</span>Reiniciar</button>
    <button class="btn-orbita v-oro" id="bPis" type="button"><span class="bola">💡</span>Pista</button>
  </div>
  <div class="fila hidden" id="filaSig"><button class="btn-orbita v-verde ancho" id="bSig" type="button"><span class="bola">▶</span>Siguiente</button></div>
</div>

</div>
<div class="mv-celebra" id="mvCelebra" aria-hidden="true"></div>
<script>
window.mvExito = function(){
  try{ if(window.reaccionCompanero) window.reaccionCompanero('bien'); }catch(e){}
  var h=document.getElementById('mvCelebra'); if(!h) return;
  var img=h.querySelector('.mv-av img'); if(!img || !img.getAttribute('src')) return;
  h.classList.remove('on'); void h.offsetWidth; h.classList.add('on');
  clearTimeout(h._t); h._t=setTimeout(function(){ h.classList.remove('on'); },1700);
};
window.mvFallo = function(){ try{ if(window.reaccionCompanero) window.reaccionCompanero('mal'); }catch(e){} };
const RECURSO = 'torres-de-hanoi';
let AlumnoActual = null;
try{ var _g=JSON.parse(sessionStorage.getItem('profehoracio_alumno_actual')||'null'); if(_g && _g.id && _g.nombre) AlumnoActual=_g; }catch(e){}
function reportar(peso){ if(AlumnoActual && typeof window.reportarProgresoPractica==='function'){ try{ window.reportarProgresoPractica(AlumnoActual.id, RECURSO, 1, 0, peso); }catch(e){} } }
function iniciarHeartbeatTiempo(){
  if(typeof window.iniciarHeartbeatMathverse==='function') window.iniciarHeartbeatMathverse(function(){ return AlumnoActual && AlumnoActual.id; }, RECURSO);
  else setTimeout(iniciarHeartbeatTiempo,100);
}
if(AlumnoActual) iniciarHeartbeatTiempo();
const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function pantalla(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active'); document.body.classList.toggle('en-juego', id==='screen-juego'); window.scrollTo(0,0);
}

const PX=[100,300,500], BASE=232, H=28, WMIN=50, WMAX=172, TOPE_POSTE=64, Y_LEVANTADO=36;
const COLORES=['#f87171','#fb923c','#fbbf24','#34d399','#38bdf8','#a78bfa'];
const PESO={3:5,4:12,5:25};
const G={n:3,pegs:[[],[],[]],ini:0,meta:2,mov:0,sel:-1,hist:[],hint:0,fin:false,inicial:null};

function ancho(k){ return G.n===1 ? WMAX : WMIN + (k-1)*(WMAX-WMIN)/(G.n-1); }
function construir(){
  let s='<defs>';
  for(let k=1;k<=G.n;k++){ const c=COLORES[k-1]; s+=`<linearGradient id="gd${k}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset=".25" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".78"/></linearGradient>`; }
  s+='</defs>';
  s+=`<rect x="20" y="${BASE}" width="560" height="14" rx="7" fill="#4c1d95" stroke="#c4b5fd" stroke-opacity=".5"/>`;
  for(let p=0;p<3;p++){
    s+=`<rect class="poste${p===G.meta?' meta':''}" id="poste${p}" x="${PX[p]-6}" y="${TOPE_POSTE}" width="12" height="${BASE-TOPE_POSTE}" rx="6"/>`;
    s+=`<text class="etq-torre" x="${PX[p]}" y="${BASE+36}">Torre ${p+1}</text>`;
    if(p===G.meta) s+=`<text class="etq-meta" x="${PX[p]}" y="${BASE+56}">🏁 Meta</text>`;
  }
  for(let k=G.n;k>=1;k--){
    const w=ancho(k);
    s+=`<g class="disc" id="d${k}" style="transform:translate(${PX[0]}px,${BASE}px)"><rect x="${-w/2}" y="${-H/2+1}" width="${w}" height="${H-2}" rx="12" fill="url(#gd${k})" stroke="rgba(0,0,0,.35)" stroke-width="1.5"/><text x="0" y="1">${k}</text></g>`;
  }
  for(let p=0;p<3;p++) s+=`<rect class="zona" data-p="${p}" x="${PX[p]-100}" y="0" width="200" height="${BASE+14}"/>`;
  $('svg').innerHTML=s;
  document.querySelectorAll('#svg .zona').forEach(z=>{ z.addEventListener('click',()=>tocar(+z.dataset.p)); });
}
function legal(desde,hasta){
  const o=G.pegs[desde], d=G.pegs[hasta]; if(!o.length || desde===hasta) return false;
  const top=o[o.length-1]; return !d.length || d[d.length-1] > top;
}
function pintar(){
  for(let p=0;p<3;p++){
    G.pegs[p].forEach((k,i)=>{
      const lev = (G.sel===p && i===G.pegs[p].length-1);
      const el=$('d'+k); el.style.transform=`translate(${PX[p]}px,${lev?Y_LEVANTADO:BASE-(i+.5)*H}px)`; el.classList.toggle('sel',lev);
    });
    $('poste'+p).classList.toggle('ok', G.sel>=0 && legal(G.sel,p));
  }
  $('chMov').textContent='Movimientos '+G.mov;
  $('bDes').disabled = G.fin || !G.hist.length;
}
function msg(t,tipo){ const m=$('msg'); m.textContent=t; m.className='msg'+(tipo?' '+tipo:''); }
const MSG_INI='Lleva toda la torre a la meta 🏁. Un disco a la vez, y nunca uno grande sobre uno pequeño.';

function empezar(n){
  G.n=n; G.ini=rnd(0,2); do{ G.meta=rnd(0,2); }while(G.meta===G.ini);
  G.inicial=[[],[],[]]; for(let k=n;k>=1;k--) G.inicial[G.ini].push(k);
  construir(); reiniciarPosicion(); pantalla('screen-juego');
}
function reiniciarPosicion(){
  G.pegs=G.inicial.map(a=>a.slice()); G.mov=0; G.sel=-1; G.hist=[]; G.hint=0; G.fin=false;
  $('filaSig').classList.add('hidden'); $('filaAcc').classList.remove('hidden');
  msg(MSG_INI); pintar();
}
function tocar(p){
  if(G.fin) return;
  if(G.sel<0){
    if(!G.pegs[p].length){ msg('Esa torre está vacía. Toca una torre que tenga discos.','mal'); return; }
    G.sel=p; msg('Ahora toca la torre a donde quieres llevarlo.'); pintar(); return;
  }
  if(G.sel===p){ G.sel=-1; msg(MSG_INI); pintar(); return; }
  if(!legal(G.sel,p)){
    const el=$('d'+G.pegs[G.sel][G.pegs[G.sel].length-1]); const r=el.firstElementChild; r.classList.remove('shake'); void r.getBoundingClientRect(); r.classList.add('shake'); 
    msg('Ese disco es más grande que el de arriba. Solo puede ir sobre uno más grande, o en una torre vacía.','mal'); try{ mvFallo(); }catch(e){}
    return;
  }
  G.hist.push({pegs:G.pegs.map(a=>a.slice()),mov:G.mov});
  G.pegs[p].push(G.pegs[G.sel].pop()); G.mov++; G.sel=-1;
  if(G.pegs[G.meta].length===G.n){ ganar(); return; }
  msg(MSG_INI); pintar();
}
function ganar(){
  G.fin=true; pintar();
  const min=Math.pow(2,G.n)-1;
  const perfecto=G.mov===min;
  msg(perfecto ? `🎉 ¡Perfecto! Lo lograste en ${G.mov} movimientos, el mínimo posible: 2${sup(G.n)} − 1 = ${min}.`
               : `🎉 ¡Lo lograste en ${G.mov} movimientos! El mínimo posible es 2${sup(G.n)} − 1 = ${min}. ¿Puedes igualarlo?`,'bien');
  try{ mvExito(); }catch(e){}
  reportar(PESO[G.n]||5);
  $('filaAcc').classList.add('hidden'); $('filaSig').classList.remove('hidden');
}
function sup(n){ return ({3:'³',4:'⁴',5:'⁵'})[n]||('^'+n); }
function discoEn(k){ for(let p=0;p<3;p++) if(G.pegs[p].indexOf(k)>=0) return p; return -1; }
function proximo(k,t){
  if(k===0) return null;
  const p=discoEn(k); if(p===t) return proximo(k-1,t);
  const o=3-p-t, m=proximo(k-1,o); if(m) return m;
  return {disco:k,desde:p};
}
$('bDes').addEventListener('click',()=>{ if(G.fin||!G.hist.length) return; const h=G.hist.pop(); G.pegs=h.pegs; G.mov=h.mov; G.sel=-1; msg(MSG_INI); pintar(); });
$('bRei').addEventListener('click',()=>{ if(!G.fin) reiniciarPosicion(); });
$('bPis').addEventListener('click',()=>{
  if(G.fin) return; G.hint++; G.sel=-1; pintar();
  if(G.hint===1){ msg('💡 Para mover el disco más grande, primero hay que despejarlo: los discos de arriba se van a la torre que sobra.','pista'); return; }
  const m=proximo(G.n,G.meta);
  msg(m ? `💡 Ahora conviene mover el disco ${m.disco}, que está en la Torre ${m.desde+1}. ¿A qué torre lo llevarías?` : 'Ya casi: revisa tu torre.','pista');
});
$('bSig').addEventListener('click',()=>empezar(G.n));
window.empezar=empezar;

$('btn-back').addEventListener('click', function(){ pantalla('screen-home'); });
(function(){
  function montar(n){ n=n||0;
    if(typeof window.montarChipCompanero==='function'){
      [['mvChipHome',{grande:true}],['mvChipHeader',{grande:false}],['mvCelebra',{grande:true,celebra:true}]].forEach(function(p){
        var e=document.getElementById(p[0]); if(e && !e.dataset.mv){ e.dataset.mv='1'; window.montarChipCompanero(e,p[1]); } });
    } else if(n<100){ setTimeout(function(){ montar(n+1); },100); } }
  montar();
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter' || e.repeat || e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
    var b=document.querySelector('#bSig'); if(!b || b.offsetParent===null || b.disabled || document.activeElement===b) return;
    e.preventDefault(); b.click();
  });
