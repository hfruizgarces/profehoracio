<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Balanza de fracciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg-1:#1e1147; --bg-2:#3b1785; --bg-3:#5b21b6;
  --primary:#34d399; --accent:#fbbf24; --error:#fb7185; --blue:#38bdf8; --pink:#f472b6;
  --text:#f6f3ff; --text-dim:#c9bdf0; --text-faint:#8f7fc4;
  --surface:rgba(255,255,255,.07); --surface-strong:rgba(255,255,255,.12);
  --border-soft:rgba(255,255,255,.16);
  --shadow:0 14px 34px rgba(0,0,0,0.4);
  --radius:20px; --radius-sm:12px;
  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;
  --transition: all .2s cubic-bezier(.4,0,.2,1);
  --hb:clamp(34px,8dvh,60px);
}
*{ box-sizing:border-box; }
html,body{
  margin:0; font-family:var(--font-body); font-weight:600; color:var(--text);
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed; min-height:100vh; overflow-x:hidden;
}
body.en-juego{ overflow:hidden; height:100dvh; min-height:0; }
button{ font-family:inherit; }
h1,h2,h3{ font-family:var(--font-display); margin:0; }
.hidden{ display:none !important; }

.screen{ display:none; animation:fadeIn .35s ease; }
.screen.active{ display:block; }
.portada{ max-width:520px; margin:0 auto; padding:16px 16px 50px; }
@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

/* ---------- Portada y login ---------- */
.hero{ text-align:center; padding:26px 6px 10px; }
.hero h1{ font-size:clamp(1.9rem,6vw,2.6rem); margin-bottom:10px; }
.hero .subtitle{ color:var(--text-dim); font-weight:600; }
.login-card{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:24px;
  max-width:340px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,.35); backdrop-filter:blur(6px);
  margin:14px auto 0; display:flex; flex-direction:column; gap:10px;
}
.login-card input{
  width:100%; padding:12px; border-radius:var(--radius-sm); border:2px solid var(--border-soft);
  background:var(--surface-strong); color:var(--text); font-family:var(--font-display); font-weight:700; text-align:center;
}
.login-error{ color:var(--error); font-weight:700; font-size:.82rem; min-height:1.2em; margin:0; }
.btn-ingresar{
  padding:13px; border-radius:999px; border:none; cursor:pointer;
  background:linear-gradient(140deg,#0f9d70,var(--primary)); color:#04281c;
  font-family:var(--font-display); font-weight:800; font-size:1rem;
}
.btn-sin-login{
  padding:10px; border-radius:999px; border:1px solid var(--border-soft); cursor:pointer;
  background:var(--surface); color:var(--text-faint); font-family:var(--font-display); font-weight:700; font-size:.78rem;
}
.level-selector{ display:grid; grid-template-columns:1fr; gap:clamp(10px,2.5vw,16px); width:100%; max-width:480px; margin:20px auto 0; }
.level-btn{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  padding:clamp(16px,4vw,22px) 10px; min-height:90px; border:none; border-radius:var(--radius-sm);
  cursor:pointer; transition:var(--transition); text-align:center; width:100%;
  color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.3);
}
.level-btn.easy{ background:linear-gradient(140deg,#0f9d70,#34d399); }
.level-btn.mid{ background:linear-gradient(140deg,#1d4ed8,#38bdf8); }
.level-btn.hard{ background:linear-gradient(140deg,#b91c66,#f472b6); }
.level-btn:hover{ transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.4); }
.level-btn .level-star{ font-size:clamp(1.4rem,4vw,1.7rem); }
.level-btn .level-name{ font-weight:800; font-size:clamp(1rem,2.6vw,1.1rem); font-family:var(--font-display); }
.level-btn .level-desc{ font-weight:700; font-size:.78rem; opacity:.92; }
footer.credits{ text-align:center; color:var(--text-faint); font-weight:700; font-size:.78rem; padding:24px 10px 4px; }

/* ---------- Pantalla de juego (sin scroll) ---------- */
#screen-juego{ height:100dvh; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden; }
#screen-juego.active{ display:grid; }
.app-topbar{
  display:grid; align-items:center; gap:6px 8px; width:100%; max-width:1050px; margin:0 auto; padding:8px 62px 4px 14px;
  grid-template-columns:1fr auto 1fr; grid-template-areas:"back pill der";
}
.icon-btn{
  grid-area:back; justify-self:start; display:inline-flex; align-items:center; gap:6px;
  background:var(--surface); border:1px solid var(--border-soft); color:var(--text);
  padding:8px 14px; border-radius:999px; font-weight:700; font-size:.9rem; cursor:pointer;
}
.icon-btn:hover{ background:var(--surface-strong); }
.topbar-der{ grid-area:der; justify-self:end; display:flex; gap:6px; }
.nivel-pill{
  grid-area:pill; display:inline-flex; align-items:center; justify-content:center;
  background:rgba(251,191,36,.14); border:1px solid rgba(251,191,36,.4); color:var(--accent);
  padding:6px 12px; border-radius:999px; font-family:var(--font-display); font-weight:800;
  font-size:.74rem; text-transform:uppercase; letter-spacing:.05em; white-space:nowrap;
}
.btn{
  font-family:var(--font-display); font-weight:700; font-size:13px; cursor:pointer; transition:var(--transition);
  background:var(--surface); border:1px solid var(--border-soft); color:var(--text); padding:7px 14px; border-radius:999px;
}
.btn:hover{ background:var(--surface-strong); }
.btn.icono{ width:38px; height:38px; padding:0; font-size:19px; display:inline-flex; align-items:center; justify-content:center; }
.btn.verde{ background:linear-gradient(140deg,#0f9d70,var(--primary)); color:#04281c; border-color:transparent; font-weight:800; font-size:14px; padding:8px 18px; }
.btn.siguiente{ background:linear-gradient(140deg,#f59e0b,var(--accent)); color:#3d1f00; border-color:transparent; font-weight:800; font-size:14px; padding:8px 18px; }
.btn.azul{ background:linear-gradient(140deg,#1d4ed8,var(--blue)); color:#06213a; border-color:transparent; font-weight:800; font-size:14px; padding:8px 18px; }
.btn.corte{ padding:5px 11px; min-width:34px; }
.btn.sel{ background:rgba(56,189,248,.22); border-color:var(--blue); color:var(--blue); }

.juego-main{
  width:100%; max-width:1050px; margin:0 auto; min-height:0; padding:0 14px 40px;
  display:flex; flex-direction:column; gap:6px;
}
.escenario{
  flex:1 1 0; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:8px;
  padding:4px 2px; overflow:hidden;
}
.fila{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; justify-content:center; }
.fila.fix{ flex-wrap:nowrap; }
.fila .flex1{ flex:1; min-width:0; }
.etq{ font-family:var(--font-display); font-weight:800; font-size:15px; min-width:78px; color:var(--text-dim); }
.estado{ display:flex; justify-content:center; align-items:center; font-family:var(--font-display); font-weight:800; font-size:15px; color:var(--accent); }
.sub{ margin:0; text-align:center; font-size:14px; line-height:1.3; color:var(--text-dim); font-weight:700; }
.sub b{ color:var(--text); }

.msg{ min-height:2.7em; margin:0; padding:3px 8px; text-align:center; line-height:1.3; font-size:14px; font-weight:700; color:var(--text-dim); display:block; }
.msg.bien{ color:var(--primary); } .msg.mal{ color:var(--error); } .msg.casi{ color:var(--accent); }
.msg b{ color:inherit; }

/* Fracciones */
.frac{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; font-weight:800; line-height:1.05; margin:0 3px; }
.frac > span:first-child{ border-bottom:2.5px solid currentColor; padding:0 4px; }
.frac .den{ border-top:3px solid currentColor; padding:0 10px; }
.frac.grande{ font-size:clamp(1.35rem,5.5vw,1.9rem); font-family:var(--font-display); }
.entrada{
  width:68px; padding:6px; font-size:1.25rem; border-radius:var(--radius-sm); border:2px solid var(--border-soft);
  text-align:center; background:var(--surface-strong); color:var(--text); font-family:var(--font-display); font-weight:800;
  -moz-appearance:textfield; appearance:textfield;
}
.entrada::-webkit-outer-spin-button,.entrada::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.entrada:focus{ outline:none; border-color:var(--blue); }

/* Barras */
.barra{
  display:flex; height:var(--hb); border:3px solid var(--text); border-radius:var(--radius-sm); overflow:hidden;
  background:rgba(255,255,255,.06); transition:outline .2s, transform .5s, opacity .3s; touch-action:none; width:100%;
}
.barra.entero{ height:calc(var(--hb)*.75); background:rgba(56,189,248,.18); justify-content:center; align-items:center; font-weight:800; font-size:1.2rem; font-family:var(--font-display); }
.trozo{
  flex:1; min-width:0; border-right:2px solid var(--text); display:flex; align-items:center; justify-content:center;
  font-size:clamp(8px,2.5vw,13px); color:var(--text-dim); user-select:none; touch-action:none; transition:background .15s;
}
.trozo:last-child{ border-right:none; }
.trozo.on{ background:var(--blue); color:#0c1b3a; font-weight:800; }
.barra.b .trozo.on{ background:var(--accent); color:#3d1f00; }
.barra.coincide{ outline:5px solid var(--primary); }
.sup-z{ position:relative; z-index:3; }
.historial{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; font-size:1.15rem; font-family:var(--font-display); }
.historial .frac{ opacity:.55; } .historial .frac.actual{ opacity:1; color:var(--accent); }
svg text{ font-weight:800; font-family:var(--font-display); }
.balanza{ width:100%; flex:1 1 0; min-height:70px; }

@media(max-width:600px){
  .app-topbar{ padding:6px 62px 2px 8px; }
  .icon-btn{ padding:7px 11px; font-size:.82rem; }
  .btn.icono{ width:34px; height:34px; font-size:17px; }
  .juego-main{ padding:0 8px 40px; }
  .escenario{ padding:4px 0; }
  .etq{ min-width:60px; font-size:14px; }
}
@media(max-height:620px){ :root{ --hb:clamp(30px,6.6dvh,48px); } .escenario{ gap:6px; } }
@media(max-height:480px){
  :root{ --hb:clamp(28px,9dvh,40px); }
  .app-topbar{ padding-top:3px; padding-bottom:2px; min-height:52px; }
  .btn.icono{ width:30px; height:30px; }
  .juego-main{ padding-bottom:38px; gap:3px; }
  .escenario{ padding:2px 8px; gap:4px; }
  .msg{ font-size:12.5px; min-height:2.4em; padding:1px; }
  .sub{ font-size:12.5px; }
  .btn.corte{ padding:3px 9px; } .btn.verde,.btn.siguiente,.btn.azul{ padding:5px 14px; }
  .entrada{ padding:3px; font-size:1.05rem; width:60px; }
  .frac.grande{ font-size:1.25rem; }
}

a.level-btn{ text-decoration:none; }
.level-btn.soon{ opacity:.42; cursor:default; filter:grayscale(.5); pointer-events:none; }
.level-btn.soon:hover{ transform:none; }
.volver-sub{ text-decoration:none; display:inline-flex; margin:4px 0 0; }
</style>
</head>
<body>
<a href="../index.html#recursos" title="Volver a los recursos" style="position:fixed; top:12px; right:12px; z-index:99999; width:42px; height:42px; border-radius:50%; background:rgba(30,17,71,.75); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-size:1.25rem; text-decoration:none; box-shadow:0 4px 14px rgba(0,0,0,.35);">🏠</a>
<div id="monedasPill" class="hidden" style="position:fixed; bottom:12px; right:12px; z-index:99998; background:rgba(30,17,71,.75); backdrop-filter:blur(6px); border:1px solid rgba(251,191,36,.4); border-radius:20px; padding:8px 14px; font-family:var(--font-display); font-weight:800; font-size:.85rem; color:var(--accent); box-shadow:0 4px 14px rgba(0,0,0,.35);">🪙 0</div>
<div class="screen portada active" id="screen-login">
  <div class="hero"><h1>⚖️ Balanza de fracciones</h1></div>
  <div class="login-card">
    <input type="text" id="loginUsuario" placeholder="Usuario" autocomplete="off" maxlength="30">
    <input type="password" id="loginPassword" placeholder="Contraseña" autocomplete="off" maxlength="30">
    <p class="login-error" id="loginError"></p>
    <button class="btn-ingresar" id="btnLoginEntrar">Ingresar</button>
    <button type="button" class="btn-sin-login" id="btnSinLogin">Continuar sin loguearse (tu progreso solo queda en este computador)</button>
  </div>
</div>

<!-- JUEGO -->
<div class="screen" id="screen-juego">
  <div class="app-topbar">
    <button class="icon-btn" id="bVolver" type="button">← Volver</button>
    <span class="nivel-pill" id="actPill"></span>
    <div class="topbar-der">
      <button class="btn icono" id="bSon" title="Sonido">🔊</button>
      <button class="btn icono" id="bFull" title="Pantalla completa">⛶</button>
    </div>
  </div>
  <main class="juego-main">
    <section class="escenario" id="escenario"></section>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </main>
</div>

<script>

/* =========================================================
   UTILIDADES
   ========================================================= */
const mcd = (a,b)=> b===0 ? Math.abs(a) : mcd(b, a%b);
const simp = (n,d)=>{ const g=mcd(n,d)||1; return [n/g,d/g]; };
const rnd = (a,b)=> Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[rnd(0,arr.length-1)];
const F = (n,d,cls='')=> `<span class="frac ${cls}"><span>${n}</span><span>${d}</span></span>`;
const $ = s => document.querySelector(s);
const tactil = !window.matchMedia('(pointer:fine)').matches;

/* Sonido (Web Audio, sin archivos externos) */
let sonidoOn = true, ctx;
function tono(f=880, dur=.15, tipo='sine'){
  if(!sonidoOn) return;
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=tipo; o.frequency.value=f; g.gain.setValueAtTime(.15,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }catch(e){}
}
const tintineo = ()=>{ tono(988,.12); setTimeout(()=>tono(1319,.2),110); };
const errorSnd = ()=> tono(220,.25,'triangle');
$('#bSon').onclick = e => { sonidoOn=!sonidoOn; e.currentTarget.textContent = sonidoOn?'🔊':'🔇'; };
$('#bFull').onclick = ()=> document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();

/* Mensajes: una franja fija bajo el escenario (no tapa nada) */
let tmsg;
function aviso(html, tipo='', ms=0){
  const m=$('#msg'); m.className='msg '+tipo; m.innerHTML=html;
  clearTimeout(tmsg); if(ms) tmsg=setTimeout(()=>{ m.innerHTML=''; m.className='msg'; }, ms);
}

/* Progreso al resto del sitio (las monedas las paga el motor por tiempo de actividad) */
let AlumnoActual = null;
function registrarCompletado(){
  if(AlumnoActual && typeof window.reportarProgresoPractica === 'function'){
    window.reportarProgresoPractica(AlumnoActual.id, 'taller-fracciones', 1, 0);
  }
}
// El motor de monedas cuenta "actividad" con click/teclado; pintar arrastrando (pointer) también debe contar.
const marcarActividad = () => document.dispatchEvent(new Event('click'));

/* Estado que se conserva al cambiar de actividad */
const S = { bal:{nivel:0, puntos:0}, sim:{nivel:0, resueltos:0} };
let modoActual = 1, token = 0, tmo;

/* =========================================================
   BARRA DE FRACCIÓN
   Pintura SIEMPRE consecutiva de izquierda a derecha:
   tocar un trozo vacío pinta hasta él; tocar uno pintado despinta desde él.
   ========================================================= */
function crearBarra(cont, partes, pintadas=0, {editable=true, clase='', onChange}={}){
  const b=document.createElement('div'); b.className='barra '+clase;
  let n=partes, pint=Math.min(pintadas,partes);
  const dibujar=()=>{
    b.innerHTML='';
    for(let i=0;i<n;i++){
      const t=document.createElement('div'); t.className='trozo'+(i<pint?' on':''); t.dataset.i=i;
      if(n<=12) t.textContent='1/'+n;
      b.appendChild(t);
    }
  };
  dibujar();
  const contar=()=>pint;
  const pintaHasta=i=>{ pint=i+1; dibujar(); onChange?.(pint); };
  const despintaDesde=i=>{ pint=i; dibujar(); onChange?.(pint); };
  if(editable){
    let arrastrando=false, pintando=true;
    b.addEventListener('pointerdown',e=>{ const t=e.target.closest('.trozo'); if(!t)return;
      const i=+t.dataset.i; arrastrando=true; pintando = i>=pint;
      pintando ? pintaHasta(i) : despintaDesde(i);
      tono(500+pint*40,.05); try{ b.setPointerCapture(e.pointerId); }catch(_){} });
    b.addEventListener('pointermove',e=>{ if(!arrastrando)return;
      const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.trozo');
      if(el && b.contains(el)){ const j=+el.dataset.i;
        if(pintando && j>=pint) pintaHasta(j); if(!pintando && j<pint) despintaDesde(j); }});
    b.addEventListener('pointerup',()=>{ arrastrando=false; marcarActividad(); });
    b.addEventListener('pointercancel',()=>{ arrastrando=false; });
  }
  cont.appendChild(b);
  return {el:b, contar, get partes(){return n}};
}

/* =========================================================
   GENERADORES DE EJERCICIOS (en vez de bancos fijos)
   Se arman todas las combinaciones válidas de cada nivel y se sortea
   evitando repetir los últimos ejercicios.
   ========================================================= */
const _pools = {}, _recientes = {};
function _irreducibles(bMin,bMax){ const r=[]; for(let b=bMin;b<=bMax;b++) for(let a=1;a<b;a++) if(mcd(a,b)===1) r.push([a,b]); return r; }
function poolBalanza(nivel){          // [numerador, denominador izq., denominador der.]
  const cfg=[ {b:[2,6], k:[2,3],   dd:[4,12]},
              {b:[2,7], k:[3,4,5], dd:[8,24]},
              {b:[3,10],k:[2,3,4], dd:[12,30]} ][nivel];
  const out=[];
  for(const [a,b] of _irreducibles(cfg.b[0],cfg.b[1])) for(const k of cfg.k){
    const dd=b*k; if(dd>=cfg.dd[0] && dd<=cfg.dd[1]) out.push([a,b,dd]);
  }
  return out;
}
function poolSimplificar(nivel){      // [numerador, denominador] reducibles
  const cfg=[ {b:[2,6],  k:[2,3,4,5],                  d:[4,18]},
              {b:[3,9],  k:[3,4,5,6,7,8,9],            d:[12,36]},
              {b:[3,11], k:[4,6,8,9,10,12,14,15,16,18], d:[28,72]} ][nivel];
  const out=[];
  for(const [a,b] of _irreducibles(cfg.b[0],cfg.b[1])) for(const k of cfg.k){
    const d=b*k; if(d>=cfg.d[0] && d<=cfg.d[1]) out.push([a*k,d]);
  }
  return out;
}
function sortear(tipo, nivel){
  const clave=tipo+nivel;
  const pool = _pools[clave] || (_pools[clave] = tipo==='bal' ? poolBalanza(nivel) : poolSimplificar(nivel));
  const rec = _recientes[clave] || (_recientes[clave] = []);
  const ventana = Math.min(Math.floor(pool.length/2), 12);
  let cand = pool.filter(x => !rec.includes(x.join('/')));
  if(!cand.length) cand = pool;
  const e = pick(cand);
  rec.push(e.join('/')); while(rec.length>ventana) rec.shift();
  return e;
}

/* =========================================================
   ACTIVIDAD 2: LA BALANZA DE FRACCIONES
   Lado izquierdo fijo; el derecho tiene un denominador compatible.
   El alumno PREDICE el numerador, ve el resultado y confirma o modifica.
   ========================================================= */
function modo2(){
  const E=$('#escenario'), st=S.bal;
  const pill=()=>$('#actPill').textContent=`⚖️ Nivel ${st.nivel+1}`;
  let obj, derD, estado, prediccion;
  function nuevo(){
    const [n,d,dd]=sortear('bal',st.nivel);
    obj=[n,d]; derD=dd; estado='predecir'; prediccion=null;
    pintar();
  }
  function pintar(nota=''){
    pill();
    const vd = estado==='predecir' ? 0 : (prediccion||0)/derD;
    const vi = obj[0]/obj[1];
    const ang = Math.max(-18,Math.min(18,(vd-vi)*40));
    const derTxt = estado==='predecir' ? '?/'+derD : prediccion+'/'+derD;
    let panel='';
    if(estado==='predecir'){
      panel=`
      <p class="sub">El lado derecho se corta en <b>${derD} trozos</b>. ¿<b>Cuántos trozos de ese tamaño</b> equilibran la balanza?</p>
      <div class="fila">
        <span style="font-family:var(--font-display);font-weight:800">Mi predicción:</span>
        <span class="frac grande"><input type="number" class="entrada" id="pn" min="0" max="${derD}" inputmode="numeric"><span class="den">${derD}</span></span>
        <button class="btn verde" id="ver">👀 Ver mi predicción</button>
      </div>`;
    }
    if(estado==='observar'){
      panel=`
      <p class="sub">Así se ve tu predicción de <b>${prediccion} trozos de 1/${derD}</b>. Mira las barras y la balanza: <b>¿estaba bien?</b></p>
      <div class="fila"><button class="btn verde" id="confirma">✔ Sí, estoy seguro/a</button><button class="btn" id="modifica">✏️ Quiero modificarla</button></div>`;
    }
    if(estado==='resuelto'){
      panel=`
      <p class="sub">⚖️ ¡Equilibrio perfecto! ${F(obj[0],obj[1])} = ${F(prediccion,derD)}</p>
      <div class="fila"><button class="btn siguiente" id="otro">Otro ejercicio →</button></div>`;
    }
    E.innerHTML=`
    <div class="estado">⭐ Puntos: ${st.puntos}</div>
    <svg class="balanza" viewBox="0 0 600 300" preserveAspectRatio="xMidYMid meet">
      <polygon points="280,280 320,280 300,120" fill="#8b83c9"/>
      <g style="transition:transform .6s cubic-bezier(.3,1.6,.5,1);transform-origin:300px 120px;transform:rotate(${ang}deg)">
        <rect x="70" y="114" width="460" height="12" rx="6" fill="#f1f0ff"/>
        <g transform="translate(110,126)"><line x1="0" y1="0" x2="-40" y2="70" stroke="#f1f0ff" stroke-width="2"/><line x1="0" y1="0" x2="40" y2="70" stroke="#f1f0ff" stroke-width="2"/>
          <g style="transform:rotate(${-ang}deg);transform-origin:0 75px;transition:transform .6s"><rect x="-70" y="70" width="140" height="14" rx="7" fill="#38bdf8"/>
          <text x="0" y="60" text-anchor="middle" font-size="34" fill="#38bdf8">${obj[0]}/${obj[1]}</text></g></g>
        <g transform="translate(490,126)"><line x1="0" y1="0" x2="-40" y2="70" stroke="#f1f0ff" stroke-width="2"/><line x1="0" y1="0" x2="40" y2="70" stroke="#f1f0ff" stroke-width="2"/>
          <g style="transform:rotate(${-ang}deg);transform-origin:0 75px;transition:transform .6s"><rect x="-70" y="70" width="140" height="14" rx="7" fill="#fbbf24"/>
          <text x="0" y="60" text-anchor="middle" font-size="34" fill="#fbbf24">${derTxt}</text></g></g>
      </g>
    </svg>
    <div class="fila fix"><span class="etq">Izquierda</span><div class="flex1" id="bi"></div></div>
    <div class="fila fix"><span class="etq">Derecha</span><div class="flex1" id="bd"></div></div>
    ${panel}`;
    crearBarra($('#bi'),obj[1],obj[0],{editable:false});
    if(estado==='predecir') crearBarra($('#bd'),1,0,{editable:false,clase:'b'});
    else crearBarra($('#bd'),derD,Math.min(prediccion,derD),{editable:false,clase:'b'});
    if(nota) aviso(nota.html, nota.tipo, nota.ms);
    if(estado==='predecir'){
      if(!tactil) $('#pn').focus();
      const ver=()=>{
        const raw=$('#pn').value, v=+raw;
        if(raw==='') return aviso('✍️ Escribe tu predicción primero.','',4000);
        if(v<0||v>derD) return aviso(`💡 Piénsalo: ¿pueden caber más de ${derD} trozos de 1/${derD} en un entero?`,'casi',5000);
        prediccion=v; estado='observar'; tono(700,.1); pintar();
      };
      $('#ver').onclick=ver;
      $('#pn').onkeydown=e=>{ if(e.key==='Enter') ver(); };
    }
    if(estado==='observar'){
      $('#confirma').onclick=()=>{
        if(prediccion*obj[1]===obj[0]*derD){
          estado='resuelto'; st.puntos++; tintineo(); registrarCompletado(); if(window.TallerOnline)TallerOnline.resultado(true);
          let extra='';
          if(st.puntos>0 && st.puntos%4===0 && st.nivel<2 && !(window.TallerOnline&&TallerOnline.nivelFijo)){ st.nivel++; extra=` 🚀 ¡Subes al Nivel ${st.nivel+1}!`; }
          pintar({html:`⚖️ ¡Exacto! ${F(obj[0],obj[1])} = ${F(prediccion,derD)}.${extra}`, tipo:'bien', ms:6000});
        } else {
          errorSnd(); if(window.TallerOnline)TallerOnline.resultado(false);
          const pista = prediccion/derD > vi
            ? `Te pasaste: el platillo derecho bajó. ${F(prediccion,derD)} es <b>más</b> que ${F(obj[0],obj[1])}.`
            : `Te quedaste corto/a: el platillo izquierdo sigue abajo. ${F(prediccion,derD)} es <b>menos</b> que ${F(obj[0],obj[1])}.`;
          aviso('🤔 '+pista+' Modifica tu predicción y vuelve a intentarlo.','casi',7000);
        }
      };
      $('#modifica').onclick=()=>{ estado='predecir'; tono(500,.08); pintar(); };
    }
    if(estado==='resuelto') $('#otro').onclick=()=>{ aviso(''); nuevo(); };
  }
  aviso('');
  nuevo();
}



function mostrarAlumno(nombre){
  const ind = document.getElementById('indicadorAlumno'); if(!ind) return;
  ind.textContent = `👤 ${nombre}`; ind.style.display = 'block';
}
function sesionGuardada(){
  try{ const g = JSON.parse(sessionStorage.getItem('profehoracio_alumno_actual') || 'null'); if(g && g.id && g.nombre) return g; }catch(e){}
  return null;
}
function esInvitado(){ try{ return sessionStorage.getItem('profehoracio_invitado')==='1'; }catch(e){ return false; } }
function switchScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.body.classList.toggle('en-juego', id === 'screen-juego');
  window.scrollTo(0, 0);
}
function iniciarHeartbeatTiempo(){
  if(typeof window.iniciarHeartbeatMathverse === 'function'){
    window.iniciarHeartbeatMathverse(() => AlumnoActual?.id, 'taller-fracciones');
  } else { setTimeout(iniciarHeartbeatTiempo, 100); }
}
function configurarLogin(alEntrar){
  document.getElementById('btnLoginEntrar').onclick = async () => {
    const usuario = document.getElementById('loginUsuario').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    if(!usuario || !password){ errEl.textContent = 'Escribe tu usuario y tu contraseña.'; return; }
    const btn = document.getElementById('btnLoginEntrar');
    btn.disabled = true; btn.textContent = 'Entrando…'; errEl.textContent = '';
    try{
      const resultado = await window.verificarLoginAlumnoCompartido(usuario, password);
      if(!resultado.ok){ errEl.textContent = resultado.error; btn.disabled = false; btn.textContent = 'Ingresar'; return; }
      AlumnoActual = { id: resultado.id, nombre: resultado.nombre };
      try{ sessionStorage.setItem('profehoracio_alumno_actual', JSON.stringify(AlumnoActual)); sessionStorage.removeItem('profehoracio_invitado'); }catch(e){}
      alEntrar(); iniciarHeartbeatTiempo();
    } catch(err){ console.error(err); errEl.textContent = 'Error de conexión. Intenta de nuevo.'; }
    btn.disabled = false; btn.textContent = 'Ingresar';
  };
  document.getElementById('loginPassword').addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('btnLoginEntrar').click(); });
  document.getElementById('btnSinLogin').onclick = () => { try{ sessionStorage.setItem('profehoracio_invitado','1'); }catch(e){} alEntrar(); };
}
function arrancar(alEntrar){
  configurarLogin(alEntrar);
  const g = sesionGuardada();
  if(g){ AlumnoActual = g; alEntrar(); iniciarHeartbeatTiempo(); }
  else if(esInvitado()){ alEntrar(); }
}

document.getElementById('bVolver').onclick = () => { token++; clearTimeout(tmo); location.href='comparacion.html'; };
arrancar(() => { switchScreen('screen-juego'); modo2(); });
// Desafío Online: el profesor fija el nivel (no sube solo).
window.TallerOnlineListo = function(O){
  const k=+O.sub; if(![1,2,3].includes(k)) return;
  S.bal.nivel=k-1; S.bal.puntos=0; O.nivelFijo=true;
  switchScreen('screen-juego'); modo2(); O.iniciar();
};
