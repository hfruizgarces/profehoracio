<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Laboratorio de Números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS DE DISEÑO
   ========================================================= */
:root{
  color-scheme: dark;
  --bg-1:#1e1147;
  --bg-2:#3b1785;
  --bg-3:#5b21b6;
  --surface:rgba(255,255,255,.07);
  --surface-strong:rgba(255,255,255,.12);
  --border-soft:rgba(255,255,255,.14);

  --primary:#34d399;
  --primary-dark:#0f9d70;
  --accent:#fbbf24;
  --accent-soft:#fde68a;
  --pink:#f472b6;
  --blue:#38bdf8;
  --error:#fb7185;
  --error-soft:#3b0f1f;

  --text:#f6f3ff;
  --text-dim:#c9bdf0;
  --text-faint:#8f7fc4;

  --r-lg:22px;
  --r-md:16px;
  --r-sm:10px;

  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;

  --shadow-1: 0 10px 30px rgba(0,0,0,.35);
  --tap-min: 48px;
}

*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; width:100%; overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
h1,h2,h3{font-family:var(--font-display); margin:0;}
button, input{ -webkit-user-select:none; user-select:none; }
input{font-family:inherit;}

.hidden{display:none !important;}
.visually-hidden{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* Foco visible para accesibilidad con teclado */
:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
  border-radius:6px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* =========================================================
   LAYOUT GENERAL
   ========================================================= */
#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding: clamp(10px, 2.5vw, 24px);
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:6px 56px 14px 2px;
  flex-wrap:wrap;
}
.app-header .side{
  display:flex; align-items:center; gap:6px;
  flex:1 1 auto;
  min-width:70px;
}
.app-header .side.right{ justify-content:flex-end; }

.icon-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--surface);
  border:1px solid var(--border-soft);
  color:var(--text);
  padding:9px 12px;
  border-radius:999px;
  font-weight:700;
  font-size:clamp(.75rem, 2vw, .9rem);
  cursor:pointer;
  min-height:var(--tap-min);
  transition: background .15s, transform .1s;
  white-space:nowrap;
}
.icon-btn:hover{ background:var(--surface-strong); }
.icon-btn:active{ transform:scale(.96); }

.brand{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.2vw, 1.6rem);
  flex:0 1 auto;
  white-space:nowrap;
}
.brand .plus{
  display:inline-flex; align-items:center; justify-content:center;
  width:1.5em; height:1.5em;
  background:linear-gradient(135deg, var(--primary), var(--blue));
  border-radius:10px;
  color:#0b1a12;
  font-size:1em;
}

main{ flex:1; display:flex; flex-direction:column; }

.screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  animation: fadeSlideIn .35s ease both;
}
@keyframes fadeSlideIn{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}

.card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(16px, 4vw, 32px);
  box-shadow:var(--shadow-1);
  backdrop-filter: blur(6px);
}

/* =========================================================
   PANTALLA INICIAL
   ========================================================= */
.home-title{
  text-align:center;
  font-size:clamp(1.4rem, 5vw, 2.2rem);
  font-weight:800;
  margin-bottom:6px;
}
.home-sub{
  text-align:center;
  color:var(--text-dim);
  font-size:clamp(.9rem, 2.4vw, 1.05rem);
  margin:0 auto clamp(18px,4vw,28px);
  max-width:46ch;
}
footer.credits{ text-align:center; color: var(--text-faint); font-weight:700; font-size:.78rem; padding:20px 10px 4px; }
.level-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:clamp(10px, 2.5vw, 16px);
  width:100%;
}
@media (max-width:420px){
  .level-grid{ grid-template-columns:1fr; }
}
.level-btn{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:clamp(16px,4vw,22px) 10px;
  border-radius:var(--r-md);
  border:1px solid var(--border-soft);
  color:var(--text);
  cursor:pointer;
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1rem, 2.6vw, 1.15rem);
  min-height:96px;
  transition:transform .15s, box-shadow .15s;
}
.level-btn:hover{ transform:translateY(-3px); }
.level-btn:active{ transform:scale(.97); }
.level-btn .emoji{ font-size:clamp(1.6rem, 5vw, 2.1rem); }
.level-btn.easy{ background:linear-gradient(140deg,#0f9d70,#34d399); }
.level-btn.mid{ background:linear-gradient(140deg,#1d4ed8,#38bdf8); }
.level-btn.hard{ background:linear-gradient(140deg,#b91c66,#f472b6); }
.level-btn.custom{ background:linear-gradient(140deg,#92400e,#fbbf24); color:#fff; }

/* =========================================================
   PANTALLA "CREA TU EJERCICIO"
   ========================================================= */
.form-title{ font-size:clamp(1.2rem,3.6vw,1.5rem); font-weight:800; text-align:center; margin-bottom:4px; }
.form-sub{ color:var(--text-dim); text-align:center; margin-bottom:18px; font-size:.95rem; }

.addend-row{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:12px;
}
.addend-index{
  width:26px; text-align:right; color:var(--text-faint); font-weight:700; flex:0 0 auto;
}
.addend-input{
  flex:0 1 180px;
  min-width:0;
  background:var(--surface-strong);
  border:2px solid var(--border-soft);
  border-radius:var(--r-sm);
  color:var(--text);
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1.1rem, 3.2vw, 1.35rem);
  text-align:center;
  padding:12px 10px;
  min-height:var(--tap-min);
  letter-spacing:1px;
}
.addend-input::placeholder{ color:var(--text-faint); font-family:var(--font-body); font-weight:600; font-size:.85em;}
.addend-remove{
  flex:0 0 auto;
  width:var(--tap-min); height:var(--tap-min);
  border-radius:50%;
  background:rgba(251,113,133,.18);
  border:1px solid var(--error);
  color:var(--error);
  font-size:1.2rem;
  font-weight:800;
  cursor:pointer;
}
.dashed-btn{
  width:100%;
  max-width:220px;
  margin-left:auto; margin-right:auto;
  display:block;
  padding:12px;
  border-radius:var(--r-sm);
  border:2px dashed var(--border-soft);
  background:transparent;
  color:var(--text-dim);
  font-weight:700;
  cursor:pointer;
  min-height:var(--tap-min);
  margin-bottom:18px;
}
.dashed-btn:hover{ border-color:var(--text-dim); color:var(--text); }
.dashed-btn:disabled{ opacity:.4; cursor:not-allowed; }

.primary-btn{
  width:100%;
  padding:14px;
  border-radius:var(--r-md);
  border:none;
  background:linear-gradient(135deg, var(--primary), #10b981);
  color:#062b1c;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1rem, 2.8vw, 1.15rem);
  cursor:pointer;
  min-height:52px;
  box-shadow:0 6px 18px rgba(52,211,153,.35);
  transition:transform .12s, box-shadow .12s;
}
.primary-btn:hover{ transform:translateY(-2px); }
.primary-btn:active{ transform:scale(.98); }
.primary-btn:disabled{
  background:#4b4b5a; color:#9a9aab; box-shadow:none; cursor:not-allowed; transform:none;
}
.form-error{
  color:var(--error);
  text-align:center;
  font-weight:700;
  font-size:.9rem;
  min-height:1.4em;
  margin-bottom:10px;
}

/* =========================================================
   PANTALLA DE EJERCICIO
   ========================================================= */
.hint-box{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-md);
  padding:12px 14px;
  margin-bottom:16px;
  width:100%;
  font-size:clamp(.82rem, 2.1vw, .95rem);
  line-height:1.45;
}
.hint-box .bulb{ font-size:1.2em; flex:0 0 auto; }
.hint-box b{ color:var(--accent); }
.hint-box .ok{ color:var(--primary); }

/* =========================================================
   MODAL (llevada / totales de columna)
   ========================================================= */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(10,4,30,.6);
  backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center;
  padding:16px;
  z-index:700;
}
.modal-box{
  width:100%; max-width:400px;
  background:linear-gradient(160deg, #2c1468, #4c1d95);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(18px,4vw,26px);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.modal-close-x{
  position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
  border:1px solid var(--border-soft); background:var(--surface); color:var(--text);
  cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; z-index:5;
}
@keyframes popIn{
  from{ transform:scale(.85); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}
@keyframes monedaFlota{
  0%{ transform:translateY(0); opacity:0; }
  15%{ opacity:1; }
  100%{ transform:translateY(-24px); opacity:0; }
}
.modal-eyebrow{
  font-size:.78rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent); margin-bottom:6px; text-align:center;
}
.modal-title{
  font-size:clamp(1.05rem, 3.2vw, 1.25rem);
  text-align:center;
  margin-bottom:14px;
  line-height:1.4;
}
.modal-title b{ color:var(--accent-soft); }
.modal-fields{
  display:flex; gap:12px; justify-content:center; margin-bottom:14px; flex-wrap:wrap;
}
.modal-field{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.modal-field label{ font-size:.8rem; color:var(--text-dim); font-weight:700; text-align:center; max-width:11em; }
.modal-field input{
  width:80px;
  text-align:center;
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.3rem;
  padding:10px 6px;
  border-radius:var(--r-sm);
  border:2px solid var(--border-soft);
  background:var(--surface-strong);
  color:var(--text);
  min-height:var(--tap-min);
}
.modal-feedback{
  text-align:center; min-height:1.6em; font-weight:700; margin-bottom:10px; font-size:.9rem;
}
.modal-feedback.err{ color:var(--error); }
.modal-feedback.ok{ color:var(--primary); }
.modal-actions{ display:flex; gap:10px; }
.modal-actions button{ flex:1; }
.secondary-btn{
  padding:12px; border-radius:var(--r-md); border:1px solid var(--border-soft);
  background:transparent; color:var(--text-dim); font-weight:700; cursor:pointer;
  min-height:48px;
}

/* =========================================================
   PANTALLA DE RESULTADO / CELEBRACIÓN
   ========================================================= */
.result-hero{
  font-size:clamp(2.2rem, 9vw, 3.4rem);
  text-align:center;
}
.result-title{
  font-size:clamp(1.3rem, 4vw, 1.8rem);
  text-align:center;
  margin:8px 0 4px;
}
.result-eq{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.6vw, 1.6rem);
  text-align:center;
  color:var(--primary);
  margin-bottom:20px;
  word-break:break-word;
}
.result-actions{
  display:flex; gap:12px; width:100%; flex-wrap:wrap;
}
.result-actions button{ flex:1 1 160px; }

.confetti-piece{
  position:fixed; top:-10px; z-index:800;
  border-radius:2px;
  animation: fall linear forwards;
  pointer-events:none;
}
@keyframes fall{
  to{ transform:translateY(105vh) rotate(360deg); opacity:.9; }
}

/* =========================================================
   BARRA DE PROGRESO DE COLUMNAS
   ========================================================= */
.progress-track{
  display:flex; gap:6px; width:100%; margin-bottom:16px;
}
.progress-seg{
  flex:1; height:6px; border-radius:4px; background:rgba(255,255,255,.12);
  overflow:hidden;
}
.progress-seg .fill{
  height:100%; width:0%; background:linear-gradient(90deg, var(--primary), var(--blue));
  transition:width .4s ease;
}

/* utilidad de botón de sonido */
.sound-icon{ font-size:1.1em; }

/* =========================================================
   MULTIPLICACIÓN ÁRABE — retícula (propio del recurso)
   ========================================================= */
:root{
  --ink:var(--text); --ink-soft:var(--text-dim); --ink-faint:var(--text-faint);
  --brass:#fbbf24; --brass-dark:#f59e0b; --success:#34d399; --success-bg:rgba(52,211,153,.15);
  --error-bg:rgba(251,113,133,.15); --radius-s:10px; --radius-m:16px; --radius-l:22px;
  --font-num:var(--font-display); --font-ui:var(--font-body);
  --cell-size:calc(var(--cell-base,56px) * var(--f,1));
}
#vista{ width:100%; display:flex; flex-direction:column; }
.hero{ text-align:center; }
.problema-pill{
  align-self:center; font-family:var(--font-num); font-weight:800; letter-spacing:.04em;
  font-size:calc(clamp(1.3rem,4.4vw,1.9rem) * var(--f,1)); color:#fff;
  background:linear-gradient(150deg, rgba(44,20,104,.75), rgba(30,17,71,.75));
  box-shadow:inset 0 0 0 1px rgba(196,181,253,.35); border-radius:16px;
  padding:calc(6px * var(--f,1)) calc(22px * var(--f,1)); margin:0 0 calc(12px * var(--f,1));
}
.lattice-card{ width:100%; display:flex; flex-direction:column; align-items:center; padding:calc(4px * var(--f,1)) 0 0; }
.lattice-row{ display:flex; align-items:flex-start; gap:6px; }
.lattice-left{ display:flex; flex-direction:column; }
.top-digits, .side-digits{ display:flex; }
.top-digits{ justify-content:flex-end; margin-bottom:5px; gap:4px; }
.side-digits{ flex-direction:column; margin-top:calc(var(--cell-size) * .62 + 5px); gap:4px; margin-left:4px; }
.digit-box{
  width:var(--cell-size); height:calc(var(--cell-size) * .62); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .46); color:#fff;
  background:linear-gradient(150deg, rgba(124,58,237,.45), rgba(44,20,104,.7)); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.45);
  border:none; border-radius:12px; text-shadow:0 2px 6px rgba(0,0,0,.45);
}
.side-digits .digit-box{ width:calc(var(--cell-size) * .72); height:var(--cell-size); }
.grid-boxes{ display:grid; gap:4px; }
.lcell{
  width:var(--cell-size); height:var(--cell-size); position:relative; overflow:hidden; border-radius:10px;
  border:2px solid rgba(196,181,253,.75); background:rgba(30,17,71,.55); box-shadow:0 0 14px rgba(124,58,237,.25);
}
.lcell .tri{ position:absolute; inset:0; transition:background-color .35s ease, opacity .35s ease; }
.tri-tens{ clip-path:polygon(0 0,100% 0,0 100%); background:rgba(255,255,255,.05); }
.tri-ones{ clip-path:polygon(100% 0,100% 100%,0 100%); background:rgba(255,255,255,.1); }
.tri.diag-dim{ opacity:.35; } .tri.diag-active{ opacity:1; }
.cell-num{
  position:absolute; z-index:2; font-family:var(--font-num); font-weight:800; line-height:1; pointer-events:none;
  font-size:calc(var(--cell-size) * .36); color:#fff; text-shadow:0 2px 5px rgba(0,0,0,.5);
}
.cell-num.tens-pos{ top:12%; left:12%; } .cell-num.ones-pos{ bottom:10%; right:12%; }
.lcell input.cell-input{
  position:absolute; z-index:2; width:42%; height:42%; border:none; border-radius:7px; padding:0; outline:none;
  background:rgba(8,3,26,.55); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.5); text-align:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .32); color:#fff; user-select:text; -webkit-user-select:text;
}
.lcell input.cell-input.tens-pos{ top:6%; left:6%; } .lcell input.cell-input.ones-pos{ bottom:6%; right:6%; }
.lcell input.cell-input:focus{ background:rgba(124,58,237,.5); box-shadow:0 0 0 2.5px var(--brass), 0 0 14px rgba(251,191,36,.6); }
.lcell input.cell-input.wrong-flash{ background:var(--error-bg); box-shadow:0 0 0 2.5px var(--error); }

.diag-section{ margin-top:calc(22px * var(--f,1)); width:100%; display:flex; flex-direction:column; align-items:center; }
.diag-section h3{ font-size:calc(.86rem * var(--f,1)); font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin-bottom:calc(30px * var(--f,1)); text-align:center; }
.diag-row{ display:flex; gap:calc(8px * var(--f,1)); align-items:flex-end; flex-wrap:wrap; justify-content:center; }
.diag-box-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; }
.carry-badge{
  position:absolute; top:calc(-24px * var(--f,1)); left:50%; transform:translateX(-50%) scale(0); opacity:0;
  font-family:var(--font-num); font-weight:800; font-size:.8rem; color:#3b2405; background:var(--brass);
  border-radius:999px; padding:2px 9px; white-space:nowrap; box-shadow:0 0 10px rgba(251,191,36,.7);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
}
.carry-badge.show{ transform:translateX(-50%) scale(1); opacity:1; }
.diag-box{
  width:calc(clamp(48px,11vw,64px) * var(--f,1)); min-height:calc(clamp(48px,11vw,64px) * var(--f,1));
  border-radius:14px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1));
  border:2.5px solid var(--border-soft); background:rgba(8,3,26,.4); color:var(--text-faint); transition:all .25s ease;
}
.diag-box.pending{ opacity:.55; }
.diag-box input{ width:100%; height:100%; border:none; background:transparent; text-align:center; font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1)); color:#fff; outline:none; user-select:text; -webkit-user-select:text; }
.diag-box.wrong{ animation:shake .32s ease; }
.carry-fly{
  position:fixed; z-index:3000; font-family:var(--font-num); font-weight:800; font-size:.95rem; color:#3b2405;
  background:var(--brass); border-radius:999px; padding:4px 10px; pointer-events:none;
  transition:transform .55s cubic-bezier(.3,.6,.4,1), opacity .55s ease;
}
.final-banner{
  margin-top:calc(16px * var(--f,1)); text-align:center; background:var(--success-bg); border:2px solid var(--success);
  color:var(--success); border-radius:16px; padding:calc(10px * var(--f,1)) 20px; font-weight:800;
  font-family:var(--font-num); font-size:calc(clamp(1.1rem,3.8vw,1.5rem) * var(--f,1));
}
.arabe-final{ width:100%; display:flex; flex-direction:column; align-items:center; }
.arabe-final .mv-fila-chip{ margin-top:calc(8px * var(--f,1)); }
.arabe-final .result-actions{ margin-top:calc(14px * var(--f,1)); }
.setup-box{ width:100%; max-width:480px; margin:0 auto; text-align:center; }
.setup-box label{ display:block; font-weight:700; font-size:.95rem; color:var(--text-dim); margin-bottom:16px; }
.factor-input-row{ display:flex; align-items:center; justify-content:center; gap:clamp(10px,3vw,18px); }
.factor-input{
  width:100%; max-width:150px; font-family:var(--font-num); font-weight:800; font-size:clamp(1.6rem,7vw,2.2rem);

:root{
  color-scheme: dark;
  --bg-1:#1e1147; --bg-2:#3b1785; --bg-3:#5b21b6;
  --primary:#34d399; --accent:#fbbf24; --error:#fb7185; --blue:#38bdf8; --pink:#f472b6;
  --text:#f6f3ff; --text-dim:#c9bdf0; --text-faint:#8f7fc4;
  --surface:rgba(255,255,255,.07); --surface-strong:rgba(255,255,255,.12);
  --border-soft:rgba(255,255,255,.16);
  --shadow:0 14px 34px rgba(0,0,0,0.4);
  --radius:20px; --radius-sm:12px;
  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;
  --transition: all .2s cubic-bezier(.4,0,.2,1);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body.en-juego{ overflow:hidden; height:100dvh; min-height:0; user-select:none; -webkit-user-select:none; }

button{ font-family:inherit; }

h1,h2,h3{ font-family:var(--font-display); margin:0; }

.hidden{ display:none !important; }

.screen{ display:none; animation:fadeIn .35s ease; }

.screen.active{ display:block; }

@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }


/* ---------- Juego (sin scroll) ---------- */
#screen-juego{ height:100dvh; grid-template-rows:auto minmax(0,1fr); overflow:hidden; }

#screen-juego.active{ display:grid; }

.nivel-pill{
  display:inline-flex; align-items:center; justify-content:center;
  background:rgba(251,191,36,.14); border:1px solid rgba(251,191,36,.4); color:var(--accent);
  padding:6px 12px; border-radius:999px; font-family:var(--font-display); font-weight:800;
  font-size:.74rem; text-transform:uppercase; letter-spacing:.05em; white-space:nowrap;
}

.topbar-der{ justify-self:end; display:flex; gap:6px; }

.btn{
  font-family:var(--font-display); font-weight:700; font-size:13px; cursor:pointer; transition:var(--transition);
  background:var(--surface); border:1px solid var(--border-soft); color:var(--text); padding:7px 14px; border-radius:999px;
}

.btn:hover{ background:var(--surface-strong); }

.btn.icono{ width:38px; height:38px; padding:0; font-size:19px; display:inline-flex; align-items:center; justify-content:center; }

.btn.verde{ background:linear-gradient(140deg,#0f9d70,var(--primary)); color:#04281c; border-color:transparent; font-weight:800; font-size:15px; padding:9px 22px; }


.juego-main{
  width:100%; max-width:1050px; margin:0 auto; height:100%; min-height:0;
  padding:0 14px 40px; display:grid; grid-template-rows:auto minmax(0,1fr) auto auto auto; gap:6px; justify-items:center;
}

.meta{
  display:flex; align-items:center; gap:10px; margin:0;
  font-family:var(--font-display); font-weight:800; font-size:clamp(1.1rem,4.6vw,1.6rem);
  background:var(--surface); border:1px solid var(--border-soft); padding:5px 20px; border-radius:999px;
}

.meta small{ font-family:var(--font-body); font-weight:700; font-size:.55em; color:var(--text-dim); }

.frac{ display:inline-flex; flex-direction:column; align-items:center; line-height:1; margin:0 4px; vertical-align:middle; color:var(--accent); font-size:1.15em; }

.frac .n{ border-bottom:3px solid currentColor; padding:0 6px 1px; }

.frac .d{ padding-top:1px; }


.stage{ min-height:0; width:100%; display:grid; place-items:center; padding:4px 0; container-type:size; }

.glasswrap{ position:relative; width:min(100cqw, 75cqh); height:min(100cqh, 133.33cqw); display:flex; flex-direction:column; }

.glass{
  position:relative; flex:1; min-height:0;
  border:4px solid rgba(231,227,255,.55); border-top-width:3px; border-radius:10px 10px 22px 22px;
  background:rgba(255,255,255,.04); overflow:hidden; box-shadow:var(--shadow);
}

#agua{
  position:absolute; left:0; right:0; bottom:0; height:0%;
  background:linear-gradient(180deg,#38bdf8 0%,#0ea5e9 100%); border-top:3px solid rgba(255,255,255,.75);
  transition:height .08s linear;
}

#agua.ok{ background:linear-gradient(180deg,#34d399,#10b981); }

#agua.mal{ background:linear-gradient(180deg,#fb7185,#f43f5e); }

.base{ height:10px; border-radius:0 0 14px 14px; background:rgba(231,227,255,.35); margin:0 6px; }


.controls{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }

.ctl{
  font-family:var(--font-display); font-weight:800; font-size:clamp(.9rem,3.2vw,1.1rem);
  border:none; border-radius:999px; padding:10px 20px; cursor:pointer; color:#12203a;
  display:flex; align-items:center; gap:8px; touch-action:none;
}

.ctl:active{ transform:scale(.96); }

#echar{ background:#38bdf8; box-shadow:0 4px 0 rgba(14,165,233,.5); }

#sacar{ background:#fbbf24; box-shadow:0 4px 0 rgba(217,119,6,.45); }

#vaciar{ background:var(--surface-strong); color:var(--text); border:1px solid var(--border-soft); box-shadow:none; font-weight:700; }

#msg{ min-height:2.6em; margin:0; padding:0 8px; text-align:center; font-weight:800; font-size:clamp(.85rem,3.4vw,1.05rem); line-height:1.25; display:flex; align-items:center; justify-content:center; }

#msg.gana{ color:var(--primary); }
 #msg.falta{ color:var(--error); }
 #msg.pasate{ color:var(--accent); }
 #msg.info{ color:var(--text-dim); font-weight:700; }

.hud{ display:flex; gap:14px; align-items:center; font-weight:700; font-size:.9rem; color:var(--text-dim); font-family:var(--font-display); }

.hud b{ color:var(--accent); }


#final{ position:fixed; inset:0; background:rgba(14,6,40,.88); backdrop-filter:blur(4px); display:none; place-items:center; z-index:100000; }

#final.visible{ display:grid; }

.final-card{
  background:rgba(59,23,133,.92); border:1px solid var(--border-soft); border-radius:var(--radius);
  padding:28px 32px; text-align:center; max-width:90vw; box-shadow:var(--shadow);
}

.final-card h2{ font-size:1.8rem; color:var(--accent); margin-bottom:8px; }

.final-card p{ margin:0 0 16px; color:var(--text); font-weight:700; }

.final-card .stars{ font-size:2rem; margin-bottom:12px; }

.final-card .fila{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }


@media(max-width:600px){
  .app-topbar{ padding:6px 62px 4px 8px; gap:6px; }
  .icon-btn{ padding:7px 11px; font-size:.82rem; }
  .btn.icono{ width:34px; height:34px; font-size:17px; }
  .juego-main{ padding:0 8px 40px; gap:5px; }
}

@media(max-height:480px){
  .app-topbar{ padding-top:3px; padding-bottom:2px; min-height:48px; }
  .btn.icono{ width:30px; height:30px; }
  .juego-main{ gap:3px; padding-bottom:36px; }
  .meta{ padding:2px 16px; font-size:1.05rem; }
  .ctl{ padding:6px 16px; }
  #msg{ min-height:1.3em; font-size:.82rem; }
  .hud{ font-size:.8rem; }
}

2.94 -4.84,1.35 -3.42,7.69 -9.00,4.37 -14.58,7.69 -13.16,1.35 -18.04,-2.94 -11.57,-3.54" fill="#fde68a" stroke="#92400e" stroke-width="1" stroke-linejoin="round"/><polygon points="9.00,-9.50 11.57,-3.54 18.04,-2.94 13.16,1.35 14.58,7.69 9.00,4.37 3.42,7.69 4.84,1.35 -0.04,-2.94 6.43,-3.54" fill="#fde68a" stroke="#92400e" stroke-width="1" stroke-linejoin="round"/></g><text class="sv-t" font-size="11" style="font-size:11px"><textPath href="#l2l0" startOffset="50%" text-anchor="middle">Intermedio</textPath></text></svg></button><button type="button" class="level-btn mv-nivel n3" data-nivel="dificil" aria-label="Difícil"><span class="fondo"></span><svg class="plan-svg" viewBox="0 0 100 100" aria-hidden="true"><defs><path id="l3l0" d="M 4 80 Q 50 92 96 80"/></defs><g transform="translate(50 46) scale(1.22)" filter="url(#fIco)"><polygon points="0.00,-15.50 2.30,-10.16 8.08,-9.63 3.72,-5.79 5.00,-0.12 0.00,-3.09 -5.00,-0.12 -3.72,-5.79 -8.08,-9.63 -2.30,-10.16" fill="#fde68a" stroke="#92400e" stroke-width="1" stroke-linejoin="round"/><polygon points="-10.00,-2.50 -7.70,2.84 -1.92,3.37 -6.28,7.21 -5.00,12.88 -10.00,9.91 -15.00,12.88 -13.72,7.21 -18.08,3.37 -12.30,2.84" fill="#fde68a" stroke="#92400e" stroke-width="1" stroke-linejoin="round"/><polygon points="10.00,-2.50 12.30,2.84 18.08,3.37 13.72,7.21 15.00,12.88 10.00,9.91 5.00,12.88 6.28,7.21 1.92,3.37 7.70,2.84" fill="#fde68a" stroke="#92400e" stroke-width="1" stroke-linejoin="round"/></g><text class="sv-t" font-size="11" style="font-size:11px"><textPath href="#l3l0" startOffset="50%" text-anchor="middle">Difícil</textPath></text></svg></button></div><ul class="niv-leyenda"><li><span class="pt" style="background:#34d399"></span><b>Fácil</b><span>mitades, tercios, cuartos y quintos</span></li><li><span class="pt" style="background:#38bdf8"></span><b>Intermedio</b><span>sextos, octavos y décimos</span></li><li><span class="pt" style="background:#f472b6"></span><b>Difícil</b><span>séptimos, novenos y doceavos</span></li></ul></div></div></main></div></div>
<div class="screen" id="screen-juego">
  <div class="app-topbar"><button class="icon-btn btn-orbita v-azul" id="bVolver" type="button" title="Volver" aria-label="Volver"><span class="bola"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 5l-7 7 7 7"/></svg></span></button><div class="centro"><span class="nivel-pill" id="nivelPill"></span></div><div class="topbar-der"><button class="btn icono" id="sonido" title="Sonido" aria-label="Sonido">🔊</button><button class="btn icono" id="pantalla" title="Pantalla completa" aria-label="Pantalla completa">⛶</button><a class="icon-btn btn-orbita v-violeta" href="../index.html" title="Ir al inicio" aria-label="Ir al inicio"><span class="bola"><svg viewBox="0 0 24 24"><path d="M3.5 11.5 12 4l8.5 7.5M6 10v9h12v-9M10 19v-5h4v5"/></svg></span></a></div></div>
  <main class="juego-main">
    <div class="meta" id="meta"></div>
    <div class="stage"><div class="glasswrap"><div class="glass"><div id="agua"></div></div><div class="base"></div></div></div>
    <div class="controls">
      <button class="ctl" id="echar">🚰 Echar agua</button>
      <button class="ctl" id="sacar">💧 Sacar agua</button>
      <button class="ctl" id="vaciar">Vaciar</button>
      <button class="ctl" id="sigBtn" type="button" style="display:none;background:linear-gradient(140deg,#f59e0b,#fbbf24);color:#3d1f00;box-shadow:0 4px 0 rgba(180,83,9,.5)">Siguiente →</button>
    </div>
    <div id="msg" class="info" role="status" aria-live="polite"></div>
    <div class="hud"><span>Ejercicio <b id="num">1</b> de <b>10</b></span><span>⭐ Primera vez: <b id="racha">0</b></span></div>
  </main>
</div>

<div id="final">
  <div class="final-card">
    <h2>¡Lo lograste!</h2>
    <div class="stars" id="starsFinal">⭐</div>
    <p id="textoFinal"></p>
    <div class="fila"><button class="btn verde" id="reiniciar">Jugar otra vez</button><button class="btn" id="cambiarNivel">Cambiar de nivel</button></div>
  </div>
</div>

<script>

(function(){
  'use strict';
  var TOL = 3;                       // tolerancia fija ±3 puntos porcentuales
  var RATE = 26;                     // % por segundo al echar/sacar
  var TOTAL = 10;
  var NIVELES = {
    facil:      { nombre:'Fácil',      dens:[2,3,4,5] },
    intermedio: { nombre:'Intermedio', dens:[6,8,10] },
    dificil:    { nombre:'Difícil',    dens:[7,9,12] }
  };
  var nivelClave='facil', EJ=[];
  var idx=0, nivel=0, intentos=0, racha=0, bloqueado=false, sonidoOn=true;
  var dir=0, raf=null, tPrev=0, tSig=null, pend=0, mover=false, tHold=null;
  var PASO_FINO = 1, ESPERA_FLUJO = 220;   // un toque corto mueve ±1 %; si se mantiene, fluye
  var AlumnoActual=null;

  var $=function(id){ return document.getElementById(id); };
  var agua=$('agua'), meta=$('meta'), msg=$('msg'), num=$('num'), rachaEl=$('racha'), final=$('final');

  function mcd(a,b){ return b===0?a:mcd(b,a%b); }
  function mezclar(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  // Ejercicios al azar del nivel, sin repetir seguidos y recorriendo todo el banco antes de repetir
  function generarEjercicios(dens){
    var pool=[]; dens.forEach(function(d){ for(var n=1;n<d;n++) if(mcd(n,d)===1) pool.push([n,d]); });
    var arr=[];
    while(arr.length<TOTAL){
      var p=mezclar(pool.slice());
      if(arr.length && p.length>1 && p[0][0]===arr[arr.length-1][0] && p[0][1]===arr[arr.length-1][1]){ var t=p[0]; p[0]=p[1]; p[1]=t; }
      arr=arr.concat(p);
    }
    return arr.slice(0,TOTAL);
  }

  /* ---------- Sonido ---------- */
  var ctxAudio=null, ruidoGain=null;
  function audio(){
    if(!ctxAudio){
      try{
        ctxAudio=new (window.AudioContext||window.webkitAudioContext)();
        var len=ctxAudio.sampleRate*1, buf=ctxAudio.createBuffer(1,len,ctxAudio.sampleRate), d=buf.getChannelData(0);
        for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
        var src=ctxAudio.createBufferSource(); src.buffer=buf; src.loop=true;
        var filtro=ctxAudio.createBiquadFilter(); filtro.type='lowpass'; filtro.frequency.value=900;
        ruidoGain=ctxAudio.createGain(); ruidoGain.gain.value=0;
        src.connect(filtro); filtro.connect(ruidoGain); ruidoGain.connect(ctxAudio.destination);
        src.start();
      }catch(e){}
    }
    if(ctxAudio&&ctxAudio.state==='suspended') ctxAudio.resume();
    return ctxAudio;
  }
  function tono(f,t,dur,tipo,vol){
    if(!sonidoOn) return; var a=audio(); if(!a) return;
    var o=a.createOscillator(),g=a.createGain();
    o.type=tipo||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(vol||.15,a.currentTime+t);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+dur);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime+t); o.stop(a.currentTime+t+dur+.05);
  }
  function ruido(on){ if(ruidoGain){ ruidoGain.gain.setTargetAtTime(on&&sonidoOn?.06:0, audio().currentTime, .05); } }
  function exitoSon(){ tono(523,0,.15); tono(659,.12,.15); tono(784,.24,.3); }
  function errorSon(){ tono(180,0,.2,'square',.08); }

  function pct(x){ return x.toFixed(1).replace('.',','); }
  function fracHTML(n,d){ return '<span class="frac"><span class="n">'+n+'</span><span class="d">'+d+'</span></span>'; }
  function pinta(){ agua.style.height=Math.max(0,Math.min(100,nivel))+'%'; }
  function metaActual(){ return EJ[idx][0]/EJ[idx][1]*100; }
  function actividad(){ document.dispatchEvent(new Event('click')); }   // el motor de monedas cuenta click/teclado

  function textoInicial(){ msg.className='info'; msg.textContent='Mantén presionado para echar agua y suelta donde creas que está. Un toque rápido ajusta de a 1 %.'; }
  function mostrarMeta(){ meta.innerHTML='Llena '+fracHTML(EJ[idx][0],EJ[idx][1])+' <small>del recipiente</small>'; }

  function enLinea(ok){ if(window.TallerOnline) TallerOnline.resultado(ok); }
  function registrarCompletado(){
    if(AlumnoActual && typeof window.reportarProgresoPractica==='function'){
      window.reportarProgresoPractica(AlumnoActual.id,'taller-fracciones',1,0, ({facil:1,intermedio:2,dificil:3})[nivelClave] || 1);
    }
  }

  function mostrarSig(v){ $('sigBtn').style.display=v?'':'none'; ['echar','sacar','vaciar'].forEach(function(i){ $(i).style.display=v?'none':''; }); }

  function evalua(){
    if(bloqueado) return;
    intentos++;
    var objetivo=metaActual(), dif=nivel-objetivo;
    if(Math.abs(dif)<=TOL){
      bloqueado=true;
      agua.className='ok'; pinta();
      if(intentos===1){ racha++; rachaEl.textContent=racha; }
      msg.className='gana';
      msg.innerHTML='¡Justo! Llenaste '+pct(nivel)+'% ≈ '+fracHTML(EJ[idx][0],EJ[idx][1])+' del recipiente';
      exitoSon(); ruido(false); registrarCompletado(); enLinea(true);
      if(window.TallerOnline && TallerOnline.cont && TallerOnline.cont.activo){ tSig=setTimeout(siguiente,1200); } else { mostrarSig(true); }
    }else if(dif<0){
      if(intentos===1) enLinea(false);
      agua.className='mal'; pinta(); msg.className='falta';
      msg.innerHTML='Vas en '+pct(nivel)+'%: aún falta para '+fracHTML(EJ[idx][0],EJ[idx][1])+'. Sigue echando agua.';
      errorSon();
    }else{
      if(intentos===1) enLinea(false);
      agua.className='mal'; pinta(); msg.className='pasate';
      msg.innerHTML='Vas en '+pct(nivel)+'%: te pasaste de '+fracHTML(EJ[idx][0],EJ[idx][1])+'. Saca un poco de agua.';
      errorSon();
    }
    setTimeout(function(){ if(!bloqueado){ agua.className=''; pinta(); } },700);
  }

  function siguiente(){
    tSig=null; idx++; mostrarSig(false);
    if(idx>=EJ.length){
      if(window.TallerOnline && TallerOnline.cont.activo){ EJ=generarEjercicios(NIVELES[nivelClave].dens); idx=0; }   // contrarreloj: no se acaban
      else { terminar(); return; }
    }
    nivel=0; intentos=0; bloqueado=false;
    agua.className=''; pinta(); num.textContent=idx+1;
    mostrarMeta(); textoInicial();
  }

  function terminar(){
    var s=''; for(var i=0;i<Math.max(1,racha);i++) s+='⭐';
    $('starsFinal').textContent=s;
    $('textoFinal').textContent='Alistaste '+racha+' de '+TOTAL+' recipientes al primer intento.';
    final.classList.add('visible');
    tono(659,0,.15); tono(784,.15,.15); tono(988,.3,.4);
  }

  function empezarNivel(clave){
    if(window.TallerOnline) TallerOnline.iniciar();
    nivelClave=clave; var nv=NIVELES[clave];
    EJ=generarEjercicios(nv.dens);
    clearTimeout(tSig); tSig=null;
    idx=0; nivel=0; intentos=0; racha=0; bloqueado=false; dir=0; pend=0; mover=false; clearTimeout(tHold);
    rachaEl.textContent='0'; num.textContent='1'; agua.className=''; pinta();
    $('nivelPill').textContent=nv.nombre;
    mostrarMeta(); textoInicial();
    final.classList.remove('visible'); mostrarSig(false);
    switchScreen('screen-juego');
  }

  /* ---------- Mantener presionado ---------- */
  function empieza(d,e){
    e.preventDefault();
    if(bloqueado) return;
    audio(); pend=d; mover=false;
    clearTimeout(tHold);
    tHold=setTimeout(function(){
      if(pend===0) return;
      mover=true; dir=pend; tPrev=performance.now(); ruido(true);
      if(!raf) raf=requestAnimationFrame(paso);
    }, ESPERA_FLUJO);
  }
  function paso(t){
    var dt=(t-tPrev)/1000; tPrev=t;
    nivel=Math.max(0,Math.min(100,nivel+dir*RATE*dt));
    if(!bloqueado) agua.className='';
    pinta();
    if(dir!==0) raf=requestAnimationFrame(paso); else raf=null;
  }
  function suelta(){
    if(pend===0) return;
    var d=pend; pend=0; clearTimeout(tHold);
    if(mover){
      dir=0; ruido(false); mover=false;
      if(raf){ cancelAnimationFrame(raf); raf=null; }
    } else {                                   // toque corto: ajuste fino
      nivel=Math.max(0,Math.min(100,nivel+d*PASO_FINO));
      agua.className=''; pinta(); tono(d>0?640:460,0,.05,'sine',.08);
    }
    actividad(); evalua();
  }
  [[$('echar'),1],[$('sacar'),-1]].forEach(function(par){
    var b=par[0], d=par[1];
    b.addEventListener('pointerdown',function(e){ empieza(d,e); });
    b.addEventListener('pointerup',suelta);
    b.addEventListener('pointercancel',suelta);
    b.addEventListener('pointerleave',suelta);
    b.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  });
  $('sigBtn').addEventListener('click',function(){ clearTimeout(tSig); siguiente(); });
  $('vaciar').addEventListener('click',function(){
    if(bloqueado) return;
    nivel=0; pinta(); msg.className='info'; msg.textContent='Recipiente vacío. Comienza de nuevo.';
  });

  var bSonido=$('sonido');
  bSonido.addEventListener('click',function(){ sonidoOn=!sonidoOn; bSonido.textContent=sonidoOn?'🔊':'🔇'; if(!sonidoOn) ruido(false); });
  $('pantalla').addEventListener('click',function(){
    if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  });
  // Desafío Online: el profesor fija el nivel; se entra directo y los demás quedan bloqueados.
  window.TallerOnlineListo = function(O){
    if(!(O.sub && NIVELES[O.sub])) return;
    document.querySelectorAll('[data-nivel]').forEach(function(b){
      if(b.dataset.nivel!==O.sub){ b.disabled=true; b.style.opacity='.35'; b.style.pointerEvents='none'; }
    });
    empezarNivel(O.sub);
  };
  $('reiniciar').addEventListener('click',function(){ empezarNivel(nivelClave); });
  $('cambiarNivel').addEventListener('click',function(){ final.classList.remove('visible'); switchScreen('screen-home'); });
  $('bVolver').addEventListener('click',function(){ clearTimeout(tSig); tSig=null; dir=0; pend=0; mover=false; clearTimeout(tHold); ruido(false); switchScreen('screen-home'); });
  document.querySelectorAll('[data-nivel]').forEach(function(b){ b.addEventListener('click',function(){ empezarNivel(b.dataset.nivel); }); });

function switchScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  document.body.classList.toggle('en-juego', id === 'screen-juego');
  window.scrollTo(0, 0);
}
function iniciarHeartbeatTiempo(){
  if(typeof window.iniciarHeartbeatMathverse==='function') window.iniciarHeartbeatMathverse(function(){ return AlumnoActual && AlumnoActual.id; },'taller-fracciones');
  else setTimeout(iniciarHeartbeatTiempo,100);
}
try{ var _g=JSON.parse(sessionStorage.getItem('profehoracio_alumno_actual')||'null'); if(_g && _g.id && _g.nombre){ AlumnoActual=_g; iniciarHeartbeatTiempo(); } }catch(e){}
switchScreen('screen-home');
})();

</script>
<script>
(function(){
  function montar(n){ n=n||0;
    if(typeof window.montarChipCompanero==='function'){ var e=document.getElementById('mvChipHome'); if(e && !e.dataset.mv){ e.dataset.mv='1'; window.montarChipCompanero(e,{grande:true}); } }
    else if(n<100){ setTimeout(function(){ montar(n+1); },100); } }
  montar();
  var raiz=document.documentElement, home=document.getElementById('screen-home'), pend=false;
  function ajustar(){ pend=false; raiz.style.setProperty('--fz','1');
    if(!home || !home.classList.contains('active')) return;
    var f=1,g=0; while(raiz.scrollHeight-window.innerHeight>1 && f>0.5 && g++<16){ f=Math.max(0.5,f-0.04); raiz.style.setProperty('--fz',f.toFixed(2)); } }
  function pedir(){ if(!pend){ pend=true; requestAnimationFrame(ajustar); } }
  window.addEventListener('resize',pedir); window.addEventListener('load',function(){ pedir(); setTimeout(pedir,800); });
  if(home) new MutationObserver(pedir).observe(home,{attributes:true,attributeFilter:['class']});
  pedir();
})();
</script>
<script type="module" src="../mathverse-core.js"></script>
<script>window.TALLER_ACTIVIDAD='llenando';</script>
