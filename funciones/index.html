<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Laboratorio de Números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS DE DISEÑO
   ========================================================= */
:root{
  color-scheme: dark;
  --bg-1:#1e1147;
  --bg-2:#3b1785;
  --bg-3:#5b21b6;
  --surface:rgba(255,255,255,.07);
  --surface-strong:rgba(255,255,255,.12);
  --border-soft:rgba(255,255,255,.14);

  --primary:#34d399;
  --primary-dark:#0f9d70;
  --accent:#fbbf24;
  --accent-soft:#fde68a;
  --pink:#f472b6;
  --blue:#38bdf8;
  --error:#fb7185;
  --error-soft:#3b0f1f;

  --text:#f6f3ff;
  --text-dim:#c9bdf0;
  --text-faint:#8f7fc4;

  --r-lg:22px;
  --r-md:16px;
  --r-sm:10px;

  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;

  --shadow-1: 0 10px 30px rgba(0,0,0,.35);
  --tap-min: 48px;
}

*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; width:100%; overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
h1,h2,h3{font-family:var(--font-display); margin:0;}
button, input{ -webkit-user-select:none; user-select:none; }
input{font-family:inherit;}

.hidden{display:none !important;}
.visually-hidden{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* Foco visible para accesibilidad con teclado */
:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
  border-radius:6px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* =========================================================
   LAYOUT GENERAL
   ========================================================= */
#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding: clamp(10px, 2.5vw, 24px);
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:6px 56px 14px 2px;
  flex-wrap:wrap;
}
.app-header .side{
  display:flex; align-items:center; gap:6px;
  flex:1 1 auto;
  min-width:70px;
}
.app-header .side.right{ justify-content:flex-end; }

.icon-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--surface);
  border:1px solid var(--border-soft);
  color:var(--text);
  padding:9px 12px;
  border-radius:999px;
  font-weight:700;
  font-size:clamp(.75rem, 2vw, .9rem);
  cursor:pointer;
  min-height:var(--tap-min);
  transition: background .15s, transform .1s;
  white-space:nowrap;
}
.icon-btn:hover{ background:var(--surface-strong); }
.icon-btn:active{ transform:scale(.96); }

.brand{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.2vw, 1.6rem);
  flex:0 1 auto;
  white-space:nowrap;
}
.brand .plus{
  display:inline-flex; align-items:center; justify-content:center;
  width:1.5em; height:1.5em;
  background:linear-gradient(135deg, var(--primary), var(--blue));
  border-radius:10px;
  color:#0b1a12;
  font-size:1em;
}

main{ flex:1; display:flex; flex-direction:column; }

.screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  animation: fadeSlideIn .35s ease both;
}
@keyframes fadeSlideIn{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}

.card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(16px, 4vw, 32px);
  box-shadow:var(--shadow-1);
  backdrop-filter: blur(6px);
}

/* =========================================================
   PANTALLA INICIAL
   ========================================================= */
.home-title{
  text-align:center;
  font-size:clamp(1.4rem, 5vw, 2.2rem);
  font-weight:800;
  margin-bottom:6px;
}
.home-sub{
  text-align:center;
  color:var(--text-dim);
  font-size:clamp(.9rem, 2.4vw, 1.05rem);
  margin:0 auto clamp(18px,4vw,28px);
  max-width:46ch;
}
footer.credits{ text-align:center; color: var(--text-faint); font-weight:700; font-size:.78rem; padding:20px 10px 4px; }
.level-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:clamp(10px, 2.5vw, 16px);
  width:100%;
}
@media (max-width:420px){
  .level-grid{ grid-template-columns:1fr; }
}
.level-btn{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:clamp(16px,4vw,22px) 10px;
  border-radius:var(--r-md);
  border:1px solid var(--border-soft);
  color:var(--text);
  cursor:pointer;
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1rem, 2.6vw, 1.15rem);
  min-height:96px;
  transition:transform .15s, box-shadow .15s;
}
.level-btn:hover{ transform:translateY(-3px); }
.level-btn:active{ transform:scale(.97); }
.level-btn .emoji{ font-size:clamp(1.6rem, 5vw, 2.1rem); }
.level-btn.easy{ background:linear-gradient(140deg,#0f9d70,#34d399); }
.level-btn.mid{ background:linear-gradient(140deg,#1d4ed8,#38bdf8); }
.level-btn.hard{ background:linear-gradient(140deg,#b91c66,#f472b6); }
.level-btn.custom{ background:linear-gradient(140deg,#92400e,#fbbf24); color:#fff; }

/* =========================================================
   PANTALLA "CREA TU EJERCICIO"
   ========================================================= */
.form-title{ font-size:clamp(1.2rem,3.6vw,1.5rem); font-weight:800; text-align:center; margin-bottom:4px; }
.form-sub{ color:var(--text-dim); text-align:center; margin-bottom:18px; font-size:.95rem; }

.addend-row{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:12px;
}
.addend-index{
  width:26px; text-align:right; color:var(--text-faint); font-weight:700; flex:0 0 auto;
}
.addend-input{
  flex:0 1 180px;
  min-width:0;
  background:var(--surface-strong);
  border:2px solid var(--border-soft);
  border-radius:var(--r-sm);
  color:var(--text);
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1.1rem, 3.2vw, 1.35rem);
  text-align:center;
  padding:12px 10px;
  min-height:var(--tap-min);
  letter-spacing:1px;
}
.addend-input::placeholder{ color:var(--text-faint); font-family:var(--font-body); font-weight:600; font-size:.85em;}
.addend-remove{
  flex:0 0 auto;
  width:var(--tap-min); height:var(--tap-min);
  border-radius:50%;
  background:rgba(251,113,133,.18);
  border:1px solid var(--error);
  color:var(--error);
  font-size:1.2rem;
  font-weight:800;
  cursor:pointer;
}
.dashed-btn{
  width:100%;
  max-width:220px;
  margin-left:auto; margin-right:auto;
  display:block;
  padding:12px;
  border-radius:var(--r-sm);
  border:2px dashed var(--border-soft);
  background:transparent;
  color:var(--text-dim);
  font-weight:700;
  cursor:pointer;
  min-height:var(--tap-min);
  margin-bottom:18px;
}
.dashed-btn:hover{ border-color:var(--text-dim); color:var(--text); }
.dashed-btn:disabled{ opacity:.4; cursor:not-allowed; }

.primary-btn{
  width:100%;
  padding:14px;
  border-radius:var(--r-md);
  border:none;
  background:linear-gradient(135deg, var(--primary), #10b981);
  color:#062b1c;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1rem, 2.8vw, 1.15rem);
  cursor:pointer;
  min-height:52px;
  box-shadow:0 6px 18px rgba(52,211,153,.35);
  transition:transform .12s, box-shadow .12s;
}
.primary-btn:hover{ transform:translateY(-2px); }
.primary-btn:active{ transform:scale(.98); }
.primary-btn:disabled{
  background:#4b4b5a; color:#9a9aab; box-shadow:none; cursor:not-allowed; transform:none;
}
.form-error{
  color:var(--error);
  text-align:center;
  font-weight:700;
  font-size:.9rem;
  min-height:1.4em;
  margin-bottom:10px;
}

/* =========================================================
   PANTALLA DE EJERCICIO
   ========================================================= */
.hint-box{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-md);
  padding:12px 14px;
  margin-bottom:16px;
  width:100%;
  font-size:clamp(.82rem, 2.1vw, .95rem);
  line-height:1.45;
}
.hint-box .bulb{ font-size:1.2em; flex:0 0 auto; }
.hint-box b{ color:var(--accent); }
.hint-box .ok{ color:var(--primary); }

/* =========================================================
   MODAL (llevada / totales de columna)
   ========================================================= */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(10,4,30,.6);
  backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center;
  padding:16px;
  z-index:700;
}
.modal-box{
  width:100%; max-width:400px;
  background:linear-gradient(160deg, #2c1468, #4c1d95);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(18px,4vw,26px);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.modal-close-x{
  position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
  border:1px solid var(--border-soft); background:var(--surface); color:var(--text);
  cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; z-index:5;
}
@keyframes popIn{
  from{ transform:scale(.85); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}
@keyframes monedaFlota{
  0%{ transform:translateY(0); opacity:0; }
  15%{ opacity:1; }
  100%{ transform:translateY(-24px); opacity:0; }
}
.modal-eyebrow{
  font-size:.78rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent); margin-bottom:6px; text-align:center;
}
.modal-title{
  font-size:clamp(1.05rem, 3.2vw, 1.25rem);
  text-align:center;
  margin-bottom:14px;
  line-height:1.4;
}
.modal-title b{ color:var(--accent-soft); }
.modal-fields{
  display:flex; gap:12px; justify-content:center; margin-bottom:14px; flex-wrap:wrap;
}
.modal-field{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.modal-field label{ font-size:.8rem; color:var(--text-dim); font-weight:700; text-align:center; max-width:11em; }
.modal-field input{
  width:80px;
  text-align:center;
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.3rem;
  padding:10px 6px;
  border-radius:var(--r-sm);
  border:2px solid var(--border-soft);
  background:var(--surface-strong);
  color:var(--text);
  min-height:var(--tap-min);
}
.modal-feedback{
  text-align:center; min-height:1.6em; font-weight:700; margin-bottom:10px; font-size:.9rem;
}
.modal-feedback.err{ color:var(--error); }
.modal-feedback.ok{ color:var(--primary); }
.modal-actions{ display:flex; gap:10px; }
.modal-actions button{ flex:1; }
.secondary-btn{
  padding:12px; border-radius:var(--r-md); border:1px solid var(--border-soft);
  background:transparent; color:var(--text-dim); font-weight:700; cursor:pointer;
  min-height:48px;
}

/* =========================================================
   PANTALLA DE RESULTADO / CELEBRACIÓN
   ========================================================= */
.result-hero{
  font-size:clamp(2.2rem, 9vw, 3.4rem);
  text-align:center;
}
.result-title{
  font-size:clamp(1.3rem, 4vw, 1.8rem);
  text-align:center;
  margin:8px 0 4px;
}
.result-eq{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.6vw, 1.6rem);
  text-align:center;
  color:var(--primary);
  margin-bottom:20px;
  word-break:break-word;
}
.result-actions{
  display:flex; gap:12px; width:100%; flex-wrap:wrap;
}
.result-actions button{ flex:1 1 160px; }

.confetti-piece{
  position:fixed; top:-10px; z-index:800;
  border-radius:2px;
  animation: fall linear forwards;
  pointer-events:none;
}
@keyframes fall{
  to{ transform:translateY(105vh) rotate(360deg); opacity:.9; }
}

/* =========================================================
   BARRA DE PROGRESO DE COLUMNAS
   ========================================================= */
.progress-track{
  display:flex; gap:6px; width:100%; margin-bottom:16px;
}
.progress-seg{
  flex:1; height:6px; border-radius:4px; background:rgba(255,255,255,.12);
  overflow:hidden;
}
.progress-seg .fill{
  height:100%; width:0%; background:linear-gradient(90deg, var(--primary), var(--blue));
  transition:width .4s ease;
}

/* utilidad de botón de sonido */
.sound-icon{ font-size:1.1em; }

/* =========================================================
   MULTIPLICACIÓN ÁRABE — retícula (propio del recurso)
   ========================================================= */
:root{
  --ink:var(--text); --ink-soft:var(--text-dim); --ink-faint:var(--text-faint);
  --brass:#fbbf24; --brass-dark:#f59e0b; --success:#34d399; --success-bg:rgba(52,211,153,.15);
  --error-bg:rgba(251,113,133,.15); --radius-s:10px; --radius-m:16px; --radius-l:22px;
  --font-num:var(--font-display); --font-ui:var(--font-body);
  --cell-size:calc(var(--cell-base,56px) * var(--f,1));
}
#vista{ width:100%; display:flex; flex-direction:column; }
.hero{ text-align:center; }
.problema-pill{
  align-self:center; font-family:var(--font-num); font-weight:800; letter-spacing:.04em;
  font-size:calc(clamp(1.3rem,4.4vw,1.9rem) * var(--f,1)); color:#fff;
  background:linear-gradient(150deg, rgba(44,20,104,.75), rgba(30,17,71,.75));
  box-shadow:inset 0 0 0 1px rgba(196,181,253,.35); border-radius:16px;
  padding:calc(6px * var(--f,1)) calc(22px * var(--f,1)); margin:0 0 calc(12px * var(--f,1));
}
.lattice-card{ width:100%; display:flex; flex-direction:column; align-items:center; padding:calc(4px * var(--f,1)) 0 0; }
.lattice-row{ display:flex; align-items:flex-start; gap:6px; }
.lattice-left{ display:flex; flex-direction:column; }
.top-digits, .side-digits{ display:flex; }
.top-digits{ justify-content:flex-end; margin-bottom:5px; gap:4px; }
.side-digits{ flex-direction:column; margin-top:calc(var(--cell-size) * .62 + 5px); gap:4px; margin-left:4px; }
.digit-box{
  width:var(--cell-size); height:calc(var(--cell-size) * .62); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .46); color:#fff;
  background:linear-gradient(150deg, rgba(124,58,237,.45), rgba(44,20,104,.7)); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.45);
  border:none; border-radius:12px; text-shadow:0 2px 6px rgba(0,0,0,.45);
}
.side-digits .digit-box{ width:calc(var(--cell-size) * .72); height:var(--cell-size); }
.grid-boxes{ display:grid; gap:4px; }
.lcell{
  width:var(--cell-size); height:var(--cell-size); position:relative; overflow:hidden; border-radius:10px;
  border:2px solid rgba(196,181,253,.75); background:rgba(30,17,71,.55); box-shadow:0 0 14px rgba(124,58,237,.25);
}
.lcell .tri{ position:absolute; inset:0; transition:background-color .35s ease, opacity .35s ease; }
.tri-tens{ clip-path:polygon(0 0,100% 0,0 100%); background:rgba(255,255,255,.05); }
.tri-ones{ clip-path:polygon(100% 0,100% 100%,0 100%); background:rgba(255,255,255,.1); }
.tri.diag-dim{ opacity:.35; } .tri.diag-active{ opacity:1; }
.cell-num{
  position:absolute; z-index:2; font-family:var(--font-num); font-weight:800; line-height:1; pointer-events:none;
  font-size:calc(var(--cell-size) * .36); color:#fff; text-shadow:0 2px 5px rgba(0,0,0,.5);
}
.cell-num.tens-pos{ top:12%; left:12%; } .cell-num.ones-pos{ bottom:10%; right:12%; }
.lcell input.cell-input{
  position:absolute; z-index:2; width:42%; height:42%; border:none; border-radius:7px; padding:0; outline:none;
  background:rgba(8,3,26,.55); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.5); text-align:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .32); color:#fff; user-select:text; -webkit-user-select:text;
}
.lcell input.cell-input.tens-pos{ top:6%; left:6%; } .lcell input.cell-input.ones-pos{ bottom:6%; right:6%; }
.lcell input.cell-input:focus{ background:rgba(124,58,237,.5); box-shadow:0 0 0 2.5px var(--brass), 0 0 14px rgba(251,191,36,.6); }
.lcell input.cell-input.wrong-flash{ background:var(--error-bg); box-shadow:0 0 0 2.5px var(--error); }

.diag-section{ margin-top:calc(22px * var(--f,1)); width:100%; display:flex; flex-direction:column; align-items:center; }
.diag-section h3{ font-size:calc(.86rem * var(--f,1)); font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin-bottom:calc(30px * var(--f,1)); text-align:center; }
.diag-row{ display:flex; gap:calc(8px * var(--f,1)); align-items:flex-end; flex-wrap:wrap; justify-content:center; }
.diag-box-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; }
.carry-badge{
  position:absolute; top:calc(-24px * var(--f,1)); left:50%; transform:translateX(-50%) scale(0); opacity:0;
  font-family:var(--font-num); font-weight:800; font-size:.8rem; color:#3b2405; background:var(--brass);
  border-radius:999px; padding:2px 9px; white-space:nowrap; box-shadow:0 0 10px rgba(251,191,36,.7);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
}
.carry-badge.show{ transform:translateX(-50%) scale(1); opacity:1; }
.diag-box{
  width:calc(clamp(48px,11vw,64px) * var(--f,1)); min-height:calc(clamp(48px,11vw,64px) * var(--f,1));
  border-radius:14px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1));
  border:2.5px solid var(--border-soft); background:rgba(8,3,26,.4); color:var(--text-faint); transition:all .25s ease;
}
.diag-box.pending{ opacity:.55; }
.diag-box input{ width:100%; height:100%; border:none; background:transparent; text-align:center; font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1)); color:#fff; outline:none; user-select:text; -webkit-user-select:text; }
.diag-box.wrong{ animation:shake .32s ease; }
.carry-fly{
  position:fixed; z-index:3000; font-family:var(--font-num); font-weight:800; font-size:.95rem; color:#3b2405;
  background:var(--brass); border-radius:999px; padding:4px 10px; pointer-events:none;
  transition:transform .55s cubic-bezier(.3,.6,.4,1), opacity .55s ease;
}
.final-banner{
  margin-top:calc(16px * var(--f,1)); text-align:center; background:var(--success-bg); border:2px solid var(--success);
  color:var(--success); border-radius:16px; padding:calc(10px * var(--f,1)) 20px; font-weight:800;
  font-family:var(--font-num); font-size:calc(clamp(1.1rem,3.8vw,1.5rem) * var(--f,1));
}
.arabe-final{ width:100%; display:flex; flex-direction:column; align-items:center; }
.arabe-final .mv-fila-chip{ margin-top:calc(8px * var(--f,1)); }
.arabe-final .result-actions{ margin-top:calc(14px * var(--f,1)); }
.setup-box{ width:100%; max-width:480px; margin:0 auto; text-align:center; }
.setup-box label{ display:block; font-weight:700; font-size:.95rem; color:var(--text-dim); margin-bottom:16px; }
.factor-input-row{ display:flex; align-items:center; justify-content:center; gap:clamp(10px,3vw,18px); }
.factor-input{
  width:100%; max-width:150px; font-family:var(--font-num); font-weight:800; font-size:clamp(1.6rem,7vw,2.2rem);

<script>
window.mvExito = function(){
  try{ if(window.reaccionCompanero) window.reaccionCompanero('bien'); }catch(e){}
  var h=document.getElementById('mvCelebra'); if(!h) return;
  var img=h.querySelector('.mv-av img'); if(!img || !img.getAttribute('src')) return;
  h.classList.remove('on'); void h.offsetWidth; h.classList.add('on');
  clearTimeout(h._t); h._t=setTimeout(function(){ h.classList.remove('on'); },1700);
};
window.mvFallo = function(){ try{ if(window.reaccionCompanero) window.reaccionCompanero('mal'); }catch(e){} };

/* ============================================================
   ESTADO GLOBAL
   ============================================================ */
const App = {
  m: 0,
  b: 0,
  points: {},        // {x: y} correctamente ingresados en la tabla
  placedPoints: [],   // [{x,y}] puestos en el plano
  userLine: null,      // {m,b} de la recta trazada por el usuario
  tool: 'point',
  lineSelection: []     // puntos elegidos para trazar la recta (máx 2)
};

function randomInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }

/* ============================================================
   GENERACIÓN POR NIVEL
   ============================================================ */
const LEVEL_GENERATORS = {
  facil: () => ({ m: randomInt(2,5), b: randomInt(-5,5) }),
  intermedio: () => {
    const variant = randomInt(1,3);
    if(variant === 1){
      let b = randomInt(-5,5);
      while(b === 0) b = randomInt(-5,5);
      return { m: Math.random() < 0.5 ? 1 : -1, b };
    } else if(variant === 2){
      const b = Math.random() < 0.5 ? randomInt(-10,-6) : randomInt(6,10);
      return { m: randomInt(2,5), b };
    } else {
      const m = Math.random() < 0.5 ? randomInt(-5,-2) : randomInt(2,7);
      return { m, b: randomInt(-5,5) };
    }
  },
  dificil: () => ({
    m: Math.random() < 0.5 ? randomInt(-10,-4) : randomInt(4,10),
    b: randomInt(4,15)
  })
};

function startLevel(level){
  nivelUlt = level;
  const gen = LEVEL_GENERATORS[level]();
  App.m = gen.m;
  App.b = gen.b;
  buildTableScreen();
}

/* ---------------------------------------------------------------------
   MODO: PRÁCTICA LIBRE vs CONTRARRELOJ
   Ni la tabla ni el gráfico tienen un aviso explícito de "incorrecto"
   -- ambos solo esperan hasta que esté bien, sin contar intentos
   fallidos. Por eso este recurso reporta solo completados, no errores
   (igual que Representación de Divisiones).
   --------------------------------------------------------------------- */
const NOMBRES_NIVEL_CR = { facil:'Fácil', intermedio:'Intermedio', dificil:'Difícil' };
const DURACION_CONTRARRELOJ = 10*60; // 10 minutos, en segundos
const Contrarreloj = { activo:false, restante:0, completados:0, intervalo:null, nivel:null };

function abrirSelectorModo(nivel){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay-cr" id="modo-overlay">
      <div class="card-cr">
        <h3>Nivel ${NOMBRES_NIVEL_CR[nivel]}</h3>
        <p class="card-cr-sub">¿Cómo quieres practicar?</p>
        <div class="modo-opciones">
          <button class="modo-btn" id="btn-modo-libre">🎯 Práctica libre<br><span class="modo-desc">sin límite de tiempo</span></button>
          <button class="modo-btn" id="btn-modo-contrarreloj">⏱️ Contrarreloj<br><span class="modo-desc">10 minutos, resuelve las que puedas</span></button>
        </div>
      </div>
    </div>`;
  document.getElementById('modo-overlay').onclick = (e) => { if(e.target.id==='modo-overlay') root.innerHTML=''; };
  document.getElementById('btn-modo-libre').onclick = () => { root.innerHTML=''; startLevel(nivel); };
  document.getElementById('btn-modo-contrarreloj').onclick = () => { root.innerHTML=''; startContrarreloj(nivel); };
}

function startContrarreloj(nivel){
  Contrarreloj.activo = true;
  Contrarreloj.restante = DURACION_CONTRARRELOJ;
  Contrarreloj.completados = 0;
  Contrarreloj.nivel = nivel;
  document.getElementById('timer-pill').classList.remove('hidden');
  document.getElementById('contador-pill').classList.remove('hidden');
  document.getElementById('contador-pill').textContent = '✓ 0';
  actualizarTimerPill();
  if(Contrarreloj.intervalo) clearInterval(Contrarreloj.intervalo);
  Contrarreloj.intervalo = setInterval(tickContrarreloj, 1000);
  startLevel(nivel);
}
function tickContrarreloj(){
  Contrarreloj.restante--;
  actualizarTimerPill();
  if(Contrarreloj.restante <= 0){
    clearInterval(Contrarreloj.intervalo);
    Contrarreloj.intervalo = null;
    Contrarreloj.activo = false;
    mostrarFinContrarreloj();
  }
}
function actualizarTimerPill(){
  const m = Math.floor(Contrarreloj.restante/60), s = Contrarreloj.restante%60;
  const pill = document.getElementById('timer-pill');
  pill.textContent = `${m}:${String(s).padStart(2,'0')}`;
  pill.style.setProperty('--p', (Contrarreloj.restante / DURACION_CONTRARRELOJ * 100).toFixed(1));
  pill.classList.toggle('urgente', Contrarreloj.restante <= 30);
}
function detenerContrarreloj(){
  if(Contrarreloj.intervalo){ clearInterval(Contrarreloj.intervalo); Contrarreloj.intervalo=null; }
  Contrarreloj.activo = false;
  document.getElementById('timer-pill').classList.add('hidden');
  document.getElementById('contador-pill').classList.add('hidden');
}
function mostrarFinContrarreloj(){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay-cr">
      <div class="card-cr">
        <h3>⏱️ ¡Se acabó el tiempo!</h3>
        <p class="card-cr-sub">Completaste <b style="color:var(--primary); font-size:1.3em; font-family:var(--font-display);">${Contrarreloj.completados}</b> función(es).</p>
        <div class="modo-opciones">
          <button class="modo-btn" id="btn-cr-otra">➜ Otra ronda</button>
          <button class="modo-btn" id="btn-cr-inicio">🏠 Inicio</button>
        </div>
      </div>
    </div>`;
  document.getElementById('btn-cr-otra').onclick = () => { root.innerHTML=''; startContrarreloj(Contrarreloj.nivel); };
  document.getElementById('btn-cr-inicio').onclick = () => { root.innerHTML=''; detenerContrarreloj(); goHome(); };
}

/* ---------------------------------------------------------------------
   DESAFÍO ONLINE
   --------------------------------------------------------------------- */
let AlumnoActual = null;

function iniciarHeartbeatTiempo(){
  if(typeof window.iniciarHeartbeatMathverse==='function') window.iniciarHeartbeatMathverse(function(){ return AlumnoActual && AlumnoActual.id; },'funciones');
  else setTimeout(iniciarHeartbeatTiempo,100);
}
try{ var _g=JSON.parse(sessionStorage.getItem('profehoracio_alumno_actual')||'null'); if(_g && _g.id && _g.nombre){ AlumnoActual=_g; iniciarHeartbeatTiempo(); } }catch(e){}
switchScreen('screen-home');

const Online = { activo:false, codigo:null, uid:null, nombre:null, docId:null };

// Se llama UNA vez, justo al unirse a la sesión -- sin esto, si el
// profesor eligió "Práctica libre" (no Contrarreloj), el alumno nunca
// aparecía en el panel ni se guardaba su avance.
function registrarInicioOnline(){
  if(!Online.activo) return;
  Online.docId = Online.uid + '_' + Date.now();
  if(window.iniciarNuevoIntentoOnline) window.iniciarNuevoIntentoOnline(Online.codigo, Online.docId, Online.nombre, Online.uid);
}


function abrirLoginOnline(){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="overlay-cr" id="online-overlay">
      <div class="card-cr">
        <h3>Desafío Online</h3>
        <p class="card-cr-sub">Únete a la clase</p>
        <input class="modal-campo" id="online-codigo" placeholder="Código" maxlength="8" autocomplete="off" style="text-transform:uppercase;">
        <input class="modal-campo" id="online-nombre" placeholder="Tu nombre" maxlength="24" autocomplete="off">
        <p class="modal-feedback" id="online-msg"></p>
        <div class="modo-opciones"><button class="modo-btn" id="btn-online-unirse">Unirse</button></div>
      </div>
    </div>`;
  document.getElementById('online-overlay').onclick = (e) => { if(e.target.id==='online-overlay') root.innerHTML=''; };
  document.getElementById('btn-online-unirse').onclick = async () => {
    const codigo = document.getElementById('online-codigo').value.trim().toUpperCase();
    const nombre = document.getElementById('online-nombre').value.trim();
    const msg = document.getElementById('online-msg');
    if(!codigo || !nombre){ msg.className='modal-feedback err'; msg.textContent='Completa ambos campos.'; return; }
    msg.className='modal-feedback'; msg.textContent='Conectando…';
    const boton = document.getElementById('btn-online-unirse');
    boton.disabled = true;
    const resultado = await window.unirseClaseOnline(codigo, nombre);
    boton.disabled = false;
    if(!resultado.ok){ msg.className='modal-feedback err'; msg.textContent=resultado.error; return; }
    Online.activo = true;
    Online.codigo = codigo;
    Online.uid = resultado.uid;
    Online.nombre = nombre;
    registrarInicioOnline();
    root.innerHTML = '';
    document.getElementById('indicadorOnline').classList.remove('hidden');
    document.getElementById('nombreOnline').textContent = nombre;
    if(resultado.modoObjetivo === 'contrarreloj'){ startContrarreloj(resultado.nivelObjetivo); }
    else { startLevel(resultado.nivelObjetivo); }
  };
}

/* ============================================================
   CREA TU FUNCIÓN
   ============================================================ */
function goToManual(){
  hideError('manualError');
  document.getElementById('manualM').value = '';
  document.getElementById('manualB').value = '';
  switchScreen('screen-manual');
  setTimeout(() => document.getElementById('manualM').focus(), 250);
}

function startManual(){
  const mVal = document.getElementById('manualM').value.trim();
  const bVal = document.getElementById('manualB').value.trim();
  const m = parseInt(mVal, 10);
  const b = bVal === '' ? 0 : parseInt(bVal, 10);

  if(mVal === '' || isNaN(m)){
    showError('manualError', 'Escribe un valor para m.');
    return;
  }
  if(m === 0){
    showError('manualError', 'm no puede ser 0 (la función dejaría de tener pendiente).');
    return;
  }
  if(isNaN(b)){
    showError('manualError', 'El valor de b no es válido.');
    return;
  }
  if(Math.abs(m) > 20 || Math.abs(b) > 30){
    showError('manualError', 'Elige valores más chicos, para que la tabla y el gráfico se vean bien.');
    return;
  }

  hideError('manualError');
  nivelUlt = null;
  App.m = m;
  App.b = b;
  buildTableScreen();
}

/* ============================================================
   FORMATO DE LA FUNCIÓN
   ============================================================ */
function formatFunction(m, b){
  let mPart;
  if(m === 1) mPart = 'x';
  else if(m === -1) mPart = '-x';
  else mPart = m + 'x';

  let bPart = '';
  if(b > 0) bPart = ' + ' + b;
  else if(b < 0) bPart = ' − ' + Math.abs(b);

  return 'f(x) = ' + mPart + bPart;
}

function onYInput(e){
  const input = e.target;
  input.value = input.value.replace(/[^0-9-]/g, '').replace(/(?!^)-/g, '');
  const x = parseInt(input.dataset.x, 10);
  const expected = App.m * x + App.b;

  input.classList.toggle('correct', isCorrect);

  if(isCorrect && !wasCorrect){

function focusNextInput(current){

  const idx = inputs.indexOf(current);
  const next = inputs[idx+1];
  if(next && !next.classList.contains('correct')) next.focus();

function checkTableComplete(){

/* ============================================================
   PANTALLA: PLANO CARTESIANO
   ============================================================ */
let planeRange = null;

function buildMiniTable(){
  const xs = [-2,-1,0,1,2];
  const rowX = xs.map(x => '<td class="mini-x">' + x + '</td>').join('');
  const rowY = xs.map(x => '<td class="mini-y">' + (App.m*x + App.b) + '</td>').join('');
  document.getElementById('miniTable').innerHTML =
    '<tr><td class="mini-label">x</td>' + rowX + '</tr>' +
    '<tr><td class="mini-label">y</td>' + rowY + '</tr>';
}

function buildGraphScreen(){
  document.getElementById('functionDisplayGraph').textContent = formatFunction(App.m, App.b);
  buildMiniTable();
  App.placedPoints = [];
  App.userLine = null;
  App.lineSelection = [];
  App.tool = 'point';
  setTool('point');
  view = { scale:1, panX:0, panY:0 };

  const status = document.getElementById('graphStatus');
  status.textContent = 'Marca los 5 puntos de tu tabla, luego traza la recta que los une';
  status.classList.remove('ok');
  document.getElementById('graphFinal').classList.remove('show');

  planeRange = computeAxisRange(App.m, App.b);
  drawPlane();
  setupPlaneGestures();
  switchScreen('screen-graph');
}

function computeAxisRange(m, b){
  const ys = [-2,-1,0,1,2].map(x => m*x + b);
  let yMin = Math.min(...ys, 0, -10);
  let yMax = Math.max(...ys, 0, 10);
  yMin -= 2; yMax += 2;

  return { xMin:-6, xMax:6, xStep:1, yMin, yMax, yStep: 1 };
}

const SVG_WIDTH = 400;
let SVG_HEIGHT = 400;
const SVG_PAD = 26;

// Estado de zoom/desplazamiento. scale=1 es la vista inicial (la que
// calcula computeAxisRange); panX/panY desplazan esa vista.
let view = { scale: 1, panX: 0, panY: 0 };

function dataToPx(x, y){
  const w = SVG_WIDTH - SVG_PAD*2;
  const h = SVG_HEIGHT - SVG_PAD*2;
  const px = SVG_PAD + ((x - planeRange.xMin) / (planeRange.xMax - planeRange.xMin)) * w;
  const py = SVG_PAD + h - ((y - planeRange.yMin) / (planeRange.yMax - planeRange.yMin)) * h;
  return { px, py };
}

function pxToData(px, py){
  const w = SVG_WIDTH - SVG_PAD*2;
  const h = SVG_HEIGHT - SVG_PAD*2;
  const x = planeRange.xMin + ((px - SVG_PAD) / w) * (planeRange.xMax - planeRange.xMin);
  const y = planeRange.yMin + ((SVG_PAD + h - py) / h) * (planeRange.yMax - planeRange.yMin);
  return { x, y };
}

/** Convierte una coordenada de pantalla (clientX/clientY) a coordenadas
 *  del SVG, respetando el zoom/desplazamiento actual — usa la matriz de
 *  transformación real del navegador, así que siempre da el punto exacto
 *  bajo el dedo/cursor, sin importar cuánto zoom haya. */
function screenToSvgPoint(clientX, clientY){
  const svg = document.getElementById('planeSvg');
  const pt = svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
  return { px: svgP.x, py: svgP.y };
}

function currentViewBox(){
  const w = SVG_WIDTH / view.scale;
  const h = SVG_HEIGHT / view.scale;
  const x = (SVG_WIDTH - w)/2 + view.panX;
  const y = (SVG_HEIGHT - h)/2 + view.panY;
  return { x, y, w, h };
}

function applyViewBox(){
  const vb = currentViewBox();
  document.getElementById('planeSvg').setAttribute('viewBox', vb.x+' '+vb.y+' '+vb.w+' '+vb.h);
}

function clamp(v, min, max){ return Math.min(max, Math.max(min, v)); }

function zoomIn(){ view.scale = clamp(view.scale*1.4, 0.5, 6); applyViewBox(); }
function zoomOut(){ view.scale = clamp(view.scale/1.4, 0.5, 6); applyViewBox(); }
function zoomReset(){ view = { scale:1, panX:0, panY:0 }; applyViewBox(); }

function drawPlane(){
  const svg = document.getElementById('planeSvg');

  // Cada unidad de Y necesita al menos ~15px para que su número no se
  // amontone con el de al lado (recuerda: siempre enumeramos de 1 en 1).
  const yUnits = planeRange.yMax - planeRange.yMin;
  SVG_HEIGHT = Math.max(400, Math.round(yUnits * 15) + SVG_PAD*2);

  applyViewBox();
  svg.innerHTML = '';

  const ns = 'http://www.w3.org/2000/svg';
  function el(tag, attrs){
    const e = document.createElementNS(ns, tag);
    Object.keys(attrs).forEach(k => e.setAttribute(k, attrs[k]));
    return e;
  }

  // La grilla se dibuja bastante más ancha que la vista inicial, para que
  // al desplazarse (pan) o alejar el zoom siempre haya líneas que ver,
  // no un vacío.
  const gridXMin = planeRange.xMin - 20, gridXMax = planeRange.xMax + 20;
  const gridYMin = planeRange.yMin - 30, gridYMax = planeRange.yMax + 30;

  for(let x = Math.ceil(gridXMin); x <= gridXMax; x += 1){
    const p1 = dataToPx(x, gridYMin);
    const p2 = dataToPx(x, gridYMax);
    svg.appendChild(el('line', {
      x1:p1.px, y1:p1.py, x2:p2.px, y2:p2.py,
      stroke: x === 0 ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.1)',
      'stroke-width': x === 0 ? 1.6 : 1
    }));
  }
  for(let y = Math.ceil(gridYMin); y <= gridYMax; y += 1){
    const p1 = dataToPx(gridXMin, y);
    const p2 = dataToPx(gridXMax, y);
    svg.appendChild(el('line', {
      x1:p1.px, y1:p1.py, x2:p2.px, y2:p2.py,
      stroke: y === 0 ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.1)',
      'stroke-width': y === 0 ? 1.6 : 1
    }));
  }

  // Etiquetas de los ejes — de 1 en 1 en ambos ejes
  for(let x = Math.ceil(gridXMin); x <= gridXMax; x += 1){
    if(x === 0) continue;
    const p = dataToPx(x, 0);
    const t = el('text', { x:p.px, y:p.py+14, fill:'rgba(255,255,255,.75)', 'font-size':'9', 'text-anchor':'middle' });
    t.textContent = x;
    svg.appendChild(t);
  }
  for(let y = Math.ceil(gridYMin); y <= gridYMax; y += 1){
    if(y === 0) continue;
    const p = dataToPx(0, y);
    const t = el('text', { x:p.px-8, y:p.py+3, fill:'rgba(255,255,255,.75)', 'font-size':'9', 'text-anchor':'end' });
    t.textContent = y;
    svg.appendChild(t);
  }

  // Zona de gestos: toques, arrastre para desplazar, rueda/pellizco para zoom
  const overlay = el('rect', { x:gridXMin*4, y:gridYMin*4, width:(gridXMax-gridXMin)*8, height:(gridYMax-gridYMin)*8, fill:'transparent' });
  svg.appendChild(overlay);

  // Recta trazada por el usuario (si existe) — se extiende por toda la grilla ancha
  if(App.userLine){
    const y1 = App.userLine.m * gridXMin + App.userLine.b;
    const y2 = App.userLine.m * gridXMax + App.userLine.b;
    const p1 = dataToPx(gridXMin, y1);
    const p2 = dataToPx(gridXMax, y2);
    svg.appendChild(el('line', {
      x1:p1.px, y1:p1.py, x2:p2.px, y2:p2.py,
      stroke:'#38bdf8', 'stroke-width':3, 'stroke-linecap':'round'
    }));
  }

  // Puntos puestos por el usuario
  App.placedPoints.forEach(pt => {
    const p = dataToPx(pt.x, pt.y);
    const isSelected = App.lineSelection.some(s => s.x === pt.x && s.y === pt.y);
    svg.appendChild(el('circle', {
      cx:p.px, cy:p.py, r: isSelected ? 7 : 6,
      fill:'#fbbf24', stroke:'#1e1147', 'stroke-width':2
    }));
  });
}

/* ---------- Gestos: toque = punto/recta, arrastre = desplazar, pellizco = zoom ---------- */
const activePointers = new Map();
let pinchStartDist = null, pinchStartScale = null;
let dragStart = null, isDragging = false;
const DRAG_THRESHOLD = 6;

function setupPlaneGestures(){
  const svg = document.getElementById('planeSvg');
  svg.onpointerdown = (e) => {
    svg.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

    if(activePointers.size === 2){
      const pts = [...activePointers.values()];
      pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      pinchStartScale = view.scale;
      isDragging = false;
    } else if(activePointers.size === 1){
      dragStart = { x:e.clientX, y:e.clientY, panX:view.panX, panY:view.panY };
      isDragging = false;
    }
  };

  svg.onpointermove = (e) => {
    if(!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

    if(activePointers.size === 2 && pinchStartDist){
      const pts = [...activePointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      view.scale = clamp(pinchStartScale * (dist/pinchStartDist), 0.5, 6);
      applyViewBox();
      return;
    }

    if(activePointers.size === 1 && dragStart){
      const dx = e.clientX - dragStart.x;
      const dy = e.clientY - dragStart.y;
      if(!isDragging && Math.hypot(dx,dy) > DRAG_THRESHOLD) isDragging = true;
      if(isDragging){
        const rect = svg.getBoundingClientRect();
        const unitsPerScreenPx = (SVG_WIDTH/view.scale) / rect.width;
        view.panX = dragStart.panX - dx*unitsPerScreenPx;
        view.panY = dragStart.panY - dy*unitsPerScreenPx;
        applyViewBox();
      }
    }
  };

  svg.onpointerup = (e) => {
    const wasTap = activePointers.size === 1 && !isDragging;
    const pos = activePointers.get(e.pointerId);
    activePointers.delete(e.pointerId);

    if(activePointers.size === 0){
      if(wasTap && pos) handleTap(pos.x, pos.y);
      isDragging = false; dragStart = null; pinchStartDist = null;
    } else if(activePointers.size === 1){
      const remaining = [...activePointers.values()][0];
      dragStart = { x:remaining.x, y:remaining.y, panX:view.panX, panY:view.panY };
      isDragging = false; pinchStartDist = null;
    }
  };
  svg.onpointercancel = svg.onpointerup;

  svg.onwheel = (e) => {
    e.preventDefault();
    view.scale = clamp(view.scale * (e.deltaY < 0 ? 1.15 : 1/1.15), 0.5, 6);
    applyViewBox();
  };
}

function handleTap(clientX, clientY){
  const svgPt = screenToSvgPoint(clientX, clientY);
  if(App.tool === 'point') handlePointTap(svgPt.px, svgPt.py);
  else selectForLine(svgPt.px, svgPt.py);
}

/** Si el toque cae cerca de un punto ya puesto, lo quita (sin importar si
 *  no calzó exacto). Si no, agrega uno nuevo en la coordenada más cercana. */
function handlePointTap(svgPx, svgPy){
  let closestIdx = -1, closestDist = Infinity;
  App.placedPoints.forEach((pt, idx) => {
    const p = dataToPx(pt.x, pt.y);
    const dist = Math.hypot(p.px - svgPx, p.py - svgPy);
    if(dist < closestDist){ closestDist = dist; closestIdx = idx; }
  });

  if(closestIdx >= 0 && closestDist <= 20){
    App.placedPoints.splice(closestIdx, 1);
  } else {
    const data = pxToData(svgPx, svgPy);
    App.placedPoints.push({ x: Math.round(data.x), y: Math.round(data.y) });
  }
  drawPlane();
  updateGraphStatus();
}

function selectForLine(px, py){
  // Busca el punto ya puesto más cercano al toque
  let closest = null, closestDist = Infinity;
  App.placedPoints.forEach(pt => {
    const p = dataToPx(pt.x, pt.y);
    const dist = Math.hypot(p.px - px, p.py - py);
    if(dist < closestDist){ closestDist = dist; closest = pt; }
  });
  if(!closest || closestDist > 24) return; // muy lejos de cualquier punto puesto

  const already = App.lineSelection.findIndex(s => s.x === closest.x && s.y === closest.y);
  if(already >= 0){
    App.lineSelection.splice(already, 1);
  } else {
    App.lineSelection.push(closest);
    if(App.lineSelection.length > 2) App.lineSelection.shift();
  }

  if(App.lineSelection.length === 2){
    const [a, b2] = App.lineSelection;
    if(a.x !== b2.x){
      const m = (b2.y - a.y) / (b2.x - a.x);
      const b = a.y - m * a.x;
      App.userLine = { m, b };
    }
  } else {
    App.userLine = null;
  }

  drawPlane();
  updateGraphStatus();
}

function setTool(tool){
  App.tool = tool;
  document.getElementById('toolPointBtn').classList.toggle('active', tool === 'point');
  document.getElementById('toolLineBtn').classList.toggle('active', tool === 'line');
}


function updateGraphStatus(){
  const status = document.getElementById('graphStatus');

  const correctCount = [-2,-1,0,1,2].filter(x => {
    const y = App.m * x + App.b;
    return App.placedPoints.some(p => p.x === x && p.y === y);
  }).length;

  if(correctCount < 5){
    status.textContent = 'Llevas ' + correctCount + ' de 5 puntos correctos marcados.';
    status.classList.remove('ok');
    return;
  }

  if(!App.userLine){
    status.textContent = '¡Los 5 puntos están bien! Ahora usa la herramienta Recta y toca dos de tus puntos.';
    status.classList.remove('ok');
    return;
  }

  const EPS = 0.001;
  const lineOk = Math.abs(App.userLine.m - App.m) < EPS && Math.abs(App.userLine.b - App.b) < EPS;

  if(lineOk){
    status.textContent = '¡Función graficada correctamente!';
    status.classList.add('ok');
    window.__sigT = Date.now();
    if(AlumnoActual) window.reportarProgresoPractica(AlumnoActual.id, 'funciones', 1, 0, nivelUlt ? (({facil:1, intermedio:2, dificil:3})[nivelUlt] || 1) : 1);
    mvExito();
    if(Contrarreloj.activo){
      Contrarreloj.completados++;
      document.getElementById('contador-pill').textContent = '✓ '+Contrarreloj.completados;
      if(Online.activo) window.reportarProgresoOnline(Online.codigo, Online.docId, 1, 0);
      setTimeout(() => {
        if(!Contrarreloj.activo) return;
        startLevel(Contrarreloj.nivel);
      }, 1200);
      return;
    }
    document.getElementById('graphFinal').classList.add('show');
    (function(){ const m = document.querySelector('.juego-main'); if(m) setTimeout(() => m.scrollTo({ top: m.scrollHeight, behavior: 'smooth' }), 80); })();
  } else {
    status.textContent = 'Esa recta no calza con la función. Revisa los dos puntos que elegiste.'; mvFallo();
    status.classList.remove('ok');
  }
}

/* ============================================================

    const datos = sessionSnap.data();

    if(datos.active === false) return { ok:false, error:'Tu profesor ya cerró esta sesión.' };
    if(datos.recurso && datos.recurso !== 'funciones') return { ok:false, error:`Ese código es para ${datos.recurso}, no para Funciones.` };

    const duracionMinutos = datos.duracionMinutos || 180;
    if(datos.createdAt){
      const minutosTranscurridos = (Date.now() - datos.createdAt.toDate().getTime()) / 60000;
      if(minutosTranscurridos > duracionMinutos) return { ok:false, error:'Este código ya venció. Pídele uno nuevo a tu profesor.' };
    }

    return { ok:true, uid, nivelObjetivo: datos.nivelObjetivo, modoObjetivo: datos.modoObjetivo };
  } catch(err){
    console.error(err);
    return { ok:false, error:'Error de conexión. Intenta de nuevo.' };
  }
};

window.iniciarNuevoIntentoOnline = async function(codigo, docId, nombre, uid){
  if(!codigo || !docId) return;
  try{
    await setDoc(doc(db, 'sessions', codigo, 'students', docId), {
      name: nombre, uid: uid || null, startedAt: serverTimestamp(), completados: 0, errores: 0, mascota: (window.mascotaParaClase ? await window.mascotaParaClase() : null)
    });
  } catch(err){
    console.error('No se pudo iniciar el intento online:', err);
  }
};

window.reportarProgresoOnline = async function(codigo, docId, deltaCompletados, deltaErrores){
  if(!codigo || !docId) return;
  try{
    await setDoc(doc(db, 'sessions', codigo, 'students', docId), {
      completados: increment(deltaCompletados || 0),
      errores: increment(deltaErrores || 0),
      updatedAt: serverTimestamp()
    }, { merge: true });
  } catch(err){
    console.error('No se pudo reportar el progreso online:', err);
  }
};
// Si se llega desde el inicio con un código de clase en el enlace
// (?codigoClase=XXXX), se une solo, sin mostrar el botón ni el modal --
// ya sea con la cuenta que ya tenía la sesión, o como invitado si vino
// con ?invitado=Nombre (ese nombre ya pasó por el filtro en el inicio).
try{
  const parametrosUrl = new URLSearchParams(location.search);
  const codigoDesdeUrl = parametrosUrl.get('codigoClase');
  const invitadoDesdeUrl = parametrosUrl.get('invitado');
  let nombreParaUnirse = null;
  if(AlumnoActual) nombreParaUnirse = AlumnoActual.nombre;
  else if(invitadoDesdeUrl && invitadoDesdeUrl.trim()) nombreParaUnirse = `👤 Invitado: ${invitadoDesdeUrl.trim()}`;

  if(codigoDesdeUrl && nombreParaUnirse){
    (async () => {
      const resultado = await window.unirseClaseOnline(codigoDesdeUrl.toUpperCase(), nombreParaUnirse);
      if(!resultado.ok){ alert(resultado.error); return; }
      Online.activo = true; Online.codigo = codigoDesdeUrl.toUpperCase(); Online.uid = resultado.uid; Online.nombre = nombreParaUnirse;
      registrarInicioOnline();
      // Ojo: en algunos recursos este indicador recién se dibuja cuando se
      // muestra la pantalla de niveles -- si un invitado llega sin sesión
      // previa, puede que todavía no exista en el DOM.
      const _indEl = document.getElementById('indicadorOnline');
      if(_indEl){ _indEl.classList.remove('hidden'); document.getElementById('nombreOnline').textContent = nombreParaUnirse; }
      if(resultado.modoObjetivo === 'contrarreloj'){ startContrarreloj(resultado.nivelObjetivo); }
      else { startLevel(resultado.nivelObjetivo); }
    })();
  }
} catch(e){ console.error(e); }
</script>
