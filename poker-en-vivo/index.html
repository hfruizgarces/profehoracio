<style>

*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden;color:var(--text);font-family:var(--font-body);min-height:100vh;-webkit-tap-highlight-color:transparent;

button{font-family:inherit}
.hidden{display:none !important}
.screen{display:none;flex-direction:column;align-items:center;position:relative;z-index:1}
.screen.active{display:flex}
#app{width:100%;max-width:900px;margin:0 auto;padding:clamp(10px,2.5vw,24px);display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column}
.card{width:100%;position:relative;max-width:980px;margin:0 auto;padding:6px 10px}

.mv-pregunta{text-align:center;text-wrap:balance;font-family:var(--font-display);font-size:1.25rem;margin:6px 0 2px}
.icon-btn{display:inline-flex;align-items:center;cursor:pointer}
.mv-fila-chip{margin-top:30px}
.mv-atras-home{position:absolute;left:6px;top:6px;z-index:5}
.mv-casa-home{position:absolute;right:6px;top:6px;z-index:5}
.mv-niveles.mv-p3.mv-lv{aspect-ratio:100/90}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n1{--x:7;--y:53;--w:34}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n2{--x:50;--y:48;--w:41}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n3{--x:27;--y:1;--w:47}

.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n1{--x:10;--y:13;--w:22}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n2{--x:37;--y:8;--w:26}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n3{--x:66;--y:2;--w:31}}
.mv-nivel .ico{width:46%;height:auto;position:relative;z-index:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}

/* ---- pantalla de juego ---- */

body.en-juego{overflow:hidden;height:100dvh;min-height:0}

.app-topbar .side{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.app-topbar .icon-btn.btn-orbita{font-size:.92rem}
.mv-universo .app-header.app-topbar .mv-av{width:clamp(56px,14vw,84px);height:clamp(56px,14vw,84px)}
#mvCelebra{position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:99990;pointer-events:none;opacity:0;width:min(86vw,300px)}
#mvCelebra.on{animation:mvCelPop 1.6s ease both}
@keyframes mvCelPop{0%{opacity:0;transform:translateX(-50%) scale(.55)}14%{opacity:1;transform:translateX(-50%) scale(1.1)}24%{transform:translateX(-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}

.cuerpo{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:760px;margin:0 auto;padding:2px 12px 12px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex:none}
.chip{padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(196,181,253,.4);font-family:var(--font-display);font-weight:800;font-size:1rem}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#stage > svg{width:100%;height:100%;max-height:100%;overflow:visible}
.msg{flex:none;min-height:2.7em;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:clamp(1rem,.85rem + .7vw,1.3rem);line-height:1.25;text-wrap:balance;max-width:640px}
.msg.mal{color:#fda4af}.msg.bien{color:#6ee7b7}.msg.pista{color:#fde68a}
.fila{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;flex:none}
.btn-orbita.ancho{font-size:1.15rem;padding-right:2em}
.btn-orbita[disabled]{opacity:.45;pointer-events:none;filter:grayscale(.5)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .32s}



.cuerpo{max-width:min(1000px,98vw)}
#zona{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:7px;overflow-x:hidden;overflow-y:hidden}

.pb.v{background:linear-gradient(115deg,#059669,#10b981)}.pb.r{background:linear-gradient(115deg,#be123c,#ef4444)}.pb.a{background:linear-gradient(115deg,#1d4ed8,#3b82f6)}.pb.o{background:linear-gradient(115deg,#b45309,#f59e0b)}

.caja{width:100%;border-radius:18px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 2px rgba(196,181,253,.3);padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cap{font-family:var(--font-display);font-weight:800;color:#e9ddff;text-align:center;font-size:clamp(.82rem,3.3vw,1rem)}

.reto{font-family:var(--font-display);font-weight:900;text-align:center;font-size:clamp(.9rem,3.6vw,1.1rem);color:#fff;background:linear-gradient(115deg,rgba(124,58,237,.7),rgba(219,39,119,.7));border-radius:14px;padding:5px 10px;width:100%}

.ap{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font-display);font-weight:800;color:#fff}
.ap button{width:40px;height:40px;border-radius:50%;border:none;font-size:1.4rem;font-weight:900;color:#fff;background:linear-gradient(135deg,#7c3aed,#db2777);cursor:pointer}
.ap button:disabled{opacity:.35}
.ap .v{min-width:5.5em;text-align:center}
/* ruleta */
.rgrid{display:grid;grid-template-columns:auto repeat(12,1fr);gap:2px;width:100%;max-width:560px}
.cel{border:none;border-radius:6px;padding:0;height:clamp(22px,calc(4.6*var(--u,1dvh)),34px);font-family:var(--font-display);font-weight:900;font-size:clamp(.62rem,2.5vw,.85rem);color:#fff;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.cel.rj{background:#b91c1c}.cel.ng{background:#1f2937}.cel.vd{background:#047857;grid-row:1/4;width:clamp(22px,6vw,34px);height:auto}
.cel.cv{box-shadow:inset 0 0 0 3px #fde68a,0 0 8px rgba(253,230,138,.8);filter:brightness(1.25)}
.cel.sel{box-shadow:inset 0 0 0 3px #fff,0 0 0 2px #f59e0b;transform:scale(1.08)}
.cel.gan{outline:3px solid #6ee7b7}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:100%;max-width:560px}
.pal button{border:none;border-radius:10px;padding:6px 2px;font-family:var(--font-display);font-weight:800;font-size:clamp(.66rem,2.7vw,.86rem);color:#fff;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3);cursor:pointer}
.pal button.sel{background:#f59e0b;color:#1e1b4b;box-shadow:inset 0 0 0 2px #fff}
.rrow{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
#rueda{width:clamp(96px,calc(17*var(--u,1dvh)),170px);height:auto;flex:none}
.rnum{font-family:var(--font-display);font-weight:900;font-size:clamp(2rem,9vw,3rem);line-height:1;min-width:2.6em;text-align:center;border-radius:14px;padding:4px 8px;color:#fff;background:#4c1d95}
/* blackjack */
.mano{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.nai{width:clamp(46px,12.5vw,64px);height:clamp(66px,18vw,90px);border-radius:8px;background:#fff;color:#1e1b4b;font-family:system-ui,sans-serif;font-weight:900;font-size:clamp(1.45rem,6.8vw,2.25rem);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.35);line-height:1.05}
.nai.vacio{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.nai.rj{color:#dc2626}.nai.dorso{background:repeating-linear-gradient(45deg,#4c1d95,#4c1d95 6px,#6d28d9 6px,#6d28d9 12px);color:#fff}
.pool{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:58px}
.pool div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;width:clamp(22px,7vw,34px);font-family:var(--font-display);font-weight:800;font-size:.72rem;color:#fff}
.pool i{display:block;width:100%;border-radius:4px 4px 0 0;background:#60a5fa}.pool .mal i{background:#ef4444}
/* dados */
.dd{display:flex;gap:clamp(14px,5vw,28px);justify-content:center;padding:4px 0}
.die{width:clamp(54px,17vw,80px);aspect-ratio:1;border-radius:18%;background:linear-gradient(145deg,#ff6b6b,#c81e1e 60%,#991b1b);box-shadow:inset 2px 3px 5px rgba(255,255,255,.45),inset -4px -5px 9px rgba(0,0,0,.35),0 8px 14px rgba(0,0,0,.45);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13%;gap:2%;place-items:center}
.die i{width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e5e7eb 70%);box-shadow:inset -1px -2px 3px rgba(0,0,0,.3)}
.die.rod{animation:rueda .22s linear infinite}
@keyframes rueda{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(12deg) translateY(-9px)}50%{transform:rotate(-8deg) translateY(0)}75%{transform:rotate(-14deg) translateY(-6px)}100%{transform:rotate(0) translateY(0)}}

.hist{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}.hist span{background:rgba(255,255,255,.15);border-radius:8px;padding:2px 8px;font-family:var(--font-display);font-weight:800;color:#fff}
.dist{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:92px;width:100%;max-width:420px}
.dist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-family:var(--font-display);font-weight:800;font-size:.72rem;color:#fff;gap:1px}
.dist i{display:block;width:100%;border-radius:4px 4px 0 0}
.g{background:#10b981}.p{background:#f59e0b}.l{background:#ef4444}
.mundo{position:relative;border:none;cursor:pointer;aspect-ratio:1;width:min(40vw,calc(34*var(--u,1dvh)),250px);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-family:var(--font-display);font-weight:800;background:radial-gradient(circle at 32% 26%,var(--c1),var(--c2) 70%);box-shadow:inset -8px -10px 18px rgba(0,0,0,.28),inset 5px 6px 12px rgba(255,255,255,.35),0 10px 26px rgba(0,0,0,.35);animation:flota 5s ease-in-out infinite;-webkit-tap-highlight-color:transparent}

.menu-pl{flex:none;width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(10px,3vw,26px);padding:6px}

<script>
const SUITS=['♠','♥','♦','♣'];
const PKN=['Carta alta','Par','Doble par','Trío','Escalera','Color','Full','Póker','Escalera de color'];
const PKR={11:'J',12:'Q',13:'K',14:'A'};
function eval7(c){
  const rc=new Array(15).fill(0), bs=[[],[],[],[]];
  for(const x of c){ rc[x.r]++; bs[x.s].push(x.r); }
  function sh(has){ for(let h=14;h>=5;h--){ let ok=true; for(let k=0;k<5;k++){ let r=h-k; if(r===1) r=14; if(!has[r]){ ok=false; break; } } if(ok) return h; } return 0; }
  const enc=a=>{ let v=0; for(let i=0;i<6;i++) v=v*15+(a[i]||0); return v; };
  let fs=-1; for(let s=0;s<4;s++) if(bs[s].length>=5) fs=s;
  if(fs>=0){ const has=new Array(15).fill(false); bs[fs].forEach(r=>{ has[r]=true; }); const h=sh(has); if(h) return enc([8,h]); }
  const q=[],t=[],p=[],k=[];
  for(let r=14;r>=2;r--){ if(rc[r]===4) q.push(r); else if(rc[r]===3) t.push(r); else if(rc[r]===2) p.push(r); else if(rc[r]===1) k.push(r); }
  if(q.length){ const rest=t.concat(p,k).sort((a,b)=>b-a); return enc([7,q[0],rest[0]]); }
  if(t.length&&(t.length>1||p.length)){ const cand=t.slice(1).concat(p); return enc([6,t[0],Math.max.apply(null,cand)]); }
  if(fs>=0){ const top=bs[fs].slice().sort((a,b)=>b-a).slice(0,5); return enc([5].concat(top)); }
  const h=sh(rc.map(n=>n>0)); if(h) return enc([4,h]);
  if(t.length){ const ks=p.concat(k).sort((a,b)=>b-a).slice(0,2); return enc([3,t[0]].concat(ks)); }
  if(p.length>=2){ const rest=p.slice(2).concat(k).sort((a,b)=>b-a); return enc([2,p[0],p[1],rest[0]]); }
  if(p.length===1) return enc([1,p[0]].concat(k.slice(0,3)));
  return enc([0].concat(k.slice(0,5)));
}
const catPK=v=>Math.floor(v/759375);
function mazoPK(){ const d=[]; for(let r=2;r<=14;r++) for(let s=0;s<4;s++) d.push({r:r,s:s}); return mezcla(d); }
function cartaPK(c){ if(!c) return '<div class="nai vacio"></div>'; return '<div class="nai'+((c.s===1||c.s===2)?' rj':'')+'"><span>'+(PKR[c.r]||c.r)+'</span><span>'+SUITS[c.s]+'</span></div>'; }
/* ===================== PÓKER EN VIVO ===================== */
const RECURSO='poker-en-vivo', MAXJ=15, DURF=Math.max(3,+(new URLSearchParams(location.search).get('dur'))||15), FICHAS0=100, RECARGA=20;

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296; }; }

function boardDe(mesa){ const dk=mazoSeed(mesa.seed), N=mesa.jug.length; return dk.slice(2*N,2*N+5); }
const NB={pre:0,flop:3,turn:4,show:5,esp:0};
const ETAPAS=['pre','flop','turn'];
function equityK(hero,board,k,N){
  const usado=new Set(hero.concat(board).map(x=>x.r*4+x.s)), rest=[];
  for(let r=2;r<=14;r++) for(let s=0;s<4;s++) if(!usado.has(r*4+s)) rest.push({r:r,s:s});
  const falta=5-board.length, need=falta+2*k; let w=0;
  for(let i=0;i<N;i++){
    for(let j=0;j<need;j++){ const q=j+Math.floor(Math.random()*(rest.length-j)); const t=rest[j]; rest[j]=rest[q]; rest[q]=t; }
    const bd=board.concat(rest.slice(0,falta)), a=eval7(hero.concat(bd)); let mejor=true, emp=1;
    for(let o=0;o<k;o++){ const b=eval7([rest[falta+2*o],rest[falta+2*o+1]].concat(bd)); if(b>a){ mejor=false; break; } if(b===a) emp++; }

}
/* --- decisiones y estado (lo usan anfitrión y alumnos) --- */
function decDe(s,etapa,ronda){ const x=s&&s.d&&s.d[etapa]; return (x&&x[0]===ronda)?x[1]:null; }
function capDe(s){ const f=(s&&typeof s.fichas==='number')?s.fichas:FICHAS0; return f<1?RECARGA:f; }
function estado(mesa,ST,etapas){
  const c={},f={};
  mesa.jug.forEach(id=>{ const s=ST.find(z=>z.id===id)||{}; c[id]=0; f[id]=false;
    etapas.forEach(e=>{ if(f[id]) return; let v=decDe(s,e,mesa.ronda);
      if(e==='pre'){ if(v===null) v=1; if(v<0){ f[id]=true; return; } c[id]+=v; }
      else { if(v===null) v=0; if(v<0){ f[id]=true; return; } c[id]+=v; } });
    c[id]=Math.min(c[id],capDe(s)); });
  return {c:c,f:f};
}
function resultadoFinal(mesa,ST){
  const e=estado(mesa,ST,ETAPAS), board=boardDe(mesa), res={};
  const pot=mesa.jug.reduce((a,id)=>a+e.c[id],0), alive=mesa.jug.filter(id=>!e.f[id]);
  const ev={}; alive.forEach(id=>{ ev[id]=eval7(manoDe(mesa,id).concat(board)); });
  let win=[]; if(alive.length){ const mx=Math.max.apply(null,alive.map(id=>ev[id])); win=alive.filter(id=>ev[id]===mx); }
  const part=win.length?Math.floor(pot/win.length):0, resto=win.length?pot-part*win.length:0;
  mesa.jug.forEach(id=>{ const w=win.indexOf(id)>=0; let d;
    if(!alive.length) d=0; else d=(w?part+(id===win[0]?resto:0):0)-e.c[id];
    res[id]={d:d,c:e.c[id],f:e.f[id]?1:0,w:w?1:0}; });
  return {res:res,pot:pot};
}

}
function decidir(v){
  if(!MESA||ETAPAS.indexOf(MESA.paso)<0||!yoEnMesa()||restante()<=0) return; const e=MESA.paso; if(decDe(miSt(),e,MESA.ronda)!==null) return;
  G.d[e]=[MESA.ronda,v]; saveMe({d:{[e]:[MESA.ronda,v]}}); render();
}
$('zona').addEventListener('click',ev=>{ const b=ev.target.closest('button[data-a]'); if(!b||b.disabled) return; decidir(b.dataset.a==='ret'?-1:+b.dataset.v); });
$('iniGo').addEventListener('click',()=>{ const c=$('iniCodigo').value.trim().toUpperCase(), n=$('iniNombre').value.trim(); if(!c||!n){ $('iniTxt').textContent='Escribe el código y tu nombre.'; return; } unirse(c,n); });

/* ============================ ANFITRIÓN ============================ */
let AB=false;
async function anfitrion(codigo){
  try{
    pantalla('screen-ini'); $('iniTxt').textContent='Conectando…';
    DB=await crearDB(true); const uid=await DB.uid();
    if(!uid) return iniTxt('Primero entra al Panel del Profesor con tu cuenta y vuelve a abrir la mesa desde ahí.',false), $('iniVolver').href='../panel-profesor.html', $('iniVolver').textContent='Ir al Panel del Profesor';
    CODE=codigo; const s=await DB.getSession(codigo);
    if(!s) return iniTxt('Ese código no existe. Crea la sesión en el Panel del Profesor.',false);
    if(s.recurso&&s.recurso!==RECURSO) return iniTxt('Ese código es de otro recurso. En el Panel elige "Póker en vivo (mesa)".',false);
    $('anfCod').textContent=codigo; AB=true;
    DB.watchStudents(CODE,l=>{ ST=l; renderAnf(); });
    DB.watchSession(CODE,m=>{ if(m===null){ iniTxt('La sesión se cerró.',false); return; } if(!MESA||(m.mesa&&(m.mesa.ronda>MESA.ronda||m.mesa.paso!==MESA.paso))) MESA=m.mesa||MESA; renderAnf(); });
    pantalla('screen-anf'); setInterval(tickAnf,400);
  }catch(e){ console.error(e); iniTxt('No se pudo conectar. Revisa tu internet.',false); }
}
function escribirMesa(m){ MESA=m; DB.setMesa(CODE,m).catch(e=>console.warn(e)); renderAnf(); }
function nuevaRonda(){
  const jug=ST.filter(s=>s.mesa&&s.name).sort((a,b)=>((a.startedAt||0)-(b.startedAt||0))||(a.id<b.id?-1:1)).slice(0,MAXJ).map(s=>s.id);
  if(jug.length<2){ $('anfMsg').textContent='Se necesitan al menos 2 jugadores para repartir.'; return; }
  $('anfMsg').textContent='';
  escribirMesa({ronda:(MESA&&MESA.ronda||0)+1,seed:Math.floor(Math.random()*4294967296),paso:'pre',t0:ahora(),dur:DURF,jug:jug,pot:0,vivos:jug,res:null});
}
function todosListos(){ const m=MESA; const e=estado(m,ST,ETAPAS.slice(0,ETAPAS.indexOf(m.paso))); return m.jug.every(id=>e.f[id]||decDe(ST.find(z=>z.id===id),m.paso,m.ronda)!==null); }
function avanzar(){
  const m=MESA; if(!m||ETAPAS.indexOf(m.paso)<0) return;
  const i=ETAPAS.indexOf(m.paso), e=estado(m,ST,ETAPAS.slice(0,i+1)), vivos=m.jug.filter(id=>!e.f[id]), pot=m.jug.reduce((a,id)=>a+e.c[id],0);
  if(i===2||vivos.length<=1){ const r=resultadoFinal(m,ST); escribirMesa(Object.assign({},m,{paso:'show',t0:ahora(),pot:pot,vivos:vivos,res:r.res,potF:r.pot})); }
  else escribirMesa(Object.assign({},m,{paso:ETAPAS[i+1],t0:ahora(),pot:pot,vivos:vivos}));
}
function tickAnf(){
  if(!MESA||ETAPAS.indexOf(MESA.paso)<0) return; const el=(ahora()-MESA.t0)/1000;
  if(el>=MESA.dur+1.5||(el>=1.5&&todosListos())) avanzar(); else renderAnf();
}
function renderAnf(){
  if(!AB||!$('screen-anf').classList.contains('active')) return;
  const m=MESA, en=m&&ETAPAS.indexOf(m.paso)>=0, el=en?Math.max(0,m.dur-(ahora()-m.t0)/1000):0;
  $('anfBar').firstElementChild.style.width=(en?el/m.dur*100:0)+'%'; $('anfBar').classList.toggle('ur',en&&el<5); $('anfT').textContent=en?'⏱ '+Math.ceil(el)+' s':'⏱ —';
  const nj=ST.filter(s=>s.mesa).length; $('anfInfo').textContent='👥 '+nj+' / '+MAXJ+(m&&m.ronda?' · Ronda '+m.ronda+' · '+({pre:'Apuesta inicial',flop:'Flop',turn:'Turn',show:'Resultado',esp:'Esperando'}[m.paso]||''):'');
  $('anfNueva').lastChild.textContent=(m&&m.ronda)?'Siguiente ronda':'Repartir ronda'; $('anfNueva').disabled=en; $('anfAdel').disabled=!en;
  const z=$('anfZona'); let h='';
  if(!m||!m.jug||m.paso==='esp'){ h='<div class="vv-est" style="font-size:1.3rem">Los alumnos entran con el código en <b>Inicio → Desafío online</b></div><div class="anf-g">'+ST.filter(s=>s.mesa).map(s=>'<div class="vv-p">'+esc(s.name||'?')+' · 🪙'+(s.fichas==null?'':s.fichas)+'</div>').join('')+'</div><div class="vv-est">Cuando estén todos, pulsa «Repartir ronda»</div>'; z.innerHTML=h; return; }
  const board=boardDe(m), nb=NB[m.paso]; let bh=''; for(let i=0;i<5;i++) bh+=cartaPK(i<nb?board[i]:null);
  h+='<div class="vv-mid"><div class="cap">Mesa · <span class="vv-bote">Bote: '+(m.paso==='show'&&m.potF!=null?m.potF:(m.pot||0))+'</span></div><div class="mano">'+bh+'</div></div>';
  if(m.paso==='show'){
    const filas=m.jug.map(id=>{ const hh=manoDe(m,id), r=(m.res||{})[id]||{d:0,f:0,w:0}; return {id:id,h:hh,r:r,v:r.f?-1:eval7(hh.concat(board))}; }).sort((a,b)=>(b.r.w-a.r.w)||(b.v-a.v));
    h+='<div class="vv-lista" style="max-width:760px">'+filas.map(x=>'<div class="vv-fila'+(x.r.w?' gan':'')+'" style="font-size:.95rem"><span class="n">'+(x.r.w?'🏆 ':'')+esc(nombreDe(x.id))+'</span><span>'+(x.r.f?'<small>se retiró</small>':x.h.map(mc).join('')+' <small>'+PKN[catPK(x.v)]+'</small>')+'</span><span class="d">'+(x.r.d>0?'+':'')+x.r.d+'</span></div>').join('')+'</div>';
  } else {
    const e=estado(m,ST,ETAPAS.slice(0,ETAPAS.indexOf(m.paso)));
    h+='<div class="anf-g">'+m.jug.map(id=>{ const s=ST.find(z=>z.id===id)||{}; let cl='vv-p',ic='⏳ '; if(e.f[id]){ cl+=' ret'; ic='🏳️ '; } else if(decDe(s,m.paso,m.ronda)!==null){ cl+=' ok'; ic='✔ '; } return '<div class="'+cl+'">'+ic+esc(s.name||'?')+'</div>'; }).join('')+'</div>';
  }
  z.innerHTML=h;
}
$('anfNueva').addEventListener('click',nuevaRonda);
$('anfAdel').addEventListener('click',avanzar);

/* ============================ ARRANQUE ============================ */
(function(){
  const q=new URLSearchParams(location.search), anf=q.get('anfitrion'), cod=q.get('codigoClase');
  if(anf){ anfitrion(anf.trim().toUpperCase()); return; }
  const ses=sesionAlumno(), inv=q.get('invitado'); const nombre=ses?ses.nombre:(inv&&inv.trim()?'👤 '+inv.trim():'');
  if(cod&&nombre){ unirse(cod.trim().toUpperCase(),nombre); return; }
  if(cod) $('iniCodigo').value=cod.toUpperCase(); if(nombre) $('iniNombre').value=nombre;
  iniTxt('Escribe el código de la mesa que te dio tu profe.',true);
})();
</script>
<script type="module" src="../mathverse-core.js"></script>
<script>
/* ---- PC: escala la mesa en pantallas grandes sin generar scroll ---- */
(function(){ var t=null;
  function ajusta(){ var Z=1; if(innerWidth>=1000&&innerHeight>=600) Z=Math.max(1,Math.min(innerWidth/1000,innerHeight/700,2.1)); if(Z<1.04) Z=1;
    var ps=document.querySelectorAll('#screen-alu,#screen-anf');
    for(var i=0;i<ps.length;i++){ var e=ps[i]; if(Z===1){ e.style.removeProperty('zoom'); e.style.removeProperty('width'); e.style.removeProperty('height'); e.style.removeProperty('--u'); }
      else{ e.style.zoom=Z; e.style.width='calc(100vw / '+Z+')'; e.style.height='calc(100dvh / '+Z+')'; e.style.setProperty('--u','calc(1dvh / '+Z+')'); } } }
  function lanza(){ clearTimeout(t); t=setTimeout(ajusta,40); }
  window.addEventListener('resize',lanza); window.addEventListener('load',ajusta); ajusta();
})();
</script>
