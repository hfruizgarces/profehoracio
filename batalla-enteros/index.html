<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Laboratorio de Números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS DE DISEÑO
   ========================================================= */
:root{
  color-scheme: dark;
  --bg-1:#1e1147;
  --bg-2:#3b1785;
  --bg-3:#5b21b6;
  --surface:rgba(255,255,255,.07);
  --surface-strong:rgba(255,255,255,.12);
  --border-soft:rgba(255,255,255,.14);

  --primary:#34d399;
  --primary-dark:#0f9d70;
  --accent:#fbbf24;
  --accent-soft:#fde68a;
  --pink:#f472b6;
  --blue:#38bdf8;
  --error:#fb7185;
  --error-soft:#3b0f1f;

  --text:#f6f3ff;
  --text-dim:#c9bdf0;
  --text-faint:#8f7fc4;

  --r-lg:22px;
  --r-md:16px;
  --r-sm:10px;

  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;

  --shadow-1: 0 10px 30px rgba(0,0,0,.35);
  --tap-min: 48px;
}

*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; width:100%; overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
h1,h2,h3{font-family:var(--font-display); margin:0;}
button, input{ -webkit-user-select:none; user-select:none; }
input{font-family:inherit;}

.hidden{display:none !important;}
.visually-hidden{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* Foco visible para accesibilidad con teclado */
:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
  border-radius:6px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* =========================================================
   LAYOUT GENERAL
   ========================================================= */
#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding: clamp(10px, 2.5vw, 24px);
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:6px 56px 14px 2px;
  flex-wrap:wrap;
}
.app-header .side{
  display:flex; align-items:center; gap:6px;
  flex:1 1 auto;
  min-width:70px;
}
.app-header .side.right{ justify-content:flex-end; }

.icon-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--surface);
  border:1px solid var(--border-soft);
  color:var(--text);
  padding:9px 12px;
  border-radius:999px;
  font-weight:700;
  font-size:clamp(.75rem, 2vw, .9rem);
  cursor:pointer;
  min-height:var(--tap-min);
  transition: background .15s, transform .1s;
  white-space:nowrap;
}
.icon-btn:hover{ background:var(--surface-strong); }
.icon-btn:active{ transform:scale(.96); }

.brand{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.2vw, 1.6rem);
  flex:0 1 auto;
  white-space:nowrap;
}
.brand .plus{
  display:inline-flex; align-items:center; justify-content:center;
  width:1.5em; height:1.5em;
  background:linear-gradient(135deg, var(--primary), var(--blue));
  border-radius:10px;
  color:#0b1a12;
  font-size:1em;
}

main{ flex:1; display:flex; flex-direction:column; }

.screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  animation: fadeSlideIn .35s ease both;
}
@keyframes fadeSlideIn{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}

.card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(16px, 4vw, 32px);
  box-shadow:var(--shadow-1);
  backdrop-filter: blur(6px);
}

/* =========================================================
   PANTALLA INICIAL
   ========================================================= */
.home-title{
  text-align:center;
  font-size:clamp(1.4rem, 5vw, 2.2rem);
  font-weight:800;
  margin-bottom:6px;
}
.home-sub{
  text-align:center;
  color:var(--text-dim);
  font-size:clamp(.9rem, 2.4vw, 1.05rem);
  margin:0 auto clamp(18px,4vw,28px);
  max-width:46ch;
}
footer.credits{ text-align:center; color: var(--text-faint); font-weight:700; font-size:.78rem; padding:20px 10px 4px; }
.level-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:clamp(10px, 2.5vw, 16px);
  width:100%;
}
@media (max-width:420px){
  .level-grid{ grid-template-columns:1fr; }
}
.level-btn{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:clamp(16px,4vw,22px) 10px;
  border-radius:var(--r-md);
  border:1px solid var(--border-soft);
  color:var(--text);
  cursor:pointer;
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1rem, 2.6vw, 1.15rem);
  min-height:96px;
  transition:transform .15s, box-shadow .15s;
}
.level-btn:hover{ transform:translateY(-3px); }
.level-btn:active{ transform:scale(.97); }
.level-btn .emoji{ font-size:clamp(1.6rem, 5vw, 2.1rem); }
.level-btn.easy{ background:linear-gradient(140deg,#0f9d70,#34d399); }
.level-btn.mid{ background:linear-gradient(140deg,#1d4ed8,#38bdf8); }
.level-btn.hard{ background:linear-gradient(140deg,#b91c66,#f472b6); }
.level-btn.custom{ background:linear-gradient(140deg,#92400e,#fbbf24); color:#fff; }

/* =========================================================
   PANTALLA "CREA TU EJERCICIO"
   ========================================================= */
.form-title{ font-size:clamp(1.2rem,3.6vw,1.5rem); font-weight:800; text-align:center; margin-bottom:4px; }
.form-sub{ color:var(--text-dim); text-align:center; margin-bottom:18px; font-size:.95rem; }

.addend-row{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:12px;
}
.addend-index{
  width:26px; text-align:right; color:var(--text-faint); font-weight:700; flex:0 0 auto;
}
.addend-input{
  flex:0 1 180px;
  min-width:0;
  background:var(--surface-strong);
  border:2px solid var(--border-soft);
  border-radius:var(--r-sm);
  color:var(--text);
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1.1rem, 3.2vw, 1.35rem);
  text-align:center;
  padding:12px 10px;
  min-height:var(--tap-min);
  letter-spacing:1px;
}
.addend-input::placeholder{ color:var(--text-faint); font-family:var(--font-body); font-weight:600; font-size:.85em;}
.addend-remove{
  flex:0 0 auto;
  width:var(--tap-min); height:var(--tap-min);
  border-radius:50%;
  background:rgba(251,113,133,.18);
  border:1px solid var(--error);
  color:var(--error);
  font-size:1.2rem;
  font-weight:800;
  cursor:pointer;
}
.dashed-btn{
  width:100%;
  max-width:220px;
  margin-left:auto; margin-right:auto;
  display:block;
  padding:12px;
  border-radius:var(--r-sm);
  border:2px dashed var(--border-soft);
  background:transparent;
  color:var(--text-dim);
  font-weight:700;
  cursor:pointer;
  min-height:var(--tap-min);
  margin-bottom:18px;
}
.dashed-btn:hover{ border-color:var(--text-dim); color:var(--text); }
.dashed-btn:disabled{ opacity:.4; cursor:not-allowed; }

.primary-btn{
  width:100%;
  padding:14px;
  border-radius:var(--r-md);
  border:none;
  background:linear-gradient(135deg, var(--primary), #10b981);
  color:#062b1c;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1rem, 2.8vw, 1.15rem);
  cursor:pointer;
  min-height:52px;
  box-shadow:0 6px 18px rgba(52,211,153,.35);
  transition:transform .12s, box-shadow .12s;
}
.primary-btn:hover{ transform:translateY(-2px); }
.primary-btn:active{ transform:scale(.98); }
.primary-btn:disabled{
  background:#4b4b5a; color:#9a9aab; box-shadow:none; cursor:not-allowed; transform:none;
}
.form-error{
  color:var(--error);
  text-align:center;
  font-weight:700;
  font-size:.9rem;
  min-height:1.4em;
  margin-bottom:10px;
}

/* =========================================================
   PANTALLA DE EJERCICIO
   ========================================================= */
.hint-box{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-md);
  padding:12px 14px;
  margin-bottom:16px;
  width:100%;
  font-size:clamp(.82rem, 2.1vw, .95rem);
  line-height:1.45;
}
.hint-box .bulb{ font-size:1.2em; flex:0 0 auto; }
.hint-box b{ color:var(--accent); }
.hint-box .ok{ color:var(--primary); }

/* =========================================================
   MODAL (llevada / totales de columna)
   ========================================================= */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(10,4,30,.6);
  backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center;
  padding:16px;
  z-index:700;
}
.modal-box{
  width:100%; max-width:400px;
  background:linear-gradient(160deg, #2c1468, #4c1d95);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(18px,4vw,26px);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.modal-close-x{
  position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
  border:1px solid var(--border-soft); background:var(--surface); color:var(--text);
  cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; z-index:5;
}
@keyframes popIn{
  from{ transform:scale(.85); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}
@keyframes monedaFlota{
  0%{ transform:translateY(0); opacity:0; }
  15%{ opacity:1; }
  100%{ transform:translateY(-24px); opacity:0; }
}
.modal-eyebrow{
  font-size:.78rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent); margin-bottom:6px; text-align:center;
}
.modal-title{
  font-size:clamp(1.05rem, 3.2vw, 1.25rem);
  text-align:center;
  margin-bottom:14px;
  line-height:1.4;
}
.modal-title b{ color:var(--accent-soft); }
.modal-fields{
  display:flex; gap:12px; justify-content:center; margin-bottom:14px; flex-wrap:wrap;
}
.modal-field{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.modal-field label{ font-size:.8rem; color:var(--text-dim); font-weight:700; text-align:center; max-width:11em; }
.modal-field input{
  width:80px;
  text-align:center;
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.3rem;
  padding:10px 6px;
  border-radius:var(--r-sm);
  border:2px solid var(--border-soft);
  background:var(--surface-strong);
  color:var(--text);
  min-height:var(--tap-min);
}
.modal-feedback{
  text-align:center; min-height:1.6em; font-weight:700; margin-bottom:10px; font-size:.9rem;
}
.modal-feedback.err{ color:var(--error); }
.modal-feedback.ok{ color:var(--primary); }
.modal-actions{ display:flex; gap:10px; }
.modal-actions button{ flex:1; }
.secondary-btn{
  padding:12px; border-radius:var(--r-md); border:1px solid var(--border-soft);
  background:transparent; color:var(--text-dim); font-weight:700; cursor:pointer;
  min-height:48px;
}

/* =========================================================
   PANTALLA DE RESULTADO / CELEBRACIÓN
   ========================================================= */
.result-hero{
  font-size:clamp(2.2rem, 9vw, 3.4rem);
  text-align:center;
}
.result-title{
  font-size:clamp(1.3rem, 4vw, 1.8rem);
  text-align:center;
  margin:8px 0 4px;
}
.result-eq{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.6vw, 1.6rem);
  text-align:center;
  color:var(--primary);
  margin-bottom:20px;
  word-break:break-word;
}
.result-actions{
  display:flex; gap:12px; width:100%; flex-wrap:wrap;
}
.result-actions button{ flex:1 1 160px; }

.confetti-piece{
  position:fixed; top:-10px; z-index:800;
  border-radius:2px;
  animation: fall linear forwards;
  pointer-events:none;
}
@keyframes fall{
  to{ transform:translateY(105vh) rotate(360deg); opacity:.9; }
}

/* =========================================================
   BARRA DE PROGRESO DE COLUMNAS
   ========================================================= */
.progress-track{
  display:flex; gap:6px; width:100%; margin-bottom:16px;
}
.progress-seg{
  flex:1; height:6px; border-radius:4px; background:rgba(255,255,255,.12);
  overflow:hidden;
}
.progress-seg .fill{
  height:100%; width:0%; background:linear-gradient(90deg, var(--primary), var(--blue));
  transition:width .4s ease;
}

/* utilidad de botón de sonido */
.sound-icon{ font-size:1.1em; }

/* =========================================================
   MULTIPLICACIÓN ÁRABE — retícula (propio del recurso)
   ========================================================= */
:root{
  --ink:var(--text); --ink-soft:var(--text-dim); --ink-faint:var(--text-faint);
  --brass:#fbbf24; --brass-dark:#f59e0b; --success:#34d399; --success-bg:rgba(52,211,153,.15);
  --error-bg:rgba(251,113,133,.15); --radius-s:10px; --radius-m:16px; --radius-l:22px;
  --font-num:var(--font-display); --font-ui:var(--font-body);
  --cell-size:calc(var(--cell-base,56px) * var(--f,1));
}
#vista{ width:100%; display:flex; flex-direction:column; }
.hero{ text-align:center; }
.problema-pill{
  align-self:center; font-family:var(--font-num); font-weight:800; letter-spacing:.04em;
  font-size:calc(clamp(1.3rem,4.4vw,1.9rem) * var(--f,1)); color:#fff;
  background:linear-gradient(150deg, rgba(44,20,104,.75), rgba(30,17,71,.75));
  box-shadow:inset 0 0 0 1px rgba(196,181,253,.35); border-radius:16px;
  padding:calc(6px * var(--f,1)) calc(22px * var(--f,1)); margin:0 0 calc(12px * var(--f,1));
}
.lattice-card{ width:100%; display:flex; flex-direction:column; align-items:center; padding:calc(4px * var(--f,1)) 0 0; }
.lattice-row{ display:flex; align-items:flex-start; gap:6px; }
.lattice-left{ display:flex; flex-direction:column; }
.top-digits, .side-digits{ display:flex; }
.top-digits{ justify-content:flex-end; margin-bottom:5px; gap:4px; }
.side-digits{ flex-direction:column; margin-top:calc(var(--cell-size) * .62 + 5px); gap:4px; margin-left:4px; }
.digit-box{
  width:var(--cell-size); height:calc(var(--cell-size) * .62); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .46); color:#fff;
  background:linear-gradient(150deg, rgba(124,58,237,.45), rgba(44,20,104,.7)); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.45);
  border:none; border-radius:12px; text-shadow:0 2px 6px rgba(0,0,0,.45);
}
.side-digits .digit-box{ width:calc(var(--cell-size) * .72); height:var(--cell-size); }
.grid-boxes{ display:grid; gap:4px; }
.lcell{
  width:var(--cell-size); height:var(--cell-size); position:relative; overflow:hidden; border-radius:10px;
  border:2px solid rgba(196,181,253,.75); background:rgba(30,17,71,.55); box-shadow:0 0 14px rgba(124,58,237,.25);
}
.lcell .tri{ position:absolute; inset:0; transition:background-color .35s ease, opacity .35s ease; }
.tri-tens{ clip-path:polygon(0 0,100% 0,0 100%); background:rgba(255,255,255,.05); }
.tri-ones{ clip-path:polygon(100% 0,100% 100%,0 100%); background:rgba(255,255,255,.1); }
.tri.diag-dim{ opacity:.35; } .tri.diag-active{ opacity:1; }
.cell-num{
  position:absolute; z-index:2; font-family:var(--font-num); font-weight:800; line-height:1; pointer-events:none;
  font-size:calc(var(--cell-size) * .36); color:#fff; text-shadow:0 2px 5px rgba(0,0,0,.5);
}
.cell-num.tens-pos{ top:12%; left:12%; } .cell-num.ones-pos{ bottom:10%; right:12%; }
.lcell input.cell-input{
  position:absolute; z-index:2; width:42%; height:42%; border:none; border-radius:7px; padding:0; outline:none;
  background:rgba(8,3,26,.55); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.5); text-align:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .32); color:#fff; user-select:text; -webkit-user-select:text;
}
.lcell input.cell-input.tens-pos{ top:6%; left:6%; } .lcell input.cell-input.ones-pos{ bottom:6%; right:6%; }
.lcell input.cell-input:focus{ background:rgba(124,58,237,.5); box-shadow:0 0 0 2.5px var(--brass), 0 0 14px rgba(251,191,36,.6); }
.lcell input.cell-input.wrong-flash{ background:var(--error-bg); box-shadow:0 0 0 2.5px var(--error); }

.diag-section{ margin-top:calc(22px * var(--f,1)); width:100%; display:flex; flex-direction:column; align-items:center; }
.diag-section h3{ font-size:calc(.86rem * var(--f,1)); font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin-bottom:calc(30px * var(--f,1)); text-align:center; }
.diag-row{ display:flex; gap:calc(8px * var(--f,1)); align-items:flex-end; flex-wrap:wrap; justify-content:center; }
.diag-box-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; }
.carry-badge{
  position:absolute; top:calc(-24px * var(--f,1)); left:50%; transform:translateX(-50%) scale(0); opacity:0;
  font-family:var(--font-num); font-weight:800; font-size:.8rem; color:#3b2405; background:var(--brass);
  border-radius:999px; padding:2px 9px; white-space:nowrap; box-shadow:0 0 10px rgba(251,191,36,.7);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
}
.carry-badge.show{ transform:translateX(-50%) scale(1); opacity:1; }
.diag-box{
  width:calc(clamp(48px,11vw,64px) * var(--f,1)); min-height:calc(clamp(48px,11vw,64px) * var(--f,1));
  border-radius:14px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1));
  border:2.5px solid var(--border-soft); background:rgba(8,3,26,.4); color:var(--text-faint); transition:all .25s ease;
}
.diag-box.pending{ opacity:.55; }
.diag-box input{ width:100%; height:100%; border:none; background:transparent; text-align:center; font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1)); color:#fff; outline:none; user-select:text; -webkit-user-select:text; }
.diag-box.wrong{ animation:shake .32s ease; }
.carry-fly{
  position:fixed; z-index:3000; font-family:var(--font-num); font-weight:800; font-size:.95rem; color:#3b2405;
  background:var(--brass); border-radius:999px; padding:4px 10px; pointer-events:none;
  transition:transform .55s cubic-bezier(.3,.6,.4,1), opacity .55s ease;
}
.final-banner{
  margin-top:calc(16px * var(--f,1)); text-align:center; background:var(--success-bg); border:2px solid var(--success);
  color:var(--success); border-radius:16px; padding:calc(10px * var(--f,1)) 20px; font-weight:800;
  font-family:var(--font-num); font-size:calc(clamp(1.1rem,3.8vw,1.5rem) * var(--f,1));
}
.arabe-final{ width:100%; display:flex; flex-direction:column; align-items:center; }
.arabe-final .mv-fila-chip{ margin-top:calc(8px * var(--f,1)); }
.arabe-final .result-actions{ margin-top:calc(14px * var(--f,1)); }
.setup-box{ width:100%; max-width:480px; margin:0 auto; text-align:center; }
.setup-box label{ display:block; font-weight:700; font-size:.95rem; color:var(--text-dim); margin-bottom:16px; }
.factor-input-row{ display:flex; align-items:center; justify-content:center; gap:clamp(10px,3vw,18px); }
.factor-input{
  width:100%; max-width:150px; font-family:var(--font-num); font-weight:800; font-size:clamp(1.6rem,7vw,2.2rem);

:root{
  color-scheme: dark;
  --bg-1:#1e1147; --bg-2:#3b1785; --bg-3:#5b21b6;
  --primary:#34d399; --accent:#fbbf24; --error:#fb7185; --blue:#38bdf8; --pink:#f472b6;
  --pos:#34d399; --pos-dark:#065f46; --neg:#fb7185; --neg-dark:#7f1d1d;
  --text:#f6f3ff; --text-dim:#c9bdf0; --text-faint:#8f7fc4;
  --surface:rgba(255,255,255,.07); --surface-strong:rgba(255,255,255,.12); --surface-soft:rgba(255,255,255,.05);
  --border-soft:rgba(255,255,255,.16);
  --shadow:0 14px 34px rgba(0,0,0,0.4);
  --radius:20px; --radius-sm:12px;
  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;
  --transition: all .2s cubic-bezier(.4,0,.2,1);
}

*{ box-sizing:border-box; }

button{ font-family:inherit; }

h1,h2,h3{ font-family:var(--font-display); margin:0; }


.wrap{ max-width:560px; margin:0 auto; padding:16px 16px 50px; }

.screen{ display:none; animation:fadeIn .35s ease; }

.screen.active{ display:block; }

@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

@keyframes monedaFlota{ 0%{ transform:translateY(0); opacity:0; } 15%{ opacity:1; } 100%{ transform:translateY(-24px); opacity:0; } }


.card{
  background:var(--surface); border:1px solid var(--border-soft); backdrop-filter:blur(6px);
  border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; width:100%;
}

@media (max-width:480px){ .level-selector{ grid-template-columns:1fr; } }


/* ---------- Crea tu ejercicio ---------- */
.crear-hint{ text-align:center; color:var(--text-dim); font-weight:600; font-size:.85rem; margin-bottom:16px; }

.crear-hint b{ color:var(--accent); }

.crear-input{
  display:block; width:100%; padding:14px; border-radius:14px; border:2px solid var(--border-soft);
  background:var(--surface-soft); color:var(--text); font-family:var(--font-display); font-weight:800;
  font-size:1.3rem; text-align:center;
}

.crear-input:focus{ outline:none; border-color:var(--accent); }

.loading-msg{ text-align:center; color:var(--text-dim); font-weight:700; margin-top:16px; display:none; }

.loading-msg.show{ display:block; }

.fase-pill{
  display:inline-flex; align-items:center; gap:6px; background:rgba(251,191,36,.14); border:1px solid rgba(251,191,36,.4);
  color:var(--accent); padding:8px 16px; border-radius:999px; font-weight:800; font-family:var(--font-display); font-size:.85rem;
}


/* ---------- Expresión (términos por ordenar) ---------- */
.expresion-row{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:18px; }

.termino-chip{
  padding:10px 16px; border-radius:12px; border:2px solid var(--border-soft); background:var(--surface-soft);
  color:var(--text); font-family:var(--font-display); font-weight:800; font-size:1.1rem; cursor:pointer; transition:var(--transition);
}

.termino-chip:hover{ transform:translateY(-2px); border-color:var(--accent); }

.termino-chip.pos{ color:var(--pos); }

.termino-chip.neg{ color:var(--neg); }

.termino-chip.usado{ opacity:.25; pointer-events:none; text-decoration:line-through; }


/* ---------- Tablero de bandos ---------- */
.tablero{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; position:relative; }


.capa-combate{ position:absolute; inset:0; pointer-events:none; z-index:60; }

.clon-combate{
  position:absolute; margin:0 !important;
  transition:left .32s cubic-bezier(.34,1.15,.64,1), top .32s cubic-bezier(.34,1.15,.64,1);
}

.clon-combate.en-combate{ animation:combateShake .34s ease-in-out .32s; }

.clon-combate.en-combate .sprite-svg{ filter:drop-shadow(0 0 8px var(--accent)); }

@keyframes combateShake{
  0%,100%{ transform:translateX(0) rotate(0deg); }
  20%{ transform:translateX(-5px) rotate(-9deg); }
  40%{ transform:translateX(5px) rotate(9deg); }
  60%{ transform:translateX(-7px) rotate(-11deg); }
  80%{ transform:translateX(7px) rotate(7deg); }
}

.chispa-combate{
  position:absolute; transform:translate(-50%,-50%); font-size:2.2rem;
  pointer-events:none; animation:chispaPop .38s ease-out .3s backwards;
}

@keyframes chispaPop{
  0%{ transform:translate(-50%,-50%) scale(.3); opacity:0; }
  50%{ transform:translate(-50%,-50%) scale(1.4); opacity:1; }
  100%{ transform:translate(-50%,-50%) scale(1.1) rotate(20deg); opacity:1; }
}

.bando{ border-radius:var(--radius-sm); overflow:hidden; border:2px solid var(--border-soft); background:var(--surface-soft); min-height:140px; display:flex; flex-direction:column; }

.bando-header{ text-align:center; font-family:var(--font-display); font-weight:800; font-size:1.05rem; padding:10px; }

.bando.neg .bando-header{ background:rgba(251,113,133,.16); color:var(--neg); }

.bando.pos .bando-header{ background:rgba(52,211,153,.16); color:var(--pos); }

.bando-total{ font-size:.78rem; font-weight:700; opacity:.85; }

.bando-body{ flex:1; display:flex; flex-wrap:wrap; align-content:flex-start; gap:4px; padding:8px; justify-content:center; max-height:260px; overflow-y:auto; }


/* ---------- Personajes (SVG) ---------- */
.personaje{ cursor:default; transition:transform .15s ease; }

.personaje.tocable{ cursor:pointer; }

.personaje.tocable:hover{ transform:translateY(-3px) scale(1.06); }

.personaje.seleccionado{ transform:translateY(-5px) scale(1.12); filter:drop-shadow(0 0 8px var(--accent)); }

.personaje-valor{ font-family:var(--font-display); font-weight:800; fill:#fff; text-anchor:middle; pointer-events:none; }


/* ---------- Instrucción ---------- */
.hint-banner{
  text-align:center; font-weight:700; color:var(--text-dim);
  background:var(--surface-soft); border:1.5px dashed var(--border-soft);
  border-radius:14px; padding:10px 16px; margin-bottom:14px; font-size:.86rem;
}

.hint-banner.warn{ border-color:var(--accent); color:var(--accent); border-style:solid; }


.btn{
  display:block; width:100%; margin:0 auto; padding:14px; border:none; border-radius:14px;
  font-family:var(--font-display); font-weight:800; font-size:1.05rem; cursor:pointer;
  transition:var(--transition); color:#062339; background:var(--blue);
  box-shadow:0 4px 14px rgba(56,189,248,.35);
}

.btn:hover{ transform:translateY(-2px); }

.btn:disabled{ opacity:.4; cursor:not-allowed; transform:none; }


/* ---------- Modal de signo ---------- */
.overlay{ position:fixed; inset:0; background:rgba(10,4,30,.65); display:flex; align-items:center; justify-content:center; z-index:1000; padding:18px; backdrop-filter:blur(3px); animation:fadeInWin .18s ease; }

@keyframes fadeInWin{ from{opacity:0;} to{opacity:1;} }

.signo-card{
  background:linear-gradient(160deg,#2c1468,#4c1d95); border:2px solid var(--accent); border-radius:var(--radius);
  padding:30px 26px; max-width:360px; width:100%; text-align:center; box-shadow:0 30px 60px rgba(0,0,0,.35);
  animation:popCard .22s cubic-bezier(.34,1.56,.64,1);
}

@keyframes popCard{ from{transform:scale(.85); opacity:0;} to{transform:scale(1); opacity:1;} }

.signo-expr{ font-family:var(--font-display); font-weight:800; font-size:2.2rem; color:var(--accent); margin-bottom:6px; }

.signo-sub{ color:var(--text-dim); font-weight:700; margin-bottom:20px; font-size:.92rem; }

.signo-opciones{ display:flex; gap:14px; }

.signo-btn{
  flex:1; padding:18px 6px; border-radius:16px; border:2px solid var(--border-soft); background:var(--surface-soft);
  color:var(--text); font-family:var(--font-display); font-weight:800; cursor:pointer; transition:var(--transition);
  display:flex; flex-direction:column; align-items:center; gap:6px;
}

.signo-icono{ font-size:2.1rem; line-height:1; font-weight:800; }

.signo-texto{ font-size:1.15rem; }

.signo-btn.neg:hover{ border-color:var(--neg); background:rgba(251,113,133,.14); color:var(--neg); }

.signo-btn.pos:hover{ border-color:var(--pos); background:rgba(52,211,153,.14); color:var(--pos); }

.signo-msg{ color:var(--error); font-weight:700; font-size:.85rem; margin-top:14px; min-height:1.2em; }


/* ---------- Final ---------- */
.resultado-final{ margin-top:14px; }

.resultado-card{
  background:linear-gradient(160deg,#2c1468,#4c1d95); border:2px solid var(--primary); border-radius:var(--radius);
  padding:22px 20px; width:100%; text-align:center;
  box-shadow:0 14px 34px rgba(0,0,0,.3), 0 0 0 4px rgba(52,211,153,.08);
  animation:popCard .3s cubic-bezier(.34,1.56,.64,1);
}

.resultado-card h2{ font-size:1.25rem; margin:6px 0 8px; }

.resultado-card p{ color:var(--text-dim); font-weight:700; margin-bottom:18px; font-size:.88rem; }


.win-card{
  background:linear-gradient(160deg,#2c1468,#4c1d95); border:2px solid var(--primary); border-radius:var(--radius);
  padding:30px 26px; max-width:380px; width:100%; text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,.35), 0 0 0 6px rgba(52,211,153,.1);
  animation:popCard .22s cubic-bezier(.34,1.56,.64,1);
}

.win-card .star-burst{ display:inline-block; animation:pop .5s ease; font-size:1.8rem; }

@keyframes pop{ 0%{transform:scale(0);} 60%{transform:scale(1.3);} 100%{transform:scale(1);} }

.win-card h2{ font-size:1.4rem; margin:6px 0 10px; }

.win-resultado{ font-family:var(--font-display); font-weight:800; font-size:1.8rem; margin-bottom:6px; }

.win-card p{ color:var(--text-dim); font-weight:700; margin-bottom:22px; font-size:.92rem; }

.win-actions-row{ display:flex; gap:10px; justify-content:center; }

.win-btn-icon{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:14px 6px;
  border:2px solid var(--border-soft); border-radius:14px; background:var(--surface-soft); color:var(--text);
  cursor:pointer; transition:var(--transition); font-family:var(--font-display); font-weight:700; font-size:.72rem;
}

.win-btn-icon:hover{ transform:translateY(-2px); border-color:var(--primary); background:rgba(52,211,153,.14); }

.win-btn-icon-glyph{ font-size:1.6rem; line-height:1; }

#btnSiguiente.win-btn-icon{ border-color:var(--primary); background:rgba(52,211,153,.12); color:var(--primary); }


/* ---------- Confeti ---------- */
.celebration{ position:fixed; inset:0; pointer-events:none; z-index:9999; overflow:hidden; }

.confetti-piece{ position:absolute; top:-20px; border-radius:2px; animation:fall linear forwards; }

@keyframes fall{ to{ transform:translateY(110vh) rotate(600deg); opacity:.3; } }

/* Quitar las flechas nativas de subir/bajar en los inputs numéricos */
input[type="number"]::-webkit-outer-spin-button,
input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

input[type="number"]{ -moz-appearance:textfield; appearance:textfield; }

<script>
window.mvExito = function(){
  try{ if(window.reaccionCompanero) window.reaccionCompanero('bien'); }catch(e){}
  var h=document.getElementById('mvCelebra'); if(!h) return;
  var img=h.querySelector('.mv-av img'); if(!img || !img.getAttribute('src')) return;
  h.classList.remove('on'); void h.offsetWidth; h.classList.add('on');
  clearTimeout(h._t); h._t=setTimeout(function(){ h.classList.remove('on'); },1700);
};
window.mvFallo = function(){ try{ if(window.reaccionCompanero) window.reaccionCompanero('mal'); }catch(e){} };

/* ============================================================
   MOTOR (validado: 500/500 simulaciones al azar llegan siempre
   al resultado aritmético correcto, sin importar el orden de
   emparejamiento de la batalla)
   ============================================================ */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function generarExpresion(nMin, nMax, magMin, magMax){
  let intentos = 0;
  while(intentos++ < 60){
    const nTerminos = randInt(nMin, nMax);
    const terminos = [];
    for(let i=0;i<nTerminos;i++){
      const signo = Math.random()<0.5 ? 1 : -1;
      terminos.push(signo * randInt(magMin, magMax));
    }
    const total = terminos.reduce((s,v)=>s+v,0);
    const hayPos = terminos.some(v=>v>0), hayNeg = terminos.some(v=>v<0);
    if(total !== 0 && hayPos && hayNeg) return { terminos, total };
  }
  return null;
}

const LEVEL_CONFIG = {
  facil:      { nMin:2, nMax:3, magMin:1, magMax:9  },
  intermedio: { nMin:4, nMax:5, magMin:1, magMax:12 },
  dificil:    { nMin:6, nMax:7, magMin:1, magMax:15 },
};

/* ============================================================
   ESTADO GLOBAL
   ============================================================ */
const App = {
  nivelActual: null,
  terminos: [],       // [{valor, id, usado}]
  totalEsperado: 0,
  unidades: { pos: [], neg: [] }, // arrays de {id, valor}
  fase: 'clasificar', // 'clasificar' | 'batalla' | 'fin'
  seleccion: null,     // {bando, id} unidad elegida para pelear
  animando: false,
};

let nextId = 1;
function uid(){ return nextId++; }

/* ============================================================
   INICIO
   ============================================================ */
function startGame(nivel){
  App.nivelActual = nivel;
  const cfg = LEVEL_CONFIG[nivel];
  const { terminos, total } = generarExpresion(cfg.nMin, cfg.nMax, cfg.magMin, cfg.magMax);
  iniciarPartidaConTerminos(terminos, total);
  switchScreen('screen-juego');
}
function iniciarNivel(cl){ startGame(cl); }

/** Arranca una partida con una lista de términos YA DEFINIDA (usada tanto
 *  por los niveles normales, con términos generados al azar, como por el
 *  modo "Crea tu ejercicio", con términos que escribió el usuario). */
function iniciarPartidaConTerminos(terminos, total){
  App.terminos = terminos.map(v => ({ id: uid(), valor: v, usado: false }));
  App.totalEsperado = total;
  App.unidades = { pos: [], neg: [] };
  App.fase = 'clasificar';
  App.seleccion = null;
  App.animando = false;

  renderExpresion();
  renderBandos();
  actualizarHint();
  document.getElementById('btnBatalla').disabled = true;
  document.getElementById('btnBatalla').style.display = 'block';
  document.getElementById('fasePill').textContent = '🧭 Clasificando';
  document.getElementById('hintBanner').style.display = 'block';
  document.getElementById('resultadoFinal').style.display = 'none';
  document.getElementById('resultadoFinal').innerHTML = '';
  document.getElementById('screen-juego').classList.remove('fase-fin');
}

function actualizarHint(){
  const hint = document.getElementById('hintBanner');
  if(App.fase === 'clasificar'){
    hint.textContent = 'Toca un término para decidir a qué bando va.';
    hint.classList.remove('warn');
  } else if(App.fase === 'batalla'){
    hint.textContent = App.seleccion
      ? 'Ahora toca un personaje del bando contrario para pelear.'
      : 'Toca un personaje de cualquier bando para elegirlo.';
    hint.classList.add('warn');
  }
}

/* ============================================================
   FASE 1: CLASIFICAR TÉRMINOS
   ============================================================ */
function renderExpresion(){
  const row = document.getElementById('expresionRow');
  row.innerHTML = '';
  App.terminos.forEach(t => {
    const chip = document.createElement('button');
    chip.className = 'termino-chip ' + (t.valor>0?'pos':'neg') + (t.usado?' usado':'');
    chip.textContent = (t.valor>0?'+':'') + t.valor;
    chip.disabled = t.usado;
    chip.onclick = () => abrirModalSigno(t.id);
    row.appendChild(chip);
  });
}

function abrirModalSigno(terminoId){
  const termino = App.terminos.find(t => t.id === terminoId);
  if(!termino || termino.usado) return;
  const root = document.getElementById('signoModalRoot');
  root.innerHTML = `
    <div class="overlay">
      <div class="signo-card">
        <div class="signo-expr">${termino.valor>0?'+':''}${termino.valor}</div>
        <p class="signo-sub">¿A qué bando pertenece este ejército?</p>
        <div class="signo-opciones">
          <button class="signo-btn neg" data-signo="-1"><span class="signo-icono">−</span><span class="signo-texto">Negativo</span></button>
          <button class="signo-btn pos" data-signo="1"><span class="signo-icono">+</span><span class="signo-texto">Positivo</span></button>
        </div>
        <p class="signo-msg" id="signoMsg"></p>
      </div>
    </div>
  `;
  root.querySelectorAll('.signo-btn').forEach(b => {
    b.onclick = () => responderSigno(terminoId, parseInt(b.dataset.signo,10));
  });
}

function responderSigno(terminoId, signoElegido){
  const termino = App.terminos.find(t => t.id === terminoId);
  const signoReal = termino.valor > 0 ? 1 : -1;
  if(signoElegido !== signoReal){
    document.getElementById('signoMsg').textContent = 'Ese no es su bando. Fíjate en el signo del número.'; mvFallo();
    return;
  }
  document.getElementById('signoModalRoot').innerHTML = '';
  termino.usado = true; try{ if(window.reaccionCompanero) window.reaccionCompanero('bien'); }catch(e){}
  reclutarTropas(termino.valor);
  renderExpresion();
  renderBandos();

  if(App.terminos.every(t => t.usado)){
    document.getElementById('btnBatalla').disabled = false;
    document.getElementById('hintBanner').textContent = '¡Todos los ejércitos están listos! Toca "A la batalla" cuando quieras.';
  }
}

/** Agrega |valor| soldados de 1 punto al bando correspondiente, y luego
 *  reagrupa el bando entero en la menor cantidad de personajes posible
 *  (unidades de 10, luego de 5, luego de 1) -- así se ve el "ejército más
 *  fuerte" apareciendo automáticamente al juntar suficientes soldados. */
function reclutarTropas(valor){
  const bando = valor > 0 ? 'pos' : 'neg';
  const cantidad = Math.abs(valor);
  const total = App.unidades[bando].reduce((s,u)=>s+u.valor, 0) + cantidad;
  App.unidades[bando] = descomponer(total);
}
function descomponer(total){
  const unidades = [];
  let resto = total;
  while(resto >= 10){ unidades.push({ id:uid(), valor:10 }); resto -= 10; }
  while(resto >= 5){ unidades.push({ id:uid(), valor:5 }); resto -= 5; }
  while(resto >= 1){ unidades.push({ id:uid(), valor:1 }); resto -= 1; }
  return unidades;
}

/* ============================================================
   PERSONAJES (SVG) -- "flacos", verde=positivo, rojo=negativo,
   3 tamaños según el valor (1 / 5 / 10)
   ============================================================ */
function svgPersonaje(valor, color, colorOscuro, uid){
  const tier = valor >= 10 ? 3 : valor >= 5 ? 2 : 1;
  const escala = tier===1 ? 1 : tier===2 ? 1.16 : 1.34;
  const vbW = 64, vbH = 92; // se extendió el alto respecto de antes, para darle
                             // espacio real al número (agrandar solo su fuente
                             // lo habría dejado cortado por el borde del dibujo)
  const w = Math.round(30*escala), h = Math.round(w * vbH/vbW);

  // Elementos que aparecen solo desde cierto nivel
  const escudo = tier>=2 ? `
    <ellipse cx="14" cy="42" rx="8" ry="11" fill="${colorOscuro}" stroke="#fff" stroke-width="1.5"/>
    <path d="M14 33 L14 51" stroke="#fff" stroke-width="1.2" opacity=".6"/>` : '';
  const capa = tier===3 ? `
    <path d="M20 26 Q10 45 18 62 L30 54 Z" fill="${colorOscuro}" opacity=".85"/>` : '';
  const tocado = tier===3
    ? `<path d="M20 12 L23 4 L27 11 L30 2 L33 11 L37 4 L40 12 Z" fill="#fbbf24" stroke="#92400e" stroke-width="1"/>`
    : tier===2
    ? `<path d="M21 10 Q30 2 39 10" stroke="${colorOscuro}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`
    : '';

  return `
    <svg viewBox="0 0 ${vbW} ${vbH}" style="--e:${escala}" data-uid="${uid}" class="sprite-svg">
      ${capa}
      <!-- piernas -->
      <rect x="21" y="58" width="8" height="14" rx="3" fill="${colorOscuro}"/>
      <rect x="35" y="58" width="8" height="14" rx="3" fill="${colorOscuro}"/>
      <!-- cuerpo -->
      <rect x="17" y="32" width="30" height="30" rx="12" fill="${color}" stroke="${colorOscuro}" stroke-width="2"/>
      <!-- brazo con espada -->
      <g class="brazo-espada">
        <circle cx="47" cy="40" r="6" fill="${color}" stroke="${colorOscuro}" stroke-width="1.5"/>
        <path d="M50 36 L62 22" stroke="#cbd5e1" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M62 22 L58 18 M62 22 L66 18" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
        <rect x="47" y="33" width="6" height="4" rx="1" fill="#92400e" transform="rotate(-40 50 35)"/>
      </g>
      ${escudo}
      <!-- cabeza -->
      <circle cx="32" cy="18" r="15" fill="${color}" stroke="${colorOscuro}" stroke-width="2"/>
      ${tocado}
      <!-- cara -->

function onPersonajeTocado(bando, id){
  if(App.animando) return;
  if(!App.seleccion){
    App.seleccion = { bando, id };
    actualizarHint();
    renderBandos();
    return;
  }
  if(App.seleccion.bando === bando){
    // tocó otro de su mismo bando: cambia la selección
    App.seleccion = { bando, id };
    renderBandos();
    return;
  }
  iniciarCombate(App.seleccion, { bando, id });
}

/** Antes de resolver el resultado, ambos personajes "entran en combate"
 *  visualmente (se sacuden con la espada en alto) y aparece un choque en
 *  el centro -- puramente decorativo, no cambia el resultado matemático,
 *  que sigue siendo siempre el correcto sin importar el orden de las peleas. */
function iniciarCombate(sel1, sel2){
  App.animando = true;
  const tablero = document.querySelector('.tablero');
  const rectTablero = tablero.getBoundingClientRect();
  const el1 = document.querySelector(`[data-unit-id="${sel1.id}"]`);
  const el2 = document.querySelector(`[data-unit-id="${sel2.id}"]`);
  if(!el1 || !el2){ setTimeout(() => { pelear(sel1, sel2); App.animando = false; }, 50); return; }

  const r1 = el1.getBoundingClientRect();
  const r2 = el2.getBoundingClientRect();
  const centroX = rectTablero.width/2, centroY = rectTablero.height/2;

  // Clonar ambos personajes en una capa flotante y ocultar los originales,
  // así se pueden mover libremente al centro sin alterar el acomodo de la
  // fila de origen (que sigue existiendo debajo, invisible, durante el viaje)
  const capa = document.createElement('div');
  capa.className = 'capa-combate';
  tablero.appendChild(capa);

  function crearClon(elOriginal, rectOriginal, offsetX){
    const clon = elOriginal.cloneNode(true);
    clon.classList.add('clon-combate');
    clon.style.left = (rectOriginal.left - rectTablero.left) + 'px';
    clon.style.top = (rectOriginal.top - rectTablero.top) + 'px';
    capa.appendChild(clon);
    requestAnimationFrame(() => {
      clon.style.left = (centroX + offsetX - rectOriginal.width/2) + 'px';
      clon.style.top = (centroY - rectOriginal.height/2) + 'px';
      clon.classList.add('en-combate');
    });
    return clon;
  }
  crearClon(el1, r1, -16);
  crearClon(el2, r2, 16);
  el1.style.visibility = 'hidden';
  el2.style.visibility = 'hidden';

  setTimeout(() => mostrarChispaCombate(capa, centroX, centroY), 340);

  setTimeout(() => {
    capa.remove();
    pelear(sel1, sel2);
    App.animando = false;
  }, 700);
}

function mostrarChispaCombate(capa, x, y){
  const chispa = document.createElement('div');
  chispa.className = 'chispa-combate';
  chispa.textContent = '⚔️';
  chispa.style.left = x + 'px';
  chispa.style.top = y + 'px';
  capa.appendChild(chispa);
}


function pelear(sel1, sel2){
  const uPos = App.seleccion.bando === 'pos' ? sel1 : sel2;
  const uNeg = App.seleccion.bando === 'neg' ? sel1 : sel2;
  const unidadPos = App.unidades.pos.find(u => u.id === uPos.id);
  const unidadNeg = App.unidades.neg.find(u => u.id === uNeg.id);

  if(unidadPos.valor === unidadNeg.valor){
    App.unidades.pos = App.unidades.pos.filter(u => u.id !== unidadPos.id);
    App.unidades.neg = App.unidades.neg.filter(u => u.id !== unidadNeg.id);
  } else if(unidadPos.valor > unidadNeg.valor){
    unidadPos.valor -= unidadNeg.valor;
    App.unidades.neg = App.unidades.neg.filter(u => u.id !== unidadNeg.id);
  } else {
    unidadNeg.valor -= unidadPos.valor;
    App.unidades.pos = App.unidades.pos.filter(u => u.id !== unidadPos.id);
  }

  App.seleccion = null;
  renderBandos();
  actualizarHint();

  if(App.unidades.pos.length === 0 || App.unidades.neg.length === 0){
    setTimeout(() => mostrarFinal(), 350);
  }
}

  const panel = document.getElementById('resultadoFinal');
  panel.innerHTML = `
    <div class="resultado-card">
      <h2>¡Bando ${ganaronPos ? 'Positivo' : 'Negativo'}!</h2>
      <p>¿Cuántos sobrevivientes quedaron en total, sumando todos los personajes?</p>

  const input = document.getElementById('cantidadInput');
  document.getElementById('btnConfirmarCantidad').onclick = () => responderCantidad(ganaronPos);

function responderCantidad(ganaronPos){
  const sobrevivientes = ganaronPos ? App.unidades.pos : App.unidades.neg;
  const totalReal = sobrevivientes.reduce((s,u)=>s+u.valor,0);
  const valorIngresado = parseInt(document.getElementById('cantidadInput').value, 10);
  if(!Number.isFinite(valorIngresado) || valorIngresado !== totalReal){
    document.getElementById('finalMsg').textContent = 'Ese número no es correcto. Vuelve a contar a los sobrevivientes del tablero.'; mvFallo();
    return;
  }
  mostrarResultadoConfirmado(ganaronPos, totalReal);
}

function mostrarResultadoConfirmado(ganaronPos, total){
  const resultado = ganaronPos ? total : -total;
  const expresionTexto = App.terminos.map((t,i) => (i===0? (t.valor>0?'':'-') : (t.valor>0?' + ':' - ')) + Math.abs(t.valor)).join('');

  document.getElementById('fasePill').textContent = '🏆 ¡Correcto!';
  const panel = document.getElementById('resultadoFinal');
  panel.innerHTML = `
    <div class="resultado-card">
      <h2>¡Exacto! ${ganaronPos ? '🟢' : '🔴'}</h2>
      <div class="win-resultado" style="color:${ganaronPos?'var(--pos)':'var(--neg)'}">${expresionTexto} = ${resultado}</div>

      <button class="btn siguiente" id="bSig" type="button">Siguiente ➜</button>

  document.getElementById('bSig').onclick = () => {

  }

}

/** Extrae todos los números con signo de un texto libre (ej: "+5 -9 +8 -3",
 *  con o sin espacios, con o sin comas -- el signo de cada uno se detecta
 *  directo, sin necesitar interpretar ninguna operación matemática, así
 *  que no hay riesgo de un parser de álgebra complicado. */
function parsearExpresion(texto){
  const coincidencias = texto.match(/[+-]?\d+/g);
  if(!coincidencias || coincidencias.length < 2) return { error:'Escribe al menos 2 números con su signo, separados por espacios.' };
  const terminos = coincidencias.map(m => parseInt(m,10));
  if(terminos.some(v => v===0)) return { error:'Ningún término puede ser 0.' };
  if(terminos.length > 10) return { error:'Como máximo 10 términos.' };
  const total = terminos.reduce((s,v)=>s+v,0);
  const hayPos = terminos.some(v=>v>0), hayNeg = terminos.some(v=>v<0);
  if(!hayPos || !hayNeg) return { error:'Necesitas al menos un término positivo y uno negativo.' };
  if(total === 0) return { error:'El resultado no puede dar exactamente 0 — ajusta algún número.' };
  return { terminos, total };
}

function comenzarPartidaCustom(){
  const resultado = parsearExpresion(document.getElementById('crearInput').value);
  const msg = document.getElementById('crearMsg');
  if(resultado.error){ msg.textContent = resultado.error; return; }
  msg.textContent = '';
  App.nivelActual = 'custom';
  iniciarPartidaConTerminos(resultado.terminos, resultado.total);
  switchScreen('screen-game');
}
