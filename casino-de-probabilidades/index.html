<style>

.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n2{--x:37;--y:8;--w:26}

/* ---- pantalla de juego ---- */
#screen-juego{align-items:stretch;width:100%}

.msg.mal{color:#fda4af}.msg.bien{color:#6ee7b7}.msg.pista{color:#fde68a}
.fila{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;flex:none}
.btn-orbita.ancho{font-size:1.15rem;padding-right:2em}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .32s}



.cuerpo{max-width:min(1000px,98vw)}

/* ruleta */
.rgrid{display:grid;grid-template-columns:auto repeat(12,1fr);gap:2px;width:100%;max-width:560px}

.mano{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.nai{width:clamp(46px,12.5vw,64px);height:clamp(66px,18vw,90px);border-radius:8px;background:#fff;color:#1e1b4b;font-family:system-ui,sans-serif;font-weight:900;font-size:clamp(1.45rem,6.8vw,2.25rem);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.35);line-height:1.05}

.pool{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:58px}
.pool div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;width:clamp(22px,7vw,34px);font-family:var(--font-display);font-weight:800;font-size:.72rem;color:#fff}
.pool i{display:block;width:100%;border-radius:4px 4px 0 0;background:#60a5fa}.pool .mal i{background:#ef4444}
/* dados */
.dd{display:flex;gap:clamp(14px,5vw,28px);justify-content:center;padding:4px 0}
.die{width:clamp(54px,17vw,80px);aspect-ratio:1;border-radius:18%;background:linear-gradient(145deg,#ff6b6b,#c81e1e 60%,#991b1b);box-shadow:inset 2px 3px 5px rgba(255,255,255,.45),inset -4px -5px 9px rgba(0,0,0,.35),0 8px 14px rgba(0,0,0,.45);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13%;gap:2%;place-items:center}
.die i{width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e5e7eb 70%);box-shadow:inset -1px -2px 3px rgba(0,0,0,.3)}
.die.rod{animation:rueda .22s linear infinite}
@keyframes rueda{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(12deg) translateY(-9px)}50%{transform:rotate(-8deg) translateY(0)}75%{transform:rotate(-14deg) translateY(-6px)}100%{transform:rotate(0) translateY(0)}}

.hist{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}.hist span{background:rgba(255,255,255,.15);border-radius:8px;padding:2px 8px;font-family:var(--font-display);font-weight:800;color:#fff}
.dist{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:92px;width:100%;max-width:420px}
.dist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-family:var(--font-display);font-weight:800;font-size:.72rem;color:#fff;gap:1px}
.dist i{display:block;width:100%;border-radius:4px 4px 0 0}
.g{background:#10b981}.p{background:#f59e0b}.l{background:#ef4444}
.mundo{position:relative;border:none;cursor:pointer;aspect-ratio:1;width:min(40vw,calc(34*var(--u,1dvh)),250px);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-family:var(--font-display);font-weight:800;background:radial-gradient(circle at 32% 26%,var(--c1),var(--c2) 70%);box-shadow:inset -8px -10px 18px rgba(0,0,0,.28),inset 5px 6px 12px rgba(255,255,255,.35),0 10px 26px rgba(0,0,0,.35);animation:flota 5s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.mundo:nth-child(2){animation-delay:-1.6s}.mundo:nth-child(3){animation-delay:-3.2s}
/* Esferas estilo planeta (igual que las pantallas de nivel): bandas, brillo, halo y órbita */
.menu-pl{position:relative;isolation:isolate}
.menu-pl::before{content:"";position:absolute;left:-2%;right:-2%;top:6%;bottom:2%;border-radius:50%;border:2px solid transparent;background:conic-gradient(from 200deg,#fbbf24,#f472b6,#a78bfa,#38bdf8,#34d399,#fbbf24) border-box;-webkit-mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0) border-box;-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) padding-box exclude,linear-gradient(#000 0 0) border-box;mask-composite:exclude;opacity:.7;transform:rotate(-6deg);pointer-events:none;z-index:-1;filter:drop-shadow(0 0 8px rgba(167,139,250,.6))}
.mundo{isolation:isolate;background:radial-gradient(circle at 33% 27%,rgba(255,255,255,.85) 0%,var(--c1) 26%,var(--c2) 72%,rgba(0,0,0,.55) 100%);box-shadow:inset -10px -12px 24px rgba(0,0,0,.55),inset 5px 6px 12px rgba(255,255,255,.32),0 0 28px rgba(var(--g),.55),0 12px 26px rgba(0,0,0,.5)}
.mundo::before{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;mix-blend-mode:soft-light;z-index:0;background:linear-gradient(160deg,transparent 8%,rgba(255,255,255,.38) 20%,transparent 33%,rgba(0,0,0,.42) 47%,transparent 60%,rgba(255,255,255,.3) 74%,transparent 90%)}
.mundo::after{content:"";position:absolute;inset:-3%;border-radius:50%;pointer-events:none;z-index:2;border:2px solid rgba(var(--g),.9);animation:halo-c 3.6s ease-in-out infinite}
.mundo:nth-child(2)::after{animation-delay:-1.2s}.mundo:nth-child(3)::after{animation-delay:-2.4s}.mundo:nth-child(4)::after{animation-delay:-3s}
.mundo>*{position:relative;z-index:1}
@keyframes halo-c{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:.15;transform:scale(1.1)}}
.mundo:nth-child(4){animation-delay:-4.1s}

  .menu-pl{flex-wrap:nowrap;gap:clamp(14px,2.4vw,44px);max-width:1500px}

const VAL=r=>Math.min(r,10);

function dadoH(n,rod){ let h='<div class="die'+(rod?' rod':'')+'">'; for(let c=1;c<=9;c++) h+=PIPS[n].indexOf(c)>=0?'<i style="grid-area:'+Math.ceil(c/3)+'/'+(((c-1)%3)+1)+'"></i>':''; return h+'</div>'; }

const D3R={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};
function cuboH(id){

  for(let n=1;n<=6;n++){ h+='<div class="fc f'+n+'">'; for(let c=1;c<=9;c++) if(PIPS[n].indexOf(c)>=0) h+='<i style="grid-area:'+Math.ceil(c/3)+'/'+(((c-1)%3)+1)+'"></i>'; h+='</div>'; }
  return h+'</div></div>';
}
const D3A={};
function d3Set(id,n,anim,dur,vueltas){
  const el=$(id); if(!el) return; const t=D3R[n], cur=D3A[id]||[0,0];
  const nx=cur[0]+((((t[0]-cur[0])%360)+360)%360)+360*(anim?vueltas[0]:0), ny=cur[1]+((((t[1]-cur[1])%360)+360)%360)+360*(anim?vueltas[1]:0);
  D3A[id]=[nx,ny];
  el.style.transition=anim?'transform '+dur+'ms cubic-bezier(.15,.7,.25,1)':'none';
  el.style.transform='rotateX('+nx+'deg) rotateY('+ny+'deg)';
  if(anim){ const w=el.parentNode; w.classList.remove('salta'); void w.offsetWidth; w.style.setProperty('--sd',dur+'ms'); w.classList.add('salta'); }

const PKN=['Carta alta','Par','Doble par','Trío','Escalera','Color','Full','Póker','Escalera de color'];
const PKR={11:'J',12:'Q',13:'K',14:'A'};
function eval7(c){
  const rc=new Array(15).fill(0), bs=[[],[],[],[]];
  for(const x of c){ rc[x.r]++; bs[x.s].push(x.r); }
  function sh(has){ for(let h=14;h>=5;h--){ let ok=true; for(let k=0;k<5;k++){ let r=h-k; if(r===1) r=14; if(!has[r]){ ok=false; break; } } if(ok) return h; } return 0; }
  const enc=a=>{ let v=0; for(let i=0;i<6;i++) v=v*15+(a[i]||0); return v; };
  let fs=-1; for(let s=0;s<4;s++) if(bs[s].length>=5) fs=s;
  if(fs>=0){ const has=new Array(15).fill(false); bs[fs].forEach(r=>{ has[r]=true; }); const h=sh(has); if(h) return enc([8,h]); }
  const q=[],t=[],p=[],k=[];
  for(let r=14;r>=2;r--){ if(rc[r]===4) q.push(r); else if(rc[r]===3) t.push(r); else if(rc[r]===2) p.push(r); else if(rc[r]===1) k.push(r); }
  if(q.length){ const rest=t.concat(p,k).sort((a,b)=>b-a); return enc([7,q[0],rest[0]]); }
  if(t.length&&(t.length>1||p.length)){ const cand=t.slice(1).concat(p); return enc([6,t[0],Math.max.apply(null,cand)]); }
  if(fs>=0){ const top=bs[fs].slice().sort((a,b)=>b-a).slice(0,5); return enc([5].concat(top)); }
  const h=sh(rc.map(n=>n>0)); if(h) return enc([4,h]);
  if(t.length){ const ks=p.concat(k).sort((a,b)=>b-a).slice(0,2); return enc([3,t[0]].concat(ks)); }
  if(p.length>=2){ const rest=p.slice(2).concat(k).sort((a,b)=>b-a); return enc([2,p[0],p[1],rest[0]]); }
  if(p.length===1) return enc([1,p[0]].concat(k.slice(0,3)));
  return enc([0].concat(k.slice(0,5)));
}
const catPK=v=>Math.floor(v/759375);
function mazoPK(){ const d=[]; for(let r=2;r<=14;r++) for(let s=0;s<4;s++) d.push({r:r,s:s}); return mezcla(d); }
function equityPK(hero,board,N){
  const known=hero.concat(board), usado=new Set(known.map(x=>x.r*4+x.s)), rest=[];
  for(let r=2;r<=14;r++) for(let s=0;s<4;s++) if(!usado.has(r*4+s)) rest.push({r:r,s:s});
  const faltan=5-board.length, need=2+faltan; let w=0;
  for(let i=0;i<N;i++){
    for(let j=0;j<need;j++){ const k=j+Math.floor(Math.random()*(rest.length-j)); const t=rest[j]; rest[j]=rest[k]; rest[k]=t; }
    const rv=[rest[0],rest[1]], bd=board.concat(rest.slice(2,2+faltan));
    const a=eval7(hero.concat(bd)), b=eval7(rv.concat(bd));
    if(a>b) w++; else if(a===b) w+=.5;
  }
  return w/N;
}
let PK=null;
function cartaPK(c){ if(!c) return '<div class="nai vacio"></div>'; return '<div class="nai'+((c.s===1||c.s===2)?' rj':'')+'"><span>'+(PKR[c.r]||c.r)+'</span><span>'+SUITS[c.s]+'</span></div>'; }
const COMBOS=[
 ['Escalera de color','5♣ 6♣ 7♣ 8♣ 9♣','5 cartas seguidas del mismo palo'],
 ['Póker','9♠ 9♥ 9♦ 9♣ K♠','4 cartas iguales'],
 ['Full','Q♠ Q♥ Q♦ 4♣ 4♠','un trío y un par'],
 ['Color','2♦ 6♦ 9♦ J♦ K♦','5 cartas del mismo palo'],
 ['Escalera','4♠ 5♥ 6♦ 7♣ 8♠','5 cartas seguidas (de cualquier palo)'],
 ['Trío','8♠ 8♥ 8♦ A♣ 3♠','3 cartas iguales'],
 ['Doble par','J♠ J♥ 5♦ 5♣ A♠','dos pares distintos'],
 ['Par','10♠ 10♥ 2♦ 7♣ K♠','2 cartas iguales'],
 ['Carta alta','A♠ J♥ 8♦ 5♣ 2♠','ninguna combinación: vale la carta más alta']

function pkRef(){
  const ante=PK.fase==='ante';
  const nb=ante?0:(PK.fin?5:(PK.etapa===0?3:4)), vis=PK.board.slice(0,nb);

    let orb='';

      PK.eq=equityPK(PK.hero,vis,2500); const pc=Math.round(PK.eq*100);
      orb='<div class="porb '+(pc>=55?'alta':pc>=35?'media':'baja')+'" title="Probabilidad de ganar" aria-label="Probabilidad de ganar '+pc+'%"><b>'+pc+'%</b></div>';
    }
    acc=orb+'<div class="pkt">Subir</div>';
    for(let x=1;x<=3;x++) acc+='<button type="button" class="pchip c'+x+'" data-a="subir" data-v="'+x+'" aria-label="Subir '+x+'"'+((PK.fin||PK.inv+x>G.fichas)?' disabled':'')+'><span>+'+x+'</span></button>';
    acc+='<button type="button" class="pchip ret" data-a="retirar" aria-label="Retirarme"'+(PK.fin?' disabled':'')+'><span>🏳️</span></button><div class="pkt">Retirar</div>';
  }
  acc+=COMBO_BTN; $('pAcc').innerHTML=acc;
}
function pkAcc(a,v){
  if(a==='pista'){ msg('Pista: si te retiras, pierdes lo que ya pusiste. Si subes, arriesgas más fichas para ganar todo el bote. Cuanta más probabilidad de ganar tienes, más conviene subir; con poca, mejor retirarse o subir lo mínimo.'); return; }
  if(a==='ante'){ if(PK.fase!=='ante') return; const x=+v; if(x>G.fichas) return; PK.inv=x; PK.fase='juego'; msg(''); pkRef(); return; }
  if(PK.fase!=='juego'||PK.fin||(a!=='subir'&&a!=='retirar')) return;
  const aInv=PK.inv, E=PK.eq, x=(a==='subir')?+v:0;
  const evR=[1,2,3].map(k=>({k:k,ev:(2*E-1)*(aInv+k),ok:aInv+k<=G.fichas})).filter(o=>o.ok);
  const opts=[{k:0,ev:-aInv}].concat(evR), best=opts.reduce((p,o)=>o.ev>p.ev?o:p,opts[0]);
  const mio=opts.filter(o=>o.k===x)[0];
  PK.dec.push({a:a,x:x,good:mio.ev>=best.ev-.2,E:E,best:best.k,opts:opts});
  if(a==='retirar'){ pkFin(false,true); return; }
  PK.inv+=x;
  if(PK.etapa===0){ PK.etapa=1; msg(''); pkRef(); return; }
  pkFin(true,false);
}
function pkFin(llega,retiro){
  PK.fin=true;
  let net,t;
  if(retiro){ net=-PK.inv; t='Te retiraste.'; }
  else {
    const a=eval7(PK.hero.concat(PK.board)), b=eval7(PK.riv.concat(PK.board));
    net=a>b?PK.inv:a<b?-PK.inv:0;
    t='Tu mano: '+PKN[catPK(a)]+'. Banca: '+PKN[catPK(b)]+'.'+(net===0?' Empate: recuperas tus fichas.':'');
  }
  resultado(net); sumaF(net);
  if(!PK.dec.filter(x=>!x.good).length) exito(); else fallo();
  pkRef(); msg(t,net>0?'bien':''); mostrarSig();
}
