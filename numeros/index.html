<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Laboratorio de Números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS DE DISEÑO
   ========================================================= */
:root{
  color-scheme: dark;
  --bg-1:#1e1147;
  --bg-2:#3b1785;
  --bg-3:#5b21b6;
  --surface:rgba(255,255,255,.07);
  --surface-strong:rgba(255,255,255,.12);
  --border-soft:rgba(255,255,255,.14);

  --primary:#34d399;
  --primary-dark:#0f9d70;
  --accent:#fbbf24;
  --accent-soft:#fde68a;
  --pink:#f472b6;
  --blue:#38bdf8;
  --error:#fb7185;
  --error-soft:#3b0f1f;

  --text:#f6f3ff;
  --text-dim:#c9bdf0;
  --text-faint:#8f7fc4;

  --r-lg:22px;
  --r-md:16px;
  --r-sm:10px;

  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;

  --shadow-1: 0 10px 30px rgba(0,0,0,.35);
  --tap-min: 48px;
}

*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; width:100%; overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
h1,h2,h3{font-family:var(--font-display); margin:0;}
button, input{ -webkit-user-select:none; user-select:none; }
input{font-family:inherit;}

.hidden{display:none !important;}
.visually-hidden{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* Foco visible para accesibilidad con teclado */
:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
  border-radius:6px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* =========================================================
   LAYOUT GENERAL
   ========================================================= */
#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding: clamp(10px, 2.5vw, 24px);
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:6px 56px 14px 2px;
  flex-wrap:wrap;
}
.app-header .side{
  display:flex; align-items:center; gap:6px;
  flex:1 1 auto;
  min-width:70px;
}
.app-header .side.right{ justify-content:flex-end; }

.icon-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--surface);
  border:1px solid var(--border-soft);
  color:var(--text);
  padding:9px 12px;
  border-radius:999px;
  font-weight:700;
  font-size:clamp(.75rem, 2vw, .9rem);
  cursor:pointer;
  min-height:var(--tap-min);
  transition: background .15s, transform .1s;
  white-space:nowrap;
}
.icon-btn:hover{ background:var(--surface-strong); }
.icon-btn:active{ transform:scale(.96); }

.brand{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.2vw, 1.6rem);
  flex:0 1 auto;
  white-space:nowrap;
}
.brand .plus{
  display:inline-flex; align-items:center; justify-content:center;
  width:1.5em; height:1.5em;
  background:linear-gradient(135deg, var(--primary), var(--blue));
  border-radius:10px;
  color:#0b1a12;
  font-size:1em;
}

main{ flex:1; display:flex; flex-direction:column; }

.screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  animation: fadeSlideIn .35s ease both;
}
@keyframes fadeSlideIn{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}

.card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(16px, 4vw, 32px);
  box-shadow:var(--shadow-1);
  backdrop-filter: blur(6px);
}

/* =========================================================
   PANTALLA INICIAL
   ========================================================= */
.home-title{
  text-align:center;
  font-size:clamp(1.4rem, 5vw, 2.2rem);
  font-weight:800;
  margin-bottom:6px;
}
.home-sub{
  text-align:center;
  color:var(--text-dim);
  font-size:clamp(.9rem, 2.4vw, 1.05rem);
  margin:0 auto clamp(18px,4vw,28px);
  max-width:46ch;
}
footer.credits{ text-align:center; color: var(--text-faint); font-weight:700; font-size:.78rem; padding:20px 10px 4px; }
.level-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:clamp(10px, 2.5vw, 16px);
  width:100%;
}
@media (max-width:420px){
  .level-grid{ grid-template-columns:1fr; }
}
.level-btn{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:clamp(16px,4vw,22px) 10px;
  border-radius:var(--r-md);
  border:1px solid var(--border-soft);
  color:var(--text);
  cursor:pointer;
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1rem, 2.6vw, 1.15rem);
  min-height:96px;
  transition:transform .15s, box-shadow .15s;
}
.level-btn:hover{ transform:translateY(-3px); }
.level-btn:active{ transform:scale(.97); }
.level-btn .emoji{ font-size:clamp(1.6rem, 5vw, 2.1rem); }
.level-btn.easy{ background:linear-gradient(140deg,#0f9d70,#34d399); }
.level-btn.mid{ background:linear-gradient(140deg,#1d4ed8,#38bdf8); }
.level-btn.hard{ background:linear-gradient(140deg,#b91c66,#f472b6); }
.level-btn.custom{ background:linear-gradient(140deg,#92400e,#fbbf24); color:#fff; }

/* =========================================================
   PANTALLA "CREA TU EJERCICIO"
   ========================================================= */
.form-title{ font-size:clamp(1.2rem,3.6vw,1.5rem); font-weight:800; text-align:center; margin-bottom:4px; }
.form-sub{ color:var(--text-dim); text-align:center; margin-bottom:18px; font-size:.95rem; }

.addend-row{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:12px;
}
.addend-index{
  width:26px; text-align:right; color:var(--text-faint); font-weight:700; flex:0 0 auto;
}
.addend-input{
  flex:0 1 180px;
  min-width:0;
  background:var(--surface-strong);
  border:2px solid var(--border-soft);
  border-radius:var(--r-sm);
  color:var(--text);
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1.1rem, 3.2vw, 1.35rem);
  text-align:center;
  padding:12px 10px;
  min-height:var(--tap-min);
  letter-spacing:1px;
}
.addend-input::placeholder{ color:var(--text-faint); font-family:var(--font-body); font-weight:600; font-size:.85em;}
.addend-remove{
  flex:0 0 auto;
  width:var(--tap-min); height:var(--tap-min);
  border-radius:50%;
  background:rgba(251,113,133,.18);
  border:1px solid var(--error);
  color:var(--error);
  font-size:1.2rem;
  font-weight:800;
  cursor:pointer;
}
.dashed-btn{
  width:100%;
  max-width:220px;
  margin-left:auto; margin-right:auto;
  display:block;
  padding:12px;
  border-radius:var(--r-sm);
  border:2px dashed var(--border-soft);
  background:transparent;
  color:var(--text-dim);
  font-weight:700;
  cursor:pointer;
  min-height:var(--tap-min);
  margin-bottom:18px;
}
.dashed-btn:hover{ border-color:var(--text-dim); color:var(--text); }
.dashed-btn:disabled{ opacity:.4; cursor:not-allowed; }

.primary-btn{
  width:100%;
  padding:14px;
  border-radius:var(--r-md);
  border:none;
  background:linear-gradient(135deg, var(--primary), #10b981);
  color:#062b1c;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1rem, 2.8vw, 1.15rem);
  cursor:pointer;
  min-height:52px;
  box-shadow:0 6px 18px rgba(52,211,153,.35);
  transition:transform .12s, box-shadow .12s;
}
.primary-btn:hover{ transform:translateY(-2px); }
.primary-btn:active{ transform:scale(.98); }
.primary-btn:disabled{
  background:#4b4b5a; color:#9a9aab; box-shadow:none; cursor:not-allowed; transform:none;
}
.form-error{
  color:var(--error);
  text-align:center;
  font-weight:700;
  font-size:.9rem;
  min-height:1.4em;
  margin-bottom:10px;
}

/* =========================================================
   PANTALLA DE EJERCICIO
   ========================================================= */
.hint-box{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-md);
  padding:12px 14px;
  margin-bottom:16px;
  width:100%;
  font-size:clamp(.82rem, 2.1vw, .95rem);
  line-height:1.45;
}
.hint-box .bulb{ font-size:1.2em; flex:0 0 auto; }
.hint-box b{ color:var(--accent); }
.hint-box .ok{ color:var(--primary); }

/* =========================================================
   MODAL (llevada / totales de columna)
   ========================================================= */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(10,4,30,.6);
  backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center;
  padding:16px;
  z-index:700;
}
.modal-box{
  width:100%; max-width:400px;
  background:linear-gradient(160deg, #2c1468, #4c1d95);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(18px,4vw,26px);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.modal-close-x{
  position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
  border:1px solid var(--border-soft); background:var(--surface); color:var(--text);
  cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; z-index:5;
}
@keyframes popIn{
  from{ transform:scale(.85); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}
@keyframes monedaFlota{
  0%{ transform:translateY(0); opacity:0; }
  15%{ opacity:1; }
  100%{ transform:translateY(-24px); opacity:0; }
}
.modal-eyebrow{
  font-size:.78rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent); margin-bottom:6px; text-align:center;
}
.modal-title{
  font-size:clamp(1.05rem, 3.2vw, 1.25rem);
  text-align:center;
  margin-bottom:14px;
  line-height:1.4;
}
.modal-title b{ color:var(--accent-soft); }
.modal-fields{
  display:flex; gap:12px; justify-content:center; margin-bottom:14px; flex-wrap:wrap;
}
.modal-field{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.modal-field label{ font-size:.8rem; color:var(--text-dim); font-weight:700; text-align:center; max-width:11em; }
.modal-field input{
  width:80px;
  text-align:center;
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.3rem;
  padding:10px 6px;
  border-radius:var(--r-sm);
  border:2px solid var(--border-soft);
  background:var(--surface-strong);
  color:var(--text);
  min-height:var(--tap-min);
}
.modal-feedback{
  text-align:center; min-height:1.6em; font-weight:700; margin-bottom:10px; font-size:.9rem;
}
.modal-feedback.err{ color:var(--error); }
.modal-feedback.ok{ color:var(--primary); }
.modal-actions{ display:flex; gap:10px; }
.modal-actions button{ flex:1; }
.secondary-btn{
  padding:12px; border-radius:var(--r-md); border:1px solid var(--border-soft);
  background:transparent; color:var(--text-dim); font-weight:700; cursor:pointer;
  min-height:48px;
}

/* =========================================================
   PANTALLA DE RESULTADO / CELEBRACIÓN
   ========================================================= */
.result-hero{
  font-size:clamp(2.2rem, 9vw, 3.4rem);
  text-align:center;
}
.result-title{
  font-size:clamp(1.3rem, 4vw, 1.8rem);
  text-align:center;
  margin:8px 0 4px;
}
.result-eq{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.6vw, 1.6rem);
  text-align:center;
  color:var(--primary);
  margin-bottom:20px;
  word-break:break-word;
}
.result-actions{
  display:flex; gap:12px; width:100%; flex-wrap:wrap;
}
.result-actions button{ flex:1 1 160px; }

.confetti-piece{
  position:fixed; top:-10px; z-index:800;
  border-radius:2px;
  animation: fall linear forwards;
  pointer-events:none;
}
@keyframes fall{
  to{ transform:translateY(105vh) rotate(360deg); opacity:.9; }
}

/* =========================================================
   BARRA DE PROGRESO DE COLUMNAS
   ========================================================= */
.progress-track{
  display:flex; gap:6px; width:100%; margin-bottom:16px;
}
.progress-seg{
  flex:1; height:6px; border-radius:4px; background:rgba(255,255,255,.12);
  overflow:hidden;
}
.progress-seg .fill{
  height:100%; width:0%; background:linear-gradient(90deg, var(--primary), var(--blue));
  transition:width .4s ease;
}

/* utilidad de botón de sonido */
.sound-icon{ font-size:1.1em; }

/* =========================================================
   MULTIPLICACIÓN ÁRABE — retícula (propio del recurso)
   ========================================================= */
:root{
  --ink:var(--text); --ink-soft:var(--text-dim); --ink-faint:var(--text-faint);
  --brass:#fbbf24; --brass-dark:#f59e0b; --success:#34d399; --success-bg:rgba(52,211,153,.15);
  --error-bg:rgba(251,113,133,.15); --radius-s:10px; --radius-m:16px; --radius-l:22px;
  --font-num:var(--font-display); --font-ui:var(--font-body);
  --cell-size:calc(var(--cell-base,56px) * var(--f,1));
}
#vista{ width:100%; display:flex; flex-direction:column; }
.hero{ text-align:center; }
.problema-pill{
  align-self:center; font-family:var(--font-num); font-weight:800; letter-spacing:.04em;
  font-size:calc(clamp(1.3rem,4.4vw,1.9rem) * var(--f,1)); color:#fff;
  background:linear-gradient(150deg, rgba(44,20,104,.75), rgba(30,17,71,.75));
  box-shadow:inset 0 0 0 1px rgba(196,181,253,.35); border-radius:16px;
  padding:calc(6px * var(--f,1)) calc(22px * var(--f,1)); margin:0 0 calc(12px * var(--f,1));
}
.lattice-card{ width:100%; display:flex; flex-direction:column; align-items:center; padding:calc(4px * var(--f,1)) 0 0; }
.lattice-row{ display:flex; align-items:flex-start; gap:6px; }
.lattice-left{ display:flex; flex-direction:column; }
.top-digits, .side-digits{ display:flex; }
.top-digits{ justify-content:flex-end; margin-bottom:5px; gap:4px; }
.side-digits{ flex-direction:column; margin-top:calc(var(--cell-size) * .62 + 5px); gap:4px; margin-left:4px; }
.digit-box{
  width:var(--cell-size); height:calc(var(--cell-size) * .62); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .46); color:#fff;
  background:linear-gradient(150deg, rgba(124,58,237,.45), rgba(44,20,104,.7)); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.45);
  border:none; border-radius:12px; text-shadow:0 2px 6px rgba(0,0,0,.45);
}
.side-digits .digit-box{ width:calc(var(--cell-size) * .72); height:var(--cell-size); }
.grid-boxes{ display:grid; gap:4px; }
.lcell{
  width:var(--cell-size); height:var(--cell-size); position:relative; overflow:hidden; border-radius:10px;
  border:2px solid rgba(196,181,253,.75); background:rgba(30,17,71,.55); box-shadow:0 0 14px rgba(124,58,237,.25);
}
.lcell .tri{ position:absolute; inset:0; transition:background-color .35s ease, opacity .35s ease; }
.tri-tens{ clip-path:polygon(0 0,100% 0,0 100%); background:rgba(255,255,255,.05); }
.tri-ones{ clip-path:polygon(100% 0,100% 100%,0 100%); background:rgba(255,255,255,.1); }
.tri.diag-dim{ opacity:.35; } .tri.diag-active{ opacity:1; }
.cell-num{
  position:absolute; z-index:2; font-family:var(--font-num); font-weight:800; line-height:1; pointer-events:none;
  font-size:calc(var(--cell-size) * .36); color:#fff; text-shadow:0 2px 5px rgba(0,0,0,.5);
}
.cell-num.tens-pos{ top:12%; left:12%; } .cell-num.ones-pos{ bottom:10%; right:12%; }
.lcell input.cell-input{
  position:absolute; z-index:2; width:42%; height:42%; border:none; border-radius:7px; padding:0; outline:none;
  background:rgba(8,3,26,.55); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.5); text-align:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .32); color:#fff; user-select:text; -webkit-user-select:text;
}
.lcell input.cell-input.tens-pos{ top:6%; left:6%; } .lcell input.cell-input.ones-pos{ bottom:6%; right:6%; }
.lcell input.cell-input:focus{ background:rgba(124,58,237,.5); box-shadow:0 0 0 2.5px var(--brass), 0 0 14px rgba(251,191,36,.6); }
.lcell input.cell-input.wrong-flash{ background:var(--error-bg); box-shadow:0 0 0 2.5px var(--error); }

.diag-section{ margin-top:calc(22px * var(--f,1)); width:100%; display:flex; flex-direction:column; align-items:center; }
.diag-section h3{ font-size:calc(.86rem * var(--f,1)); font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin-bottom:calc(30px * var(--f,1)); text-align:center; }
.diag-row{ display:flex; gap:calc(8px * var(--f,1)); align-items:flex-end; flex-wrap:wrap; justify-content:center; }
.diag-box-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; }
.carry-badge{
  position:absolute; top:calc(-24px * var(--f,1)); left:50%; transform:translateX(-50%) scale(0); opacity:0;
  font-family:var(--font-num); font-weight:800; font-size:.8rem; color:#3b2405; background:var(--brass);
  border-radius:999px; padding:2px 9px; white-space:nowrap; box-shadow:0 0 10px rgba(251,191,36,.7);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
}
.carry-badge.show{ transform:translateX(-50%) scale(1); opacity:1; }
.diag-box{
  width:calc(clamp(48px,11vw,64px) * var(--f,1)); min-height:calc(clamp(48px,11vw,64px) * var(--f,1));
  border-radius:14px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1));
  border:2.5px solid var(--border-soft); background:rgba(8,3,26,.4); color:var(--text-faint); transition:all .25s ease;
}
.diag-box.pending{ opacity:.55; }
.diag-box input{ width:100%; height:100%; border:none; background:transparent; text-align:center; font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1)); color:#fff; outline:none; user-select:text; -webkit-user-select:text; }
.diag-box.wrong{ animation:shake .32s ease; }
.carry-fly{
  position:fixed; z-index:3000; font-family:var(--font-num); font-weight:800; font-size:.95rem; color:#3b2405;
  background:var(--brass); border-radius:999px; padding:4px 10px; pointer-events:none;
  transition:transform .55s cubic-bezier(.3,.6,.4,1), opacity .55s ease;
}
.final-banner{
  margin-top:calc(16px * var(--f,1)); text-align:center; background:var(--success-bg); border:2px solid var(--success);
  color:var(--success); border-radius:16px; padding:calc(10px * var(--f,1)) 20px; font-weight:800;
  font-family:var(--font-num); font-size:calc(clamp(1.1rem,3.8vw,1.5rem) * var(--f,1));
}
.arabe-final{ width:100%; display:flex; flex-direction:column; align-items:center; }
.arabe-final .mv-fila-chip{ margin-top:calc(8px * var(--f,1)); }
.arabe-final .result-actions{ margin-top:calc(14px * var(--f,1)); }
.setup-box{ width:100%; max-width:480px; margin:0 auto; text-align:center; }
.setup-box label{ display:block; font-weight:700; font-size:.95rem; color:var(--text-dim); margin-bottom:16px; }
.factor-input-row{ display:flex; align-items:center; justify-content:center; gap:clamp(10px,3vw,18px); }
.factor-input{
  width:100%; max-width:150px; font-family:var(--font-num); font-weight:800; font-size:clamp(1.6rem,7vw,2.2rem);

:root{
  --color-primary:#38bdf8; --color-primary-dark:#7dd3fc; --color-secondary:#fbbf24; --color-success:#34d399;
  --color-card:rgba(255,255,255,.07); --color-text:#f6f3ff; --color-text-light:#c9bdf0; --surface-soft:rgba(255,255,255,.05);
  --shadow:0 14px 34px rgba(0,0,0,.4); --shadow-hover:0 20px 44px rgba(0,0,0,.5); --radius:20px; --radius-sm:12px;
  --transition:all .25s cubic-bezier(.4,0,.2,1);
  --b-mil:#ef4444; --b-mil-dark:#7f1d1d; --b-cen:#38bdf8; --b-cen-dark:#0369a1; --b-dec:#34d399; --b-dec-dark:#0f9d70; --b-uni:#fbbf24; --b-uni-dark:#b45309;
}

/* =========================================================
   BLOQUES BASE-10
   ========================================================= */
.block{
  position:relative; display:inline-flex; align-items:center; justify-content:center;
  border-radius:6px; font-family:var(--font-display); font-weight:800; color:rgba(0,0,0,.55);
  box-shadow: 0 3px 8px rgba(0,0,0,.35), inset 0 0 0 1.5px rgba(255,255,255,.3);
  animation: blockIn .3s cubic-bezier(.34,1.56,.64,1);
  flex:0 0 auto;
}
@keyframes blockIn{ from{ transform:scale(.3); opacity:0; } to{ transform:scale(1); opacity:1; } }
.block.uni{ width:clamp(16px,4.4vw,22px); height:clamp(16px,4.4vw,22px); background:linear-gradient(145deg, var(--b-uni), var(--b-uni-dark)); }
.block.dec{ width:clamp(16px,4.4vw,22px); height:clamp(66px,18vw,100px); background:linear-gradient(145deg, var(--b-dec), var(--b-dec-dark));
  display:flex; flex-direction:column; }
.block.dec::before{
  content:''; position:absolute; inset:2px; background-image:repeating-linear-gradient(to bottom, transparent 0 9%, rgba(255,255,255,.25) 9% 10%);
  border-radius:4px;
}
.block.cen{ width:clamp(66px,18vw,100px); height:clamp(66px,18vw,100px); background:linear-gradient(145deg, var(--b-cen), var(--b-cen-dark)); }
.block.cen::before{
  content:''; position:absolute; inset:2px;
  background-image:
    repeating-linear-gradient(to right, transparent 0 9%, rgba(255,255,255,.22) 9% 10%),
    repeating-linear-gradient(to bottom, transparent 0 9%, rgba(255,255,255,.22) 9% 10%);
  border-radius:4px;
}
.block.mil{
  width:clamp(58px,16vw,88px); height:clamp(58px,16vw,88px);
  margin: 12px 12px 0 0;
  background:
    repeating-linear-gradient(to right, transparent 0 9%, rgba(0,0,0,.28) 9% 10%),
    repeating-linear-gradient(to bottom, transparent 0 9%, rgba(0,0,0,.28) 9% 10%),
    linear-gradient(155deg, var(--b-mil), var(--b-mil-dark));
  box-shadow: 3px 4px 10px rgba(0,0,0,.45);
}
.block.mil::before{
  /* cara superior: su borde INFERIOR queda anclado (bottom:100%) exactamente
     sobre el borde superior de la cara frontal — por eso nunca se separa. */
  content:'';
  position:absolute;
  left:0; bottom:100%; width:100%; height:12px;
  background:
    repeating-linear-gradient(100deg, transparent 0 9%, rgba(0,0,0,.3) 9% 10%),
    linear-gradient(100deg, #fca5a5, var(--b-mil));
  transform-origin: bottom left;
  transform: skewX(-45deg);
}
.block.mil::after{
  /* cara lateral: su borde IZQUIERDO queda anclado (left:100%) exactamente
     sobre el borde derecho de la cara frontal, de arriba a abajo. */
  content:'';
  position:absolute;
  left:100%; top:0; width:12px; height:100%;
  background:
    repeating-linear-gradient(to bottom, transparent 0 9%, rgba(0,0,0,.32) 9% 10%),
    linear-gradient(190deg, var(--b-mil-dark), #4c0a0a);
  transform-origin: top left;
  transform: skewY(-45deg);
}
.block-mini{ transform:scale(.42); margin:-8px; }

/* En celular, los bloques grandes (centena/mil) dejaban solo 3 por fila.
   Se achican para que quepan al menos 6, sin perder legibilidad. */
@media (max-width:480px){
  .block.uni{ width:11px; height:11px; }
  .block.dec{ width:11px; height:42px; }
  .block.cen{ width:42px; height:42px; }
  .block.mil{ width:38px; height:38px; margin:8px 8px 0 0; }
  .block.mil::before{ height:8px; }
  .block.mil::after{ width:8px; }
  .build-mat{ gap:6px; padding:10px; }
  .mat-group{ gap:4px; margin-right:6px; }
}
.block.removable{ cursor:pointer; }
.block.removable:active{ transform:scale(.9); }
.block.leaving{ animation: blockOut .25s ease forwards; }
@keyframes blockOut{ to{ transform:scale(.2); opacity:0; } }

.block-tray{
  display:flex; justify-content:center; gap:clamp(8px, 3vw, 18px); flex-wrap:wrap;
  padding:14px; margin-bottom:14px; width:100%;
}
.tray-btn{
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px;
  background:var(--surface-strong); border:2px solid rgba(255,255,255,.25); border-radius:var(--r-md);
  padding:10px 14px; cursor:pointer; min-height:var(--tap-min); min-width:74px;
  transition:transform .12s, border-color .12s;
}
.tray-btn:hover{ border-color:#fbbf24; transform:translateY(-2px); }
.tray-btn:active{ transform:scale(.95); }
.tray-btn .lbl{ font-family:var(--font-display); font-weight:800; font-size:.78rem; color:#c9bdf0; }
.tray-btn.selected{ border-color:#34d399; background:rgba(52,211,153,.18); animation: pop .3s ease; }
.tray-btn.wrong{ border-color:#fda4af; background:rgba(251,113,133,.18); }
.tray-btn:disabled{ opacity:.5; cursor:not-allowed; }
.tray-btn:disabled:hover{ transform:none; border-color:rgba(255,255,255,.25); }
@media (max-width:420px){
  .block-tray{ gap:6px; padding:10px 4px; }
  .tray-btn{ padding:8px 4px; min-width:0; flex:1 1 0; gap:4px; }
  .tray-btn .lbl{ font-size:.62rem; }
}
.tray-btn .swatch{ width:26px; height:26px; border-radius:5px; align-self:center; }
.tray-btn.mil .swatch{ background:linear-gradient(145deg, var(--b-mil), var(--b-mil-dark)); width:28px; height:28px; }
.tray-btn.cen .swatch{ background:linear-gradient(145deg, var(--b-cen), var(--b-cen-dark)); width:22px; height:22px; }
.tray-btn.dec .swatch{ background:linear-gradient(145deg, var(--b-dec), var(--b-dec-dark)); width:8px; height:26px; }
.tray-btn.uni .swatch{ background:linear-gradient(145deg, var(--b-uni), var(--b-uni-dark)); width:9px; height:9px; }

.build-mat{
  width:100%; min-height:120px; background:rgba(0,0,0,.18); border:2px dashed rgba(255,255,255,.25);
  border-radius:var(--r-md); padding:14px; margin-bottom:14px;
  display:flex; flex-wrap:wrap; align-content:flex-start; gap:8px;
}
.mat-group{ display:flex; flex-wrap:wrap; gap:6px; align-items:flex-end; margin-right:10px; }
.mat-empty-msg{ color:#c9bdf0; font-weight:700; margin:auto; text-align:center; }

/* barra que representa un grupo ya formado (10 unidades -> 1 decena, etc.) */
.option-tiles{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:10px; }
.option-tile{
  display:flex; align-items:center; gap:8px; padding:12px 16px; border-radius:var(--r-md);
  border:2px solid rgba(255,255,255,.25); background:var(--surface-strong); color:var(--text);
  font-family:var(--font-display); font-weight:700; font-size:1rem; cursor:pointer;
  transition: transform .12s, border-color .12s;
}
.option-tile:hover{ transform:translateY(-2px); border-color:#fbbf24; }
.option-tile:active{ transform:scale(.95); }
.option-tile.correct-flash{ background:rgba(52,211,153,.28); border-color:#34d399; color:#34d399; animation: pop .3s ease; }
.option-tile.selected{ background:rgba(251,191,36,.22); border-color:#fbbf24; color:#fde68a; }
.color-palette{ display:flex; gap:clamp(6px,2vw,10px); width:100%; margin-bottom:14px; }
.color-swatch-btn{
  flex:1 1 0; min-width:0; display:flex; flex-direction:column; align-items:center; gap:4px;
  padding:clamp(8px,2vw,12px) 4px; border-radius:var(--r-md); border:2px solid rgba(255,255,255,.25);
  background:var(--surface-strong); color:var(--text); font-family:var(--font-display); font-weight:800;
  font-size:clamp(.75rem, 2.4vw, .95rem); cursor:pointer; transition:transform .12s, border-color .12s;
}
.color-swatch-btn:hover{ border-color:#fbbf24; transform:translateY(-2px); }
.color-swatch-btn:active{ transform:scale(.95); }
.color-swatch-btn.selected{ border-color:#fbbf24; background:rgba(251,191,36,.18); }
.color-swatch-btn .dot{
  width:clamp(16px,4.5vw,22px); height:clamp(16px,4.5vw,22px); border-radius:50%;
  box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35);
}

.big-number-display{
  text-align:center;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(3rem, 16vw, 5rem);
  line-height:1;
  color:#fde68a;
  text-shadow: 0 4px 18px rgba(251,191,36,.35);
  margin:6px 0 18px;
}
.color-tile-grid{ display:flex; flex-wrap:wrap; gap:clamp(6px,2vw,10px); justify-content:center; margin:16px 0; }
.color-tile{
  width:clamp(28px, 8vw, 40px); height:clamp(28px, 8vw, 40px);
  border-radius:50%; border:none;
  background:linear-gradient(145deg, #9ca3af, #52525b);
  box-shadow: inset 0 -3px 4px rgba(0,0,0,.4), inset 0 2px 3px rgba(255,255,255,.35), 0 3px 6px rgba(0,0,0,.35);
  cursor:pointer; transition:transform .1s;
}
.color-tile:hover{ transform:translateY(-2px); }
.color-tile:active{ transform:scale(.88); }
.color-tile.painted{ box-shadow: inset 0 -3px 4px rgba(0,0,0,.4), inset 0 2px 3px rgba(255,255,255,.35), 0 4px 10px rgba(0,0,0,.4); }
.option-tile.wrong-flash{ background:rgba(251,113,133,.22); border-color:#fda4af; color:#fda4af; }
.modal-feedback{ text-align:center; min-height:1.6em; font-weight:700; margin-top:6px; font-size:.9rem; }
.modal-feedback.err{ color:#fda4af; }
.modal-feedback.ok{ color:#34d399; }

.travel-clone{
  position:fixed; z-index:800; pointer-events:none;
  transition: left .6s cubic-bezier(.4,0,.2,1), top .6s cubic-bezier(.4,0,.2,1), transform .6s cubic-bezier(.4,0,.2,1), opacity .6s;
}
.travel-clone.spin{ transform: rotate(720deg) scale(.3); opacity:0; }

<script>
/* =====================================================================
   LABORATORIO DE NÚMEROS — LÓGICA (nueva versión Mathverse)
   ===================================================================== */
const UNITS = ['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve'];
const TEN_TO_29 = ['diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve',
  'veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const TENS = {3:'treinta',4:'cuarenta',5:'cincuenta',6:'sesenta',7:'setenta',8:'ochenta',9:'noventa'};
const HUNDREDS = {2:'doscientos',3:'trescientos',4:'cuatrocientos',5:'quinientos',6:'seiscientos',7:'setecientos',8:'ochocientos',9:'novecientos'};

function twoDigitsWords(n){
  if(n===0) return '';
  if(n<10) return UNITS[n];
  if(n<30) return TEN_TO_29[n-10];
  const t=Math.floor(n/10), u=n%10;
  return u===0 ? TENS[t] : `${TENS[t]} y ${UNITS[u]}`;
}
function threeDigitsWords(n){
  if(n===0) return '';
  if(n<100) return twoDigitsWords(n);
  const h=Math.floor(n/100), rest=n%100;
  if(h===1) return rest===0 ? 'cien' : `ciento ${twoDigitsWords(rest)}`;
  return rest===0 ? HUNDREDS[h] : `${HUNDREDS[h]} ${twoDigitsWords(rest)}`;
}
function numberToWords(n){
  let words;
  if(n<1000) words = threeDigitsWords(n);
  else { const rest = n%1000; words = rest===0 ? 'mil' : `mil ${threeDigitsWords(rest)}`; }
  return words.charAt(0).toUpperCase() + words.slice(1);
}
function normalizeText(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
}
/* Distancia de Levenshtein estándar (número mínimo de ediciones para
   pasar de una cadena a otra). */
function levenshtein(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1}, (_,i)=>[i, ...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j] = j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
/* Se acepta si el nombre escrito está lo bastante cerca del correcto —
   errores de ortografía (p. ej. "setesientos" por "setecientos") no
   deben bloquear a un estudiante que sí sabe nombrar el número. El
   margen crece con el largo del nombre, pero siempre exige coincidencia
   exacta de las palabras (no solo "se parece"). */
/* Además de la forma formal ("cuarenta y cinco"), se acepta la variante
   fusionada con "i" muy usada al escribir a mano ("cuarentaicinco"). */
/* Formas tradicionales "veinte y X" del 21 al 29, tan válidas como la
   fusionada "veintiX" — mismo criterio que "cuarenta y cinco"/"cuarentaicinco". */
const VEINTI_UNFUSED = {
  'veintiuno':'veinte y uno', 'veintidós':'veinte y dos', 'veintitrés':'veinte y tres',
  'veinticuatro':'veinte y cuatro', 'veinticinco':'veinte y cinco', 'veintiséis':'veinte y seis',
  'veintisiete':'veinte y siete', 'veintiocho':'veinte y ocho', 'veintinueve':'veinte y nueve',
};
function acceptableWordVariants(correctText){
  const variants = [correctText];
  if(/\sy\s/i.test(correctText)){
    variants.push(correctText.replace(/\s+y\s+/i, 'i'));
  }
  for(const fused in VEINTI_UNFUSED){
    const re = new RegExp('\\b'+fused+'\\b', 'i');
    if(re.test(correctText)){
      variants.push(correctText.replace(re, VEINTI_UNFUSED[fused]));
    }
  }
  return variants;
}
/* Devuelve {ok, exact}: ok = se acepta la respuesta; exact = coincide tal
   cual (sin errores) con alguna de las formas válidas. Cuando ok=true pero
   exact=false, el estudiante escribió cerca pero con algún error y merece
   un aviso correctivo, no solo un "correcto". */
function wordsMatch(userText, correctText){
  const a = normalizeText(userText);
  if(a === '') return {ok:false, exact:false};
  const variants = acceptableWordVariants(correctText).map(normalizeText);
  if(variants.includes(a)) return {ok:true, exact:true};
  const maxDist = Math.max(1, Math.round(variants[0].length * 0.1));
  const closest = Math.min(...variants.map(v=>levenshtein(a, v)));
  return {ok: closest <= maxDist, exact:false};
}

function ensureAudio(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ audioCtx=null; } }
  return audioCtx;
}
function playTone(freq, dur, type='sine', vol=0.18){
  if(!soundOn) return;
  const ctx = ensureAudio(); if(!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type=type; osc.frequency.value=freq; gain.gain.value=vol;
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+dur);
  osc.connect(gain).connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+dur);
}

/* Dibuja el "mat" de construcción a partir de counts={mil,cen,dec,uni}.
   Si onRemove se entrega, cada bloque se puede tocar para quitarlo. */
function renderMat(container, counts, onRemove){
  container.innerHTML = '';
  const total = counts.mil+counts.cen+counts.dec+counts.uni;
  if(total===0){
    const msg = document.createElement('p');

      const b = renderBlock(t.key, false);
      if(onRemove){

/* Cada valor posicional se apila en columnas de 2 (máximo 2 filas). El tamaño de los bloques se calcula
   según lo que haya, para aprovechar al máximo el alto y el ancho del cuadro. */
const _roMats = new ResizeObserver(es => es.forEach(e => ajustarBloques(e.target)));
function ajustarBloques(mat){
  if(!mat || mat.classList.contains('mini10')) return;
  if(!mat.dataset.ro){ mat.dataset.ro = '1'; _roMats.observe(mat); }
  const cs = getComputedStyle(mat);
  const W = mat.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const H = mat.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  if(W <= 0 || H <= 0) return;
  const grupos = [...mat.querySelectorAll(':scope > .mat-group')];
  const FINO = 0.36;
  let unidades = 0, fijo = 0;
  grupos.forEach(g => {
    const b = g.querySelector('.block'); if(!b) return;
    const cols = Math.ceil(g.children.length / 2);
    const ancho = (b.classList.contains('dec') || b.classList.contains('uni')) ? FINO : 1;
    unidades += cols * ancho; fijo += (cols - 1) * 3;
  });
  fijo += Math.max(0, grupos.length - 1) * 10;
  const tope = mat.classList.contains('grande') ? 34 : 60;
  let b = tope;
  if(unidades > 0) b = Math.min(b, (W - fijo) / unidades);
  b = Math.min(b, (H - 3) / 2);
  mat.style.setProperty('--b', Math.max(8, Math.floor(b * 10) / 10) + 'px');
}
const _renderMatBase = renderMat;
renderMat = function(container, counts, onRemove){ _renderMatBase(container, counts, onRemove); ajustarBloques(container); };
window.addEventListener('resize', () => document.querySelectorAll('.build-mat').forEach(ajustarBloques));

                   target.dec===practiceCounts.dec && target.uni===practiceCounts.uni;

    sfxOk(); reaccion('bien'); practiceFeedback('¡Bloques correctos!', true);
    document.querySelectorAll('#practice-tray .tray-btn').forEach(b=>b.disabled=true);
    const clearBtn = document.getElementById('practice-clear'); if(clearBtn) clearBtn.disabled = true;
    maybeFinishPractice();
  }
}

/* Al reunir 10 bloques de un mismo tipo, se transforman solas en 1 del
   siguiente valor — igual que en la vida real, sin que el estudiante
   tenga que pedirlo. */
function triggerAutoGroup(k){
  const order = ['uni','dec','cen','mil'];
  const idx = order.indexOf(k);
  if(idx === order.length-1) return; // 'mil' no tiene un valor superior en este sistema
  const nextKey = order[idx+1];
  const mat = document.getElementById('explore-mat');
  const toAnimate = [...mat.querySelectorAll('.block.'+k)].slice(0,10);
  if(toAnimate.length < 10) return;
  sfxGroup();
  animateGroupTravel(toAnimate, k, ()=>{
    exploreCounts[k] -= 10;
    exploreCounts[nextKey] += 1;
    renderExplore();
    if(exploreCounts[nextKey] >= 10){ triggerAutoGroup(nextKey); }
  });
}
function renderExplore(){
  renderMat(document.getElementById('explore-mat'), exploreCounts, (k)=>{
    if(exploreCounts[k]>0) exploreCounts[k]--;
    renderExplore();
  });
  const n = composeFromCounts(exploreCounts);
  document.getElementById('explore-num').textContent = n;
  document.getElementById('explore-words').textContent = n>0 ? numberToWords(n) : '\u00a0';
}

/* Anima un grupo de bloques "viajando" hacia el centro de la pantalla,
   girando, y desapareciendo — usado por el auto-agrupamiento de
   Exploración. */
function animateGroupTravel(sourceEls, colorClass, onDone){
  const targets = [];
  sourceEls.forEach(el=>{
    const r = el.getBoundingClientRect();
    const clone = document.createElement('div');
    clone.className = 'block ' + colorClass + ' travel-clone';
    clone.style.left = r.left+'px'; clone.style.top = r.top+'px';
    clone.style.width = r.width+'px'; clone.style.height = r.height+'px';
    document.body.appendChild(clone);
    targets.push(clone);
    el.classList.add('leaving');
  });
  const cx = window.innerWidth/2 - 20, cy = window.innerHeight/2 - 20;
  requestAnimationFrame(()=>{
    targets.forEach(t=>{ t.style.left = cx+'px'; t.style.top = cy+'px'; });
  });
  setTimeout(()=>{
    targets.forEach(t=>t.classList.add('spin'));
  }, 620);
  setTimeout(()=>{
    targets.forEach(t=>t.remove());
    if(onDone) onDone();
  }, 1250);
}

/* Arrastrar sobre elementos (mouse o dedo). onDown(el) devuelve el "modo" (o false para ignorar);
   onOver(el, modo) se llama al pasar por otros elementos (devolver false termina el arrastre). */
function superficieArrastre(contenedor, selector, onDown, onOver){
  contenedor.style.touchAction = 'none';
  contenedor.addEventListener('pointerdown', e => {
    const it = e.target.closest(selector);
    if(!it || !contenedor.contains(it)) return;
    e.preventDefault();
    const modo = onDown(it);
    if(modo === false) return;
    const mover = ev => {
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const t = el && el.closest(selector);
      if(t && contenedor.contains(t) && onOver(t, modo) === false) parar();
    };
    const parar = () => {
      document.removeEventListener('pointermove', mover);
      document.removeEventListener('pointerup', parar);
      document.removeEventListener('pointercancel', parar);
    };
    document.addEventListener('pointermove', mover);
    document.addEventListener('pointerup', parar);
    document.addEventListener('pointercancel', parar);
  });
}

/* ---------------------------------------------------------------------
   DESAFÍO: DESCUBRE EL NÚMERO
   Sobran bloques de un tipo. Se seleccionan 10 iguales (tocando o arrastrando),
   se eligen por cuál se cambian, y al final se escribe el número.
   --------------------------------------------------------------------- */
let agruparCounts = null;
let agruparSel = [];
let agruparKey = null;
function startAgrupar(){
  agruparCounts = { mil: randInt(0,1), cen: randInt(0,4), dec: randInt(0,4), uni: randInt(0,4) };
  const pick = ['cen','dec','uni'][randInt(0,2)];
  agruparCounts[pick] += 10;
  agruparSel = []; agruparKey = null;

  const body = challengeShell('Canjea y descubre el número',
    'Hay bloques de más. <b>Selecciona 10 iguales</b> (toca o arrastra sobre ellos), presiona <b>Canjear</b> y cámbialos por <b>1</b> del tipo que sigue.');
  const chip = document.createElement('div'); chip.className = 'sel-chip'; chip.id = 'agrupar-chip';
  body.appendChild(chip);
  const mat = document.createElement('div'); mat.className = 'build-mat grande'; mat.id = 'agrupar-mat';
  body.appendChild(mat);
  const acc = document.createElement('div'); acc.className = 'acciones-centro'; acc.id = 'agrupar-acc';
  acc.innerHTML = '<button type="button" class="btn-orbita v-oro" id="btn-canjear" data-enter="1" disabled><span class="bola"><svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg></span><span>Canjear</span></button>';
  body.appendChild(acc);
  const ans = document.createElement('div'); ans.id = 'agrupar-ans';
  body.appendChild(ans);
  document.getElementById('btn-canjear').addEventListener('click', () => {
    if(agruparSel.length === 10) openAgruparDialog(agruparKey, agruparSel.slice());
  });

  superficieArrastre(mat, '.block',
    (b) => {
      if(mat.classList.contains('ocupado')) return false;
      const quitar = b.classList.contains('sel');
      if(quitar){ agruparQuitar(b); return 'off'; }
      if(!agruparAgregar(b)) return false;
      return 'on';
    },
    (b, modo) => {
      if(mat.classList.contains('ocupado')) return false;
      if(modo === 'off'){ if(b.classList.contains('sel')) agruparQuitar(b); return true; }
      if(b.classList.contains('sel')) return true;
      if(b.dataset.key !== agruparKey) return true;
      return agruparAgregar(b);
    });
  renderAgruparMat();
}
function actualizarChipAgrupar(){
  const chip = document.getElementById('agrupar-chip');
  if(!chip) return;
  const bt = document.getElementById('btn-canjear');
  if(bt) bt.disabled = agruparSel.length !== 10;
  if(!agruparKey){ chip.innerHTML = 'Selecciona 10 bloques iguales'; chip.classList.remove('lleno'); return; }
  chip.innerHTML = agruparSel.length === 10
    ? `¡Listo! Tienes <b>10</b> ${NOM_PLURAL[agruparKey]}: presiona <b>Canjear</b>`
    : `Llevas <b>${agruparSel.length}</b> de 10 · ${agruparSel.length === 1 ? NOM_SING[agruparKey] : NOM_PLURAL[agruparKey]}`;
}
function agruparAgregar(b){
  const key = b.dataset.key;
  if(agruparKey && agruparKey !== key){
    agruparSel.forEach(e => e.classList.remove('sel')); agruparSel = [];
  }
  agruparKey = key;
  if(agruparSel.length >= 10) return false;
  b.classList.add('sel'); agruparSel.push(b); sfxGroup();
  actualizarChipAgrupar();
  return agruparSel.length < 10;
}
function agruparQuitar(b){
  b.classList.remove('sel');
  agruparSel = agruparSel.filter(e => e !== b);
  if(!agruparSel.length) agruparKey = null;
  actualizarChipAgrupar();
}
function renderAgruparMat(){
  const mat = document.getElementById('agrupar-mat');
  mat.innerHTML = ''; agruparSel = []; agruparKey = null;
  BLOCK_TYPES.forEach(t=>{
    const n = agruparCounts[t.key];
    if(n<=0) return;
    const group = document.createElement('div'); group.className='mat-group';
    for(let i=0;i<n;i++){
      const b = renderBlock(t.key,false);
      b.classList.add('removable'); b.dataset.key = t.key;
      group.appendChild(b);
    }
    mat.appendChild(group);
  });
  actualizarChipAgrupar();
  ajustarBloques(mat);
  checkAgruparMaybeDone();
}
function openAgruparDialog(fromKey, sourceEls){
  const nextMap = { uni:'dec', dec:'cen', cen:'mil' };
  const correctNext = nextMap[fromKey];

function startCompleta(){
  const n = randInt(100, 1999);
  const c = decompose(n);
  const known = ['mil','cen','dec','uni'].filter(k=>c[k]>0);
  const missingKey = known[randInt(0,known.length-1)];

  body.insertAdjacentHTML('beforeend', orbeHTML('Número', n));

      sfxOk(); reaccion('bien');
      challengeFeedback('', true);

        `¿Cuántas ${NOM_PLURAL[missingKey]} faltan?`, '?', 1);
      caja.querySelector('.reg-eyebrow').insertAdjacentHTML('afterbegin', `<span class="mini-sw ${missingKey}"></span>`);

        this.value = this.value.replace(/[^0-9]/g,'').slice(0,1);

        if(Number(this.value)===c[missingKey]){
          sfxOk(); reaccion('bien'); xpDesafio(); challengeFeedback('¡Correcto!', true); sfxWin(); launchConfetti();
          this.disabled = true; caja.classList.add('solved');

   DESAFÍO: COLOREA — se puede pintar arrastrando
   --------------------------------------------------------------------- */
const COLOR_DEFS = [
  { key:'mil', name:'Rojo',     value:1000, css:'var(--b-mil)', grad:'radial-gradient(circle at 32% 26%, #fff9 0 8%, #fca5a5 18%, var(--b-mil) 55%, var(--b-mil-dark))' },
  { key:'cen', name:'Azul',     value:100,  css:'var(--b-cen)', grad:'radial-gradient(circle at 32% 26%, #fff9 0 8%, #bae6fd 18%, var(--b-cen) 55%, var(--b-cen-dark))' },
  { key:'dec', name:'Verde',    value:10,   css:'var(--b-dec)', grad:'radial-gradient(circle at 32% 26%, #fff9 0 8%, #a7f3d0 18%, var(--b-dec) 55%, var(--b-dec-dark))' },
  { key:'uni', name:'Amarillo', value:1,    css:'var(--b-uni)', grad:'radial-gradient(circle at 32% 26%, #fff9 0 8%, #fde68a 18%, var(--b-uni) 55%, var(--b-uni-dark))' },
];
function startColorea(){
  const n = randInt(11, 2000);
  const need = decompose(n);
  const totalTiles = 30;

  const body = challengeShell('Colorea', 'Cada color vale distinto: <b>pinta las canicas</b> necesarias para formar el número. Arrastra para pintar varias.');
  body.insertAdjacentHTML('beforeend', orbeHTML('Número', n));

  const palette = document.createElement('div');
  palette.className = 'color-palette';
  let selectedColor = COLOR_DEFS[0].key;
  COLOR_DEFS.forEach((cd,i)=>{
    const btn = document.createElement('button');
    btn.type='button'; btn.className='color-swatch-btn'+(i===0?' selected':'');
    btn.style.setProperty('--cc', cd.css);
    btn.innerHTML = `<span class="dot" style="background:${cd.grad}"></span><span class="val">${cd.value}</span>`;
    btn.addEventListener('click', ()=>{
      palette.querySelectorAll('.color-swatch-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedColor = cd.key;
    });
    palette.appendChild(btn);
  });
  body.appendChild(palette);

  const tileGrid = document.createElement('div');
  tileGrid.className = 'color-tile-grid';
  const tileColors = new Array(totalTiles).fill(null);
  const tiles = [];
  for(let i=0;i<totalTiles;i++){
    const tile = document.createElement('button');
    tile.type='button'; tile.className='color-tile'; tile.dataset.i = i;
    tile.setAttribute('aria-label','Canica '+(i+1)); tile.tabIndex = -1;
    tileGrid.appendChild(tile); tiles.push(tile);
  }
  function pintar(i, modo){
    const tile = tiles[i];
    if(modo === 'borrar'){
      if(tileColors[i] === null) return;
      tileColors[i] = null; tile.style.background=''; tile.classList.remove('painted');
    } else {
      if(tileColors[i] === selectedColor) return;
      tileColors[i] = selectedColor;
      tile.style.background = COLOR_DEFS.find(cd=>cd.key===selectedColor).grad;
      tile.classList.add('painted');
    }
  }
  superficieArrastre(tileGrid, '.color-tile',
    (t) => { const i = +t.dataset.i; const modo = (tileColors[i] === selectedColor) ? 'borrar' : 'pintar'; pintar(i, modo); sfxGroup(); return modo; },
    (t, modo) => { pintar(+t.dataset.i, modo); return true; });
  body.appendChild(tileGrid);

  const fila = document.createElement('div'); fila.className = 'acciones-centro';
  const checkBtn = document.createElement('button');
  checkBtn.type='button'; checkBtn.className='btn-orbita v-azul'; checkBtn.dataset.enter='1';
  checkBtn.innerHTML = '<span class="bola"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><span>Comprobar</span>';
  fila.appendChild(checkBtn);
  body.appendChild(fila);
  checkBtn.addEventListener('click', ()=>{
    const counts = {mil:0,cen:0,dec:0,uni:0};
    tileColors.forEach(k=>{ if(k) counts[k]++; });
    const matches = COLOR_DEFS.every(cd=>counts[cd.key]===need[cd.key]);
    if(matches){
      sfxOk(); reaccion('bien'); xpDesafio(); challengeFeedback('¡Correcto!', true); sfxWin(); launchConfetti();
      tileGrid.classList.add('ocupado'); fila.innerHTML = '';
      fila.appendChild(botonSiguiente(startColorea));
    } else {
      sfxErr(); reaccion('mal'); challengeFeedback('Todavía no coincide. Revisa cuántas canicas de cada color pintaste.', false);
    }
  });
}

function beginCarreraRound(){
  const [min,max] = RANGO_CARRERA;
  carreraState = { score:0, timeLeft:150, target: randInt(min,max), counts:{mil:0,cen:0,dec:0,uni:0}, interval:null };
  const body = challengeShell('Carrera contra el tiempo', 'Construye el número con bloques lo más rápido que puedas.');
  body.insertAdjacentHTML('beforeend', orbeHTML('Forma el número', '<span id="carrera-target">' + carreraState.target + '</span>'));
  const tray = document.createElement('div'); tray.className='block-tray'; tray.id='carrera-tray';
  const mat = document.createElement('div'); mat.className='build-mat'; mat.id='carrera-mat';
  const zona = document.createElement('div'); zona.className = 'zona-construir';
  zona.appendChild(tray); zona.appendChild(mat);
  body.appendChild(zona);
  buildTray(tray, (k)=>{
    if(carreraState.counts[k] >= 9){ sfxErr(); challengeFeedback('Ya son 9: no caben más de este tipo.', false); return; }
    carreraState.counts[k]++;
    renderCarreraMat();
  }, { types: TIPOS_CARRERA });
  renderCarreraMat();
  document.getElementById('timer-pill').classList.remove('hidden');
  document.getElementById('contador-pill').classList.remove('hidden');
  actualizarHudCarrera();
  carreraState.interval = setInterval(()=>{
    carreraState.timeLeft--;
    actualizarHudCarrera();
    if(carreraState.timeLeft<=0){
      clearInterval(carreraState.interval); carreraState.interval = null;
      finishCarrera();
    }
  }, 1000);
}
function renderCarreraMat(){
  renderMat(document.getElementById('carrera-mat'), carreraState.counts, (k)=>{
    if(carreraState.counts[k]>0) carreraState.counts[k]--;
    renderCarreraMat();
  });
  const target = decompose(carreraState.target);
  const c = carreraState.counts;
  const matches = target.mil===c.mil && target.cen===c.cen && target.dec===c.dec && target.uni===c.uni;
  if(matches){
    carreraState.score++;
    sfxOk(); reaccion('bien'); xpDesafio();
    const [min,max] = RANGO_CARRERA;
    carreraState.target = randInt(min,max);
    carreraState.counts = {mil:0,cen:0,dec:0,uni:0};
    document.getElementById('carrera-target').textContent = carreraState.target;
    actualizarHudCarrera();
    renderMat(document.getElementById('carrera-mat'), carreraState.counts, (k)=>{
      if(carreraState.counts[k]>0) carreraState.counts[k]--;
      renderCarreraMat();
    });
  }
}
async function finishCarrera(){
  sfxWin(); launchConfetti();
  const score = carreraState.score;

    const previo = recordLocal();
    if(score > previo){ guardarRecordLocal(score); extra = previo ? ' ¡Nuevo récord personal!' : ' ¡Primer récord guardado!'; }

}

/* Ajuste a la altura: si no cabe, se achica un poco todo el contenido (--fz) para evitar el scroll */
(function(){
  const raiz = document.documentElement; let pend = false;
  function ajustar(){
    pend = false;
    let f = 1; raiz.style.setProperty('--fz', '1');
    const sobra = () => raiz.scrollHeight - window.innerHeight;
    let guardia = 0;
    while(sobra() > 1 && f > 0.5 && guardia++ < 16){ f = Math.max(0.5, f - 0.04); raiz.style.setProperty('--fz', f.toFixed(2)); }
  }
  function pedir(){ if(!pend){ pend = true; requestAnimationFrame(ajustar); } }
  window.addEventListener('resize', pedir);
  window.addEventListener('load', () => { pedir(); setTimeout(pedir, 800); });
  new MutationObserver(pedir).observe(document.getElementById('main'), { subtree:true, childList:true, attributes:true, attributeFilter:['class','style'] });
  pedir();
})();

    if(!sessionSnap.exists()) return { ok:false, error:'Ese código no existe. Revísalo con tu profesor.' };
    const datos = sessionSnap.data();

    if(datos.active === false) return { ok:false, error:'Tu profesor ya cerró esta sesión.' };
    if(datos.recurso && datos.recurso !== 'numeros') return { ok:false, error:`Ese código es para ${datos.recurso}, no para Números.` };

    const duracionMinutos = datos.duracionMinutos || 180;
    if(datos.createdAt){
      const minutosTranscurridos = (Date.now() - datos.createdAt.toDate().getTime()) / 60000;
      if(minutosTranscurridos > duracionMinutos) return { ok:false, error:'Este código ya venció. Pídele uno nuevo a tu profesor.' };
    }

    return { ok:true, uid, nivelObjetivo: datos.nivelObjetivo, modoObjetivo: datos.modoObjetivo };
  } catch(err){
    console.error(err);
    return { ok:false, error:'Error de conexión. Intenta de nuevo.' };
  }
};

window.guardarRecordeNumeros = async function(id, nombre, mejor){
  try{
    await signInAnonymously(auth);
    const ref = doc(db, 'rankingNumeros', id);
    const s = await getDoc(ref);
    const previo = s.exists() ? (Number(s.data().mejor) || 0) : 0;
    if(mejor > previo) await setDoc(ref, { nombre: nombre, mejor: mejor, actualizado: serverTimestamp() });
    return Math.max(previo, mejor);
  } catch(err){ console.error('No se pudo guardar el récord:', err); return null; }
};
window.leerRecordNumeros = async function(id){
  try{
    await signInAnonymously(auth);
    const s = await getDoc(doc(db, 'rankingNumeros', id));
    return s.exists() ? (Number(s.data().mejor) || 0) : 0;
  } catch(err){ return 0; }
};
window.leerRankingNumeros = async function(){
  try{
    await signInAnonymously(auth);
    const r = await getDocs(query(collection(db, 'rankingNumeros'), orderBy('mejor', 'desc'), limit(10)));
    return r.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch(err){ console.error('No se pudo leer el ranking:', err); return null; }
};

window.iniciarNuevoIntentoOnline = async function(codigo, docId, nombre, uid){
  if(!codigo || !docId) return;
  try{
    await setDoc(doc(db, 'sessions', codigo, 'students', docId), {
      name: nombre, uid: uid || null, startedAt: serverTimestamp(), completados: 0, errores: 0, mascota: (window.mascotaParaClase ? await window.mascotaParaClase() : null)
    });
  } catch(err){
    console.error('No se pudo iniciar el intento online:', err);
  }
};

window.reportarProgresoOnline = async function(codigo, docId, deltaCompletados, deltaErrores){
  if(!codigo || !docId) return;
  try{
    await setDoc(doc(db, 'sessions', codigo, 'students', docId), {
      completados: increment(deltaCompletados || 0),
      errores: increment(deltaErrores || 0),
      updatedAt: serverTimestamp()
    }, { merge: true });
  } catch(err){
    console.error('No se pudo reportar el progreso online:', err);
  }
};
// Si se llega desde el inicio con un código de clase en el enlace
// (?codigoClase=XXXX), se une solo, sin mostrar el botón ni el modal --
// ya sea con la cuenta que ya tenía la sesión, o como invitado si vino
// con ?invitado=Nombre (ese nombre ya pasó por el filtro en el inicio).
try{
  const parametrosUrl = new URLSearchParams(location.search);
  const codigoDesdeUrl = parametrosUrl.get('codigoClase');
  const invitadoDesdeUrl = parametrosUrl.get('invitado');
  let nombreParaUnirse = null;
  if(AlumnoActual) nombreParaUnirse = AlumnoActual.nombre;
  else if(invitadoDesdeUrl && invitadoDesdeUrl.trim()) nombreParaUnirse = `👤 Invitado: ${invitadoDesdeUrl.trim()}`;

  if(codigoDesdeUrl && nombreParaUnirse){
    (async () => {
      const resultado = await window.unirseClaseOnline(codigoDesdeUrl.toUpperCase(), nombreParaUnirse);
      if(!resultado.ok){ alert(resultado.error); return; }
      Online.activo = true; Online.codigo = codigoDesdeUrl.toUpperCase(); Online.uid = resultado.uid; Online.nombre = nombreParaUnirse;
      registrarInicioOnline();
      // Ojo: en algunos recursos este indicador recién se dibuja cuando se
      // muestra la pantalla de niveles -- si un invitado llega sin sesión
      // previa, puede que todavía no exista en el DOM.
      const _indEl = document.getElementById('indicadorOnline');
      if(_indEl){ _indEl.classList.remove('hidden'); document.getElementById('nombreOnline').textContent = nombreParaUnirse; }
      if(resultado.modoObjetivo === 'contrarreloj'){ startContrarreloj(resultado.nivelObjetivo); }
      else { startPractice(resultado.nivelObjetivo); }
    })();
  }
} catch(e){ console.error(e); }
</script>
