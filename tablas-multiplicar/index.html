<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Tablas de Multiplicar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS DE DISEÑO
   ========================================================= */
:root{
  color-scheme: dark;
  --bg-1:#1e1147;
  --bg-2:#3b1785;
  --bg-3:#5b21b6;
  --surface:rgba(255,255,255,.07);
  --surface-strong:rgba(255,255,255,.12);
  --border-soft:rgba(255,255,255,.14);

  --primary:#34d399;
  --primary-dark:#0f9d70;
  --accent:#fbbf24;
  --accent-soft:#fde68a;
  --pink:#f472b6;
  --blue:#38bdf8;
  --error:#fb7185;
  --error-soft:#3b0f1f;

  --text:#f6f3ff;
  --text-dim:#c9bdf0;
  --text-faint:#8f7fc4;

  --r-lg:22px;
  --r-md:16px;
  --r-sm:10px;

  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;

  --shadow-1: 0 10px 30px rgba(0,0,0,.35);
  --tap-min: 48px;
}

*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; width:100%; overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
h1,h2,h3{font-family:var(--font-display); margin:0;}
button, input{ -webkit-user-select:none; user-select:none; }
input{font-family:inherit;}

.hidden{display:none !important;}
.visually-hidden{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* Foco visible para accesibilidad con teclado */
:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
  border-radius:6px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* =========================================================
   LAYOUT GENERAL
   ========================================================= */
#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding: clamp(10px, 2.5vw, 24px);
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:6px 56px 14px 2px;
  flex-wrap:wrap;
}
.app-header .side{
  display:flex; align-items:center; gap:6px;
  flex:1 1 auto;
  min-width:70px;
}
.app-header .side.right{ justify-content:flex-end; }

.icon-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--surface);
  border:1px solid var(--border-soft);
  color:var(--text);
  padding:9px 12px;
  border-radius:999px;
  font-weight:700;
  font-size:clamp(.75rem, 2vw, .9rem);
  cursor:pointer;
  min-height:var(--tap-min);
  transition: background .15s, transform .1s;
  white-space:nowrap;
}
.icon-btn:hover{ background:var(--surface-strong); }
.icon-btn:active{ transform:scale(.96); }

.brand{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.2vw, 1.6rem);
  flex:0 1 auto;
  white-space:nowrap;
}
.brand .plus{
  display:inline-flex; align-items:center; justify-content:center;
  width:1.5em; height:1.5em;
  background:linear-gradient(135deg, var(--primary), var(--blue));
  border-radius:10px;
  color:#0b1a12;
  font-size:1em;
}

main{ flex:1; display:flex; flex-direction:column; }

.screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  animation: fadeSlideIn .35s ease both;
}
@keyframes fadeSlideIn{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}

.card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(16px, 4vw, 32px);
  box-shadow:var(--shadow-1);
  backdrop-filter: blur(6px);
}

/* =========================================================
   PANTALLA INICIAL
   ========================================================= */
.home-title{
  text-align:center;
  font-size:clamp(1.4rem, 5vw, 2.2rem);
  font-weight:800;
  margin-bottom:6px;
}
.home-sub{
  text-align:center;
  color:var(--text-dim);
  font-size:clamp(.9rem, 2.4vw, 1.05rem);
  margin:0 auto clamp(18px,4vw,28px);
  max-width:46ch;
}
footer.credits{ text-align:center; color: var(--text-faint); font-weight:700; font-size:.78rem; padding:20px 10px 4px; }
.level-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:clamp(10px, 2.5vw, 16px);
  width:100%;
}
@media (max-width:420px){
  .level-grid{ grid-template-columns:1fr; }
}
.level-btn{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:clamp(16px,4vw,22px) 10px;
  border-radius:var(--r-md);
  border:1px solid var(--border-soft);
  color:var(--text);
  cursor:pointer;
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1rem, 2.6vw, 1.15rem);
  min-height:96px;
  transition:transform .15s, box-shadow .15s;
}
.level-btn:hover{ transform:translateY(-3px); }
.level-btn:active{ transform:scale(.97); }
.level-btn .emoji{ font-size:clamp(1.6rem, 5vw, 2.1rem); }
.level-btn.easy{ background:linear-gradient(140deg,#0f9d70,#34d399); }
.level-btn.mid{ background:linear-gradient(140deg,#1d4ed8,#38bdf8); }
.level-btn.hard{ background:linear-gradient(140deg,#b91c66,#f472b6); }
.level-btn.custom{ background:linear-gradient(140deg,#92400e,#fbbf24); color:#fff; }

/* =========================================================
   PANTALLA DE RESULTADO / CELEBRACIÓN
   ========================================================= */
.result-hero{
  font-size:clamp(2.2rem, 9vw, 3.4rem);
  text-align:center;
}
.result-title{
  font-size:clamp(1.3rem, 4vw, 1.8rem);
  text-align:center;
  margin:8px 0 4px;
}
.result-eq{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.6vw, 1.6rem);
  text-align:center;
  color:var(--primary);
  margin-bottom:20px;
  word-break:break-word;
}
.result-actions{
  display:flex; gap:12px; width:100%; flex-wrap:wrap;
}
.result-actions button{ flex:1 1 160px; }
/* ===================== TABLAS DE MULTIPLICAR — propio ===================== */
#vista{ width:100%; display:flex; flex-direction:column; }
.screen{ width:100%; }
.screen.hidden{ display:none !important; }
.home-sub{ margin:-4px auto 6px; font-size:clamp(.78rem,2.6vw,.95rem); }
.rec-fila{ display:flex; justify-content:center; gap:clamp(6px,2vw,12px); margin:12px auto 0; flex-wrap:nowrap; }
.rec-fila.hidden{ display:none; }
.rec{ display:inline-flex; align-items:center; gap:.45em; padding:.38em .8em; border-radius:999px; background:rgba(8,3,26,.55);
  box-shadow:inset 0 0 0 1px rgba(196,181,253,.35); font-family:var(--font-display); font-weight:800; font-size:clamp(.74rem,2.6vw,.92rem); color:#efeaff; white-space:nowrap; }
.rec i{ width:.7em; height:.7em; border-radius:50%; background:var(--c); box-shadow:0 0 8px var(--c); flex:none; }
.rec b{ color:#fde68a; font-weight:800; }
.rec.n1{ --c:#34d399; } .rec.n2{ --c:#38bdf8; } .rec.n3{ --c:#f472b6; }

/* ---------- Juego ---------- */
#screen-juego .card{ padding:clamp(10px,2.6vw,20px); display:flex; flex-direction:column; align-items:center; gap:calc(10px * var(--f,1)); }
.tablero-wrap{ width:min(100%, calc(640px * var(--f,1))); position:relative; container-type:inline-size; }
#tableroSvg{ width:100%; height:auto; display:block; overflow:visible; }
#tableroSvg .sendero{ fill:none; stroke:rgba(196,181,253,.38); stroke-width:6; stroke-linecap:round; stroke-dasharray:1 15; }
#tableroSvg .avance{ fill:none; stroke:#fbbf24; stroke-width:7; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 0 7px rgba(251,191,36,.9)); transition:d .4s; }
#tableroSvg .cas circle.disco{ fill:url(#gDisco); stroke:rgba(196,181,253,.55); stroke-width:3; transition:fill .3s, stroke .3s; }
#tableroSvg .cas text{ font-family:var(--font-display); font-weight:800; font-size:36px; fill:#e9e2ff; text-anchor:middle; dominant-baseline:central; paint-order:stroke; stroke:rgba(20,5,50,.6); stroke-width:3px; }
#tableroSvg .cas.pisada circle.disco{ fill:url(#gDiscoOk); stroke:#6ee7b7; }
#tableroSvg .cas.pisada text{ fill:#052e1c; stroke:rgba(255,255,255,.35); }
#tableroSvg .cas.actual circle.disco{ stroke:#fde68a; stroke-width:5; }
#tableroSvg .halo{ fill:none; stroke:#fbbf24; stroke-width:3; opacity:0; transform-box:fill-box; transform-origin:center; }
#tableroSvg .cas.actual .halo{ animation:tb-halo 1.6s ease-in-out infinite; }
@keyframes tb-halo{ 0%,100%{ transform:scale(1); opacity:.9; } 50%{ transform:scale(1.28); opacity:.1; } }
#tableroSvg .salida circle{ fill:rgba(8,3,26,.5); stroke:rgba(196,181,253,.6); stroke-width:3; stroke-dasharray:7 7; }
#tableroSvg .salida text{ font-family:var(--font-display); font-weight:800; font-size:17px; fill:#c4b5fd; text-anchor:middle; dominant-baseline:central; letter-spacing:.06em; }
#tableroSvg .meta circle{ fill:none; stroke:#fbbf24; stroke-width:3; opacity:.6; transform-box:fill-box; transform-origin:center; animation:tb-halo 2.2s ease-in-out infinite; }
#tableroSvg .meta.lograda circle{ stroke:#fff; }
#tableroSvg .centro-n{ font-family:var(--font-display); font-weight:800; text-anchor:middle; fill:url(#gTxt); stroke:rgba(20,5,50,.55); stroke-width:3px; paint-order:stroke; }
#tableroSvg .centro-n .big{ font-size:70px; }
#tableroSvg .centro-n .peq{ font-size:34px; fill:#fde68a; }
#tableroSvg .centro-t{ font-family:var(--font-display); font-weight:800; font-size:26px; fill:#6ee7b7; text-anchor:middle; stroke:rgba(5,40,28,.6); stroke-width:3px; paint-order:stroke; }
#tableroSvg .centro-et{ font-family:var(--font-display); font-weight:800; font-size:18px; fill:#c4b5fd; text-anchor:middle; letter-spacing:.14em; }
#ficha{ transition:transform .55s cubic-bezier(.3,1.35,.5,1); }
#ficha .bob{ animation:tb-bob 1.8s ease-in-out infinite; }
@keyframes tb-bob{ 0%,100%{ transform:translateY(-3px); } 50%{ transform:translateY(-11px); } }
#ficha.sacude .bob{ animation:tb-sacude .45s ease; }
@keyframes tb-sacude{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-9px); } 40%{ transform:translateX(9px); } 60%{ transform:translateX(-6px); } 80%{ transform:translateX(5px); } }
#ficha .sombra{ fill:rgba(0,0,0,.45); }
#ficha .aura{ fill:rgba(251,191,36,.28); stroke:rgba(253,230,138,.75); stroke-width:3; }
#ficha image{ filter:drop-shadow(0 4px 5px rgba(0,0,0,.55)); }

.pregunta-zona-old{ width:100%; display:flex; flex-direction:column; align-items:center; gap:calc(6px * var(--f,1)); }
.fb{ min-height:1.6em; font-family:var(--font-display); font-weight:800; font-size:calc(clamp(.9rem,3vw,1.1rem) * var(--f,1)); text-align:center; padding:.15em .9em; border-radius:999px; opacity:0; transition:opacity .2s; }
.fb.ok{ opacity:1; color:#6ee7b7; background:rgba(52,211,153,.14); text-shadow:0 0 10px rgba(52,211,153,.6); }
.fb.mal{ opacity:1; color:#fda4af; background:rgba(251,113,133,.14); text-shadow:0 0 10px rgba(251,113,133,.5); }
.pregunta{ font-family:var(--font-display); font-weight:800; line-height:1; font-size:calc(clamp(2.6rem,12vw,4.4rem) * var(--f,1)); letter-spacing:.02em;
  background:linear-gradient(180deg,#fff,#d8ccff 60%,#a78bfa); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 3px 12px rgba(124,58,237,.7)); white-space:nowrap; }
.pregunta .eq{ background:linear-gradient(180deg,#fff3b0,#fbbf24); -webkit-background-clip:text; background-clip:text; color:transparent; }
.pregunta .x{ font-size:.8em; padding:0 .16em; }
.tiempo-pista{ width:min(100%, calc(420px * var(--f,1))); height:calc(11px * var(--f,1)); border-radius:99px; background:rgba(8,3,26,.6); box-shadow:inset 0 0 0 1px rgba(196,181,253,.35); overflow:hidden; }
.tiempo-pista i{ display:block; height:100%; width:100%; border-radius:99px; background:linear-gradient(90deg,#34d399,#fbbf24); box-shadow:0 0 12px rgba(251,191,36,.7); }
.tiempo-pista i.urgente{ background:linear-gradient(90deg,#fb7185,#f43f5e); box-shadow:0 0 14px rgba(251,113,133,.9); animation:tb-urg .5s ease-in-out infinite alternate; }
@keyframes tb-urg{ to{ opacity:.55; } }

.opciones{ width:min(100%, calc(560px * var(--f,1))); display:grid; grid-template-columns:repeat(2,1fr); gap:calc(12px * var(--f,1)); }
@media (min-width:700px){ .opciones{ grid-template-columns:repeat(4,1fr); width:min(100%, calc(720px * var(--f,1))); } }
.opc{ position:relative; isolation:isolate; overflow:hidden; border:none; cursor:pointer; color:#fff; border-radius:calc(24px * var(--f,1));
  min-height:calc(clamp(58px,9.5vh,84px) * var(--f,1)); font-family:var(--font-display); font-weight:800; font-size:calc(clamp(1.7rem,7vw,2.4rem) * var(--f,1)); text-shadow:0 2px 8px rgba(0,0,0,.55);
  background:radial-gradient(130% 190% at 26% 6%, #d8ccff -12%, #7c3aed 38%, #2e0b6e 100%);
  box-shadow:inset -.1em -.16em .45em rgba(0,0,0,.45), inset .07em .09em .26em rgba(255,255,255,.42), 0 0 18px rgba(139,92,246,.5), 0 6px 14px rgba(0,0,0,.4);
  transition:transform .15s, box-shadow .2s, opacity .2s, background .2s; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
.opc::before{ content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(105deg, transparent 40%, rgba(255,255,255,.28) 50%, transparent 60%); transform:translateX(-80%); transition:transform .7s; }
@media (hover:hover){ .opc:not(:disabled):hover{ transform:translateY(-3px) scale(1.04); } .opc:not(:disabled):hover::before{ transform:translateX(80%); } }
.opc:not(:disabled):active{ transform:scale(.95); }
.opc:disabled{ cursor:default; }
.opc.apagada{ opacity:.4; }
.opc.correcta{ opacity:1; background:radial-gradient(130% 190% at 26% 6%, #d1fae5 -12%, #10b981 38%, #022c22 100%); box-shadow:inset -.1em -.16em .45em rgba(0,0,0,.4), inset .07em .09em .26em rgba(255,255,255,.5), 0 0 28px rgba(52,211,153,.95), 0 6px 14px rgba(0,0,0,.4); animation:tb-pop .4s ease; }
.opc.incorrecta{ opacity:1; background:radial-gradient(130% 190% at 26% 6%, #ffe4e6 -12%, #f43f5e 38%, #4c0519 100%); box-shadow:inset -.1em -.16em .45em rgba(0,0,0,.4), inset .07em .09em .26em rgba(255,255,255,.4), 0 0 26px rgba(251,113,133,.9), 0 6px 14px rgba(0,0,0,.4); animation:tb-sacude .45s ease; }
@keyframes tb-pop{ 0%{ transform:scale(.9); } 60%{ transform:scale(1.1); } 100%{ transform:scale(1); } }
.opc .tecla{ position:absolute; left:.55em; top:.4em; font-size:.38em; opacity:.55; font-weight:800; display:none; }
@media (hover:hover) and (min-width:700px){ .opc .tecla{ display:block; } }

/* ---------- Victoria ---------- */
.mv-universo #screen-victoria .card{ text-align:center; overflow:hidden; }
.vic-tiempo{ display:inline-block; font-family:var(--font-display); font-weight:800; font-size:clamp(2.4rem,11vw,3.8rem); line-height:1; padding:.12em .5em; border-radius:999px; background:rgba(8,3,26,.5);
  box-shadow:inset 0 0 0 1px rgba(196,181,253,.4), 0 0 22px rgba(251,191,36,.45); color:#fde68a; text-shadow:0 0 14px rgba(251,191,36,.7); margin:4px 0 6px; }
.vic-record{ min-height:1.4em; font-family:var(--font-display); font-weight:800; color:#c4b5fd; margin:4px 0 18px; font-size:clamp(.95rem,3vw,1.15rem); }
.vic-record.nuevo{ color:#6ee7b7; text-shadow:0 0 12px rgba(52,211,153,.6); }
.result-actions{ justify-content:center; }
#app{ padding-top:clamp(8px,2vw,18px); }
.mv-universo #screen-juego .card::before{ display:none; }

.mv-universo .mv-home .home-title{ padding:0 clamp(40px,12vw,64px); font-size:clamp(1.15rem,5.4vw,2.5rem) !important; line-height:1.1; }
@media (max-width:699px){ .app-header .brand{ display:none; } }
.mv-universo #screen-victoria .result-hero svg{ width:calc(84px * var(--f,1)); height:calc(84px * var(--f,1)); }

.panel-pregunta{ position:absolute; left:15.7%; width:68.6%; top:34.7%; height:30.7%; display:flex; align-items:center; justify-content:center; overflow:hidden;
  border-radius:min(5cqw,30px); background:linear-gradient(180deg,#ffffff 0%,#efe9ff 100%);
  box-shadow:0 0 0 min(.7cqw,4px) #fbbf24, 0 0 min(5cqw,30px) rgba(251,191,36,.55), 0 8px 20px rgba(0,0,0,.45); }
.pregunta-txt{ font-family:var(--font-display); font-weight:800; line-height:1; color:#2b0f66; font-size:min(11.6cqw, calc(78px * var(--f,1))); white-space:nowrap; letter-spacing:.01em; padding-bottom:1.2cqw; }
.pregunta-txt .x{ color:#7c3aed; font-size:.82em; padding:0 .14em; }
.pregunta-txt .eq{ color:#d97706; }
.pista{ position:absolute; left:0; right:0; bottom:0; height:max(5px,1.5cqw); background:rgba(43,15,102,.14); }
.pista i{ display:block; height:100%; width:100%; background:linear-gradient(90deg,#10b981,#f59e0b); }
.pista i.urgente{ background:linear-gradient(90deg,#f43f5e,#e11d48); animation:tb-urg .5s ease-in-out infinite alternate; }
.fila-fb{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; min-height:calc(34px * var(--f,1)); }
.crono{ flex:none; font-family:var(--font-display); font-weight:800; font-size:calc(clamp(.85rem,3vw,1.05rem) * var(--f,1)); color:#6ee7b7; padding:.2em .8em; border-radius:999px; background:rgba(8,3,26,.55); box-shadow:inset 0 0 0 1px rgba(52,211,153,.6); }
.fila-fb .fb{ min-height:0; font-size:calc(clamp(.8rem,2.8vw,1rem) * var(--f,1)); white-space:nowrap; }
.rec-tit{ text-align:center; margin:12px 0 0; font-family:var(--font-display); font-weight:800; font-size:clamp(.8rem,2.6vw,.95rem); color:#c4b5fd; }
.rec-tit.hidden{ display:none; }
.rec-tit + .rec-fila{ margin-top:6px; }
</style>

<body class="mv-universo">

<script>

/* ---------------------------------------------------------------------
   1. UTILIDADES
   --------------------------------------------------------------------- */
function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}
function formatearTiempo(seg){
  const m = Math.floor(seg/60), s = seg%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

/* ---------------------------------------------------------------------
   2. GENERADOR PONDERADO DE MULTIPLICACIONES
   --------------------------------------------------------------------- */
const DISTRIBUCION_TABLAS = {
  facil:      { 0:20, 1:20, 2:20, 5:20, 10:20 },
  intermedio: { 0:8, 1:8, 2:8, 5:8, 10:8, 3:20, 4:20, 6:20 },
  dificil:    { 0:3, 1:3, 2:3, 5:3, 10:3, 3:8.33, 4:8.33, 6:8.33, 7:20, 8:20, 9:20 },
};

function elegirTablaPonderada(nivel){
  const dist = DISTRIBUCION_TABLAS[nivel];
  const entradas = Object.entries(dist);
  const total = entradas.reduce((s,[,p]) => s+p, 0);
  let r = Math.random() * total;
  for(const [tabla, peso] of entradas){
    if(r < peso) return parseInt(tabla,10);
    r -= peso;
  }
  return parseInt(entradas[entradas.length-1][0], 10);
}

function generarPregunta(nivel){
  const a = elegirTablaPonderada(nivel);
  const b = randInt(0, 10);
  return construirOpciones(a, b);
}

function construirOpciones(a, b){
  const correcto = a * b;
  const candidatos = new Set();

  if(correcto === 0){
    [a, b, a+b, 1, 2, 3].forEach(v => { if(v !== 0) candidatos.add(v); });
  } else {
    if(b > 0) candidatos.add(a * (b-1));
    candidatos.add(a * (b+1));
    if(a > 0) candidatos.add((a-1) * b);
    candidatos.add((a+1) * b);
    candidatos.add(correcto + a);
    candidatos.add(correcto - a);
    candidatos.add(correcto + 1);
    candidatos.add(correcto - 1);
  }
  candidatos.delete(correcto);
  const pool = [...candidatos].filter(v => v >= 0 && v !== correcto);
  for(let i = pool.length -1; i>0; i--){ const j = randInt(0,i); [pool[i],pool[j]]=[pool[j],pool[i]]; }

  const elegidos = new Set();
  for(const v of pool){ if(elegidos.size>=3) break; elegidos.add(v); }
  let intentos = 0;
  while(elegidos.size < 3 && intentos < 50){
    const candidato = Math.max(0, correcto + randInt(-9,9));
    if(candidato !== correcto) elegidos.add(candidato);
    intentos++;
  }

  const opciones = [correcto, ...elegidos];
  for(let i = opciones.length -1; i>0; i--){ const j = randInt(0,i); [opciones[i],opciones[j]]=[opciones[j],opciones[i]]; }
  return { a, b, correcto, opciones };
}

/* ---------------------------------------------------------------------
   3. NAVEGACIÓN Y CHIPS DE LA MASCOTA
   --------------------------------------------------------------------- */
const screens = {
  home: document.getElementById('screen-home'),
  juego: document.getElementById('screen-juego'),
  victoria: document.getElementById('screen-victoria'),
};
let pantallaActual = 'home';
function reaccion(t){ if(window.reaccionCompanero) window.reaccionCompanero(t); }
function montarChipsVista(n){
  n = n || 0;
  if(typeof window.montarChipCompanero === 'function'){
    const h = document.getElementById('mvChipHome'); if(h && !h.dataset.mv){ h.dataset.mv='1'; window.montarChipCompanero(h, { grande:true }); }
    const r = document.getElementById('mvChipResult'); if(r && !r.dataset.mv){ r.dataset.mv='1'; window.montarChipCompanero(r, { grande:true, celebra:true }); }
    const c = document.getElementById('mvChipHeader'); if(c && !c.dataset.mv){ c.dataset.mv='1'; window.montarChipCompanero(c, { grande:false }); }
    actualizarFicha();
  } else if(n < 100){ setTimeout(() => montarChipsVista(n + 1), 100); }
}
function showScreen(name){
  pantallaActual = name;
  Object.entries(screens).forEach(([k, s]) => s.classList.toggle('hidden', k !== name));
  document.body.dataset.pantalla = name === 'juego' ? 'exercise' : name === 'victoria' ? 'result' : 'home';
  document.getElementById('app-header').classList.toggle('hidden', name === 'home');
  montarChipsVista();
}

/* ---------------------------------------------------------------------
   4. ESTADO DEL JUEGO
   --------------------------------------------------------------------- */
const TOTAL_ESCALONES = 15;
const DURACION_PREGUNTA = 10; // segundos
const PESO_XP_NIVEL = { facil:1, intermedio:3, dificil:5 };

const Juego = {
  nivel: null,
  escalon: 0,
  inicioMs: 0,
  intervaloCronometro: null,
  timerPregunta: null,
  timerInicioMs: 0,
  respondida: false,
  gano: false,
  promesaRecord: null,
  correctoActual: null,
  esperaSiguiente: null,
};

const POSICIONES_CASILLA = {
  1:{col:3,row:3}, 2:{col:2,row:3}, 3:{col:1,row:3},
  4:{col:1,row:2},
  5:{col:1,row:1}, 6:{col:2,row:1}, 7:{col:3,row:1}, 8:{col:4,row:1}, 9:{col:5,row:1}, 10:{col:6,row:1}, 11:{col:7,row:1},
  12:{col:7,row:2},
  13:{col:7,row:3}, 14:{col:6,row:3}, 15:{col:5,row:3},
};
const POS_SALIDA = { col:4, row:3 };
function centroCasilla(n){
  const p = POSICIONES_CASILLA[n];
  return { x:(p.col - .5) * 100, y:(p.row - .5) * 100 };
}
const SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs){
  const e = document.createElementNS(SVGNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function trazoHasta(n){
  let d = '';
  for(let i = 1; i <= n; i++){ const c = centroCasilla(i); d += (i === 1 ? 'M' : 'L') + c.x + ' ' + c.y + ' '; }
  return d;
}

function construirTablero(){
  document.getElementById('senderoBase').setAttribute('d', trazoHasta(TOTAL_ESCALONES));
  const g = document.getElementById('casillas');
  for(let n = 1; n <= TOTAL_ESCALONES; n++){
    const { x, y } = centroCasilla(n);
    const c = svgEl('g', { class: n === TOTAL_ESCALONES ? 'cas meta' : 'cas', 'data-n':n });
    if(n === TOTAL_ESCALONES){
      c.appendChild(svgEl('circle', { class:'halo-meta', cx:x, cy:y, r:46 }));
      const u = svgEl('use', { href:'#st3d', x:x - 50, y:y - 50, width:100, height:100, filter:'url(#fIco)' });
      c.appendChild(u);
      const t = svgEl('text', { x:x, y:y + 4 }); t.textContent = '15';
      t.setAttribute('style', 'font-size:28px;fill:#78350f;stroke:rgba(255,246,194,.7);stroke-width:2px');
      c.appendChild(t);
    } else {
      c.appendChild(svgEl('circle', { class:'halo', cx:x, cy:y, r:44 }));
      c.appendChild(svgEl('circle', { class:'disco', cx:x, cy:y, r:40 }));
      const t = svgEl('text', { x:x, y:y + 2 }); t.textContent = n;
      c.appendChild(t);
    }
    g.appendChild(c);
  }
}
construirTablero();

/* La ficha es la mascota del alumno (si hay una); si no, una estrella */
let _fichaSrc = null;
function actualizarFicha(){
  const img = document.querySelector('#mvChipHeader .mv-av img') || document.querySelector('#mvChipHome .mv-av img');
  const src = img && (img.currentSrc || img.src) ? (img.currentSrc || img.src) : '';
  if(src === _fichaSrc) return;
  _fichaSrc = src;
  const host = document.getElementById('fichaImg');
  host.innerHTML = '';
  if(src){
    host.appendChild(svgEl('image', { href:src, x:-36, y:-42, width:72, height:72, preserveAspectRatio:'xMidYMid meet' }));
  } else {
    host.appendChild(svgEl('use', { href:'#st3d', x:-30, y:-36, width:60, height:60, filter:'url(#fIco)' }));
  }
}

function actualizarPersonaje(movimiento){
  document.querySelectorAll('#casillas .cas').forEach(c => {
    const n = parseInt(c.dataset.n, 10);
    c.classList.toggle('actual', n === Juego.escalon);
    c.classList.toggle('pisada', n < Juego.escalon);
    c.classList.toggle('lograda', Juego.gano && n === TOTAL_ESCALONES);
  });
  const { x, y } = centroCasilla(Juego.escalon);
  const ficha = document.getElementById('ficha');
  ficha.style.transform = `translate(${x}px,${y}px)`;
  if(movimiento === 'mal'){
    ficha.classList.remove('sacude'); void ficha.getBoundingClientRect(); ficha.classList.add('sacude');
  }
  document.getElementById('senderoAvance').setAttribute('d', Juego.escalon > 1 ? trazoHasta(Juego.escalon) : '');
  actualizarFicha();
}

function iniciarJuego(nivel){
  Juego.nivel = nivel;
  Juego.escalon = 1;   // se empieza sobre la casilla 1; se gana acertando estando en la 15
  Juego.gano = false;
  Juego.inicioMs = Date.now();
  clearTimeout(Juego.esperaSiguiente);
  clearInterval(Juego.timerPregunta);
  showScreen('juego');
  actualizarPersonaje();
  const fb = document.getElementById('feedbackJuego');
  fb.textContent = ''; fb.className = 'fb';
  document.getElementById('cronoTexto').textContent = '⏱ 0:00';
  clearInterval(Juego.intervaloCronometro);
  Juego.intervaloCronometro = setInterval(() => {
    const seg = Math.floor((Date.now() - Juego.inicioMs)/1000);
    document.getElementById('cronoTexto').textContent = '⏱ ' + formatearTiempo(seg);
  }, 250);
  siguientePregunta();
}

function siguientePregunta(){
  Juego.respondida = false;
  const { a, b, correcto, opciones } = generarPregunta(Juego.nivel);
  Juego.correctoActual = correcto;
  document.getElementById('preguntaTexto').innerHTML = `${a}<span class="x">×</span>${b} <span class="eq">= ?</span>`;
  const grid = document.getElementById('opcionesGrid');
  grid.innerHTML = '';
  opciones.forEach((op, i) => {
    const btn = el('button', 'opc', `<span class="tecla">${i+1}</span>${op}`);
    btn.type = 'button';
    btn.dataset.v = op;
    btn.onclick = () => responder(op, btn);
    grid.appendChild(btn);
  });
  const fb = document.getElementById('feedbackJuego');
  fb.textContent = ''; fb.className = 'fb';
  iniciarTimerPregunta();
}

function iniciarTimerPregunta(){
  if(Juego.timerPregunta) clearInterval(Juego.timerPregunta);
  Juego.timerInicioMs = Date.now();
  const barra = document.getElementById('timerBarra');
  barra.classList.remove('urgente');
  barra.style.width = '100%';
  Juego.timerPregunta = setInterval(() => {
    const transcurridoMs = Date.now() - Juego.timerInicioMs;
    const restante = Math.max(0, DURACION_PREGUNTA*1000 - transcurridoMs);
    const pct = (restante / (DURACION_PREGUNTA*1000)) * 100;
    barra.style.width = pct + '%';
    if(pct < 30) barra.classList.add('urgente');
    if(restante <= 0){
      clearInterval(Juego.timerPregunta);
      if(!Juego.respondida) responder(null, null); // se acabó el tiempo
    }
  }, 80);
}

function responder(valorElegido, btnElegido){
  if(Juego.respondida) return;
  Juego.respondida = true;
  clearInterval(Juego.timerPregunta);
  const correcto = valorElegido === Juego.correctoActual;

  document.querySelectorAll('#opcionesGrid .opc').forEach(b => {
    b.disabled = true;
    b.classList.add('apagada');
    if(parseInt(b.dataset.v,10) === Juego.correctoActual){ b.classList.remove('apagada'); b.classList.add('correcta'); }
  });
  if(btnElegido && !correcto){ btnElegido.classList.remove('apagada'); btnElegido.classList.add('incorrecta'); }

  const fb = document.getElementById('feedbackJuego');
  if(correcto){
    if(Juego.escalon >= TOTAL_ESCALONES){ Juego.gano = true; }
    else { Juego.escalon += 1; }
    fb.textContent = Juego.gano ? '¡Meta alcanzada!' : '¡Correcto! Avanzas';
    fb.className = 'fb ok';
    reaccion('bien');
    if(AlumnoActual) window.reportarProgresoPractica(AlumnoActual.id, 'tablas-multiplicar', 1, 0, PESO_XP_NIVEL[Juego.nivel] || 1);
  } else {
    const retrocede = Juego.escalon > 1;
    Juego.escalon = Math.max(1, Juego.escalon - 1);
    fb.textContent = (valorElegido === null ? '¡Se acabó el tiempo! ' : 'No era esa. ') + (retrocede ? 'Retrocedes' : 'Sigues en la 1');
    fb.className = 'fb mal';
    reaccion('mal');
  }
  actualizarPersonaje(correcto ? 'bien' : 'mal');

  Juego.esperaSiguiente = setTimeout(() => {
    if(Juego.gano){ finalizarJuego(); return; }
    siguientePregunta();
  }, 1100);
}

function finalizarJuego(){
  clearInterval(Juego.intervaloCronometro);
  const segundosTotales = Math.floor((Date.now() - Juego.inicioMs)/1000);
  showScreen('victoria');
  reaccion('bien');
  document.getElementById('victoriaTiempo').textContent = formatearTiempo(segundosTotales);
  const txt = document.getElementById('victoriaRecordTexto');
  txt.className = 'vic-record';
  txt.textContent = '';

  if(AlumnoActual){
    window.reportarProgresoPractica(AlumnoActual.id, 'tablas-multiplicar', 0, 0); // asegura que quede registro del recurso aunque el heartbeat no haya sumado nada aún
    Juego.promesaRecord = window.reportarRecordTablas(AlumnoActual.id, Juego.nivel, segundosTotales).then(resultado => {
      if(!resultado){
        txt.textContent = 'No se pudo guardar tu récord. Revisa tu conexión.';
      } else if(resultado.esNuevoRecord){
        txt.textContent = '🏅 ¡Nuevo récord personal en este nivel!';
        txt.className = 'vic-record nuevo';
      } else if(resultado.mejorAnterior != null){
        txt.textContent = `Tu mejor tiempo en este nivel: ${formatearTiempo(resultado.mejorAnterior)}`;
      }
    });
  } else {
    txt.textContent = 'Entra con tu cuenta para guardar tu récord.';
  }
}

/* ---------------------------------------------------------------------
   5. EVENTOS DE NAVEGACIÓN
   --------------------------------------------------------------------- */
function detenerJuego(){
  clearInterval(Juego.intervaloCronometro);
  clearInterval(Juego.timerPregunta);
  clearTimeout(Juego.esperaSiguiente);
}
function irAHome(){ detenerJuego(); showScreen('home'); Promise.resolve(Juego.promesaRecord).then(() => cargarRecords(), () => cargarRecords()); }

document.querySelectorAll('.level-btn.mv-nivel').forEach(btn => {
  btn.onclick = () => iniciarJuego(btn.dataset.nivel);
});
document.getElementById('btn-back').onclick = irAHome;
document.getElementById('btn-reset').onclick = () => { if(pantallaActual === 'juego') iniciarJuego(Juego.nivel); };
document.getElementById('btnJugarOtraVez').onclick = () => iniciarJuego(Juego.nivel);
document.getElementById('btnVictoriaInicio').onclick = irAHome;

/* Teclado: 1-4 eligen la opción */
document.addEventListener('keydown', e => {
  if(pantallaActual !== 'juego' || Juego.respondida || e.ctrlKey || e.metaKey || e.altKey) return;
  const i = parseInt(e.key, 10);
  if(i >= 1 && i <= 4){
    const b = document.querySelectorAll('#opcionesGrid .opc')[i - 1];
    if(b) b.click();
  }
});

async function cargarRecords(){
  const fila = document.getElementById('recFila');
  fila.classList.toggle('hidden', !AlumnoActual);
  document.getElementById('recTit').classList.toggle('hidden', !AlumnoActual);
  if(!AlumnoActual || !window.obtenerRecordsTablas) return;
  const records = await window.obtenerRecordsTablas(AlumnoActual.id);
  if(!records) return;
  const mapa = { facil:'recFacil', intermedio:'recIntermedio', dificil:'recDificil' };
  Object.keys(mapa).forEach(nivel => {
    document.getElementById(mapa[nivel]).textContent = records[nivel] ? formatearTiempo(records[nivel]) : '—';
  });
}
// La adjuntamos explícitamente a window -- el módulo de más abajo la llama.
window.cargarRecords = cargarRecords;

/* ---------------------------------------------------------------------
   6. SESIÓN (acceso central del sitio; sin sesión se entra como invitado)
   --------------------------------------------------------------------- */
let AlumnoActual = null;

function iniciarHeartbeatTiempo(){
  if(typeof window.iniciarHeartbeatMathverse === 'function'){
    window.iniciarHeartbeatMathverse(() => AlumnoActual?.id, 'tablas-multiplicar');
  } else {
    setTimeout(iniciarHeartbeatTiempo, 100);
  }
}

window._sesionYaResuelta = false;
try{
  const guardado = JSON.parse(sessionStorage.getItem('profehoracio_alumno_actual') || 'null');
  if(guardado && guardado.id && guardado.nombre){
    AlumnoActual = guardado;
    window._sesionYaResuelta = true;
    iniciarHeartbeatTiempo();
  }
} catch(e){}
cargarRecords();
showScreen('home');

/* Ajuste a la altura: si la pantalla no cabe, se achican un poco los tamaños (--f) para evitar el scroll */
(function(){
  const raiz = document.documentElement; let pend = false;
  function ajustar(){
    pend = false;
    let f = 1; raiz.style.setProperty('--f', '1');
    const sobra = () => raiz.scrollHeight - window.innerHeight;
    let guardia = 0;
    while(sobra() > 1 && f > 0.5 && guardia++ < 16){ f = Math.max(0.5, f - 0.04); raiz.style.setProperty('--f', f.toFixed(2)); }
  }
  function pedir(){ if(!pend){ pend = true; requestAnimationFrame(ajustar); } }
  window.addEventListener('resize', pedir);
  window.addEventListener('load', () => { pedir(); setTimeout(pedir, 800); });
  new MutationObserver(pedir).observe(document.getElementById('main'), { subtree:true, childList:true, attributes:true, attributeFilter:['class'] });
  pedir();
})();

<script type="module" src="../mathverse-core.js"></script>
<script type="module">
/* Récords de Tablas de Multiplicar -- propio de este recurso, no es
   genérico entre los 18. Usa una segunda instancia de Firebase para
   no depender del orden de carga con mathverse-core.js. */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDrwcG84h88gOf9FkUlZbECZ2qrO14KhO4",
  authDomain: "profehoracio-online.firebaseapp.com",
  projectId: "profehoracio-online",
  storageBucket: "profehoracio-online.firebasestorage.app",
  messagingSenderId: "TU_SENDER_ID",
  appId: "1:337766647406:web:6f13e95cb71b5f89cfc87f"
};
const app = initializeApp(firebaseConfig, "recordsTablas");
const db = getFirestore(app);
const auth = getAuth(app);
// Esta instancia de Firebase es propia: hay que identificarla también (como hace el núcleo), si no las reglas pueden rechazar el guardado.
async function asegurarAuth(){ try{ if(!auth.currentUser) await signInAnonymously(auth); }catch(e){ console.warn('auth récords', e); } }

window.reportarRecordTablas = async function(id, nivel, segundos){
  if(!id) return null;
  try{
    await asegurarAuth();
    const ref = doc(db, 'alumnosRobot', id);
    const snap = await getDoc(ref);
    const actual = snap.exists() ? (snap.data().tablasRecord || {}) : {};
    const mejorAnterior = actual[nivel];
    const esNuevoRecord = mejorAnterior === undefined || segundos < mejorAnterior;
    if(esNuevoRecord){
      await setDoc(ref, { tablasRecord: { [nivel]: segundos } }, { merge: true });
    }
    return { esNuevoRecord, mejorAnterior: esNuevoRecord ? null : mejorAnterior };
  } catch(err){
    console.error('No se pudo guardar el récord:', err);
    return null;
  }
};

window.obtenerRecordsTablas = async function(id){
  if(!id) return null;
  try{
    await asegurarAuth();
    const snap = await getDoc(doc(db, 'alumnosRobot', id));
    if(!snap.exists()) return null;
    return snap.data().tablasRecord || {};
  } catch(err){
    console.error(err);
    return null;
  }
};

// Si el alumno ya estaba reconocido (sesión compartida) antes de que este
// módulo terminara de cargar, sus récords no se habrían mostrado -- se
// cargan ahora, con todo ya disponible.
if(window._sesionYaResuelta) window.cargarRecords();
</script>
