<html lang="es">
<head>

<style>
:root{ color-scheme:dark; --bg-1:#1e1147; --bg-2:#3b1785; --bg-3:#5b21b6; --text:#f6f3ff; --text-dim:#c9bdf0; --accent:#fbbf24; --primary:#34d399; --error:#fb7185;
  --font-display:'Baloo 2',system-ui,sans-serif; --font-body:'Nunito',system-ui,sans-serif; }
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden;color:var(--text);font-family:var(--font-body);min-height:100vh;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 15% 0%,var(--bg-3),transparent 55%),radial-gradient(circle at 85% 100%,#2a0f66,transparent 55%),linear-gradient(160deg,var(--bg-1),var(--bg-2));background-attachment:fixed}
button{font-family:inherit}
.hidden{display:none !important}
.screen{display:none;flex-direction:column;align-items:center;position:relative;z-index:1}
.screen.active{display:flex}
#app{width:100%;max-width:900px;margin:0 auto;padding:clamp(10px,2.5vw,24px);display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column}
.card{width:100%;position:relative;max-width:980px;margin:0 auto;padding:6px 10px}
.home-title{text-align:center;font-family:var(--font-display);font-weight:800;margin:0 0 6px;line-height:1.1}
.items-sub{text-align:center;color:#c9bdf0;font-size:.92rem;margin:2px 0 6px;text-wrap:balance}
.mv-pregunta{text-align:center;text-wrap:balance;font-family:var(--font-display);font-size:1.25rem;margin:6px 0 2px}
.icon-btn{display:inline-flex;align-items:center;cursor:pointer}
.mv-fila-chip{margin-top:30px}
.mv-atras-home{position:absolute;left:6px;top:6px;z-index:5}
.mv-casa-home{position:absolute;right:6px;top:6px;z-index:5}
.mv-niveles.mv-p3.mv-lv{aspect-ratio:100/90}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n1{--x:7;--y:53;--w:34}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n2{--x:50;--y:48;--w:41}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n3{--x:27;--y:1;--w:47}
@media (min-width:700px){.mv-niveles.mv-p3.mv-lv{aspect-ratio:100/40}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n1{--x:10;--y:13;--w:22}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n2{--x:37;--y:8;--w:26}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n3{--x:66;--y:2;--w:31}}
.mv-nivel .ico{width:46%;height:auto;position:relative;z-index:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.mv-universo .mv-home .home-title{padding:0 48px}
@media (min-width:900px) and (orientation:landscape){.mv-universo .mv-home .home-title{padding:0}}
/* ---- pantalla de juego ---- */
#screen-juego{align-items:stretch;width:100%}
body.en-juego{overflow:hidden;height:100dvh;min-height:0}
body.en-juego #screen-juego{height:100dvh}
.app-header.app-topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:none;width:100%;max-width:900px;margin:0 auto;padding:2px 10px 0;flex-wrap:nowrap}
.app-topbar .side{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.app-topbar .icon-btn.btn-orbita{font-size:.92rem}
.mv-universo .app-header.app-topbar .mv-av{width:clamp(56px,14vw,84px);height:clamp(56px,14vw,84px)}
#mvCelebra{position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:99990;pointer-events:none;opacity:0;width:min(86vw,300px)}
#mvCelebra.on{animation:mvCelPop 1.6s ease both}
@keyframes mvCelPop{0%{opacity:0;transform:translateX(-50%) scale(.55)}14%{opacity:1;transform:translateX(-50%) scale(1.1)}24%{transform:translateX(-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}
#mvCelebra .mv-info{display:none}
.cuerpo{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:760px;margin:0 auto;padding:2px 12px 12px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex:none}
.chip{padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(196,181,253,.4);font-family:var(--font-display);font-weight:800;font-size:1rem}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#stage > svg{width:100%;height:100%;max-height:100%;overflow:visible}
.msg{flex:none;min-height:2.7em;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:clamp(1rem,.85rem + .7vw,1.3rem);line-height:1.25;text-wrap:balance;max-width:640px}
.msg.mal{color:#fda4af}.msg.bien{color:#6ee7b7}.msg.pista{color:#fde68a}
.fila{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;flex:none}
.btn-orbita.ancho{font-size:1.15rem;padding-right:2em}
.btn-orbita[disabled]{opacity:.45;pointer-events:none;filter:grayscale(.5)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .32s}


.regla{flex:none;text-align:center;color:#d9d0f7;font-weight:700;font-size:clamp(.88rem,.8rem + .4vw,1.05rem);text-wrap:balance;max-width:640px}
#mesa{width:100%;display:flex;justify-content:center;align-items:flex-end;gap:clamp(24px,8vw,90px)}
.fila-palitos{display:flex;justify-content:center;align-items:flex-end;gap:clamp(3px,.9vw,10px);width:100%}
.palito{flex:1 1 0;max-width:34px;min-width:9px;height:clamp(96px,22dvh,170px);border:none;padding:0;cursor:pointer;background:transparent;position:relative;transition:transform .25s,opacity .25s}
.palito::before{content:"";position:absolute;left:18%;right:18%;top:12px;bottom:0;border-radius:99px;background:linear-gradient(90deg,#fef3c7,#fcd34d 40%,#d97706);box-shadow:0 3px 6px rgba(0,0,0,.4)}
.palito::after{content:"";position:absolute;left:8%;right:8%;top:0;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fecaca,#ef4444 60%,#7f1d1d);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.palito.sel{transform:translateY(-12px)}
.palito.sel::before{background:linear-gradient(90deg,#d1fae5,#34d399 40%,#047857);box-shadow:0 0 12px #34d399}
.palito.bot::before{background:linear-gradient(90deg,#fecdd3,#fb7185 40%,#be123c);box-shadow:0 0 12px #fb7185}
.pila{display:flex;flex-direction:column-reverse;align-items:center;gap:clamp(3px,.8dvh,8px);min-width:64px}
.pila .nom{order:99;margin-top:6px;font-family:var(--font-display);font-weight:800;color:#fff;font-size:1.1rem}
.piedra{width:clamp(30px,7dvh,50px);aspect-ratio:1;border-radius:50%;border:none;padding:0;cursor:pointer;background:radial-gradient(circle at 34% 28%,#fff,#c4b5fd 45%,#6d28d9);box-shadow:inset -4px -5px 8px rgba(0,0,0,.4),0 3px 6px rgba(0,0,0,.4);transition:transform .25s}
.piedra.sel{background:radial-gradient(circle at 34% 28%,#fff,#6ee7b7 45%,#047857);box-shadow:0 0 14px #34d399,inset -4px -5px 8px rgba(0,0,0,.35);transform:translateY(-6px)}
.piedra.bot{background:radial-gradient(circle at 34% 28%,#fff,#fda4af 45%,#be123c);box-shadow:0 0 14px #fb7185}
.chip.bot{box-shadow:inset 0 0 0 1px #fb7185;color:#fecdd3}

<script>
window.mvExito = function(){
  try{ if(window.reaccionCompanero) window.reaccionCompanero('bien'); }catch(e){}
  var h=document.getElementById('mvCelebra'); if(!h) return;
  var img=h.querySelector('.mv-av img'); if(!img || !img.getAttribute('src')) return;
  h.classList.remove('on'); void h.offsetWidth; h.classList.add('on');
  clearTimeout(h._t); h._t=setTimeout(function(){ h.classList.remove('on'); },1700);
};
window.mvFallo = function(){ try{ if(window.reaccionCompanero) window.reaccionCompanero('mal'); }catch(e){} };
const RECURSO = 'nim';
let AlumnoActual = null;
try{ var _g=JSON.parse(sessionStorage.getItem('profehoracio_alumno_actual')||'null'); if(_g && _g.id && _g.nombre) AlumnoActual=_g; }catch(e){}
function reportar(peso){ if(AlumnoActual && typeof window.reportarProgresoPractica==='function'){ try{ window.reportarProgresoPractica(AlumnoActual.id, RECURSO, 1, 0, peso); }catch(e){} } }
function iniciarHeartbeatTiempo(){
  if(typeof window.iniciarHeartbeatMathverse==='function') window.iniciarHeartbeatMathverse(function(){ return AlumnoActual && AlumnoActual.id; }, RECURSO);
  else setTimeout(iniciarHeartbeatTiempo,100);
}
if(AlumnoActual) iniciarHeartbeatTiempo();
const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function pantalla(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active'); document.body.classList.toggle('en-juego', id==='screen-juego'); window.scrollTo(0,0);
}

const PESO={1:3,2:5,3:8};
const N={nivel:1,k:3,piles:[],ini:[],turno:'j',sel:null,fin:false,bloqueado:false,repetir:false};
function sinRepetir(a,b,f){ let x; do{ x=rnd(a,b); }while(!f(x)); return x; }
function nuevaPosicion(nivel){
  if(nivel===1){ N.k=3; N.ini=[sinRepetir(9,13,x=>x%4!==0)]; }
  else if(nivel===2){ N.k=rnd(3,4); const m=N.k+1; N.ini=[sinRepetir(16,24,x=>x%m!==0)]; }
  else { const a=rnd(3,9); N.ini=[a, sinRepetir(3,9,x=>x!==a)]; }
}
function empezar(nivel){ N.nivel=nivel; nuevaPosicion(nivel); pantalla('screen-juego'); partida(); }
function partida(){
  N.piles=N.ini.slice(); N.turno='j'; N.sel=null; N.fin=false; N.bloqueado=false; N.repetir=false;
  $('filaFin').classList.add('hidden'); $('filaAcc').classList.remove('hidden');
  $('regla').textContent = N.nivel===3
    ? 'Por turno se quitan las piedras que quieras, pero de una sola pila. ¡Gana quien se lleva la última!'
    : `Por turno se quitan de 1 a ${N.k} palitos. ¡Gana quien se lleva el último!`;
  msg(msgInicial()); dibujar();
}
function msgInicial(){ return N.nivel===3 ? 'Toca una piedra: se marcan esa y las de arriba. Luego pulsa Quitar.' : 'Toca un palito: se marcan ese y los de su derecha. Luego pulsa Quitar.'; }
function msg(t,tipo){ const m=$('msg'); m.textContent=t; m.className='msg'+(tipo?' '+tipo:''); }
function dibujar(){
  const mesa=$('mesa'); let h='';
  if(N.nivel<3){
    const n=N.piles[0];
    h=`<div class="fila-palitos">`+Array.from({length:n},(_,i)=>`<button type="button" class="palito${N.sel!==null&&i>=n-N.sel?' sel':''}" data-i="${i}" aria-label="Palito ${i+1}"></button>`).join('')+`</div>`;
    $('chQuedan').textContent='Quedan '+n;
  } else {
    h=N.piles.map((c,p)=>`<div class="pila" data-p="${p}">`+Array.from({length:c},(_,j)=>`<button type="button" class="piedra${N.sel&&N.sel.p===p&&j<N.sel.c?' sel':''}" data-p="${p}" data-j="${j}" aria-label="Piedra ${j+1} de la pila ${p?'B':'A'}"></button>`).join('')+`<span class="nom">Pila ${p?'B':'A'}</span></div>`).join('');
    $('chQuedan').textContent='Quedan '+(N.piles[0]+N.piles[1]);
  }
  mesa.innerHTML=h;
  mesa.querySelectorAll('.palito').forEach(b=>b.addEventListener('click',()=>tocarPalito(+b.dataset.i)));
  mesa.querySelectorAll('.piedra').forEach(b=>b.addEventListener('click',()=>tocarPiedra(+b.dataset.p,+b.dataset.j)));
  const cant = N.sel===null ? 0 : (N.nivel<3 ? N.sel : N.sel.c);
  $('bQuitar').disabled = !(cant>0) || N.turno!=='j' || N.fin || N.bloqueado;
  $('txtQuitar').textContent = cant>0 ? (N.nivel<3 ? `Quitar ${cant}` : `Quitar ${cant} de la pila ${N.sel.p?'B':'A'}`) : 'Quitar';
  $('chTurno').textContent = N.fin ? 'Fin del juego' : (N.turno==='j' ? 'Tu turno' : '🤖 Turno del bot'); $('chTurno').classList.toggle('bot',N.turno==='b'&&!N.fin);
}
function tocarPalito(i){
  if(N.turno!=='j'||N.fin||N.bloqueado) return;
  const n=N.piles[0], c=n-i;
  if(c>N.k){ msg(`Solo puedes quitar de 1 a ${N.k} palitos por turno.`,'mal'); try{ mvFallo(); }catch(e){} N.sel=null; dibujar(); return; }
  N.sel = (N.sel===c) ? null : c; msg(N.sel? `Vas a quitar ${c}. Pulsa Quitar para confirmar.` : msgInicial()); dibujar();
}
// Las piedras se dibujan de abajo hacia arriba: j=0 es la de abajo. Tocar una selecciona esa y las de ARRIBA (índices mayores).
function tocarPiedra(p,j){
  if(N.turno!=='j'||N.fin||N.bloqueado) return;
  const c=N.piles[p]-j;
  N.sel = (N.sel&&N.sel.p===p&&N.sel.c===c) ? null : {p,c};
  msg(N.sel? `Vas a quitar ${c} de la pila ${p?'B':'A'}. Pulsa Quitar para confirmar.` : msgInicial()); dibujar();
}
function vacio(){ return N.piles.every(x=>x===0); }
function aplicar(m){ N.piles[m.p]-=m.c; }
$('bQuitar').addEventListener('click',()=>{
  if(N.sel===null||N.turno!=='j'||N.fin) return;
  const m = N.nivel<3 ? {p:0,c:N.sel} : N.sel;
  aplicar(m); N.sel=null;
  if(vacio()){ terminar(true); return; }
  N.turno='b'; N.bloqueado=true; msg('🤖 El bot está pensando…'); dibujar();
  setTimeout(turnoBot,900);
});
function jugadaBot(){
  if(N.nivel<3){
    const r=N.piles[0], k=N.k;
    if(r<=k) return {p:0,c:r};
    const buena=r%(k+1), perfecto = N.nivel===2 || Math.random()<0.3;
    if(perfecto && buena!==0) return {p:0,c:buena};
    return {p:0,c:rnd(1,k)};
  }
  const [a,b]=N.piles;
  if(a!==b) return a>b ? {p:0,c:a-b} : {p:1,c:b-a};
  const p = a>0 ? rnd(0,1) : 0; return {p,c:1};
}
function turnoBot(){
  const m=jugadaBot(), mesa=$('mesa');
  if(N.nivel<3){ const n=N.piles[0]; mesa.querySelectorAll('.palito').forEach((b,i)=>{ if(i>=n-m.c) b.classList.add('bot'); }); }
  else { mesa.querySelectorAll(`.piedra[data-p="${m.p}"]`).forEach((b,j)=>{ if(j>=N.piles[m.p]-m.c) b.classList.add('bot'); }); }
  msg(N.nivel<3 ? `🤖 El bot quita ${m.c} ${m.c===1?'palito':'palitos'}…` : `🤖 El bot quita ${m.c} de la pila ${m.p?'B':'A'}…`);
  setTimeout(()=>{
    aplicar(m);
    if(vacio()){ terminar(false); return; }
    N.turno='j'; N.bloqueado=false;
    msg(N.nivel<3 ? `El bot quitó ${m.c}. ¡Tu turno!` : `El bot quitó ${m.c} de la pila ${m.p?'B':'A'}. ¡Tu turno!`); dibujar();
  },850);
}
function terminar(gano){
  N.fin=true; N.bloqueado=false; dibujar();
  $('filaAcc').classList.add('hidden'); $('filaFin').classList.remove('hidden');
  if(gano){
    const secreto = N.nivel===3 ? 'El secreto: dejarle siempre las dos pilas con la misma cantidad.' : `El secreto: dejarle siempre una cantidad de palitos que sea múltiplo de ${N.k+1}.`;
    msg('🎉 ¡Ganaste! '+secreto,'bien'); try{ mvExito(); }catch(e){}
    reportar(PESO[N.nivel]||3); $('txtSig').textContent='Siguiente'; N.repetir=false;
  } else {
    msg(N.nivel===3 ? 'El bot se llevó la última piedra. ¡Inténtalo de nuevo!' : 'El bot se llevó el último palito. ¡Inténtalo de nuevo!','mal');
    try{ mvFallo(); }catch(e){} $('txtSig').textContent='Intentar de nuevo'; N.repetir=true;
  }
}
$('bSig').addEventListener('click',()=>{ if(N.repetir) partida(); else { nuevaPosicion(N.nivel); partida(); } });
window.empezar=empezar;

$('btn-back').addEventListener('click', function(){ pantalla('screen-home'); });
(function(){
  function montar(n){ n=n||0;
    if(typeof window.montarChipCompanero==='function'){
      [['mvChipHome',{grande:true}],['mvChipHeader',{grande:false}],['mvCelebra',{grande:true,celebra:true}]].forEach(function(p){
        var e=document.getElementById(p[0]); if(e && !e.dataset.mv){ e.dataset.mv='1'; window.montarChipCompanero(e,p[1]); } });
    } else if(n<100){ setTimeout(function(){ montar(n+1); },100); } }
  montar();
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter' || e.repeat || e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
    var b=document.querySelector('#bSig'); if(!b || b.offsetParent===null || b.disabled || document.activeElement===b) return;
    e.preventDefault(); b.click();
  });
})();
</script>
