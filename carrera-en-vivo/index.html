<style>

*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden;color:var(--text);font-family:var(--font-body);min-height:100vh;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 15% 0%,var(--bg-3),transparent 55%),radial-gradient(circle at 85% 100%,#2a0f66,transparent 55%),linear-gradient(160deg,var(--bg-1),var(--bg-2));background-attachment:fixed}
button{font-family:inherit}
.hidden{display:none !important}
.screen{display:none;flex-direction:column;align-items:center;position:relative;z-index:1}
.screen.active{display:flex}
#app{width:100%;max-width:900px;margin:0 auto;padding:clamp(10px,2.5vw,24px);display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column}
.card{width:100%;position:relative;max-width:980px;margin:0 auto;padding:6px 10px}
.home-title{text-align:center;font-family:var(--font-display);font-weight:800;margin:0 0 6px;line-height:1.1}

.mv-pregunta{text-align:center;text-wrap:balance;font-family:var(--font-display);font-size:1.25rem;margin:6px 0 2px}
.icon-btn{display:inline-flex;align-items:center;cursor:pointer}
.mv-fila-chip{margin-top:30px}
.mv-atras-home{position:absolute;left:6px;top:6px;z-index:5}
.mv-casa-home{position:absolute;right:6px;top:6px;z-index:5}
.mv-niveles.mv-p3.mv-lv{aspect-ratio:100/90}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n1{--x:7;--y:53;--w:34}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n2{--x:50;--y:48;--w:41}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n3{--x:27;--y:1;--w:47}

.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n1{--x:10;--y:13;--w:22}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n2{--x:37;--y:8;--w:26}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n3{--x:66;--y:2;--w:31}}
.mv-nivel .ico{width:46%;height:auto;position:relative;z-index:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.mv-universo .mv-home .home-title{padding:0 48px}

/* ---- pantalla de juego ---- */
#screen-juego{align-items:stretch;width:100%}
body.en-juego{overflow:hidden;height:100dvh;min-height:0}

.app-header.app-topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:none;width:100%;max-width:900px;margin:0 auto;padding:2px 10px 0;flex-wrap:nowrap}
.app-topbar .side{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.app-topbar .icon-btn.btn-orbita{font-size:.92rem}
.mv-universo .app-header.app-topbar .mv-av{width:clamp(56px,14vw,84px);height:clamp(56px,14vw,84px)}
#mvCelebra{position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:99990;pointer-events:none;opacity:0;width:min(86vw,300px)}
#mvCelebra.on{animation:mvCelPop 1.6s ease both}
@keyframes mvCelPop{0%{opacity:0;transform:translateX(-50%) scale(.55)}14%{opacity:1;transform:translateX(-50%) scale(1.1)}24%{transform:translateX(-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}
#mvCelebra .mv-info{display:none}
.cuerpo{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:760px;margin:0 auto;padding:2px 12px 12px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex:none}
.chip{padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(196,181,253,.4);font-family:var(--font-display);font-weight:800;font-size:1rem}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#stage > svg{width:100%;height:100%;max-height:100%;overflow:visible}
.msg{flex:none;min-height:2.7em;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:clamp(1rem,.85rem + .7vw,1.3rem);line-height:1.25;text-wrap:balance;max-width:640px}
.msg.mal{color:#fda4af}.msg.bien{color:#6ee7b7}.msg.pista{color:#fde68a}
.fila{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;flex:none}
.btn-orbita.ancho{font-size:1.15rem;padding-right:2em}
.btn-orbita[disabled]{opacity:.45;pointer-events:none;filter:grayscale(.5)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .32s}



.cuerpo{max-width:min(1000px,98vw)}
#zona{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;gap:7px;overflow-x:hidden;overflow-y:hidden}
.pb{border:none;border-radius:999px;padding:.5em 1.05em;font-family:var(--font-display);font-weight:900;font-size:clamp(.88rem,3.5vw,1.05rem);color:#fff;background:linear-gradient(115deg,#7c3aed,#db2777);box-shadow:inset 0 0 0 2px rgba(255,255,255,.55),0 5px 14px rgba(0,0,0,.3);cursor:pointer;-webkit-tap-highlight-color:transparent}
.pb.v{background:linear-gradient(115deg,#059669,#10b981)}.pb.r{background:linear-gradient(115deg,#be123c,#ef4444)}.pb.a{background:linear-gradient(115deg,#1d4ed8,#3b82f6)}.pb.o{background:linear-gradient(115deg,#b45309,#f59e0b)}

.fil{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;width:100%}
.caja{width:100%;border-radius:18px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 2px rgba(196,181,253,.3);padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cap{font-family:var(--font-display);font-weight:800;color:#e9ddff;text-align:center;font-size:clamp(.82rem,3.3vw,1rem)}
.cap b{color:#fde68a}
.reto{font-family:var(--font-display);font-weight:900;text-align:center;font-size:clamp(.9rem,3.6vw,1.1rem);color:#fff;background:linear-gradient(115deg,rgba(124,58,237,.7),rgba(219,39,119,.7));border-radius:14px;padding:5px 10px;width:100%}

.barra i{display:block;height:100%}
.ficha{display:inline-block;width:1.05em;height:1.05em;border-radius:50%;background:#dc2626;box-shadow:inset 0 0 0 .13em #fff,inset 0 0 0 .22em #dc2626;vertical-align:-.15em;margin-right:.3em}
.ap{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--font-display);font-weight:800;color:#fff}
.ap button{width:40px;height:40px;border-radius:50%;border:none;font-size:1.4rem;font-weight:900;color:#fff;background:linear-gradient(135deg,#7c3aed,#db2777);cursor:pointer}
.ap button:disabled{opacity:.35}
.ap .v{min-width:5.5em;text-align:center}
/* ruleta */
.rgrid{display:grid;grid-template-columns:auto repeat(12,1fr);gap:2px;width:100%;max-width:560px}
.cel{border:none;border-radius:6px;padding:0;height:clamp(22px,calc(4.6*var(--u,1dvh)),34px);font-family:var(--font-display);font-weight:900;font-size:clamp(.62rem,2.5vw,.85rem);color:#fff;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.cel.rj{background:#b91c1c}.cel.ng{background:#1f2937}.cel.vd{background:#047857;grid-row:1/4;width:clamp(22px,6vw,34px);height:auto}
.cel.cv{box-shadow:inset 0 0 0 3px #fde68a,0 0 8px rgba(253,230,138,.8);filter:brightness(1.25)}
.cel.sel{box-shadow:inset 0 0 0 3px #fff,0 0 0 2px #f59e0b;transform:scale(1.08)}
.cel.gan{outline:3px solid #6ee7b7}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;width:100%;max-width:560px}
.pal button{border:none;border-radius:10px;padding:6px 2px;font-family:var(--font-display);font-weight:800;font-size:clamp(.66rem,2.7vw,.86rem);color:#fff;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3);cursor:pointer}
.pal button.sel{background:#f59e0b;color:#1e1b4b;box-shadow:inset 0 0 0 2px #fff}
.rrow{display:flex;align-items:center;justify-content:center;gap:12px;width:100%}
#rueda{width:clamp(96px,calc(17*var(--u,1dvh)),170px);height:auto;flex:none}
.rnum{font-family:var(--font-display);font-weight:900;font-size:clamp(2rem,9vw,3rem);line-height:1;min-width:2.6em;text-align:center;border-radius:14px;padding:4px 8px;color:#fff;background:#4c1d95}
/* blackjack */
.mano{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.nai{width:clamp(46px,12.5vw,64px);height:clamp(66px,18vw,90px);border-radius:8px;background:#fff;color:#1e1b4b;font-family:system-ui,sans-serif;font-weight:900;font-size:clamp(1.45rem,6.8vw,2.25rem);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.35);line-height:1.05}
.nai.vacio{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.nai.rj{color:#dc2626}.nai.dorso{background:repeating-linear-gradient(45deg,#4c1d95,#4c1d95 6px,#6d28d9 6px,#6d28d9 12px);color:#fff}
.pool{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:58px}
.pool div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1px;width:clamp(22px,7vw,34px);font-family:var(--font-display);font-weight:800;font-size:.72rem;color:#fff}
.pool i{display:block;width:100%;border-radius:4px 4px 0 0;background:#60a5fa}.pool .mal i{background:#ef4444}
/* dados */
.dd{display:flex;gap:clamp(14px,5vw,28px);justify-content:center;padding:4px 0}
.die{width:clamp(54px,17vw,80px);aspect-ratio:1;border-radius:18%;background:linear-gradient(145deg,#ff6b6b,#c81e1e 60%,#991b1b);box-shadow:inset 2px 3px 5px rgba(255,255,255,.45),inset -4px -5px 9px rgba(0,0,0,.35),0 8px 14px rgba(0,0,0,.45);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13%;gap:2%;place-items:center}
.die i{width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e5e7eb 70%);box-shadow:inset -1px -2px 3px rgba(0,0,0,.3)}
.die.rod{animation:rueda .22s linear infinite}
@keyframes rueda{0%{transform:rotate(0) translateY(0)}25%{transform:rotate(12deg) translateY(-9px)}50%{transform:rotate(-8deg) translateY(0)}75%{transform:rotate(-14deg) translateY(-6px)}100%{transform:rotate(0) translateY(0)}}

.hist{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}.hist span{background:rgba(255,255,255,.15);border-radius:8px;padding:2px 8px;font-family:var(--font-display);font-weight:800;color:#fff}
.dist{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:92px;width:100%;max-width:420px}
.dist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-family:var(--font-display);font-weight:800;font-size:.72rem;color:#fff;gap:1px}
.dist i{display:block;width:100%;border-radius:4px 4px 0 0}
.g{background:#10b981}.p{background:#f59e0b}.l{background:#ef4444}
.mundo{position:relative;border:none;cursor:pointer;aspect-ratio:1;width:min(40vw,calc(34*var(--u,1dvh)),250px);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-family:var(--font-display);font-weight:800;background:radial-gradient(circle at 32% 26%,var(--c1),var(--c2) 70%);box-shadow:inset -8px -10px 18px rgba(0,0,0,.28),inset 5px 6px 12px rgba(255,255,255,.35),0 10px 26px rgba(0,0,0,.35);animation:flota 5s ease-in-out infinite;-webkit-tap-highlight-color:transparent}

.mundo .em{font-size:clamp(2.2rem,10vw,3.6rem);line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.mundo .nm{font-size:clamp(.95rem,4vw,1.3rem);line-height:1.05;text-shadow:0 2px 4px rgba(0,0,0,.4);text-align:center;padding:0 6px}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.menu-pl{flex:none;width:100%;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(10px,3vw,26px);padding:6px}
#screen-menu{flex-direction:column;align-items:center;height:100dvh}
.m-cuerpo{flex:1;min-height:0;width:100%;max-width:900px;margin:0 auto;padding:4px 12px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.m-tit{font-family:var(--font-display);font-weight:800;font-size:clamp(1.25rem,1rem + 1.4vw,1.8rem);text-align:center;margin:2px 0 0}

@keyframes cpg{0%,100%{background:inherit}30%{background:#10b981;transform:scale(1.18)}}

@media (prefers-reduced-motion:reduce){.ban,#chFichas.pg,#chFichas.pp,.fl{animation:none}}
#zona .ayuda{justify-content:flex-start}#zona .ayuda>div:first-child{margin:auto 0;padding-bottom:8px}#zona .ayuda>button{position:sticky;bottom:0;flex:none}

<script>
/* ===================== CARRERA DE CABALLOS EN VIVO ===================== */
const RECURSO='carrera-en-vivo', SUF='_carrera', NOMBRE_PANEL='Carrera de caballos en vivo (mesa)';
const DURA=Math.max(3,+(new URLSearchParams(location.search).get('dur'))||15), META=8, STEP=+(new URLSearchParams(location.search).get('step'))||480;
const CAB_P={2:.0005,3:.003,4:.023,5:.083,6:.201,7:.382,8:.201,9:.083,10:.023,11:.003,12:.0005};
const PAY={}; for(let n=2;n<=12;n++) PAY[n]=Math.max(1,Math.min(30,Math.round(.9*(1-CAB_P[n])/CAB_P[n])));
PAY[7]=1;
const cabCol=n=>'hsl('+((n-2)*31)+',72%,56%)';
const PIPS={1:[5],2:[1,9],3:[1,5,9],4:[1,3,7,9],5:[1,3,5,7,9],6:[1,3,4,6,7,9]};
function dadoH(n,rod){ let h='<div class="die'+(rod?' rod':'')+'">'; for(let c=1;c<=9;c++) h+=PIPS[n].indexOf(c)>=0?'<i style="grid-area:'+Math.ceil(c/3)+'/'+(((c-1)%3)+1)+'"></i>':''; return h+'</div>'; }
function setDados(a,b,rod){ $('dDd').innerHTML=dadoH(a,rod)+dadoH(b,rod); }
/* dado 3D: un cubo real con 6 caras que gira hasta mostrar el resultado */
const D3R={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};
function cuboH(id){
  let h='<div class="d3"><div class="cub" id="'+id+'">';
  for(let n=1;n<=6;n++){ h+='<div class="fc f'+n+'">'; for(let c=1;c<=9;c++) if(PIPS[n].indexOf(c)>=0) h+='<i style="grid-area:'+Math.ceil(c/3)+'/'+(((c-1)%3)+1)+'"></i>'; h+='</div>'; }
  return h+'</div></div>';
}
const D3A={};
function d3Set(id,n,anim,dur,vueltas){
  const el=$(id); if(!el) return; const t=D3R[n], cur=D3A[id]||[0,0];
  const nx=cur[0]+((((t[0]-cur[0])%360)+360)%360)+360*(anim?vueltas[0]:0), ny=cur[1]+((((t[1]-cur[1])%360)+360)%360)+360*(anim?vueltas[1]:0);
  D3A[id]=[nx,ny];
  el.style.transition=anim?'transform '+dur+'ms cubic-bezier(.15,.7,.25,1)':'none';
  el.style.transform='rotateX('+nx+'deg) rotateY('+ny+'deg)';
  if(anim){ const w=el.parentNode; w.classList.remove('salta'); void w.offsetWidth; w.style.setProperty('--sd',dur+'ms'); w.classList.add('salta'); }
}
const MAXJ=15, FICHAS0=100, RECARGA=20;
const $=id=>document.getElementById(id);

/* --- adaptador de base de datos --- */
async function crearDB(host){
  if(window.__POKER_DB__) return window.__POKER_DB__;
  const CFG={apiKey:"AIzaSyDrwcG84h88gOf9FkUlZbECZ2qrO14KhO4",authDomain:"profehoracio-online.firebaseapp.com",projectId:"profehoracio-online",storageBucket:"profehoracio-online.firebasestorage.app",messagingSenderId:"TU_SENDER_ID",appId:"1:337766647406:web:6f13e95cb71b5f89cfc87f"};
  const V='https://www.gstatic.com/firebasejs/10.0.0/';
  const A=await import(V+'firebase-app.js'), Au=await import(V+'firebase-auth.js'), F=await import(V+'firebase-firestore.js');
  const app=host?A.initializeApp(CFG):A.initializeApp(CFG,'pokerVivo'); const auth=Au.getAuth(app), fs=F.getFirestore(app);
  return {
    async uid(){ if(host){ const u=await new Promise(r=>{ const un=Au.onAuthStateChanged(auth,x=>{ un(); r(x); }); }); return (u&&!u.isAnonymous)?u.uid:null; }
      const c=await Au.signInAnonymously(auth); return c.user.uid; },
    async getSession(code){ const s=await F.getDoc(F.doc(fs,'sessions',code)); if(!s.exists()) return null; const d=s.data(); return Object.assign({},d,{createdMs:d.createdAt&&d.createdAt.toDate?d.createdAt.toDate().getTime():null}); },

    async getStudent(code,id){ const s=await F.getDoc(F.doc(fs,'sessions',code,'students',id)); return s.exists()?s.data():null; },
    async setStudent(code,id,data){ await F.setDoc(F.doc(fs,'sessions',code,'students',id),data,{merge:true}); },
    async setMesa(code,mesa){ await F.updateDoc(F.doc(fs,'sessions',code),{mesa:mesa}); }
  };
}
const ahora=()=>Date.now();
/* ---------- unirse (alumno) y abrir la mesa (anfitrión): común a todas las mesas ---------- */
let DB=null, CODE=null, ME=null, MID=null, MESA=null, ST=[], G={fichas:FICHAS0,comp:0,err:0,aplicada:0,nombre:'',rondaVista:0}, VISTO={};
function sesionAlumno(){ try{ const g=JSON.parse(sessionStorage.getItem('profehoracio_alumno_actual')||'null'); if(g&&g.id&&g.nombre) return g; }catch(e){} return null; }

function saveMe(extra){ if(!DB||!MID) return; DB.setStudent(CODE,MID,Object.assign({name:G.nombre,uid:ME,fichas:G.fichas,completados:G.comp,errores:G.err,aplicada:G.aplicada,mesa:true,updatedAt:ahora()},extra||{})).catch(e=>console.warn(e)); }

function yoEnMesa(){ return MESA&&MESA.jug&&MESA.jug.indexOf(MID)>=0; }
function nombreDe(id){ const s=ST.find(z=>z.id===id); return (s&&s.name)||'?'; }
async function unirse(codigo,nombre){
  try{
    iniTxt('Conectando con la mesa…',false);
    DB=await crearDB(false); ME=await DB.uid();
    const s=await DB.getSession(codigo);
    if(!s) return iniTxt('Ese código no existe. Revísalo con tu profe.',true);
    if(s.active===false) return iniTxt('Tu profe ya cerró esta mesa.',true);
    if(s.recurso&&s.recurso!==RECURSO) return iniTxt('Ese código es de otro recurso, no de esta mesa.',true);
    if(s.createdMs){ const min=(ahora()-s.createdMs)/60000; if(min>(s.duracionMinutos||180)) return iniTxt('Este código ya venció. Pídele uno nuevo a tu profe.',true); }
    CODE=codigo; MID=ME+SUF; G.nombre=nombre;
    const prev=await DB.getStudent(CODE,MID);
    if(prev){ G.fichas=typeof prev.fichas==='number'?prev.fichas:FICHAS0; G.comp=prev.completados||0; G.err=prev.errores||0; G.aplicada=prev.aplicada||0; cargarPrev(prev); }

      if(primero){ primero=false; if(!l.some(x=>x.id===MID)&&l.filter(x=>x.mesa).length>=MAXJ){ lleno=true; iniTxt('La mesa está llena (máximo '+MAXJ+' jugadores).',false); return; } saveMe(prev?{}:{startedAt:ahora()}); }
      if(!lleno) refresco(); });
    DB.watchSession(CODE,m=>{ if(m===null){ iniTxt('La mesa se cerró.',false); return; } const nuevo=m.mesa||null;
      if(nuevo&&MESA&&nuevo.ronda===MESA.ronda&&nuevo.paso===MESA.paso) return; MESA=nuevo; if(!lleno){ onMesaS(MESA); refresco(); } });
    pantalla('screen-alu'); try{ if(typeof window.iniciarHeartbeatMathverse==='function'&&sesionAlumno()) window.iniciarHeartbeatMathverse(()=>sesionAlumno().id,RECURSO); }catch(e){}
    setInterval(tickAlumno,250);
  }catch(e){ console.error(e); iniTxt('No se pudo conectar. Revisa tu internet e inténtalo de nuevo.',true); }
}
let AB=false;
async function anfitrion(codigo){
  try{
    pantalla('screen-ini'); $('iniTxt').textContent='Conectando…';
    DB=await crearDB(true); const uid=await DB.uid();

    pantalla('screen-anf'); setInterval(tickAnf,400);
  }catch(e){ console.error(e); iniTxt('No se pudo conectar. Revisa tu internet.',false); }
}
function escribirMesa(m){ MESA=m; const c=Object.assign({},m); DB.setMesa(CODE,c).catch(e=>console.warn(e)); onMesaA(m); renderAnf(); }
function jugadoresActuales(){ return ST.filter(s=>s.mesa&&s.name).sort((a,b)=>((a.startedAt||0)-(b.startedAt||0))||(a.id<b.id?-1:1)).slice(0,MAXJ).map(s=>s.id); }
$('iniGo').addEventListener('click',()=>{ const c=$('iniCodigo').value.trim().toUpperCase(), n=$('iniNombre').value.trim(); if(!c||!n){ $('iniTxt').textContent='Escribe el código y tu nombre.'; return; } unirse(c,n); });

$('anfAdel').addEventListener('click',adelantar);
function arranque(){
  const q=new URLSearchParams(location.search), anf=q.get('anfitrion'), cod=q.get('codigoClase');
  if(anf){ anfitrion(anf.trim().toUpperCase()); return; }
  const ses=sesionAlumno(), inv=q.get('invitado'); const nombre=ses?ses.nombre:(inv&&inv.trim()?'👤 '+inv.trim():'');

function cargarPrev(p){ G.b=p.b||null; }
function bDe(s,ronda){ const b=s&&s.b; return (b&&b.r===ronda)?{h:b.h||0,s:b.s||1,ok:!!b.ok}:{h:0,s:1,ok:false}; }
function pistaHTML(btn){ let L=''; for(let n=2;n<=12;n++){ L+='<div class="cl" data-n="'+n+'">'+(btn?'<button type="button" class="cn" data-a="cab" data-v="'+n+'" style="--c:'+cabCol(n)+'">'+n+'</button>':'<span class="cn" style="--c:'+cabCol(n)+';display:grid;place-items:center">'+n+'</span>')+'<div class="ct">'+Array.from({length:META},(_,i)=>i+1).map(i=>'<span class="cc'+(i===META?' meta':'')+'" data-i="'+i+'"></span>').join('')+'</div><span class="cw">x'+PAY[n]+'</span></div>'; } return L; }
const CP={}, CR={ronda:-1,fin:true,iv:null,g:null};
function cpReset(){ for(let n=2;n<=12;n++) CP[n]=0; }
cpReset();
function pintaPista(root,sel){

    row.classList.toggle('sel',sel===n);
    row.querySelectorAll('.cc').forEach((c,k)=>{ const i=k+1; c.classList.toggle('lit',i<=p); const t=(i===p)?(p>=META?'🏆':'🐎'):(i===META?'🏁':''); if(c.textContent!==t) c.textContent=t; c.style.setProperty('--c',cabCol(n)); }); }
}
function correrAnim(m,alFin,alPaso){
  if(CR.ronda===m.ronda) return; CR.ronda=m.ronda; CR.fin=false; cpReset(); CR.g=m.g;
  clearInterval(CR.iv);

  },STEP);
}
function simular(){ const pos={}; for(let n=2;n<=12;n++) pos[n]=0; const tir=[]; let g=0; while(!g){ const a=1+Math.floor(Math.random()*6), b=1+Math.floor(Math.random()*6); tir.push(a*10+b); if(++pos[a+b]>=META) g=a+b; } return {tir:tir,g:g}; }
function calcRes(m,g){ const res={}; m.jug.forEach(id=>{ const s=ST.find(z=>z.id===id)||{}; const b=bDe(s,m.ronda); const st=Math.min(3,Math.max(1,b.s)); if(!b.h||st>capDe(s)) res[id]={d:0,t:0,h:0}; else res[id]={d:(b.h===g?PAY[b.h]*st:-st),t:st,h:b.h}; }); return res; }

/* ============================ ALUMNO ============================ */
G.b=null;
function miB(){ return bDe({b:G.b},MESA?MESA.ronda:-1); }
function construirAlumno(){
  $('zona').innerHTML='<div class="carr hint"><div class="cizq"><div class="pista" id="cPista">'+pistaHTML(true)+'</div></div><div class="cder"><div class="vv-est" id="vEst"></div>'
   +'<div class="dd" id="dDd">'+cuboH('cu0')+cuboH('cu1')+'</div><div class="cap" id="cSuma">&nbsp;</div>'

function onMesaS(m){ if(m&&m.tir&&(m.paso==='carr'||m.paso==='show')) correrAnim(m,()=>refresco(),()=>refresco()); else if(m&&m.paso==='apu'){ clearInterval(CR.iv); cpReset(); CR.fin=true; CR.ronda=-1; $('cSuma').innerHTML='&nbsp;'; } }

function guardarB(h,s,ok){ G.b={r:MESA.ronda,h:h,s:s,ok:ok?1:0}; saveMe({b:{r:MESA.ronda,h:h,s:s,ok:ok?1:0}}); }
$('zona').addEventListener('click',ev=>{
  const t=ev.target.closest('[data-a]'); if(!t||t.disabled||!MESA||MESA.paso!=='apu'||!yoEnMesa()||restante()<=0) return; const b=miB(); if(b.ok) return; const a=t.dataset.a;
  if(a==='chip'){ const v=+t.dataset.v; if(v>capDe({fichas:G.fichas})){ return; } guardarB(b.h,v,false); }
  else if(a==='cab'){ const n=+t.dataset.v; guardarB(b.h===n?0:n,Math.min(b.s,capDe({fichas:G.fichas})),false); }
  else if(a==='listo'){ if(!b.h){ $('vEst').textContent='Primero elige un caballo.'; return; } guardarB(b.h,b.s,true); }

});

function anfInit(){ $('anfPista').innerHTML=pistaHTML(false); $('anfDados').innerHTML=cuboH('cu0')+cuboH('cu1'); D3A.cu0=[0,0]; D3A.cu1=[0,0]; d3Set('cu0',3,false); d3Set('cu1',4,false); }
function onMesaA(m){ if(m&&m.tir&&(m.paso==='carr'||m.paso==='show')) correrAnim(m,()=>renderAnf(),()=>renderAnf()); else if(m&&m.paso==='apu'){ clearInterval(CR.iv); cpReset(); CR.fin=true; CR.ronda=-1; $('cSuma').innerHTML='&nbsp;'; } }
function nuevaRonda(){
  const jug=jugadoresActuales(); if(jug.length<1){ $('anfMsg').textContent='Todavía no hay jugadores en la mesa.'; return; }
  $('anfMsg').textContent=''; escribirMesa({ronda:(MESA&&MESA.ronda||0)+1,paso:'apu',t0:ahora(),dur:DURA,jug:jug,tir:null,g:null,res:null});
}
function adelantar(){ const m=MESA; if(!m||m.paso!=='apu') return; const r=simular(); escribirMesa(Object.assign({},m,{paso:'carr',t0:ahora(),tir:r.tir,g:r.g,res:calcRes(m,r.g)})); }
function todosListos(){ const m=MESA; return m.jug.every(id=>bDe(ST.find(z=>z.id===id),m.ronda).ok); }
function tickAnf(){
  const m=MESA; if(!m) return; const el=(ahora()-m.t0)/1000;
  if(m.paso==='apu'&&(el>=m.dur+1.5||(el>=1.5&&todosListos()))) adelantar();
  else if(m.paso==='carr'&&m.tir&&el>=(m.tir.length*STEP+STEP)/1000+1.5) escribirMesa(Object.assign({},m,{paso:'show',t0:ahora()}));
  else renderAnf();
}
function renderAnf(){
  if(!AB||!$('screen-anf').classList.contains('active')) return;
  const m=MESA, apu=m&&m.paso==='apu', el=apu?Math.max(0,m.dur-(ahora()-m.t0)/1000):0;
  $('anfBar').firstElementChild.style.width=(apu?el/m.dur*100:0)+'%'; $('anfBar').classList.toggle('ur',apu&&el<5); $('anfT').textContent=apu?'⏱ '+Math.ceil(el)+' s':'⏱ —';
  $('anfInfo').textContent='👥 '+ST.filter(s=>s.mesa).length+' / '+MAXJ+(m&&m.ronda?' · Ronda '+m.ronda:'');
  $('anfNueva').disabled=!!(m&&(m.paso==='apu'||m.paso==='carr')); $('anfAdel').disabled=!apu;
  pintaPista($('anfPista'),-1);
  const fin=m&&m.tir&&CR.fin&&CR.ronda===m.ronda; let est='', g='', l='';
  if(!m||!m.jug||m.paso==='esp'){ est='Los alumnos entran con el código en Inicio → Desafío online. Cuando estén todos, pulsa «Abrir apuestas».'; g=ST.filter(s=>s.mesa).map(s=>'<div class="vv-p">'+esc(s.name||'?')+' · 🪙'+(s.fichas==null?'':s.fichas)+'</div>').join(''); }
  else if(apu){ est='Apuestas abiertas'; g=m.jug.map(id=>{ const s=ST.find(z=>z.id===id)||{}; const ok=bDe(s,m.ronda).ok; return '<div class="vv-p'+(ok?' ok':'')+'">'+(ok?'✔ ':'⏳ ')+esc(s.name||'?')+'</div>'; }).join(''); }
  else if(!fin) est='🏇 ¡Corren!';
  else { est='Ganó el caballo '+m.g; l=m.jug.map(id=>({id:id,r:(m.res||{})[id]||{d:0,t:0,h:0}})).sort((a,c)=>c.r.d-a.r.d).map(x=>'<div class="vv-fila'+(x.r.d>0?' gan':x.r.d<0?' per':'')+'" style="font-size:.95rem"><span>'+(x.r.d>0?'🏆 ':'')+esc(nombreDe(x.id))+(x.r.t?' <small>(caballo '+x.r.h+')</small>':' <small>(no apostó)</small>')+'</span><span>'+(x.r.d>0?'+':'')+x.r.d+'</span></div>').join(''); }
  $('anfEst').textContent=est; if($('anfG')._h!==g){ $('anfG').innerHTML=g; $('anfG')._h=g; } if($('anfL')._h!==l){ $('anfL').innerHTML=l; $('anfL')._h=l; }
}

<script>
/* ---- PC: escala la mesa en pantallas grandes sin generar scroll ---- */
(function(){ var t=null;
  function ajusta(){ var Z=1; if(innerWidth>=1000&&innerHeight>=600) Z=Math.max(1,Math.min(innerWidth/1000,innerHeight/700,2.1)); if(Z<1.04) Z=1;
    var ps=document.querySelectorAll('#screen-alu,#screen-anf');
    for(var i=0;i<ps.length;i++){ var e=ps[i]; if(Z===1){ e.style.removeProperty('zoom'); e.style.removeProperty('width'); e.style.removeProperty('height'); e.style.removeProperty('--u'); }
      else{ e.style.zoom=Z; e.style.width='calc(100vw / '+Z+')'; e.style.height='calc(100dvh / '+Z+')'; e.style.setProperty('--u','calc(1dvh / '+Z+')'); } } }
  function lanza(){ clearTimeout(t); t=setTimeout(ajusta,40); }
  window.addEventListener('resize',lanza); window.addEventListener('load',ajusta); ajusta();
})();
</script>
