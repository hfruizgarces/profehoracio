.hidden{display:none !important}
.screen{display:none;flex-direction:column;align-items:center;position:relative;z-index:1}
.screen.active{display:flex}
#app{width:100%;max-width:900px;margin:0 auto;padding:clamp(10px,2.5vw,24px);display:flex;flex-direction:column}
.card{width:100%;position:relative;max-width:980px;margin:0 auto;padding:6px 10px}
.home-title{text-align:center;font-family:var(--font-display);font-weight:800;margin:0 0 6px;line-height:1.1}
.mv-pregunta{text-align:center;text-wrap:balance;font-family:var(--font-display);font-size:1.25rem;margin:6px 0 2px}
.icon-btn{display:inline-flex;align-items:center;cursor:pointer}
.mv-fila-chip{margin-top:30px}
.mv-atras-home{position:absolute;left:6px;top:6px;z-index:5}
.mv-casa-home{position:absolute;right:6px;top:6px;z-index:5}
.home-title{padding:0 48px}
/* esferas de modo (2): centradas, dentro de la tarjeta, sin huecos raros */
.mv-niveles.mv-p2{aspect-ratio:100/50;width:min(100%,560px)}
.mv-niveles.mv-p2 .level-btn.mv-nivel.n1{--x:5;--y:12;--w:42}
.mv-niveles.mv-p2 .level-btn.mv-nivel.n2{--x:53;--y:12;--w:42}

.mv-niveles.mv-p2 .level-btn.mv-nivel.n1{--x:13;--y:8;--w:33}
.mv-niveles.mv-p2 .level-btn.mv-nivel.n2{--x:54;--y:8;--w:33}}
/* esferas de nivel (3): crecen, fácil < medio < difícil */
.mv-niveles.mv-p3.mv-lv{aspect-ratio:100/90}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n1{--x:7;--y:53;--w:34}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n2{--x:50;--y:48;--w:41}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n3{--x:27;--y:1;--w:47}
@media (min-width:700px){.mv-niveles.mv-p3.mv-lv{aspect-ratio:100/40}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n1{--x:10;--y:13;--w:22}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n2{--x:37;--y:8;--w:26}

.mv-nivel .rot{position:relative;z-index:1;font-size:max(.8rem,calc(var(--w) * .1cqw));font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.6)}

<script id="motor">
/* ============================================================
   MOTOR DE AJEDREZ (reglas + rival)   -- sin librerías externas
   Casillas 0..63: a1=0, b1=1 ... h1=7, a2=8 ... h8=63.
   Piezas en el tablero: tipo * color  (color 1 = blancas, -1 = negras; tipo 1 peón, 2 caballo, 3 alfil, 4 torre, 5 dama, 6 rey)
   Jugada (entero): desde | hasta<<6 | corona<<12 | banderas<<15   (banderas: 1 captura, 2 al paso, 4 enroque, 8 salto doble de peón)
   ============================================================ */
const Ajedrez = (function(){
'use strict';
const P = 1, N = 2, B = 3, R = 4, Q = 5, K = 6;
const F_CAP = 1, F_EP = 2, F_CAS = 4, F_DBL = 8;
const mFrom = m => m & 63, mTo = m => (m >> 6) & 63, mPromo = m => (m >> 12) & 7, mFlags = m => m >> 15;
const mk = (f, t, pr, fl) => f | (t << 6) | ((pr || 0) << 12) | ((fl || 0) << 15);

/* ---------- tablas precalculadas ---------- */
const KNIGHT = [], KING = [], PAWN_ATT = { '1': [], '-1': [] }, RAYS = [];
const DIAG = [[1, 1], [1, -1], [-1, 1], [-1, -1]], ORTH = [[1, 0], [-1, 0], [0, 1], [0, -1]];
for(let s = 0; s < 64; s++){
  const r = s >> 3, f = s & 7;
  KNIGHT[s] = []; KING[s] = []; PAWN_ATT['1'][s] = []; PAWN_ATT['-1'][s] = [];
  [[1, 2], [2, 1], [-1, 2], [-2, 1], [1, -2], [2, -1], [-1, -2], [-2, -1]].forEach(([dr, df]) => { const rr = r + dr, ff = f + df; if(rr >= 0 && rr < 8 && ff >= 0 && ff < 8) KNIGHT[s].push(rr * 8 + ff); });
  for(let dr = -1; dr <= 1; dr++) for(let df = -1; df <= 1; df++){ if(!dr && !df) continue; const rr = r + dr, ff = f + df; if(rr >= 0 && rr < 8 && ff >= 0 && ff < 8) KING[s].push(rr * 8 + ff); }
  [-1, 1].forEach(df => { const ff = f + df; if(ff < 0 || ff > 7) return; if(r < 7) PAWN_ATT['1'][s].push((r + 1) * 8 + ff); if(r > 0) PAWN_ATT['-1'][s].push((r - 1) * 8 + ff); });
  RAYS[s] = [];
  DIAG.concat(ORTH).forEach(([dr, df], di) => { const ray = []; let rr = r + dr, ff = f + df; while(rr >= 0 && rr < 8 && ff >= 0 && ff < 8){ ray.push(rr * 8 + ff); rr += dr; ff += df; } RAYS[s][di] = ray; });
}
/* derechos de enroque que se pierden al tocar una casilla: 1 = blancas corto, 2 = blancas largo, 4 = negras corto, 8 = negras largo */
const CMASK = new Int8Array(64).fill(15);
CMASK[0] = 13; CMASK[7] = 14; CMASK[4] = 12; CMASK[56] = 7; CMASK[63] = 11; CMASK[60] = 3;

/* ---------- zobrist ---------- */

  if(nivel === 3 && pos.n < 6){ const l = libro(pos); if(l) return l; }
  killers.forEach(k => { k[0] = 0; k[1] = 0; }); history.fill(0);
  let mejorM = raiz[0];
  if(cfg.ruido > 0){
    /* con ruido: se puntúa cada jugada por separado y se le suma un poco de azar */
    let mejorS = -INF;
    const res = [];
    for(const m of raiz){
      pos.hacer(m);
      const s = -negamax(pos, cfg.prof - 1, -INF, INF, 1, false);
      pos.deshacer();
      if(abortado) break;
      res.push([m, s]);
    }
    if(!res.length) return raiz[Math.floor(Math.random() * raiz.length)];
    for(const [m, s] of res){ const v = s + gauss() * cfg.ruido; if(v > mejorS){ mejorS = v; mejorM = m; } }
    return mejorM;
  }
  /* sin ruido: profundización iterativa */
  let ordenadas = raiz.slice();
  for(let d = 1; d <= cfg.prof; d++){
    let mejorLocal = 0, mejorS = -INF, alpha = -INF;
    const copia = [];
    for(const m of ordenadas){
      pos.hacer(m);
      const s = -negamax(pos, d - 1, -INF, -alpha, 1, false);
      pos.deshacer();
      if(abortado) break;
      copia.push([m, s]);
      if(s > mejorS){ mejorS = s; mejorLocal = m; if(s > alpha) alpha = s; }
    }
    if(abortado){ if(copia.length && d > 1){ /* usa lo mejor de la profundidad incompleta si ya superó a la anterior */ const top = copia.reduce((a, c) => c[1] > a[1] ? c : a); if(top[0] === mejorLocal && mejorS > 0) mejorM = mejorLocal; } break; }
    mejorM = mejorLocal;
    copia.sort((a, c) => c[1] - a[1]); ordenadas = copia.map(x => x[0]);
    if(mejorS > MATE - 100) break;
  }
  return mejorM;
}
/* mini libro de aperturas para que el nivel difícil no juegue siempre igual (primeras jugadas) */
function libro(pos){
  const hist = []; for(let i = 0; i < pos.n; i++) hist.push(pos.uM[i]);
  const san = m => String.fromCharCode(97 + (m & 7)) + (((m & 63) >> 3) + 1) + String.fromCharCode(97 + ((m >> 6) & 7)) + ((((m >> 6) & 63) >> 3) + 1);
  const clave = hist.map(san).join(' ');
  const L = {
    '': ['e2e4', 'd2d4', 'g1f3', 'c2c4'],
    'e2e4': ['e7e5', 'c7c5', 'e7e6', 'c7c6'], 'd2d4': ['d7d5', 'g8f6', 'e7e6'], 'g1f3': ['d7d5', 'g8f6', 'c7c5'], 'c2c4': ['e7e5', 'g8f6', 'c7c5'],
    'e2e4 e7e5': ['g1f3', 'f1c4', 'b1c3'], 'e2e4 c7c5': ['g1f3', 'b1c3'], 'd2d4 d7d5': ['c2c4', 'g1f3', 'c1f4'], 'd2d4 g8f6': ['c2c4', 'g1f3'],
    'e2e4 e7e5 g1f3': ['b8c6', 'g8f6'], 'e2e4 e7e5 g1f3 b8c6': ['f1c4', 'f1b5', 'd2d4']
  };
  const op = L[clave]; if(!op) return 0;
  const lg = pos.legales(); const cand = lg.filter(m => op.indexOf(san(m)) >= 0);
  return cand.length ? cand[Math.floor(Math.random() * cand.length)] : 0;
}
/* perft para verificar las reglas */
function perft(pos, d){
  if(d === 0) return 1;
  const buf = new Int32Array(256), n = pos.gen(buf, false); let tot = 0;
  for(let i = 0; i < n; i++){ if(!pos.hacer(buf[i])) continue; tot += d === 1 ? 1 : perft(pos, d - 1); pos.deshacer(); }
  return tot;
}
function limpiarTT(){ ttDepth.fill(-1); }
function nombreCasilla(s){ return String.fromCharCode(97 + (s & 7)) + ((s >> 3) + 1); }
return { Pos, P, N, B, R, Q, K, mFrom, mTo, mPromo, mFlags, mk, F_CAP, F_EP, F_CAS, F_DBL, elegirJugada, evaluar, perft, limpiarTT, nombreCasilla, NIVELES };
})();

<script>
window.mvExito = function(){
  try{ if(window.reaccionCompanero) window.reaccionCompanero('bien'); }catch(e){}
};
window.mvFallo = function(){ try{ if(window.reaccionCompanero) window.reaccionCompanero('mal'); }catch(e){} };
const RECURSO = 'ajedrez';
let AlumnoActual = null;
try{ var _g=JSON.parse(sessionStorage.getItem('profehoracio_alumno_actual')||'null'); if(_g && _g.id && _g.nombre) AlumnoActual=_g; }catch(e){}
function reportar(peso){ if(AlumnoActual && typeof window.reportarProgresoPractica==='function'){ try{ window.reportarProgresoPractica(AlumnoActual.id, RECURSO, 1, 0, peso); }catch(e){} } }
function iniciarHeartbeatTiempo(){
  if(typeof window.iniciarHeartbeatMathverse==='function') window.iniciarHeartbeatMathverse(function(){ return AlumnoActual && AlumnoActual.id; }, RECURSO);
  else setTimeout(iniciarHeartbeatTiempo,100);
}
if(AlumnoActual) iniciarHeartbeatTiempo();
const $ = id => document.getElementById(id);
function pantalla(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active'); document.body.classList.toggle('en-juego', id==='screen-juego'); window.scrollTo(0,0);
}
const PESO={1:3,2:5,3:8};
const A = Ajedrez, PAL = ['','p1','p2','p3','p4','p5','p6'];
const G = { modo:'pc', nivel:2, pos:null, sel:-1, legales:[], voltear:false, fin:false, pensando:false, token:0, esperaCorona:null };
/* ---------- rival en segundo plano ---------- */
let worker = null;
try{ worker = new Worker(URL.createObjectURL(new Blob([ $('motor').textContent + `
onmessage=function(e){var d=e.data,p=Ajedrez.Pos.inicial();for(var i=0;i<d.moves.length;i++)p.hacer(d.moves[i]);var m=Ajedrez.elegirJugada(p,d.nivel);postMessage({m:m,t:d.t});};` ], {type:'text/javascript'}))); }catch(e){ worker=null; }
function pedirJugada(moves, nivel, cb){
  const t = ++G.token;
  if(worker){
    const h = ev => { if(ev.data.t!==t) return; worker.removeEventListener('message',h); cb(ev.data.m); };
    worker.addEventListener('message',h); worker.postMessage({moves, nivel, t});
  } else setTimeout(() => { const p=A.Pos.inicial(); moves.forEach(m=>p.hacer(m)); cb(A.elegirJugada(p,nivel)); }, 60);
}
function historia(){ const r=[]; for(let i=0;i<G.pos.n;i++) r.push(G.pos.uM[i]); return r; }
/* ---------- dibujo ---------- */
function msg(t,tipo){ const m=$('msg'); m.textContent=t; m.className='msg'+(tipo?' '+tipo:''); }
function dibujar(){
  const pos=G.pos, b=pos.b, T=$('tablero'); let h='';
  const ult = pos.n ? pos.uM[pos.n-1] : -1, jaqueSq = pos.enJaque() ? pos.ks[pos.stm===1?0:1] : -1;
  const dest = new Map(); G.legales.forEach(m => { if(A.mFrom(m)===G.sel) dest.set(A.mTo(m), m); });
  for(let v=0; v<64; v++){
    const vr = v>>3, vc = v&7;
    const sq = G.voltear ? ((vr)*8 + (7-vc)) : ((7-vr)*8 + vc);
    const claro = ((sq>>3)+(sq&7))&1;
    const pc = b[sq]; let cls = 'sq '+(claro?'cl':'os');
    if(sq===G.sel) cls+=' sel'; else if(ult>=0 && (sq===A.mFrom(ult)||sq===A.mTo(ult))) cls+=' ult';
    if(sq===jaqueSq) cls+=' rey-jaque';
    const esDest = dest.has(sq); if(esDest && pc) cls+=' cap';
    h += `<div class="${cls}" data-s="${sq}">`;
    if(vc===0) h += `<span class="co r">${(sq>>3)+1}</span>`;
    if(vr===7) h += `<span class="co f">${'abcdefgh'[sq&7]}</span>`;
    if(pc){ const blanca = pc>0; h += `<svg class="pz" viewBox="0 0 45 45"><use href="#${PAL[Math.abs(pc)]}" fill="${blanca?'#ffffff':'#2a1459'}" stroke="${blanca?'#2a1459':'#ede9fe'}" stroke-width="1.500"/></svg>`; }
    if(esDest) h += '<span class="pt"></span>';
    h += '</div>';
  }
  T.innerHTML = h + (G.cartel||'') + (G.esperaCorona ? coronaHTML() : '');
  T.querySelectorAll('.sq').forEach(e => e.addEventListener('click', () => tocar(+e.dataset.s)));
  T.querySelectorAll('#corona button').forEach(e => e.addEventListener('click', ev => { ev.stopPropagation(); elegirCorona(+e.dataset.p); }));
  const turnoB = pos.stm===1;
  let t;
  if(G.fin) t='Fin de la partida';
  else if(G.modo==='pc') t = G.pensando ? '🤖 Piensa el compu…' : 'Tu turno';
  else t = turnoB ? '⚪ Juegan las blancas' : '⚫ Juegan las negras';
  const ch=$('chTurno'); ch.textContent = (!G.fin && pos.enJaque()) ? '¡Jaque! · '+t : t;
  ch.classList.toggle('bot', G.modo==='pc' && G.pensando); ch.classList.toggle('jaque', !G.fin && pos.enJaque());
  $('bDeshacer').disabled = G.pensando || pos.n===0;
}
function coronaHTML(){
  const us = G.pos.stm;
  return `<div id="corona"><div class="caja">`+[5,4,3,2].map(t=>`<button type="button" data-p="${t}" aria-label="Coronar"><svg viewBox="0 0 45 45"><use href="#${PAL[t]}" fill="${us===1?'#fff':'#2a1459'}" stroke="${us===1?'#2a1459':'#ede9fe'}" stroke-width="1.500"/></svg></button>`).join('')+`</div></div>`;
}
/* ---------- partida ---------- */
function nueva(){
  G.pos = A.Pos.inicial(); G.sel=-1; G.legales = G.pos.legales(); G.fin=false; G.pensando=false; G.cartel=''; G.esperaCorona=null; G.token++;
  A.limpiarTT(); G.voltear = false;
  $('filaFin').classList.add('hidden'); $('filaAcc').classList.remove('hidden');
  msg(G.modo==='pc' ? 'Tú juegas con las blancas. Toca una pieza y luego su casilla de destino.' : 'Blancas empiezan. Toca una pieza y luego su casilla de destino.');
  dibujar();
}
function esMia(sq){ const pc=G.pos.b[sq]; return pc && (pc>0?1:-1)===G.pos.stm; }
function tocar(sq){
  if(G.fin || G.pensando || G.esperaCorona) return;
  if(G.modo==='pc' && G.pos.stm!==1) return;
  const pos=G.pos;
  if(G.sel>=0){
    const mv = G.legales.filter(m => A.mFrom(m)===G.sel && A.mTo(m)===sq);
    if(mv.length){
      if(mv.length>1){ G.esperaCorona = mv; dibujar(); return; }   // coronación: elegir pieza
      jugar(mv[0]); return;
    }
  }
  if(esMia(sq) && G.legales.some(m=>A.mFrom(m)===sq)){ G.sel = (G.sel===sq) ? -1 : sq; msg(G.sel>=0 ? 'Toca una casilla marcada para mover.' : ''); }
  else { if(esMia(sq) && G.sel<0){ msg('Esa pieza no tiene jugadas posibles ahora.','mal'); try{mvFallo();}catch(e){} } G.sel=-1; }
  dibujar();
}
function elegirCorona(t){
  const m = (G.esperaCorona||[]).find(x => A.mPromo(x)===t); G.esperaCorona=null;
  if(m) jugar(m);
}
function jugar(m){
  G.pos.hacer(m); G.sel=-1; G.esperaCorona=null; G.legales = G.pos.legales();
  if(finDePartida()) return;
  msg(G.pos.enJaque() ? '¡Jaque!' : '');
  if(G.modo==='pc' && G.pos.stm===-1) turnoPc(); else dibujar();
}
function turnoPc(){
  G.pensando=true; dibujar(); msg('🤖 El compu está pensando…');
  const t0=Date.now(), n0 = G.pos.n;
  pedirJugada(historia(), G.nivel, m => {
    const esp = Math.max(0, 450-(Date.now()-t0));   // pausa mínima para que se note la jugada
    setTimeout(() => {
      if(!G.pensando || G.pos.n!==n0) return;   // se canceló (deshacer o nueva partida)
      G.pensando=false; G.pos.hacer(m); G.legales=G.pos.legales();
      if(finDePartida()) return;
      msg(G.pos.enJaque() ? '¡Jaque! Protege a tu rey.' : '');
      dibujar();
    }, esp);
  });
}
function finDePartida(){
  const e = G.pos.estado(G.legales);
  if(!e.fin) return false;
  G.fin=true; G.pensando=false; G.sel=-1; let clase, grande, chico;
  const motivo = {mate:'Jaque mate',ahogado:'Rey ahogado: nadie puede mover',material:'No queda material para dar mate','50':'Regla de las 50 jugadas',repeticion:'La posición se repitió 3 veces'}[e.tipo];
  if(e.ganador===0){ clase='tablas'; grande='🤝 Tablas'; chico=motivo; msg('Empate: '+motivo+'.'); }
  else if(G.modo==='pc'){
    if(e.ganador===1){ clase='gana'; grande='🏆 ¡Ganaste!'; chico=motivo; msg('🎉 ¡Felicitaciones, le ganaste al compu!','bien'); try{mvExito();}catch(e){} reportar(PESO[G.nivel]||3); }
    else { clase='pierde'; grande='😔 Perdiste'; chico=motivo+' · ¡Inténtalo de nuevo!'; msg('El compu ganó. ¡Revisa qué pasó e inténtalo de nuevo!','mal'); try{mvFallo();}catch(e){} }
  } else {
    clase='gana'; grande='🏆 Ganan las '+(e.ganador===1?'blancas':'negras'); chico=motivo; msg('¡Felicitaciones a las '+(e.ganador===1?'blancas':'negras')+'!','bien'); try{mvExito();}catch(e){}
  }
  G.cartel = `<div id="cartel" class="${clase}"><div class="caja"><div class="grande">${grande}</div><div class="chico">${chico}</div></div></div>`;
  $('filaAcc').classList.add('hidden'); $('filaFin').classList.remove('hidden'); dibujar(); return true;
}
$('bSig').addEventListener('click', nueva);
$('bGirar').addEventListener('click', () => { G.voltear=!G.voltear; dibujar(); });
$('bDeshacer').addEventListener('click', () => {
  if(G.pensando || !G.pos.n) return;
  G.token++; G.cartel=''; G.fin=false;
  G.pos.deshacer();
  if(G.modo==='pc' && G.pos.stm===-1 && G.pos.n) G.pos.deshacer();   // deshace también la jugada del compu
  G.sel=-1; G.legales=G.pos.legales(); $('filaFin').classList.add('hidden'); $('filaAcc').classList.remove('hidden'); msg(''); dibujar();
});
$('bModoPc').addEventListener('click', () => { G.modo='pc'; pantalla('screen-niveles'); });
$('bModo2').addEventListener('click', () => { G.modo='2'; pantalla('screen-juego'); nueva(); });
document.querySelectorAll('[data-nivel]').forEach(b => b.addEventListener('click', () => { G.nivel=+b.dataset.nivel; pantalla('screen-juego'); nueva(); }));
$('bAtrasNiv').addEventListener('click', () => pantalla('screen-modo'));
$('btn-back').addEventListener('click', () => { G.token++; G.pensando=false; pantalla(G.modo==='pc' ? 'screen-niveles' : 'screen-modo'); });
(function(){
  function montar(n){ n=n||0;
    if(typeof window.montarChipCompanero==='function'){
      [['mvChipHome',{grande:true}],['mvChipHome2',{grande:true}],['mvChipHeader',{grande:false}]].forEach(function(p){
        var e=document.getElementById(p[0]); if(e && !e.dataset.mv){ e.dataset.mv='1'; window.montarChipCompanero(e,p[1]); } });
    } else if(n<100){ setTimeout(function(){ montar(n+1); },100); } }
  montar();
