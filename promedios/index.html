<script>

const RECURSO = 'promedios';
let AlumnoActual = null;
try{ var _g=JSON.parse(sessionStorage.getItem('profehoracio_alumno_actual')||'null'); if(_g && _g.id && _g.nombre) AlumnoActual=_g; }catch(e){}
function reportar(peso){ if(AlumnoActual && typeof window.reportarProgresoPractica==='function'){ try{ window.reportarProgresoPractica(AlumnoActual.id, RECURSO, 1, 0, peso); }catch(e){} } }

}

const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function pantalla(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active'); document.body.classList.toggle('en-juego', id==='screen-juego'); window.scrollTo(0,0);
}
const PESO={nivelar:4,calculo:6,falta:6};
let MOD=null, NIV='facil';
const pick=a=>a[Math.floor(Math.random()*a.length)];
function barajar(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const MOVIL=window.innerWidth<600;
function abrir(m,niv){ MOD=m; if(niv) NIV=niv; pantalla('screen-juego'); ({nivelar:iniNivelar,calculo:()=>{ esqueleto(); calcNuevo(); },falta:iniFalta})[m](); }
window.abrir=abrir;
$('btn-back').addEventListener('click',()=>{ if(MOD==='calculo') setTimeout(()=>pantalla('screen-niv'),0); });
function msg(t,tipo){ const m=$('msg'); if(!m) return; m.textContent=t; m.className='msg'+(tipo?' '+tipo:''); }
function shake(el){ if(!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function btn(id,cls,ico,txt,enter){ return `<button class="btn-orbita ${cls}" id="${id}" type="button"${enter?' data-enter="1"':''}><span class="bola">${ico}</span>${txt}</button>`; }
const I_OK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const I_SIG='<svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg>';
const I_UNDO='<svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 0 1 0 12"/></svg>';
function bSiguiente(fn){ $('acc').innerHTML=btn('bNext','v-verde ancho',I_SIG,'Siguiente',true); $('bNext').addEventListener('click',fn); }
function exito(txt){ msg(txt,'bien'); try{ mvExito(); }catch(e){} reportar(PESO[MOD]||5); }
function fallo(txt,el){ msg(txt,'mal'); try{ mvFallo(); }catch(e){} shake(el); }
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing||e.repeat) return;
  const b=[...document.querySelectorAll('#screen-juego [data-enter]')].find(x=>x.offsetParent!==null&&!x.disabled);
  if(b){ e.preventDefault(); b.click(); }
});
function esqueleto(){
  $('mod').innerHTML='<div class="chips"><span class="chip" id="chInfo"></span></div><p class="enun" id="enun"></p><div id="stage"></div><div class="ctrl" id="ctrl"></div><div class="msg" id="msg"></div><div class="fila" id="acc"></div>';
}
function soloDig(root){ (root||document).querySelectorAll('input.caja,input.acr').forEach(i=>i.addEventListener('input',()=>{ i.value=i.value.replace(/[^0-9]/g,''); })); }
function lista(a){ return a.length<2?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1]; }
function genDatos(n,avg,mn,mx,spread){
  for(let intento=0;intento<50;intento++){
    const a=Array(n).fill(avg);
    for(let t=0;t<n*4;t++){ const i=rnd(0,n-1), j=rnd(0,n-1); if(i===j) continue; const d=rnd(1,spread); if(a[i]+d<=mx&&a[j]-d>=mn){ a[i]+=d; a[j]-=d; } }
    if(!a.every(v=>v===a[0])&&new Set(a).size>=Math.min(3,n)) return barajar(a);
  }
  return Array.from({length:n},(_,i)=>avg+(i%2?1:-1)*(i>>1?1:2)).slice(0,n);
}
const NOMBRES=['Ana','Beto','Caro','Dani','Eli','Fran','Gabo','Hugo','Isa','Joaquín','Kari','Lalo','Mati','Nico','Pía','Rafa','Sofi','Tomás','Vale'];
/* =====================================================================
   1. NIVELAR
   ===================================================================== */
const ITEMS=['figuritas','galletas','fichas','bolitas','stickers','lápices de colores'];
const CCOL=['#f472b6','#34d399','#a78bfa','#fb923c','#38bdf8','#2dd4bf'];
function iniNivelar(){ esqueleto(); nivNuevo(); }
function nivNuevo(){
  const n=rnd(3,5), avg=rnd(3,7), cnt=genDatos(n,avg,1,11,4), nom=barajar(NOMBRES.slice()).slice(0,n), item=pick(ITEMS);
  const cols=cnt.map((c,i)=>Array(c).fill(i));
  const Q={k:'niv',n,avg,cols,sel:null,hist:[],fin:false,nom}; window.__q=Q;
  $('chInfo').textContent='Nivelar';
  $('enun').textContent=`${lista(nom)} juntan sus ${item} y las quieren repartir en partes iguales. Toca la columna de quien da una y luego la de quien la recibe, hasta que todos tengan lo mismo.`;
  const W=460,H=250,BASE=214,CH=16,CW=46;
  $('stage').innerHTML=`<svg id="svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Columnas de ${item}"><rect x="0" y="0" width="${W}" height="${H}" rx="14" fill="rgba(255,255,255,.05)" stroke="rgba(196,181,253,.5)"/><g id="cg"></g><g id="lg"></g></svg>`;
  function dibujar(){
    const aw=W/n; let g='', l='';
    cols.forEach((c,i)=>{ const cx=aw*(i+.5);
      g+=`<g class="col" data-i="${i}"><rect x="${cx-aw/2+4}" y="8" width="${aw-8}" height="${BASE-4}" rx="10" fill="rgba(255,255,255,${Q.sel===i?.1:.001})" stroke="${Q.sel===i?'#6ee7b7':'none'}" stroke-width="2" stroke-dasharray="5 4"/>`;
      c.forEach((ci,k)=>{ const y=BASE-(k+1)*CH, up=(Q.sel===i&&k===c.length-1)?-8:0; g+=`<rect x="${cx-CW/2}" y="${y+up}" width="${CW}" height="${CH-1.5}" rx="4" fill="${CCOL[ci%CCOL.length]}" stroke="#fff" stroke-width="1.6"/>`; });
      g+='</g>';
      l+=`<text x="${cx}" y="${BASE+26}" font-size="17" text-anchor="middle" fill="#fff">${nom[i]}</text>`; });
    g+=`<line x1="14" y1="${BASE}" x2="${W-14}" y2="${BASE}" stroke="rgba(255,255,255,.7)" stroke-width="2.5" stroke-linecap="round"/>`;
    if(Q.fin){ const y=BASE-cols[0].length*CH; g+=`<line x1="14" y1="${y}" x2="${W-14}" y2="${y}" stroke="#6ee7b7" stroke-width="2.5" stroke-dasharray="7 6"/>`; }
    $('cg').innerHTML=g; $('lg').innerHTML=l;
  }
  function parejo(){ return cols.every(c=>c.length===cols[0].length); }
  function preguntar(){
    Q.fin=true; Q.sel=null; dibujar();
    $('ctrl').innerHTML=`<div class="preg">¡Todos quedaron con lo mismo! ¿Cuál es el promedio?</div><div class="entrada"><span class="eti">El promedio es</span><input id="resp" class="caja" type="text" inputmode="numeric" autocomplete="off" maxlength="3" aria-label="Promedio"></div>`;
    $('acc').innerHTML=btn('bOk','v-verde',I_OK,'Comprobar',true); soloDig($('ctrl')); $('resp').focus();
    $('bOk').addEventListener('click',()=>{ const v=$('resp').value.trim(); if(v===''){ msg('Escribe un número.','mal'); return; }
      if(Number(v)!==cols[0].length){ fallo('Mira cuántos tiene ahora cada uno.',$('resp')); $('resp').value=''; $('resp').focus(); return; }
      $('resp').disabled=true; exito(`🎉 ¡Correcto! Cada uno quedó con ${cols[0].length}: ese es el promedio.`); bSiguiente(nivNuevo); });
  }
  $('ctrl').innerHTML='<div class="preg">Mueve de a una a la vez.</div>';
  $('acc').innerHTML=btn('bUndo','v-azul sutil',I_UNDO,'Deshacer');
  $('bUndo').addEventListener('click',()=>{ if(Q.fin||!Q.hist.length) return; const h=Q.hist.pop(); cols[h[0]].pop(); cols[h[1]].push(h[2]); Q.sel=null; msg(''); dibujar(); });
  $('svg').addEventListener('click',e=>{
    if(Q.fin) return; const g=e.target.closest('.col'); if(!g) return; const i=+g.dataset.i;
    if(Q.sel===null){ if(!cols[i].length){ msg('Esa columna está vacía.','mal'); return; } Q.sel=i; msg(''); dibujar(); return; }
    if(Q.sel===i){ Q.sel=null; dibujar(); return; }
    if(cols[i].length>=12){ msg('Ahí ya no caben más.','mal'); return; }
    const c=cols[Q.sel].pop(); cols[i].push(c); Q.hist.push([i,Q.sel,c]); Q.sel=null; msg(''); dibujar();
    if(parejo()) preguntar();
  });
  msg(''); dibujar();
}
/* =====================================================================
   herramientas de cálculo dentro del recurso
   ===================================================================== */
const NCOL=['unidades','decenas','centenas','unidades de mil'];
const LET=['U','D','C','UM'], LCL=['u','d','c','m'];
const frac=(num,den)=>`<span class="fr"><span class="nu">${num}</span><span class="ba"></span><span class="de">${den}</span></span>`;
const hueco=(id,txt)=>`<span class="hueco" id="${id}">${txt===undefined?'?':txt}</span>`;
/* ---- Tablero de suma por columnas (mismo mecanismo que el recurso Adición) ---- */
function sumaWidget(box,nums,total,onOk){
  const k=String(total).length, filas=nums.map(x=>String(x).padStart(k,' ').split(''));
  const carries=Array(k).fill(0), res=Array(k).fill(null);
  let h=`<div class="pv" style="--k:${k}"><div class="pvr"><span></span>`;
  for(let c=0;c<k;c++) h+=`<span class="pvh l-${LCL[k-1-c]}">${LET[k-1-c]}</span>`;
  h+='</div><div class="pvr"><span></span>';
  for(let c=0;c<k;c++) h+=`<span class="cc${c===k-1?' off':''}" id="cc${c}"></span>`;
  h+='</div>';
  filas.forEach((f,r)=>{ h+=`<div class="pvr"><span class="sg">${r===filas.length-1?'+':''}</span>`; f.forEach((d,c)=>{ h+=`<span class="cel" id="ce${r}_${c}">${d.trim()}</span>`; }); h+='</div>'; });
  h+='<div class="pvr lin"><span></span>'+'<span class="sgl"></span>'.repeat(1)+'</div><div class="pvr"><span></span>';
  for(let c=0;c<k;c++) h+=`<span class="rc" id="rcw${c}"><input id="ri${c}" class="rin" type="text" inputmode="numeric" autocomplete="off" placeholder="?" aria-label="${NCOL[k-1-c]}"></span>`;
  h+='</div></div><div class="pick" id="pick"></div>';
  box.innerHTML=h;
  const ins=[...Array(k)].map((_,c)=>$('ri'+c));
  const colSum=c=>filas.reduce((a,f)=>a+(f[c].trim()===''?0:+f[c]),0)+carries[c];
  const listaCol=c=>{ const l=filas.map(f=>f[c].trim()).filter(x=>x!==''); if(carries[c]) l.push(carries[c]+' (llevada)'); return l.join(' + '); };
  const shk=c=>{ const w=$('rcw'+c); w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake'); };
  function marcar(c){ for(let cc=0;cc<k;cc++){ $('rcw'+cc).classList.toggle('act',cc===c); filas.forEach((_,r)=>$('ce'+r+'_'+cc).classList.toggle('act',cc===c)); } }
  function activar(c){
    marcar(c); const inp=ins[c], tot=colSum(c); inp.value=''; inp.maxLength=String(tot).length; msg('');
    inp.oninput=()=>{ inp.value=inp.value.replace(/[^0-9]/g,'').slice(0,inp.maxLength); if(inp.value.length===inp.maxLength) revisar(c); };
    inp.onkeydown=e=>{ if(e.key==='Enter'){ e.stopPropagation(); revisar(c); } };
  }
  function revisar(c){
    const inp=ins[c], v=inp.value.trim(); if(v==='') return; const tot=colSum(c);
    if(+v!==tot){ fallo(`Ese no es el total correcto. Vuelve a sumar con calma: ${listaCol(c)}.`,$('rcw'+c)); inp.value=''; inp.focus(); return; }
    if(tot<=9){ fija(c,tot,0); return; }
    inp.disabled=true; const dec=Math.floor(tot/10), uni=tot%10, pos=k-1-c;
    $('pick').innerHTML=`<div class="pk-t">El total es <b>${tot}</b>. ¿Qué cifra queda abajo, en las ${NCOL[pos]}?</div><div class="pk-b"><button type="button" class="pk" data-v="${dec}">${dec}</button><button type="button" class="pk" data-v="${uni}">${uni}</button></div>`;
    $('pick').querySelectorAll('.pk').forEach(b=>b.addEventListener('click',()=>{
      if(+b.dataset.v===uni){ $('pick').innerHTML=''; fija(c,tot,dec); }
      else fallo(`Abajo va la cifra de las ${NCOL[pos]}; la otra se lleva a la columna de al lado.`,b); }));
  }
  function fija(c,tot,llev){
    res[c]=tot%10; const inp=ins[c]; inp.value=tot%10; inp.disabled=true; $('rcw'+c).classList.add('ok'); $('rcw'+c).classList.remove('act');
    filas.forEach((_,r)=>$('ce'+r+'_'+c).classList.remove('act'));
    const pos=k-1-c;
    if(llev>0){ carries[c-1]=llev; const cc=$('cc'+(c-1)); cc.textContent=llev; cc.classList.add('lleno'); msg(`¡Correcto! ${tot} = ${llev} ${NCOL[pos+1]} + ${tot%10} ${NCOL[pos]}. La llevada ${llev} pasa a la columna de al lado.`,'bien'); }
    else msg('¡Correcto!','bien');
    if(c===0){ if(res.every(x=>x!==null)){ setTimeout(()=>{ msg('¡Bien! Ya tienes la suma.','bien'); onOk(); },350); } return; }
    setTimeout(()=>ins[c-1].focus(),80);
  }
  ins.forEach((inp,c)=>inp.addEventListener('focus',()=>{
    if(res[c]!==null){ inp.blur(); return; }
    if(c!==k-1&&res[c+1]===null){ inp.blur(); fallo(`No debes comenzar a sumar por ${c===k-2?'las':'las'} ${NCOL[k-1-c]}.`,$('rcw'+c)); return; }
    if(!inp.disabled) activar(c);
  }));
}
/* ---- Tabla del divisor (mismo estilo que el recurso División) ---- */
function tablaWidget(box,n,abierta,meta,onHit){
  let open=abierta; const val=Array.from({length:10},(_,i)=>({k:i+1,v:(i+1)*n,ok:false}));
  function pinta(){
    let h=`<button type="button" class="tabla-btn" id="tgl">${open?'▾':'▸'} Tabla del ${n}</button>`;
    if(open){
      h+=`<div class="tabla-card"><div class="tabla-grande l${Math.min(String(n).length,4)}">${n}</div><div class="tabla-filas">`;
      const sig=val.findIndex(f=>!f.ok);
      val.forEach((f,i)=>{ h+=`<div class="tabla-fila${f.ok?' resuelta':''}${f.ok&&f.v===meta?' meta':''}${!f.ok&&i===sig?' activa':''}"><span class="tf-x">×${f.k}</span>${f.ok?`<span class="tabla-valor">${f.v}</span>`:`<input class="tabla-input" data-i="${i}" type="text" inputmode="numeric" autocomplete="off" aria-label="${n} por ${f.k}">`}</div>`; });
      h+='</div></div>';
    }
    box.innerHTML=h; $('tgl').addEventListener('click',()=>{ open=!open; pinta(); });
    box.querySelectorAll('.tabla-input').forEach(inp=>inp.addEventListener('input',()=>{
      const i=+inp.dataset.i, v=inp.value.replace(/\D/g,''); inp.value=v; if(v==='') return;
      if(+v===val[i].v){ val[i].ok=true; pinta(); if(val[i].v===meta&&onHit) onHit(val[i].k); const nx=box.querySelector('.tabla-input[data-i="'+(i+1)+'"]'); if(nx) setTimeout(()=>nx.focus(),30); }
      else if(v.length>=String(val[i].v).length){ inp.classList.add('wrong-flash'); msg('Esa fila de la tabla no está correcta.','mal'); try{mvFallo();}catch(e){} setTimeout(()=>{ inp.value=''; inp.classList.remove('wrong-flash'); },300); }
    }));
  }
  pinta(); return { abrir(){ open=true; pinta(); } };
}
function divWidget(box,total,n,onDone){
  const D=String(total).split('').map(Number); let s=0, cur=D[0]; while(cur<n){ s++; cur=cur*10+D[s]; }
  const nQ=D.length-s, qd=[]; let i=s;
  box.innerHTML=`<div class="divh">Cociente: <span id="dq">${Array(nQ).fill('·').join(' ')}</span></div><div id="tbox"></div><div id="dsteps"></div>`; tablaWidget($('tbox'),n,false,null);
  const cont=$('dsteps'); let row=null;
  function pintaQ(){ $('dq').textContent=Array.from({length:nQ},(_,k)=>qd[k]!==undefined?qd[k]:'·').join(' '); }
  function nuevoPaso(){
    row=document.createElement('div'); row.className='dst';
    row.innerHTML=`<div class="dh">${i===s?'Tomamos':'Bajamos el '+D[i]+': queda'} <b>${cur}</b> : ${n}</div><div class="dcampos"><label>¿Cuántas veces cabe el ${n}?<input class="caja pq" type="text" inputmode="numeric" maxlength="2" autocomplete="off"></label><label>Multiplicamos<input class="caja pp" type="text" inputmode="numeric" maxlength="3" autocomplete="off"></label><label>Restamos<input class="caja pr" type="text" inputmode="numeric" maxlength="3" autocomplete="off"></label></div>`;
    cont.appendChild(row); soloDig(row); row.querySelector('.pq').focus();
  }
  nuevoPaso();
  return function comprobar(){
    const q=row.querySelector('.pq'), p=row.querySelector('.pp'), r=row.querySelector('.pr');
    const eq=Math.floor(cur/n), ep=eq*n, er=cur-ep;
    const val=el=>el.value.trim()===''?null:Number(el.value.trim());
    if(val(q)===null){ msg(`¿Cuántas veces cabe el ${n} en ${cur}? Piensa en la tabla del ${n}.`,'mal'); q.focus(); return false; }
    if(val(q)!==eq){ fallo(val(q)*n>cur?`Te pasaste: ${val(q)} × ${n} es más que ${cur}.`:`Cabe más veces. Prueba con la tabla del ${n}.`,q); q.value=''; q.focus(); return false; }
    if(val(p)===null){ msg(`Multiplica ${eq} × ${n}.`,'mal'); p.focus(); return false; }
    if(val(p)!==ep){ fallo(`Revisa: ${eq} × ${n}.`,p); p.value=''; p.focus(); return false; }
    if(val(r)===null){ msg(`Resta ${cur} − ${ep}.`,'mal'); r.focus(); return false; }
    if(val(r)!==er){ fallo(`Revisa la resta: ${cur} − ${ep}.`,r); r.value=''; r.focus(); return false; }
    qd.push(eq); pintaQ(); row.innerHTML=`<div class="dh ok">${cur} : ${n} → cabe <b>${eq}</b> · ${eq} × ${n} = ${ep} · resto ${er}</div>`; msg('');
    if(i===D.length-1){ onDone(Number(qd.join(''))); return true; }
    i++; cur=er*10+D[i]; nuevoPaso(); return false;
  };
}
/* =====================================================================
   2. CÁLCULO DE PROMEDIO (fácil / difícil)
   ===================================================================== */
const CTX_FACIL=[
 {n:[4,7],a:[4,10],mn:1,mx:18,sp:3,t:(n,L)=>`Camila anotó la temperatura mínima (en °C) de ${n} mañanas de invierno: ${L}. ¿Cuál fue el promedio de la temperatura mínima?`},
 {n:[4,8],a:[3,9],mn:0,mx:15,sp:3,t:(n,L)=>`En un campeonato escolar, el curso de Tomás anotó estos goles en ${n} fechas: ${L}. ¿Cuál es el promedio de goles por fecha?`},
 {n:[7,7],a:[4,9],mn:1,mx:15,sp:3,t:(n,L)=>`Ignacia tomó estos vasos de agua cada día durante una semana: ${L}. ¿Cuántos vasos tomó, en promedio, al día?`},
 {n:[3,6],a:[5,10],mn:2,mx:18,sp:4,t:(n,L)=>`Matías salió ${n} días en bicicleta y recorrió (en km): ${L}. ¿Cuántos kilómetros recorrió, en promedio, por día?`},
 {n:[3,6],a:[4,10],mn:1,mx:18,sp:4,t:(n,L)=>`En ${n} recreos, Valentina ganó estas figuritas: ${L}. ¿Cuántas figuritas ganó, en promedio, por recreo?`},
 {n:[4,6],a:[8,10],mn:6,mx:13,sp:2,t:(n,L)=>`${n} corredores hicieron estos tiempos (en segundos) en una carrera de 50 metros: ${L}. ¿Cuál fue el tiempo promedio?`}
];
const CTX_DIF=[
 {n:[4,6],a:[135,158],mn:120,mx:178,sp:12,t:(n,L)=>`Las estaturas (en cm) de ${n} estudiantes son: ${L}. ¿Cuál es la estatura promedio del grupo?`},
 {n:[3,5],a:[40,190],mn:15,mx:230,sp:35,t:(n,L)=>`${n} amigos ahorraron estas cantidades en dólares (US$): ${L}. ¿Cuántos dólares ahorró cada uno, en promedio?`},
 {n:[7,7],a:[30,90],mn:10,mx:130,sp:18,t:(n,L)=>`Una estudiante leyó esta cantidad de páginas cada día durante una semana: ${L}. ¿Cuántas páginas leyó, en promedio, por día?`},
 {n:[4,6],a:[80,160],mn:40,mx:220,sp:30,t:(n,L)=>`Un museo recibió esta cantidad de visitantes durante ${n} días: ${L}. ¿Cuántos visitantes recibió, en promedio, por día?`},
 {n:[3,5],a:[120,190],mn:70,mx:260,sp:35,t:(n,L)=>`En ${n} partidas de un videojuego se obtuvieron estos puntos: ${L}. ¿Cuál fue el puntaje promedio por partida?`},
 {n:[5,6],a:[100,160],mn:60,mx:230,sp:30,t:(n,L)=>`Una familia gastó esta cantidad de litros de agua durante ${n} días: ${L}. ¿Cuántos litros gastó, en promedio, por día?`}
];
function conmutador(box,etq,build){
  box.innerHTML=`<button type="button" class="tabla-btn tg-btn" id="tg${etq}">▸ ${etq}</button><div class="tg-panel" id="tgP" hidden></div>`;
  const b=box.querySelector('button'), pn=box.querySelector('#tgP'); let hecho=false, listo=false, ini=false;
  function pinta(){ b.textContent=(listo?'✓ ':(pn.hidden?'▸ ':'▾ '))+etq; }
  b.addEventListener('click',()=>{ pn.hidden=!pn.hidden; if(!pn.hidden&&!ini){ ini=true; build(pn); } pinta(); });
  return { listo(){ listo=true; pn.hidden=true; pinta(); } };
}
function calcNuevo(){
  const dif=NIV==='dificil', C=pick(dif?CTX_DIF:CTX_FACIL);
  let n,avg,datos,total;
  for(let t=0;t<40;t++){ n=rnd(C.n[0],C.n[1]); avg=rnd(C.a[0],C.a[1]); total=n*avg; if(dif?(total<=999&&total>=100):(total<=100)) break; }
  if(dif&&(n*avg>999)){ avg=Math.floor(999/n); total=n*avg; }
  datos=genDatos(n,avg,C.mn,C.mx,C.sp); total=datos.reduce((a,b)=>a+b,0);
  const Q={k:'calc',datos,n,avg,total,dif}; window.__q=Q;
  $('chInfo').textContent='Cálculo de promedio · '+(dif?'difícil':'fácil');
  $('enun').textContent=C.t(n,lista(datos));
  $('stage').innerHTML=`<div class="fr-line">${frac(datos.join(' + '),n)}<span class="fr-r"><span class="eq">=</span>${frac(hueco('fnum'),n)}<span class="eq">=</span>${dif?hueco('fres'):'<input id="fres" class="caja fin" type="text" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="?" disabled aria-label="Promedio">'}</span></div><div class="work" id="work"></div>`;
  soloDig($('stage')); $('acc').innerHTML=''; msg('');
  paso1();
  function paso1(){
    $('work').innerHTML='<div class="paso">Paso 1 · Suma todos los datos</div><div id="wbox"></div><div id="w2"></div>';
    const cm=conmutador($('wbox'),'Sumar',pn=>{ sumaWidget(pn,datos,total,()=>{ const f=$('fnum'); f.textContent=total; f.classList.add('lleno'); cm.listo(); $('work').firstChild.style.display='none'; $('wbox').style.display='none'; paso2(); }); });
  }
  function paso2(){
    let fallos=0;
    if(dif){
      $('w2').innerHTML=`<div class="paso">Paso 2 · Divide ${total} en ${n}</div><div id="wbox2"></div>`;
      let chk=null;
      const cd=conmutador($('wbox2'),'Dividir',pn=>{ chk=divWidget(pn,total,n,v=>{ const f=$('fres'); f.textContent=v; f.classList.add('lleno'); exito(`🎉 ¡Correcto! El promedio es ${v}.`); $('acc').innerHTML=''; cd.listo(); bSiguiente(calcNuevo); }); $('acc').innerHTML=btn('bOk','v-verde',I_OK,'Comprobar',true); $('bOk').addEventListener('click',()=>chk()); });
    } else {
      $('w2').innerHTML=`<div class="paso">Paso 2 · Divide ${total} en ${n}. Busca el ${total} en la tabla del ${n}.</div><div id="tbox"></div>`;
      const tb=tablaWidget($('tbox'),n,false,total,k=>msg(`¡El ${total} está en la tabla del ${n}! Mira por cuánto multiplicaste el ${n}.`,'bien'));
      const f=$('fres'); f.disabled=false;
      $('acc').innerHTML=btn('bOk','v-verde',I_OK,'Comprobar',true);
      $('bOk').addEventListener('click',()=>{ const v=f.value.trim(); if(v===''){ msg('Escribe el promedio en el casillero.','mal'); return; }
        if(+v!==avg){ fallos++; fallo(fallos>=2?`Busca el ${total} en la tabla del ${n}: ¿por cuánto multiplicaste el ${n}?`:`Con ${v} da ${v*n}, no ${total}.`,f); f.value=''; if(fallos>=2) tb.abrir(); f.focus(); return; }
        f.disabled=true; exito(`🎉 ¡Correcto! El promedio es ${avg}.`); bSiguiente(calcNuevo); });
    }
  }
}
/* =====================================================================
   3. ¿QUÉ DATO FALTA? (fácil)
   ===================================================================== */
const CTX_FALTA=[
 {n:[4,6],a:[4,10],mn:0,mx:18,t:(n,A,L)=>`En ${n} fechas de un campeonato, un curso anotó en promedio ${A} goles por fecha. En ${n-1} de ellas anotó: ${L}. ¿Cuántos goles anotó en la fecha que falta?`},
 {n:[5,6],a:[4,9],mn:1,mx:15,t:(n,A,L)=>`Ignacia tomó, en promedio, ${A} vasos de agua al día durante ${n} días. En ${n-1} de esos días tomó: ${L}. ¿Cuántos vasos tomó el día que falta?`},
 {n:[4,6],a:[4,10],mn:1,mx:18,t:(n,A,L)=>`Valentina ganó, en promedio, ${A} figuritas por recreo durante ${n} recreos. En ${n-1} recreos ganó: ${L}. ¿Cuántas figuritas ganó en el recreo que falta?`},
 {n:[4,6],a:[5,10],mn:2,mx:18,t:(n,A,L)=>`Matías anduvo ${n} días en bicicleta y recorrió, en promedio, ${A} km por día. En ${n-1} días recorrió (en km): ${L}. ¿Cuántos kilómetros recorrió el día que falta?`},
 {n:[4,6],a:[4,10],mn:1,mx:18,t:(n,A,L)=>`La temperatura mínima promedio de ${n} mañanas fue de ${A} °C. En ${n-1} de ellas fue (en °C): ${L}. ¿Cuál fue la temperatura de la mañana que falta?`}
];
function iniFalta(){ esqueleto(); faltaNuevo(); }
function faltaNuevo(){
  const C=pick(CTX_FALTA); let n,A,datos,x,conocidos,T;
  for(let t=0;t<200;t++){ n=rnd(C.n[0],C.n[1]); A=rnd(C.a[0],C.a[1]); T=n*A; if(T>100) continue; datos=genDatos(n,A,C.mn,C.mx,4); const k=rnd(0,n-1); x=datos[k]; conocidos=datos.filter((_,i)=>i!==k); if(x>=C.mn&&x!==A) break; }
  const S=conocidos.reduce((a,b)=>a+b,0);
  const Q={k:'falta',n,A,T,S,x,conocidos}; window.__q=Q;
  $('chInfo').textContent='¿Qué dato falta?';
  $('enun').textContent=C.t(n,A,lista(conocidos));
  const modelo=conocidos.slice(); modelo.splice(rnd(0,modelo.length),0,'<b class="xx">x</b>');
  $('stage').innerHTML=`<div class="fr-line">${frac(modelo.join(' + '),n)}<span class="eq">=</span><b class="avg">${A}</b></div><div class="work" id="work"></div>`; msg(''); $('acc').innerHTML='';
  paso1();
  function paso1(){
    $('work').innerHTML=`<div class="paso">Paso 1 · ¿Cuánto deben sumar los ${n} datos juntos?</div><div class="fr-line">${frac('<input id="t1" class="caja fin" type="text" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="?" aria-label="Suma total">',n)}<span class="eq">=</span><b class="avg">${A}</b></div><div id="tbox"></div>`;
    soloDig($('work')); let f=0;
    const tb=tablaWidget($('tbox'),n,false,T,k=>msg(`¡El ${T} está en la tabla del ${n}! ¿Por cuánto multiplicaste el ${n}?`,'bien'));
    $('acc').innerHTML=btn('bOk','v-verde',I_OK,'Comprobar',true);
    $('bOk').addEventListener('click',()=>{ const v=$('t1').value.trim(); if(v===''){ msg('Escribe cuánto deben sumar.','mal'); return; }
      if(+v!==T){ f++; fallo(f>=2?`Es ${A} veces ${n}: búscalo en la tabla del ${n}.`:`Si lo dividimos en ${n}, tiene que dar ${A}.`,$('t1')); $('t1').value=''; if(f>=2) tb.abrir(); $('t1').focus(); return; }
      $('t1').disabled=true; msg('¡Bien!','bien'); paso2(); });
  }
  function paso2(){
    $('work').innerHTML=`<div class="resumen">Todos juntos deben sumar: <b>${T}</b></div><div class="paso">Paso 2 · Suma los datos que ya conocemos</div><div id="wbox"></div>`; $('acc').innerHTML='';
    const cm=conmutador($('wbox'),'Sumar',pn=>{ sumaWidget(pn,conocidos,S,()=>{ msg('¡Bien!','bien'); cm.listo(); paso3(); }); });
  }
  function paso3(){
    $('work').innerHTML=`<div class="resumen">Deben sumar <b>${T}</b> · Los conocidos suman <b>${S}</b></div><div class="paso">Paso 3 · ¿Cuánto falta para llegar al total?</div><div class="tinv"><b>${T}</b> − <b>${S}</b> = <input class="caja" id="t3" type="text" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="?" aria-label="Dato que falta"></div>`;
    soloDig($('work')); $('t3').focus();
    $('acc').innerHTML=btn('bOk','v-verde',I_OK,'Comprobar',true);
    $('bOk').addEventListener('click',()=>{ const v=$('t3').value.trim(); if(v===''){ msg('Escribe un número.','mal'); return; }
      if(+v!==x){ fallo(`Revisa la resta: ${T} − ${S}.`,$('t3')); $('t3').value=''; $('t3').focus(); return; }
      $('t3').disabled=true; exito(`🎉 ¡Correcto! El dato que falta es ${x}.`); bSiguiente(faltaNuevo); });
  }
}
