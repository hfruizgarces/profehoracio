<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Laboratorio de Números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS DE DISEÑO
   ========================================================= */
:root{
  color-scheme: dark;
  --bg-1:#1e1147;
  --bg-2:#3b1785;
  --bg-3:#5b21b6;
  --surface:rgba(255,255,255,.07);
  --surface-strong:rgba(255,255,255,.12);
  --border-soft:rgba(255,255,255,.14);

  --primary:#34d399;
  --primary-dark:#0f9d70;
  --accent:#fbbf24;
  --accent-soft:#fde68a;
  --pink:#f472b6;
  --blue:#38bdf8;
  --error:#fb7185;
  --error-soft:#3b0f1f;

  --text:#f6f3ff;
  --text-dim:#c9bdf0;
  --text-faint:#8f7fc4;

  --r-lg:22px;
  --r-md:16px;
  --r-sm:10px;

  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;

  --shadow-1: 0 10px 30px rgba(0,0,0,.35);
  --tap-min: 48px;
}

*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; width:100%; overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
h1,h2,h3{font-family:var(--font-display); margin:0;}
button, input{ -webkit-user-select:none; user-select:none; }
input{font-family:inherit;}

.hidden{display:none !important;}
.visually-hidden{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* Foco visible para accesibilidad con teclado */
:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
  border-radius:6px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* =========================================================
   LAYOUT GENERAL
   ========================================================= */
#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding: clamp(10px, 2.5vw, 24px);
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:6px 56px 14px 2px;
  flex-wrap:wrap;
}
.app-header .side{
  display:flex; align-items:center; gap:6px;
  flex:1 1 auto;
  min-width:70px;
}
.app-header .side.right{ justify-content:flex-end; }

.icon-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--surface);
  border:1px solid var(--border-soft);
  color:var(--text);
  padding:9px 12px;
  border-radius:999px;
  font-weight:700;
  font-size:clamp(.75rem, 2vw, .9rem);
  cursor:pointer;
  min-height:var(--tap-min);
  transition: background .15s, transform .1s;
  white-space:nowrap;
}
.icon-btn:hover{ background:var(--surface-strong); }
.icon-btn:active{ transform:scale(.96); }

.brand{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.2vw, 1.6rem);
  flex:0 1 auto;
  white-space:nowrap;
}
.brand .plus{
  display:inline-flex; align-items:center; justify-content:center;
  width:1.5em; height:1.5em;
  background:linear-gradient(135deg, var(--primary), var(--blue));
  border-radius:10px;
  color:#0b1a12;
  font-size:1em;
}

main{ flex:1; display:flex; flex-direction:column; }

.screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  animation: fadeSlideIn .35s ease both;
}
@keyframes fadeSlideIn{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}

.card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(16px, 4vw, 32px);
  box-shadow:var(--shadow-1);
  backdrop-filter: blur(6px);
}

/* =========================================================
   PANTALLA INICIAL
   ========================================================= */
.home-title{
  text-align:center;
  font-size:clamp(1.4rem, 5vw, 2.2rem);
  font-weight:800;
  margin-bottom:6px;
}
.home-sub{
  text-align:center;
  color:var(--text-dim);
  font-size:clamp(.9rem, 2.4vw, 1.05rem);
  margin:0 auto clamp(18px,4vw,28px);
  max-width:46ch;
}
footer.credits{ text-align:center; color: var(--text-faint); font-weight:700; font-size:.78rem; padding:20px 10px 4px; }
.level-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:clamp(10px, 2.5vw, 16px);
  width:100%;
}
@media (max-width:420px){
  .level-grid{ grid-template-columns:1fr; }
}
.level-btn{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:clamp(16px,4vw,22px) 10px;
  border-radius:var(--r-md);
  border:1px solid var(--border-soft);
  color:var(--text);
  cursor:pointer;
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1rem, 2.6vw, 1.15rem);
  min-height:96px;
  transition:transform .15s, box-shadow .15s;
}
.level-btn:hover{ transform:translateY(-3px); }
.level-btn:active{ transform:scale(.97); }
.level-btn .emoji{ font-size:clamp(1.6rem, 5vw, 2.1rem); }
.level-btn.easy{ background:linear-gradient(140deg,#0f9d70,#34d399); }
.level-btn.mid{ background:linear-gradient(140deg,#1d4ed8,#38bdf8); }
.level-btn.hard{ background:linear-gradient(140deg,#b91c66,#f472b6); }
.level-btn.custom{ background:linear-gradient(140deg,#92400e,#fbbf24); color:#fff; }

/* =========================================================
   PANTALLA "CREA TU EJERCICIO"
   ========================================================= */
.form-title{ font-size:clamp(1.2rem,3.6vw,1.5rem); font-weight:800; text-align:center; margin-bottom:4px; }
.form-sub{ color:var(--text-dim); text-align:center; margin-bottom:18px; font-size:.95rem; }

.addend-row{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:12px;
}
.addend-index{
  width:26px; text-align:right; color:var(--text-faint); font-weight:700; flex:0 0 auto;
}
.addend-input{
  flex:0 1 180px;
  min-width:0;
  background:var(--surface-strong);
  border:2px solid var(--border-soft);
  border-radius:var(--r-sm);
  color:var(--text);
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1.1rem, 3.2vw, 1.35rem);
  text-align:center;
  padding:12px 10px;
  min-height:var(--tap-min);
  letter-spacing:1px;
}
.addend-input::placeholder{ color:var(--text-faint); font-family:var(--font-body); font-weight:600; font-size:.85em;}
.addend-remove{
  flex:0 0 auto;
  width:var(--tap-min); height:var(--tap-min);
  border-radius:50%;
  background:rgba(251,113,133,.18);
  border:1px solid var(--error);
  color:var(--error);
  font-size:1.2rem;
  font-weight:800;
  cursor:pointer;
}
.dashed-btn{
  width:100%;
  max-width:220px;
  margin-left:auto; margin-right:auto;
  display:block;
  padding:12px;
  border-radius:var(--r-sm);
  border:2px dashed var(--border-soft);
  background:transparent;
  color:var(--text-dim);
  font-weight:700;
  cursor:pointer;
  min-height:var(--tap-min);
  margin-bottom:18px;
}
.dashed-btn:hover{ border-color:var(--text-dim); color:var(--text); }
.dashed-btn:disabled{ opacity:.4; cursor:not-allowed; }

.primary-btn{
  width:100%;
  padding:14px;
  border-radius:var(--r-md);
  border:none;
  background:linear-gradient(135deg, var(--primary), #10b981);
  color:#062b1c;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1rem, 2.8vw, 1.15rem);
  cursor:pointer;
  min-height:52px;
  box-shadow:0 6px 18px rgba(52,211,153,.35);
  transition:transform .12s, box-shadow .12s;
}
.primary-btn:hover{ transform:translateY(-2px); }
.primary-btn:active{ transform:scale(.98); }
.primary-btn:disabled{
  background:#4b4b5a; color:#9a9aab; box-shadow:none; cursor:not-allowed; transform:none;
}
.form-error{
  color:var(--error);
  text-align:center;
  font-weight:700;
  font-size:.9rem;
  min-height:1.4em;
  margin-bottom:10px;
}

/* =========================================================
   PANTALLA DE EJERCICIO
   ========================================================= */
.hint-box{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-md);
  padding:12px 14px;
  margin-bottom:16px;
  width:100%;
  font-size:clamp(.82rem, 2.1vw, .95rem);
  line-height:1.45;
}
.hint-box .bulb{ font-size:1.2em; flex:0 0 auto; }
.hint-box b{ color:var(--accent); }
.hint-box .ok{ color:var(--primary); }

/* =========================================================
   MODAL (llevada / totales de columna)
   ========================================================= */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(10,4,30,.6);
  backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center;
  padding:16px;
  z-index:700;
}
.modal-box{
  width:100%; max-width:400px;
  background:linear-gradient(160deg, #2c1468, #4c1d95);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(18px,4vw,26px);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.modal-close-x{
  position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
  border:1px solid var(--border-soft); background:var(--surface); color:var(--text);
  cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; z-index:5;
}
@keyframes popIn{
  from{ transform:scale(.85); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}
@keyframes monedaFlota{
  0%{ transform:translateY(0); opacity:0; }
  15%{ opacity:1; }
  100%{ transform:translateY(-24px); opacity:0; }
}
.modal-eyebrow{
  font-size:.78rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent); margin-bottom:6px; text-align:center;
}
.modal-title{
  font-size:clamp(1.05rem, 3.2vw, 1.25rem);
  text-align:center;
  margin-bottom:14px;
  line-height:1.4;
}
.modal-title b{ color:var(--accent-soft); }
.modal-fields{
  display:flex; gap:12px; justify-content:center; margin-bottom:14px; flex-wrap:wrap;
}
.modal-field{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.modal-field label{ font-size:.8rem; color:var(--text-dim); font-weight:700; text-align:center; max-width:11em; }
.modal-field input{
  width:80px;
  text-align:center;
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.3rem;
  padding:10px 6px;
  border-radius:var(--r-sm);
  border:2px solid var(--border-soft);
  background:var(--surface-strong);
  color:var(--text);
  min-height:var(--tap-min);
}
.modal-feedback{
  text-align:center; min-height:1.6em; font-weight:700; margin-bottom:10px; font-size:.9rem;
}
.modal-feedback.err{ color:var(--error); }
.modal-feedback.ok{ color:var(--primary); }
.modal-actions{ display:flex; gap:10px; }
.modal-actions button{ flex:1; }
.secondary-btn{
  padding:12px; border-radius:var(--r-md); border:1px solid var(--border-soft);
  background:transparent; color:var(--text-dim); font-weight:700; cursor:pointer;
  min-height:48px;
}

/* =========================================================
   PANTALLA DE RESULTADO / CELEBRACIÓN
   ========================================================= */
.result-hero{
  font-size:clamp(2.2rem, 9vw, 3.4rem);
  text-align:center;
}
.result-title{
  font-size:clamp(1.3rem, 4vw, 1.8rem);
  text-align:center;
  margin:8px 0 4px;
}
.result-eq{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.6vw, 1.6rem);
  text-align:center;
  color:var(--primary);
  margin-bottom:20px;
  word-break:break-word;
}
.result-actions{
  display:flex; gap:12px; width:100%; flex-wrap:wrap;
}
.result-actions button{ flex:1 1 160px; }

.confetti-piece{
  position:fixed; top:-10px; z-index:800;
  border-radius:2px;
  animation: fall linear forwards;
  pointer-events:none;
}
@keyframes fall{
  to{ transform:translateY(105vh) rotate(360deg); opacity:.9; }
}

/* =========================================================
   BARRA DE PROGRESO DE COLUMNAS
   ========================================================= */
.progress-track{
  display:flex; gap:6px; width:100%; margin-bottom:16px;
}
.progress-seg{
  flex:1; height:6px; border-radius:4px; background:rgba(255,255,255,.12);
  overflow:hidden;
}
.progress-seg .fill{
  height:100%; width:0%; background:linear-gradient(90deg, var(--primary), var(--blue));
  transition:width .4s ease;
}

/* utilidad de botón de sonido */
.sound-icon{ font-size:1.1em; }

/* =========================================================
   MULTIPLICACIÓN ÁRABE — retícula (propio del recurso)
   ========================================================= */
:root{
  --ink:var(--text); --ink-soft:var(--text-dim); --ink-faint:var(--text-faint);
  --brass:#fbbf24; --brass-dark:#f59e0b; --success:#34d399; --success-bg:rgba(52,211,153,.15);
  --error-bg:rgba(251,113,133,.15); --radius-s:10px; --radius-m:16px; --radius-l:22px;
  --font-num:var(--font-display); --font-ui:var(--font-body);
  --cell-size:calc(var(--cell-base,56px) * var(--f,1));
}
#vista{ width:100%; display:flex; flex-direction:column; }
.hero{ text-align:center; }
.problema-pill{
  align-self:center; font-family:var(--font-num); font-weight:800; letter-spacing:.04em;
  font-size:calc(clamp(1.3rem,4.4vw,1.9rem) * var(--f,1)); color:#fff;
  background:linear-gradient(150deg, rgba(44,20,104,.75), rgba(30,17,71,.75));
  box-shadow:inset 0 0 0 1px rgba(196,181,253,.35); border-radius:16px;
  padding:calc(6px * var(--f,1)) calc(22px * var(--f,1)); margin:0 0 calc(12px * var(--f,1));
}
.lattice-card{ width:100%; display:flex; flex-direction:column; align-items:center; padding:calc(4px * var(--f,1)) 0 0; }
.lattice-row{ display:flex; align-items:flex-start; gap:6px; }
.lattice-left{ display:flex; flex-direction:column; }
.top-digits, .side-digits{ display:flex; }
.top-digits{ justify-content:flex-end; margin-bottom:5px; gap:4px; }
.side-digits{ flex-direction:column; margin-top:calc(var(--cell-size) * .62 + 5px); gap:4px; margin-left:4px; }
.digit-box{
  width:var(--cell-size); height:calc(var(--cell-size) * .62); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .46); color:#fff;
  background:linear-gradient(150deg, rgba(124,58,237,.45), rgba(44,20,104,.7)); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.45);
  border:none; border-radius:12px; text-shadow:0 2px 6px rgba(0,0,0,.45);
}
.side-digits .digit-box{ width:calc(var(--cell-size) * .72); height:var(--cell-size); }
.grid-boxes{ display:grid; gap:4px; }
.lcell{
  width:var(--cell-size); height:var(--cell-size); position:relative; overflow:hidden; border-radius:10px;
  border:2px solid rgba(196,181,253,.75); background:rgba(30,17,71,.55); box-shadow:0 0 14px rgba(124,58,237,.25);
}
.lcell .tri{ position:absolute; inset:0; transition:background-color .35s ease, opacity .35s ease; }
.tri-tens{ clip-path:polygon(0 0,100% 0,0 100%); background:rgba(255,255,255,.05); }
.tri-ones{ clip-path:polygon(100% 0,100% 100%,0 100%); background:rgba(255,255,255,.1); }
.tri.diag-dim{ opacity:.35; } .tri.diag-active{ opacity:1; }
.cell-num{
  position:absolute; z-index:2; font-family:var(--font-num); font-weight:800; line-height:1; pointer-events:none;
  font-size:calc(var(--cell-size) * .36); color:#fff; text-shadow:0 2px 5px rgba(0,0,0,.5);
}
.cell-num.tens-pos{ top:12%; left:12%; } .cell-num.ones-pos{ bottom:10%; right:12%; }
.lcell input.cell-input{
  position:absolute; z-index:2; width:42%; height:42%; border:none; border-radius:7px; padding:0; outline:none;
  background:rgba(8,3,26,.55); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.5); text-align:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .32); color:#fff; user-select:text; -webkit-user-select:text;
}
.lcell input.cell-input.tens-pos{ top:6%; left:6%; } .lcell input.cell-input.ones-pos{ bottom:6%; right:6%; }
.lcell input.cell-input:focus{ background:rgba(124,58,237,.5); box-shadow:0 0 0 2.5px var(--brass), 0 0 14px rgba(251,191,36,.6); }
.lcell input.cell-input.wrong-flash{ background:var(--error-bg); box-shadow:0 0 0 2.5px var(--error); }

.diag-section{ margin-top:calc(22px * var(--f,1)); width:100%; display:flex; flex-direction:column; align-items:center; }
.diag-section h3{ font-size:calc(.86rem * var(--f,1)); font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin-bottom:calc(30px * var(--f,1)); text-align:center; }
.diag-row{ display:flex; gap:calc(8px * var(--f,1)); align-items:flex-end; flex-wrap:wrap; justify-content:center; }
.diag-box-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; }
.carry-badge{
  position:absolute; top:calc(-24px * var(--f,1)); left:50%; transform:translateX(-50%) scale(0); opacity:0;
  font-family:var(--font-num); font-weight:800; font-size:.8rem; color:#3b2405; background:var(--brass);
  border-radius:999px; padding:2px 9px; white-space:nowrap; box-shadow:0 0 10px rgba(251,191,36,.7);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
}
.carry-badge.show{ transform:translateX(-50%) scale(1); opacity:1; }
.diag-box{
  width:calc(clamp(48px,11vw,64px) * var(--f,1)); min-height:calc(clamp(48px,11vw,64px) * var(--f,1));
  border-radius:14px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1));
  border:2.5px solid var(--border-soft); background:rgba(8,3,26,.4); color:var(--text-faint); transition:all .25s ease;
}
.diag-box.pending{ opacity:.55; }
.diag-box input{ width:100%; height:100%; border:none; background:transparent; text-align:center; font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1)); color:#fff; outline:none; user-select:text; -webkit-user-select:text; }
.diag-box.wrong{ animation:shake .32s ease; }
.carry-fly{
  position:fixed; z-index:3000; font-family:var(--font-num); font-weight:800; font-size:.95rem; color:#3b2405;
  background:var(--brass); border-radius:999px; padding:4px 10px; pointer-events:none;
  transition:transform .55s cubic-bezier(.3,.6,.4,1), opacity .55s ease;
}
.final-banner{
  margin-top:calc(16px * var(--f,1)); text-align:center; background:var(--success-bg); border:2px solid var(--success);
  color:var(--success); border-radius:16px; padding:calc(10px * var(--f,1)) 20px; font-weight:800;
  font-family:var(--font-num); font-size:calc(clamp(1.1rem,3.8vw,1.5rem) * var(--f,1));
}
.arabe-final{ width:100%; display:flex; flex-direction:column; align-items:center; }
.arabe-final .mv-fila-chip{ margin-top:calc(8px * var(--f,1)); }
.arabe-final .result-actions{ margin-top:calc(14px * var(--f,1)); }
.setup-box{ width:100%; max-width:480px; margin:0 auto; text-align:center; }
.setup-box label{ display:block; font-weight:700; font-size:.95rem; color:var(--text-dim); margin-bottom:16px; }
.factor-input-row{ display:flex; align-items:center; justify-content:center; gap:clamp(10px,3vw,18px); }
.factor-input{
  width:100%; max-width:150px; font-family:var(--font-num); font-weight:800; font-size:clamp(1.6rem,7vw,2.2rem);

:root{
  color-scheme: dark;
  --bg-1:#1e1147; --bg-2:#3b1785; --bg-3:#5b21b6;
  --primary:#34d399; --accent:#fbbf24; --error:#fb7185; --blue:#38bdf8; --pink:#f472b6;
  --text:#f6f3ff; --text-dim:#c9bdf0; --text-faint:#8f7fc4;
  --surface:rgba(255,255,255,.07); --surface-strong:rgba(255,255,255,.12); --surface-soft:rgba(255,255,255,.05);
  --border-soft:rgba(255,255,255,.16);
  --shadow:0 14px 34px rgba(0,0,0,0.4);
  --radius:20px; --radius-sm:12px;
  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;
  --transition: all .2s cubic-bezier(.4,0,.2,1);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

button{ font-family:inherit; }

h1,h2,h3{ font-family:var(--font-display); margin:0; }

.btn{
  font-family:var(--font-display); font-weight:700; font-size:13px; cursor:pointer; transition:var(--transition);
  background:var(--surface); border:1px solid var(--border-soft); color:var(--text); padding:7px 14px; border-radius:999px;
}

.btn:hover:not(:disabled){ background:var(--surface-strong); }

.btn:disabled{ opacity:.4; cursor:not-allowed; }

.btn.verde{ background:linear-gradient(140deg,#0f9d70,var(--primary)); color:#04281c; border-color:transparent; font-weight:800; font-size:14px; padding:8px 18px; }

.btn.siguiente{ background:linear-gradient(140deg,#f59e0b,var(--accent)); color:#3d1f00; border-color:transparent; font-weight:800; font-size:14px; padding:8px 18px; }

.btn.azul{ background:linear-gradient(140deg,#1d4ed8,var(--blue)); color:#06213a; border-color:transparent; font-weight:800; font-size:14px; padding:8px 18px; }

.btn.corte{ padding:5px 11px; min-width:34px; }

.btn.sel, .btn.activo{ background:rgba(56,189,248,.22); border-color:var(--blue); color:var(--blue); }


/* ---- Pantalla de juego ---- */
.topbar{ display:flex; align-items:center; gap:8px; flex:none;  }

.topbar .chip{ white-space:nowrap; font-family:var(--font-display); font-weight:800; font-size:13px; color:var(--accent); background:var(--surface); border:1px solid var(--border-soft); border-radius:999px; padding:5px 12px; }

.topbar .sp{ flex:1; }

.pregunta{ flex:none; text-align:center; font-family:var(--font-display); font-weight:800; line-height:1.1; padding:5px 8px 7px; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius-sm); margin-top:8px; }

.pregunta .q{ font-size:1.15rem; color:var(--text-dim); }

.pregunta .kw{ font-size:2rem; letter-spacing:.8px; color:#fbbf24; text-shadow:0 2px 14px rgba(255,255,255,.18); }

#stage{ position:relative; flex:1 1 0; min-height:150px; margin:8px 0; border-radius:var(--radius); overflow:hidden;
  background:radial-gradient(circle at 50% 40%, rgba(255,255,255,.10), rgba(255,255,255,.02) 70%); border:1px solid var(--border-soft); }

#diag{ position:absolute; left:0; right:0; top:0; bottom:var(--cp, 0px); }

#svgDiag{ position:absolute; inset:0; width:100%; height:100%; display:block; }

.etq{ cursor:pointer; }
 .etq rect{ transition:var(--transition); }
 .etq:hover rect{ fill:rgba(56,189,248,.35); }

.panel-m{ flex:none; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:8px 10px; backdrop-filter:blur(6px); display:flex; flex-direction:column; gap:7px; }

.msg{ min-height:2.6em; text-align:center; font-weight:700; font-size:.86rem; color:var(--text-dim); line-height:1.25; display:flex; align-items:center; justify-content:center; }

.msg b{ color:var(--text); }
 .msg.mal{ color:var(--error); }
 .msg.bien{ color:var(--primary); }
 .msg.pista{ color:#fbbf24; }

.fila{ display:flex; align-items:center; justify-content:center; gap:8px; }

.fila .fr{ font-family:var(--font-display); font-weight:800; font-size:1.2rem; color:var(--text-dim); }

.fila input{ width:84px; padding:6px 0; text-align:center; border-radius:var(--radius-sm); border:2px solid var(--border-soft); background:var(--surface-strong); color:var(--text); font-family:var(--font-display); font-weight:800; font-size:1.3rem; outline:none; }

.fila input:focus{ border-color:var(--blue); }
 .fila input:disabled{ opacity:.55; }

.fila .btn{ white-space:nowrap; padding:8px 16px; }

.fila.sec .btn{ font-size:12.5px; padding:6px 11px; }

/* Laboratorio de cálculo */
#calc{ position:absolute; left:6px; right:6px; bottom:6px; padding:8px; border-radius:var(--radius-sm); background:rgba(30,17,71,.94); border:1px solid var(--border-soft); display:none; flex-direction:column; gap:6px; z-index:3; }

#calc.abierta{ display:flex; }

.calc-fila{ display:flex; align-items:center; justify-content:center; gap:6px; }

.calc-fila input{ width:64px; padding:5px 0; text-align:center; border-radius:10px; border:2px solid var(--border-soft); background:var(--surface-strong); color:var(--text); font-family:var(--font-display); font-weight:800; font-size:1.1rem; outline:none; min-width:0; }

.calc-fila input:focus, .calc-fila input.activo, .fila input.activo{ border-color:var(--blue); }

.ops{ display:flex; gap:3px; }
 .ops button{ width:34px; height:34px; border-radius:10px; border:2px solid var(--border-soft); background:var(--surface); color:var(--text); font-family:var(--font-display); font-weight:800; font-size:1.1rem; cursor:pointer; }

.ops button.sel{ border-color:var(--accent); background:rgba(251,191,36,.2); color:var(--accent); }

.calc-fila .btn{ padding:7px 14px; font-size:1.05rem; }

.calc-hist{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; max-height:58px; overflow-y:auto; min-height:22px; align-content:flex-start; }

.calc-hist .vacio{ font-size:.74rem; color:var(--text-faint); font-weight:700; align-self:center; }

.chip-r{ font-family:var(--font-display); font-weight:700; font-size:.8rem; background:rgba(56,189,248,.15); border:1px solid rgba(56,189,248,.5); color:var(--text); border-radius:999px; padding:2px 10px; cursor:pointer; }

.chip-r b{ color:var(--accent); }

@media (max-height:660px){ .msg{ font-size:.78rem; min-height:2.3em; } .panel-m{ padding:6px 8px; gap:5px; } .pregunta .kw{ font-size:1.6rem; } .mod-card{ height:66px; } }


.mod-card .nivel-ico{ font-family:var(--font-display); font-weight:800; font-size:1.4rem; color:var(--accent); }

.pregunta .kw.y{ color:#f472b6; }

.btn.corte{ white-space:nowrap; }

@media (max-width:400px){ .topbar{ gap:5px; } .topbar .chip{ padding:5px 8px; font-size:12px; } .btn.corte{ padding:5px 9px; font-size:12px; } }

.chip-r{ touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab; }

#notas{ position:absolute; inset:0; pointer-events:none; z-index:2; }

.nota-r{ position:absolute; transform:translate(-50%,-50%); pointer-events:auto; touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab; white-space:nowrap;
  font-family:var(--font-display); font-weight:800; font-size:1.15rem; line-height:1; padding:7px 13px; border-radius:12px; background:rgba(251,191,36,.93); color:#2a1500; border:2px dashed #fff8; box-shadow:0 6px 16px rgba(0,0,0,.4); }

.nota-r.fantasma{ position:fixed; z-index:50; pointer-events:none; transform:translate(-50%,-50%) scale(1.12); background:#fbbf24; }

.chip-r.fantasma{ display:none; }

.chip-r.fantasma_old{ white-space:nowrap; position:fixed; z-index:50; transform:translate(-50%,-50%); pointer-events:none; background:#fbbf24; color:#2a1500; border-color:#fbbf24; box-shadow:0 8px 20px rgba(0,0,0,.5); font-size:1rem; padding:5px 14px; }

.chip-r.fantasma b{ color:#2a1500; }

body.arrastrando{ cursor:grabbing; }

#svgDiag g.objetivo{ filter:drop-shadow(0 0 8px #fbbf24); }
 #svgDiag g.objetivo rect{ stroke:#fff; stroke-width:3; }

.fin-card{ margin:auto; max-width:380px; width:100%; background:#2a1566; border:1px solid var(--border-soft); border-radius:var(--radius); padding:18px; text-align:center; box-shadow:var(--shadow); }

      if(!r.lista.length){ cuerpo.innerHTML = '<p class="mvrk-vacio">Aún nadie tiene récord. ¡Sé el primero!</p>'; return; }
      var med = ['🥇','🥈','🥉'];

    }
    pintar(actual);
  };
})();

<script>
window.mvExito = function(){

/* =====================================================================
   1. MOTOR: escenas geométricas, generadores, validación y retroalimentación
   (no toca el DOM; el dibujo se calcula a partir de las medidas reales)
   ===================================================================== */
const RAD = Math.PI / 180;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const elegir = a => a[Math.floor(Math.random() * a.length)];
const barajar = a => { for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]], add = (a, b) => [a[0] + b[0], a[1] + b[1]], mul = (a, k) => [a[0] * k, a[1] * k];
const lon = v => Math.hypot(v[0], v[1]);
const unit = v => { const l = lon(v) || 1; return [v[0] / l, v[1] / l]; };
const dirDeg = t => [Math.cos(t * RAD), Math.sin(t * RAD)];

/* ---- Triángulo exacto a partir de sus ángulos (vértice i tiene angs[i]) ---- */
function triGeom(angs){
  const [A, B, C] = angs.map(v => v * RAD), b = Math.sin(B) / Math.sin(C);
  return [[0, 0], [1, 0], [b * Math.cos(A), -b * Math.sin(A)]];
}
/* ---- Escena: puntos con nombre, segmentos, ángulos (por 3 puntos), marcas y etiquetas ---- */
const nuevaEsc = () => ({ pts:{}, segs:[], poly:null, angs:[], ticks:[], etqs:[] });
const NV = ['A', 'B', 'C', 'D'];
function escTri(angs){ const P = triGeom(angs), e = nuevaEsc(); e.pts = { A:P[0], B:P[1], C:P[2] }; e.segs = [['A', 'B'], ['B', 'C'], ['C', 'A']]; e.poly = ['A', 'B', 'C']; return e; }
function angTri(e, i, tipo, val){ e.angs.push({ id:'a' + i, v:NV[i], p1:NV[(i + 1) % 3], p2:NV[(i + 2) % 3], tipo, val, pref:['out', 'in'] }); }
function marcaRecta(e, id, v, p1, p2){ e.angs.push({ id, v, p1, p2, tipo:'sq', val:90, pref:[] }); }
/* ángulo exterior en el vértice i: se prolonga el lado que viene del vecino `lado` (1 o 2) */
function exterior(e, i, lado, tipo, val, id){
  const V = NV[i], U = NV[(i + lado) % 3], W = NV[(i + 3 - lado) % 3], pu = e.pts[U], pv = e.pts[V], nombre = 'E' + i;
  e.pts[nombre] = add(pv, mul(sub(pv, pu), .5)); e.segs.push([V, nombre]);
  e.angs.push({ id:id || 'ext' + i, v:V, p1:nombre, p2:W, tipo, val, pref:['in', 'out'] });
}
function orientar(e, rotDeg, espejo){
  const t = rotDeg * RAD, c = Math.cos(t), s = Math.sin(t);
  Object.keys(e.pts).forEach(n => { let [x, y] = e.pts[n]; if(espejo) x = -x; e.pts[n] = [x * c - y * s, x * s + y * c]; });
}
const medir = (e, a) => { const v = e.pts[a.v], u = unit(sub(e.pts[a.p1], v)), w = unit(sub(e.pts[a.p2], v)); return Math.acos(Math.max(-1, Math.min(1, u[0] * w[0] + u[1] * w[1]))) / RAD; };
/* dos rectas que se cruzan en P=(0,0): rayos R0..R3, regiones r0..r3 (r0 y r2 miden α; r1 y r3 miden 180−α) */
function escCruce(alfa, largo){
  const e = nuevaEsc(), d1 = [1, 0], d2 = dirDeg(alfa), L = largo || 1.1;
  e.pts = { P:[0, 0], R0:mul(d1, L), R1:mul(d2, L), R2:mul(d1, -L), R3:mul(d2, -L) };
  ['R0', 'R1', 'R2', 'R3'].forEach(r => e.segs.push(['P', r]));
  return e;
}
const regionCruce = (e, k, tipo, val, id) => e.angs.push({ id:id || 'r' + k, v:'P', p1:'R' + k, p2:'R' + ((k + 1) % 4), tipo, val, pref:['in'] });
/* rayos desde O con direcciones (grados) dadas; los extremos se llaman R0, R1, ... */
function escRayos(dirs, largo){
  const e = nuevaEsc(); e.pts.O = [0, 0]; dirs.forEach((d, i) => { e.pts['R' + i] = mul(dirDeg(d), largo || 1.1); e.segs.push(['O', 'R' + i]); }); return e;
}
const regionRayos = (e, i, j, tipo, val, id) => e.angs.push({ id, v:'O', p1:'R' + i, p2:'R' + j, tipo, val, pref:['in'] });
/* cuadrilátero convexo con ángulos interiores dados (suman 360) */
function escCuad(angs){
  for(let g = 0; g < 400; g++){
    const th = [0]; for(let i = 1; i < 4; i++) th.push(th[i - 1] + (180 - angs[i]));
    const d = th.map(dirDeg), l0 = .8 + Math.random() * .9, l1 = .8 + Math.random() * .9, bx = -(l0 * d[0][0] + l1 * d[1][0]), by = -(l0 * d[0][1] + l1 * d[1][1]);
    const det = d[2][0] * d[3][1] - d[2][1] * d[3][0]; if(Math.abs(det) < 1e-6) continue;
    const l2 = (bx * d[3][1] - by * d[3][0]) / det, l3 = (d[2][0] * by - d[2][1] * bx) / det;
    if(l2 < .5 || l3 < .5) continue;
    const L = [l0, l1, l2, l3], P = [[0, 0]]; for(let i = 0; i < 3; i++) P.push(add(P[i], mul(d[i], L[i])));
    const e = nuevaEsc(); e.pts = { A:P[0], B:P[1], C:P[2], D:P[3] }; e.segs = [['A', 'B'], ['B', 'C'], ['C', 'D'], ['D', 'A']]; e.poly = ['A', 'B', 'C', 'D']; return e;
  }
  return null;
}
const angCuad = (e, i, tipo, val) => e.angs.push({ id:'a' + i, v:NV[i], p1:NV[(i + 1) % 4], p2:NV[(i + 3) % 4], tipo, val, pref:['out', 'in'] });

/* ---- Operaciones registradas por el alumno ---- */
const O = (op, a, b, sig) => ({ op, a, b, res:op === '+' ? a + b : op === '-' ? a - b : a / b, sig:sig || '' });
const opTxt = o => `${o.a} ${o.op === '-' ? '−' : o.op === '/' ? ':' : '+'} ${o.b} = ${o.res}`;
const coincide = (h, o) => h.op === o.op && ((h.a === o.a && h.b === o.b) || (o.op === '+' && h.a === o.b && h.b === o.a));
const orient = (nivel, base) => base === 'eje' ? { rot:elegir([0, 90, 180, 270]), espejo:Math.random() < .5 } : base === 'base' ? { rot:Math.random() < .5 ? 0 : rnd(-25, 25), espejo:Math.random() < .5 } : { rot:rnd(0, 359), espejo:Math.random() < .5 };
const ordenAleatorio = a => barajar(a.slice());

/* ---- Fábrica de pasos ---- */
function paso(id, etq, resp, ops, pistas, extra){ return Object.assign({ obj:id, etq, resp, ops, pistas, conf:[], expl:'', max:180 }, extra || {}); }
/* Solo se pregunta por X: si el diseño tiene un paso intermedio (Y), se fusiona en una única pregunta. Y queda dibujado como ayuda. */
function fusionar(pasos){
  if(pasos.length < 2) return pasos;
  const p1 = pasos[0], pn = pasos[pasos.length - 1], conf = []; pasos.forEach(p => p.conf.forEach(c => { if(!conf.some(x => x.val === c.val)) conf.push(c); }));
  return [ Object.assign({}, pn, { ops:pasos.flatMap(p => p.ops), pistas:[ p1.pistas[0], p1.pistas[2] || p1.pistas[1], pn.pistas.slice(1).join(' ') ], conf, expl:pasos.map(p => p.expl).filter(Boolean).join(' ') }) ];
}
function ejercicio(mundo, nivel, tipo, clave, esc, pasos, extra){ pasos = fusionar(pasos); return Object.assign({ mundo, nivel, tipo, clave, escena:esc, pasos, guiado:esc.angs.some(a => a.tipo === 'y') }, extra || {}); }
function irrelevantes(e, prob){ /* sin datos de longitud: eran números al azar que no tenían relación con el dibujo */ }
const PIS_SUMA = (a, b, m) => [`Los ángulos interiores de ${m === 360 ? 'un cuadrilátero' : 'un triángulo'} suman ${m}°.`, `Junta primero los ángulos que ya conoces: ${a}. Puedes usar 🧮 Cálculos.`, `Mira cuánto le falta a esa suma para llegar a ${m}°.`];

/* =================== MUNDO 1 · El ángulo que falta =================== */
function exM1(){
  for(let g = 0; g < 300; g++){
    const a = rnd(25, 110), b = rnd(25, 110), c = 180 - a - b, t = [a, b, c];
    if(c < 25 || t.includes(90) || new Set(t).size < 3) continue;
    const pos = barajar([0, 1, 2]), angs = [0, 0, 0]; t.forEach((v, k) => { angs[pos[k]] = v; });
    const xi = pos[2], conoc = [0, 1, 2].filter(i => i !== xi), [k1, k2] = conoc.map(i => angs[i]), s = k1 + k2;
    const e = escTri(angs); conoc.forEach(i => angTri(e, i, 'k', angs[i])); angTri(e, xi, 'x', c); orientar(e, ...Object.values(orient(1, 'base')));
    const p = paso('a' + xi, 'X', c, [O('+', k1, k2, 'Ahora mira cuánto le falta a esa suma para llegar a 180°.'), O('-', 180, s)], [
      'Los tres ángulos de un triángulo suman 180°.', `Primero junta los dos ángulos que ya conoces: ${k1}° y ${k2}°. Puedes usar 🧮 Cálculos.`, 'Cuando tengas esa suma, mira cuánto le falta para llegar a 180°: 180 − (lo que sumaste).'],
      { chequeo:{ base:s, meta:180 }, conf:[ { val:s, msg:'Ese número es lo que suman los dos ángulos que ya conoces. Pero los tres deben llegar a 180°: ¿cuánto falta?' }, { val:180 - k1, msg:'Parece que restaste solo uno de los ángulos. Hay que tomar en cuenta los dos que conoces.' }, { val:180 - k2, msg:'Parece que restaste solo uno de los ángulos. Hay que tomar en cuenta los dos que conoces.' } ],
      expl:'Los tres ángulos interiores de un triángulo suman 180°.' });
    return ejercicio(1, 1, 'tri-falta', 'm1|' + [k1, k2].sort((p, q) => p - q).join('-'), e, [p]);
  }
}

/* =================== MUNDO 2 · Ángulo recto =================== */
const CUADRADITO = 'El cuadradito marca un ángulo recto: 90°.';
function triRecto(a, x){
  const swap = Math.random() < .5, angs = swap ? [90, x, a] : [90, a, x], ai = swap ? 2 : 1, xi = swap ? 1 : 2, e = escTri(angs);
  marcaRecta(e, 'sq', 'A', 'B', 'C'); angTri(e, ai, 'k', a); angTri(e, xi, 'x', x); return { e, xi };
}
function exM2(nivel){
  if(nivel === 3 && Math.random() < .3){   // triángulo rectángulo isósceles: los catetos llevan marcas iguales

    else h += `<g class="etq" data-id="${a.id}" data-v="${a.val}"><rect x="${x}" y="${y}" width="${c.w.toFixed(1)}" height="${c.h}" rx="8" fill="rgba(56,189,248,.16)" stroke="#38bdf8" stroke-width="1.5"/><text x="${c.cx.toFixed(1)}" y="${(c.cy + 5.5).toFixed(1)}" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="15" fill="#f6f3ff">${c.txt}</text></g>`;
  });
  return h;
}

/* =====================================================================
   3. VALIDACIÓN: ningún ejercicio se muestra si falla alguna de estas comprobaciones
   ===================================================================== */
function validarEjercicio(ex, tamanos){
  const err = [], e = ex.escena;
  e.angs.forEach(a => { if(Math.abs(medir(e, a) - a.val) > 1e-6) err.push(`el dibujo contradice el ángulo ${a.id} (${medir(e, a).toFixed(3)} vs ${a.val})`); if(!Number.isInteger(a.val) || a.val <= 0 || a.val >= 180) err.push('medida no entera o fuera de rango ' + a.id); });
  const tipoOk = { x:1, y:1 };
  ex.pasos.forEach((p, i) => {
    const a = e.angs.find(x => x.id === p.obj);
    if(!a) { err.push('paso sin ángulo objetivo'); return; }
    if(!tipoOk[a.tipo] && !(i === ex.pasos.length - 1 && a.tipo === 'x')) { if(!(a.tipo === 'hid')) err.push('ángulo objetivo no marcado ' + a.id); }
    if(p.resp !== a.val) err.push(`respuesta ≠ medida real (${p.resp} vs ${a.val})`);
    p.ops.forEach(o => { if(o.res !== (o.op === '+' ? o.a + o.b : o.op === '-' ? o.a - o.b : o.a / o.b)) err.push('operación mal calculada'); if(!Number.isInteger(o.res) || o.res <= 0) err.push('resultado intermedio no entero positivo: ' + opTxt(o)); });
    if(p.ops.length && p.ops[p.ops.length - 1].res !== p.resp) err.push('la última operación no da la respuesta');
    if(p.pistas.length < 3) err.push('faltan pistas');
  });
  // relaciones geométricas: triángulo/cuadrilátero suman 180/360 con las medidas reales
  if(e.poly){ const n = e.poly.length, vs = e.poly.map((_, i) => medir(e, { v:NV[i], p1:NV[(i + 1) % n], p2:NV[(i + n - 1) % n] })), s = vs.reduce((p, q) => p + q, 0); if(Math.abs(s - (n === 3 ? 180 : 360)) > 1e-6) err.push('polígono no suma ' + (n === 3 ? 180 : 360)); }
  (tamanos || [[340, 250], [330, 170], [300, 220]]).forEach(([W, H]) => [false, true].forEach(rev => {
    const d = disenar(e, W, H, rev); if(!d.ok){ err.push(`no cabe el diagrama en ${W}x${H}`); return; }
    d.labs.forEach(c => { if(c.cx - c.w / 2 < 0 || c.cx + c.w / 2 > W || c.cy - c.h / 2 < 0 || c.cy + c.h / 2 > H) err.push('etiqueta fuera'); });
    const todos = [...d.labs, ...d.irr]; for(let i = 0; i < todos.length; i++) for(let j = i + 1; j < todos.length; j++) if(cajaCaja(todos[i], todos[j], 0)) err.push('etiquetas superpuestas');
    todos.forEach(c => d.segs.forEach(([p, q]) => { if(cajaSeg(c, p, q, 1)) err.push('etiqueta sobre un lado'); }));
    d.segs.forEach(([p, q]) => { if(lon(sub(p, q)) < 38) err.push('segmento demasiado corto (' + Math.round(lon(sub(p, q))) + 'px)'); });
    if(e.angs.filter(a => a.tipo !== 'hid' && a.tipo !== 'sq').length !== d.labs.length) err.push('falta una etiqueta');
    d.labs.forEach(c => { const a = c.a, txt = textoAng(a, rev); if(c.txt !== txt) err.push('etiqueta ligada a otro ángulo'); });
  }));
  return err;
}

/* =====================================================================
   4. RETROALIMENTACIÓN: depende de lo respondido y de lo que el alumno calculó
   ===================================================================== */
function analizar(ex, idx, val, hist, intento){
  const p = ex.pasos[idx]; if(val === p.resp) return { ok:true };
  const c = p.conf.find(x => x.val === val); if(c) return { ok:false, msg:c.msg };
  if(ex.escena.angs.some(a => a.tipo === 'y' && a.val === val)) return { ok:false, msg:'Ese es el valor de Y, un ángulo intermedio. Úsalo para encontrar X.' };
  const inter = p.ops.slice(0, -1).map(o => o.res); if(inter.includes(val)) return { ok:false, msg:'Ese número es el resultado de un paso intermedio. Todavía falta al menos un paso más.' };
  const mostrados = ex.escena.angs.filter(a => a.tipo === 'k').map(a => a.val); if(mostrados.includes(val)) return { ok:false, msg:`Ese valor ya aparece en el dibujo. ${p.etq} es otro ángulo.` };
  if(val >= p.max) return { ok:false, msg:`No puede ser: ${p.max === 361 ? 'un ángulo de un cuadrilátero' : 'un ángulo de este dibujo'} no mide tanto.` };
  let k = -1; p.ops.forEach((o, i) => { if(hist.some(h => coincide(h, o))) k = i; });
  if(k >= 0 && k < p.ops.length - 1) return { ok:false, msg:`Tu cálculo ${opTxt(p.ops[k])} está bien. ${p.ops[k].sig || '¿Qué sigue?'}` };
  if(p.ops.length && hist.some(h => h.res === p.resp)) return { ok:false, msg:'Tu respuesta no coincide con los resultados de tus cálculos. Revisa tu lista en 🧮 Cálculos.' };
  if(p.chequeo) return { ok:false, msg:[`Con ${val}° los ángulos suman ${p.chequeo.base + val}°, y deberían sumar ${p.chequeo.meta}°. Revisa tu cálculo.`, `Prueba sumando todos: ${p.chequeo.base}° + ${val}°. ¿Llegas justo a ${p.chequeo.meta}°?`][intento % 2] };
  return { ok:false, msg:['Revisa tu cálculo paso a paso con 🧮 Cálculos y compáralo con el dibujo.', 'Piensa qué relación te da cada dato del dibujo (recta, triángulo, cruce de rectas).'][intento % 2] };
}

/* ---------- Arrastrar un resultado hasta la incógnita ---------- */

function sobreBola(x, y){

function activarArrastre(el, valor, notaIdx){
  const esNota = notaIdx !== undefined;
  el.style.touchAction = 'none';
  el.addEventListener('pointerdown', ev => {
    if(Ses.resueltoPaso || Cont.fin) return;
    ev.preventDefault();
    const x0 = ev.clientX, y0 = ev.clientY; let fantasma = null, activo = null;
    const mover = e => {
      if(!fantasma){ if(Math.hypot(e.clientX - x0, e.clientY - y0) < 8) return;
        fantasma = document.createElement('div'); fantasma.className = 'nota-r fantasma'; fantasma.textContent = String(valor()); document.body.appendChild(fantasma); document.body.classList.add('arrastrando'); if(esNota) el.style.opacity = '.25'; }
      fantasma.style.left = e.clientX + 'px'; fantasma.style.top = e.clientY + 'px';
      const g = sobreBola(e.clientX, e.clientY); if(g !== activo){ if(activo) activo.classList.remove('objetivo'); if(g) g.classList.add('objetivo'); activo = g; }
    };
    const soltar = e => {
      window.removeEventListener('pointermove', mover); window.removeEventListener('pointerup', soltar); window.removeEventListener('pointercancel', soltar);
      document.body.classList.remove('arrastrando'); if(activo) activo.classList.remove('objetivo');
      if(!fantasma){ insertarValor(valor(), false); return; }                       // fue un toque, no un arrastre
      fantasma.remove(); if(esNota) el.style.opacity = '';
      const v = valor(), g = sobreBola(e.clientX, e.clientY);
      if(g){ validarSoltado(g, v); return; }                                          // respuesta final sobre la incógnita
      const r = $('diag').getBoundingClientRect();
      if(e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom){ if(esNota){ Ses.notas.splice(notaIdx, 1); renderNotas(); } return; }
      const x = Math.min(.97, Math.max(.03, (e.clientX - r.left) / r.width)), y = Math.min(.97, Math.max(.03, (e.clientY - r.top) / r.height));
      if(esNota){ Ses.notas[notaIdx].x = x; Ses.notas[notaIdx].y = y; } else Ses.notas.push({ v, x, y });
      renderNotas();
    };
    window.addEventListener('pointermove', mover); window.addEventListener('pointerup', soltar); window.addEventListener('pointercancel', soltar);
  });
}

function mostrar(id){ if(id !== 'screen-juego' && MvLocal.cr && Cont.activo && !Cont.fin){ detenerCont(); }
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); document.body.classList.toggle('en-juego', id === 'screen-juego'); window.scrollTo(0, 0); }
function renderHome(){
  document.querySelectorAll('#screen-home [data-mundo]').forEach(b => { const mo = MUNDOS.find(m => m.id === +b.dataset.mundo); b.style.display = mundoActivo(mo) ? '' : 'none'; });
}
function abrirMundo(mo){ empezar(mo.id); }
function empezar(mundo){
  Object.assign(Ses, { mundo, nivel:0, n:1, prim:0, ex:null, vistas:new Set(), errTotal:0 });
  detenerCont();
  if(Online.activo){
    Online.docId = Online.uid + '_' + Date.now();                 // cada ronda es una fila propia en el panel
    if(window.iniciarNuevoIntentoOnline) window.iniciarNuevoIntentoOnline(Online.codigo, Online.docId, Online.nombre, Online.uid);
    if(Online.modo === 'contrarreloj') iniciarCont();
  } else if(MvLocal.cr){ iniciarCont(); }
  mostrar('screen-juego'); requestAnimationFrame(() => nuevoEjercicio());
}
function abrirConfig(){
  const l = $('cfgLista'); l.innerHTML = '';
  CONF_CLAVES.forEach(c => {
    const lab = document.createElement('label'); lab.innerHTML = `<input type="checkbox" ${Conf[c.k] ? 'checked' : ''}><span class="t">${c.nombre}<small>Mundo ${c.mundo}</small></span>`;
    lab.querySelector('input').onchange = e => { Conf[c.k] = e.target.checked; guardarConf(Conf); }; l.appendChild(lab);
  });
  mostrar('screen-config');
}
document.querySelectorAll('#screen-home [data-mundo]').forEach(b => b.onclick = () => {
  const m = +b.dataset.mundo;
  if(Online.activo){ empezar(m); return; }
  mvRank.pedirModo('Cazador', 'M' + m, b.getAttribute('aria-label') || ('Mundo ' + m), 5, () => { MvLocal.cr = false; empezar(m); }, () => { MvLocal.cr = true; empezar(m); });
});

function entrarAlHome(){ cargarProg(); Conf = cargarConf(); renderHome(); mostrar('screen-home'); }
function iniciarHeartbeatTiempo(){
  if(typeof window.iniciarHeartbeatMathverse==='function') window.iniciarHeartbeatMathverse(function(){ return AlumnoActual && AlumnoActual.id; },'cazador-de-angulos');
  else setTimeout(iniciarHeartbeatTiempo,100);
}
try{ var _g=JSON.parse(sessionStorage.getItem('profehoracio_alumno_actual')||'null'); if(_g && _g.id && _g.nombre){ AlumnoActual=_g; iniciarHeartbeatTiempo(); } }catch(e){}
entrarAlHome();
window.Cazador = { Online, Cont, entrarOnline, MUNDOS, generarEjercicio, validarEjercicio, analizar, disenar, Ses, Prog, Conf:() => Conf, empezar, insertarValor, calcular, comprobar, pedirPista, siguiente, nuevoEjercicio };

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";

const firebaseConfig = {
  apiKey: "AIzaSyDrwcG84h88gOf9FkUlZbECZ2qrO14KhO4",
  authDomain: "profehoracio-online.firebaseapp.com",
  projectId: "profehoracio-online",

const app = initializeApp(firebaseConfig, "onlineCazador");
const auth = getAuth(app);
const db = getFirestore(app);

window.unirseClaseOnline = async function(codigo, nombre){
  try{
    const userCredential = await signInAnonymously(auth);
    const uid = userCredential.user.uid;
    const sessionSnap = await getDoc(doc(db, 'sessions', codigo));
    if(!sessionSnap.exists()) return { ok:false, error:'Ese código no existe. Revísalo con tu profesor.' };
    const datos = sessionSnap.data();
    if(datos.active === false) return { ok:false, error:'Tu profesor ya cerró esta sesión.' };
    if(datos.recurso && datos.recurso !== 'cazador-de-angulos') return { ok:false, error:`Ese código es para ${datos.recurso}, no para Cazador de ángulos.` };
    const duracionMinutos = datos.duracionMinutos || 180;
    if(datos.createdAt){
      const minutosTranscurridos = (Date.now() - datos.createdAt.toDate().getTime()) / 60000;
      if(minutosTranscurridos > duracionMinutos) return { ok:false, error:'Este código ya venció. Pídele uno nuevo a tu profesor.' };
    }
    return { ok:true, uid, nivelObjetivo: datos.nivelObjetivo, modoObjetivo: datos.modoObjetivo, tipoObjetivo: datos.tipoObjetivo };
  } catch(err){
    console.error(err);
    return { ok:false, error:'Error de conexión. Intenta de nuevo.' };
  }
};
window.iniciarNuevoIntentoOnline = async function(codigo, docId, nombre, uid){
  if(!codigo || !docId) return;
  try{
    await setDoc(doc(db, 'sessions', codigo, 'students', docId), {
      name: nombre, uid: uid || null, startedAt: serverTimestamp(), completados: 0, errores: 0, mascota: (window.mascotaParaClase ? await window.mascotaParaClase() : null)
    });
  } catch(err){ console.error('No se pudo iniciar el intento online:', err); }
};
window.reportarProgresoOnline = async function(codigo, docId, deltaCompletados, deltaErrores){
  if(!codigo || !docId) return;
  try{
    await setDoc(doc(db, 'sessions', codigo, 'students', docId), {
      completados: increment(deltaCompletados || 0),
      errores: increment(deltaErrores || 0),
      updatedAt: serverTimestamp()
    }, { merge: true });
  } catch(err){ console.error('No se pudo reportar el progreso online:', err); }
};

// Llegada desde el inicio con ?codigoClase=XXXX (y ?invitado=Nombre si no tiene cuenta)
try{
  const pu = new URLSearchParams(location.search);
  const codigoUrl = pu.get('codigoClase'), invitadoUrl = pu.get('invitado');
  let nombre = null;
  if(AlumnoActual) nombre = AlumnoActual.nombre;
  else if(invitadoUrl && invitadoUrl.trim()) nombre = `👤 Invitado: ${invitadoUrl.trim()}`;
  if(codigoUrl && nombre){
    (async () => {
      const r = await window.unirseClaseOnline(codigoUrl.toUpperCase(), nombre);
      if(!r.ok){ alert(r.error); return; }
      entrarOnline(codigoUrl.toUpperCase(), r, nombre);
    })();
  }
} catch(e){ console.error(e); }

/* ---- Ranking de aciertos de la contrarreloj: un récord por alumno y nivel; solo se reemplaza si mejora; nunca se borra ---- */
window.guardarRankingAciertos = async function(col, id, nombre, mejor){
  try{
    await signInAnonymously(auth);
    const ref = doc(db, col, id);
    const s = await getDoc(ref);
    const previo = s.exists() ? (Number(s.data().mejor) || 0) : 0;
    if(mejor > previo && mejor <= 500) await setDoc(ref, { nombre: nombre, mejor: mejor, actualizado: serverTimestamp() });
    return { previo: previo };
  } catch(err){ console.error('No se pudo guardar el récord:', err); return null; }
};
window.leerRankingAciertos = async function(col, miId){
  try{
    await signInAnonymously(auth);
    const r = await getDocs(query(collection(db, col), orderBy('mejor', 'desc'), limit(10)));
    const lista = r.docs.map(d => ({ id: d.id, ...d.data() }));
    let mio = 0;
    if(miId){ const s = await getDoc(doc(db, col, miId)); mio = s.exists() ? (Number(s.data().mejor) || 0) : 0; }
    return { lista: lista, mio: mio };
  } catch(err){ console.error('No se pudo leer el ranking:', err); return null; }
};
