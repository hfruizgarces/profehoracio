<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Laboratorio de Números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS DE DISEÑO
   ========================================================= */
:root{
  color-scheme: dark;
  --bg-1:#1e1147;
  --bg-2:#3b1785;
  --bg-3:#5b21b6;
  --surface:rgba(255,255,255,.07);
  --surface-strong:rgba(255,255,255,.12);
  --border-soft:rgba(255,255,255,.14);

  --primary:#34d399;
  --primary-dark:#0f9d70;
  --accent:#fbbf24;
  --accent-soft:#fde68a;
  --pink:#f472b6;
  --blue:#38bdf8;
  --error:#fb7185;
  --error-soft:#3b0f1f;

  --text:#f6f3ff;
  --text-dim:#c9bdf0;
  --text-faint:#8f7fc4;

  --r-lg:22px;
  --r-md:16px;
  --r-sm:10px;

  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;

  --shadow-1: 0 10px 30px rgba(0,0,0,.35);
  --tap-min: 48px;
}

*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; width:100%; overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
h1,h2,h3{font-family:var(--font-display); margin:0;}
button, input{ -webkit-user-select:none; user-select:none; }
input{font-family:inherit;}

.hidden{display:none !important;}
.visually-hidden{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* Foco visible para accesibilidad con teclado */
:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
  border-radius:6px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* =========================================================
   LAYOUT GENERAL
   ========================================================= */
#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding: clamp(10px, 2.5vw, 24px);
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:6px 56px 14px 2px;
  flex-wrap:wrap;
}
.app-header .side{
  display:flex; align-items:center; gap:6px;
  flex:1 1 auto;
  min-width:70px;
}
.app-header .side.right{ justify-content:flex-end; }

.icon-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--surface);
  border:1px solid var(--border-soft);
  color:var(--text);
  padding:9px 12px;
  border-radius:999px;
  font-weight:700;
  font-size:clamp(.75rem, 2vw, .9rem);
  cursor:pointer;
  min-height:var(--tap-min);
  transition: background .15s, transform .1s;
  white-space:nowrap;
}
.icon-btn:hover{ background:var(--surface-strong); }
.icon-btn:active{ transform:scale(.96); }

.brand{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.2vw, 1.6rem);
  flex:0 1 auto;
  white-space:nowrap;
}
.brand .plus{
  display:inline-flex; align-items:center; justify-content:center;
  width:1.5em; height:1.5em;
  background:linear-gradient(135deg, var(--primary), var(--blue));
  border-radius:10px;
  color:#0b1a12;
  font-size:1em;
}

main{ flex:1; display:flex; flex-direction:column; }

.screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  animation: fadeSlideIn .35s ease both;
}
@keyframes fadeSlideIn{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}

.card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(16px, 4vw, 32px);
  box-shadow:var(--shadow-1);
  backdrop-filter: blur(6px);
}

/* =========================================================
   PANTALLA INICIAL
   ========================================================= */
.home-title{
  text-align:center;
  font-size:clamp(1.4rem, 5vw, 2.2rem);
  font-weight:800;
  margin-bottom:6px;
}
.home-sub{
  text-align:center;
  color:var(--text-dim);
  font-size:clamp(.9rem, 2.4vw, 1.05rem);
  margin:0 auto clamp(18px,4vw,28px);
  max-width:46ch;
}
footer.credits{ text-align:center; color: var(--text-faint); font-weight:700; font-size:.78rem; padding:20px 10px 4px; }
.level-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:clamp(10px, 2.5vw, 16px);
  width:100%;
}
@media (max-width:420px){
  .level-grid{ grid-template-columns:1fr; }
}
.level-btn{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:clamp(16px,4vw,22px) 10px;
  border-radius:var(--r-md);
  border:1px solid var(--border-soft);
  color:var(--text);
  cursor:pointer;
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1rem, 2.6vw, 1.15rem);
  min-height:96px;
  transition:transform .15s, box-shadow .15s;
}
.level-btn:hover{ transform:translateY(-3px); }
.level-btn:active{ transform:scale(.97); }
.level-btn .emoji{ font-size:clamp(1.6rem, 5vw, 2.1rem); }
.level-btn.easy{ background:linear-gradient(140deg,#0f9d70,#34d399); }
.level-btn.mid{ background:linear-gradient(140deg,#1d4ed8,#38bdf8); }
.level-btn.hard{ background:linear-gradient(140deg,#b91c66,#f472b6); }
.level-btn.custom{ background:linear-gradient(140deg,#92400e,#fbbf24); color:#fff; }

/* =========================================================
   PANTALLA "CREA TU EJERCICIO"
   ========================================================= */
.form-title{ font-size:clamp(1.2rem,3.6vw,1.5rem); font-weight:800; text-align:center; margin-bottom:4px; }
.form-sub{ color:var(--text-dim); text-align:center; margin-bottom:18px; font-size:.95rem; }

.addend-row{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:12px;
}
.addend-index{
  width:26px; text-align:right; color:var(--text-faint); font-weight:700; flex:0 0 auto;
}
.addend-input{
  flex:0 1 180px;
  min-width:0;
  background:var(--surface-strong);
  border:2px solid var(--border-soft);
  border-radius:var(--r-sm);
  color:var(--text);
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1.1rem, 3.2vw, 1.35rem);
  text-align:center;
  padding:12px 10px;
  min-height:var(--tap-min);
  letter-spacing:1px;
}
.addend-input::placeholder{ color:var(--text-faint); font-family:var(--font-body); font-weight:600; font-size:.85em;}
.addend-remove{
  flex:0 0 auto;
  width:var(--tap-min); height:var(--tap-min);
  border-radius:50%;
  background:rgba(251,113,133,.18);
  border:1px solid var(--error);
  color:var(--error);
  font-size:1.2rem;
  font-weight:800;
  cursor:pointer;
}
.dashed-btn{
  width:100%;
  max-width:220px;
  margin-left:auto; margin-right:auto;
  display:block;
  padding:12px;
  border-radius:var(--r-sm);
  border:2px dashed var(--border-soft);
  background:transparent;
  color:var(--text-dim);
  font-weight:700;
  cursor:pointer;
  min-height:var(--tap-min);
  margin-bottom:18px;
}
.dashed-btn:hover{ border-color:var(--text-dim); color:var(--text); }
.dashed-btn:disabled{ opacity:.4; cursor:not-allowed; }

.primary-btn{
  width:100%;
  padding:14px;
  border-radius:var(--r-md);
  border:none;
  background:linear-gradient(135deg, var(--primary), #10b981);
  color:#062b1c;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1rem, 2.8vw, 1.15rem);
  cursor:pointer;
  min-height:52px;
  box-shadow:0 6px 18px rgba(52,211,153,.35);
  transition:transform .12s, box-shadow .12s;
}
.primary-btn:hover{ transform:translateY(-2px); }
.primary-btn:active{ transform:scale(.98); }
.primary-btn:disabled{
  background:#4b4b5a; color:#9a9aab; box-shadow:none; cursor:not-allowed; transform:none;
}
.form-error{
  color:var(--error);
  text-align:center;
  font-weight:700;
  font-size:.9rem;
  min-height:1.4em;
  margin-bottom:10px;
}

/* =========================================================
   PANTALLA DE EJERCICIO
   ========================================================= */
.hint-box{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-md);
  padding:12px 14px;
  margin-bottom:16px;
  width:100%;
  font-size:clamp(.82rem, 2.1vw, .95rem);
  line-height:1.45;
}
.hint-box .bulb{ font-size:1.2em; flex:0 0 auto; }
.hint-box b{ color:var(--accent); }
.hint-box .ok{ color:var(--primary); }

/* =========================================================
   MODAL (llevada / totales de columna)
   ========================================================= */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(10,4,30,.6);
  backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center;
  padding:16px;
  z-index:700;
}
.modal-box{
  width:100%; max-width:400px;
  background:linear-gradient(160deg, #2c1468, #4c1d95);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(18px,4vw,26px);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.modal-close-x{
  position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
  border:1px solid var(--border-soft); background:var(--surface); color:var(--text);
  cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; z-index:5;
}
@keyframes popIn{
  from{ transform:scale(.85); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}
@keyframes monedaFlota{
  0%{ transform:translateY(0); opacity:0; }
  15%{ opacity:1; }
  100%{ transform:translateY(-24px); opacity:0; }
}
.modal-eyebrow{
  font-size:.78rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent); margin-bottom:6px; text-align:center;
}
.modal-title{
  font-size:clamp(1.05rem, 3.2vw, 1.25rem);
  text-align:center;
  margin-bottom:14px;
  line-height:1.4;
}
.modal-title b{ color:var(--accent-soft); }
.modal-fields{
  display:flex; gap:12px; justify-content:center; margin-bottom:14px; flex-wrap:wrap;
}
.modal-field{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.modal-field label{ font-size:.8rem; color:var(--text-dim); font-weight:700; text-align:center; max-width:11em; }
.modal-field input{
  width:80px;
  text-align:center;
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.3rem;
  padding:10px 6px;
  border-radius:var(--r-sm);
  border:2px solid var(--border-soft);
  background:var(--surface-strong);
  color:var(--text);
  min-height:var(--tap-min);
}
.modal-feedback{
  text-align:center; min-height:1.6em; font-weight:700; margin-bottom:10px; font-size:.9rem;
}
.modal-feedback.err{ color:var(--error); }
.modal-feedback.ok{ color:var(--primary); }
.modal-actions{ display:flex; gap:10px; }
.modal-actions button{ flex:1; }
.secondary-btn{
  padding:12px; border-radius:var(--r-md); border:1px solid var(--border-soft);
  background:transparent; color:var(--text-dim); font-weight:700; cursor:pointer;
  min-height:48px;
}

/* =========================================================
   PANTALLA DE RESULTADO / CELEBRACIÓN
   ========================================================= */
.result-hero{
  font-size:clamp(2.2rem, 9vw, 3.4rem);
  text-align:center;
}
.result-title{
  font-size:clamp(1.3rem, 4vw, 1.8rem);
  text-align:center;
  margin:8px 0 4px;
}
.result-eq{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.6vw, 1.6rem);
  text-align:center;
  color:var(--primary);
  margin-bottom:20px;
  word-break:break-word;
}
.result-actions{
  display:flex; gap:12px; width:100%; flex-wrap:wrap;
}
.result-actions button{ flex:1 1 160px; }

.confetti-piece{
  position:fixed; top:-10px; z-index:800;
  border-radius:2px;
  animation: fall linear forwards;
  pointer-events:none;
}
@keyframes fall{
  to{ transform:translateY(105vh) rotate(360deg); opacity:.9; }
}

/* =========================================================
   BARRA DE PROGRESO DE COLUMNAS
   ========================================================= */
.progress-track{
  display:flex; gap:6px; width:100%; margin-bottom:16px;
}
.progress-seg{
  flex:1; height:6px; border-radius:4px; background:rgba(255,255,255,.12);
  overflow:hidden;
}
.progress-seg .fill{
  height:100%; width:0%; background:linear-gradient(90deg, var(--primary), var(--blue));
  transition:width .4s ease;
}

/* utilidad de botón de sonido */
.sound-icon{ font-size:1.1em; }

/* =========================================================
   MULTIPLICACIÓN ÁRABE — retícula (propio del recurso)
   ========================================================= */
:root{
  --ink:var(--text); --ink-soft:var(--text-dim); --ink-faint:var(--text-faint);
  --brass:#fbbf24; --brass-dark:#f59e0b; --success:#34d399; --success-bg:rgba(52,211,153,.15);
  --error-bg:rgba(251,113,133,.15); --radius-s:10px; --radius-m:16px; --radius-l:22px;
  --font-num:var(--font-display); --font-ui:var(--font-body);
  --cell-size:calc(var(--cell-base,56px) * var(--f,1));
}
#vista{ width:100%; display:flex; flex-direction:column; }
.hero{ text-align:center; }
.problema-pill{
  align-self:center; font-family:var(--font-num); font-weight:800; letter-spacing:.04em;
  font-size:calc(clamp(1.3rem,4.4vw,1.9rem) * var(--f,1)); color:#fff;
  background:linear-gradient(150deg, rgba(44,20,104,.75), rgba(30,17,71,.75));
  box-shadow:inset 0 0 0 1px rgba(196,181,253,.35); border-radius:16px;
  padding:calc(6px * var(--f,1)) calc(22px * var(--f,1)); margin:0 0 calc(12px * var(--f,1));
}
.lattice-card{ width:100%; display:flex; flex-direction:column; align-items:center; padding:calc(4px * var(--f,1)) 0 0; }
.lattice-row{ display:flex; align-items:flex-start; gap:6px; }
.lattice-left{ display:flex; flex-direction:column; }
.top-digits, .side-digits{ display:flex; }
.top-digits{ justify-content:flex-end; margin-bottom:5px; gap:4px; }
.side-digits{ flex-direction:column; margin-top:calc(var(--cell-size) * .62 + 5px); gap:4px; margin-left:4px; }
.digit-box{
  width:var(--cell-size); height:calc(var(--cell-size) * .62); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .46); color:#fff;
  background:linear-gradient(150deg, rgba(124,58,237,.45), rgba(44,20,104,.7)); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.45);
  border:none; border-radius:12px; text-shadow:0 2px 6px rgba(0,0,0,.45);
}
.side-digits .digit-box{ width:calc(var(--cell-size) * .72); height:var(--cell-size); }
.grid-boxes{ display:grid; gap:4px; }
.lcell{
  width:var(--cell-size); height:var(--cell-size); position:relative; overflow:hidden; border-radius:10px;
  border:2px solid rgba(196,181,253,.75); background:rgba(30,17,71,.55); box-shadow:0 0 14px rgba(124,58,237,.25);
}
.lcell .tri{ position:absolute; inset:0; transition:background-color .35s ease, opacity .35s ease; }
.tri-tens{ clip-path:polygon(0 0,100% 0,0 100%); background:rgba(255,255,255,.05); }
.tri-ones{ clip-path:polygon(100% 0,100% 100%,0 100%); background:rgba(255,255,255,.1); }
.tri.diag-dim{ opacity:.35; } .tri.diag-active{ opacity:1; }
.cell-num{
  position:absolute; z-index:2; font-family:var(--font-num); font-weight:800; line-height:1; pointer-events:none;
  font-size:calc(var(--cell-size) * .36); color:#fff; text-shadow:0 2px 5px rgba(0,0,0,.5);
}
.cell-num.tens-pos{ top:12%; left:12%; } .cell-num.ones-pos{ bottom:10%; right:12%; }
.lcell input.cell-input{
  position:absolute; z-index:2; width:42%; height:42%; border:none; border-radius:7px; padding:0; outline:none;
  background:rgba(8,3,26,.55); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.5); text-align:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .32); color:#fff; user-select:text; -webkit-user-select:text;
}
.lcell input.cell-input.tens-pos{ top:6%; left:6%; } .lcell input.cell-input.ones-pos{ bottom:6%; right:6%; }
.lcell input.cell-input:focus{ background:rgba(124,58,237,.5); box-shadow:0 0 0 2.5px var(--brass), 0 0 14px rgba(251,191,36,.6); }
.lcell input.cell-input.wrong-flash{ background:var(--error-bg); box-shadow:0 0 0 2.5px var(--error); }

.diag-section{ margin-top:calc(22px * var(--f,1)); width:100%; display:flex; flex-direction:column; align-items:center; }
.diag-section h3{ font-size:calc(.86rem * var(--f,1)); font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin-bottom:calc(30px * var(--f,1)); text-align:center; }
.diag-row{ display:flex; gap:calc(8px * var(--f,1)); align-items:flex-end; flex-wrap:wrap; justify-content:center; }
.diag-box-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; }
.carry-badge{
  position:absolute; top:calc(-24px * var(--f,1)); left:50%; transform:translateX(-50%) scale(0); opacity:0;
  font-family:var(--font-num); font-weight:800; font-size:.8rem; color:#3b2405; background:var(--brass);
  border-radius:999px; padding:2px 9px; white-space:nowrap; box-shadow:0 0 10px rgba(251,191,36,.7);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
}
.carry-badge.show{ transform:translateX(-50%) scale(1); opacity:1; }
.diag-box{
  width:calc(clamp(48px,11vw,64px) * var(--f,1)); min-height:calc(clamp(48px,11vw,64px) * var(--f,1));
  border-radius:14px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1));
  border:2.5px solid var(--border-soft); background:rgba(8,3,26,.4); color:var(--text-faint); transition:all .25s ease;
}
.diag-box.pending{ opacity:.55; }
.diag-box input{ width:100%; height:100%; border:none; background:transparent; text-align:center; font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1)); color:#fff; outline:none; user-select:text; -webkit-user-select:text; }
.diag-box.wrong{ animation:shake .32s ease; }
.carry-fly{
  position:fixed; z-index:3000; font-family:var(--font-num); font-weight:800; font-size:.95rem; color:#3b2405;
  background:var(--brass); border-radius:999px; padding:4px 10px; pointer-events:none;
  transition:transform .55s cubic-bezier(.3,.6,.4,1), opacity .55s ease;
}
.final-banner{
  margin-top:calc(16px * var(--f,1)); text-align:center; background:var(--success-bg); border:2px solid var(--success);
  color:var(--success); border-radius:16px; padding:calc(10px * var(--f,1)) 20px; font-weight:800;
  font-family:var(--font-num); font-size:calc(clamp(1.1rem,3.8vw,1.5rem) * var(--f,1));
}
.arabe-final{ width:100%; display:flex; flex-direction:column; align-items:center; }
.arabe-final .mv-fila-chip{ margin-top:calc(8px * var(--f,1)); }
.arabe-final .result-actions{ margin-top:calc(14px * var(--f,1)); }
.setup-box{ width:100%; max-width:480px; margin:0 auto; text-align:center; }
.setup-box label{ display:block; font-weight:700; font-size:.95rem; color:var(--text-dim); margin-bottom:16px; }
.factor-input-row{ display:flex; align-items:center; justify-content:center; gap:clamp(10px,3vw,18px); }
.factor-input{
  width:100%; max-width:150px; font-family:var(--font-num); font-weight:800; font-size:clamp(1.6rem,7vw,2.2rem);

:root{
  color-scheme: dark;
  --bg-1:#1e1147; --bg-2:#3b1785; --bg-3:#5b21b6;
  --primary:#34d399; --accent:#fbbf24; --error:#fb7185; --blue:#38bdf8; --pink:#f472b6;
  --text:#f6f3ff; --text-dim:#c9bdf0; --text-faint:#8f7fc4;
  --surface:rgba(255,255,255,.07); --surface-strong:rgba(255,255,255,.12);
  --border-soft:rgba(255,255,255,.16);
  --shadow:0 14px 34px rgba(0,0,0,0.4);
  --radius:20px; --radius-sm:12px;
  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;
  --transition: all .2s cubic-bezier(.4,0,.2,1);
  --hb:clamp(34px,8dvh,60px);
}

*{ box-sizing:border-box; }

body.en-juego{ overflow:hidden; height:100dvh; min-height:0; }

button{ font-family:inherit; }

h1,h2,h3{ font-family:var(--font-display); margin:0; }

.hidden{ display:none !important; }


.screen{ display:none; animation:fadeIn .35s ease; }

.screen.active{ display:block; }

@keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }


/* ---------- Pantalla de juego (sin scroll) ---------- */
#screen-juego{ height:100dvh; grid-template-rows:auto minmax(0,1fr) auto; overflow:hidden; }

#screen-juego.active{ display:grid; }

.topbar-der{ grid-area:der; justify-self:end; display:flex; gap:6px; }

.nivel-pill{
  grid-area:pill; display:inline-flex; align-items:center; justify-content:center;
  background:rgba(251,191,36,.14); border:1px solid rgba(251,191,36,.4); color:var(--accent);
  padding:6px 12px; border-radius:999px; font-family:var(--font-display); font-weight:800;
  font-size:.74rem; text-transform:uppercase; letter-spacing:.05em; white-space:nowrap;
}

.btn{
  font-family:var(--font-display); font-weight:700; font-size:13px; cursor:pointer; transition:var(--transition);
  background:var(--surface); border:1px solid var(--border-soft); color:var(--text); padding:7px 14px; border-radius:999px;
}

.btn:hover{ background:var(--surface-strong); }

.btn.icono{ width:38px; height:38px; padding:0; font-size:19px; display:inline-flex; align-items:center; justify-content:center; }

.btn.verde{ background:linear-gradient(140deg,#0f9d70,var(--primary)); color:#04281c; border-color:transparent; font-weight:800; font-size:14px; padding:8px 18px; }

.btn.siguiente{ background:linear-gradient(140deg,#f59e0b,var(--accent)); color:#3d1f00; border-color:transparent; font-weight:800; font-size:14px; padding:8px 18px; }

.btn.azul{ background:linear-gradient(140deg,#1d4ed8,var(--blue)); color:#06213a; border-color:transparent; font-weight:800; font-size:14px; padding:8px 18px; }

.btn.corte{ padding:5px 11px; min-width:34px; }

.btn.sel{ background:rgba(56,189,248,.22); border-color:var(--blue); color:var(--blue); }


.juego-main{
  width:100%; max-width:1050px; margin:0 auto; min-height:0; padding:0 14px 40px;
  display:flex; flex-direction:column; gap:6px;
}

.escenario{
  flex:1 1 0; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:8px;
  padding:4px 2px; overflow:hidden;
}

.fila{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; justify-content:center; }

.fila.fix{ flex-wrap:nowrap; }

.fila .flex1{ flex:1; min-width:0; }

.etq{ font-family:var(--font-display); font-weight:800; font-size:15px; min-width:78px; color:var(--text-dim); }

.estado{ display:flex; justify-content:center; align-items:center; font-family:var(--font-display); font-weight:800; font-size:15px; color:var(--accent); }

.sub{ margin:0; text-align:center; font-size:14px; line-height:1.3; color:var(--text-dim); font-weight:700; }

.sub b{ color:var(--text); }


.msg{ min-height:2.7em; margin:0; padding:3px 8px; text-align:center; line-height:1.3; font-size:14px; font-weight:700; color:var(--text-dim); display:block; }

.msg.bien{ color:var(--primary); }
 .msg.mal{ color:var(--error); }
 .msg.casi{ color:var(--accent); }

.msg b{ color:inherit; }


/* Fracciones */
.frac{ display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; font-weight:800; line-height:1.05; margin:0 3px; }

.frac > span:first-child{ border-bottom:2.5px solid currentColor; padding:0 4px; }

.frac .den{ border-top:3px solid currentColor; padding:0 10px; }

.frac.grande{ font-size:clamp(1.35rem,5.5vw,1.9rem); font-family:var(--font-display); }

.entrada{
  width:68px; padding:6px; font-size:1.25rem; border-radius:var(--radius-sm); border:2px solid var(--border-soft);
  text-align:center; background:var(--surface-strong); color:var(--text); font-family:var(--font-display); font-weight:800;
  -moz-appearance:textfield; appearance:textfield;
}

.entrada::-webkit-outer-spin-button,.entrada::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }

.entrada:focus{ outline:none; border-color:var(--blue); }


/* Barras */
.barra{
  display:flex; height:var(--hb); border:3px solid var(--text); border-radius:var(--radius-sm); overflow:hidden;
  background:rgba(255,255,255,.06); transition:outline .2s, transform .5s, opacity .3s; touch-action:none; width:100%;
}

.barra.entero{ height:calc(var(--hb)*.75); background:rgba(56,189,248,.18); justify-content:center; align-items:center; font-weight:800; font-size:1.2rem; font-family:var(--font-display); }

.trozo{
  flex:1; min-width:0; border-right:2px solid var(--text); display:flex; align-items:center; justify-content:center;
  font-size:clamp(8px,2.5vw,13px); color:var(--text-dim); user-select:none; touch-action:none; transition:background .15s;
}

.trozo:last-child{ border-right:none; }

.trozo.on{ background:var(--blue); color:#0c1b3a; font-weight:800; }

.barra.b .trozo.on{ background:var(--accent); color:#3d1f00; }

.barra.coincide{ outline:5px solid var(--primary); }

.sup-z{ position:relative; z-index:3; }

.historial{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:center; font-size:1.15rem; font-family:var(--font-display); }

.historial .frac{ opacity:.55; }
 .historial .frac.actual{ opacity:1; color:var(--accent); }

svg text{ font-weight:800; font-family:var(--font-display); }

.balanza{ width:100%; flex:1 1 0; min-height:70px; }


@media(max-width:600px){
  .app-topbar{ padding:6px 62px 2px 8px; }
  .icon-btn{ padding:7px 11px; font-size:.82rem; }
  .btn.icono{ width:34px; height:34px; font-size:17px; }
  .juego-main{ padding:0 8px 40px; }
  .escenario{ padding:4px 0; }
  .etq{ min-width:60px; font-size:14px; }
}

@media(max-height:620px){ :root{ --hb:clamp(30px,6.6dvh,48px); } .escenario{ gap:6px; } }

@media(max-height:480px){
  :root{ --hb:clamp(28px,9dvh,40px); }
  .app-topbar{ padding-top:3px; padding-bottom:2px; min-height:52px; }
  .btn.icono{ width:30px; height:30px; }
  .juego-main{ padding-bottom:38px; gap:3px; }
  .escenario{ padding:2px 8px; gap:4px; }
  .msg{ font-size:12.5px; min-height:2.4em; padding:1px; }
  .sub{ font-size:12.5px; }
  .btn.corte{ padding:3px 9px; } .btn.verde,.btn.siguiente,.btn.azul{ padding:5px 14px; }
  .entrada{ padding:3px; font-size:1.05rem; width:60px; }
  .frac.grande{ font-size:1.25rem; }
}


.trozo .frac{ margin:0; font-size:inherit; }
 .trozo .frac > span:first-child{ border-bottom-width:1px; padding:0 2px; }


/* ---------- Patrones en acción ---------- */
.consigna{ display:block; text-align:center; font-family:var(--font-display); font-weight:800; font-size:clamp(.95rem,3.3vw,1.2rem);
  color:var(--text); background:var(--surface); border:1px solid var(--border-soft); border-radius:22px; padding:6px 20px; margin:2px auto 0; max-width:100%; line-height:1.2; }

.consigna b{ color:var(--accent); }

.zona{ width:100%; flex:1 1 0; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; overflow:hidden; }

.zona svg{ width:100%; max-width:860px; flex:0 1 auto; min-height:0; max-height:100%; display:block; }

.herram{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; align-items:center; min-height:44px; }

.opciones{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }

.op{ min-width:76px; padding:6px 10px; border-radius:var(--radius-sm); cursor:pointer; color:var(--text);
  background:var(--surface-strong); border:2px solid var(--border-soft); font-family:var(--font-display); font-weight:800; font-size:1.15rem; transition:var(--transition); }

.op:hover{ border-color:var(--blue); }
 .op.mal{ border-color:var(--error); opacity:.4; pointer-events:none; }
 .op.bien{ border-color:var(--primary); background:rgba(52,211,153,.22); }

.op svg{ display:block; width:60px; height:60px; margin:0 auto; }
 .op.fig svg{ width:auto; height:70px; max-width:130px; }

.op.txt{ font-size:.98rem; text-align:left; max-width:420px; width:100%; line-height:1.25; padding:9px 14px; }

.op.mat{ font-size:1.4rem; min-width:64px; padding:6px 8px; }

.tabla{ border-collapse:collapse; font-family:var(--font-display); font-weight:800; font-size:1.1rem; }

.tabla td, .tabla th{ border:2px solid var(--border-soft); padding:5px 10px; text-align:center; min-width:46px; }

.tabla th{ background:var(--surface-strong); color:var(--text-dim); font-size:.8rem; }

.tabla td.hueco{ background:rgba(251,191,36,.12); }

.tabla input{ width:62px; font-size:1.05rem; }

.tabla .dif{ color:var(--accent); font-size:.85rem; border:none; }

.maq-tabla{ display:flex; flex-wrap:wrap; gap:6px; justify-content:center; min-height:34px; }

.chip{ font-family:var(--font-display); font-weight:800; padding:4px 12px; border-radius:999px; background:var(--surface-strong); border:1px solid var(--border-soft); }

.chip.nuevo{ border-color:var(--accent); color:var(--accent); }

.fila-in{ display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; font-family:var(--font-display); font-weight:800; }

.entrada.ancha{ width:84px; }

.pal{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }

.pal button{ background:var(--surface-strong); border:2px solid var(--border-soft); border-radius:12px; padding:4px; cursor:pointer; }

.pal button svg{ width:46px; height:46px; display:block; }

.cons-nota{ color:var(--text-dim); font-size:.85rem; text-align:center; }

.grid-menu .level-btn small{ opacity:.9; font-weight:700; }

@media(max-height:480px){ .consigna{ padding:2px 14px; font-size:.95rem; } .herram{ min-height:34px; } .op svg{ width:44px; height:44px; } }

/* evita que el ancho natural de los SVG ensanche la pantalla */
#screen-juego{ width:100%; max-width:100vw; overflow-x:hidden; grid-template-columns:minmax(0,1fr); }

.juego-main,.escenario,.zona{ min-width:0; max-width:100%; }

.zona svg{ height:auto; }

/* selector de nivel */
.nivsel{ display:none; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; padding:2px 10px 0; font-family:var(--font-display); font-weight:800; }

.nivsel .ns-t{ color:var(--text-dim); font-size:.85rem; }

.nivsel .ns-b{ width:34px; height:34px; border-radius:50%; border:2px solid var(--border-soft); background:var(--surface); color:var(--text); font-family:var(--font-display); font-weight:800; font-size:1rem; cursor:pointer; transition:var(--transition); }

.nivsel .ns-b.on{ background:var(--accent); color:#3d1f00; border-color:transparent; }

.nivsel .ns-d{ color:var(--text-dim); font-size:.78rem; font-weight:700; }

@media(max-height:480px){ .nivsel .ns-d{ display:none; } .nivsel .ns-b{ width:28px; height:28px; font-size:.85rem; } }

.tcons{ font-size:1rem; }
 .tcons td, .tcons th{ padding:4px 6px; min-width:38px; }
 .tcons input{ width:54px; padding:3px; font-size:1rem; }

@media(max-width:600px){ .tcons th{ font-size:.62rem; padding:2px 3px; } .tcons td{ padding:3px 2px; min-width:0; font-size:.9rem; } .tcons input{ width:38px; padding:2px; font-size:.9rem; border-width:1.5px; } }

@media(max-width:600px){ .pal{ gap:6px; } .pal button svg{ width:38px; height:38px; } }

/* Inicio y selección de nivel: todo cabe en una pantalla, sin scroll */
@media(max-width:600px){ .opciones{ gap:8px; flex-wrap:nowrap; } .op.mat{ font-size:1.05rem; padding:7px 5px; min-width:0; flex:1 1 0; white-space:nowrap; } }

window.mvExito = function(){

/* =========================================================
   UTILIDADES
   ========================================================= */
const rnd = (a,b)=> Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[rnd(0,arr.length-1)];
const barajar = a => { a=[...a]; for(let i=a.length-1;i>0;i--){ const j=rnd(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const $ = s => document.querySelector(s);
let AlumnoActual = null;
function switchScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  document.body.classList.toggle('en-juego', id === 'screen-juego');
  window.scrollTo(0, 0);
}
function iniciarHeartbeatTiempo(){
  if(typeof window.iniciarHeartbeatMathverse==='function') window.iniciarHeartbeatMathverse(function(){ return AlumnoActual && AlumnoActual.id; },'patrones-en-accion');
  else setTimeout(iniciarHeartbeatTiempo,100);
}
try{ var _g=JSON.parse(sessionStorage.getItem('profehoracio_alumno_actual')||'null'); if(_g && _g.id && _g.nombre){ AlumnoActual=_g; iniciarHeartbeatTiempo(); } }catch(e){}



let sonidoOn = true, ctx;
function tono(f=880, dur=.15, tipo='sine'){
  if(!sonidoOn) return;
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=tipo; o.frequency.value=f; g.gain.setValueAtTime(.15,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }catch(e){}
}
const tintineo = ()=>{ tono(988,.12); setTimeout(()=>tono(1319,.2),110); };
const errorSnd = ()=> tono(220,.25,'triangle');
$('#bSon').onclick = e => { sonidoOn=!sonidoOn; e.currentTarget.textContent = sonidoOn?'🔊':'🔇'; };
$('#bFull').onclick = ()=> document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
function aviso(html, tipo=''){ const m=$('#msg'); m.className='msg '+tipo; m.innerHTML=html; }
function setConsigna(html){ $('#consigna').innerHTML='<span>'+html+'</span>'; }
/* XP según lo que demanda cada actividad (1 punto ≈ 15 s de trabajo) */
const PESO_ACT_PATRONES = { detectives:1, constructores:4, maquinas:3, reglas:5, crea:4 };
function registrarCompletado(){
  if(AlumnoActual && typeof window.reportarProgresoPractica === 'function')
    window.reportarProgresoPractica(AlumnoActual.id, 'patrones-en-accion', 1, 0, PESO_ACT_PATRONES[actual] || 2);
}

/* Recientes: evita repetir el mismo ejercicio */
function recienteOk(lista, clave, ventana){ return !lista.slice(-ventana).includes(clave); }
function anotar(lista, clave){ lista.push(clave); if(lista.length>30) lista.shift(); }

/* =========================================================
   PIEZAS (figura + color)
   ========================================================= */
const PALETA=['#38bdf8','#fb7185','#34d399','#fbbf24','#c084fc','#fb923c'];
const FORMAS=['circulo','cuadrado','triangulo','estrella','rombo','hexagono'];
function poly(cx,cy,r,n,rot){ let p=[]; for(let i=0;i<n;i++){ const a=rot+i*2*Math.PI/n; p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1)); } return p.join(' '); }
function pieza(t,cx,cy,r){
  const at=`fill="${t.c}" stroke="rgba(255,255,255,.75)" stroke-width="2" stroke-linejoin="round"`;

    case 'cuadrado': return `<rect x="${cx-r*.88}" y="${cy-r*.88}" width="${r*1.76}" height="${r*1.76}" rx="5" ${at}/>`;

const DET_UNI = {
  1:['AB','AB','AAB','ABB'],
  2:['ABC','AABB','ABAC','AAB','ABB','ABC'],
  3:['AABC','ABCB','ABCD','ABBC','DUAL','DUAL']
};
const Det = {
  rec:[], recTipo:[],
  simbolos(){ const f=barajar([0,1,2,3,4,5]), c=barajar([0,1,2,3,4,5]); return f.map((fi,i)=>({f:FORMAS[fi],c:PALETA[c[i]]})); },
  unidad(clave){
    const S=this.simbolos();
    if(clave==='DUAL'){   // la figura se repite cada 4 y el color cada 2 → todo el patrón cada 4
      const sh=S.slice(0,4).map(s=>s.f), co=S.slice(4,6).map(s=>s.c);
      const unit=[]; for(let i=0;i<4;i++) unit.push({f:sh[i],c:co[i%2]});
      const todos=[]; sh.forEach(f=>co.forEach(c=>todos.push({f,c})));
      return {unit, pool:todos, dual:true};
    }
    const letras=[...new Set(clave.split(''))];
    const map={}; letras.forEach((l,i)=>map[l]=S[i]);
    return {unit:clave.split('').map(l=>map[l]), pool:S, dual:false};
  },
  opciones(correcta, unit, pool){
    const dist=[], vistos=new Set([claveT(correcta)]);
    [...barajar(unit),...barajar(pool)].forEach(t=>{ if(dist.length<3 && !vistos.has(claveT(t))){ vistos.add(claveT(t)); dist.push(t); } });
    return barajar([correcta,...dist]);
  },
  gen(nivel, forzarTipo){
    let clave, tipo, intentos=0;
    do{
      clave=pick([...DET_UNI[1], ...DET_UNI[2], ...DET_UNI[3]]);   // un solo nivel: mezcla de todo
      const ts = nivel===1?[['siguiente',.55],['faltante',.45]]:[['siguiente',.5],['faltante',.5]];
      let r=Math.random(), a=0; tipo=ts[ts.length-1][0]; for(const [t,p] of ts){ a+=p; if(r<a){ tipo=t; break; } }
      if(forzarTipo) tipo=forzarTipo;
      if(!forzarTipo && this.recTipo.length>=2 && this.recTipo.slice(-2).every(t=>t===tipo)) { intentos++; continue; }
      if(recienteOk(this.rec, clave+tipo, 4)) break;
      intentos++;
    } while(intentos<30);
    anotar(this.rec, clave+tipo); anotar(this.recTipo, tipo);
    const {unit,pool,dual}=this.unidad(clave); const P=unit.length;
    // Siempre se ve la unidad completa al menos 2 veces; todo cabe en una sola fila (máx. 11 piezas)
    const r = rnd(1, Math.max(1, Math.min(P-1, 10-2*P))), L=2*P+r;
    const seq = n => Array.from({length:n},(_,i)=>unit[i%P]);
    let items=seq(L), ans, idx=null, opciones=null;
    if(tipo==='siguiente'){ ans=unit[L%P]; idx=L; opciones=this.opciones(ans,unit,pool); }
    else if(tipo==='faltante'){ idx=rnd(1,L-2); ans=unit[idx%P]; opciones=this.opciones(ans,unit,pool); }
    else {
      // la pieza equivocada tiene al menos 2 "copias" correctas en otras vueltas, así que solo una respuesta es posible
      const cand=[]; for(let i=0;i<L;i++) if(i%P<r) cand.push(i);
      idx=pick(cand); const bien=unit[idx%P];
      ans=bien; items[idx]=barajar(pool.filter(t=>claveT(t)!==claveT(bien)))[0];
    }
    return {tipo, clave, unit, P, L, items, idx, ans, opciones, hl:null, primero:false, mal:new Set(), dual, fase:0};
  },
  pintar(e){
    setConsigna(e.tipo==='siguiente'?'¿Qué pieza <b>sigue</b> en el patrón?': e.tipo==='faltante'?'¿Qué pieza <b>falta</b> en el patrón?':'Una pieza <b>rompe</b> el patrón. ¡Tócala!');
    const h=$('#herram'); h.innerHTML='';
    if(e.fase===0){   // paso previo: descubrir de cuántas piezas se compone el patrón
      setConsigna('Antes de empezar: ¿de cuántas piezas se compone la parte que <b>se repite</b>?');
      h.appendChild(filaOpciones([2,3,4,5], n=>String(n), (n,b)=>{
        if(n===e.P){ b.classList.add('bien'); e.fase=1; e.primero=true; e.hl=null; pistas=0; tono(740,.1); Det.pintar(e); aviso(`¡Sí! El patrón se forma con <b>${e.P}</b> piezas que se repiten.`,'bien'); }
        else { b.classList.add('mal'); malo(n<e.P?'Son más piezas. Mira dónde vuelve a aparecer la primera pieza.':'Son menos piezas. Mira dónde vuelve a aparecer la primera pieza.'); }
      },'mat'));
      h.appendChild(botonPista());
      Det.zona(e); return;
    }
    if(e.opciones){
      h.appendChild(filaOpciones(e.opciones, t=>piezaMini(t), (t,b)=>{
        if(claveT(t)===claveT(e.ans)){ b.classList.add('bien'); e.relleno=t; Det.zona(e); bueno('¡Correcto!'); }
        else { b.classList.add('mal'); malo('Esa no encaja. Fíjate qué parte se repite y compara con la vuelta anterior.'); }
      }));
    }
    h.appendChild(botonPista());
    Det.zona(e);
  },
  zona(e){
    const n=e.items.length+(e.tipo==='siguiente'?1:0), S=62, RH=84;
    let s=`<svg viewBox="0 0 ${n*S+16} ${RH+8}" id="seq" role="img" aria-label="Secuencia de piezas">`;
    for(let i=0;i<n;i++){
      const cx=8+i*S+S/2, cy=4+RH/2;
      const fill = (e.primero && i<e.P) ? 'rgba(251,191,36,.22)' : 'rgba(255,255,255,.05)';
      s+=`<rect x="${cx-S/2+2}" y="${cy-RH/2+4}" width="${S-4}" height="${RH-8}" rx="12" fill="${fill}"/>`;
      const esQ = (e.tipo==='siguiente' && i===e.items.length) || (e.tipo==='faltante' && i===e.idx);
      if(esQ && e.relleno){ s+=pieza(e.relleno,cx,cy,22); }
      else if(esQ){ s+=`<rect x="${cx-23}" y="${cy-23}" width="46" height="46" rx="11" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="7 6"/><text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="32" fill="#fbbf24">?</text>`; }
      else s+=`<g data-i="${i}" style="cursor:${e.tipo==='error'?'pointer':'default'}">${pieza(e.items[i],cx,cy,22)}<rect x="${cx-S/2+4}" y="${cy-RH/2+6}" width="${S-8}" height="${RH-12}" fill="transparent"/></g>`;
      if(e.hl===i) s+=`<rect x="${cx-S/2+3}" y="${cy-RH/2+5}" width="${S-6}" height="${RH-10}" rx="12" fill="none" stroke="#fbbf24" stroke-width="4"/>`;
      if(e.mal.has(i)) s+=`<rect x="${cx-S/2+3}" y="${cy-RH/2+5}" width="${S-6}" height="${RH-10}" rx="12" fill="rgba(251,113,133,.25)" stroke="#fb7185" stroke-width="3"/>`;
    }
    s+='</svg>';
    $('#zona').innerHTML=s;
    if(e.tipo==='error'){
      $('#seq').onclick = ev=>{
        const g=ev.target.closest('[data-i]'); if(!g||bloqueado) return;
        const i=+g.dataset.i;
        if(i===e.idx){ bueno('¡Lo encontraste!'); }
        else { e.mal.add(i); Det.zona(e); malo('Esa pieza sí sigue el patrón. Compárala con la vuelta anterior.'); }
      };
    }
  },
  pista(e,n){
    if(e.fase===0){
      if(n===1) aviso('Busca qué parte <b>se repite</b> una y otra vez.','casi');
      else if(n===2){ e.hl=e.P; Det.zona(e); aviso('Cuenta cuántas piezas hay desde el inicio hasta justo antes de la pieza marcada: ahí empieza la segunda vuelta.','casi'); }
      else aviso(`La primera pieza vuelve a aparecer en el lugar ${e.P+1}. ¿Cuántas piezas hay antes?`,'casi');
      return;
    }
    if(n===1){ aviso('Busca qué parte <b>se repite</b> una y otra vez.','casi'); }
    else if(n===2){ e.primero=true; Det.zona(e); aviso(`Esta es la parte que se repite (${e.P} piezas). Mírala bien.`,'casi'); }
    else { e.primero=true; e.hl = e.tipo==='siguiente'? e.L-e.P : (e.idx-e.P>=0? e.idx-e.P : e.idx+e.P); Det.zona(e);
      aviso(e.tipo==='error'?'Compara cada pieza con la que está una vuelta antes.':'Mira la pieza marcada: está en el mismo lugar de la vuelta anterior.','casi'); }
  }
};

/* =========================================================
   2) CONSTRUCTORES DE PATRONES (figuras que crecen)
   ========================================================= */
function celdas(fam,p,n){
  const o=[];
  if(fam==='col'){
    for(let y=0;y<p.b;y++) o.push({x:0,y,k:1,n:0});
    for(let j=1;j<=n;j++) for(let y=0;y<p.a;y++) o.push({x:j,y,k:0,n:j});
  } else if(fam==='esc'){
    for(let j=1;j<=n;j++) for(let y=0;y<j;y++) o.push({x:j-1,y,k:0,n:j});
  } else {
    for(let x=0;x<n;x++) for(let y=0;y<n;y++) o.push({x,y,k:0,n:Math.max(x,y)+1});
  }
  return o;
}
function Tfig(fam,p,n){ return fam==='col'? p.a*n+p.b : fam==='esc'? n*(n+1)/2 : n*n; }
function dimsC(c){ let mx=1e9,Mx=-1e9,My=-1; c.forEach(q=>{ if(q.x<mx)mx=q.x; if(q.x>Mx)Mx=q.x; if(q.y>My)My=q.y; }); return {w:Mx-mx+1,h:My+1,mx}; }
function celdasSVG(c,ox,oy,u,H,hlN,mx){
  return c.map(q=>{
    const x=ox+(q.x-mx)*u, y=oy+(H-1-q.y)*u, nuevo = hlN!=null && q.n===hlN;
    const fill = nuevo?'#fde047':(q.k?'#f472b6':'#38bdf8');
    return `<rect x="${x+.75}" y="${y+.75}" width="${u-1.5}" height="${u-1.5}" rx="3" fill="${fill}" stroke="${nuevo?'#b45309':'#0c1b3a'}" stroke-width="${nuevo?3:1.4}"/>`;
  }).join('');
}
const sigC = c => c.map(q=>q.x+','+q.y).sort().join(';');
function miniFig(c, W, H){   // miniatura para opciones; W,H = tamaño de rejilla común
  const u=24, d=dimsC(c);
  return `<svg viewBox="0 0 ${W*u+4} ${H*u+4}" preserveAspectRatio="xMidYMax meet">${celdasSVG(c,2,2,u,H,null,d.mx)}</svg>`;
}
const fam_txt = {col:'', esc:'', cua:''};

const Cons = {
  rec:[],
  params(nivel){
    if(nivel===1){ const [a,b]=pick([[2,1],[2,0],[3,0],[3,1],[1,2],[2,2],[3,2]]); return {fam:'col',p:{a,b}}; }
    if(nivel===2){ if(Math.random()<.6) return {fam:'col',p:{a:rnd(2,4),b:rnd(0,3)}}; return {fam:'esc',p:{}}; }
    const r=Math.random(); if(r<.4) return {fam:'col',p:{a:rnd(3,6),b:rnd(1,4)}}; return {fam:r<.7?'esc':'cua',p:{}};
  },
  gen(nivel, forzar){
    let par, tarea, N, m, clave, intentos=0;
    do{
      par=this.params(nivel);
      const ts = nivel===1?[['elegir',.35],['cuantos',.4],['tabla',.25]]: nivel===2?[['cuantos',.35],['elegir',.2],['tabla',.45]]:[['cuantos',.4],['elegir',.1],['tabla',.5]];
      let r=Math.random(),a=0; tarea=ts[ts.length-1][0]; for(const [t,p] of ts){ a+=p; if(r<a){ tarea=t; break; } }
      if(forzar) tarea=forzar;
      m = nivel===2 && par.fam==='col' && Math.random()<.4 ? 4 : 3;
      if(nivel===3 && par.fam==='esc') m=4;
      N = nivel===1? rnd(4,5) : nivel===2? rnd(m+2,m+5) : rnd(10,20);
      if(par.fam!=='col' && nivel===3) N=rnd(8,12);
      if(tarea==='elegir') N=m+1;
      clave = [par.fam,par.p.a,par.p.b].join('-');
      if(recienteOk(this.rec, clave, 3) || intentos>25) break;
      intentos++;
    } while(true);
    anotar(this.rec, clave);
    const e={nivel, fam:par.fam, p:par.p, tarea, m, N, hint:0, mal:0, extra:0};
    if(tarea==='elegir') e.opciones=this.opcionesFig(e);
    if(tarea==='tabla'){   // completar la tabla paso a paso: figuras siguientes y, en niveles 2 y 3, una figura lejana
      const kmax = nivel===1? m+2 : m+3; e.ks=[]; for(let n=m+1;n<=kmax;n++) e.ks.push(n);
      if(nivel>1){ let L = nivel===2? rnd(8,10) : (par.fam==='col'? rnd(10,20) : rnd(8,12)); if(L<=kmax+1) L=kmax+2; e.ks.push(L); e.N=L; }
      else e.N=kmax;
    }
    if(tarea==='cuantos') e.ans=Tfig(e.fam,e.p,e.N);
    return e;
  },
  opcionesFig(e){
    const n=e.m+1, bien=celdas(e.fam,e.p,n), sb=sigC(bien);
    const cand=[];
    const add=(c,etq)=>{ if(c.length) cand.push({c,etq}); };
    add(celdas(e.fam,e.p,n-1),'ant'); add(celdas(e.fam,e.p,n+1),'sig');
    const sinUna=bien.slice(); sinUna.splice(sinUna.length-1,1); add(sinUna,'menos');
    if(e.fam==='col'){

      add(celdas('col',{a:e.p.a,b:e.p.b+1},n)); if(e.p.b>0) add(celdas('col',{a:e.p.a,b:e.p.b-1},n));
    } else if(e.fam==='esc'){ add(celdas('cua',{},n-1)); add(celdas('esc',{},n+1)); }
    else { add(celdas('esc',{},n)); add(celdas('cua',{},n+1)); }
    const vistos=new Set([sb]), dist=[];
    barajar(cand).forEach(q=>{ const s=sigC(q.c); if(dist.length<3 && !vistos.has(s)){ vistos.add(s); dist.push(q.c); } });
    const todas=barajar([bien,...dist]);
    let W=0,H=0; todas.forEach(c=>{ const d=dimsC(c); W=Math.max(W,d.w); H=Math.max(H,d.h); });
    return {lista:todas.map(c=>({c,ok:sigC(c)===sb})), W, H};
  },
  pintar(e){
    const h=$('#herram'); h.innerHTML='';
    if(e.tarea==='elegir'){
      setConsigna(`¿Cómo será la <b>figura ${e.N}</b>?`);
      h.appendChild(filaOpciones(e.opciones.lista, o=>miniFig(o.c,e.opciones.W,e.opciones.H), (o,b)=>{

        else { b.classList.add('mal'); malo('Esa figura no sigue el crecimiento. Mira qué cambia de la figura 1 a la 2 y a la 3.'); }
      }, 'fig'));

  tablaHTML(e, conHuecos){
    const ns=[1,2,3,4,5,6];
    let t='<table class="tabla"><tr><th>n</th>'+ns.map(n=>`<td>${n}</td>`).join('')+'</tr><tr><th>Resultado</th>';
    ns.forEach(n=>{ if(conHuecos && e.blancos.includes(n)) t+=`<td class="hueco"><input class="entrada" data-n="${n}" type="text" inputmode="numeric" maxlength="3" autocomplete="off"></td>`; else t+=`<td>${e.T(n)}</td>`; });
    t+='</tr>';
    if(e.hint>=2){ t+='<tr><th></th>'; ns.forEach((n,i)=>{ t+= i<5? `<td class="dif">${(e.T(n+1)-e.T(n))>=0?'+':''}${e.T(n+1)-e.T(n)}</td>`:'<td class="dif"></td>'; }); t+='</tr>'; }
    return t+'</table>';
  },
  pintar(e){
    const h=$('#herram'); h.innerHTML='';
    if(e.tipo==='tabla'){
      setConsigna('Completa la tabla: <b>descubre la regla</b>');
      Reg.zona(e);
      const b=document.createElement('button'); b.className='btn verde'; b.type='button'; b.textContent='Comprobar'; b.onclick=()=>Reg.revisarTabla(e); h.appendChild(b);
    } else {
      setConsigna(e.tipo==='palabras'?'¿Qué regla da <b>los cuadritos</b> a partir del número de figura <b>n</b>?':'¿Qué <b>expresión</b> da el resultado para cualquier <b>n</b>?');
      Reg.zona(e);
      h.appendChild(filaOpciones(e.opciones,o=>o.txt,(o,b)=>{
        if(o.ok){ b.classList.add('bien'); bueno(`¡Correcto! La regla es <b>${expr(e.A,e.B)}</b>${e.tipo==='simbolos'?' (n es el número de la figura)':''}.`,1800); }
        else { const n=[1,2,3,4].find(n=>o.A*n+o.B!==e.T(n)); b.classList.add('mal');
          malo(`Prueba con <b>n = ${n}</b>: esa regla daría <b>${o.A*n+o.B}</b>, pero en la tabla hay <b>${e.T(n)}</b>.`); }
      },'mat'));
    }
    h.appendChild(botonPista());
  },
  zona(e){
    let html='';
    if(e.tipo==='tabla'){
      const guardados={}; document.querySelectorAll('#zona input[data-n]').forEach(i=>guardados[i.dataset.n]=i.value);
      html = Reg.figs(e)+Reg.tablaHTML(e,true);
      $('#zona').innerHTML=html;
      document.querySelectorAll('#zona input[data-n]').forEach(i=>{ if(guardados[i.dataset.n]!==undefined) i.value=guardados[i.dataset.n]; i.addEventListener('keydown',ev=>{ if(ev.key==='Enter') Reg.revisarTabla(e); }); });
      return;
    }
    const ns=[1,2,3,4];
    const t='<table class="tabla"><tr><th>n</th>'+ns.map(n=>`<td>${n}</td>`).join('')+'</tr><tr><th>Cuadritos</th>'+ns.map(n=>`<td>${e.T(n)}</td>`).join('')+'</tr>'+
      (e.hint>=2?'<tr><th></th>'+ns.map((n,i)=>i<3?`<td class="dif">+${e.T(n+1)-e.T(n)}</td>`:'<td class="dif"></td>').join('')+'</tr>':'')+'</table>';
    $('#zona').innerHTML=Reg.figs(e)+t;
  },
  revisarTabla(e){
    if(bloqueado) return;
    const inp=[...document.querySelectorAll('#zona input[data-n]')]; let todo=true, alguno=false;
    inp.forEach(i=>{ const v=i.value.trim(); if(v===''||!/^-?\d+$/.test(v)){ todo=false; i.style.borderColor='var(--accent)'; return; } alguno=true;
      if(parseInt(v,10)===e.T(+i.dataset.n)) i.style.borderColor='var(--primary)'; else { todo=false; limpiarMal(i); } });
    if(todo){
      bueno(`¡Correcto! La regla es <b>${expr(e.A,e.B)}</b>${e.dec?` (parte de ${e.B} y baja ${-e.A} en cada paso)`:''}.`,1800);
    } else {
      e.mal++;
      malo(alguno? 'Hay números que no encajan. Mira cuánto cambia el resultado de un paso al siguiente.' : 'Completa los espacios con números.');
      if(e.mal>=2) aviso($('#msg').innerHTML+' Usa la 💡 Pista.', 'mal');
    }
  },
  pista(e,n){
    e.hint=Math.min(3,n);
    if(e.tipo==='tabla' || e.hint>=2) Reg.zona(e);
    const dif = e.dec? -e.A : e.A;
    const t=[null,e.tipo==='tabla'?'Mira cuánto cambia el resultado cada vez que <b>n</b> sube 1.':'Reemplaza <b>n</b> por 1, 2 y 3 en cada opción y compara con la tabla.',
      `Los números de abajo muestran cuánto ${e.dec?'baja':'sube'} el resultado en cada paso.`,
      e.dec? `Baja ${dif} en cada paso. Si n=1 el resultado es ${e.T(1)}: ¿cuánto había en n=0?` : `Sube ${dif} en cada paso, así que n se multiplica por ${dif}. Mira n=1: ¿cuánto sobra?`];
    aviso(t[Math.min(e.hint,3)],'casi');
  }
};
ACT.reglas = Reg;

/* =========================================================
   5) CREA TU PROPIO PATRÓN (libre, sin puntaje)
   ========================================================= */
const CreaSimb = FORMAS.map((f,i)=>({f,c:PALETA[i]}));
const Crea = {
  libre:true, seq:[], modo:'crear', reto:null,
  periodo(seq){
    const L=seq.length;
    for(let P=1;P<=Math.floor(L/2);P++){ let ok=true; for(let i=P;i<L;i++) if(claveT(seq[i])!==claveT(seq[i-P])){ ok=false; break; } if(ok) return P; }
    return 0;
  },
  casi(seq){
    const L=seq.length;
    for(let P=2;P<=Math.floor(L/3);P++){ const mal=[]; for(let i=P;i<L;i++) if(claveT(seq[i])!==claveT(seq[i-P])) mal.push(i); if(mal.length===1) return {P,i:mal[0]}; }
    return null;
  },
  iniciar(){ Crea.seq=[]; Crea.modo='crear'; Crea.reto=null; bloqueado=false; setConsigna('Inventa un patrón: toca las piezas para ponerlas en fila'); aviso(''); Crea.pintar(); },
  pintar(opts={}){
    const h=$('#herram'); h.innerHTML='';
    const z=$('#zona');
    const L=Crea.seq.length, P=Crea.periodo(Crea.seq);
    if(Crea.modo==='reto'){
      const r=Crea.reto;
      const items=Crea.seq.map((t,i)=>i===r.idx?{q:1}:t);
      z.innerHTML=Crea.svg(Crea.seq,{P:r.P,ciclos:true,q:r.idx});
      h.appendChild(filaOpciones(r.ops,t=>piezaMini(t),(t,b)=>{
        if(claveT(t)===claveT(r.ans)){ b.classList.add('bien'); tintineo(); aviso('¡Muy bien! Descubriste la pieza que faltaba en tu propio patrón.','bien'); bloqueado=true;
          h.innerHTML=''; const s=document.createElement('button'); s.className='btn siguiente'; s.type='button'; s.textContent='Seguir creando'; s.onclick=()=>{ bloqueado=false; Crea.modo='crear'; aviso(''); setConsigna('Inventa un patrón: toca las piezas para ponerlas en fila'); Crea.pintar(); }; h.appendChild(s);
          z.innerHTML=Crea.svg(Crea.seq,{P:r.P,ciclos:true}); }
        else { b.classList.add('mal'); errorSnd(); aviso('Esa no. Mira qué parte se repite.','mal'); }
      }));
      return;
    }
    z.innerHTML = L? Crea.svg(Crea.seq,{P:opts.P||0,ciclos:!!opts.P,hl:opts.hl}) : '<div class="cons-nota" style="font-size:1.05rem">Tu fila está vacía. Toca una pieza de abajo para empezar.</div>';
    const pal=document.createElement('div'); pal.className='pal';
    CreaSimb.forEach(t=>{ const b=document.createElement('button'); b.type='button'; b.innerHTML=piezaMini(t); b.onclick=()=>{ if(Crea.seq.length>=12){ aviso('Ya tienes 12 piezas. Comprueba tu patrón.','casi'); return; } Crea.seq.push(t); tono(520,.07); aviso(''); Crea.pintar(); }; pal.appendChild(b); });
    h.appendChild(pal);
    const c=document.createElement('div'); c.className='herram';
    const bb=(txt,cls,fn)=>{ const b=document.createElement('button'); b.className='btn '+cls; b.type='button'; b.textContent=txt; b.onclick=fn; c.appendChild(b); return b; };
    bb('⌫ Borrar','',()=>{ Crea.seq.pop(); aviso(''); Crea.pintar(); });
    bb('🗑','',()=>{ Crea.seq=[]; aviso(''); Crea.pintar(); });
    bb('🔎 ¿Es patrón?','verde',()=>Crea.analizar());
    if(opts.P) bb('🎯 Retarme','azul',()=>Crea.retar(opts.P));
    h.appendChild(c);
  },
  svg(seq,o){
    const n=seq.length, S=60, RH=84;
    let s=`<svg viewBox="0 0 ${Math.max(n,5)*S+16} ${RH+8}">`;
    for(let i=0;i<n;i++){
      const cx=8+i*S+S/2, cy=4+RH/2;
      const fill = o.ciclos&&o.P ? (Math.floor(i/o.P)%2?'rgba(255,255,255,.11)':'rgba(255,255,255,.035)') : 'transparent';
      s+=`<rect x="${cx-S/2+2}" y="${cy-RH/2+4}" width="${S-4}" height="${RH-8}" rx="12" fill="${fill}"/>`;
      if(o.q===i) s+=`<rect x="${cx-26}" y="${cy-26}" width="52" height="52" rx="12" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="7 6"/><text x="${cx}" y="${cy+13}" text-anchor="middle" font-size="36" fill="#fbbf24">?</text>`;
      else s+=pieza(seq[i],cx,cy,22);
      if(o.hl===i) s+=`<rect x="${cx-S/2+3}" y="${cy-RH/2+5}" width="${S-6}" height="${RH-10}" rx="12" fill="rgba(251,113,133,.25)" stroke="#fb7185" stroke-width="3"/>`;
    }
    return s+'</svg>';
  },
  analizar(){
    const seq=Crea.seq, L=seq.length;
    if(L<4){ aviso('Pon al menos 4 piezas para ver si se repite algo.','casi'); return; }
    const P=Crea.periodo(seq);
    if(P){
      Crea.pintar({P});
      const nota = P===1? 'Siempre es la misma pieza: es un patrón, ¡pero muy simple!' : `La parte que se repite tiene <b>${P}</b> piezas.`;
      aviso(`✅ ¡Es un patrón! ${nota}`,'bien'); tintineo();
    } else {
      const c=Crea.casi(seq);
      if(c){ Crea.pintar({hl:c.i}); aviso(`Casi: parece que se repite cada ${c.P} piezas, pero la pieza <b>${c.i+1}</b> rompe el patrón.`,'casi'); }
      else { Crea.pintar(); aviso('Todavía no veo una parte que se repita al menos dos veces. Prueba con una unidad corta y repítela.','casi'); }
      errorSnd();
    }
  },
  retar(P){
    const seq=Crea.seq, L=seq.length;
    const idx=rnd(1,L-2), ans=seq[idx];
    const unit=seq.slice(0,P);
    const ops=Det.opciones(ans,unit,CreaSimb);
    Crea.reto={P,idx,ans,ops}; Crea.modo='reto';
    setConsigna('¿Qué pieza <b>falta</b> en tu patrón?'); aviso('');
    Crea.pintar();
  }
};
ACT.crea = Crea;
