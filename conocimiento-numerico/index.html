<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Laboratorio de Números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS DE DISEÑO — idénticos a Suma y Resta
   ========================================================= */
:root{
  --bg-1:#1e1147; --bg-2:#3b1785; --bg-3:#5b21b6;
  --surface:rgba(255,255,255,.07); --surface-strong:rgba(255,255,255,.12);
  --border-soft:rgba(255,255,255,.14);
  --primary:#34d399; --primary-dark:#0f9d70;
  --accent:#fbbf24; --accent-soft:#fde68a;
  --pink:#f472b6; --blue:#38bdf8;
  --error:#fb7185;
  --text:#f6f3ff; --text-dim:#c9bdf0; --text-faint:#8f7fc4;
  --r-lg:22px; --r-md:16px; --r-sm:10px;
  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;
  --shadow-1: 0 10px 30px rgba(0,0,0,.35);
  --tap-min: 48px;

  /* colores de bloques base-10 */
  --b-mil:#ef4444; --b-mil-dark:#7f1d1d;
  --b-cen:#38bdf8; --b-cen-dark:#0369a1;
  --b-dec:#34d399; --b-dec-dark:#0f9d70;
  --b-uni:#fbbf24; --b-uni-dark:#b45309;
}
*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; width:100%; overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
h1,h2,h3{font-family:var(--font-display); margin:0;}
input{font-family:inherit;}
.hidden{display:none !important;}
:focus-visible{ outline:3px solid var(--accent); outline-offset:2px; border-radius:6px; }
@media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important; transition-duration:.001ms !important;} }

#app{
  min-height:100vh; display:flex; flex-direction:column;
  width:100%; max-width:900px; margin:0 auto;
  padding: clamp(10px, 2.5vw, 24px);
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}
.app-header{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:6px 2px 14px; flex-wrap:wrap;
}
.app-header .side{ display:flex; align-items:center; gap:6px; flex:1 1 auto; min-width:70px; }
.app-header .side.right{ justify-content:flex-end; }
.icon-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--surface); border:1px solid var(--border-soft); color:var(--text);
  padding:9px 12px; border-radius:999px; font-weight:700;
  font-size:clamp(.75rem, 2vw, .9rem); cursor:pointer; min-height:var(--tap-min);
  transition: background .15s, transform .1s; white-space:nowrap;
}
.icon-btn:hover{ background:var(--surface-strong); }
.icon-btn:active{ transform:scale(.96); }
main{ flex:1; display:flex; flex-direction:column; }
.screen{ display:flex; flex-direction:column; align-items:center; animation: fadeSlideIn .35s ease both; }
@keyframes fadeSlideIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:translateY(0); } }
.card{
  width:100%; background:var(--surface); border:1px solid var(--border-soft);
  border-radius:var(--r-lg); padding:clamp(16px, 4vw, 32px); box-shadow:var(--shadow-1);
  backdrop-filter: blur(6px);
}
.home-title{ text-align:center; font-size:clamp(1.4rem, 5vw, 2.2rem); font-weight:800; margin-bottom:6px; }
.home-sub{
  text-align:center; color:var(--text-dim); font-size:clamp(.9rem, 2.4vw, 1.05rem);
  margin:0 auto clamp(18px,4vw,28px); max-width:46ch;
}
.mode-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:clamp(10px, 2.5vw, 16px); width:100%; }
@media (max-width:480px){ .mode-grid{ grid-template-columns:1fr; } }
.mode-btn{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:clamp(16px,4vw,22px) 10px; border-radius:var(--r-md); border:1px solid var(--border-soft);
  color:var(--text); cursor:pointer; font-family:var(--font-display); font-weight:700;
  font-size:clamp(1rem, 2.6vw, 1.15rem); min-height:110px; transition:transform .15s;
}
.mode-btn:hover{ transform:translateY(-3px); }
.mode-btn:active{ transform:scale(.97); }
.mode-btn .emoji{ font-size:clamp(1.6rem, 5vw, 2.1rem); }
.mode-btn.practica{ background:linear-gradient(140deg,#0f9d70,#34d399); }
.mode-btn.exploracion{ background:linear-gradient(140deg,#1d4ed8,#38bdf8); }
.mode-btn.desafios{ background:linear-gradient(140deg,#b91c66,#f472b6); }
.mode-btn small{ font-family:var(--font-body); font-weight:600; opacity:.85; font-size:.72em; }

.level-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:clamp(10px, 2.5vw, 16px); width:100%; }
@media (max-width:480px){ .level-grid{ grid-template-columns:1fr; } }
.level-btn{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  padding:clamp(14px,3.5vw,20px) 10px; border-radius:var(--r-md); border:1px solid var(--border-soft);
  color:var(--text); cursor:pointer; font-family:var(--font-display); font-weight:700;
  font-size:clamp(.95rem, 2.4vw, 1.1rem); min-height:90px; transition:transform .15s;
}
.level-btn:hover{ transform:translateY(-3px); }
.level-btn:active{ transform:scale(.97); }
.level-btn .emoji{ font-size:clamp(1.4rem, 4vw, 1.8rem); }
.level-btn small{ font-family:var(--font-body); font-weight:600; opacity:.85; font-size:.72em; }
footer.credits{ text-align:center; color: var(--text-faint); font-weight:700; font-size:.78rem; padding:20px 10px 4px; width:100%; }
.level-btn.easy{ background:linear-gradient(140deg,#0f9d70,#34d399); }
.level-btn.mid{ background:linear-gradient(140deg,#1d4ed8,#38bdf8); }
.level-btn.hard{ background:linear-gradient(140deg,#b91c66,#f472b6); }
.level-btn.special{ background:linear-gradient(140deg,#92400e,#fbbf24); color:#2b1a02; }

.challenge-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:clamp(10px, 2.5vw, 14px); width:100%; }
@media (max-width:480px){ .challenge-grid{ grid-template-columns:1fr; } }
.challenge-btn{
  display:flex; align-items:center; gap:10px; text-align:left;
  padding:14px 16px; border-radius:var(--r-md); border:1px solid var(--border-soft);
  background:var(--surface-strong); color:var(--text); cursor:pointer;
  font-family:var(--font-display); font-weight:700; font-size:clamp(.9rem, 2.2vw, 1.02rem);
  min-height:64px; transition:transform .15s, background .15s;
}
.challenge-btn:hover{ transform:translateY(-2px); background:rgba(255,255,255,.16); }
.challenge-btn .emoji{ font-size:1.5em; flex:0 0 auto; }
.challenge-btn .txt small{ display:block; font-family:var(--font-body); font-weight:600; color:var(--text-dim); font-size:.75em; margin-top:2px; }

.primary-btn{
  padding:14px; border-radius:var(--r-md); border:none;
  background:linear-gradient(135deg, var(--primary), #10b981); color:#062b1c;
  font-family:var(--font-display); font-weight:800; font-size:clamp(1rem, 2.8vw, 1.15rem);
  cursor:pointer; min-height:52px; box-shadow:0 6px 18px rgba(52,211,153,.35);
  transition:transform .12s;
}
.primary-btn:hover{ transform:translateY(-2px); }
.primary-btn:active{ transform:scale(.98); }
.primary-btn:disabled{ background:#4b4b5a; color:#9a9aab; box-shadow:none; cursor:not-allowed; transform:none; }
.secondary-btn{
  padding:12px; border-radius:var(--r-md); border:1px solid var(--border-soft);
  background:var(--surface-strong); color:var(--text); font-weight:700; cursor:pointer; min-height:48px;
}
.secondary-btn:hover{ background:var(--surface); border-color:var(--accent); }

/* =========================================================
   BLOQUES BASE-10
   ========================================================= */
.block{
  position:relative; display:inline-flex; align-items:center; justify-content:center;
  border-radius:6px; font-family:var(--font-display); font-weight:800; color:rgba(0,0,0,.55);
  box-shadow: 0 3px 8px rgba(0,0,0,.35), inset 0 0 0 1.5px rgba(255,255,255,.3);
  animation: blockIn .3s cubic-bezier(.34,1.56,.64,1);
  flex:0 0 auto;
}
@keyframes blockIn{ from{ transform:scale(.3); opacity:0; } to{ transform:scale(1); opacity:1; } }
.block.uni{ width:clamp(16px,4.4vw,22px); height:clamp(16px,4.4vw,22px); background:linear-gradient(145deg, var(--b-uni), var(--b-uni-dark)); }
.block.dec{ width:clamp(16px,4.4vw,22px); height:clamp(66px,18vw,100px); background:linear-gradient(145deg, var(--b-dec), var(--b-dec-dark));
  display:flex; flex-direction:column; }
.block.dec::before{
  content:''; position:absolute; inset:2px; background-image:repeating-linear-gradient(to bottom, transparent 0 9%, rgba(255,255,255,.25) 9% 10%);
  border-radius:4px;
}
.block.cen{ width:clamp(66px,18vw,100px); height:clamp(66px,18vw,100px); background:linear-gradient(145deg, var(--b-cen), var(--b-cen-dark)); }
.block.cen::before{
  content:''; position:absolute; inset:2px;
  background-image:
    repeating-linear-gradient(to right, transparent 0 9%, rgba(255,255,255,.22) 9% 10%),
    repeating-linear-gradient(to bottom, transparent 0 9%, rgba(255,255,255,.22) 9% 10%);
  border-radius:4px;
}
.block.mil{
  width:clamp(58px,16vw,88px); height:clamp(58px,16vw,88px);
  margin: 12px 12px 0 0;
  background:
    repeating-linear-gradient(to right, transparent 0 9%, rgba(0,0,0,.28) 9% 10%),
    repeating-linear-gradient(to bottom, transparent 0 9%, rgba(0,0,0,.28) 9% 10%),
    linear-gradient(155deg, var(--b-mil), var(--b-mil-dark));
  box-shadow: 3px 4px 10px rgba(0,0,0,.45);
}
.block.mil::before{
  /* cara superior: su borde INFERIOR queda anclado (bottom:100%) exactamente
     sobre el borde superior de la cara frontal — por eso nunca se separa. */
  content:'';
  position:absolute;
  left:0; bottom:100%; width:100%; height:12px;
  background:
    repeating-linear-gradient(100deg, transparent 0 9%, rgba(0,0,0,.3) 9% 10%),
    linear-gradient(100deg, #fca5a5, var(--b-mil));
  transform-origin: bottom left;
  transform: skewX(-45deg);
}
.block.mil::after{
  /* cara lateral: su borde IZQUIERDO queda anclado (left:100%) exactamente
     sobre el borde derecho de la cara frontal, de arriba a abajo. */
  content:'';
  position:absolute;
  left:100%; top:0; width:12px; height:100%;
  background:
    repeating-linear-gradient(to bottom, transparent 0 9%, rgba(0,0,0,.32) 9% 10%),
    linear-gradient(190deg, var(--b-mil-dark), #4c0a0a);
  transform-origin: top left;
  transform: skewY(-45deg);
}
.block-mini{ transform:scale(.42); margin:-8px; }

/* En celular, los bloques grandes (centena/mil) dejaban solo 3 por fila.
   Se achican para que quepan al menos 6, sin perder legibilidad. */
@media (max-width:480px){
  .block.uni{ width:11px; height:11px; }
  .block.dec{ width:11px; height:42px; }
  .block.cen{ width:42px; height:42px; }
  .block.mil{ width:38px; height:38px; margin:8px 8px 0 0; }
  .block.mil::before{ height:8px; }
  .block.mil::after{ width:8px; }
  .build-mat{ gap:6px; padding:10px; }
  .mat-group{ gap:4px; margin-right:6px; }
}
.block.removable{ cursor:pointer; }
.block.removable:active{ transform:scale(.9); }
.block.leaving{ animation: blockOut .25s ease forwards; }
@keyframes blockOut{ to{ transform:scale(.2); opacity:0; } }

.block-tray{
  display:flex; justify-content:center; gap:clamp(8px, 3vw, 18px); flex-wrap:wrap;
  padding:14px; margin-bottom:14px; width:100%;
}
.tray-btn{
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:6px;
  background:var(--surface-strong); border:2px solid var(--border-soft); border-radius:var(--r-md);
  padding:10px 14px; cursor:pointer; min-height:var(--tap-min); min-width:74px;
  transition:transform .12s, border-color .12s;
}
.tray-btn:hover{ border-color:var(--accent); transform:translateY(-2px); }
.tray-btn:active{ transform:scale(.95); }
.tray-btn .lbl{ font-family:var(--font-display); font-weight:800; font-size:.78rem; color:var(--text-dim); }
.tray-btn.selected{ border-color:var(--primary); background:rgba(52,211,153,.18); animation: pop .3s ease; }
.tray-btn.wrong{ border-color:var(--error); background:rgba(251,113,133,.18); }
.tray-btn:disabled{ opacity:.5; cursor:not-allowed; }
.tray-btn:disabled:hover{ transform:none; border-color:var(--border-soft); }
@media (max-width:420px){
  .block-tray{ gap:6px; padding:10px 4px; }
  .tray-btn{ padding:8px 4px; min-width:0; flex:1 1 0; gap:4px; }
  .tray-btn .lbl{ font-size:.62rem; }
}
.tray-btn .swatch{ width:26px; height:26px; border-radius:5px; align-self:center; }
.tray-btn.mil .swatch{ background:linear-gradient(145deg, var(--b-mil), var(--b-mil-dark)); width:28px; height:28px; }
.tray-btn.cen .swatch{ background:linear-gradient(145deg, var(--b-cen), var(--b-cen-dark)); width:22px; height:22px; }
.tray-btn.dec .swatch{ background:linear-gradient(145deg, var(--b-dec), var(--b-dec-dark)); width:8px; height:26px; }
.tray-btn.uni .swatch{ background:linear-gradient(145deg, var(--b-uni), var(--b-uni-dark)); width:9px; height:9px; }

.build-mat{
  width:100%; min-height:120px; background:rgba(0,0,0,.18); border:2px dashed var(--border-soft);
  border-radius:var(--r-md); padding:14px; margin-bottom:14px;
  display:flex; flex-wrap:wrap; align-content:flex-start; gap:8px;
}
.mat-group{ display:flex; flex-wrap:wrap; gap:6px; align-items:flex-end; margin-right:10px; }
.mat-empty-msg{ color:var(--text-faint); font-weight:700; margin:auto; text-align:center; }

/* barra que representa un grupo ya formado (10 unidades -> 1 decena, etc.) */
.group-bar{
  display:flex; align-items:center; justify-content:center;
  border-radius:8px; font-family:var(--font-display); font-weight:800; color:#fff;
  animation: blockIn .4s cubic-bezier(.34,1.56,.64,1);
}

.feedback-msg{ width:100%; text-align:center; font-weight:700; min-height:1.6em; margin-bottom:8px; font-size:clamp(.85rem, 2.3vw, 1rem); }
.feedback-msg.ok{ color:var(--primary); }
.feedback-msg.err{ color:var(--error); }
.shake{ animation: shake .4s; }
@keyframes shake{ 10%,90%{ transform:translateX(-2px); } 20%,80%{ transform:translateX(4px); } 30%,50%,70%{ transform:translateX(-8px); } 40%,60%{ transform:translateX(8px); } }
@keyframes pop{ 0%{ transform:scale(.4); opacity:0; } 70%{ transform:scale(1.15); } 100%{ transform:scale(1); opacity:1; } }

/* =========================================================
   TARJETAS DE REGISTRO (número / nombre / bloques) EN PRÁCTICA
   ========================================================= */
.register-card{
  width:100%; border-radius:var(--r-md); border:2px solid var(--border-soft);
  background:var(--surface); padding:clamp(10px,2.5vw,16px); margin-bottom:10px;
}
.register-card.shown{ border-color:var(--accent); background:rgba(251,191,36,.08); }
.register-card.solved{ border-color:var(--primary); background:rgba(52,211,153,.08); }
.register-label{ font-family:var(--font-display); font-weight:800; font-size:.85rem; color:var(--text-dim); margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em; }
/* Mismo alto que la fila de "completar", para que las 3 tarjetas se vean
   parejas sin importar cuál le tocó mostrar al azar. */
.register-display{
  font-family:var(--font-display); font-weight:800; font-size:clamp(1.05rem, 3.6vw, 1.4rem);
  text-align:center; color:var(--accent-soft);
  min-height:var(--tap-min); display:flex; align-items:center; justify-content:center;
}

/* Fila única de verdad: SIN flex-wrap, con anchos fijos (no flex-grow) en
   la etiqueta y el botón, para que nunca se desborden ni se disparen de
   tamaño en pantallas anchas. El input es lo único que cede espacio. */
.register-inline-row{ display:flex; align-items:center; gap:6px; width:100%; }
.register-label-inline{
  flex:0 0 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:34%;
  font-family:var(--font-display); font-weight:800; font-size:clamp(.68rem, 2.2vw, .8rem); color:var(--text-dim);
  text-transform:uppercase; letter-spacing:.02em;
}
.register-inline-row input{
  flex:1 1 0; min-width:0; background:var(--surface-strong); border:2px solid var(--border-soft);
  border-radius:var(--r-sm); color:var(--text); font-family:var(--font-display); font-weight:700;
  font-size:clamp(.9rem, 2.8vw, 1.1rem); text-align:center; padding:9px 4px; min-height:var(--tap-min);
}
.register-inline-row input.narrow{ flex:0 0 56px; }
.register-display-inline{
  flex:1 1 auto; min-width:0; background:var(--surface-strong); border:2px solid var(--border-soft);
  border-radius:var(--r-sm); color:var(--accent-soft); font-family:var(--font-display); font-weight:800;
  font-size:clamp(1.05rem, 3.6vw, 1.4rem); text-align:center; padding:9px 6px; min-height:var(--tap-min);
  display:flex; align-items:center; justify-content:center;
}

.timer-header-pill{
  display:inline-flex; align-items:center; gap:6px; background:rgba(251,191,36,.14); border:1px solid rgba(251,191,36,.4);
  color:var(--accent); padding:8px 14px; border-radius:999px; font-weight:800; font-family:var(--font-display); font-size:.82rem;
}
.timer-header-pill.contador{ background:rgba(52,211,153,.14); border-color:rgba(52,211,153,.4); color:var(--primary); }

.modo-opciones{ display:flex; flex-direction:column; gap:10px; margin-top:4px; }
.modo-btn{
  padding:16px 14px; border-radius:var(--r-md); border:2px solid var(--border-soft);
  background:var(--surface-strong); color:var(--text); cursor:pointer;
  font-family:var(--font-display); font-weight:800; font-size:1rem; line-height:1.6;
  transition: transform .12s, border-color .15s, background .15s;
}
.modo-btn:hover{ transform:translateY(-2px); border-color:var(--accent); }
.modo-btn:active{ transform:scale(.97); }
.modo-desc{ font-size:.75rem; font-weight:600; color:var(--text-dim); }
.modal-campo{
  width:100%; padding:12px; margin-bottom:10px; border-radius:var(--r-md); border:2px solid var(--border-soft);
  background:var(--surface-strong); color:var(--text); font-family:var(--font-display); font-weight:700; font-size:1.05rem; text-align:center;
}

/* Botón "comprobar" = solo un ✓ pequeño y circular. Tamaño fijo siempre:
   nunca crece (por eso el problema en PC), nunca se achica bajo el
   mínimo táctil. */
.check-btn{
  flex:0 0 auto; width:var(--tap-min); height:var(--tap-min); border-radius:50%;
  border:none; background:linear-gradient(135deg, var(--primary), #10b981); color:#062b1c;
  font-weight:900; font-size:1.2rem; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 10px rgba(52,211,153,.35); transition:transform .12s;
}
.check-btn:hover{ transform:translateY(-2px); }
.check-btn:active{ transform:scale(.9); }
.check-btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
.solved-check{ display:inline-flex; align-items:center; gap:6px; color:var(--primary); font-weight:800; font-family:var(--font-display); }

/* Input independiente (sin etiqueta ni botón en la misma fila) — Descubre
   el número y Completa lo usan para la respuesta final. */
.register-input-row{ display:flex; gap:8px; width:100%; }
.register-input-row input{
  flex:1 1 auto; min-width:0; background:var(--surface-strong); border:2px solid var(--border-soft);
  border-radius:var(--r-sm); color:var(--text); font-family:var(--font-display); font-weight:700;
  font-size:clamp(1rem, 3vw, 1.2rem); text-align:center; padding:10px; min-height:var(--tap-min);
}

/* =========================================================
   MODAL (diálogos varios)
   ========================================================= */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,4,30,.6); backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center; padding:16px; z-index:700;
}
.modal-box{
  width:100%; max-width:420px; background:linear-gradient(160deg, #2c1468, #4c1d95);
  border:1px solid var(--border-soft); border-radius:var(--r-lg); padding:clamp(18px,4vw,26px);
  box-shadow:0 20px 50px rgba(0,0,0,.5); animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn{ from{ transform:scale(.85); opacity:0; } to{ transform:scale(1); opacity:1; } }
.modal-eyebrow{ font-size:.78rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; text-align:center; }

<div id="modal-root"></div>

<script>
/* =====================================================================
   LABORATORIO DE NÚMEROS — LÓGICA
   Estructura:
   1. Utilidades numéricas (números a palabras, descomposición en bloques)
   2. Sonido
   3. Navegación
   4. Renderizado de bloques y bandeja de construcción (reutilizado por
      Práctica, Exploración y varios Desafíos)
   5. Modo Práctica
   6. Modo Exploración
   7. Menú de Desafíos
   8. Desafío: Descubre el número (agrupar)
   9. Desafío: Completa la representación
   10. Desafío: Colorea
   11. Desafío: Carrera contra el tiempo
   12. Resultado / celebración e inicialización
   ===================================================================== */

/* ---------------------------------------------------------------------
   1. UTILIDADES NUMÉRICAS
   --------------------------------------------------------------------- */
const UNITS = ['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve'];
const TEN_TO_29 = ['diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve',
  'veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const TENS = {3:'treinta',4:'cuarenta',5:'cincuenta',6:'sesenta',7:'setenta',8:'ochenta',9:'noventa'};
const HUNDREDS = {2:'doscientos',3:'trescientos',4:'cuatrocientos',5:'quinientos',6:'seiscientos',7:'setecientos',8:'ochocientos',9:'novecientos'};

function twoDigitsWords(n){
  if(n===0) return '';
  if(n<10) return UNITS[n];
  if(n<30) return TEN_TO_29[n-10];
  const t=Math.floor(n/10), u=n%10;
  return u===0 ? TENS[t] : `${TENS[t]} y ${UNITS[u]}`;
}
function threeDigitsWords(n){
  if(n===0) return '';
  if(n<100) return twoDigitsWords(n);
  const h=Math.floor(n/100), rest=n%100;
  if(h===1) return rest===0 ? 'cien' : `ciento ${twoDigitsWords(rest)}`;
  return rest===0 ? HUNDREDS[h] : `${HUNDREDS[h]} ${twoDigitsWords(rest)}`;
}
function numberToWords(n){
  let words;
  if(n<1000) words = threeDigitsWords(n);
  else { const rest = n%1000; words = rest===0 ? 'mil' : `mil ${threeDigitsWords(rest)}`; }
  return words.charAt(0).toUpperCase() + words.slice(1);
}
function normalizeText(s){
  return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
}
/* Distancia de Levenshtein estándar (número mínimo de ediciones para
   pasar de una cadena a otra). */
function levenshtein(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1}, (_,i)=>[i, ...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) dp[0][j] = j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}
/* Se acepta si el nombre escrito está lo bastante cerca del correcto —
   errores de ortografía (p. ej. "setesientos" por "setecientos") no
   deben bloquear a un estudiante que sí sabe nombrar el número. El
   margen crece con el largo del nombre, pero siempre exige coincidencia
   exacta de las palabras (no solo "se parece"). */
/* Además de la forma formal ("cuarenta y cinco"), se acepta la variante
   fusionada con "i" muy usada al escribir a mano ("cuarentaicinco"). */
/* Formas tradicionales "veinte y X" del 21 al 29, tan válidas como la
   fusionada "veintiX" — mismo criterio que "cuarenta y cinco"/"cuarentaicinco". */
const VEINTI_UNFUSED = {
  'veintiuno':'veinte y uno', 'veintidós':'veinte y dos', 'veintitrés':'veinte y tres',
  'veinticuatro':'veinte y cuatro', 'veinticinco':'veinte y cinco', 'veintiséis':'veinte y seis',
  'veintisiete':'veinte y siete', 'veintiocho':'veinte y ocho', 'veintinueve':'veinte y nueve',
};
function acceptableWordVariants(correctText){
  const variants = [correctText];
  if(/\sy\s/i.test(correctText)){
    variants.push(correctText.replace(/\s+y\s+/i, 'i'));
  }
  for(const fused in VEINTI_UNFUSED){
    const re = new RegExp('\\b'+fused+'\\b', 'i');
    if(re.test(correctText)){
      variants.push(correctText.replace(re, VEINTI_UNFUSED[fused]));
    }
  }
  return variants;
}
/* Devuelve {ok, exact}: ok = se acepta la respuesta; exact = coincide tal
   cual (sin errores) con alguna de las formas válidas. Cuando ok=true pero
   exact=false, el estudiante escribió cerca pero con algún error y merece
   un aviso correctivo, no solo un "correcto". */
function wordsMatch(userText, correctText){
  const a = normalizeText(userText);
  if(a === '') return {ok:false, exact:false};
  const variants = acceptableWordVariants(correctText).map(normalizeText);
  if(variants.includes(a)) return {ok:true, exact:true};
  const maxDist = Math.max(1, Math.round(variants[0].length * 0.1));
  const closest = Math.min(...variants.map(v=>levenshtein(a, v)));
  return {ok: closest <= maxDist, exact:false};
}

/* Descompone un número en dígitos por posición: {mil, cen, dec, uni} (0-9, mil es 0 o 1 en este rango) */
function decompose(n){
  const s = String(n).padStart(4,'0');
  return { mil:Number(s[0]), cen:Number(s[1]), dec:Number(s[2]), uni:Number(s[3]) };
}
function composeFromCounts(counts){
  return counts.mil*1000 + counts.cen*100 + counts.dec*10 + counts.uni;
}
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

const LEVEL_RANGES = { facil:[11,99], medio:[100,999], dificil:[1000,1999] };

/* ---------------------------------------------------------------------
   2. SONIDO
   --------------------------------------------------------------------- */
let audioCtx = null;
let soundOn = true;
function ensureAudio(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ audioCtx=null; } }
  return audioCtx;
}
function playTone(freq, dur, type='sine', vol=0.18){
  if(!soundOn) return;
  const ctx = ensureAudio(); if(!ctx) return;
  const osc = ctx.createOscillator(), gain = ctx.createGain();
  osc.type=type; osc.frequency.value=freq; gain.gain.value=vol;
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+dur);
  osc.connect(gain).connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime+dur);
}
function sfxOk(){ playTone(660,.12,'triangle'); setTimeout(()=>playTone(880,.15,'triangle'),90); }
function sfxErr(){ playTone(180,.22,'sawtooth',0.14); }
function sfxGroup(){ playTone(520,.1,'square',0.1); setTimeout(()=>playTone(780,.18,'square',0.12),80); setTimeout(()=>playTone(1040,.16,'square',0.1),160); }
function sfxWin(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>playTone(f,.22,'triangle'),i*110)); }

document.getElementById('btn-sound').addEventListener('click', ()=>{
  soundOn = !soundOn;
  document.getElementById('sound-icon').textContent = soundOn ? '🔊' : '🔇';
  document.getElementById('btn-sound').setAttribute('aria-pressed', String(soundOn));
  if(soundOn) ensureAudio();
});

/* ---------------------------------------------------------------------
   3. NAVEGACIÓN
   --------------------------------------------------------------------- */
const screens = {
  home: document.getElementById('screen-home'),
  practice: document.getElementById('screen-practice'),
  explore: document.getElementById('screen-explore'),
  challenges: document.getElementById('screen-challenges'),
  challenge: document.getElementById('screen-challenge'),
  result: document.getElementById('screen-result'),
};
const navStack = [];
function showScreen(name, pushToStack=true){
  if(pushToStack && state.screen && state.screen!==name) navStack.push(state.screen);
  Object.values(screens).forEach(s=>s.classList.add('hidden'));
  screens[name].classList.remove('hidden');
  state.screen = name;
  document.getElementById('app-header').classList.toggle('hidden', name==='home');
  document.getElementById('btn-back').style.visibility = (name==='home') ? 'hidden' : 'visible';
  window.scrollTo({top:0, behavior:'auto'});
}
document.getElementById('btn-back').addEventListener('click', ()=>{
  const prev = navStack.pop();
  showScreen(prev || 'home', false);
});

const state = { screen:null, mode:null, level:null };

document.querySelectorAll('.level-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    ensureAudio();
    if(btn.dataset.mode === 'desafios'){
      showScreen('challenges');
    } else {
      abrirSelectorModo(btn.dataset.level);
    }
  });
});
document.getElementById('btn-home').addEventListener('click', ()=>{ if(Contrarreloj.activo) detenerContrarreloj(); navStack.length=0; showScreen('home', false); });
document.getElementById('btn-home-header').addEventListener('click', ()=>{ if(Contrarreloj.activo) detenerContrarreloj(); navStack.length=0; showScreen('home', false); });

/* ---------------------------------------------------------------------
   4. RENDERIZADO DE BLOQUES Y BANDEJA DE CONSTRUCCIÓN
   Reutilizado por Práctica, Exploración y varios Desafíos.
   --------------------------------------------------------------------- */
const BLOCK_TYPES = [
  { key:'mil', cls:'mil', label:'U. de Mil', order:0 },
  { key:'cen', cls:'cen', label:'Centena', order:1 },
  { key:'dec', cls:'dec', label:'Decena', order:2 },
  { key:'uni', cls:'uni', label:'Unidad', order:3 },
];

function renderBlock(typeKey, mini){
  const div = document.createElement('div');
  div.className = 'block ' + typeKey + (mini ? ' block-mini' : '');
  return div;
}

/* Crea una paleta de 4 botones (Unidad de Mil/Centena/Decena/Unidad) que, al
   tocarlos, llaman a onAdd(typeKey). */
function buildTray(container, onAdd, opts={}){
  container.innerHTML = '';
  const types = opts.types || BLOCK_TYPES;
  types.forEach(t=>{
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tray-btn ' + t.cls;
    btn.innerHTML = `<span class="swatch"></span><span class="lbl">${t.label}</span>`;
    btn.addEventListener('click', ()=>onAdd(t.key));
    container.appendChild(btn);
  });
}

/* Dibuja el "mat" de construcción a partir de counts={mil,cen,dec,uni}.
   Si onRemove se entrega, cada bloque se puede tocar para quitarlo. */
function renderMat(container, counts, onRemove){
  container.innerHTML = '';
  const total = counts.mil+counts.cen+counts.dec+counts.uni;
  if(total===0){
    const msg = document.createElement('p');
    msg.className = 'mat-empty-msg';
    msg.textContent = 'Toca un bloque para empezar a construir';
    container.appendChild(msg);
    return;
  }
  BLOCK_TYPES.forEach(t=>{
    const n = counts[t.key];
    if(n<=0) return;
    const group = document.createElement('div');
    group.className = 'mat-group';
    for(let i=0;i<n;i++){
      const b = renderBlock(t.key, false);
      if(onRemove){
        b.classList.add('removable');
        b.addEventListener('click', ()=>onRemove(t.key));
      }
      group.appendChild(b);
    }
    container.appendChild(group);
  });
}
function blockPluralLabel(key){
  return { mil:'unidades de mil', cen:'centenas', dec:'decenas', uni:'unidades' }[key];
}
function blockSingularLabel(key){
  return { mil:'unidad de mil', cen:'centena', dec:'decena', uni:'unidad' }[key];
}
function blockEmoji(k){ return { mil:'🟥', cen:'🟦', dec:'🟩', uni:'🟨' }[k]; }

/* ---------------------------------------------------------------------
   5. MODO PRÁCTICA
   --------------------------------------------------------------------- */
let practiceTarget = null;   // número objetivo
let practiceHidden = [];     // qué registros debe completar el estudiante: subset de ['numero','nombre','bloques']
let practiceCounts = { mil:0, cen:0, dec:0, uni:0 };
let practiceSolved = { numero:false, nombre:false, bloques:false };

function startPractice(level){
  state.level = level;
  const [min,max] = LEVEL_RANGES[level];
  practiceTarget = randInt(min,max);
  const shown = ['numero','nombre','bloques'][randInt(0,2)];
  practiceHidden = ['numero','nombre','bloques'].filter(r=>r!==shown);
  practiceCounts = { mil:0, cen:0, dec:0, uni:0 };
  practiceSolved = { numero: shown==='numero', nombre: shown==='nombre', bloques: shown==='bloques' };
  renderPracticeCard(shown);
  showScreen('practice');
}

/* ---------------------------------------------------------------------
   MODO: PRÁCTICA LIBRE vs CONTRARRELOJ
   "1 completado" = llenar los DOS registros que faltan (de los tres:
   número, nombre, bloques) para el mismo número objetivo -- igual que
   ya exige maybeFinishPractice().
   --------------------------------------------------------------------- */
const NOMBRES_NIVEL_CR = { facil:'Fácil', medio:'Intermedio', dificil:'Difícil' };
const DURACION_CONTRARRELOJ = 150; // 2:30, en segundos
const Contrarreloj = { activo:false, restante:0, completados:0, errores:0, intervalo:null, nivel:null };

function abrirSelectorModo(nivel){
  const modalRoot = document.getElementById('modal-root');
  modalRoot.innerHTML = `
    <div class="modal-overlay">
      <div class="modal-box" role="dialog" aria-modal="true">

function startContrarreloj(nivel){
  Contrarreloj.activo = true;
  Contrarreloj.restante = DURACION_CONTRARRELOJ;
  Contrarreloj.completados = 0;
  Contrarreloj.errores = 0;
  Contrarreloj.nivel = nivel;
  document.getElementById('timer-pill').classList.remove('hidden');
  document.getElementById('contador-pill').classList.remove('hidden');
  document.getElementById('contador-pill').textContent = '✓ 0';
  actualizarTimerPill();
  if(Contrarreloj.intervalo) clearInterval(Contrarreloj.intervalo);
  Contrarreloj.intervalo = setInterval(tickContrarreloj, 1000);
  startPractice(nivel);
}
function tickContrarreloj(){
  Contrarreloj.restante--;
  actualizarTimerPill();
  if(Contrarreloj.restante <= 0){
    clearInterval(Contrarreloj.intervalo);
    Contrarreloj.intervalo = null;
    Contrarreloj.activo = false;
    mostrarFinContrarreloj();
  }
}
function actualizarTimerPill(){
  const m = Math.floor(Contrarreloj.restante/60), s = Contrarreloj.restante%60;
  document.getElementById('timer-pill').textContent = `⏱️ ${m}:${String(s).padStart(2,'0')}`;
}
function detenerContrarreloj(){
  if(Contrarreloj.intervalo){ clearInterval(Contrarreloj.intervalo); Contrarreloj.intervalo=null; }
  Contrarreloj.activo = false;
  document.getElementById('timer-pill').classList.add('hidden');
  document.getElementById('contador-pill').classList.add('hidden');
}
function mostrarFinContrarreloj(){

function checkPracticeNumero(){
  const input = document.getElementById('input-numero');
  const val = Number(input.value.trim());
  if(!input.value.trim()){ return; }
  if(val===practiceTarget){
    practiceSolved.numero = true;
    markRegisterSolved('numero');
    sfxOk(); practiceFeedback('¡Número correcto!', true);
    input.disabled = true;
    maybeFinishPractice();
  } else {
    if(Contrarreloj.activo){
      Contrarreloj.errores++;
      if(Online.activo) window.reportarProgresoOnline(Online.codigo, Online.uid, Contrarreloj.completados, Contrarreloj.errores);
    }
    sfxErr(); practiceFeedback('Ese número no es correcto. Vuelve a intentarlo.', false);
    document.getElementById('reg-numero').classList.add('shake');
    setTimeout(()=>document.getElementById('reg-numero').classList.remove('shake'), 400);
  }
}
function checkPracticeNombre(){
  const input = document.getElementById('input-nombre');
  if(!input.value.trim()){ return; }
  const correctWords = numberToWords(practiceTarget);
  const result = wordsMatch(input.value, correctWords);
  if(result.ok){
    practiceSolved.nombre = true;
    markRegisterSolved('nombre');
    input.disabled = true;
    if(result.exact){
      sfxOk(); practiceFeedback('¡Nombre correcto!', true);
      maybeFinishPractice();
    } else {
      sfxOk();
      showSpellingCorrection(correctWords, ()=>{
        practiceFeedback('¡Nombre aceptado!', true);
        maybeFinishPractice();
      });
    }
  } else {
    if(Contrarreloj.activo){
      Contrarreloj.errores++;
      if(Online.activo) window.reportarProgresoOnline(Online.codigo, Online.uid, Contrarreloj.completados, Contrarreloj.errores);
    }
    sfxErr(); practiceFeedback('Ese nombre no es correcto. Revisa la ortografía.', false);
    document.getElementById('reg-nombre').classList.add('shake');
    setTimeout(()=>document.getElementById('reg-nombre').classList.remove('shake'), 400);
  }
}
/* Aviso correctivo: la respuesta se acepta (para no frenar por una falta
   menor de ortografía), pero se muestra igual cómo se escribe bien, para

}

  const mat = document.getElementById('practice-mat');

let exploreCounts = { mil:0, cen:0, dec:0, uni:0 };
function startExplore(){
  exploreCounts = { mil:0, cen:0, dec:0, uni:0 };
  buildTray(document.getElementById('explore-tray'), addExploreBlock);
  renderExplore();
  showScreen('explore');
}
function addExploreBlock(k){
  exploreCounts[k]++;
  renderExplore();
  if(exploreCounts[k] >= 10){ triggerAutoGroup(k); }
}
/* Al reunir 10 bloques de un mismo tipo, se transforman solas en 1 del
   siguiente valor — igual que en la vida real, sin que el estudiante
   tenga que pedirlo. */
function triggerAutoGroup(k){
  const order = ['uni','dec','cen','mil'];
  const idx = order.indexOf(k);
  if(idx === order.length-1) return; // 'mil' no tiene un valor superior en este sistema
  const nextKey = order[idx+1];
  const mat = document.getElementById('explore-mat');
  const toAnimate = [...mat.querySelectorAll('.block.'+k)].slice(0,10);
  if(toAnimate.length < 10) return;
  sfxGroup();
  animateGroupTravel(toAnimate, k, ()=>{
    exploreCounts[k] -= 10;
    exploreCounts[nextKey] += 1;
    renderExplore();
    if(exploreCounts[nextKey] >= 10){ triggerAutoGroup(nextKey); }
  });
}
function renderExplore(){
  renderMat(document.getElementById('explore-mat'), exploreCounts, (k)=>{
    if(exploreCounts[k]>0) exploreCounts[k]--;
    renderExplore();
  });
  const n = composeFromCounts(exploreCounts);
  document.getElementById('explore-num').textContent = n;
  document.getElementById('explore-words').textContent = n>0 ? numberToWords(n) : '\u00a0';
}
document.getElementById('btn-explore-clear').addEventListener('click', ()=>{
  exploreCounts = { mil:0, cen:0, dec:0, uni:0 };
  renderExplore();
});

/* Anima un grupo de bloques "viajando" hacia el centro de la pantalla,
   girando, y desapareciendo — usado por el auto-agrupamiento de
   Exploración. */
function animateGroupTravel(sourceEls, colorClass, onDone){
  const targets = [];
  sourceEls.forEach(el=>{
    const r = el.getBoundingClientRect();
    const clone = document.createElement('div');
    clone.className = 'block ' + colorClass + ' travel-clone';
    clone.style.left = r.left+'px'; clone.style.top = r.top+'px';
    clone.style.width = r.width+'px'; clone.style.height = r.height+'px';
    document.body.appendChild(clone);
    targets.push(clone);
    el.classList.add('leaving');
  });
  const cx = window.innerWidth/2 - 20, cy = window.innerHeight/2 - 20;
  requestAnimationFrame(()=>{
    targets.forEach(t=>{ t.style.left = cx+'px'; t.style.top = cy+'px'; });
  });
  setTimeout(()=>{
    targets.forEach(t=>t.classList.add('spin'));
  }, 620);
  setTimeout(()=>{
    targets.forEach(t=>t.remove());
    if(onDone) onDone();
  }, 1250);
}

/* ---------------------------------------------------------------------
   8. DESAFÍO: DESCUBRE EL NÚMERO (agrupar con exceso real)
   Se entregan bloques donde UNA posición tiene 10 o más (no canónico).
   El estudiante toca 10 de esos bloques; al completar 10 se abre un
   diálogo "¿En qué los convertiremos?" con las 4 posiciones (UM-C-D-U),
   y debe tocar la correcta. Si queda otra posición con 10+ tras la
   transformación (efecto cadena), se repite. Una vez que la
   representación es válida, debe escribir qué número es.
   --------------------------------------------------------------------- */
let agruparCounts = null;
let agruparTapped = [];
function startAgrupar(){
  agruparCounts = { mil: randInt(0,1), cen: randInt(0,9), dec: randInt(0,9), uni: randInt(0,9) };
  const overloadable = ['cen','dec','uni'];
  const pick = overloadable[randInt(0,overloadable.length-1)];
  agruparCounts[pick] += 10;
  agruparTapped = [];

  challengeShell('Descubre el número', 'Une 10 bloques del mismo valor para transformarlos en el siguiente. Cuando ya no sobre ninguno, escribe qué número es.');
  const mat = document.createElement('div'); mat.className='build-mat'; mat.id='agrupar-mat';
  document.getElementById('challenge-body').appendChild(mat);
  renderAgruparMat();
}
function renderAgruparMat(){
  const mat = document.getElementById('agrupar-mat');
  mat.innerHTML = '';
  BLOCK_TYPES.forEach(t=>{
    const n = agruparCounts[t.key];
    if(n<=0) return;
    const group = document.createElement('div'); group.className='mat-group';
    for(let i=0;i<n;i++){
      const b = renderBlock(t.key,false);
      b.classList.add('removable');
      b.dataset.key = t.key;
      b.addEventListener('click', ()=>tapAgrupar(b, t.key));
      group.appendChild(b);
    }
    mat.appendChild(group);
  });
  checkAgruparMaybeDone();
}
function tapAgrupar(el, key){
  if(agruparTapped.includes(el)) return;
  el.style.opacity='.25'; el.classList.remove('removable');
  agruparTapped.push(el);
  sfxGroup();
  const sameKey = agruparTapped.filter(e=>e.dataset.key===key);
  if(sameKey.length===10){
    agruparTapped = agruparTapped.filter(e=>!sameKey.includes(e));
    openAgruparDialog(key, sameKey);
  }
}
function openAgruparDialog(fromKey, sourceEls){
  const opts = ['mil','cen','dec','uni'];
  const shortLabel = { mil:'UM', cen:'C', dec:'D', uni:'U' };
  const nextMap = { uni:'dec', dec:'cen', cen:'mil' };
  const correctNext = nextMap[fromKey];
  const modalRoot = document.getElementById('modal-root');
  modalRoot.innerHTML = `
    <div class="modal-overlay">
      <div class="modal-box" role="dialog" aria-modal="true">
        <div class="modal-eyebrow">Agrupar</div>
        <h3 class="modal-title">¿En qué los convertiremos?</h3>
        <div class="option-tiles">
          ${opts.map(k=>`<button class="option-tile" data-k="${k}">${shortLabel[k]}</button>`).join('')}
        </div>
        <p class="modal-feedback" id="modal-feedback"></p>
      </div>
    </div>`;
  modalRoot.querySelectorAll('.option-tile').forEach(tile=>{
    tile.addEventListener('click', ()=>{
      const k = tile.dataset.k;
      const fb = document.getElementById('modal-feedback');
      if(k===correctNext){
        tile.classList.add('correct-flash');
        fb.className='modal-feedback ok'; fb.textContent='¡Correcto!';
        sfxOk();
        modalRoot.querySelectorAll('.option-tile').forEach(t=>t.disabled=true);
        setTimeout(()=>{
          modalRoot.innerHTML='';
          animateGroupTravel(sourceEls, fromKey, ()=>{
            agruparCounts[fromKey] -= 10;
            agruparCounts[correctNext] += 1;
            renderAgruparMat();
          });
        }, 450);
      } else {
        tile.classList.add('wrong-flash');
        sfxErr();
        fb.className='modal-feedback err'; fb.textContent='Esa no es la transformación correcta.';
        setTimeout(()=>tile.classList.remove('wrong-flash'), 400);
      }
    });
  });
}
function checkAgruparMaybeDone(){
  const overflow = BLOCK_TYPES.some(t=>agruparCounts[t.key]>=10);
  if(overflow) return; // aún queda por agrupar (posible efecto cadena)
  if(document.getElementById('agrupar-answer-row')) return; // ya se está preguntando
  const body = document.getElementById('challenge-body');
  const row = document.createElement('div'); row.className='register-input-row'; row.id='agrupar-answer-row'; row.style.marginTop='14px';
  row.innerHTML = `<input id="agrupar-input" type="tel" inputmode="numeric" placeholder="¿Qué número es?" autocomplete="off">`;
  body.appendChild(row);
  const correctN = composeFromCounts(agruparCounts);
  const input = row.querySelector('input');
  input.maxLength = String(correctN).length;
  input.addEventListener('input', function(){
    this.value = this.value.replace(/[^0-9]/g,'').slice(0, this.maxLength);
    if(this.value.length < this.maxLength) return;
    if(Number(this.value)===correctN){
      sfxOk(); challengeFeedback('¡Correcto!', true); sfxWin(); launchConfetti();
      this.disabled = true;
      const again = document.createElement('button');
      again.className='primary-btn'; again.textContent='Otro desafío'; again.style.marginTop='16px'; again.style.width='100%';
      again.addEventListener('click', startAgrupar);
      body.appendChild(again);
    } else {
      sfxErr(); challengeFeedback('Ese no es el número correcto.', false);
      this.parentElement.classList.add('shake');
      setTimeout(()=>{ this.parentElement.classList.remove('shake'); this.value=''; this.focus(); }, 400);
    }
  });
  // Justo lo que se pedía: el cursor avanza solo a este campo apenas está listo.
  input.focus();
}

/* ---------------------------------------------------------------------
   9. DESAFÍO: COMPLETA LA REPRESENTACIÓN
   Un tipo de bloque falta por completo (no se dice cuál). El estudiante
   debe decidir TANTO el tipo (usando el vocabulario del valor posicional)
   COMO la cantidad — no se le regala ninguno de los dos.
   --------------------------------------------------------------------- */
function startCompleta(){
  const n = randInt(100, 1999);
  const c = decompose(n);
  const known = ['mil','cen','dec','uni'].filter(k=>c[k]>0);
  const missingKey = known[randInt(0,known.length-1)];

  const body = challengeShell('Completa la representación', 'Elige el tipo de bloque que falta y la cantidad.');
  const bigNum = document.createElement('div');
  bigNum.className = 'big-number-display';
  bigNum.textContent = n;
  body.appendChild(bigNum);
  const mat = document.createElement('div'); mat.className='build-mat'; mat.style.justifyContent='center';
  BLOCK_TYPES.forEach(t=>{
    if(t.key===missingKey) return;
    for(let i=0;i<c[t.key];i++) mat.appendChild(renderBlock(t.key,false));
  });
  body.appendChild(mat);

  // Mismo componente que la paleta para "formar con bloques": una sola
  // fila, ícono arriba y nombre corto abajo.
  const typeRow = document.createElement('div');
  typeRow.className = 'block-tray';
  body.appendChild(typeRow);
  buildTray(typeRow, (k)=>{
    const btn = typeRow.querySelector('.tray-btn.'+k);
    if(k===missingKey){
      [...typeRow.querySelectorAll('.tray-btn')].forEach(b=>b.disabled=true);
      btn.classList.add('selected');
      sfxOk();
      qtyWrap.classList.remove('hidden');
      document.getElementById('completa-input').focus();
    } else {
      btn.classList.add('wrong');
      sfxErr();
      challengeFeedback('Ese no es el tipo que falta. Vuelve a mirar los bloques.', false);
      setTimeout(()=>btn.classList.remove('wrong'), 400);
    }
  });

  const qtyWrap = document.createElement('div');
  qtyWrap.className = 'hidden';
  qtyWrap.style.marginTop = '10px';
  const row = document.createElement('div'); row.className='register-input-row';
  row.innerHTML = `<input id="completa-input" type="tel" inputmode="numeric" maxlength="1" placeholder="¿Cuántos?" autocomplete="off">`;
  qtyWrap.appendChild(row);
  body.appendChild(qtyWrap);

  const qtyInput = row.querySelector('input');
  qtyInput.addEventListener('input', function(){
    this.value = this.value.replace(/[^0-9]/g,'').slice(0,1);
    if(this.value.length < 1) return;
    if(Number(this.value)===c[missingKey]){
      sfxOk(); challengeFeedback('¡Correcto!', true); sfxWin(); launchConfetti();
      this.disabled = true;
      for(let i=0;i<c[missingKey];i++) mat.appendChild(renderBlock(missingKey,false));
      const again = document.createElement('button');
      again.className='primary-btn'; again.textContent='Otro desafío'; again.style.marginTop='16px'; again.style.width='100%';
      again.addEventListener('click', startCompleta);
      body.appendChild(again);
    } else {
      sfxErr();
      challengeFeedback('Esa cantidad no es correcta.', false);
      this.parentElement.classList.add('shake');
      setTimeout(()=>{ this.parentElement.classList.remove('shake'); this.value=''; this.focus(); }, 400);
    }
  });
}

/* ---------------------------------------------------------------------
   10. DESAFÍO: COLOREA — se entrega un número, el estudiante elige un color de la
   paleta (cada uno con su valor posicional) y pinta las fichas que
   correspondan, sin ayuda de bloques armados.
   --------------------------------------------------------------------- */
const COLOR_DEFS = [
  { key:'mil', name:'Rojo',     value:1000, css:'var(--b-mil)', grad:'linear-gradient(145deg, var(--b-mil), var(--b-mil-dark))' },
  { key:'cen', name:'Azul',     value:100,  css:'var(--b-cen)', grad:'linear-gradient(145deg, var(--b-cen), var(--b-cen-dark))' },
  { key:'dec', name:'Verde',    value:10,   css:'var(--b-dec)', grad:'linear-gradient(145deg, var(--b-dec), var(--b-dec-dark))' },
  { key:'uni', name:'Amarillo', value:1,    css:'var(--b-uni)', grad:'linear-gradient(145deg, var(--b-uni), var(--b-uni-dark))' },
];
function startColorea(){
  const n = randInt(11, 2000);
  const need = decompose(n);
  const totalTiles = 30;

  const body = challengeShell('Colorea', 'Elige un color de la paleta y pinta las fichas necesarias para representar este número:');
  const bigNum = document.createElement('div');
  bigNum.className = 'big-number-display';
  bigNum.textContent = n;
  body.appendChild(bigNum);

  const palette = document.createElement('div');
  palette.className = 'color-palette';
  let selectedColor = COLOR_DEFS[0].key;
  COLOR_DEFS.forEach((cd,i)=>{
    const btn = document.createElement('button');
    btn.type='button'; btn.className='color-swatch-btn'+(i===0?' selected':'');
    btn.innerHTML = `<span class="dot" style="background:${cd.css}"></span>${cd.value}`;
    btn.addEventListener('click', ()=>{
      palette.querySelectorAll('.color-swatch-btn').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedColor = cd.key;
    });
    palette.appendChild(btn);
  });
  body.appendChild(palette);

  const tileGrid = document.createElement('div');
  tileGrid.className = 'color-tile-grid';
  const tileColors = new Array(totalTiles).fill(null);
  for(let i=0;i<totalTiles;i++){
    const tile = document.createElement('button');
    tile.type='button'; tile.className='color-tile';
    tile.setAttribute('aria-label','Ficha '+(i+1));
    tile.addEventListener('click', ()=>{
      if(tileColors[i] === selectedColor){
        tileColors[i] = null;
        tile.style.background = ''; tile.classList.remove('painted');
      } else {
        tileColors[i] = selectedColor;
        tile.style.background = COLOR_DEFS.find(cd=>cd.key===selectedColor).grad;
        tile.classList.add('painted');
      }
    });
    tileGrid.appendChild(tile);
  }
  body.appendChild(tileGrid);

  const checkBtn = document.createElement('button');
  checkBtn.className='primary-btn'; checkBtn.textContent='Comprobar'; checkBtn.style.width='100%'; checkBtn.style.marginTop='10px';
  body.appendChild(checkBtn);
  checkBtn.addEventListener('click', ()=>{
    const counts = {mil:0,cen:0,dec:0,uni:0};
    tileColors.forEach(k=>{ if(k) counts[k]++; });
    const matches = COLOR_DEFS.every(cd=>counts[cd.key]===need[cd.key]);
    if(matches){
      sfxOk(); challengeFeedback('¡Correcto!', true); sfxWin(); launchConfetti();
      checkBtn.disabled = true;
      const again = document.createElement('button');
      again.className='primary-btn'; again.textContent='Otro número'; again.style.marginTop='10px'; again.style.width='100%';
      again.addEventListener('click', startColorea);
      body.appendChild(again);
    } else {
      sfxErr(); challengeFeedback('Todavía no coincide. Revisa cuántas fichas de cada color pintaste.', false);
    }
  });
}

/* ---------------------------------------------------------------------
   11. DESAFÍO: CARRERA CONTRA EL TIEMPO
   --------------------------------------------------------------------- */
let carreraState = null;
function startCarrera(){
  const body = challengeShell('Carrera contra el tiempo', 'Construye la mayor cantidad de números posible en 30 segundos. Cuando estés listo, presiona Comenzar.');
  const startBtn = document.createElement('button');
  startBtn.className = 'primary-btn'; startBtn.type='button'; startBtn.textContent = '▶ Comenzar';
  startBtn.style.width = '100%';
  body.appendChild(startBtn);
  startBtn.addEventListener('click', beginCarreraRound);
}
function beginCarreraRound(){
  const [min,max] = LEVEL_RANGES[state.level || 'medio'];
  carreraState = { score:0, timeLeft:30, target: randInt(min,max), counts:{mil:0,cen:0,dec:0,uni:0} };
  const body = challengeShell('Carrera contra el tiempo', 'Construye la mayor cantidad de números posible.');
  const timer = document.createElement('div'); timer.className='timer-badge'; timer.id='carrera-timer'; timer.textContent='⏱️ 30 s · Puntaje: 0';
  body.appendChild(timer);
  const disp = document.createElement('div'); disp.className='register-display'; disp.id='carrera-target'; disp.textContent = carreraState.target;
  body.appendChild(disp);
  const tray = document.createElement('div'); tray.className='block-tray'; tray.id='carrera-tray';
  body.appendChild(tray);
  const mat = document.createElement('div'); mat.className='build-mat'; mat.id='carrera-mat';
  body.appendChild(mat);
  buildTray(tray, (k)=>{
    carreraState.counts[k]++;
    renderCarreraMat();
  });
  renderCarreraMat();

  const interval = setInterval(()=>{
    carreraState.timeLeft--;
    document.getElementById('carrera-timer').textContent = `⏱️ ${carreraState.timeLeft} s · Puntaje: ${carreraState.score}`;
    if(carreraState.timeLeft<=0){
      clearInterval(interval);
      finishCarrera();
    }
  }, 1000);
  carreraState.interval = interval;
}
function renderCarreraMat(){
  renderMat(document.getElementById('carrera-mat'), carreraState.counts, (k)=>{
    if(carreraState.counts[k]>0) carreraState.counts[k]--;
    renderCarreraMat();
  });
  const target = decompose(carreraState.target);
  const c = carreraState.counts;
  const matches = target.mil===c.mil && target.cen===c.cen && target.dec===c.dec && target.uni===c.uni;
  if(matches){
    carreraState.score++;
    sfxOk();
    const [min,max] = LEVEL_RANGES[state.level || 'medio'];
    carreraState.target = randInt(min,max);
    carreraState.counts = {mil:0,cen:0,dec:0,uni:0};
    document.getElementById('carrera-target').textContent = carreraState.target;
    document.getElementById('carrera-timer').textContent = `⏱️ ${carreraState.timeLeft} s · Puntaje: ${carreraState.score}`;
    renderMat(document.getElementById('carrera-mat'), carreraState.counts, ()=>{});
    setTimeout(renderCarreraMat, 0); // reconecta los manejadores de clic tras vaciar
  }
}
function finishCarrera(){
  challengeFeedback('¡Se acabó el tiempo!', true);
  sfxWin(); launchConfetti();
  showResult('¡Tiempo terminado!', `Construiste ${carreraState.score} número(s) correctamente.`, startCarrera);
}

/* ---------------------------------------------------------------------
   12. RESULTADO / CELEBRACIÓN E INICIALIZACIÓN
   --------------------------------------------------------------------- */
function launchConfetti(){
  const colors = ['#34d399','#fbbf24','#f472b6','#38bdf8'];
  for(let i=0;i<28;i++){
    const piece = document.createElement('div');
    piece.className='confetti-piece';
    const size = randInt(6,11);
    piece.style.width = size+'px'; piece.style.height = (size*0.4)+'px';
    piece.style.left = randInt(0,100)+'vw';
    piece.style.background = colors[randInt(0,colors.length-1)];
    piece.style.animationDuration = (1.4+Math.random()*1.2)+'s';
    document.body.appendChild(piece);
    setTimeout(()=>piece.remove(), 3000);
  }
}
let resultAgainCb = null;
function showResult(title, sub, againCb){
  document.getElementById('result-title').textContent = title;
  document.getElementById('result-sub').textContent = sub;
  resultAgainCb = againCb;
  showScreen('result');
}
document.getElementById('btn-again').addEventListener('click', ()=>{
  if(resultAgainCb) resultAgainCb();
});

showScreen('home', false);
</script>

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

window.unirseClaseOnline = async function(codigo, nombre){
  try{
    const userCredential = await signInAnonymously(auth);
    const uid = userCredential.user.uid;

    const sessionRef = doc(db, 'sessions', codigo);
    const sessionSnap = await getDoc(sessionRef);
    if(!sessionSnap.exists()) return { ok:false, error:'Ese código no existe. Revísalo con tu profesor.' };
    const datos = sessionSnap.data();

    if(datos.active === false) return { ok:false, error:'Tu profesor ya cerró esta sesión.' };
    if(datos.recurso && datos.recurso !== 'numeros') return { ok:false, error:`Ese código es para ${datos.recurso}, no para Números.` };

    const duracionMinutos = datos.duracionMinutos || 180;
    if(datos.createdAt){
      const minutosTranscurridos = (Date.now() - datos.createdAt.toDate().getTime()) / 60000;
      if(minutosTranscurridos > duracionMinutos) return { ok:false, error:'Este código ya venció. Pídele uno nuevo a tu profesor.' };
    }

    await setDoc(doc(db, 'sessions', codigo, 'students', uid), {
      name: nombre, joinedAt: serverTimestamp(), completados: 0, errores: 0
    });
    return { ok:true, uid, nivelObjetivo: datos.nivelObjetivo, modoObjetivo: datos.modoObjetivo };
  } catch(err){
    console.error(err);
    return { ok:false, error:'Error de conexión. Intenta de nuevo.' };
  }
};

window.reportarProgresoOnline = async function(codigo, uid, completados, errores){
  if(!codigo || !uid) return;
  try{
    await setDoc(doc(db, 'sessions', codigo, 'students', uid), {
      completados, errores, updatedAt: serverTimestamp()
    }, { merge: true });
  } catch(err){
    console.error('No se pudo reportar el progreso online:', err);
  }
};
