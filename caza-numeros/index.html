<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Caza números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{ color-scheme:dark; --bg-1:#1e1147; --bg-2:#3b1785; --bg-3:#5b21b6; --text:#f6f3ff; --text-dim:#c9bdf0; --accent:#fbbf24; --primary:#34d399; --error:#fb7185;
  --font-display:'Baloo 2',system-ui,sans-serif; --font-body:'Nunito',system-ui,sans-serif; }
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden;color:var(--text);font-family:var(--font-body);min-height:100vh;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(circle at 15% 0%,var(--bg-3),transparent 55%),radial-gradient(circle at 85% 100%,#2a0f66,transparent 55%),linear-gradient(160deg,var(--bg-1),var(--bg-2));background-attachment:fixed}
button{font-family:inherit}
.hidden{display:none !important}
.screen{display:none;flex-direction:column;align-items:center;position:relative;z-index:1}
.screen.active{display:flex}
#app{width:100%;max-width:900px;margin:0 auto;padding:clamp(10px,2.5vw,24px);display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column}
.card{width:100%;position:relative;max-width:980px;margin:0 auto;padding:6px 10px}
.home-title{text-align:center;font-family:var(--font-display);font-weight:800;margin:0 0 6px;line-height:1.1}
.items-sub{text-align:center;color:#c9bdf0;font-size:.92rem;margin:2px 0 6px;text-wrap:balance}
.mv-pregunta{text-align:center;text-wrap:balance;font-family:var(--font-display);font-size:1.25rem;margin:6px 0 2px}
.icon-btn{display:inline-flex;align-items:center;cursor:pointer}
.mv-fila-chip{margin-top:30px}
.mv-atras-home{position:absolute;left:6px;top:6px;z-index:5}
.mv-casa-home{position:absolute;right:6px;top:6px;z-index:5}
.mv-niveles.mv-p3.mv-lv{aspect-ratio:100/90}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n1{--x:7;--y:53;--w:34}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n2{--x:50;--y:48;--w:41}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n3{--x:27;--y:1;--w:47}
@media (min-width:700px){.mv-niveles.mv-p3.mv-lv{aspect-ratio:100/40}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n1{--x:10;--y:13;--w:22}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n2{--x:37;--y:8;--w:26}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n3{--x:66;--y:2;--w:31}}
.mv-nivel .ico{width:46%;height:auto;position:relative;z-index:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.mv-universo .mv-home .home-title{padding:0 48px}
@media (min-width:900px) and (orientation:landscape){.mv-universo .mv-home .home-title{padding:0}}
/* ---- pantalla de juego ---- */
#screen-juego{align-items:stretch;width:100%}
body.en-juego{overflow:hidden;height:100dvh;min-height:0}
body.en-juego #screen-juego{height:100dvh}
.app-header.app-topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:none;width:100%;max-width:900px;margin:0 auto;padding:2px 10px 0;flex-wrap:nowrap}
.app-topbar .side{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.app-topbar .icon-btn.btn-orbita{font-size:.92rem}
.mv-universo .app-header.app-topbar .mv-av{width:clamp(56px,14vw,84px);height:clamp(56px,14vw,84px)}
#mvCelebra{position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:99990;pointer-events:none;opacity:0;width:min(86vw,300px)}
#mvCelebra.on{animation:mvCelPop 1.6s ease both}
@keyframes mvCelPop{0%{opacity:0;transform:translateX(-50%) scale(.55)}14%{opacity:1;transform:translateX(-50%) scale(1.1)}24%{transform:translateX(-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}
#mvCelebra .mv-info{display:none}
.cuerpo{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:760px;margin:0 auto;padding:2px 12px 12px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex:none}
.chip{padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(196,181,253,.4);font-family:var(--font-display);font-weight:800;font-size:1rem}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#stage > svg{width:100%;height:100%;max-height:100%;overflow:visible}
.msg{flex:none;min-height:2.7em;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:clamp(1rem,.85rem + .7vw,1.3rem);line-height:1.25;text-wrap:balance;max-width:640px}
.msg.mal{color:#fda4af}.msg.bien{color:#6ee7b7}.msg.pista{color:#fde68a}
.fila{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;flex:none}
.btn-orbita.ancho{font-size:1.15rem;padding-right:2em}
.btn-orbita[disabled]{opacity:.45;pointer-events:none;filter:grayscale(.5)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .32s}



#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#caja{--tam:min(92vw,52vh,520px);width:var(--tam);height:var(--tam);position:relative}
#tab{width:100%;height:100%;display:grid;gap:clamp(5px,1.6vw,10px);padding:clamp(8px,2vw,12px);border-radius:24px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 2px rgba(196,181,253,.35),0 10px 34px rgba(0,0,0,.35);transition:box-shadow .4s}
#tab.ganado{box-shadow:inset 0 0 0 3px #6ee7b7,0 0 36px rgba(110,231,183,.55)}
.num{position:relative;border:none;padding:0;min-width:0;min-height:0;border-radius:18%;cursor:pointer;font-family:var(--font-display);font-weight:800;font-size:var(--fs,2rem);line-height:1;color:#3b1785;
  background:linear-gradient(160deg,#faf5ff,#ddd6fe);box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),inset 0 -6px 10px rgba(91,33,182,.18),0 3px 8px rgba(0,0,0,.25);transition:transform .1s,background .2s,color .2s,opacity .2s;-webkit-tap-highlight-color:transparent}
.num:active{transform:scale(.93)}
.num.centro{box-shadow:inset 0 0 0 3px #fbbf24,inset 0 -6px 10px rgba(91,33,182,.18),0 3px 8px rgba(0,0,0,.25)}
.num.ok{background:linear-gradient(160deg,#6ee7b7,#10b981);color:#064e3b;opacity:.55;pointer-events:none}
.num.mal{animation:numMal .35s;background:linear-gradient(160deg,#fecdd3,#fb7185)}
@keyframes numMal{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#tab.oculto .num{color:transparent;background:linear-gradient(160deg,#6d4fc4,#4c2fa0);box-shadow:inset 0 0 0 2px rgba(196,181,253,.4)}
#punto{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fbbf24;box-shadow:0 0 0 3px rgba(0,0,0,.35),0 0 12px #fbbf24;pointer-events:none;z-index:2}
#listo{position:absolute;inset:0;z-index:3;border:none;border-radius:24px;background:rgba(20,8,60,.55);backdrop-filter:blur(2px);color:#fff;font-family:var(--font-display);font-weight:800;font-size:clamp(1.2rem,5vw,1.8rem);cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;text-wrap:balance}
.chip.crono{min-width:7.5em;text-align:center}
@media (prefers-reduced-motion:reduce){.num.mal{animation:none}}

.vol-ov{position:fixed;inset:0;z-index:100001;background:rgba(10,4,30,.78);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px}
.vol-card{position:relative;background:linear-gradient(160deg,#2c1468,#4c1d95);border:2px solid rgba(196,181,253,.6);border-radius:22px;padding:20px 18px;max-width:400px;width:100%;max-height:88vh;overflow:auto;text-align:center;color:#f6f3ff;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.vol-card h2{font-family:var(--font-display);margin:0 0 10px;font-size:1.3rem}
.vol-x{position:absolute;right:10px;top:8px;border:none;background:rgba(255,255,255,.14);color:#fff;width:34px;height:34px;border-radius:50%;font-size:1rem;cursor:pointer}
.rk-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.rk-tab{border:none;cursor:pointer;border-radius:14px;padding:6px 12px;background:rgba(255,255,255,.1);color:#f6f3ff;font-family:var(--font-display);font-weight:800;font-size:.95rem;box-shadow:inset 0 0 0 1px rgba(196,181,253,.35)}
.rk-tab.on{background:linear-gradient(150deg,#fbbf24,#f59e0b);color:#3b2405;box-shadow:0 0 14px rgba(251,191,36,.5)}
.rank-lista{list-style:none;margin:0;padding:0;text-align:left}
.rank-lista li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.07);margin-bottom:5px;font-weight:800}
.rank-lista li.yo{background:rgba(110,231,183,.22);box-shadow:inset 0 0 0 2px #6ee7b7}
.rank-lista .pos{width:1.9em;text-align:center;font-family:var(--font-display)}
.rank-lista .nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-lista .pts{font-family:var(--font-display);color:#fde68a}
.rk-vacio,.rk-mio{margin:10px 0 0;color:#d8ccf7;font-weight:700}
</style>

<script>
window.mvExito = function(){
  try{ if(window.reaccionCompanero) window.reaccionCompanero('bien'); }catch(e){}
  var h=document.getElementById('mvCelebra'); if(!h) return;
  var img=h.querySelector('.mv-av img'); if(!img || !img.getAttribute('src')) return;
  h.classList.remove('on'); void h.offsetWidth; h.classList.add('on');
  clearTimeout(h._t); h._t=setTimeout(function(){ h.classList.remove('on'); },1700);
};
window.mvFallo = function(){ try{ if(window.reaccionCompanero) window.reaccionCompanero('mal'); }catch(e){} };
const RECURSO = 'caza-numeros';
let AlumnoActual = null;
try{ var _g=JSON.parse(sessionStorage.getItem('profehoracio_alumno_actual')||'null'); if(_g && _g.id && _g.nombre) AlumnoActual=_g; }catch(e){}
function reportar(peso){ if(AlumnoActual && typeof window.reportarProgresoPractica==='function'){ try{ window.reportarProgresoPractica(AlumnoActual.id, RECURSO, 1, 0, peso); }catch(e){} } }
function iniciarHeartbeatTiempo(){
  if(typeof window.iniciarHeartbeatMathverse==='function') window.iniciarHeartbeatMathverse(function(){ return AlumnoActual && AlumnoActual.id; }, RECURSO);
  else setTimeout(iniciarHeartbeatTiempo,100);
}
if(AlumnoActual) iniciarHeartbeatTiempo();
const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function pantalla(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active'); document.body.classList.toggle('en-juego', id==='screen-juego'); window.scrollTo(0,0);
}

const PX=[100,300,500], BASE=232, H=28, WMIN=50, WMAX=172, TOPE_POSTE=64, Y_LEVANTADO=36;
const COLORES=['#f87171','#fb923c','#fbbf24','#34d399','#38bdf8','#a78bfa'];
const PESO={3:1,4:2,5:3}; const NIVELES_RK=[3,4,5];
const NOMBRE_RK={3:'3×3',4:'4×4',5:'5×5'}, TITULO_RK='Los 10 mejores tiempos', MODO_RK='asc';
const COL_RK=n=>'rankingTiempos'+n+'x'+n;
function fmtMs(ms){ const t=ms/1000; if(t<60) return t.toFixed(1)+' s'; const m=Math.floor(t/60); return m+':'+(t-m*60).toFixed(1).padStart(4,'0'); }
const FMT_RK=fmtMs;
const S={n:3,orden:[],sig:1,t0:0,ms:0,iv:null,estado:'listo',err:0,rec:0};
const MSG_INI='Toca los números en orden, del 1 al final, lo más rápido que puedas. Mantén la mirada en el centro de la tabla.';
function mezclar(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function msg(t,tipo){ const m=$('msg'); m.textContent=t; m.className='msg'+(tipo?' '+tipo:''); }
function construir(){
  const n=S.n, t=$('tab'); t.className='oculto'; t.style.gridTemplateColumns='repeat('+n+',1fr)'; t.style.gridTemplateRows='repeat('+n+',1fr)';
  $('caja').style.setProperty('--fs','calc(var(--tam) / '+(n*2.6)+')'); $('tab').style.setProperty('--fs','calc(var(--tam) / '+(n*2.6)+')');
  S.orden=mezclar(Array.from({length:n*n},(_,i)=>i+1)); t.innerHTML='';
  S.orden.forEach((v,k)=>{ const b=document.createElement('button'); b.type='button'; b.className='num'; b.textContent=v; b.dataset.v=v;
    if(n%2===1 && k===(n*n-1)/2) b.classList.add('centro');
    b.addEventListener('click',()=>tocar(b)); t.appendChild(b); });
  $('punto').classList.toggle('hidden', n%2===1);
}
function parar(){ if(S.iv){ clearInterval(S.iv); S.iv=null; } }
function preparar(){
  parar(); S.sig=1; S.err=0; S.estado='listo'; S.ms=0; $('tab').classList.remove('ganado'); $('tab').classList.add('oculto');
  $('listo').classList.remove('hidden'); $('chBusca').textContent='Busca el 1'; $('chTiempo').textContent='⏱ 0.0 s';
  $('filaSig').classList.add('hidden'); $('filaAcc').classList.remove('hidden'); msg(MSG_INI);
}
function empezar(n){
  S.n=n; construir(); preparar(); pantalla('screen-juego'); cargarRecord();
}
function cargarRecord(){
  S.rec=0; $('chRec').textContent='Récord —';
  if(!AlumnoActual) return;
  const n=S.n; esperarRK(()=>{ window.RK.mio(COL_RK(n),AlumnoActual.id).then(m=>{ if(S.n===n){ S.rec=m; $('chRec').textContent=m?('Récord '+fmtMs(m)):'Récord —'; } }); });
}
$('listo').addEventListener('click',()=>{
  if(S.estado!=='listo') return; S.estado='jugando'; $('listo').classList.add('hidden'); $('tab').classList.remove('oculto');
  S.t0=performance.now(); S.iv=setInterval(()=>{ $('chTiempo').textContent='⏱ '+fmtMs(performance.now()-S.t0); },100); msg('');
});
function tocar(b){
  if(S.estado!=='jugando') return; const v=+b.dataset.v;
  if(v===S.sig){
    b.classList.add('ok'); S.sig++;
    if(S.sig>S.n*S.n){ terminar(); return; }
    $('chBusca').textContent='Busca el '+S.sig;
  } else {
    S.err++; b.classList.remove('mal'); void b.offsetWidth; b.classList.add('mal'); setTimeout(()=>b.classList.remove('mal'),400);
    msg('Ese es el '+v+'. Ahora busca el '+S.sig+'.','mal'); try{ mvFallo(); }catch(e){}
  }
}
async function terminar(){
  parar(); S.estado='fin'; S.ms=Math.round(performance.now()-S.t0); $('chTiempo').textContent='⏱ '+fmtMs(S.ms); $('tab').classList.add('ganado');
  $('chBusca').textContent='¡Listo!';
  let m='🎉 ¡Completaste la tabla en '+fmtMs(S.ms)+'!'+(S.err?(' ('+S.err+(S.err===1?' error':' errores')+')'):' Sin errores.');
  msg(m,'bien'); try{ mvExito(); }catch(e){} reportar(PESO[S.n]||2);
  $('filaAcc').classList.add('hidden'); $('filaSig').classList.remove('hidden');
  if(AlumnoActual){
    const n=S.n, ms=S.ms;
    esperarRK(async()=>{ const r=await window.RK.guardar(COL_RK(n),AlumnoActual.id,AlumnoActual.nombre,ms,{errores:S.err},'asc');
      if(!r||S.n!==n||S.estado!=='fin') return;
      if(r.mejoro){ S.rec=ms; $('chRec').textContent='Récord '+fmtMs(ms); msg(r.previo?('🏆 ¡Nuevo récord! '+fmtMs(ms)+' (antes '+fmtMs(r.previo)+').'):('🏆 ¡Tu primer récord en este nivel: '+fmtMs(ms)+'!'),'bien'); }
      else msg(m+' Tu récord es '+fmtMs(r.previo)+'.','bien'); });
  }
}
$('bRei').addEventListener('click',()=>{ if(S.estado==='jugando'||S.estado==='listo'){ construir(); preparar(); } });
$('bSig').addEventListener('click',()=>{ construir(); preparar(); });
$('bRk').addEventListener('click',()=>abrirRanking(S.n)); $('bRk2').addEventListener('click',()=>abrirRanking(S.n));
$('btn-back').addEventListener('click',()=>{ parar(); });
window.empezar=empezar;

/* ---------- récords y ranking ---------- */
const ICONO_CORONA='<svg viewBox="0 0 24 24"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/></svg>';
function esperarRK(f,n){ n=n||0; if(window.RK) f(); else if(n<60) setTimeout(()=>esperarRK(f,n+1),100); }
let rankNivel=3;
async function abrirRanking(n){
  rankNivel=n||rankNivel;
  let root=document.getElementById('rkRoot'); if(!root){ root=document.createElement('div'); root.id='rkRoot'; document.body.appendChild(root); }
  const tabs=NIVELES_RK.map(k=>`<button type="button" class="rk-tab ${k===rankNivel?'on':''}" onclick="abrirRanking(${k})">${NOMBRE_RK[k]}</button>`).join('');
  root.innerHTML=`<div class="vol-ov"><div class="vol-card"><button type="button" class="vol-x" onclick="cerrarRanking()" aria-label="Cerrar">✕</button><h2>👑 ${TITULO_RK}</h2>${NIVELES_RK.length>1?'<div class="rk-tabs">'+tabs+'</div>':''}<div id="rkCuerpo"><p class="rk-vacio">Cargando…</p></div></div></div>`;
  const pedido=rankNivel; let lista=null;
  try{ lista=window.RK?await window.RK.top(COL_RK(pedido),MODO_RK):null; }catch(e){}
  const c=document.getElementById('rkCuerpo'); if(!c||pedido!==rankNivel) return;
  if(!lista){ c.innerHTML='<p class="rk-vacio">No se pudo cargar el ranking. Revisa tu conexión.</p>'; return; }
  if(!lista.length){ c.innerHTML='<p class="rk-vacio">Aún nadie tiene récord en este nivel. ¡Sé el primero!</p>'; return; }
  const yo=AlumnoActual?AlumnoActual.id:null, med=['🥇','🥈','🥉'];
  let h='<ol class="rank-lista">'+lista.map((f,i)=>`<li class="${f.id===yo?'yo':''}"><span class="pos">${med[i]||(i+1)}</span><span class="nom">${String(f.nombre||'—').replace(/[<>&]/g,'')}</span><b class="pts">${FMT_RK(f.mejor)}</b></li>`).join('')+'</ol>';
  if(yo && !lista.some(f=>f.id===yo)){ let m=0; try{ m=await window.RK.mio(COL_RK(pedido),yo); }catch(e){} if(m) h+=`<p class="rk-mio">Tu mejor registro: <b>${FMT_RK(m)}</b></p>`; }
  if(document.getElementById('rkCuerpo')) document.getElementById('rkCuerpo').innerHTML=h;
}
function cerrarRanking(){ const r=document.getElementById('rkRoot'); if(r) r.innerHTML=''; }
window.abrirRanking=abrirRanking; window.cerrarRanking=cerrarRanking;

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDrwcG84h88gOf9FkUlZbECZ2qrO14KhO4",
  authDomain: "profehoracio-online.firebaseapp.com",
  projectId: "profehoracio-online",
  storageBucket: "profehoracio-online.firebasestorage.app",
  messagingSenderId: "TU_SENDER_ID",
  appId: "1:337766647406:web:6f13e95cb71b5f89cfc87f"
};
const app = initializeApp(firebaseConfig, "rankingJuego");
const auth = getAuth(app);
const db = getFirestore(app);
/* Solo se guarda el mejor registro de cada alumno y nunca se borra: solo se reemplaza si mejora.
   modo 'asc' = gana el MENOR (tiempos); 'desc' = gana el MAYOR (puntos). */
window.RK = {
  async guardar(col, id, nombre, valor, extra, modo){
    try{
      if(!col || !id || !(valor > 0)) return null;
      await signInAnonymously(auth);
      const ref = doc(db, col, id), s = await getDoc(ref);
      const previo = s.exists() ? (Number(s.data().mejor) || 0) : 0;
      const mejora = !previo || (modo === 'asc' ? valor < previo : valor > previo);
      if(mejora) await setDoc(ref, Object.assign({ nombre: nombre, mejor: Math.round(valor), actualizado: serverTimestamp() }, extra || {}));
      return { previo: previo, mejoro: mejora };
    } catch(err){ console.error('No se pudo guardar el récord:', err); return null; }
  },
  async mio(col, id){
    try{ await signInAnonymously(auth); const s = await getDoc(doc(db, col, id)); return s.exists() ? (Number(s.data().mejor) || 0) : 0; }
    catch(err){ return 0; }
  },
  async top(col, modo){
    try{
      await signInAnonymously(auth);
      const r = await getDocs(query(collection(db, col), orderBy('mejor', modo === 'asc' ? 'asc' : 'desc'), limit(10)));
      return r.docs.map(d => Object.assign({ id: d.id }, d.data()));
    } catch(err){ console.error('No se pudo leer el ranking:', err); return null; }
  }
};
</script>
