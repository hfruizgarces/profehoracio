<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Mi Progreso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg-1:#1e1147; --bg-2:#3b1785; --bg-3:#5b21b6;
  --primary:#34d399; --accent:#fbbf24; --error:#fb7185; --blue:#38bdf8;
  --text:#f6f3ff; --text-dim:#c9bdf0; --text-faint:#8f7fc4;
  --surface:rgba(255,255,255,.07); --surface-strong:rgba(255,255,255,.12); --surface-soft:rgba(255,255,255,.05);
  --border-soft:rgba(255,255,255,.16);
  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;
}
*{ box-sizing:border-box; }
html,body{
  margin:0; font-family:var(--font-body); font-weight:600; color:var(--text);
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed; min-height:100vh;
}
h1,h2,h3{ font-family:var(--font-display); margin:0; }
.hidden{ display:none !important; }
.wrap{ max-width:560px; margin:0 auto; padding:20px 16px 60px; }
.hero{ text-align:center; padding:20px 6px 14px; }
.hero h1{ font-size:clamp(1.8rem,6vw,2.4rem); margin-bottom:8px; }
.hero p{ color:var(--text-dim); font-weight:600; font-size:.95rem; }
a.volver{ display:inline-flex; align-items:center; gap:6px; color:var(--text-faint); font-weight:700; font-size:.85rem; text-decoration:none; margin-bottom:6px; }
a.volver:hover{ color:var(--text); }

.login-card{
  background:var(--surface); border:1px solid var(--border-soft); backdrop-filter:blur(6px);
  border-radius:22px; padding:24px; max-width:340px; width:100%; margin:16px auto 0;
  display:flex; flex-direction:column; gap:10px;
}
.login-input{
  width:100%; padding:12px 14px; border-radius:14px; border:2px solid var(--border-soft);
  background:var(--surface-strong); color:var(--text); font-family:var(--font-display); font-weight:700;
  font-size:1rem; text-align:center;
}
.login-error{ color:var(--error); font-weight:700; font-size:.82rem; min-height:1.2em; margin:0; }
.btn-primario{
  padding:13px 20px; border-radius:999px; border:none; cursor:pointer;
  background:linear-gradient(140deg,#0f9d70,var(--primary)); color:#04281c;
  font-family:var(--font-display); font-weight:800; font-size:1rem;
}
.btn-fantasma{
  padding:10px 18px; border-radius:999px; border:1px solid var(--border-soft); cursor:pointer;
  background:var(--surface); color:var(--text-faint); font-family:var(--font-display); font-weight:700; font-size:.85rem;
}

.tarjeta{
  background:var(--surface); border:1px solid var(--border-soft); border-radius:20px;
  padding:18px 20px; margin-bottom:14px;
}
.tarjeta h2{ font-size:1.05rem; margin-bottom:12px; }
.fila-mes{
  display:flex; justify-content:space-between; align-items:center; gap:10px;
  padding:8px 0; border-top:1px solid var(--border-soft); font-size:.85rem;
}
.fila-mes:first-of-type{ border-top:none; }
.fila-mes .mes{ color:var(--text-dim); font-weight:700; }
.fila-mes .dato{ color:var(--primary); font-weight:800; text-align:right; }
.vacio{ color:var(--text-faint); font-size:.88rem; text-align:center; padding:10px 0; }
.total-linea{ text-align:center; font-family:var(--font-display); font-weight:800; font-size:1.3rem; color:var(--accent); margin:4px 0 10px; }

footer.credits{ text-align:center; color:var(--text-faint); font-weight:700; font-size:.78rem; padding:24px 10px 4px; }
</style>
</head>
<body>
<div class="wrap">

  <div id="screen-login">
    <div class="hero">
      <h1>📊 Mi Progreso</h1>
      <p>Ingresa con tu usuario y contraseña para ver todo lo que has practicado</p>
    </div>
    <div class="login-card">
      <input type="text" id="loginUsuario" class="login-input" placeholder="Usuario" autocomplete="off" maxlength="30">
      <input type="password" id="loginPassword" class="login-input" placeholder="Contraseña" autocomplete="off" maxlength="30">
      <p class="login-error" id="loginError"></p>
      <button class="btn-primario" id="btnLoginEntrar" style="width:100%;">Ingresar</button>
    </div>
  </div>

  <div id="screen-progreso" class="hidden">
    <a class="volver" href="index.html">← Volver al catálogo</a>
    <div class="hero">
      <h1 id="saludoNombre">📊 Mi Progreso</h1>
      <p>Esto es todo lo que has practicado hasta ahora</p>
    </div>

    <div id="contenidoProgreso">Cargando…</div>

    <div style="text-align:center; margin-top:10px;">
      <button class="btn-fantasma" id="btnCerrarSesion">Cerrar sesión</button>
    </div>
    <footer class="credits">Recursos Matemáticos · Material interactivo para Educación Básica y Media</footer>
  </div>

</div>

<script>
const CLAVE_SESION_COMPARTIDA = 'profehoracio_alumno_actual';
let AlumnoActual = null;

const NOMBRES_RECURSOS_PRACTICA = {
  adicion: 'Sumas',
  sustraccion: 'Restas',
  'multiplicacion-arabe': 'Multiplicación Árabe',
  'division-algoritmo': 'Divisiones',
  'representacion-division': 'Representación de Divisiones',
  numeros: 'Números',
  inecuaciones: 'Inecuaciones',
  ecuaciones: 'Ecuaciones',
  'terminos-semejantes': 'Términos Semejantes',
  funciones: 'Funciones',
  coordenadas: 'Cuadrículas y Coordenadas',
  proporciones: 'Proporciones',
  'multiplicacion-polinomios': 'Multiplicación de Polinomios',
  'transformaciones-geometricas': 'Transformaciones Geométricas',
  'batalla-enteros': 'Batalla de Enteros',
  sudoku: 'Sudoku',
};
const NOMBRES_MES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function formatearMes(mesKey){
  const [anio, mes] = mesKey.split('-');
  const nombreMes = NOMBRES_MES[parseInt(mes,10)-1] || mes;
  return nombreMes.charAt(0).toUpperCase() + nombreMes.slice(1) + ' ' + anio;
}
const NOMBRES_NIVEL_TABLAS = { facil:'Fácil', intermedio:'Intermedio', dificil:'Difícil' };
const TOTAL_NIVELES_ROBOT = { programador: 55, maestro: 55, experto: 59 };
const NOMBRES_DIFICULTAD_ROBOT = { programador:'Programador', maestro:'Maestro', experto:'Experto' };

function mostrarPantalla(logueado){
  document.getElementById('screen-login').classList.toggle('hidden', logueado);
  document.getElementById('screen-progreso').classList.toggle('hidden', !logueado);
}
window.mostrarPantalla = mostrarPantalla;

function intentarSesionCompartida(){
  try{
    const guardado = JSON.parse(sessionStorage.getItem(CLAVE_SESION_COMPARTIDA) || 'null');
    if(guardado && guardado.id && guardado.nombre){
      AlumnoActual = guardado;
      mostrarPantalla(true);
      cargarProgreso();
      return true;
    }
  } catch(e){}
  return false;
}

document.getElementById('btnLoginEntrar').onclick = async () => {
  const usuario = document.getElementById('loginUsuario').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  if(!usuario || !password){ errEl.textContent = 'Escribe tu usuario y tu contraseña.'; return; }
  const btn = document.getElementById('btnLoginEntrar');
  btn.disabled = true; btn.textContent = 'Entrando…';
  errEl.textContent = '';
  try{
    const resultado = await window.verificarLoginAlumnoCompartido(usuario, password);
    if(!resultado.ok){ errEl.textContent = resultado.error; btn.disabled = false; btn.textContent = 'Ingresar'; return; }
    AlumnoActual = { id: resultado.id, nombre: resultado.nombre };
    try{ sessionStorage.setItem(CLAVE_SESION_COMPARTIDA, JSON.stringify(AlumnoActual)); }catch(e){}
    mostrarPantalla(true);
    cargarProgreso();
  } catch(err){
    console.error(err);
    errEl.textContent = 'Error de conexión. Intenta de nuevo.';
  }
  btn.disabled = false; btn.textContent = 'Ingresar';
};
document.getElementById('loginPassword').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('btnLoginEntrar').click(); });
document.getElementById('btnCerrarSesion').onclick = () => {
  sessionStorage.removeItem(CLAVE_SESION_COMPARTIDA);
  AlumnoActual = null;
  mostrarPantalla(false);
};

async function cargarProgreso(){
  document.getElementById('saludoNombre').textContent = `📊 ¡Hola, ${AlumnoActual.nombre}!`;
  const destino = document.getElementById('contenidoProgreso');
  destino.innerHTML = 'Cargando…';
  try{
    const d = await window.obtenerDatosAlumno(AlumnoActual.id);
    if(!d){ destino.innerHTML = '<p class="vacio">No se encontró tu cuenta.</p>'; return; }

    let html = '';

    // Robot: Misión Código
    const starsKeys = Object.keys(d.stars || {});
    if(starsKeys.length > 0){
      const conteo = { programador: 0, maestro: 0, experto: 0 };
      starsKeys.forEach(id => {
        if(id.startsWith('p')) conteo.programador++;
        else if(id.startsWith('m')) conteo.maestro++;
        else if(id.startsWith('e')) conteo.experto++;
      });
      let filasRobot = '';
      Object.keys(NOMBRES_DIFICULTAD_ROBOT).forEach(dif => {
        if(conteo[dif] === 0) return;
        filasRobot += `<div class="fila-mes"><span class="mes">${NOMBRES_DIFICULTAD_ROBOT[dif]}</span><span class="dato">${conteo[dif]} / ${TOTAL_NIVELES_ROBOT[dif]} niveles</span></div>`;
      });
      html += `<div class="tarjeta"><h2>🤖 Robot: Misión Código</h2>${filasRobot}</div>`;
    }

    // Tablas de Multiplicar (récords)
    const record = d.tablasRecord || {};
    const nivelesConRecord = Object.keys(record).filter(n => typeof record[n] === 'number');
    if(nivelesConRecord.length > 0){
      let filasRecord = '';
      nivelesConRecord.forEach(n => {
        const m = Math.floor(record[n]/60), s = record[n]%60;
        filasRecord += `<div class="fila-mes"><span class="mes">${NOMBRES_NIVEL_TABLAS[n] || n}</span><span class="dato">${m}:${String(s).padStart(2,'0')}</span></div>`;
      });
      html += `<div class="tarjeta"><h2>🎲 Tablas de Multiplicar (mejor tiempo)</h2>${filasRecord}</div>`;
    }

    // Recursos de práctica (tiempo y completados, por mes)
    const practica = d.practica || {};
    Object.keys(NOMBRES_RECURSOS_PRACTICA).forEach(clave => {
      const meses = practica[clave];
      if(!meses || typeof meses !== 'object') return;
      const mesesConDatos = Object.keys(meses).filter(m => meses[m] && (meses[m].completados || meses[m].segundos)).sort().reverse();
      if(mesesConDatos.length === 0) return;
      let filasMeses = '';
      let totalMin = 0;
      mesesConDatos.forEach(mesKey => {
        const p = meses[mesKey];
        const mins = Math.round((p.segundos || 0) / 60);
        totalMin += mins;
        filasMeses += `<div class="fila-mes"><span class="mes">${formatearMes(mesKey)}</span><span class="dato">${p.completados || 0} completados<br>${mins} min</span></div>`;
      });
      html += `<div class="tarjeta"><h2>${NOMBRES_RECURSOS_PRACTICA[clave]}</h2>${filasMeses}</div>`;
    });

    if(html === ''){
      html = '<p class="vacio">Todavía no has practicado en ningún recurso. ¡Anímate a probar alguno!</p>';
    }
    destino.innerHTML = html;
  } catch(err){
    console.error(err);
    destino.innerHTML = '<p class="vacio">No se pudo cargar tu progreso. Intenta de nuevo más tarde.</p>';
  }
}

// La adjuntamos explícitamente a window -- esta función necesita datos de
// Firebase (obtenerDatosAlumno), así que solo es seguro llamarla una vez
// que el módulo de más abajo ya terminó de cargar (ver el final del módulo).
window.intentarSesionCompartida = intentarSesionCompartida;
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDrwcG84h88gOf9FkUlZbECZ2qrO14KhO4",
  authDomain: "profehoracio-online.firebaseapp.com",
  projectId: "profehoracio-online",
  storageBucket: "profehoracio-online.firebasestorage.app",
  messagingSenderId: "TU_SENDER_ID",
  appId: "1:337766647406:web:6f13e95cb71b5f89cfc87f"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth();
const db = getFirestore();

function normalizarUsuarioCompartido(u){
  return u.trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, '-');
}

window.verificarLoginAlumnoCompartido = async function(usuario, password){
  try{
    await signInAnonymously(auth);
    const id = normalizarUsuarioCompartido(usuario);
    const snap = await getDoc(doc(db, 'alumnosRobot', id));
    if(!snap.exists()) return { ok:false, error:'Ese usuario no existe. Revísalo con tu profesor.' };
    const datos = snap.data();
    if(datos.password !== password) return { ok:false, error:'Contraseña incorrecta.' };
    return { ok:true, id, nombre: datos.nombre };
  } catch(err){
    console.error(err);
    return { ok:false, error:'Error de conexión. Intenta de nuevo.' };
  }
};

// A diferencia de los recursos individuales, acá SÍ necesitamos autenticarnos
// también al reconectar sin contraseña (sesión compartida) -- por eso esta
// función hace su propio signInAnonymously, sin depender de haber pasado
// antes por verificarLoginAlumnoCompartido en esta misma página.
window.obtenerDatosAlumno = async function(id){
  try{
    await signInAnonymously(auth);
    const snap = await getDoc(doc(db, 'alumnosRobot', id));
    if(!snap.exists()) return null;
    return snap.data();
  } catch(err){
    console.error(err);
    return null;
  }
};

// Recién ACÁ, con obtenerDatosAlumno ya definida, es seguro revisar si ya
// hay una sesión compartida de otro recurso.
if(!window.intentarSesionCompartida()){
  window.mostrarPantalla(false);
}
</script>
</body>
</html>
