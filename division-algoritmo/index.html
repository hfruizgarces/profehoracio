<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Divisiones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS DE DISEÑO
   ========================================================= */
:root{
  color-scheme: dark;
  --bg-1:#1e1147;
  --bg-2:#3b1785;
  --bg-3:#5b21b6;
  --surface:rgba(255,255,255,.07);
  --surface-strong:rgba(255,255,255,.12);
  --border-soft:rgba(255,255,255,.14);

  --primary:#34d399;
  --primary-dark:#0f9d70;
  --accent:#fbbf24;
  --accent-soft:#fde68a;
  --pink:#f472b6;
  --blue:#38bdf8;
  --error:#fb7185;
  --error-soft:#3b0f1f;

  --text:#f6f3ff;
  --text-dim:#c9bdf0;
  --text-faint:#8f7fc4;

  --r-lg:22px;
  --r-md:16px;
  --r-sm:10px;

  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;

  --shadow-1: 0 10px 30px rgba(0,0,0,.35);
  --tap-min: 48px;
}

*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; width:100%; overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
h1,h2,h3{font-family:var(--font-display); margin:0;}
button, input{ -webkit-user-select:none; user-select:none; }
input{font-family:inherit;}

.hidden{display:none !important;}
.visually-hidden{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* Foco visible para accesibilidad con teclado */
:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
  border-radius:6px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* =========================================================
   LAYOUT GENERAL
   ========================================================= */
#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding: clamp(10px, 2.5vw, 24px);
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:6px 56px 14px 2px;
  flex-wrap:wrap;
}
.app-header .side{
  display:flex; align-items:center; gap:6px;
  flex:1 1 auto;
  min-width:70px;
}
.app-header .side.right{ justify-content:flex-end; }

.icon-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--surface);
  border:1px solid var(--border-soft);
  color:var(--text);
  padding:9px 12px;
  border-radius:999px;
  font-weight:700;
  font-size:clamp(.75rem, 2vw, .9rem);
  cursor:pointer;
  min-height:var(--tap-min);
  transition: background .15s, transform .1s;
  white-space:nowrap;
}
.icon-btn:hover{ background:var(--surface-strong); }
.icon-btn:active{ transform:scale(.96); }

.brand{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.2vw, 1.6rem);
  flex:0 1 auto;
  white-space:nowrap;
}
.brand .plus{
  display:inline-flex; align-items:center; justify-content:center;
  width:1.5em; height:1.5em;
  background:linear-gradient(135deg, var(--primary), var(--blue));
  border-radius:10px;
  color:#0b1a12;
  font-size:1em;
}

main{ flex:1; display:flex; flex-direction:column; }

.screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  animation: fadeSlideIn .35s ease both;
}
@keyframes fadeSlideIn{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}

.card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(16px, 4vw, 32px);
  box-shadow:var(--shadow-1);
  backdrop-filter: blur(6px);
}

/* =========================================================
   PANTALLA INICIAL
   ========================================================= */
.home-title{
  text-align:center;
  font-size:clamp(1.4rem, 5vw, 2.2rem);
  font-weight:800;
  margin-bottom:6px;
}
.home-sub{
  text-align:center;
  color:var(--text-dim);
  font-size:clamp(.9rem, 2.4vw, 1.05rem);
  margin:0 auto clamp(18px,4vw,28px);
  max-width:46ch;
}
footer.credits{ text-align:center; color: var(--text-faint); font-weight:700; font-size:.78rem; padding:20px 10px 4px; }
.level-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:clamp(10px, 2.5vw, 16px);
  width:100%;
}
@media (max-width:420px){
  .level-grid{ grid-template-columns:1fr; }
}
.level-btn{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:clamp(16px,4vw,22px) 10px;
  border-radius:var(--r-md);
  border:1px solid var(--border-soft);
  color:var(--text);
  cursor:pointer;
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1rem, 2.6vw, 1.15rem);
  min-height:96px;
  transition:transform .15s, box-shadow .15s;
}
.level-btn:hover{ transform:translateY(-3px); }
.level-btn:active{ transform:scale(.97); }
.level-btn .emoji{ font-size:clamp(1.6rem, 5vw, 2.1rem); }
.level-btn.easy{ background:linear-gradient(140deg,#0f9d70,#34d399); }
.level-btn.mid{ background:linear-gradient(140deg,#1d4ed8,#38bdf8); }
.level-btn.hard{ background:linear-gradient(140deg,#b91c66,#f472b6); }
.level-btn.custom{ background:linear-gradient(140deg,#92400e,#fbbf24); color:#fff; }

/* =========================================================
   PANTALLA "CREA TU EJERCICIO"
   ========================================================= */
.form-title{ font-size:clamp(1.2rem,3.6vw,1.5rem); font-weight:800; text-align:center; margin-bottom:4px; }
.form-sub{ color:var(--text-dim); text-align:center; margin-bottom:18px; font-size:.95rem; }

.addend-row{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:12px;
}
.addend-index{
  width:26px; text-align:right; color:var(--text-faint); font-weight:700; flex:0 0 auto;
}
.addend-input{
  flex:0 1 180px;
  min-width:0;
  background:var(--surface-strong);
  border:2px solid var(--border-soft);
  border-radius:var(--r-sm);
  color:var(--text);
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1.1rem, 3.2vw, 1.35rem);
  text-align:center;
  padding:12px 10px;
  min-height:var(--tap-min);
  letter-spacing:1px;
}
.addend-input::placeholder{ color:var(--text-faint); font-family:var(--font-body); font-weight:600; font-size:.85em;}
.addend-remove{
  flex:0 0 auto;
  width:var(--tap-min); height:var(--tap-min);
  border-radius:50%;
  background:rgba(251,113,133,.18);
  border:1px solid var(--error);
  color:var(--error);
  font-size:1.2rem;
  font-weight:800;
  cursor:pointer;
}
.dashed-btn{
  width:100%;
  max-width:220px;
  margin-left:auto; margin-right:auto;
  display:block;
  padding:12px;
  border-radius:var(--r-sm);
  border:2px dashed var(--border-soft);
  background:transparent;
  color:var(--text-dim);
  font-weight:700;
  cursor:pointer;
  min-height:var(--tap-min);
  margin-bottom:18px;
}
.dashed-btn:hover{ border-color:var(--text-dim); color:var(--text); }
.dashed-btn:disabled{ opacity:.4; cursor:not-allowed; }

.primary-btn{
  width:100%;
  padding:14px;
  border-radius:var(--r-md);
  border:none;
  background:linear-gradient(135deg, var(--primary), #10b981);
  color:#062b1c;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1rem, 2.8vw, 1.15rem);
  cursor:pointer;
  min-height:52px;
  box-shadow:0 6px 18px rgba(52,211,153,.35);
  transition:transform .12s, box-shadow .12s;
}
.primary-btn:hover{ transform:translateY(-2px); }
.primary-btn:active{ transform:scale(.98); }
.primary-btn:disabled{
  background:#4b4b5a; color:#9a9aab; box-shadow:none; cursor:not-allowed; transform:none;
}
.form-error{
  color:var(--error);
  text-align:center;
  font-weight:700;
  font-size:.9rem;
  min-height:1.4em;
  margin-bottom:10px;
}

/* =========================================================
   PANTALLA DE EJERCICIO
   ========================================================= */
.hint-box{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-md);
  padding:12px 14px;
  margin-bottom:16px;
  width:100%;
  font-size:clamp(.82rem, 2.1vw, .95rem);
  line-height:1.45;
}
.hint-box .bulb{ font-size:1.2em; flex:0 0 auto; }
.hint-box b{ color:var(--accent); }
.hint-box .ok{ color:var(--primary); }

/* =========================================================
   MODAL (llevada / totales de columna)
   ========================================================= */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(10,4,30,.6);
  backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center;
  padding:16px;
  z-index:700;
}
.modal-box{
  width:100%; max-width:400px;
  background:linear-gradient(160deg, #2c1468, #4c1d95);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(18px,4vw,26px);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.modal-close-x{
  position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
  border:1px solid var(--border-soft); background:var(--surface); color:var(--text);
  cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; z-index:5;
}
@keyframes popIn{
  from{ transform:scale(.85); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}
@keyframes monedaFlota{
  0%{ transform:translateY(0); opacity:0; }
  15%{ opacity:1; }
  100%{ transform:translateY(-24px); opacity:0; }
}
.modal-eyebrow{
  font-size:.78rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent); margin-bottom:6px; text-align:center;
}
.modal-title{
  font-size:clamp(1.05rem, 3.2vw, 1.25rem);
  text-align:center;
  margin-bottom:14px;
  line-height:1.4;
}
.modal-title b{ color:var(--accent-soft); }
.modal-fields{
  display:flex; gap:12px; justify-content:center; margin-bottom:14px; flex-wrap:wrap;
}
.modal-field{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.modal-field label{ font-size:.8rem; color:var(--text-dim); font-weight:700; text-align:center; max-width:11em; }
.modal-field input{
  width:80px;
  text-align:center;
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.3rem;
  padding:10px 6px;
  border-radius:var(--r-sm);
  border:2px solid var(--border-soft);
  background:var(--surface-strong);
  color:var(--text);
  min-height:var(--tap-min);
}
.modal-feedback{
  text-align:center; min-height:1.6em; font-weight:700; margin-bottom:10px; font-size:.9rem;
}
.modal-feedback.err{ color:var(--error); }
.modal-feedback.ok{ color:var(--primary); }
.modal-actions{ display:flex; gap:10px; }
.modal-actions button{ flex:1; }
.secondary-btn{
  padding:12px; border-radius:var(--r-md); border:1px solid var(--border-soft);
  background:transparent; color:var(--text-dim); font-weight:700; cursor:pointer;
  min-height:48px;
}

/* =========================================================
   PANTALLA DE RESULTADO / CELEBRACIÓN
   ========================================================= */
.result-hero{
  font-size:clamp(2.2rem, 9vw, 3.4rem);
  text-align:center;
}
.result-title{
  font-size:clamp(1.3rem, 4vw, 1.8rem);
  text-align:center;
  margin:8px 0 4px;
}
.result-eq{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.6vw, 1.6rem);
  text-align:center;
  color:var(--primary);
  margin-bottom:20px;
  word-break:break-word;
}
.result-actions{
  display:flex; gap:12px; width:100%; flex-wrap:wrap;
}
.result-actions button{ flex:1 1 160px; }

.confetti-piece{
  position:fixed; top:-10px; z-index:800;
  border-radius:2px;
  animation: fall linear forwards;
  pointer-events:none;
}
@keyframes fall{
  to{ transform:translateY(105vh) rotate(360deg); opacity:.9; }
}

/* =========================================================
   BARRA DE PROGRESO DE COLUMNAS
   ========================================================= */
.progress-track{
  display:flex; gap:6px; width:100%; margin-bottom:16px;
}
.progress-seg{
  flex:1; height:6px; border-radius:4px; background:rgba(255,255,255,.12);
  overflow:hidden;
}
.progress-seg .fill{
  height:100%; width:0%; background:linear-gradient(90deg, var(--primary), var(--blue));
  transition:width .4s ease;
}

/* utilidad de botón de sonido */
.sound-icon{ font-size:1.1em; }

/* =========================================================
   MULTIPLICACIÓN ÁRABE — retícula (propio del recurso)
   ========================================================= */
:root{
  --ink:var(--text); --ink-soft:var(--text-dim); --ink-faint:var(--text-faint);
  --brass:#fbbf24; --brass-dark:#f59e0b; --success:#34d399; --success-bg:rgba(52,211,153,.15);
  --error-bg:rgba(251,113,133,.15); --radius-s:10px; --radius-m:16px; --radius-l:22px;
  --font-num:var(--font-display); --font-ui:var(--font-body);
  --cell-size:calc(var(--cell-base,56px) * var(--f,1));
}
#vista{ width:100%; display:flex; flex-direction:column; }
.hero{ text-align:center; }
.problema-pill{
  align-self:center; font-family:var(--font-num); font-weight:800; letter-spacing:.04em;
  font-size:calc(clamp(1.3rem,4.4vw,1.9rem) * var(--f,1)); color:#fff;
  background:linear-gradient(150deg, rgba(44,20,104,.75), rgba(30,17,71,.75));
  box-shadow:inset 0 0 0 1px rgba(196,181,253,.35); border-radius:16px;
  padding:calc(6px * var(--f,1)) calc(22px * var(--f,1)); margin:0 0 calc(12px * var(--f,1));
}
.lattice-card{ width:100%; display:flex; flex-direction:column; align-items:center; padding:calc(4px * var(--f,1)) 0 0; }
.lattice-row{ display:flex; align-items:flex-start; gap:6px; }
.lattice-left{ display:flex; flex-direction:column; }
.top-digits, .side-digits{ display:flex; }
.top-digits{ justify-content:flex-end; margin-bottom:5px; gap:4px; }
.side-digits{ flex-direction:column; margin-top:calc(var(--cell-size) * .62 + 5px); gap:4px; margin-left:4px; }
.digit-box{
  width:var(--cell-size); height:calc(var(--cell-size) * .62); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .46); color:#fff;
  background:linear-gradient(150deg, rgba(124,58,237,.45), rgba(44,20,104,.7)); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.45);
  border:none; border-radius:12px; text-shadow:0 2px 6px rgba(0,0,0,.45);
}
.side-digits .digit-box{ width:calc(var(--cell-size) * .72); height:var(--cell-size); }
.grid-boxes{ display:grid; gap:4px; }
.lcell{
  width:var(--cell-size); height:var(--cell-size); position:relative; overflow:hidden; border-radius:10px;
  border:2px solid rgba(196,181,253,.75); background:rgba(30,17,71,.55); box-shadow:0 0 14px rgba(124,58,237,.25);
}
.lcell .tri{ position:absolute; inset:0; transition:background-color .35s ease, opacity .35s ease; }
.tri-tens{ clip-path:polygon(0 0,100% 0,0 100%); background:rgba(255,255,255,.05); }
.tri-ones{ clip-path:polygon(100% 0,100% 100%,0 100%); background:rgba(255,255,255,.1); }
.tri.diag-dim{ opacity:.35; } .tri.diag-active{ opacity:1; }
.cell-num{
  position:absolute; z-index:2; font-family:var(--font-num); font-weight:800; line-height:1; pointer-events:none;
  font-size:calc(var(--cell-size) * .36); color:#fff; text-shadow:0 2px 5px rgba(0,0,0,.5);
}
.cell-num.tens-pos{ top:12%; left:12%; } .cell-num.ones-pos{ bottom:10%; right:12%; }
.lcell input.cell-input{
  position:absolute; z-index:2; width:42%; height:42%; border:none; border-radius:7px; padding:0; outline:none;
  background:rgba(8,3,26,.55); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.5); text-align:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .32); color:#fff; user-select:text; -webkit-user-select:text;
}
.lcell input.cell-input.tens-pos{ top:6%; left:6%; } .lcell input.cell-input.ones-pos{ bottom:6%; right:6%; }
.lcell input.cell-input:focus{ background:rgba(124,58,237,.5); box-shadow:0 0 0 2.5px var(--brass), 0 0 14px rgba(251,191,36,.6); }
.lcell input.cell-input.wrong-flash{ background:var(--error-bg); box-shadow:0 0 0 2.5px var(--error); }

.diag-section{ margin-top:calc(22px * var(--f,1)); width:100%; display:flex; flex-direction:column; align-items:center; }
.diag-section h3{ font-size:calc(.86rem * var(--f,1)); font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin-bottom:calc(30px * var(--f,1)); text-align:center; }
.diag-row{ display:flex; gap:calc(8px * var(--f,1)); align-items:flex-end; flex-wrap:wrap; justify-content:center; }
.diag-box-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; }
.carry-badge{
  position:absolute; top:calc(-24px * var(--f,1)); left:50%; transform:translateX(-50%) scale(0); opacity:0;
  font-family:var(--font-num); font-weight:800; font-size:.8rem; color:#3b2405; background:var(--brass);
  border-radius:999px; padding:2px 9px; white-space:nowrap; box-shadow:0 0 10px rgba(251,191,36,.7);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
}
.carry-badge.show{ transform:translateX(-50%) scale(1); opacity:1; }
.diag-box{
  width:calc(clamp(48px,11vw,64px) * var(--f,1)); min-height:calc(clamp(48px,11vw,64px) * var(--f,1));
  border-radius:14px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1));
  border:2.5px solid var(--border-soft); background:rgba(8,3,26,.4); color:var(--text-faint); transition:all .25s ease;
}
.diag-box.pending{ opacity:.55; }
.diag-box input{ width:100%; height:100%; border:none; background:transparent; text-align:center; font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1)); color:#fff; outline:none; user-select:text; -webkit-user-select:text; }
.diag-box.wrong{ animation:shake .32s ease; }
.carry-fly{
  position:fixed; z-index:3000; font-family:var(--font-num); font-weight:800; font-size:.95rem; color:#3b2405;
  background:var(--brass); border-radius:999px; padding:4px 10px; pointer-events:none;
  transition:transform .55s cubic-bezier(.3,.6,.4,1), opacity .55s ease;
}
.final-banner{
  margin-top:calc(16px * var(--f,1)); text-align:center; background:var(--success-bg); border:2px solid var(--success);
  color:var(--success); border-radius:16px; padding:calc(10px * var(--f,1)) 20px; font-weight:800;
  font-family:var(--font-num); font-size:calc(clamp(1.1rem,3.8vw,1.5rem) * var(--f,1));
}
.arabe-final{ width:100%; display:flex; flex-direction:column; align-items:center; }
.arabe-final .mv-fila-chip{ margin-top:calc(8px * var(--f,1)); }
.arabe-final .result-actions{ margin-top:calc(14px * var(--f,1)); }
.setup-box{ width:100%; max-width:480px; margin:0 auto; text-align:center; }
.setup-box label{ display:block; font-weight:700; font-size:.95rem; color:var(--text-dim); margin-bottom:16px; }
.factor-input-row{ display:flex; align-items:center; justify-content:center; gap:clamp(10px,3vw,18px); }
.factor-input{
  width:100%; max-width:150px; font-family:var(--font-num); font-weight:800; font-size:clamp(1.6rem,7vw,2.2rem);

<script>
/* ============================================================================
   LA PARED DE LA DIVISIÓN — algoritmo de la división por agrupación con "muro"
   Índice: 1 utilidades · 2 generación por nivel · 3 motor (prefijo) · 4 estado
   y pantallas · 5 modo/contrarreloj · 6 desafío online · 7 laboratorio ·
   8 tabla y grilla · 9 interacciones · 10 resultado · 11 arranque.
   La "pared" es puro CSS (border-right + border-bottom de las celdas del
   grupo): nunca se calcula por JavaScript. El motor es el original.
   ============================================================================ */
function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}
let toastTimer = null;
function mostrarToast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.opacity = '1'; t.style.transition = '';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.transition = 'opacity .4s ease'; t.style.opacity = '0'; }, 2400);
}
function reaccion(t){ if(window.reaccionCompanero) window.reaccionCompanero(t); }
const PESO_XP_NIVEL = {facil:1, intermedio:3, dificil:5, custom:1};
const EMBEBIDO = (function(){ const p = new URLSearchParams(window.location.search); return !!(p.get('a') && p.get('b') && window.parent !== window); })();

/* ---- 2. GENERACIÓN ---- */
function generarFacil(){
  for(let i = 0; i < 500; i++){
    const d = randInt(2, 9);
    const qMax = Math.floor(99 / d);
    if(qMax < 11) continue;
    const q = randInt(11, qMax);
    const r = randInt(0, d - 1);
    const dividendo = d * q + r;
    if(dividendo >= 30 && dividendo <= 99) return { dividendo, divisor: d };
  }
  return { dividendo: 96, divisor: 8 };
}
function generarIntermedio(){
  for(let i = 0; i < 500; i++){
    const divisor = randInt(2, 9);
    const dividendo = randInt(100, 9999);
    if(dividendo > divisor) return { dividendo, divisor };
  }
  return { dividendo: 1234, divisor: 5 };
}
function generarDificil(){
  for(let i = 0; i < 500; i++){
    const divisor = randInt(11, 99);
    const dividendo = randInt(50, 9999);
    if(dividendo > divisor) return { dividendo, divisor };
  }
  return { dividendo: 987, divisor: 23 };
}
function generarProblema(nivel){
  if(nivel === 'facil') return generarFacil();
  if(nivel === 'intermedio') return generarIntermedio();
  return generarDificil();
}

function validarPersonalizado(divStr, disStr){
  const dividendo = parseInt((divStr || '').trim(), 10);
  const divisor = parseInt((disStr || '').trim(), 10);
  if(!/^\d+$/.test((divStr||'').trim()) || !/^\d+$/.test((disStr||'').trim())){
    return { error: 'Escribe solo números en ambos casilleros.' };
  }
  if(divisor < 1){
    return { error: 'El divisor debe ser 1 o mayor.' };
  }
  if(dividendo <= divisor){
    return { error: 'El dividendo debe ser mayor que el divisor.' };
  }
  if(String(dividendo).length > 6 || String(divisor).length > 4){
    return { error: 'Usa números más pequeños (máximo 6 cifras el dividendo).' };
  }
  return { dividendo, divisor };
}


/* ---- 3. MOTOR ---- */
function calcularPrefijo(digitos, divisor){
  for(let p = 1; p <= digitos.length; p++){
    const val = parseInt(digitos.slice(0, p).join(''), 10);
    if(val >= divisor) return p;
  }
  return digitos.length;
}


/* ---- 4. ESTADO Y PANTALLAS ---- */
const state = {
  screen: 'home',       // 'home' | 'personalizado' | 'lab'
  nivel: null,
  dividendo: 0, divisor: 0, dividendDigits: [],
  prefijoCorrecto: 0,
  tabla: [], tablaAbierta: false, tablaPref: null,
  fase: 'division',      // 'division' | 'final'
  subFase: 'pared',      // 'pared' | 'cociente' | 'falta' | 'bajar' | 'terminado'
  consumido: 0,
  grupos: [],
  cocienteDigitos: [],
  restoFinal: null,
};

function montarChipsVista(n){
  n = n || 0;
  if(typeof window.montarChipCompanero === 'function'){
    const h = document.getElementById('mvChipHome'); if(h && !h.dataset.mv){ h.dataset.mv='1'; window.montarChipCompanero(h, { grande:true }); }
    const r = document.getElementById('mvChipResult'); if(r && !r.dataset.mv){ r.dataset.mv='1'; window.montarChipCompanero(r, { grande:true, celebra:true }); }
    const c = document.getElementById('mvChipHeader'); if(c && !c.dataset.mv){ c.dataset.mv='1'; window.montarChipCompanero(c, { grande:false }); }
  } else if(n < 100){ setTimeout(() => montarChipsVista(n + 1), 100); }
}

function render(){
  const v = document.getElementById('vista');
  v.innerHTML = '';
  let nodo, pant;
  if(state.screen === 'home'){ nodo = renderHome(); pant = 'home'; }
  else if(state.screen === 'personalizado'){ nodo = renderPersonalizado(); pant = 'custom'; }
  else {
    const esResultado = (state.fase === 'final' && !Contrarreloj.activo && !EMBEBIDO);
    nodo = esResultado ? renderResultado() : renderLab();
    pant = esResultado ? 'result' : 'exercise';
  }
  v.appendChild(nodo);
  v.querySelectorAll('input').forEach(i => { i.setAttribute('autocomplete','off'); i.setAttribute('autocorrect','off'); i.setAttribute('autocapitalize','off'); i.setAttribute('enterkeyhint','done'); i.spellcheck = false; });
  document.body.dataset.pantalla = pant;
  document.getElementById('app-header').classList.toggle('hidden', state.screen === 'home' || EMBEBIDO);
  montarChipsVista();
}

function renderHome(){
  const sec = el('section', 'screen'); sec.id = 'screen-home';
  const card = el('div', 'card mv-home');
  card.innerHTML = `
    <a <a class="icon-btn btn-orbita v-azul mv-atras-home" data-atras href="../index.html#recursos" title="Volver" aria-label="Volver"><span class="bola"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 5l-7 7 7 7"/></svg></span></a>
    <a class="icon-btn btn-orbita v-violeta mv-casa-home" href="../index.html" title="Ir al inicio" aria-label="Ir al inicio"><span class="bola"><svg viewBox="0 0 24 24"><path d="M3.5 11.5 12 4l8.5 7.5M6 10v9h12v-9M10 19v-5h4v5"/></svg></span></a>
    <h1 class="home-title" style="font-size:clamp(1.6rem,6.2vw,2.8rem)">Divisiones</h1>
    <p id="indicadorOnline" class="hidden" style="text-align:center; margin:-10px 0 14px; font-size:.85rem; font-weight:800; color:var(--primary);">🟢 Conectado en vivo como <span id="nombreOnline"></span></p>
    <div class="mv-fila-chip" id="mvChipHome"></div>

function tickContrarreloj(){
  Contrarreloj.restante--;

    Contrarreloj.intervalo = null;
    Contrarreloj.activo = false;

function actualizarTimerPill(){
  const m = Math.floor(Contrarreloj.restante/60), s = Contrarreloj.restante%60;
  const pill = document.getElementById('timer-pill');
  pill.textContent = `${m}:${String(s).padStart(2,'0')}`;

  pill.classList.toggle('urgente', Contrarreloj.restante <= 30);
}

let AlumnoActual = null;
function obtenerFechaHoy(){
  const hoy = new Date();
  return `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}-${String(hoy.getDate()).padStart(2,'0')}`;
}
function obtenerDesafioDelDia(){
  const fechaStr = obtenerFechaHoy();
  let hash = 0;
  for(let i=0;i<fechaStr.length;i++){ hash = (hash*31 + fechaStr.charCodeAt(i)) % 100000; }
  const RECURSOS = ['adicion','sustraccion','multiplicacion-arabe','division-algoritmo'];
  const NIVELES = ['facil','intermedio'];
  return { recurso: RECURSOS[hash % RECURSOS.length], nivel: NIVELES[Math.floor(hash/RECURSOS.length) % NIVELES.length], fecha: fechaStr };
}
function verificarRetoDelDia(recurso, nivel){
  const reto = obtenerDesafioDelDia();
  if(reto.recurso === recurso && reto.nivel === nivel && window.reportarRetoDiario){
    window.reportarRetoDiario(AlumnoActual.id, reto.fecha);
  }
}

/* ---- 8-9. TABLA, GRILLA E INTERACCIONES (motor original) ---- */
function construirTablaPanel(){
  const card = el('div', 'tabla-card');
  card.appendChild(el('div', 'tabla-titulo', `Tabla del <b>${state.divisor}</b> <span class="tabla-opcional">(opcional)</span>`));

  const filas = el('div', 'tabla-filas');
  const siguienteIdx = state.tabla.findIndex(f => !f.resuelto);

  state.tabla.forEach((fila, idx) => {
    const filaEl = el('div', 'tabla-fila' + (fila.resuelto ? ' resuelta' : '') + (idx === siguienteIdx ? ' activa' : ''));
    filaEl.appendChild(el('span', '', `${state.divisor}×${fila.n}=`));
    if(fila.resuelto){
      filaEl.appendChild(el('span', 'tabla-valor', String(fila.valor)));
    } else {
      const input = document.createElement('input');
      input.type = 'text'; input.inputMode = 'numeric'; input.className = 'tabla-input';
      input.dataset.idx = idx;
      input.setAttribute('aria-label', `${state.divisor} por ${fila.n}`);
      input.addEventListener('input', () => manejarEntradaTabla(idx, input));
      filaEl.appendChild(input);
    }
    filas.appendChild(filaEl);
  });
  card.appendChild(filas);
  return card;
}

function manejarEntradaTabla(idx, inputEl){
  const val = inputEl.value.replace(/\D/g, '');
  inputEl.value = val;
  if(val === '') return;

  const objetivo = state.tabla[idx].valor;
  if(parseInt(val, 10) === objetivo){
    state.tabla[idx].resuelto = true;
    render();
    if(idx + 1 < state.tabla.length){
      setTimeout(() => {
        const next = document.querySelector(`.tabla-input[data-idx="${idx + 1}"]`);
        if(next) next.focus();
      }, 30);
    }
  } else if(val.length >= String(objetivo).length){
    if(Contrarreloj.activo) Contrarreloj.errores++;
    reportarSiCorresponde(0,1); reaccion('mal');
    inputEl.classList.add('wrong-flash');
    mostrarToast('Esa fila de la tabla no está correcta.');
    setTimeout(() => { inputEl.value = ''; inputEl.classList.remove('wrong-flash'); }, 300);
  }
}

/* ---------------------------------------------------------------------------
   6b. LA GRILLA DE LA DIVISIÓN
   Una sola cuadrícula CSS con una columna fija por cada cifra del dividendo
   (grid-template-columns). Cada cifra —la original, o la que resulta de un
   "falta"— se ubica con grid-column/grid-row calculados por índice, NUNCA
   por flexbox ni márgenes aproximados. Por eso ninguna cifra se corre: cada
   una vive siempre en su misma columna, en la fila que le corresponda según
   el paso del proceso. El "falta" de un grupo vive en la fila donde
   eventualmente aparecerá el grupo siguiente (la cifra que baja se agrega
   ahí mismo, cayendo en línea recta desde su columna de origen).
   ------------------------------------------------------------------------- */
function construirParedStage(){
  const N = state.dividendDigits.length;
  const outer = el('div', 'pared-outer');

  const grid = el('div', 'pared-grid');
  grid.style.gridTemplateColumns = `repeat(${N}, var(--cell))`;

  // Fila 1: las cifras originales del dividendo, cada una en su propia columna
  state.dividendDigits.forEach((d, i) => {
    const item = construirCeldaDividendo(d, i);
    item.style.gridColumn = String(i + 1);
    item.style.gridRow = '1';
    if(state.grupos.length > 0 && i < state.grupos[0].digitos.length){
      const esUltimo = (i === state.grupos[0].digitos.length - 1);
      const historica = state.grupos.length > 1;
      item.classList.add('pared-borde');
      if(esUltimo) item.classList.add('pared-esquina');
      if(historica) item.classList.add('historica');
    }
    grid.appendChild(item);
  });

  // Grupos 2°, 3°, ... cada uno en su propia fila, en las columnas exactas
  // donde terminan (alineados con la cifra original que los originó).
  for(let k = 1; k < state.grupos.length; k++){
    const grupo = state.grupos[k];
    const historica = (k !== state.grupos.length - 1);
    const filaGrid = k + 1;
    const colInicio = grupo.finCol - grupo.digitos.length + 1;
    grupo.digitos.forEach((d, j) => {
      const span = el('span', 'div-digit grupo-digit pared-borde' + (historica ? ' historica' : ''), String(d));
      if(j === grupo.digitos.length - 1){
        span.classList.add('pared-esquina');
      }
      span.style.gridColumn = String(colInicio + j);
      span.style.gridRow = String(filaGrid);
      grid.appendChild(span);
    });
  }

  // El "falta" del grupo activo (pendiente o recién resuelto): vive en la
  // fila donde nacerá el próximo grupo, terminando en la misma columna
  // donde terminó la pared que lo originó.
  if(state.grupos.length > 0){
    construirFaltaEnGrid(grid);
  }

  outer.appendChild(grid);
  outer.appendChild(construirRestoSuperior());
  return outer;
}

function construirCeldaDividendo(d, i){
  const esDelGrupo0 = state.grupos.length > 0 && i < state.grupos[0].digitos.length;
  const consumido = i < state.consumido && !esDelGrupo0;
  const invita = (state.subFase === 'bajar' && i === state.consumido);
  const clickablePared = (state.subFase === 'pared');
  const cell = el('button', 'div-digit' + (consumido ? ' consumido' : '') + (invita ? ' invita clickable' : '') + (clickablePared ? ' clickable' : ''), String(d));
  cell.disabled = !(clickablePared || invita);
  if(clickablePared) cell.onclick = () => clickDigitoPared(i);
  if(invita) cell.onclick = () => clickBajarCifra(i);
  return cell;
}

function construirRestoSuperior(){
  const resto = el('div', 'resto-top-row');
  resto.appendChild(el('span', 'div-sep', ':'));
  resto.appendChild(el('span', 'div-num', String(state.divisor)));
  resto.appendChild(el('span', 'div-sep', '='));
  state.cocienteDigitos.forEach(d => resto.appendChild(el('span', 'div-quot-digit', String(d))));
  if(state.subFase === 'cociente'){
    resto.appendChild(construirInputCociente());
  }
  return resto;
}

function construirInputCociente(){
  const input = document.createElement('input');
  input.type = 'text'; input.inputMode = 'numeric'; input.maxLength = 1;
  input.className = 'div-quot-input';
  input.setAttribute('aria-label', 'Cifra del cociente');
  input.addEventListener('input', () => manejarEntradaCociente(input));
  setTimeout(() => input.focus(), 30);
  return input;
}

function construirFaltaEnGrid(grid){
  const k = state.grupos.length - 1;
  const grupo = state.grupos[k];
  const filaGrid = k + 2;

  if(grupo.resuelto){
    const digitos = String(grupo.falta).split(''); // preserva el 0 a la izquierda si corresponde
    const colInicio = grupo.finCol - digitos.length + 1;
    digitos.forEach((d, j) => {
      const span = el('span', 'div-digit', d);
      span.style.gridColumn = String(colInicio + j);
      span.style.gridRow = String(filaGrid);
      grid.appendChild(span);
    });
    if(grupo.esFinal){
      const slash = el('span', 'falta-slash', '∕∕');
      slash.style.gridColumn = String(grupo.finCol + 1);
      slash.style.gridRow = String(filaGrid);
      grid.appendChild(slash);
    }
    return;
  }

  if(state.subFase === 'falta'){
    const correcto = grupo.numero - state.divisor * grupo.cocienteDigito;
    const len = String(correcto).length;
    const colInicio = grupo.finCol - len + 1;
    const input = document.createElement('input');
    input.type = 'text'; input.inputMode = 'numeric'; input.className = 'falta-input';
    input.setAttribute('aria-label', 'Cuánto falta para llegar a ' + grupo.numero);
    input.addEventListener('input', () => manejarEntradaFalta(input));
    input.style.gridColumn = `${colInicio} / ${grupo.finCol + 1}`;
    input.style.gridRow = String(filaGrid);
    grid.appendChild(input);
    setTimeout(() => input.focus(), 30);
  }
}

/* ---------------------------------------------------------------------------
   8. INTERACCIONES DEL PROCESO
   ------------------------------------------------------------------------- */
function clickDigitoPared(i){
  if(state.subFase !== 'pared') return;
  const correcto = (i === state.prefijoCorrecto - 1);
  if(!correcto){
    if(Contrarreloj.activo) Contrarreloj.errores++;
    reportarSiCorresponde(0,1); reaccion('mal');
    mostrarToast(`Esa no es la cifra correcta. Piensa: ¿alcanza el ${state.divisor} en las cifras tomadas hasta ahí?`);
    return;
  }
  state.consumido = state.prefijoCorrecto;
  const digitos = state.dividendDigits.slice(0, state.prefijoCorrecto);
  state.grupos.push({
    digitos, numero: parseInt(digitos.join(''), 10),
    cocienteDigito: null, falta: null, resuelto: false, esFinal: false, finCol: state.consumido,
  });
  state.subFase = 'cociente';
  render();
}

function manejarEntradaCociente(inputEl){
  const val = inputEl.value.replace(/\D/g, '').slice(0, 1);
  inputEl.value = val;
  if(val === '') return;

  const grupo = state.grupos[state.grupos.length - 1];
  const correcto = Math.floor(grupo.numero / state.divisor);
  if(parseInt(val, 10) === correcto){
    grupo.cocienteDigito = correcto;
    state.cocienteDigitos.push(correcto);
    state.subFase = 'falta';
    render();
  } else {
    if(Contrarreloj.activo) Contrarreloj.errores++;
    reportarSiCorresponde(0,1); reaccion('mal');
    inputEl.classList.add('wrong-flash');
    mostrarToast(`Ese número no es correcto. Revisa la tabla del ${state.divisor}.`);
    setTimeout(() => { inputEl.value = ''; inputEl.classList.remove('wrong-flash'); }, 260);
  }
}

function manejarEntradaFalta(inputEl){
  const val = inputEl.value.replace(/\D/g, '');
  inputEl.value = val;
  if(val === '') return;

  const grupo = state.grupos[state.grupos.length - 1];
  const correcto = grupo.numero - state.divisor * grupo.cocienteDigito;
  if(parseInt(val, 10) === correcto){
    grupo.falta = correcto;
    grupo.resuelto = true;
    const quedanCifras = state.consumido < state.dividendDigits.length;
    if(quedanCifras){
      state.subFase = 'bajar';
      render();
      setTimeout(() => {
        const invita = document.querySelector('.div-digit.invita');
        if(invita) invita.focus();
      }, 30);
    } else {
      grupo.esFinal = true;
      state.restoFinal = correcto;
      state.fase = 'final';
      state.subFase = 'terminado';
      render();
      reaccion('bien');
      const _nivXp = Contrarreloj.activo ? Contrarreloj.nivel : (state.nivel === 'personalizado' ? 'custom' : state.nivel);
      if(AlumnoActual) window.reportarProgresoPractica(AlumnoActual.id, 'division-algoritmo', 1, 0, PESO_XP_NIVEL[_nivXp] || 1);
      if(AlumnoActual) verificarRetoDelDia('division-algoritmo', Contrarreloj.activo ? Contrarreloj.nivel : state.nivel);
      reportarSiCorresponde(1,0);
      if(Contrarreloj.activo){
        Contrarreloj.completados++;
        document.getElementById('contador-pill').textContent = '✓ '+Contrarreloj.completados;
        setTimeout(() => {
          if(!Contrarreloj.activo) return;
          iniciarProblema(Contrarreloj.nivel);
        }, 900);
      }
    }
  } else if(val.length >= String(correcto).length){
    if(Contrarreloj.activo) Contrarreloj.errores++;
    reportarSiCorresponde(0,1); reaccion('mal');
    inputEl.classList.add('wrong-flash');
    mostrarToast('Ese no es el resto correcto todavía.');
    setTimeout(() => { inputEl.value = ''; inputEl.classList.remove('wrong-flash'); }, 300);
  }
}

function clickBajarCifra(i){
  if(state.subFase !== 'bajar' || i !== state.consumido) return;
  const digito = state.dividendDigits[i];
  const grupoPrevio = state.grupos[state.grupos.length - 1];

  // Se concatenan las CIFRAS (como texto) del "falta" anterior con la nueva,
  // en vez de recalcular el número y volver a convertirlo a texto: así, si el
  // falta era 0, ese 0 se conserva (ej. "0"+"4" = "04") en lugar de perderse
  // (lo que pasaría si se hiciera 0*10+4=4 y luego String(4)="4").
  const digitosPrevios = String(grupoPrevio.falta).split('');
  const digitosNuevos = [...digitosPrevios, String(digito)].map(Number);
  const numero = grupoPrevio.falta * 10 + digito;

  state.consumido += 1;
  state.grupos.push({
    digitos: digitosNuevos, numero,
    cocienteDigito: null, falta: null, resuelto: false, esFinal: false, finCol: state.consumido,
  });
  state.subFase = 'cociente';
  render();
}



/* ---- 10. RESULTADO ---- */
function renderResultado(){

    <div class="result-actions">
      <button class="btn-orbita v-azul" id="btn-change-level" type="button"><span class="bola"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.2"/><path d="M3 15.5c-1.2-2.2 3-6.2 9-8M21 8.5c1.2 2.2-3 6.2-9 8"/></svg></span><span>Cambiar nivel</span></button>
      <button class="btn-orbita v-verde" id="btn-again" type="button"><span class="bola"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg></span><span>Siguiente</span></button>
    </div>`;

}

/* Mantiene el cursor en el cuadro activo: tocar fuera no lo pierde */
function enfocarActivo(){
  const t = document.querySelector('.div-quot-input, .falta-input');
  if(t && document.activeElement !== t) t.focus();
}
['mousedown', 'touchstart'].forEach(ev => document.addEventListener(ev, (e) => {
  if(state.screen !== 'lab' || state.fase === 'final') return;
  if(!document.querySelector('.div-quot-input, .falta-input')) return;
  if(e.target.closest && e.target.closest('input, button, a, .modal-overlay, #app-header')) return;
  e.preventDefault();
  enfocarActivo();
}, { passive:false }));

/* Botones del encabezado */
document.getElementById('btn-back').addEventListener('click', () => {
  if(state.screen === 'lab') volverAlInicio();
  else if(state.screen === 'personalizado'){ state.screen = 'home'; render(); }
});
document.getElementById('btn-reset').addEventListener('click', () => {
  if(state.screen === 'lab'){
    iniciarConDatos(state.dividendo, state.divisor, state.nivel);
  } else if(state.screen === 'personalizado'){
    const a = document.getElementById('inDividendo'), b = document.getElementById('inDivisor');
    if(a) a.value = ''; if(b) b.value = '';
    if(a) a.focus();
  }
});

/* Ajuste a la altura: si la pantalla no cabe, se achican un poco los tamaños (--f) para evitar el scroll */
(function(){
  const raiz = document.documentElement; let pend = false;
  function ajustar(){
    pend = false;
    let f = 1; raiz.style.setProperty('--f', '1');
    const sobra = () => raiz.scrollHeight - window.innerHeight;
    let guardia = 0;
    while(sobra() > 1 && f > 0.5 && guardia++ < 16){ f = Math.max(0.5, f - 0.04); raiz.style.setProperty('--f', f.toFixed(2)); }
  }
  function pedir(){ if(!pend){ pend = true; requestAnimationFrame(ajustar); } }
  window.addEventListener('resize', pedir);
  window.addEventListener('load', () => { pedir(); setTimeout(pedir, 800); });
  new MutationObserver(pedir).observe(document.getElementById('main'), { subtree:true, childList:true, attributes:true, attributeFilter:['class'] });
  pedir();
})();

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";

import { getFirestore, doc, getDoc, setDoc, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDrwcG84h88gOf9FkUlZbECZ2qrO14KhO4",
  authDomain: "profehoracio-online.firebaseapp.com",
  projectId: "profehoracio-online",
  storageBucket: "profehoracio-online.firebasestorage.app",

};
const app = initializeApp(firebaseConfig, "onlineDivision");
const auth = getAuth(app);
const db = getFirestore(app);

window.unirseClaseOnline = async function(codigo, nombre){
  try{
    const userCredential = await signInAnonymously(auth);
    const uid = userCredential.user.uid;

    const sessionRef = doc(db, 'sessions', codigo);
    const sessionSnap = await getDoc(sessionRef);
    if(!sessionSnap.exists()) return { ok:false, error:'Ese código no existe. Revísalo con tu profesor.' };
    const datos = sessionSnap.data();

    if(datos.active === false) return { ok:false, error:'Tu profesor ya cerró esta sesión.' };
    if(datos.recurso && datos.recurso !== 'division-algoritmo') return { ok:false, error:`Ese código es para ${datos.recurso}, no para Divisiones.` };

    const duracionMinutos = datos.duracionMinutos || 180;
    if(datos.createdAt){
      const minutosTranscurridos = (Date.now() - datos.createdAt.toDate().getTime()) / 60000;
      if(minutosTranscurridos > duracionMinutos) return { ok:false, error:'Este código ya venció. Pídele uno nuevo a tu profesor.' };
    }

    return { ok:true, uid, nivelObjetivo: datos.nivelObjetivo, modoObjetivo: datos.modoObjetivo };
  } catch(err){
    console.error(err);
    return { ok:false, error:'Error de conexión. Intenta de nuevo.' };
  }
};

window.iniciarNuevoIntentoOnline = async function(codigo, docId, nombre, uid){
  if(!codigo || !docId) return;
  try{
    await setDoc(doc(db, 'sessions', codigo, 'students', docId), {
      name: nombre, uid: uid || null, startedAt: serverTimestamp(), completados: 0, errores: 0, mascota: (window.mascotaParaClase ? await window.mascotaParaClase() : null)
    });
  } catch(err){
    console.error('No se pudo iniciar el intento online:', err);
  }
};

window.reportarProgresoOnline = async function(codigo, docId, deltaCompletados, deltaErrores){
  if(!codigo || !docId) return;
  try{
    await setDoc(doc(db, 'sessions', codigo, 'students', docId), {
      completados: increment(deltaCompletados || 0),
      errores: increment(deltaErrores || 0),
      updatedAt: serverTimestamp()
    }, { merge: true });
  } catch(err){
    console.error('No se pudo reportar el progreso online:', err);
  }
};
// Si se llega desde el inicio con un código de clase en el enlace
// (?codigoClase=XXXX), se une solo, sin mostrar el botón ni el modal --
// ya sea con la cuenta que ya tenía la sesión, o como invitado si vino
// con ?invitado=Nombre (ese nombre ya pasó por el filtro en el inicio).
try{
  const parametrosUrl = new URLSearchParams(location.search);
  const codigoDesdeUrl = parametrosUrl.get('codigoClase');
  const invitadoDesdeUrl = parametrosUrl.get('invitado');
  let nombreParaUnirse = null;
  if(AlumnoActual) nombreParaUnirse = AlumnoActual.nombre;
  else if(invitadoDesdeUrl && invitadoDesdeUrl.trim()) nombreParaUnirse = `👤 Invitado: ${invitadoDesdeUrl.trim()}`;

  if(codigoDesdeUrl && nombreParaUnirse){
    (async () => {
      const resultado = await window.unirseClaseOnline(codigoDesdeUrl.toUpperCase(), nombreParaUnirse);
      if(!resultado.ok){ alert(resultado.error); return; }
      Online.activo = true; Online.codigo = codigoDesdeUrl.toUpperCase(); Online.uid = resultado.uid; Online.nombre = nombreParaUnirse;
      registrarInicioOnline();
      // Ojo: en algunos recursos este indicador recién se dibuja cuando se
      // muestra la pantalla de niveles -- si un invitado llega sin sesión
      // previa, puede que todavía no exista en el DOM.
      const _indEl = document.getElementById('indicadorOnline');
      if(_indEl){ _indEl.classList.remove('hidden'); document.getElementById('nombreOnline').textContent = nombreParaUnirse; }
      if(resultado.modoObjetivo === 'contrarreloj'){ startContrarreloj(resultado.nivelObjetivo); }
      else { iniciarProblema(resultado.nivelObjetivo); }
    })();
  }
} catch(e){ console.error(e); }
