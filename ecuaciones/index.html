<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Ecuaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   LABORATORIO DE ECUACIONES
   Hoja de estilos: tokens de diseño + componentes
   ========================================================================== */
:root{
  color-scheme: dark;
  /* --- Paleta ------------------------------------------------------------ */
  --bg-1:          #1e1147;
  --bg-2:          #3b1785;
  --bg-3:          #5b21b6;
  --bg-line:       rgba(255,255,255,.05);
  --surface:       rgba(255,255,255,.07);
  --surface-soft:  rgba(255,255,255,.05);
  --border-soft:   rgba(255,255,255,.16);
  --ink:           #f6f3ff;   /* tinta principal */
  --ink-soft:      #c9bdf0;
  --ink-faint:     #8f7fc4;

  --wall:          #fbbf24;   /* viga / pivote de la balanza (= acento de la colección) */
  --wall-dark:     #f59e0b;
  --wall-light:    rgba(251,191,36,.35);

  --num:           #38bdf8;   /* piezas numéricas (constantes) */
  --num-dark:      #7dd3fc;
  --num-bg:        rgba(56,189,248,.22);

  --var:           #f472b6;   /* piezas de la incógnita / coeficiente / denominador */
  --var-dark:      #f9a8d4;
  --var-bg:        rgba(244,114,182,.24);

  --success:       #34d399;
  --success-bg:    rgba(52,211,153,.16);
  --error:         #fb7185;
  --error-bg:      rgba(251,113,133,.16);

  --radius-s: 10px;
  --radius-m: 16px;
  --radius-l: 26px;
  --shadow-piece: 0 6px 0 rgba(0,0,0,0.25), 0 10px 18px rgba(0,0,0,0.35);
  --shadow-card: 0 14px 34px rgba(0,0,0,0.4);

  --font-display: 'Baloo 2', 'Trebuchet MS', 'Comic Sans MS', sans-serif;
  --font-body: 'Nunito', 'Segoe UI', sans-serif;
}

*{ box-sizing: border-box; }

html,body{
  margin:0; padding:0; height:100%;
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2)),
    linear-gradient(var(--bg-line) 1px, transparent 1px) 0 0/100% 34px;
  background-attachment: fixed;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
  overflow-x: hidden;
}

body{ min-height:100vh; display:flex; flex-direction:column; }

button{ font-family:inherit; }

h1,h2,h3{ font-family: var(--font-display); margin:0; color: var(--ink); }

::selection{ background: var(--wall-light); }

:focus-visible{
  outline: 3px solid var(--wall-dark);
  outline-offset: 3px;
  border-radius: 8px;
}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ==========================================================================
   Layout general
   ========================================================================== */
#app{
  flex: 1;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
  padding: 20px 16px 40px;
}

.wrap{
  width:100%;
  max-width: 980px;
  margin: 0 auto;
}

.top-nav{
  width:100%; max-width:980px; margin:0 auto 14px;
  display:flex; align-items:center; justify-content:space-between;
  gap: 10px; flex-wrap:wrap;
}

.ghost-btn{
  border: 2px solid var(--border-soft);
  background: var(--surface);
  color: var(--ink-soft);
  font-weight: 800;
  font-size: 0.95rem;
  padding: 9px 16px;
  border-radius: 999px;
  cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
  transition: transform .15s ease, box-shadow .15s ease, color .15s ease, border-color .15s ease;
}
.ghost-btn:hover{ transform: translateY(-2px); border-color: var(--wall); color: var(--wall-dark); box-shadow: 0 6px 14px rgba(23,50,74,0.08); }
.ghost-btn:active{ transform: translateY(0); }

/* ==========================================================================
   Pantalla: Inicio
   ========================================================================== */
.hero{ text-align:center; padding: 26px 10px 10px; }
.hero h1{ font-size: clamp(2.1rem, 5.5vw, 3.4rem); line-height:1.05; margin-bottom: 12px; }
.hero p{ color: var(--ink-soft); font-size: 1.08rem; max-width: 560px; margin: 0 auto 30px; font-weight:600; }

/* Home Clásico: mismo botón de nivel que el resto de la colección */
.level-grid{ display:grid; grid-template-columns:repeat(2, 1fr); gap:clamp(10px, 2.5vw, 16px); width:100%; max-width:520px; margin:0 auto; }
@media (max-width:480px){ .level-grid{ grid-template-columns:1fr; } }
.level-btn{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  padding:clamp(16px,4vw,22px) 10px; border-radius:var(--radius-m); border:none;
  color:#fff; cursor:pointer; font-family:var(--font-display); font-weight:800;
  font-size:clamp(1rem, 2.6vw, 1.15rem); min-height:96px; transition:transform .15s, box-shadow .15s;
  box-shadow:0 4px 14px rgba(0,0,0,.35);
}
.level-btn:hover{ transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.4); }
.level-btn:active{ transform:translateY(0) scale(.98); }
.level-btn .emoji{ font-size:clamp(1.5rem, 4.5vw, 1.9rem); }
.level-btn.easy{ background:linear-gradient(140deg,#0f9d70,#34d399); }
.level-btn.mid{ background:linear-gradient(140deg,#1d4ed8,#38bdf8); }
.level-btn.hard{ background:linear-gradient(140deg,#b91c66,#f472b6); }
.level-btn.custom{ background:linear-gradient(140deg,#92400e,#fbbf24); color:#fff; }

/* ==========================================================================
   Pantallas: Selección de nivel / tipo
   ========================================================================== */
.step-title{ text-align:center; margin-bottom: 26px; }
.step-title h2{ font-size: clamp(1.5rem,4vw,2.1rem); }
.step-title p{ color: var(--ink-soft); font-weight:600; margin-top:6px; }

.option-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 16px; }

.option-card{
  background: var(--surface); backdrop-filter: blur(6px); border: 2.5px solid var(--border-soft); border-radius: var(--radius-m);
  padding: 20px; text-align:center; cursor:pointer; box-shadow: 0 8px 20px rgba(23,50,74,0.08);
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.option-card:hover{ transform: translateY(-4px); border-color: var(--wall); box-shadow: 0 14px 26px rgba(23,50,74,0.14); }
.option-card .badge{
  display:inline-block; font-family:var(--font-display); font-weight:700; font-size: 1.5rem; color: var(--num-dark);
  background: var(--num-bg); border-radius: 12px; padding: 10px 18px; margin-bottom:12px;
}
.option-card.mid .badge{ color: var(--num-dark); background: var(--num-bg); }
.option-card.hard .badge{ color: var(--var-dark); background: var(--var-bg); }
.option-card h3{ font-size:1.1rem; margin-bottom:4px; }
.option-card p{ margin:0; color:var(--ink-soft); font-weight:700; font-size:.92rem; }
.option-card .formula{ font-family: var(--font-display); font-size: 1.2rem; color: var(--ink); margin-top: 6px; }

/* ==========================================================================
   Pantalla: crear ecuación propia (formulario)
   ========================================================================== */
.param-card{
  background: var(--surface); border:1px solid var(--border-soft); backdrop-filter: blur(6px); border-radius: var(--radius-l); padding: 28px 26px;
  box-shadow: var(--shadow-card); max-width: 560px; margin: 0 auto;
}

.ec-input{
  width:100%; font-family:var(--font-display); font-size:1.5rem; text-align:center;
  border:2.5px solid var(--border-soft); border-radius:14px; padding:14px 10px; color:var(--ink);
  background: var(--surface); letter-spacing:.5px; margin-bottom:14px;
}
.ec-input:focus{ border-color:var(--wall); outline:none; }
.ec-op-row{ display:flex; justify-content:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
.ec-op-btn{
  width:48px; height:48px; border-radius:50%; border:2px solid var(--border-soft);
  background:var(--surface-soft); color:var(--ink); font-family:var(--font-display); font-weight:800;
  font-size:1.2rem; cursor:pointer; transition: border-color .15s, transform .15s;
}
.ec-op-btn:hover{ border-color:var(--wall); transform:translateY(-2px); }
.param-preview{ background: var(--surface-soft); border-radius:14px; padding:16px; margin-bottom:12px; display:flex; justify-content:center; }
.param-warning{ text-align:center; font-weight:800; font-size:.9rem; padding:9px 12px; border-radius:10px; margin-bottom:16px; display:none; }
.param-warning.show{ display:block; background:rgba(251,191,36,.14); color:var(--wall-dark); }
.param-warning.show.ok{ background:var(--success-bg); color:var(--success); }
.param-warning.show.error{ background:var(--error-bg); color:var(--error); }
#btnCrearManual{ width:100%; }
#btnCrearManual:disabled{ opacity:.5; cursor:not-allowed; }

/* ==========================================================================
   Pantalla: Laboratorio
   ========================================================================== */
.lab-header{ text-align:center; margin-bottom: 6px; }
.lab-header .level-pill{
  display:inline-block; font-weight:800; font-size:.78rem; letter-spacing:.04em; text-transform:uppercase;
  color:var(--wall-dark); background:rgba(251,191,36,.14); border:1px solid rgba(251,191,36,.4); padding:5px 14px; border-radius:999px; margin-bottom:10px;
}
.lab-header h2{ font-size: clamp(1.3rem, 3.6vw, 1.7rem); color: var(--ink-soft); font-weight:800; }

.progress-dots{ display:flex; gap:8px; justify-content:center; margin: 12px 0 6px; }
.progress-dots span{ width:10px; height:10px; border-radius:50%; background:var(--border-soft); }
.progress-dots span.done{ background: var(--success); }
.progress-dots span.now{ background: var(--wall); box-shadow: 0 0 0 4px var(--wall-light); }

.hint-banner{
  text-align:center; font-weight:700; color: var(--ink-soft);
  background: var(--surface-soft); border: 1.5px dashed var(--border-soft);
  border-radius: 14px; padding: 10px 16px; margin: 14px auto 8px; max-width: 620px; font-size: .95rem;
}
.hint-banner b{ color: var(--wall-dark); }

.lab-stage{
  position:relative; background: var(--surface); border:1px solid var(--border-soft); backdrop-filter: blur(6px); border-radius: var(--radius-l); box-shadow: var(--shadow-card);
  padding: clamp(22px, 5vw, 46px) clamp(10px, 4vw, 30px); margin-top: 14px; min-height: 190px;
  display:flex; align-items:center; justify-content:center; gap: clamp(10px, 3vw, 28px); overflow: visible;
}

.stage-side{
  flex: 1 1 0; min-width: 0; display:flex; align-items:center; justify-content: center;
  flex-wrap: nowrap; gap: 10px; min-height: 84px; transition: opacity .2s ease;
}
.stage-side.left{ justify-content:flex-end; transform-origin: right center; }
.stage-side.right{ justify-content:flex-start; transform-origin: left center; }
@media (max-width: 560px){ .stage-side.left, .stage-side.right{ justify-content:center; transform-origin: center center; } }

/* Celulares angostos: se prioriza achicar fichas y pared sobre amontonarlas */
@media (max-width: 480px){
  .lab-stage{ gap: clamp(6px, 2vw, 14px); padding: 16px 8px; }
  .stage-side{ gap: 6px; }
  .piece{ font-size: clamp(1.05rem, 4.8vw, 1.5rem); padding: 8px 12px; }
  .sign-static{ font-size: clamp(.95rem, 4vw, 1.2rem); }
  .equals-wall{ width: 44px; min-width: 44px; height: 100px; }
  .equals-wall .eq-text{ font-size: clamp(1.5rem, 6vw, 2rem); }
}

/* --- Piezas -------------------------------------------------------------- */
.piece{
  font-family: var(--font-display); font-weight: 700; font-size: clamp(1.5rem, 4.2vw, 2.1rem);
  border: none; border-radius: var(--radius-s); padding: 12px 18px; cursor: grab;
  user-select:none; -webkit-user-select:none; touch-action: none;
  box-shadow: var(--shadow-piece); transition: transform .15s ease, box-shadow .15s ease, opacity .25s ease;
  line-height:1; display:inline-flex; align-items:center; justify-content:center;
}
.piece:active{ cursor:grabbing; }
.piece.dragging{ cursor:grabbing; z-index: 500; box-shadow: 0 14px 26px rgba(23,50,74,0.28); }
.piece.locked{ cursor: default; opacity:.55; }
.piece.tight-left{ margin-right:-6px; }

.piece-num{ background: var(--num-bg); color: var(--num-dark); }
.piece-var, .piece-coef, .piece-den{ background: var(--var-bg); color: var(--var-dark); }
.piece-placeholder{ visibility:hidden; }

/* Fracción "viva": x y denominador son piezas separadas y arrastrables,
   apiladas visualmente para que se vean como una sola fracción. */
.frac-live{ display:flex; flex-direction:column; align-items:center; gap:3px; }
.frac-live .piece-den{ border-top: 3px solid var(--var-dark); border-radius: 0 0 var(--radius-s) var(--radius-s); padding-top:9px; }
.frac-live .piece-var{ border-radius: var(--radius-s) var(--radius-s) 0 0; padding-bottom:9px; }

.sign-static{ font-family:var(--font-display); font-weight:700; font-size:clamp(1.2rem,3.6vw,1.7rem); color:var(--ink-soft); padding: 0 2px; }

/* --- Pared / balanza ------------------------------------------------------ */
.equals-wall{
  position:relative; background:none; border:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  width: 70px; min-width:70px; height: 120px; font-family: var(--font-display); font-weight:800; color: var(--ink);
}
.equals-wall .eq-text{ font-size: clamp(2rem, 5vw, 2.6rem); transition: opacity .2s ease, transform .2s ease; }
.equals-wall.active .eq-text{ opacity:0; transform: scale(.6); position:absolute; }

.wall-pillar{
  position:relative; width: 16px; height: 0px; border-radius: 10px;
  background: linear-gradient(180deg, var(--wall-light), var(--wall) 45%, var(--wall-dark));
  box-shadow: 0 4px 12px rgba(201,127,31,0.35);
  transition: height .45s cubic-bezier(.34,1.56,.64,1);
}
.equals-wall.active .wall-pillar{ height: 108px; }

.wall-foot{
  position:absolute; left:50%; transform: translateX(-50%) scale(0); width: 0; height:0;
  border-left: 12px solid transparent; border-right: 12px solid transparent; transition: transform .3s ease .1s;
}
.equals-wall.active .wall-foot{ transform: translateX(-50%) scale(1); }
.wall-foot.top{ top:-2px; border-bottom: 14px solid var(--wall-dark); }
.wall-foot.bottom{ bottom:-2px; border-top: 14px solid var(--wall-dark); }

.wall-notch{
  position:absolute; left:50%; width: 30px; height:5px; border-radius:3px;
  background: var(--surface-soft); transform: translateX(-50%) scaleX(0); transition: transform .25s ease .2s;
}
.equals-wall.active .wall-notch{ transform: translateX(-50%) scaleX(1); }
.wall-notch.n1{ top: 40%; }
.wall-notch.n2{ top: 58%; }

.wall-tap-hint{
  position:absolute; bottom:-26px; left:50%; transform:translateX(-50%);
  font-family: var(--font-body); font-weight:700; font-size:.72rem; color: var(--wall-dark);
  white-space:nowrap; animation: bob 1.4s ease-in-out infinite;
}
@keyframes bob{ 0%,100%{ transform:translate(-50%,0);} 50%{ transform:translate(-50%,-4px);} }

/* --- Historial -------------------------------------------------------------- */
.history-panel{
  margin-top: 22px; background: var(--surface); border:1px solid var(--border-soft); backdrop-filter: blur(6px); border-radius: var(--radius-m);
  box-shadow: 0 8px 20px rgba(23,50,74,0.08); padding: 16px clamp(12px,4vw,24px) 20px;
}
.history-panel h4{
  font-family: var(--font-body); font-weight:800; color: var(--ink-soft);
  font-size:.82rem; text-transform:uppercase; letter-spacing:.05em; margin-bottom: 10px;
}
.history-row{
  display:flex; align-items:center; justify-content:center; gap: 10px; padding: 9px 4px;
  font-family: var(--font-display); font-size: 1.15rem; border-top: 1px dashed var(--border-soft); flex-wrap:wrap;
}
.history-row:first-child{ border-top:none; }
.history-row.final{ color: var(--success); font-weight:800; }
.history-row .mini-piece{ padding: 4px 9px; border-radius:8px; font-size:1rem; }
.history-row .mini-lado{ display:inline-flex; align-items:center; flex-wrap:wrap; gap:2px; }
.history-row .mini-num{ background: var(--num-bg); color:var(--num-dark); }
.history-row .mini-var{ background: var(--var-bg); color:var(--var-dark); }
.history-row .mini-expr{ color: var(--ink-soft); font-weight:700; font-size:.95rem; }
.history-row .mini-frac{ display:inline-flex; flex-direction:column; align-items:center; font-size:.85em; line-height:1.1; }
.history-row .mini-frac .fd{ border-top:2px solid var(--var-dark); padding-top:2px; min-width:1.2em; text-align:center; }
.history-row .mini-eq{ color:var(--ink-faint); font-weight:800; }

/* ==========================================================================
   Modal (elegir operación / calcular)
   ========================================================================== */
.overlay{
  position:fixed; inset:0; background: rgba(10,4,30,.6); display:flex; align-items:center; justify-content:center;
  z-index:1000; padding: 18px; backdrop-filter: blur(3px); animation: fadeIn .18s ease;
}
@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }

.modal-card{
  background: linear-gradient(160deg, #2c1468, #4c1d95); border:1px solid var(--border-soft); border-radius: var(--radius-l); padding: 28px 26px; max-width: 420px; width:100%;
  box-shadow: 0 30px 60px rgba(0,0,0,0.28); text-align:center; animation: pop .22s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{ from{ transform: scale(.85); opacity:0;} to{ transform:scale(1); opacity:1;} }

.modal-card h3{ font-size:1.25rem; margin-bottom: 6px; }
.modal-card .modal-sub{ color: var(--ink-soft); font-weight:700; font-size:.95rem; margin-bottom:18px; }

.op-grid{ display:grid; grid-template-columns: repeat(4,1fr); gap:10px; }
.op-btn{
  font-family: var(--font-display); font-size: 1.7rem; font-weight:800;
  background: var(--surface-soft); border: 2px solid var(--border-soft); color: var(--ink);
  border-radius: 14px; padding: 14px 0; cursor:pointer;
  transition: transform .12s ease, background .12s ease, border-color .12s ease;
}
.op-btn:hover{ transform: translateY(-2px); border-color: var(--wall); background: rgba(251,191,36,.18); }
.op-btn:active{ transform: translateY(0); }

.compute-expr{ font-family: var(--font-display); font-size: 1.8rem; color: var(--ink); background: var(--surface-soft); border-radius: 14px; padding: 14px; margin-bottom: 16px; }
.compute-input-row{ display:flex; gap:10px; }
.compute-input{ flex:1; font-family:var(--font-display); font-size:1.4rem; text-align:center; border: 2.5px solid var(--border-soft); border-radius: 12px; padding: 10px; color:var(--ink); min-width:0; background:var(--surface); }
.compute-input:focus{ border-color: var(--wall); outline:none; }
.compute-submit{ background: var(--wall); color:#3b2405; border:none; border-radius:12px; padding: 0 22px; font-weight:800; font-size:1rem; cursor:pointer; }
.compute-submit:hover{ background: var(--wall-dark); }

.modal-msg{ margin-top: 14px; padding: 10px 12px; border-radius:12px; font-weight:700; font-size:.92rem; display:none; }
.modal-msg.show{ display:block; animation: shake .3s ease; }
.modal-msg.error{ background: var(--error-bg); color: var(--error); }
.modal-msg.ok{ background: var(--success-bg); color: var(--success); }
@keyframes shake{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-7px);} 40%,60%{transform:translateX(7px);} }

/* --- Celebración ------------------------------------------------------- */
.celebrate-card{ text-align:center; }
.celebrate-emoji{ font-size: 3rem; margin-bottom:6px; }
.celebrate-card .result-line{
  font-family: var(--font-display); font-size: 2.1rem; color: var(--success); font-weight:800;
  background: var(--success-bg); border-radius: 14px; padding: 14px; margin: 14px 0 18px;
}
.primary-btn{
  background: var(--wall); color:#3b2405; border:none; border-radius: 999px; padding: 13px 26px;
  font-weight:800; font-size:1rem; cursor:pointer; box-shadow: 0 8px 18px rgba(232,163,61,0.4);
}
.primary-btn:hover{ background: var(--wall-dark); }
.secondary-btn{
  background: var(--surface-soft); color: var(--ink-soft); border:2px solid var(--border-soft);
  border-radius:999px; padding: 11px 22px; font-weight:800; font-size:.95rem; cursor:pointer; margin-top:10px;
}
.btn-row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:6px; }

footer.credits{ text-align:center; color: var(--ink-faint); font-weight:700; font-size:.78rem; padding: 18px 10px 4px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

<script>
/* ============================================================================
   LABORATORIO DE ECUACIONES — lógica de la aplicación
   Estructura del archivo:
     1. Utilidades numéricas y de identificadores
     2. Motor de ecuaciones: construcción de términos (compartido entre
        generación aleatoria y creación manual) + generación aleatoria
     3. Estado global de la aplicación (máquina de pantallas)
     4. Render de pantallas (inicio, nivel, tipo, formulario manual, laboratorio)
     5. Render del "stage" interactivo (piezas, fracciones, pared, historial)
     6. Arrastre (Pointer Events, compatible mouse + táctil)
     7. Validación de movimientos (elegir operación inversa + calcular)
     8. Modal de operación / cálculo / celebración final

   NOTA DE DISEÑO — fracciones:
   La incógnita (x) y el denominador de una fracción son DOS piezas
   independientes que se muestran apiladas (una fracción visual), pero solo
   el denominador se arrastra al cruzar la pared: la x permanece fija en su
   lugar, tal como al aislar una incógnita en papel.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   1. UTILIDADES
   ------------------------------------------------------------------------- */
function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }

let _uid = 0;
function uid(prefix){ return prefix + (++_uid); }

function prefersReducedMotion(){
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

/* ---------------------------------------------------------------------------
   2. MOTOR DE ECUACIONES
   Cada término es un objeto:
     { id, kind: 'num'|'var'|'coef'|'den', side: 'left'|'right',
       value (num/coef/den: magnitud >=0), sign (1|-1, solo 'num'),
       fracGroup (id compartido entre 'var' y 'den' de una misma fracción) }
   ------------------------------------------------------------------------- */
const TIPOS_FACIL = ['suma','resta','mult','div'];
const TIPOS_DIFICIL = ['ax+b','ax-b','x/a+b','x/a-b'];

const ETIQUETAS_TIPO = {
  suma:   { titulo:'Suma',                   formula:'x + b = c' },
  resta:  { titulo:'Resta',                  formula:'x − b = c' },
  mult:   { titulo:'Multiplicación',         formula:'a·x = c' },
  div:    { titulo:'División',               formula:'x/a = c' },
  'ax+b': { titulo:'Multiplicación y suma',  formula:'a·x + b = d' },
  'ax-b': { titulo:'Multiplicación y resta', formula:'a·x − b = d' },
  'x/a+b':{ titulo:'División y suma',        formula:'x/a + b = d' },
  'x/a-b':{ titulo:'División y resta',       formula:'x/a − b = d' },
};

/* --- Construcción de términos a partir de valores explícitos (compartida) --- */
function crearTerminosFacil(tipo, vals){
  const varT = {id:uid('t'), kind:'var'};
  let left, right, moveQueue, solution;

  if(tipo === 'suma'){
    const b = Math.abs(vals.b), c = vals.c;
    const numB = {id:uid('t'), kind:'num', value:b, sign:1};
    const numC = {id:uid('t'), kind:'num', value:Math.abs(c), sign: c<0?-1:1};
    left = [varT, numB]; right = [numC]; moveQueue = [numB.id]; solution = c - b;
  } else if(tipo === 'resta'){
    const b = Math.abs(vals.b), c = vals.c;
    const numB = {id:uid('t'), kind:'num', value:b, sign:-1};
    const numC = {id:uid('t'), kind:'num', value:Math.abs(c), sign: c<0?-1:1};
    left = [varT, numB]; right = [numC]; moveQueue = [numB.id]; solution = c + b;
  } else if(tipo === 'mult'){
    const a = Math.abs(vals.a) || 1, c = vals.c;
    const coefT = {id:uid('t'), kind:'coef', value:a};
    const numC = {id:uid('t'), kind:'num', value:Math.abs(c), sign: c<0?-1:1};
    left = [coefT, varT]; right = [numC]; moveQueue = [coefT.id]; solution = c / a;
  } else { // div
    const a = Math.abs(vals.a) || 1, c = vals.c;
    const gid = uid('g'); varT.fracGroup = gid;
    const denT = {id:uid('t'), kind:'den', value:a, fracGroup:gid};
    const numC = {id:uid('t'), kind:'num', value:Math.abs(c), sign: c<0?-1:1};
    left = [varT, denT]; right = [numC]; moveQueue = [denT.id]; solution = c * a;
  }
  return {left, right, moveQueue, solution};
}

function crearTerminosDificil(tipo, vals){
  const varT = {id:uid('t'), kind:'var'};
  let left, right, moveQueue, solution;

  if(tipo === 'ax+b' || tipo === 'ax-b'){
    const a = Math.abs(vals.a) || 1, b = Math.abs(vals.b), d = vals.d;
    const coefT = {id:uid('t'), kind:'coef', value:a};
    const numB = {id:uid('t'), kind:'num', value:b, sign: tipo==='ax+b' ? 1 : -1};
    const numD = {id:uid('t'), kind:'num', value:Math.abs(d), sign: d<0?-1:1};
    left = [coefT, varT, numB]; right = [numD];
    moveQueue = [numB.id, coefT.id];
    solution = tipo === 'ax+b' ? (d - b) / a : (d + b) / a;
  } else { // x/a+b , x/a-b
    const a = Math.abs(vals.a) || 1, b = Math.abs(vals.b), d = vals.d;
    const gid = uid('g'); varT.fracGroup = gid;
    const denT = {id:uid('t'), kind:'den', value:a, fracGroup:gid};
    const numB = {id:uid('t'), kind:'num', value:b, sign: tipo==='x/a+b' ? 1 : -1};
    const numD = {id:uid('t'), kind:'num', value:Math.abs(d), sign: d<0?-1:1};
    left = [varT, denT, numB]; right = [numD];
    moveQueue = [numB.id, denT.id];
    solution = tipo === 'x/a+b' ? (d - b) * a : (d + b) * a;
  }
  return {left, right, moveQueue, solution};
}

function finalizarEcuacion(nivel, tipo, core, flip){
  let { left, right, moveQueue, solution } = core;
  if(flip){ const tmp = left; left = right; right = tmp; }
  left.forEach(t => t.side = 'left');
  right.forEach(t => t.side = 'right');
  return { nivel, tipo, left, right, moveQueue, step:0, solution, solved:false };
}

/* --- Generación ALEATORIA (modo "el sistema genera una ecuación") --------- */
function generarEcuacion(nivel, tipo){
  let vals, core, flip = false;

  if(nivel === 'facil'){
    const s = randInt(1,12);
    if(tipo === 'suma'){ const b = randInt(1,15); vals = {b, c: s+b}; }
    else if(tipo === 'resta'){ const b = randInt(1,s); vals = {b, c: s-b}; }
    else if(tipo === 'mult'){ const a = randInt(2,9); vals = {a, c: a*s}; }
    else { const a = randInt(2,9), c = randInt(1,10); vals = {a, c}; } // div
    core = crearTerminosFacil(tipo, vals);
  } else if(nivel === 'intermedio'){
    flip = Math.random() < 0.5; // volteo aleatorio, desde intermedio en adelante
    if(tipo === 'ax+b' || tipo === 'ax-b'){
      const a = randInt(2,9), s = randInt(1,12), b = randInt(1,15);
      const d = tipo === 'ax+b' ? a*s + b : a*s - b;
      vals = {a, b, d};
    } else {
      const a = randInt(2,6), m = randInt(1,10), s = m*a, b = randInt(1,15);
      const d = tipo === 'x/a+b' ? m + b : m - b;
      vals = {a, b, d};
    }
    core = crearTerminosDificil(tipo, vals);
  } else { // dificil: misma estructura de 2 pasos, con números bastante más grandes
    flip = Math.random() < 0.5;
    if(tipo === 'ax+b' || tipo === 'ax-b'){
      const a = randInt(4,15), s = randInt(5,30), b = randInt(10,50);
      const d = tipo === 'ax+b' ? a*s + b : a*s - b;
      vals = {a, b, d};
    } else {
      const a = randInt(4,12), m = randInt(5,25), s = m*a, b = randInt(10,50);
      const d = tipo === 'x/a+b' ? m + b : m - b;
      vals = {a, b, d};
    }
    core = crearTerminosDificil(tipo, vals);
  }
  return finalizarEcuacion(nivel, tipo, core, flip);
}

/* --- Generación MANUAL (modo "crear mi propia ecuación") ------------------ */
function generarEcuacionManual(nivel, tipo, vals, flip){
  const core = nivel === 'facil' ? crearTerminosFacil(tipo, vals) : crearTerminosDificil(tipo, vals);
  return finalizarEcuacion(nivel, tipo, core, flip);
}

   3. ESTADO GLOBAL
   ------------------------------------------------------------------------- */
const state = {
  screen: 'inicio',   // inicio | crear | lab
  modo: null,          // 'propia' | 'sistema'
  nivel: null,          // 'facil' | 'intermedio' | 'dificil'
  tipo: null,
  eq: null,
  wallActive: false,
  history: [],
};

function irA(pantalla){ state.screen = pantalla; render(); window.scrollTo({top:0, behavior:'smooth'}); }

function reiniciarTodo(){
  state.screen = 'inicio'; state.modo = null; state.nivel = null; state.tipo = null;
  state.eq = null; state.wallActive = false; state.history = [];
  render();
}

function iniciarLaboratorio(nivel, tipo){
  state.nivel = nivel; state.tipo = tipo;
  state.eq = generarEcuacion(nivel, tipo);
  state.wallActive = false; state.history = [];
  state.screen = 'lab';
  render();
}

function nuevaEcuacionMismoTipo(){
  if(state.modo === 'propia'){ irA('crear'); return; }
  iniciarLaboratorio(state.nivel, state.tipo);
}

/* ---------------------------------------------------------------------------
   4. RENDER DE PANTALLAS
   ------------------------------------------------------------------------- */
function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.screen === 'inicio') app.appendChild(renderInicio());
  else if(state.screen === 'crear') app.appendChild(renderCrear());
  else if(state.screen === 'lab') app.appendChild(renderLab());
  if(state.screen === 'lab') requestAnimationFrame(fitStageSides);
}

/* Achica cada lado de la ecuación (en vez de quebrarlo en dos líneas) cuando
   las piezas no caben completas en el ancho disponible. */
function fitStageSides(){
  ['sideLeft','sideRight'].forEach(id => {
    const sideEl = document.getElementById(id);
    if(!sideEl) return;
    sideEl.style.transform = 'none';
    const available = sideEl.clientWidth;
    const needed = sideEl.scrollWidth;
    if(available > 0 && needed > available){
      const scale = Math.max(available / needed, 0.55);
      sideEl.style.transform = `scale(${scale})`;
    }
  });
}
window.addEventListener('resize', () => { if(state.screen === 'lab') fitStageSides(); });

function el(tag, cls, html){

}

/* ---------------------------------------------------------------------------
   Analizador de ecuaciones escritas libremente. La incógnita es siempre "x";
   la multiplicación nunca necesita símbolo (5x ya significa 5 por x), así
   que "x" jamás es ambiguo con un operador.
   ------------------------------------------------------------------------- */
function parseEcuacionLibre(texto){
  const s = texto.replace(/\s+/g, '');
  if(!s) return {error:''};

  const partes = s.split('=');
  if(partes.length !== 2) return {error:'La ecuación debe tener un signo =.'};
  const [ladoA, ladoB] = partes;
  if(!ladoA || !ladoB) return {error:'Completa ambos lados de la ecuación.'};

  const aTieneX = /x/i.test(ladoA), bTieneX = /x/i.test(ladoB);
  if(!aTieneX && !bTieneX) return {error:'Tu ecuación necesita una x.'};
  if(aTieneX && bTieneX) return {error:'La x debe estar en un solo lado de la ecuación.'};

  const flip = bTieneX;
  const ladoVar = (flip ? ladoB : ladoA).toLowerCase();
  const ladoNum = flip ? ladoA : ladoB;

  if(!/^[+-]?\d+$/.test(ladoNum)) return {error:'El lado sin la x debe ser solo un número.'};
  const d = parseInt(ladoNum, 10);

  let m;
  if((m = ladoVar.match(/^x\/(\d+)([+-]\d+)?$/))){
    const a = parseInt(m[1], 10);
    if(a === 0) return {error:'El denominador no puede ser 0.'};
    const b = m[2] ? parseInt(m[2], 10) : 0;
    const tipo = b === 0 ? 'div' : (b > 0 ? 'x/a+b' : 'x/a-b');
    const nivel = b === 0 ? 'facil' : 'intermedio';
    const vals = b === 0 ? {a, c:d} : {a, b:Math.abs(b), d};
    return {tipo, nivel, vals, flip};
  }
  if((m = ladoVar.match(/^(\d*)x([+-]\d+)?$/))){
    const a = m[1] ? parseInt(m[1], 10) : 1;
    const b = m[2] ? parseInt(m[2], 10) : 0;
    if(a === 0) return {error:'El coeficiente no puede ser 0.'};
    if(a === 1 && b === 0) return {error:'Esa ecuación ya está resuelta: agrega un número o un coeficiente.'};
    if(a === 1){
      const tipo = b > 0 ? 'suma' : 'resta';
      return {tipo, nivel:'facil', vals:{b:Math.abs(b), c:d}, flip};
    }
    if(b === 0) return {tipo:'mult', nivel:'facil', vals:{a, c:d}, flip};
    const tipo = b > 0 ? 'ax+b' : 'ax-b';
    return {tipo, nivel:'intermedio', vals:{a, b:Math.abs(b), d}, flip};
  }
  return {error:`No entendí "${flip?ladoB:ladoA}". Prueba algo como 3x+5=17 o x/4-2=6.`};
}

let ecuacionLibreLista = null;

function actualizarPreviewLibre(){
  const texto = document.getElementById('ecInput').value;
  const preview = document.getElementById('paramPreview');
  const warn = document.getElementById('paramWarning');
  const btn = document.getElementById('btnCrearManual');

  const resultado = parseEcuacionLibre(texto);

  if(resultado.error === ''){ // vacío: sin mensaje, esperando que escriba
    preview.innerHTML = ''; warn.className = 'param-warning'; warn.textContent = '';
    btn.disabled = true; ecuacionLibreLista = null; return;
  }
  if(resultado.error){
    preview.innerHTML = '';
    warn.textContent = resultado.error;
    warn.className = 'param-warning show error';
    btn.disabled = true; ecuacionLibreLista = null; return;
  }

  const core = resultado.nivel === 'facil' ? crearTerminosFacil(resultado.tipo, resultado.vals) : crearTerminosDificil(resultado.tipo, resultado.vals);
  const eqTemp = finalizarEcuacion(resultado.nivel, resultado.tipo, core, resultado.flip);

  preview.innerHTML = '';
  const row = el('div','history-row');
  row.appendChild(miniLado(eqTemp.left));
  row.appendChild(el('span','mini-eq','='));
  row.appendChild(miniLado(eqTemp.right));
  preview.appendChild(row);

  if(!Number.isInteger(eqTemp.solution)){
    warn.textContent = 'Con estos números la solución no es un número entero. Ajusta la ecuación para poder crearla.';
    warn.className = 'param-warning show error';
    btn.disabled = true;
    ecuacionLibreLista = null;
    return;
  }
  if(eqTemp.solution < 0){
    warn.textContent = 'Con estos números x sería negativo. Ajusta la ecuación para que la solución no sea negativa.';
    warn.className = 'param-warning show error';
    btn.disabled = true;
    ecuacionLibreLista = null;
    return;
  }
  warn.textContent = '✓ Ecuación lista para crear.';
  warn.className = 'param-warning show ok';
  btn.disabled = false;
  ecuacionLibreLista = resultado;
}

function confirmarCreacionLibre(){
  if(!ecuacionLibreLista) return;
  const {tipo, nivel, vals, flip} = ecuacionLibreLista;
  state.modo = 'propia'; state.nivel = nivel; state.tipo = tipo;
  state.eq = generarEcuacionManual(nivel, tipo, vals, flip);
  state.wallActive = false; state.history = [];
  state.screen = 'lab';
  render();
}

   4. NIVEL DEL PIE DE ECUACIÓN (usado en la etiqueta del laboratorio)
   ------------------------------------------------------------------------- */
function nivelLabel(nivel){
  return nivel === 'facil' ? 'fácil' : (nivel === 'intermedio' ? 'intermedio' : 'difícil');
}

/* ---------------------------------------------------------------------------
   5. RENDER DEL LABORATORIO (stage interactivo)
   ------------------------------------------------------------------------- */
function otroLado(lado){ return lado === 'left' ? 'right' : 'left'; }
function ladoArray(lado){ return lado === 'left' ? state.eq.left : state.eq.right; }
function buscarTermino(id){ return state.eq.left.find(t=>t.id===id) || state.eq.right.find(t=>t.id===id); }

function renderLab(){
  const wrap = el('div','wrap');

  const nav = el('div','top-nav');
  const back = el('button','ghost-btn','🏠 Inicio');
  back.onclick = reiniciarTodo;
  const nueva = el('button','ghost-btn', state.modo === 'propia' ? '✎ Editar números' : '↺ Nueva ecuación');
  nueva.onclick = nuevaEcuacionMismoTipo;
  nav.appendChild(back); nav.appendChild(nueva);
  wrap.appendChild(nav);

  wrap.appendChild(el('div','lab-header', `
    <div class="level-pill">Nivel ${nivelLabel(state.nivel)}</div>
    <h2>${ETIQUETAS_TIPO[state.tipo].titulo}</h2>
  `));

  if(state.nivel !== 'facil' && !state.eq.solved){
    const dots = el('div','progress-dots');
    const total = state.eq.moveQueue.length;
    for(let i=0;i<total;i++){
      const d = document.createElement('span');
      if(i < state.eq.step) d.className = 'done';
      else if(i === state.eq.step) d.className = 'now';
      dots.appendChild(d);
    }
    wrap.appendChild(dots);
  }

  const hint = el('div','hint-banner');
  if(!state.wallActive){
    hint.innerHTML = 'Toca el signo <b>=</b> para activar la pared que separa ambos lados de la ecuación.';
  } else if(!state.eq.solved){
    hint.innerHTML = 'Arrastra la pieza correcta cruzando la pared. Al cruzar, elige en qué se transforma.';
  } else {
    hint.innerHTML = '¡Ecuación resuelta! Puedes generar otra o cambiar de tipo.';
  }
  wrap.appendChild(hint);

  const stage = el('div','lab-stage'); stage.id = 'labStage';
  const leftSide = el('div','stage-side left'); leftSide.id = 'sideLeft';
  const wallBtn = buildWall();
  const rightSide = el('div','stage-side right'); rightSide.id = 'sideRight';

  construirPiezasLado(state.eq.left).forEach(n => leftSide.appendChild(n));
  construirPiezasLado(state.eq.right).forEach(n => rightSide.appendChild(n));

  stage.appendChild(leftSide); stage.appendChild(wallBtn); stage.appendChild(rightSide);
  wrap.appendChild(stage);

  const historyPanel = el('div','history-panel');
  historyPanel.innerHTML = '<h4>Historial de pasos</h4>';
  const rows = el('div'); rows.id = 'historyRows';
  state.history.forEach((h,i) => rows.appendChild(buildHistoryRow(h, i===state.history.length-1 && state.eq.solved)));
  historyPanel.appendChild(rows);
  wrap.appendChild(historyPanel);

  return wrap;
}

function buildWall(){
  const w = el('button','equals-wall' + (state.wallActive ? ' active' : ''));
  w.setAttribute('aria-label','Activar la pared de la ecuación');
  w.innerHTML = `
    <span class="eq-text">=</span>
    <span class="wall-pillar">
      <span class="wall-foot top"></span>
      <span class="wall-notch n1"></span>
      <span class="wall-notch n2"></span>
      <span class="wall-foot bottom"></span>
    </span>
    ${!state.wallActive ? '<span class="wall-tap-hint">toca aquí</span>' : ''}
  `;
  w.onclick = () => {
    if(state.wallActive) return;
    state.wallActive = true;
    state.history = [snapshotActual()];
    render();
  };
  return w;
}

/* Agrupa términos consecutivos var+den que comparten fracGroup en una
   sola pieza visual (fracción), aunque siguen siendo dos botones arrastrables. */
function construirPiezasLado(terms){
  const nodos = [];
  for(let i=0; i<terms.length; i++){
    const t = terms[i];
    const sig = terms[i+1];
    if(t.kind === 'var' && t.fracGroup && sig && sig.kind === 'den' && sig.fracGroup === t.fracGroup){
      const wrap = el('div','frac-live');
      wrap.appendChild(buildPieceEl(t, i===0));
      wrap.appendChild(buildPieceEl(sig, false));
      nodos.push(wrap);
      i++; // el denominador ya fue consumido
      continue;
    }
    nodos.push(buildPieceEl(t, i===0));
  }
  return nodos;
}

/* Construye una pieza interactiva del stage principal */
function buildPieceEl(term, esPrimeraDeLado){
  let node;
  const draggable = state.wallActive && !state.eq.solved;

  if(term.kind === 'var'){
    node = el('button','piece piece-var', 'x');
  } else if(term.kind === 'coef'){
    node = el('button','piece piece-coef tight-left', String(term.value));
  } else if(term.kind === 'den'){
    node = el('button','piece piece-den', String(term.value));
  } else { // num
    const signo = signoPrefijo(term, esPrimeraDeLado);
    node = el('button','piece piece-num', (signo ? `<span class="sign-static" style="color:inherit">${signo}</span>` : '') + term.value);
  }

  node.dataset.termId = term.id;
  if(!draggable){ node.classList.add('locked'); }
  else{ attachDrag(node, term); }
  return node;
}

function signoPrefijo(term, esPrimero){
  if(esPrimero) return term.sign === -1 ? '−' : '';
  return term.sign === -1 ? '−' : '+';
}

/* Snapshot estático de una fila de historial */
function snapshotActual(){
  return { left: state.eq.left.map(clonaTermino), right: state.eq.right.map(clonaTermino) };
}
function clonaTermino(t){ return Object.assign({}, t); }

function buildHistoryRow(snap, esFinal){
  const row = el('div','history-row' + (esFinal ? ' final' : ''));
  row.appendChild(miniLado(snap.left));
  row.appendChild(el('span','mini-eq','='));
  row.appendChild(miniLado(snap.right));
  return row;
}

function miniLado(terms){
  const wrap = el('span','mini-lado');
  for(let i=0; i<terms.length; i++){
    const t = terms[i];
    if(t.kind === 'expr'){ wrap.appendChild(el('span','mini-expr', t.text)); continue; }

    const sig = terms[i+1];
    if(t.kind === 'var' && t.fracGroup && sig && sig.kind === 'den' && sig.fracGroup === t.fracGroup){
      const fr = el('span','mini-piece mini-var mini-frac');
      fr.innerHTML = `<span>x</span><span class="fd">${sig.value}</span>`;
      wrap.appendChild(fr);
      i++; continue;
    }
    if(t.kind === 'coef' && sig && sig.kind === 'var'){
      const signo = signoPrefijo(t, i===0);
      if(signo) wrap.appendChild(el('span','mini-expr', signo + ' '));
      wrap.appendChild(el('span','mini-piece mini-var', t.value + 'x'));
      i++; continue;
    }

    const signo = signoPrefijo(t, i===0);
    if(signo) wrap.appendChild(el('span','mini-expr', signo + ' '));
    if(t.kind === 'var'){ wrap.appendChild(el('span','mini-piece mini-var','x')); }
    else if(t.kind === 'coef'){ wrap.appendChild(el('span','mini-piece mini-var', t.value + '·x')); }
    else if(t.kind === 'den'){ wrap.appendChild(el('span','mini-piece mini-var', ':' + t.value)); }
    else { wrap.appendChild(el('span','mini-piece mini-num', String(t.value))); }
  }
  return wrap;
}

/* ---------------------------------------------------------------------------
   6. ARRASTRE — Pointer Events (mouse + táctil unificados)
   ------------------------------------------------------------------------- */
let dragCtx = null;

function attachDrag(node, term){
  node.addEventListener('pointerdown', (ev) => onPointerDown(ev, node, term));
}

function onPointerDown(ev, node, term){
  if(dragCtx || state.eq.solved) return;
  ev.preventDefault();
  const rect = node.getBoundingClientRect();

  const placeholder = el('span','piece piece-placeholder');
  placeholder.style.width = rect.width + 'px';
  placeholder.style.height = rect.height + 'px';
  node.parentNode.insertBefore(placeholder, node);

  document.body.appendChild(node);
  node.style.position = 'fixed';
  node.style.left = rect.left + 'px';
  node.style.top = rect.top + 'px';
  node.style.width = rect.width + 'px';
  node.style.margin = '0';
  node.classList.add('dragging');

  dragCtx = {
    node, term, placeholder,
    startX: ev.clientX, startY: ev.clientY,
    baseLeft: rect.left, baseTop: rect.top,
    width: rect.width, height: rect.height,
  };

  node.setPointerCapture(ev.pointerId);
  node.addEventListener('pointermove', onPointerMove);
  node.addEventListener('pointerup', onPointerUp);
  node.addEventListener('pointercancel', onPointerUp);
}

function onPointerMove(ev){
  if(!dragCtx) return;
  const dx = ev.clientX - dragCtx.startX;
  const dy = ev.clientY - dragCtx.startY;
  dragCtx.node.style.left = (dragCtx.baseLeft + dx) + 'px';
  dragCtx.node.style.top = (dragCtx.baseTop + dy * 0.5) + 'px'; // arrastre mayormente horizontal
}

function onPointerUp(ev){
  if(!dragCtx) return;
  const { node, term, placeholder } = dragCtx;
  node.removeEventListener('pointermove', onPointerMove);
  node.removeEventListener('pointerup', onPointerUp);
  node.removeEventListener('pointercancel', onPointerUp);

  const wallEl = document.querySelector('.equals-wall .wall-pillar');
  const wallRect = wallEl ? wallEl.getBoundingClientRect() : document.querySelector('.equals-wall').getBoundingClientRect();
  const wallCenterX = wallRect.left + wallRect.width/2;
  const pieceRect = node.getBoundingClientRect();
  const pieceCenterX = pieceRect.left + pieceRect.width/2;

  const cruzo = term.side === 'left' ? (pieceCenterX > wallCenterX) : (pieceCenterX < wallCenterX);
  const esperado = state.eq.moveQueue[state.eq.step];

  if(!cruzo){ snapBack(); return; }
  if(term.id !== esperado){ snapBack(mensajeOrdenIncorrecto()); return; }

  abrirModalOperacion(term);
}

function snapBack(mensaje){
  if(!dragCtx) return;
  const { node, placeholder } = dragCtx;
  const target = placeholder.getBoundingClientRect();
  node.style.transition = 'left .3s ease, top .3s ease';
  node.style.left = target.left + 'px';
  node.style.top = target.top + 'px';
  setTimeout(() => {
    placeholder.parentNode && placeholder.parentNode.insertBefore(node, placeholder);
    placeholder.remove();
    node.style.position = ''; node.style.left = ''; node.style.top = ''; node.style.width = ''; node.style.margin = '';
    node.style.transition = '';
    node.classList.remove('dragging');
    dragCtx = null;
    if(mensaje) mostrarToast(mensaje);
  }, prefersReducedMotion() ? 0 : 300);
}

function mensajeOrdenIncorrecto(){
  const esperadoTerm = buscarTermino(state.eq.moveQueue[state.eq.step]);
  let desc = 'la otra pieza';
  if(esperadoTerm){
    if(esperadoTerm.kind==='num') desc = (esperadoTerm.sign===-1?'−':'+') + esperadoTerm.value;
    else if(esperadoTerm.kind==='coef') desc = 'el ' + esperadoTerm.value + ' que acompaña a la x';
    else if(esperadoTerm.kind==='den') desc = 'el ' + esperadoTerm.value + ' que divide a la x (la parte de abajo de la fracción)';
  }
  return 'Todavía no. Primero debes mover ' + desc + '.';
}

let toastTimer = null;
function mostrarToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div'); t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2c1468;border:1px solid rgba(255,255,255,.18);color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;font-family:Nunito,sans-serif;font-size:.92rem;z-index:2000;box-shadow:0 10px 24px rgba(0,0,0,0.4);max-width:90vw;text-align:center;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.transition='opacity .4s ease'; t.style.opacity='0'; }, 2200);
}

/* ---------------------------------------------------------------------------
   7 y 8. VALIDACIÓN + MODAL (elegir operación inversa, luego calcular)
   Símbolos usados en el selector de operación: + − × ∶
   (se usa ∶ en vez de ÷ para que no se confunda visualmente con +)
   ------------------------------------------------------------------------- */
let modalCtx = null; // { term, stage: 'op'|'compute', ... }
const SIMBOLO_DIVISION = '∶';

function inversaCorrecta(term){
  if(term.kind === 'num') return term.sign === 1 ? '−' : '+';
  if(term.kind === 'coef') return SIMBOLO_DIVISION; // se despeja dividiendo
  return '×'; // 'den' -> se despeja multiplicando
}

function abrirModalOperacion(term){
  modalCtx = { term, stage:'op' };
  pintarModal();
}

function pintarModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
  if(!modalCtx) return;

  const overlay = el('div','overlay');
  const card = el('div','modal-card');

  if(modalCtx.stage === 'op'){
    card.innerHTML = `
      <h3>¡Cruzaste la pared!</h3>
      <p class="modal-sub">¿En qué operación se transforma esta pieza al pasar al otro lado?</p>
      <div class="op-grid">
        <button class="op-btn" data-op="+">+</button>
        <button class="op-btn" data-op="−">−</button>
        <button class="op-btn" data-op="×">×</button>
        <button class="op-btn" data-op="${SIMBOLO_DIVISION}">${SIMBOLO_DIVISION}</button>
      </div>
      <div class="modal-msg error" id="modalMsg"></div>
    `;
    card.querySelectorAll('.op-btn').forEach(b => b.onclick = () => elegirOperacion(b.dataset.op));
  } else if(modalCtx.stage === 'compute'){
    card.innerHTML = `
      <h3>Ahora calculemos</h3>
      <div class="compute-expr">¿Cuánto es ${modalCtx.exprTexto}?</div>
      <div class="compute-input-row">
        <input type="number" inputmode="numeric" class="compute-input" id="computeInput" autocomplete="off" autofocus>
        <button class="compute-submit" id="computeSubmit">Listo</button>
      </div>
      <div class="modal-msg error" id="modalMsg"></div>
    `;
    const input = card.querySelector('#computeInput');
    const submit = () => enviarCalculo(parseFloat(input.value));
    card.querySelector('#computeSubmit').onclick = submit;
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') submit(); });
  }

  overlay.appendChild(card);
  root.appendChild(overlay);
  if(modalCtx.stage === 'compute'){
    setTimeout(() => { const i = document.getElementById('computeInput'); if(i) i.focus(); }, 50);
  }
}

function cerrarModal(){ modalCtx = null; document.getElementById('modal-root').innerHTML = ''; }

function fmtNum(numTerm){ return (numTerm.sign === -1 ? '−' : '') + numTerm.value; }

function elegirOperacion(simbolo){
  const term = modalCtx.term;
  const correcta = inversaCorrecta(term);
  if(simbolo !== correcta){
    const msg = document.getElementById('modalMsg');
    msg.textContent = 'Recuerda que al cambiar de miembro la operación se transforma en su operación inversa.';
    msg.classList.add('show');
    setTimeout(() => { cerrarModal(); snapBack(); }, 1400);
    return;
  }

  const fromSide = term.side, toSide = otroLado(fromSide);
  const otroNum = ladoArray(toSide).find(t => t.kind === 'num');
  const otroValorReal = otroNum.sign * otroNum.value;

  let exprTexto, resultado;

  if(term.kind === 'num'){
    // Término aditivo: cruza y queda visible junto al número del otro lado
    exprTexto = fmtNum(otroNum) + ' ' + (term.sign === -1 ? '+' : '−') + ' ' + term.value;
    resultado = otroValorReal - (term.sign * term.value);
    const snap = snapshotActual();
    moverTerminoEnSnapshot(snap, term.id, fromSide, toSide, term.sign * -1);
    state.history.push(snap);
  } else {
    // Término multiplicativo (coeficiente o denominador): se consume al cruzar
    const opSymbol = term.kind === 'coef' ? SIMBOLO_DIVISION : '×';
    exprTexto = fmtNum(otroNum) + ' ' + opSymbol + ' ' + term.value;
    resultado = term.kind === 'coef' ? (otroValorReal / term.value) : (otroValorReal * term.value);
    const snap = snapshotActual();
    quitarTerminoEnSnapshot(snap, term.id, fromSide);
    reemplazarExprEnSnapshot(snap, toSide, otroNum.id, exprTexto);
    state.history.push(snap);
  }

  modalCtx = { term, stage:'compute', exprTexto, resultado, fromSide, toSide, otroNumId: otroNum.id };
  pintarModal();
  render(); // refresca el laboratorio detrás (historial actualizado); el modal se repinta encima
}

/* Helpers para construir snapshots "intermedios" (solo visuales, no mutan el estado real) */
function moverTerminoEnSnapshot(snap, termId, fromSide, toSide, nuevoSigno){
  const fromArr = snap[fromSide], toArr = snap[toSide];
  const idx = fromArr.findIndex(t => t.id === termId);
  const [t] = fromArr.splice(idx,1);
  t.sign = nuevoSigno; t.side = toSide;
  toArr.push(t);
}
function quitarTerminoEnSnapshot(snap, termId, fromSide){
  const arr = snap[fromSide];
  const idx = arr.findIndex(t => t.id === termId);
  if(idx>=0) arr.splice(idx,1);
}
function reemplazarExprEnSnapshot(snap, side, numId, texto){
  const arr = snap[side];
  const idx = arr.findIndex(t => t.id === numId);
  if(idx>=0) arr.splice(idx,1,{kind:'expr', text:texto});
}

function enviarCalculo(valorIngresado){
  const msg = document.getElementById('modalMsg');
  if(Number.isNaN(valorIngresado) || valorIngresado !== modalCtx.resultado){
    msg.textContent = 'Esa no es la respuesta correcta. Intenta de nuevo.';
    msg.classList.add('show');
    return;
  }

  const { term, resultado, fromSide, toSide, otroNumId } = modalCtx;
  cerrarModal();

  const fromArr = ladoArray(fromSide), toArr = ladoArray(toSide);

  if(term.kind === 'num'){
    const i1 = fromArr.findIndex(t => t.id === term.id); fromArr.splice(i1,1);
    const i2 = toArr.findIndex(t => t.id === otroNumId); toArr.splice(i2,1);
    toArr.push({ id: uid('t'), kind:'num', side: toSide, value: Math.abs(resultado), sign: resultado < 0 ? -1 : 1 });
  } else {
    // coeficiente o denominador: se elimina, la x ya queda sola en su lugar
    const i1 = fromArr.findIndex(t => t.id === term.id); fromArr.splice(i1,1);
    const i2 = toArr.findIndex(t => t.id === otroNumId); toArr.splice(i2,1);
    toArr.push({ id: uid('t'), kind:'num', side: toSide, value: Math.abs(resultado), sign: resultado < 0 ? -1 : 1 });
  }

  state.eq.step++;
  state.history.push(snapshotActual());

  if(dragCtx){ dragCtx.placeholder.remove(); dragCtx.node.remove(); dragCtx = null; }

  verificarResuelto();
  render();
}

function verificarResuelto(){
  const resuelto = (
    (state.eq.left.length === 1 && state.eq.left[0].kind === 'var' && state.eq.right.length === 1 && state.eq.right[0].kind === 'num') ||
    (state.eq.right.length === 1 && state.eq.right[0].kind === 'var' && state.eq.left.length === 1 && state.eq.left[0].kind === 'num')
  );
  if(resuelto){
    state.eq.solved = true;
    setTimeout(mostrarCelebracion, 400);
  }
}

function mostrarCelebracion(){
  const varLado = state.eq.left[0].kind === 'var' ? state.eq.left[0] : state.eq.right[0];
  const numLado = state.eq.left[0].kind === 'num' ? state.eq.left[0] : state.eq.right[0];
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
  const overlay = el('div','overlay');
  const card = el('div','modal-card celebrate-card');
  card.innerHTML = `
    <div class="celebrate-emoji">🎉</div>
    <h3>¡Ecuación resuelta!</h3>
    <p class="modal-sub">Aplicaste correctamente el principio de equivalencia.</p>
    <div class="result-line">x = ${fmtNum(numLado)}</div>
    <div class="btn-row">
      <button class="primary-btn" id="btnOtraEc">Otra ecuación</button>
      <button class="secondary-btn" id="btnInicioCel">Inicio</button>
    </div>
  `;
  overlay.appendChild(card);
  root.appendChild(overlay);
  document.getElementById('btnOtraEc').onclick = () => { cerrarModal(); nuevaEcuacionMismoTipo(); };
  document.getElementById('btnInicioCel').onclick = () => { cerrarModal(); reiniciarTodo(); };
}

/* ---------------------------------------------------------------------------
   Arranque
   ------------------------------------------------------------------------- */
render();
</script>
</body>
