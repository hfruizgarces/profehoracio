<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Laboratorio de Números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS DE DISEÑO
   ========================================================= */
:root{
  color-scheme: dark;
  --bg-1:#1e1147;
  --bg-2:#3b1785;
  --bg-3:#5b21b6;
  --surface:rgba(255,255,255,.07);
  --surface-strong:rgba(255,255,255,.12);
  --border-soft:rgba(255,255,255,.14);

  --primary:#34d399;
  --primary-dark:#0f9d70;
  --accent:#fbbf24;
  --accent-soft:#fde68a;
  --pink:#f472b6;
  --blue:#38bdf8;
  --error:#fb7185;
  --error-soft:#3b0f1f;

  --text:#f6f3ff;
  --text-dim:#c9bdf0;
  --text-faint:#8f7fc4;

  --r-lg:22px;
  --r-md:16px;
  --r-sm:10px;

  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;

  --shadow-1: 0 10px 30px rgba(0,0,0,.35);
  --tap-min: 48px;
}

*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; width:100%; overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
h1,h2,h3{font-family:var(--font-display); margin:0;}
button, input{ -webkit-user-select:none; user-select:none; }
input{font-family:inherit;}

.hidden{display:none !important;}
.visually-hidden{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* Foco visible para accesibilidad con teclado */
:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
  border-radius:6px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* =========================================================
   LAYOUT GENERAL
   ========================================================= */
#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding: clamp(10px, 2.5vw, 24px);
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:6px 56px 14px 2px;
  flex-wrap:wrap;
}
.app-header .side{
  display:flex; align-items:center; gap:6px;
  flex:1 1 auto;
  min-width:70px;
}
.app-header .side.right{ justify-content:flex-end; }

.icon-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--surface);
  border:1px solid var(--border-soft);
  color:var(--text);
  padding:9px 12px;
  border-radius:999px;
  font-weight:700;
  font-size:clamp(.75rem, 2vw, .9rem);
  cursor:pointer;
  min-height:var(--tap-min);
  transition: background .15s, transform .1s;
  white-space:nowrap;
}
.icon-btn:hover{ background:var(--surface-strong); }
.icon-btn:active{ transform:scale(.96); }

.brand{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.2vw, 1.6rem);
  flex:0 1 auto;
  white-space:nowrap;
}
.brand .plus{
  display:inline-flex; align-items:center; justify-content:center;
  width:1.5em; height:1.5em;
  background:linear-gradient(135deg, var(--primary), var(--blue));
  border-radius:10px;
  color:#0b1a12;
  font-size:1em;
}

main{ flex:1; display:flex; flex-direction:column; }

.screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  animation: fadeSlideIn .35s ease both;
}
@keyframes fadeSlideIn{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}

.card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(16px, 4vw, 32px);
  box-shadow:var(--shadow-1);
  backdrop-filter: blur(6px);
}

/* =========================================================
   PANTALLA INICIAL
   ========================================================= */
.home-title{
  text-align:center;
  font-size:clamp(1.4rem, 5vw, 2.2rem);
  font-weight:800;
  margin-bottom:6px;
}
.home-sub{
  text-align:center;
  color:var(--text-dim);
  font-size:clamp(.9rem, 2.4vw, 1.05rem);
  margin:0 auto clamp(18px,4vw,28px);
  max-width:46ch;
}
footer.credits{ text-align:center; color: var(--text-faint); font-weight:700; font-size:.78rem; padding:20px 10px 4px; }
.level-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:clamp(10px, 2.5vw, 16px);
  width:100%;
}
@media (max-width:420px){
  .level-grid{ grid-template-columns:1fr; }
}
.level-btn{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:clamp(16px,4vw,22px) 10px;
  border-radius:var(--r-md);
  border:1px solid var(--border-soft);
  color:var(--text);
  cursor:pointer;
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1rem, 2.6vw, 1.15rem);
  min-height:96px;
  transition:transform .15s, box-shadow .15s;
}
.level-btn:hover{ transform:translateY(-3px); }
.level-btn:active{ transform:scale(.97); }
.level-btn .emoji{ font-size:clamp(1.6rem, 5vw, 2.1rem); }
.level-btn.easy{ background:linear-gradient(140deg,#0f9d70,#34d399); }
.level-btn.mid{ background:linear-gradient(140deg,#1d4ed8,#38bdf8); }
.level-btn.hard{ background:linear-gradient(140deg,#b91c66,#f472b6); }
.level-btn.custom{ background:linear-gradient(140deg,#92400e,#fbbf24); color:#fff; }

/* =========================================================
   PANTALLA "CREA TU EJERCICIO"
   ========================================================= */
.form-title{ font-size:clamp(1.2rem,3.6vw,1.5rem); font-weight:800; text-align:center; margin-bottom:4px; }
.form-sub{ color:var(--text-dim); text-align:center; margin-bottom:18px; font-size:.95rem; }

.addend-row{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:12px;
}
.addend-index{
  width:26px; text-align:right; color:var(--text-faint); font-weight:700; flex:0 0 auto;
}
.addend-input{
  flex:0 1 180px;
  min-width:0;
  background:var(--surface-strong);
  border:2px solid var(--border-soft);
  border-radius:var(--r-sm);
  color:var(--text);
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1.1rem, 3.2vw, 1.35rem);
  text-align:center;
  padding:12px 10px;
  min-height:var(--tap-min);
  letter-spacing:1px;
}
.addend-input::placeholder{ color:var(--text-faint); font-family:var(--font-body); font-weight:600; font-size:.85em;}
.addend-remove{
  flex:0 0 auto;
  width:var(--tap-min); height:var(--tap-min);
  border-radius:50%;
  background:rgba(251,113,133,.18);
  border:1px solid var(--error);
  color:var(--error);
  font-size:1.2rem;
  font-weight:800;
  cursor:pointer;
}
.dashed-btn{
  width:100%;
  max-width:220px;
  margin-left:auto; margin-right:auto;
  display:block;
  padding:12px;
  border-radius:var(--r-sm);
  border:2px dashed var(--border-soft);
  background:transparent;
  color:var(--text-dim);
  font-weight:700;
  cursor:pointer;
  min-height:var(--tap-min);
  margin-bottom:18px;
}
.dashed-btn:hover{ border-color:var(--text-dim); color:var(--text); }
.dashed-btn:disabled{ opacity:.4; cursor:not-allowed; }

.primary-btn{
  width:100%;
  padding:14px;
  border-radius:var(--r-md);
  border:none;
  background:linear-gradient(135deg, var(--primary), #10b981);
  color:#062b1c;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1rem, 2.8vw, 1.15rem);
  cursor:pointer;
  min-height:52px;
  box-shadow:0 6px 18px rgba(52,211,153,.35);
  transition:transform .12s, box-shadow .12s;
}
.primary-btn:hover{ transform:translateY(-2px); }
.primary-btn:active{ transform:scale(.98); }
.primary-btn:disabled{
  background:#4b4b5a; color:#9a9aab; box-shadow:none; cursor:not-allowed; transform:none;
}
.form-error{
  color:var(--error);
  text-align:center;
  font-weight:700;
  font-size:.9rem;
  min-height:1.4em;
  margin-bottom:10px;
}

/* =========================================================
   PANTALLA DE EJERCICIO
   ========================================================= */
.hint-box{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-md);
  padding:12px 14px;
  margin-bottom:16px;
  width:100%;
  font-size:clamp(.82rem, 2.1vw, .95rem);
  line-height:1.45;
}
.hint-box .bulb{ font-size:1.2em; flex:0 0 auto; }
.hint-box b{ color:var(--accent); }
.hint-box .ok{ color:var(--primary); }

/* =========================================================
   MODAL (llevada / totales de columna)
   ========================================================= */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(10,4,30,.6);
  backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center;
  padding:16px;
  z-index:700;
}
.modal-box{
  width:100%; max-width:400px;
  background:linear-gradient(160deg, #2c1468, #4c1d95);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(18px,4vw,26px);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.modal-close-x{
  position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
  border:1px solid var(--border-soft); background:var(--surface); color:var(--text);
  cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; z-index:5;
}
@keyframes popIn{
  from{ transform:scale(.85); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}
@keyframes monedaFlota{
  0%{ transform:translateY(0); opacity:0; }
  15%{ opacity:1; }
  100%{ transform:translateY(-24px); opacity:0; }
}
.modal-eyebrow{
  font-size:.78rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent); margin-bottom:6px; text-align:center;
}
.modal-title{
  font-size:clamp(1.05rem, 3.2vw, 1.25rem);
  text-align:center;
  margin-bottom:14px;
  line-height:1.4;
}
.modal-title b{ color:var(--accent-soft); }
.modal-fields{
  display:flex; gap:12px; justify-content:center; margin-bottom:14px; flex-wrap:wrap;
}
.modal-field{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.modal-field label{ font-size:.8rem; color:var(--text-dim); font-weight:700; text-align:center; max-width:11em; }
.modal-field input{
  width:80px;
  text-align:center;
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.3rem;
  padding:10px 6px;
  border-radius:var(--r-sm);
  border:2px solid var(--border-soft);
  background:var(--surface-strong);
  color:var(--text);
  min-height:var(--tap-min);
}
.modal-feedback{
  text-align:center; min-height:1.6em; font-weight:700; margin-bottom:10px; font-size:.9rem;
}
.modal-feedback.err{ color:var(--error); }
.modal-feedback.ok{ color:var(--primary); }
.modal-actions{ display:flex; gap:10px; }
.modal-actions button{ flex:1; }
.secondary-btn{
  padding:12px; border-radius:var(--r-md); border:1px solid var(--border-soft);
  background:transparent; color:var(--text-dim); font-weight:700; cursor:pointer;
  min-height:48px;
}

/* =========================================================
   PANTALLA DE RESULTADO / CELEBRACIÓN
   ========================================================= */
.result-hero{
  font-size:clamp(2.2rem, 9vw, 3.4rem);
  text-align:center;
}
.result-title{
  font-size:clamp(1.3rem, 4vw, 1.8rem);
  text-align:center;
  margin:8px 0 4px;
}
.result-eq{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.6vw, 1.6rem);
  text-align:center;
  color:var(--primary);
  margin-bottom:20px;
  word-break:break-word;
}
.result-actions{
  display:flex; gap:12px; width:100%; flex-wrap:wrap;
}
.result-actions button{ flex:1 1 160px; }

.confetti-piece{
  position:fixed; top:-10px; z-index:800;
  border-radius:2px;
  animation: fall linear forwards;
  pointer-events:none;
}
@keyframes fall{
  to{ transform:translateY(105vh) rotate(360deg); opacity:.9; }
}

/* =========================================================
   BARRA DE PROGRESO DE COLUMNAS
   ========================================================= */
.progress-track{
  display:flex; gap:6px; width:100%; margin-bottom:16px;
}
.progress-seg{
  flex:1; height:6px; border-radius:4px; background:rgba(255,255,255,.12);
  overflow:hidden;
}
.progress-seg .fill{
  height:100%; width:0%; background:linear-gradient(90deg, var(--primary), var(--blue));
  transition:width .4s ease;
}

/* utilidad de botón de sonido */
.sound-icon{ font-size:1.1em; }

/* =========================================================
   MULTIPLICACIÓN ÁRABE — retícula (propio del recurso)
   ========================================================= */
:root{
  --ink:var(--text); --ink-soft:var(--text-dim); --ink-faint:var(--text-faint);
  --brass:#fbbf24; --brass-dark:#f59e0b; --success:#34d399; --success-bg:rgba(52,211,153,.15);
  --error-bg:rgba(251,113,133,.15); --radius-s:10px; --radius-m:16px; --radius-l:22px;
  --font-num:var(--font-display); --font-ui:var(--font-body);
  --cell-size:calc(var(--cell-base,56px) * var(--f,1));
}
#vista{ width:100%; display:flex; flex-direction:column; }
.hero{ text-align:center; }
.problema-pill{
  align-self:center; font-family:var(--font-num); font-weight:800; letter-spacing:.04em;
  font-size:calc(clamp(1.3rem,4.4vw,1.9rem) * var(--f,1)); color:#fff;
  background:linear-gradient(150deg, rgba(44,20,104,.75), rgba(30,17,71,.75));
  box-shadow:inset 0 0 0 1px rgba(196,181,253,.35); border-radius:16px;
  padding:calc(6px * var(--f,1)) calc(22px * var(--f,1)); margin:0 0 calc(12px * var(--f,1));
}
.lattice-card{ width:100%; display:flex; flex-direction:column; align-items:center; padding:calc(4px * var(--f,1)) 0 0; }
.lattice-row{ display:flex; align-items:flex-start; gap:6px; }
.lattice-left{ display:flex; flex-direction:column; }
.top-digits, .side-digits{ display:flex; }
.top-digits{ justify-content:flex-end; margin-bottom:5px; gap:4px; }
.side-digits{ flex-direction:column; margin-top:calc(var(--cell-size) * .62 + 5px); gap:4px; margin-left:4px; }
.digit-box{
  width:var(--cell-size); height:calc(var(--cell-size) * .62); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .46); color:#fff;
  background:linear-gradient(150deg, rgba(124,58,237,.45), rgba(44,20,104,.7)); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.45);
  border:none; border-radius:12px; text-shadow:0 2px 6px rgba(0,0,0,.45);
}
.side-digits .digit-box{ width:calc(var(--cell-size) * .72); height:var(--cell-size); }
.grid-boxes{ display:grid; gap:4px; }
.lcell{
  width:var(--cell-size); height:var(--cell-size); position:relative; overflow:hidden; border-radius:10px;
  border:2px solid rgba(196,181,253,.75); background:rgba(30,17,71,.55); box-shadow:0 0 14px rgba(124,58,237,.25);
}
.lcell .tri{ position:absolute; inset:0; transition:background-color .35s ease, opacity .35s ease; }
.tri-tens{ clip-path:polygon(0 0,100% 0,0 100%); background:rgba(255,255,255,.05); }
.tri-ones{ clip-path:polygon(100% 0,100% 100%,0 100%); background:rgba(255,255,255,.1); }
.tri.diag-dim{ opacity:.35; } .tri.diag-active{ opacity:1; }
.cell-num{
  position:absolute; z-index:2; font-family:var(--font-num); font-weight:800; line-height:1; pointer-events:none;
  font-size:calc(var(--cell-size) * .36); color:#fff; text-shadow:0 2px 5px rgba(0,0,0,.5);
}
.cell-num.tens-pos{ top:12%; left:12%; } .cell-num.ones-pos{ bottom:10%; right:12%; }
.lcell input.cell-input{
  position:absolute; z-index:2; width:42%; height:42%; border:none; border-radius:7px; padding:0; outline:none;
  background:rgba(8,3,26,.55); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.5); text-align:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .32); color:#fff; user-select:text; -webkit-user-select:text;
}
.lcell input.cell-input.tens-pos{ top:6%; left:6%; } .lcell input.cell-input.ones-pos{ bottom:6%; right:6%; }
.lcell input.cell-input:focus{ background:rgba(124,58,237,.5); box-shadow:0 0 0 2.5px var(--brass), 0 0 14px rgba(251,191,36,.6); }
.lcell input.cell-input.wrong-flash{ background:var(--error-bg); box-shadow:0 0 0 2.5px var(--error); }

.diag-section{ margin-top:calc(22px * var(--f,1)); width:100%; display:flex; flex-direction:column; align-items:center; }
.diag-section h3{ font-size:calc(.86rem * var(--f,1)); font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin-bottom:calc(30px * var(--f,1)); text-align:center; }
.diag-row{ display:flex; gap:calc(8px * var(--f,1)); align-items:flex-end; flex-wrap:wrap; justify-content:center; }
.diag-box-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; }
.carry-badge{
  position:absolute; top:calc(-24px * var(--f,1)); left:50%; transform:translateX(-50%) scale(0); opacity:0;
  font-family:var(--font-num); font-weight:800; font-size:.8rem; color:#3b2405; background:var(--brass);
  border-radius:999px; padding:2px 9px; white-space:nowrap; box-shadow:0 0 10px rgba(251,191,36,.7);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
}
.carry-badge.show{ transform:translateX(-50%) scale(1); opacity:1; }
.diag-box{
  width:calc(clamp(48px,11vw,64px) * var(--f,1)); min-height:calc(clamp(48px,11vw,64px) * var(--f,1));
  border-radius:14px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1));
  border:2.5px solid var(--border-soft); background:rgba(8,3,26,.4); color:var(--text-faint); transition:all .25s ease;
}
.diag-box.pending{ opacity:.55; }
.diag-box input{ width:100%; height:100%; border:none; background:transparent; text-align:center; font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1)); color:#fff; outline:none; user-select:text; -webkit-user-select:text; }
.diag-box.wrong{ animation:shake .32s ease; }
.carry-fly{
  position:fixed; z-index:3000; font-family:var(--font-num); font-weight:800; font-size:.95rem; color:#3b2405;
  background:var(--brass); border-radius:999px; padding:4px 10px; pointer-events:none;
  transition:transform .55s cubic-bezier(.3,.6,.4,1), opacity .55s ease;
}
.final-banner{
  margin-top:calc(16px * var(--f,1)); text-align:center; background:var(--success-bg); border:2px solid var(--success);
  color:var(--success); border-radius:16px; padding:calc(10px * var(--f,1)) 20px; font-weight:800;
  font-family:var(--font-num); font-size:calc(clamp(1.1rem,3.8vw,1.5rem) * var(--f,1));
}
.arabe-final{ width:100%; display:flex; flex-direction:column; align-items:center; }
.arabe-final .mv-fila-chip{ margin-top:calc(8px * var(--f,1)); }
.arabe-final .result-actions{ margin-top:calc(14px * var(--f,1)); }
.setup-box{ width:100%; max-width:480px; margin:0 auto; text-align:center; }
.setup-box label{ display:block; font-weight:700; font-size:.95rem; color:var(--text-dim); margin-bottom:16px; }
.factor-input-row{ display:flex; align-items:center; justify-content:center; gap:clamp(10px,3vw,18px); }
.factor-input{
  width:100%; max-width:150px; font-family:var(--font-num); font-weight:800; font-size:clamp(1.6rem,7vw,2.2rem);

/* ==========================================================================
   LABORATORIO DE ECUACIONES
   Hoja de estilos: tokens de diseño + componentes
   ========================================================================== */
:root{
  color-scheme: dark;
  /* --- Paleta ------------------------------------------------------------ */
  --bg-1:          #1e1147;
  --bg-2:          #3b1785;
  --bg-3:          #5b21b6;
  --bg-line:       rgba(255,255,255,.05);
  --surface:       rgba(255,255,255,.07);
  --surface-soft:  rgba(255,255,255,.05);
  --border-soft:   rgba(255,255,255,.16);
  --ink:           #f6f3ff;   /* tinta principal */
  --ink-soft:      #c9bdf0;
  --ink-faint:     #8f7fc4;

  --wall:          #fbbf24;   /* viga / pivote de la balanza (= acento de la colección) */
  --wall-dark:     #f59e0b;
  --wall-light:    rgba(251,191,36,.35);

  --num:           #38bdf8;   /* piezas numéricas (constantes) */
  --num-dark:      #7dd3fc;
  --num-bg:        rgba(56,189,248,.22);

  --var:           #f472b6;   /* piezas de la incógnita / coeficiente / denominador */
  --var-dark:      #f9a8d4;
  --var-bg:        rgba(244,114,182,.24);

  --success:       #34d399;
  --success-bg:    rgba(52,211,153,.16);
  --error:         #fb7185;
  --error-bg:      rgba(251,113,133,.16);

  --radius-s: 10px;
  --radius-m: 16px;
  --radius-l: 26px;
  --shadow-piece: 0 6px 0 rgba(0,0,0,0.25), 0 10px 18px rgba(0,0,0,0.35);
  --shadow-card: 0 14px 34px rgba(0,0,0,0.4);

  --font-display: 'Baloo 2', 'Trebuchet MS', 'Comic Sans MS', sans-serif;
  --font-body: 'Nunito', 'Segoe UI', sans-serif;
}


*{ box-sizing: border-box; }




button{ font-family:inherit; }


h1,h2,h3{ font-family: var(--font-display); margin:0; color: var(--ink); }


::selection{ background: var(--wall-light); }


:focus-visible{
  outline: 3px solid var(--wall-dark);
  outline-offset: 3px;
  border-radius: 8px;
}

input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

input[type="number"] { -moz-appearance: textfield; appearance: textfield; }


@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}


/* ==========================================================================
   Layout general
   ========================================================================== */


.wrap{
  width:100%;
  max-width: 980px;
  margin: 0 auto;
}


.top-nav{
  width:100%; max-width:980px; margin:0 auto 14px;
  display:flex; align-items:center; justify-content:space-between;
  gap: 10px; flex-wrap:wrap; padding-right:56px;
}


.ghost-btn{
  border: 2px solid var(--border-soft);
  background: var(--surface);
  color: var(--ink-soft);
  font-weight: 800;
  font-size: 0.95rem;
  padding: 9px 16px;
  border-radius: 999px;
  cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
  transition: transform .15s ease, box-shadow .15s ease, color .15s ease, border-color .15s ease;
}

.ghost-btn:hover{ transform: translateY(-2px); border-color: var(--wall); color: var(--wall-dark); box-shadow: 0 6px 14px rgba(23,50,74,0.08); }

.ghost-btn:active{ transform: translateY(0); }

@media (max-width:480px){ .level-grid{ grid-template-columns:1fr; } }


/* ==========================================================================
   Pantallas: Selección de nivel / tipo
   ========================================================================== */
.step-title{ text-align:center; margin-bottom: 26px; }

.step-title h2{ font-size: clamp(1.5rem,4vw,2.1rem); }

.step-title p{ color: var(--ink-soft); font-weight:600; margin-top:6px; }


.option-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap: 16px; }


.option-card{
  background: var(--surface); backdrop-filter: blur(6px); border: 2.5px solid var(--border-soft); border-radius: var(--radius-m);
  padding: 20px; text-align:center; cursor:pointer; box-shadow: 0 8px 20px rgba(23,50,74,0.08);
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}

.option-card:hover{ transform: translateY(-4px); border-color: var(--wall); box-shadow: 0 14px 26px rgba(23,50,74,0.14); }

.option-card .badge{
  display:inline-block; font-family:var(--font-display); font-weight:700; font-size: 1.5rem; color: var(--num-dark);
  background: var(--num-bg); border-radius: 12px; padding: 10px 18px; margin-bottom:12px;
}

.option-card.mid .badge{ color: var(--num-dark); background: var(--num-bg); }

.option-card.hard .badge{ color: var(--var-dark); background: var(--var-bg); }

.option-card h3{ font-size:1.1rem; margin-bottom:4px; }

.option-card p{ margin:0; color:var(--ink-soft); font-weight:700; font-size:.92rem; }

.option-card .formula{ font-family: var(--font-display); font-size: 1.2rem; color: var(--ink); margin-top: 6px; }


/* ==========================================================================
   Pantalla: crear ecuación propia (formulario)
   ========================================================================== */
.param-card{
  background: var(--surface); border:1px solid var(--border-soft); backdrop-filter: blur(6px); border-radius: var(--radius-l); padding: 28px 26px;
  box-shadow: var(--shadow-card); max-width: 560px; margin: 0 auto;
}


.ec-input{
  width:100%; font-family:var(--font-display); font-size:1.5rem; text-align:center;
  border:2.5px solid var(--border-soft); border-radius:14px; padding:14px 10px; color:var(--ink);
  background: var(--surface); letter-spacing:.5px; margin-bottom:14px;
}

.ec-input:focus{ border-color:var(--wall); outline:none; }

.ec-op-row{ display:flex; justify-content:center; gap:10px; margin-bottom:16px; flex-wrap:wrap; }

.ec-op-btn{
  width:48px; height:48px; border-radius:50%; border:2px solid var(--border-soft);
  background:var(--surface-soft); color:var(--ink); font-family:var(--font-display); font-weight:800;
  font-size:1.2rem; cursor:pointer; transition: border-color .15s, transform .15s;
}

.ec-op-btn:hover{ border-color:var(--wall); transform:translateY(-2px); }

.param-preview{ background: var(--surface-soft); border-radius:14px; padding:16px; margin-bottom:12px; display:flex; justify-content:center; }

.param-warning{ text-align:center; font-weight:800; font-size:.9rem; padding:9px 12px; border-radius:10px; margin-bottom:16px; display:none; }

.param-warning.show{ display:block; background:rgba(251,191,36,.14); color:var(--wall-dark); }

.param-warning.show.ok{ background:var(--success-bg); color:var(--success); }

.param-warning.show.error{ background:var(--error-bg); color:var(--error); }

#btnCrearManual{ width:100%; }

#btnCrearManual:disabled{ opacity:.5; cursor:not-allowed; }


/* ==========================================================================
   Pantalla: Laboratorio
   ========================================================================== */
.lab-header{ text-align:center; margin-bottom: 6px; }

.lab-header .level-pill{
  display:inline-block; font-weight:800; font-size:.78rem; letter-spacing:.04em; text-transform:uppercase;
  color:var(--wall-dark); background:rgba(251,191,36,.14); border:1px solid rgba(251,191,36,.4); padding:5px 14px; border-radius:999px; margin-bottom:10px;
}

.lab-header h2{ font-size: clamp(1.3rem, 3.6vw, 1.7rem); color: var(--ink-soft); font-weight:800; }


.progress-dots{ display:flex; gap:8px; justify-content:center; margin: 12px 0 6px; }

.progress-dots span{ width:10px; height:10px; border-radius:50%; background:var(--border-soft); }

.progress-dots span.done{ background: var(--success); }

.progress-dots span.now{ background: var(--wall); box-shadow: 0 0 0 4px var(--wall-light); }


.hint-banner{
  text-align:center; font-weight:700; color: var(--ink-soft);
  background: var(--surface-soft); border: 1.5px dashed var(--border-soft);
  border-radius: 14px; padding: 10px 16px; margin: 14px auto 8px; max-width: 620px; font-size: .95rem;
}

.hint-banner b{ color: var(--wall-dark); }


.lab-stage{
  position:relative; background: var(--surface); border:1px solid var(--border-soft); backdrop-filter: blur(6px); border-radius: var(--radius-l); box-shadow: var(--shadow-card);
  padding: clamp(22px, 5vw, 46px) clamp(10px, 4vw, 30px); margin-top: 14px; min-height: 190px;
  display:flex; align-items:center; justify-content:center; gap: clamp(10px, 3vw, 28px); overflow: visible;
}


.stage-side{
  flex: 1 1 0; min-width: 0; display:flex; align-items:center; justify-content: center;
  flex-wrap: nowrap; gap: 10px; min-height: 84px; transition: opacity .2s ease;
}

.stage-side.left{ justify-content:flex-end; transform-origin: right center; }

.stage-side.right{ justify-content:flex-start; transform-origin: left center; }

@media (max-width: 560px){ .stage-side.left, .stage-side.right{ justify-content:center; transform-origin: center center; } }


/* Celulares angostos: se prioriza achicar fichas y pared sobre amontonarlas */
@media (max-width: 480px){
  .lab-stage{ gap: clamp(6px, 2vw, 14px); padding: 16px 8px; }
  .stage-side{ gap: 6px; }
  .piece{ font-size: clamp(1.05rem, 4.8vw, 1.5rem); padding: 8px 12px; }
  .sign-static{ font-size: clamp(.95rem, 4vw, 1.2rem); }
  .equals-wall{ width: 44px; min-width: 44px; height: 100px; }
  .equals-wall .eq-text{ font-size: clamp(1.5rem, 6vw, 2rem); }
}


/* --- Piezas -------------------------------------------------------------- */
.piece{
  font-family: var(--font-display); font-weight: 700; font-size: clamp(1.5rem, 4.2vw, 2.1rem);
  border: none; border-radius: var(--radius-s); padding: 12px 18px; cursor: grab;
  user-select:none; -webkit-user-select:none; touch-action: none;
  box-shadow: var(--shadow-piece); transition: transform .15s ease, box-shadow .15s ease, opacity .25s ease;
  line-height:1; display:inline-flex; align-items:center; justify-content:center;
}

.piece:active{ cursor:grabbing; }

.piece.dragging{ cursor:grabbing; z-index: 500; box-shadow: 0 14px 26px rgba(23,50,74,0.28); }

.piece.locked{ cursor: default; opacity:.55; }

.piece.tight-left{ margin-right:-6px; }


.piece-num{ background: var(--num-bg); color: var(--num-dark); }

.piece-var, .piece-coef, .piece-den{ background: var(--var-bg); color: var(--var-dark); }

.piece-placeholder{ visibility:hidden; }


/* Fracción "viva": x y denominador son piezas separadas y arrastrables,
   apiladas visualmente para que se vean como una sola fracción. */
.frac-live{ display:flex; flex-direction:column; align-items:center; gap:3px; }

.frac-live .piece-den{ border-top: 3px solid var(--var-dark); border-radius: 0 0 var(--radius-s) var(--radius-s); padding-top:9px; }

.frac-live .piece-var{ border-radius: var(--radius-s) var(--radius-s) 0 0; padding-bottom:9px; }


.sign-static{ font-family:var(--font-display); font-weight:700; font-size:clamp(1.2rem,3.6vw,1.7rem); color:var(--ink-soft); padding: 0 2px; }


/* --- Pared / balanza ------------------------------------------------------ */
.equals-wall{
  position:relative; background:none; border:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  width: 70px; min-width:70px; height: 120px; font-family: var(--font-display); font-weight:800; color: var(--ink);
}

.equals-wall .eq-text{ font-size: clamp(2rem, 5vw, 2.6rem); transition: opacity .2s ease, transform .2s ease; }

.equals-wall.active .eq-text{ opacity:0; transform: scale(.6); position:absolute; }


.wall-pillar{
  position:relative; width: 16px; height: 0px; border-radius: 10px;
  background: linear-gradient(180deg, var(--wall-light), var(--wall) 45%, var(--wall-dark));
  box-shadow: 0 4px 12px rgba(201,127,31,0.35);
  transition: height .45s cubic-bezier(.34,1.56,.64,1);
}

.equals-wall.active .wall-pillar{ height: 108px; }


.wall-foot{
  position:absolute; left:50%; transform: translateX(-50%) scale(0); width: 0; height:0;
  border-left: 12px solid transparent; border-right: 12px solid transparent; transition: transform .3s ease .1s;
}

.equals-wall.active .wall-foot{ transform: translateX(-50%) scale(1); }

.wall-foot.top{ top:-2px; border-bottom: 14px solid var(--wall-dark); }

.wall-foot.bottom{ bottom:-2px; border-top: 14px solid var(--wall-dark); }


.wall-notch{
  position:absolute; left:50%; width: 30px; height:5px; border-radius:3px;
  background: var(--surface-soft); transform: translateX(-50%) scaleX(0); transition: transform .25s ease .2s;
}

.equals-wall.active .wall-notch{ transform: translateX(-50%) scaleX(1); }

.wall-notch.n1{ top: 40%; }

.wall-notch.n2{ top: 58%; }


.wall-tap-hint{
  position:absolute; bottom:-26px; left:50%; transform:translateX(-50%);
  font-family: var(--font-body); font-weight:700; font-size:.72rem; color: var(--wall-dark);
  white-space:nowrap; animation: bob 1.4s ease-in-out infinite;
}

@keyframes bob{ 0%,100%{ transform:translate(-50%,0);} 50%{ transform:translate(-50%,-4px);} }

@keyframes monedaFlota{ 0%{ transform:translateY(0); opacity:0; } 15%{ opacity:1; } 100%{ transform:translateY(-24px); opacity:0; } }


/* --- Historial -------------------------------------------------------------- */
.history-panel{
  margin-top: 22px; background: var(--surface); border:1px solid var(--border-soft); backdrop-filter: blur(6px); border-radius: var(--radius-m);
  box-shadow: 0 8px 20px rgba(23,50,74,0.08); padding: 16px clamp(12px,4vw,24px) 20px;
}

.history-panel h4{
  font-family: var(--font-body); font-weight:800; color: var(--ink-soft);
  font-size:.82rem; text-transform:uppercase; letter-spacing:.05em; margin-bottom: 10px;
}

.history-row{
  display:flex; align-items:center; justify-content:center; gap: 10px; padding: 9px 4px;
  font-family: var(--font-display); font-size: 1.15rem; border-top: 1px dashed var(--border-soft); flex-wrap:wrap;
}

.history-row:first-child{ border-top:none; }

.history-row.final{ color: var(--success); font-weight:800; }

.history-row .mini-piece{ padding: 4px 9px; border-radius:8px; font-size:1rem; }

.history-row .mini-lado{ display:inline-flex; align-items:center; flex-wrap:wrap; gap:2px; }

.history-row .mini-num{ background: var(--num-bg); color:var(--num-dark); }

.history-row .mini-var{ background: var(--var-bg); color:var(--var-dark); }

.history-row .mini-expr{ color: var(--ink-soft); font-weight:700; font-size:.95rem; }

.history-row .mini-frac{ display:inline-flex; flex-direction:column; align-items:center; font-size:.85em; line-height:1.1; }

.history-row .mini-frac .fd{ border-top:2px solid var(--var-dark); padding-top:2px; min-width:1.2em; text-align:center; }

.history-row .mini-eq{ color:var(--ink-faint); font-weight:800; }


/* ==========================================================================
   Modal (elegir operación / calcular)
   ========================================================================== */
.overlay{
  position:fixed; inset:0; background: rgba(10,4,30,.6); display:flex; align-items:center; justify-content:center;
  z-index:1000; padding: 18px; backdrop-filter: blur(3px); animation: fadeIn .18s ease;
}

@keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }


.modal-card{
  position:relative;
  background: linear-gradient(160deg, #2c1468, #4c1d95); border:1px solid var(--border-soft); border-radius: var(--radius-l); padding: 28px 26px; max-width: 420px; width:100%;
  box-shadow: 0 30px 60px rgba(0,0,0,0.28); text-align:center; animation: pop .22s cubic-bezier(.34,1.56,.64,1);
}

.modal-cerrar{
  position:absolute; top:12px; right:12px; width:32px; height:32px; border-radius:50%;
  border:1px solid var(--border-soft); background:rgba(255,255,255,.08); color:var(--ink);
  font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
}

@keyframes pop{ from{ transform: scale(.85); opacity:0;} to{ transform:scale(1); opacity:1;} }


.modal-card h3{ font-size:1.25rem; margin-bottom: 6px; }

/* ============================================================================
   LABORATORIO DE ECUACIONES — lógica de la aplicación
   Estructura del archivo:
     1. Utilidades numéricas y de identificadores
     2. Motor de ecuaciones: construcción de términos (compartido entre
        generación aleatoria y creación manual) + generación aleatoria
     3. Estado global de la aplicación (máquina de pantallas)
     4. Render de pantallas (inicio, nivel, tipo, formulario manual, laboratorio)
     5. Render del "stage" interactivo (piezas, fracciones, pared, historial)
     6. Arrastre (Pointer Events, compatible mouse + táctil)
     7. Validación de movimientos (elegir operación inversa + calcular)
     8. Modal de operación / cálculo / celebración final

   NOTA DE DISEÑO — fracciones:
   La incógnita (x) y el denominador de una fracción son DOS piezas
   independientes que se muestran apiladas (una fracción visual), pero solo
   el denominador se arrastra al cruzar la pared: la x permanece fija en su
   lugar, tal como al aislar una incógnita en papel.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   1. UTILIDADES
   ------------------------------------------------------------------------- */
function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }

let _uid = 0;
function uid(prefix){ return prefix + (++_uid); }

function prefersReducedMotion(){
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

/* ---------------------------------------------------------------------------
   2. MOTOR DE ECUACIONES
   Cada término es un objeto:
     { id, kind: 'num'|'var'|'coef'|'den', side: 'left'|'right',
       value (num/coef/den: magnitud >=0), sign (1|-1, solo 'num'),
       fracGroup (id compartido entre 'var' y 'den' de una misma fracción) }
   ------------------------------------------------------------------------- */
const TIPOS_FACIL = ['suma','resta','mult','div'];
const TIPOS_DIFICIL = ['ax+b','ax-b','x/a+b','x/a-b'];

const ETIQUETAS_TIPO = {
  suma:   { titulo:'Suma',                   formula:'x + b = c' },
  resta:  { titulo:'Resta',                  formula:'x − b = c' },
  mult:   { titulo:'Multiplicación',         formula:'a·x = c' },
  div:    { titulo:'División',               formula:'x/a = c' },
  'ax+b': { titulo:'Multiplicación y suma',  formula:'a·x + b = d' },
  'ax-b': { titulo:'Multiplicación y resta', formula:'a·x − b = d' },
  'x/a+b':{ titulo:'División y suma',        formula:'x/a + b = d' },
  'x/a-b':{ titulo:'División y resta',       formula:'x/a − b = d' },
};

/* --- Construcción de términos a partir de valores explícitos (compartida) --- */
function crearTerminosFacil(tipo, vals){
  const varT = {id:uid('t'), kind:'var'};
  let left, right, moveQueue, solution;

  if(tipo === 'suma'){
    const b = Math.abs(vals.b), c = vals.c;
    const numB = {id:uid('t'), kind:'num', value:b, sign:1};
    const numC = {id:uid('t'), kind:'num', value:Math.abs(c), sign: c<0?-1:1};
    left = [varT, numB]; right = [numC]; moveQueue = [numB.id]; solution = c - b;
  } else if(tipo === 'resta'){
    const b = Math.abs(vals.b), c = vals.c;
    const numB = {id:uid('t'), kind:'num', value:b, sign:-1};
    const numC = {id:uid('t'), kind:'num', value:Math.abs(c), sign: c<0?-1:1};
    left = [varT, numB]; right = [numC]; moveQueue = [numB.id]; solution = c + b;
  } else if(tipo === 'mult'){
    const a = Math.abs(vals.a) || 1, c = vals.c;
    const coefT = {id:uid('t'), kind:'coef', value:a};
    const numC = {id:uid('t'), kind:'num', value:Math.abs(c), sign: c<0?-1:1};
    left = [coefT, varT]; right = [numC]; moveQueue = [coefT.id]; solution = c / a;
  } else { // div
    const a = Math.abs(vals.a) || 1, c = vals.c;
    const gid = uid('g'); varT.fracGroup = gid;
    const denT = {id:uid('t'), kind:'den', value:a, fracGroup:gid};
    const numC = {id:uid('t'), kind:'num', value:Math.abs(c), sign: c<0?-1:1};
    left = [varT, denT]; right = [numC]; moveQueue = [denT.id]; solution = c * a;
  }
  return {left, right, moveQueue, solution};
}

function crearTerminosDificil(tipo, vals){
  const varT = {id:uid('t'), kind:'var'};
  let left, right, moveQueue, solution;

  if(tipo === 'ax+b' || tipo === 'ax-b'){
    const a = Math.abs(vals.a) || 1, b = Math.abs(vals.b), d = vals.d;
    const coefT = {id:uid('t'), kind:'coef', value:a};
    const numB = {id:uid('t'), kind:'num', value:b, sign: tipo==='ax+b' ? 1 : -1};
    const numD = {id:uid('t'), kind:'num', value:Math.abs(d), sign: d<0?-1:1};
    left = [coefT, varT, numB]; right = [numD];
    moveQueue = [numB.id, coefT.id];
    solution = tipo === 'ax+b' ? (d - b) / a : (d + b) / a;
  } else { // x/a+b , x/a-b
    const a = Math.abs(vals.a) || 1, b = Math.abs(vals.b), d = vals.d;
    const gid = uid('g'); varT.fracGroup = gid;
    const denT = {id:uid('t'), kind:'den', value:a, fracGroup:gid};
    const numB = {id:uid('t'), kind:'num', value:b, sign: tipo==='x/a+b' ? 1 : -1};
    const numD = {id:uid('t'), kind:'num', value:Math.abs(d), sign: d<0?-1:1};
    left = [varT, denT, numB]; right = [numD];
    moveQueue = [numB.id, denT.id];
    solution = tipo === 'x/a+b' ? (d - b) * a : (d + b) * a;
  }
  return {left, right, moveQueue, solution};
}

function finalizarEcuacion(nivel, tipo, core, flip){
  let { left, right, moveQueue, solution } = core;
  if(flip){ const tmp = left; left = right; right = tmp; }
  left.forEach(t => t.side = 'left');
  right.forEach(t => t.side = 'right');
  return { nivel, tipo, left, right, moveQueue, step:0, solution, solved:false };
}

/* --- Generación ALEATORIA (modo "el sistema genera una ecuación") --------- */
function generarEcuacion(nivel, tipo){
  let vals, core, flip = false;

  if(nivel === 'facil'){
    flip = Math.random() < 0.5; // x + b = c  /  c = x + b
    if(tipo === 'suma' || tipo === 'resta'){
      // Suma y resta: ningún número de la ecuación supera el tope (20 o 100).
      const N = state.ambito === 'sr100' ? 100 : 20;
      const minTotal = Math.max(6, Math.round(N * 0.45));
      const total = randInt(minTotal, N);
      const piso = Math.max(1, Math.floor(total * 0.12));
      const p = randInt(piso, total - piso), q = total - p;
      if(tipo === 'suma'){ vals = {b:p, c:total}; }      // x + b = c   (x = q)
      else { vals = {b:p, c:q}; }                        // x − b = c   (x = total)
    } else if(tipo === 'mult'){ const a = randInt(2,10), s = randInt(2,10); vals = {a, c: a*s}; }   // tablas 10×10
    else { const a = randInt(2,10), c = randInt(2,10); vals = {a, c}; }                              // div: x = a·c ≤ 100
    core = crearTerminosFacil(tipo, vals);
  } else if(nivel === 'intermedio'){
    flip = Math.random() < 0.5; // volteo aleatorio, desde intermedio en adelante
    if(tipo === 'ax+b' || tipo === 'ax-b'){
      const a = randInt(2,9), s = randInt(1,12), b = randInt(1,15);
      const d = tipo === 'ax+b' ? a*s + b : a*s - b;
      vals = {a, b, d};
    } else {
      const a = randInt(2,6), m = randInt(1,10), s = m*a, b = randInt(1,15);
      const d = tipo === 'x/a+b' ? m + b : m - b;
      vals = {a, b, d};
    }
    core = crearTerminosDificil(tipo, vals);
  } else { // dificil: misma estructura de 2 pasos, con números bastante más grandes
    flip = Math.random() < 0.5;
    if(tipo === 'ax+b' || tipo === 'ax-b'){
      const a = randInt(4,15), s = randInt(5,30), b = randInt(10,50);
      const d = tipo === 'ax+b' ? a*s + b : a*s - b;
      vals = {a, b, d};
    } else {
      const a = randInt(4,12), m = randInt(5,25), s = m*a, b = randInt(10,50);
      const d = tipo === 'x/a+b' ? m + b : m - b;
      vals = {a, b, d};
    }
    core = crearTerminosDificil(tipo, vals);
  }
  return finalizarEcuacion(nivel, tipo, core, flip);
}

/* --- Generación MANUAL (modo "crear mi propia ecuación") ------------------ */
function generarEcuacionManual(nivel, tipo, vals, flip){
  const core = nivel === 'facil' ? crearTerminosFacil(tipo, vals) : crearTerminosDificil(tipo, vals);
  return finalizarEcuacion(nivel, tipo, core, flip);
}

};

function irA(pantalla){ state.screen = pantalla; render(); }

function reiniciarTodo(){

  state.screen = 'inicio'; state.modo = null; state.nivel = null; state.tipo = null; state.ambito = 'mixto';

function iniciarLaboratorio(nivel, tipo){
  state.nivel = nivel; state.tipo = tipo;
  state.eq = generarEcuacion(nivel, tipo);

  state.screen = 'lab';

function nuevaEcuacionMismoTipo(){
  if(state.modo === 'propia'){ irA('crear'); return; }
  // En Fácil, cada ámbito puede agrupar más de una operación (ej. suma y
  // resta) -- hay que volver a sortear entre ellas cada vez, no repetir
  // siempre la primera que salió. En Intermedio/Difícil cada tipo ya es
  // una categoría propia, así que ahí sí se mantiene la misma al pedir "otra".
  const tipo = state.nivel === 'facil' ? (() => { const p = tiposFacilSegunAmbito(); return p[randInt(0, p.length - 1)]; })() : state.tipo;
  iniciarLaboratorio(state.nivel, tipo);
}

// Fácil se divide en 3 ámbitos: suma y resta hasta 20, suma y resta hasta 100, y tablas 10×10.
function tiposFacilSegunAmbito(){
  if(state.ambito === 'tablas') return ['mult','div'];
  if(state.ambito === 'sr20' || state.ambito === 'sr100') return ['suma','resta'];
  return TIPOS_FACIL; // 'mixto': Desafío Online, las 4 operaciones como siempre
}

function iniciarNivel(cl){ abrirSelectorModo(cl); }
function irACrear(){ state.modo = 'propia'; irA('crear'); }

function startLevel(nivel){
  state.modo = 'sistema'; state.nivel = nivel;
  const pool = nivel === 'facil' ? tiposFacilSegunAmbito() : TIPOS_DIFICIL;
  iniciarLaboratorio(nivel, pool[randInt(0,pool.length-1)]);
}

function startContrarreloj(nivel){
  Contrarreloj.activo = true;
  Contrarreloj.restante = DURACION_CONTRARRELOJ;
  Contrarreloj.completados = 0;
  Contrarreloj.errores = 0;
  Contrarreloj.nivel = nivel;
  document.getElementById('timer-pill').classList.remove('hidden');
  document.getElementById('contador-pill').classList.remove('hidden');
  document.getElementById('contador-pill').textContent = '✓ 0';
  actualizarTimerPill();
  if(Contrarreloj.intervalo) clearInterval(Contrarreloj.intervalo);
  Contrarreloj.intervalo = setInterval(tickContrarreloj, 1000);
  startLevel(nivel);
}
function tickContrarreloj(){
  Contrarreloj.restante--;
  actualizarTimerPill();
  if(Contrarreloj.restante <= 0){
    clearInterval(Contrarreloj.intervalo);
    Contrarreloj.intervalo = null;
    Contrarreloj.activo = false;
    mostrarFinContrarreloj();
  }
}
function actualizarTimerPill(){
  const m = Math.floor(Contrarreloj.restante/60), s = Contrarreloj.restante%60;
  const pill = document.getElementById('timer-pill');
  pill.textContent = `${m}:${String(s).padStart(2,'0')}`;
  pill.style.setProperty('--p', (Contrarreloj.restante / DURACION_CONTRARRELOJ * 100).toFixed(1));
  pill.classList.toggle('urgente', Contrarreloj.restante <= 30);
}
function detenerContrarreloj(){
  if(Contrarreloj.intervalo){ clearInterval(Contrarreloj.intervalo); Contrarreloj.intervalo=null; }
  Contrarreloj.activo = false;
  document.getElementById('timer-pill').classList.add('hidden');
  document.getElementById('contador-pill').classList.add('hidden');
}

}

/* ------------------------------------------------------------------
   FILTRO DE NOMBRES (modo invitado, sin cuenta) -- no es perfecto,
   pero atrapa groserías comunes y sus variantes con números/espacios.
   ------------------------------------------------------------------ */
const PALABRAS_PROHIBIDAS = [
  'puta','puto','mierda','pendejo','maricon','marica','perra','zorra','cabron',
  'pelotudo','boludo','huevon','verga','vagina','culiao','culiado','conchetumadre',
  'ctm','qliao','imbecil','estupido','idiota','violador','nazi','hitler','terrorista',
  'penis','pinga','tetas','follar','coger','joder','cagada','cagon'
];
function normalizarParaFiltro(t){
  let n = t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  n = n.replace(/[013457@$]/g, c => ({'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','@':'a','$':'s'}[c]));
  return n.replace(/[^a-z]/g, '');
}
function nombreTieneOfensa(nombre){
  const n = normalizarParaFiltro(nombre);
  return PALABRAS_PROHIBIDAS.some(p => n.includes(p));
}

/* Achica cada lado de la ecuación (en vez de quebrarlo en dos líneas) cuando
   las piezas no caben completas en el ancho disponible. */
function fitStageSides(){
  ['sideLeft','sideRight'].forEach(id => {
    const sideEl = document.getElementById(id);
    if(!sideEl) return;
    sideEl.style.transform = 'none';
    const available = sideEl.clientWidth;
    const needed = sideEl.scrollWidth;
    if(available > 0 && needed > available){
      const scale = Math.max(available / needed, 0.55);
      sideEl.style.transform = `scale(${scale})`;
    }
  });
}
window.addEventListener('resize', () => { if(state.screen === 'lab') fitStageSides(); });

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}

/* ---------------------------------------------------------------------------
   Analizador de ecuaciones escritas libremente. La incógnita es siempre "x";
   la multiplicación nunca necesita símbolo (5x ya significa 5 por x), así
   que "x" jamás es ambiguo con un operador.
   ------------------------------------------------------------------------- */
function parseEcuacionLibre(texto){
  const s = texto.replace(/\s+/g, '');
  if(!s) return {error:''};

  const partes = s.split('=');
  if(partes.length !== 2) return {error:'La ecuación debe tener un signo =.'};
  const [ladoA, ladoB] = partes;
  if(!ladoA || !ladoB) return {error:'Completa ambos lados de la ecuación.'};

  const aTieneX = /x/i.test(ladoA), bTieneX = /x/i.test(ladoB);
  if(!aTieneX && !bTieneX) return {error:'Tu ecuación necesita una x.'};
  if(aTieneX && bTieneX) return {error:'La x debe estar en un solo lado de la ecuación.'};

  const flip = bTieneX;
  const ladoVar = (flip ? ladoB : ladoA).toLowerCase();
  const ladoNum = flip ? ladoA : ladoB;

  if(!/^[+-]?\d+$/.test(ladoNum)) return {error:'El lado sin la x debe ser solo un número.'};
  const d = parseInt(ladoNum, 10);

  let m;
  if((m = ladoVar.match(/^x\/(\d+)([+-]\d+)?$/))){
    const a = parseInt(m[1], 10);
    if(a === 0) return {error:'El denominador no puede ser 0.'};
    const b = m[2] ? parseInt(m[2], 10) : 0;
    const tipo = b === 0 ? 'div' : (b > 0 ? 'x/a+b' : 'x/a-b');
    const nivel = b === 0 ? 'facil' : 'intermedio';
    const vals = b === 0 ? {a, c:d} : {a, b:Math.abs(b), d};
    return {tipo, nivel, vals, flip};
  }
  if((m = ladoVar.match(/^(\d*)x([+-]\d+)?$/))){
    const a = m[1] ? parseInt(m[1], 10) : 1;
    const b = m[2] ? parseInt(m[2], 10) : 0;
    if(a === 0) return {error:'El coeficiente no puede ser 0.'};
    if(a === 1 && b === 0) return {error:'Esa ecuación ya está resuelta: agrega un número o un coeficiente.'};
    if(a === 1){
      const tipo = b > 0 ? 'suma' : 'resta';
      return {tipo, nivel:'facil', vals:{b:Math.abs(b), c:d}, flip};
    }
    if(b === 0) return {tipo:'mult', nivel:'facil', vals:{a, c:d}, flip};
    const tipo = b > 0 ? 'ax+b' : 'ax-b';
    return {tipo, nivel:'intermedio', vals:{a, b:Math.abs(b), d}, flip};
  }
  return {error:`No entendí "${flip?ladoB:ladoA}". Prueba algo como 3x+5=17 o x/4-2=6.`};
}

let ecuacionLibreLista = null;

function actualizarPreviewLibre(){
  const texto = document.getElementById('ecInput').value;
  const preview = document.getElementById('paramPreview');
  const warn = document.getElementById('paramWarning');
  const btn = document.getElementById('btnCrearManual');

  const resultado = parseEcuacionLibre(texto);

  if(resultado.error === ''){ // vacío: sin mensaje, esperando que escriba
    preview.innerHTML = ''; warn.className = 'param-warning'; warn.textContent = '';
    btn.disabled = true; ecuacionLibreLista = null; return;
  }
  if(resultado.error){
    preview.innerHTML = '';
    warn.textContent = resultado.error;
    warn.className = 'param-warning show error';
    btn.disabled = true; ecuacionLibreLista = null; return;
  }

  const core = resultado.nivel === 'facil' ? crearTerminosFacil(resultado.tipo, resultado.vals) : crearTerminosDificil(resultado.tipo, resultado.vals);
  const eqTemp = finalizarEcuacion(resultado.nivel, resultado.tipo, core, resultado.flip);

  preview.innerHTML = '';
  const row = el('div','history-row');
  row.appendChild(miniLado(eqTemp.left));
  row.appendChild(el('span','mini-eq','='));
  row.appendChild(miniLado(eqTemp.right));
  preview.appendChild(row);

  if(!Number.isInteger(eqTemp.solution)){
    warn.textContent = 'Con estos números la solución no es un número entero. Ajusta la ecuación para poder crearla.';
    warn.className = 'param-warning show error';
    btn.disabled = true;
    ecuacionLibreLista = null;
    return;
  }
  if(eqTemp.solution < 0){
    warn.textContent = 'Con estos números x sería negativo. Ajusta la ecuación para que la solución no sea negativa.';
    warn.className = 'param-warning show error';
    btn.disabled = true;
    ecuacionLibreLista = null;
    return;
  }
  warn.textContent = '✓ Ecuación lista para crear.';
  warn.className = 'param-warning show ok';
  btn.disabled = false;
  ecuacionLibreLista = resultado;
}

function confirmarCreacionLibre(){
  if(!ecuacionLibreLista) return;
  const {tipo, nivel, vals, flip} = ecuacionLibreLista;
  state.modo = 'propia'; state.nivel = nivel; state.tipo = tipo;
  state.eq = generarEcuacionManual(nivel, tipo, vals, flip);

  render();
}

/* Agrupa términos consecutivos var+den que comparten fracGroup en una
   sola pieza visual (fracción), aunque siguen siendo dos botones arrastrables. */
function construirPiezasLado(terms){
  const nodos = [];
  for(let i=0; i<terms.length; i++){
    const t = terms[i];
    const sig = terms[i+1];
    if(t.kind === 'var' && t.fracGroup && sig && sig.kind === 'den' && sig.fracGroup === t.fracGroup){
      const wrap = el('div','frac-live');
      wrap.appendChild(buildPieceEl(t, i===0));
      wrap.appendChild(buildPieceEl(sig, false));
      nodos.push(wrap);
      i++; // el denominador ya fue consumido
      continue;
    }
    nodos.push(buildPieceEl(t, i===0));
  }
  return nodos;
}

/* Construye una pieza interactiva del stage principal */
function buildPieceEl(term, esPrimeraDeLado){
  let node;
  const draggable = state.wallActive && !state.eq.solved;

  if(term.kind === 'var'){
    node = el('button','piece piece-var', 'x');
  } else if(term.kind === 'coef'){
    node = el('button','piece piece-coef tight-left', String(term.value));
  } else if(term.kind === 'den'){
    node = el('button','piece piece-den', String(term.value));
  } else { // num
    const signo = signoPrefijo(term, esPrimeraDeLado);
    node = el('button','piece piece-num', (signo ? `<span class="sign-static" style="color:inherit">${signo}</span>` : '') + term.value);
  }

  node.dataset.termId = term.id;
  if(!draggable){ node.classList.add('locked'); }
  else{ attachDrag(node, term); }
  return node;
}

function signoPrefijo(term, esPrimero){
  if(esPrimero) return term.sign === -1 ? '−' : '';
  return term.sign === -1 ? '−' : '+';
}

/* Snapshot estático de una fila de historial */
function snapshotActual(){
  return { left: state.eq.left.map(clonaTermino), right: state.eq.right.map(clonaTermino) };
}
function clonaTermino(t){ return Object.assign({}, t); }

function buildHistoryRow(snap, esFinal){
  const row = el('div','history-row' + (esFinal ? ' final' : ''));
  row.appendChild(miniLado(snap.left));
  row.appendChild(el('span','mini-eq','='));
  row.appendChild(miniLado(snap.right));
  return row;
}

function miniLado(terms){
  const wrap = el('span','mini-lado');
  for(let i=0; i<terms.length; i++){
    const t = terms[i];
    if(t.kind === 'expr'){ wrap.appendChild(el('span','mini-expr', t.text)); continue; }

    const sig = terms[i+1];
    if(t.kind === 'var' && t.fracGroup && sig && sig.kind === 'den' && sig.fracGroup === t.fracGroup){
      const fr = el('span','mini-piece mini-var mini-frac');
      fr.innerHTML = `<span>x</span><span class="fd">${sig.value}</span>`;
      wrap.appendChild(fr);
      i++; continue;
    }
    if(t.kind === 'coef' && sig && sig.kind === 'var'){
      const signo = signoPrefijo(t, i===0);
      if(signo) wrap.appendChild(el('span','mini-expr', signo + ' '));
      wrap.appendChild(el('span','mini-piece mini-var', t.value + 'x'));
      i++; continue;
    }

    const signo = signoPrefijo(t, i===0);
    if(signo) wrap.appendChild(el('span','mini-expr', signo + ' '));
    if(t.kind === 'var'){ wrap.appendChild(el('span','mini-piece mini-var','x')); }
    else if(t.kind === 'coef'){ wrap.appendChild(el('span','mini-piece mini-var', t.value + '·x')); }
    else if(t.kind === 'den'){ wrap.appendChild(el('span','mini-piece mini-var', ':' + t.value)); }
    else { wrap.appendChild(el('span','mini-piece mini-num', String(t.value))); }
  }
  return wrap;
}

/* ---------------------------------------------------------------------------
   6. ARRASTRE — Pointer Events (mouse + táctil unificados)
   ------------------------------------------------------------------------- */
let dragCtx = null;

function attachDrag(node, term){
  node.addEventListener('pointerdown', (ev) => onPointerDown(ev, node, term));
}

function onPointerDown(ev, node, term){
  if(dragCtx || state.eq.solved) return;
  ev.preventDefault();
  const rect = node.getBoundingClientRect();

  const placeholder = el('span','piece piece-placeholder');
  placeholder.style.width = rect.width + 'px';
  placeholder.style.height = rect.height + 'px';
  node.parentNode.insertBefore(placeholder, node);

  document.body.appendChild(node);
  node.style.position = 'fixed';
  node.style.left = rect.left + 'px';
  node.style.top = rect.top + 'px';
  node.style.width = rect.width + 'px';
  node.style.margin = '0';
  node.classList.add('dragging');

  dragCtx = {
    node, term, placeholder,
    startX: ev.clientX, startY: ev.clientY,
    baseLeft: rect.left, baseTop: rect.top,
    width: rect.width, height: rect.height,
  };

  node.setPointerCapture(ev.pointerId);
  node.addEventListener('pointermove', onPointerMove);
  node.addEventListener('pointerup', onPointerUp);
  node.addEventListener('pointercancel', onPointerUp);
}

function onPointerMove(ev){
  if(!dragCtx) return;
  const dx = ev.clientX - dragCtx.startX;
  const dy = ev.clientY - dragCtx.startY;
  dragCtx.node.style.left = (dragCtx.baseLeft + dx) + 'px';
  dragCtx.node.style.top = (dragCtx.baseTop + dy * 0.5) + 'px'; // arrastre mayormente horizontal
}

function onPointerUp(ev){
  if(!dragCtx) return;
  const { node, term, placeholder } = dragCtx;
  node.removeEventListener('pointermove', onPointerMove);
  node.removeEventListener('pointerup', onPointerUp);
  node.removeEventListener('pointercancel', onPointerUp);

  const wallEl = document.querySelector('.equals-wall .wall-pillar');
  const wallRect = wallEl ? wallEl.getBoundingClientRect() : document.querySelector('.equals-wall').getBoundingClientRect();
  const wallCenterX = wallRect.left + wallRect.width/2;
  const pieceRect = node.getBoundingClientRect();
  const pieceCenterX = pieceRect.left + pieceRect.width/2;

  const cruzo = term.side === 'left' ? (pieceCenterX > wallCenterX) : (pieceCenterX < wallCenterX);
  const esperado = state.eq.moveQueue[state.eq.step];

  if(!cruzo){ snapBack(); return; }
  if(term.id !== esperado){
    if(Contrarreloj.activo) Contrarreloj.errores++;
    reportarSiCorresponde(0,1);
    snapBack(mensajeOrdenIncorrecto()); return;
  }

  abrirModalOperacion(term);
}

function snapBack(mensaje){
  if(!dragCtx) return;
  const { node, placeholder } = dragCtx;
  const target = placeholder.getBoundingClientRect();
  node.style.transition = 'left .3s ease, top .3s ease';
  node.style.left = target.left + 'px';
  node.style.top = target.top + 'px';
  setTimeout(() => {
    placeholder.parentNode && placeholder.parentNode.insertBefore(node, placeholder);
    placeholder.remove();
    node.style.position = ''; node.style.left = ''; node.style.top = ''; node.style.width = ''; node.style.margin = '';
    node.style.transition = '';
    node.classList.remove('dragging');
    dragCtx = null;
    if(mensaje) mostrarToast(mensaje);
  }, prefersReducedMotion() ? 0 : 300);
}

function mensajeOrdenIncorrecto(){
  const esperadoTerm = buscarTermino(state.eq.moveQueue[state.eq.step]);
  let desc = 'la otra pieza';
  if(esperadoTerm){
    if(esperadoTerm.kind==='num') desc = (esperadoTerm.sign===-1?'−':'+') + esperadoTerm.value;
    else if(esperadoTerm.kind==='coef') desc = 'el ' + esperadoTerm.value + ' que acompaña a la x';
    else if(esperadoTerm.kind==='den') desc = 'el ' + esperadoTerm.value + ' que divide a la x (la parte de abajo de la fracción)';
  }
  return 'Todavía no. Primero debes mover ' + desc + '.';
}

let toastTimer = null;
function mostrarToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div'); t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2c1468;border:1px solid rgba(255,255,255,.18);color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;font-family:Nunito,sans-serif;font-size:.92rem;z-index:2000;box-shadow:0 10px 24px rgba(0,0,0,0.4);max-width:90vw;text-align:center;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.transition='opacity .4s ease'; t.style.opacity='0'; }, 2200);
}

/* ---------------------------------------------------------------------------
   7 y 8. VALIDACIÓN + MODAL (elegir operación inversa, luego calcular)
   Símbolos usados en el selector de operación: + − × ∶
   (se usa ∶ en vez de ÷ para que no se confunda visualmente con +)
   ------------------------------------------------------------------------- */
let modalCtx = null; // { term, stage: 'op'|'compute', ... }
const SIMBOLO_DIVISION = '∶';

function inversaCorrecta(term){
  if(term.kind === 'num') return term.sign === 1 ? '−' : '+';
  if(term.kind === 'coef') return SIMBOLO_DIVISION; // se despeja dividiendo
  return '×'; // 'den' -> se despeja multiplicando
}

function abrirModalOperacion(term){
  modalCtx = { term, stage:'op' };
  pintarModal();
}

function pintarModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = '';

      <p class="modal-sub">¿En qué operación se transforma esta pieza al pasar al otro lado?</p>
      <div class="op-grid">
        <button class="op-btn" data-op="+">+</button>
        <button class="op-btn" data-op="−">−</button>
        <button class="op-btn" data-op="×">×</button>
        <button class="op-btn" data-op="${SIMBOLO_DIVISION}">${SIMBOLO_DIVISION}</button>
      </div>
      <div class="modal-msg error" id="modalMsg"></div>
    `;
    card.querySelectorAll('.op-btn').forEach(b => b.onclick = () => elegirOperacion(b.dataset.op));
  } else if(modalCtx.stage === 'compute'){
    card.innerHTML = `
      <button class="modal-cerrar" id="modalCerrarBtn" aria-label="Cerrar">✕</button>
      <h3>Ahora calculemos</h3>
      <div class="compute-expr">¿Cuánto es ${modalCtx.exprTexto}?</div>
      <div class="compute-input-row">
        <input type="number" inputmode="numeric" class="compute-input" id="computeInput" autocomplete="off" autofocus>
        <button class="compute-submit" id="computeSubmit">Listo</button>
      </div>
      <div class="modal-msg error" id="modalMsg"></div>
    `;
    const input = card.querySelector('#computeInput');
    const submit = () => enviarCalculo(parseFloat(input.value));
    card.querySelector('#computeSubmit').onclick = submit;
    input.addEventListener('keydown', (e) => { if(e.key === 'Enter') submit(); });
  }

  overlay.appendChild(card);
  root.appendChild(overlay);
  const btnCerrar = card.querySelector('#modalCerrarBtn');
  if(btnCerrar) btnCerrar.onclick = cancelarModal;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) cancelarModal(); });
  if(modalCtx.stage === 'compute'){
    setTimeout(() => { const i = document.getElementById('computeInput'); if(i) i.focus(); }, 50);
  }
}

function cerrarModal(){ modalCtx = null; document.getElementById('modal-root').innerHTML = ''; }

function fmtNum(numTerm){ return (numTerm.sign === -1 ? '−' : '') + numTerm.value; }

// Describe en palabras simples qué pieza fue la que cruzó la pared,
// para que el alumno no tenga que adivinar si no lo recuerda.
function describirCruce(term){
  if(term.kind === 'num'){
    return `El <b>${term.sign === -1 ? '−' : '+'}${term.value}</b> cruzó la pared.`;
  }
  if(term.kind === 'coef'){
    return `El <b>${term.value}</b> que multiplicaba a la x cruzó la pared.`;
  }
  if(term.kind === 'den'){
    return `El <b>${term.value}</b> que dividía a la x cruzó la pared.`;
  }
  return '';
}

function cancelarModal(){
  cerrarModal();
  snapBack();
}
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && modalCtx) cancelarModal();
});

function elegirOperacion(simbolo){
  const term = modalCtx.term;
  const correcta = inversaCorrecta(term);
  if(simbolo !== correcta){
    if(Contrarreloj.activo) Contrarreloj.errores++;
    reportarSiCorresponde(0,1); mvFallo();
    cerrarModal(); snapBack();
    return;
  }

  const fromSide = term.side, toSide = otroLado(fromSide);
  const otroNum = ladoArray(toSide).find(t => t.kind === 'num');
  const otroValorReal = otroNum.sign * otroNum.value;

  let exprTexto, resultado;

  if(term.kind === 'num'){
    // Término aditivo: cruza y queda visible junto al número del otro lado
    exprTexto = fmtNum(otroNum) + ' ' + (term.sign === -1 ? '+' : '−') + ' ' + term.value;
    resultado = otroValorReal - (term.sign * term.value);
    const snap = snapshotActual();
    moverTerminoEnSnapshot(snap, term.id, fromSide, toSide, term.sign * -1);
    state.history.push(snap);
  } else {
    // Término multiplicativo (coeficiente o denominador): se consume al cruzar
    const opSymbol = term.kind === 'coef' ? SIMBOLO_DIVISION : '×';
    exprTexto = fmtNum(otroNum) + ' ' + opSymbol + ' ' + term.value;
    resultado = term.kind === 'coef' ? (otroValorReal / term.value) : (otroValorReal * term.value);
    const snap = snapshotActual();
    quitarTerminoEnSnapshot(snap, term.id, fromSide);
    reemplazarExprEnSnapshot(snap, toSide, otroNum.id, exprTexto);
    state.history.push(snap);
  }

  modalCtx = { term, stage:'compute', exprTexto, resultado, fromSide, toSide, otroNumId: otroNum.id };
  pintarModal();
  render(); // refresca el laboratorio detrás (historial actualizado); el modal se repinta encima
}

/* Helpers para construir snapshots "intermedios" (solo visuales, no mutan el estado real) */
function moverTerminoEnSnapshot(snap, termId, fromSide, toSide, nuevoSigno){
  const fromArr = snap[fromSide], toArr = snap[toSide];
  const idx = fromArr.findIndex(t => t.id === termId);
  const [t] = fromArr.splice(idx,1);
  t.sign = nuevoSigno; t.side = toSide;
  toArr.push(t);
}
function quitarTerminoEnSnapshot(snap, termId, fromSide){
  const arr = snap[fromSide];
  const idx = arr.findIndex(t => t.id === termId);
  if(idx>=0) arr.splice(idx,1);
}
function reemplazarExprEnSnapshot(snap, side, numId, texto){
  const arr = snap[side];
  const idx = arr.findIndex(t => t.id === numId);
  if(idx>=0) arr.splice(idx,1,{kind:'expr', text:texto});
}

function enviarCalculo(valorIngresado){
  const msg = document.getElementById('modalMsg');
  if(Number.isNaN(valorIngresado) || valorIngresado !== modalCtx.resultado){
    if(Contrarreloj.activo) Contrarreloj.errores++;
    reportarSiCorresponde(0,1); mvFallo();
    msg.textContent = 'Esa no es la respuesta correcta. Intenta de nuevo.';
    msg.classList.add('show');
    return;
  }

  const { term, resultado, fromSide, toSide, otroNumId } = modalCtx;
  cerrarModal();

  const fromArr = ladoArray(fromSide), toArr = ladoArray(toSide);

  if(term.kind === 'num'){
    const i1 = fromArr.findIndex(t => t.id === term.id); fromArr.splice(i1,1);
    const i2 = toArr.findIndex(t => t.id === otroNumId); toArr.splice(i2,1);
    toArr.push({ id: uid('t'), kind:'num', side: toSide, value: Math.abs(resultado), sign: resultado < 0 ? -1 : 1 });
  } else {
    // coeficiente o denominador: se elimina, la x ya queda sola en su lugar
    const i1 = fromArr.findIndex(t => t.id === term.id); fromArr.splice(i1,1);
    const i2 = toArr.findIndex(t => t.id === otroNumId); toArr.splice(i2,1);
    toArr.push({ id: uid('t'), kind:'num', side: toSide, value: Math.abs(resultado), sign: resultado < 0 ? -1 : 1 });
  }

  state.eq.step++;
  state.history.push(snapshotActual());

  if(dragCtx){ dragCtx.placeholder.remove(); dragCtx.node.remove(); dragCtx = null; }

  verificarResuelto();
  render();
}

function verificarResuelto(){
  const resuelto = (
    (state.eq.left.length === 1 && state.eq.left[0].kind === 'var' && state.eq.right.length === 1 && state.eq.right[0].kind === 'num') ||
    (state.eq.right.length === 1 && state.eq.right[0].kind === 'var' && state.eq.left.length === 1 && state.eq.left[0].kind === 'num')
  );
  if(resuelto){
    state.eq.solved = true;
    if(AlumnoActual) window.reportarProgresoPractica(AlumnoActual.id, 'ecuaciones', 1, 0, state.modo === 'propia' ? 1 : (({facil:1, intermedio:2, dificil:3})[state.nivel] || 1));
    mvExito();
    reportarSiCorresponde(1,0);
    if(Contrarreloj.activo){
      Contrarreloj.completados++;
      document.getElementById('contador-pill').textContent = '✓ '+Contrarreloj.completados;
      mostrarToast('¡Correcto! Preparando la siguiente…');
      setTimeout(() => {
        if(!Contrarreloj.activo) return;
        startLevel(Contrarreloj.nivel);
      }, 1200);
      return;
    }
    return;
  }
}

function mostrarCelebracion(){
  const varLado = state.eq.left[0].kind === 'var' ? state.eq.left[0] : state.eq.right[0];
  const numLado = state.eq.left[0].kind === 'num' ? state.eq.left[0] : state.eq.right[0];
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
  const overlay = el('div','overlay');
  const card = el('div','modal-card celebrate-card');
  card.innerHTML = `
    <div class="celebrate-emoji">🎉</div>
    <h3>¡Ecuación resuelta!</h3>
    <p class="modal-sub">Aplicaste correctamente el principio de equivalencia.</p>
    <div class="result-line">x = ${fmtNum(numLado)}</div>
    <div class="btn-row">
      <button class="primary-btn" id="btnOtraEc">Otra ecuación</button>
      <button class="secondary-btn" id="btnInicioCel">Inicio</button>
    </div>
  `;
  overlay.appendChild(card);
  root.appendChild(overlay);
  document.getElementById('btnOtraEc').onclick = () => { cerrarModal(); nuevaEcuacionMismoTipo(); };
  document.getElementById('btnInicioCel').onclick = () => { cerrarModal(); reiniciarTodo(); };
}

/* ---------------------------------------------------------------------------
   Arranque
   ------------------------------------------------------------------------- */
let _yaConectado = false;
try{
  const _guardado = JSON.parse(sessionStorage.getItem('profehoracio_alumno_actual') || 'null');
  if(_guardado && _guardado.id && _guardado.nombre){
    AlumnoActual = _guardado;
    iniciarHeartbeatTiempo();
    state.screen = 'inicio';
    _yaConectado = true;
  }
} catch(e){}
state.screen = 'inicio';
render();

</script>

<script>
(function(){
  var R = window.mvRank = {};
  var NORM = {easy:'Facil',facil:'Facil',intermedio:'Intermedio',medio:'Intermedio',medium:'Intermedio',avanzado:'Dificil',dificil:'Dificil',hard:'Dificil'};
  var LAB = {Facil:'Fácil',Intermedio:'Intermedio',Dificil:'Difícil'};
  var ORDEN = ['Facil','Intermedio','Dificil'];
  var CORONA = '<svg viewBox="0 0 24 24"><path d="M3 8l4.5 4L12 5l4.5 7L21 8l-2 11H5z"/><path d="M5 21h14"/></svg>';
  function sesion(){ try{ var s = JSON.parse(sessionStorage.getItem('profehoracio_alumno_actual') || 'null'); return (s && s.id && s.nombre) ? s : null; }catch(e){ return null; } }
  function esc(t){ return String(t == null ? '—' : t).replace(/[<>&"]/g, ''); }
  function key(n){ return NORM[n] || String(n); }
  function col(res, nivel){ return 'rankingAciertos' + res + key(nivel); }
  R.tabs = {};
  R.cfg = function(res, tabs){ R.tabs[res] = tabs; };
  window.MvLocal = { cr:false };
  function esperarFB(){ return new Promise(function(ok){ var n = 0; (function t(){ if(window.guardarRankingAciertos || n++ > 40) ok(); else setTimeout(t, 150); })(); }); }
  function botonCorona(texto, fn){
    var d = document.createElement('div'); d.className = 'mvrk-fila';
    d.innerHTML = '<button type="button" class="icon-btn btn-orbita v-oro" aria-label="' + texto + '" title="' + texto + '"><span class="bola">' + CORONA + '</span></button><span>' + texto + '</span>';

    for(var i = bs.length - 1; i >= 0; i--){ if((bs[i].textContent || '').indexOf(textoBtn) >= 0 || (bs[i].getAttribute('aria-label') || '').indexOf(textoBtn) >= 0) return bs[i].parentElement; }

  R.pedirModo = function(res, nivel, titulo, minutos, cbLibre, cbCont){
    var ov = document.getElementById('mvrkModo'); if(ov) ov.remove();

    document.body.appendChild(ov);

    c.insertAdjacentElement('beforebegin', cont);
    var s = sesion(); if(!s) return;
    if(score > 0){
      await esperarFB();
      var r = window.guardarRankingAciertos ? await window.guardarRankingAciertos(col(res, nivel), s.id, s.nombre, score) : null;

    document.body.appendChild(ov);
    ov.querySelector('.mvrk-x').onclick = function(){ ov.remove(); };
    ov.addEventListener('click', function(e){ if(e.target === ov) ov.remove(); });
    var TABS = R.tabs[res] || ORDEN.map(function(k){ return [k, LAB[k]]; });

    async function pintar(n){

      Array.prototype.forEach.call(tabs.children, function(b){ b.onclick = function(){ pintar(b.dataset.k); }; });
      cuerpo.innerHTML = '<p class="mvrk-vacio">Cargando…</p>';
      await esperarFB();
      var s = sesion(), r = window.leerRankingAciertos ? await window.leerRankingAciertos('rankingAciertos' + res + n, s ? s.id : null) : null;
      if(actual !== n) return;
      if(!r){ cuerpo.innerHTML = '<p class="mvrk-vacio">No se pudo cargar el ranking. Revisa tu conexión.</p>'; return; }
      if(!r.lista.length){ cuerpo.innerHTML = '<p class="mvrk-vacio">Aún nadie tiene récord. ¡Sé el primero!</p>'; return; }
      var med = ['🥇','🥈','🥉'];
      cuerpo.innerHTML = '<ol>' + r.lista.map(function(f, i){ return '<li class="' + (s && f.id === s.id ? 'yo' : '') + '"><span class="pos">' + (med[i] || (i + 1)) + '</span><span class="nom">' + esc(f.nombre) + '</span><b class="pts">' + (Number(f.mejor) || 0) + '</b></li>'; }).join('') + '</ol>' + (r.mio ? '<p class="mvrk-mio">Tu récord: ' + r.mio + '</p>' : '');
    }
    pintar(actual);
  };
})();
</script>

const app = initializeApp(firebaseConfig, "onlineEcuaciones");
const auth = getAuth(app);
const db = getFirestore(app);

window.unirseClaseOnline = async function(codigo, nombre){
  try{
    const userCredential = await signInAnonymously(auth);
    const uid = userCredential.user.uid;

    const sessionRef = doc(db, 'sessions', codigo);
    const sessionSnap = await getDoc(sessionRef);
    if(!sessionSnap.exists()) return { ok:false, error:'Ese código no existe. Revísalo con tu profesor.' };
    const datos = sessionSnap.data();

    if(datos.active === false) return { ok:false, error:'Tu profesor ya cerró esta sesión.' };
    if(datos.recurso && datos.recurso !== 'ecuaciones') return { ok:false, error:`Ese código es para ${datos.recurso}, no para Ecuaciones.` };

    const duracionMinutos = datos.duracionMinutos || 180;
    if(datos.createdAt){
      const minutosTranscurridos = (Date.now() - datos.createdAt.toDate().getTime()) / 60000;
      if(minutosTranscurridos > duracionMinutos) return { ok:false, error:'Este código ya venció. Pídele uno nuevo a tu profesor.' };
    }

    return { ok:true, uid, nivelObjetivo: datos.nivelObjetivo, modoObjetivo: datos.modoObjetivo, ambitoObjetivo: datos.ambitoObjetivo };
  } catch(err){
    console.error(err);
    return { ok:false, error:'Error de conexión. Intenta de nuevo.' };
  }
};

window.iniciarNuevoIntentoOnline = async function(codigo, docId, nombre, uid){
  if(!codigo || !docId) return;
  try{
    await setDoc(doc(db, 'sessions', codigo, 'students', docId), {
      name: nombre, uid: uid || null, startedAt: serverTimestamp(), completados: 0, errores: 0, mascota: (window.mascotaParaClase ? await window.mascotaParaClase() : null)
    });
  } catch(err){
    console.error('No se pudo iniciar el intento online:', err);
  }
};

window.reportarProgresoOnline = async function(codigo, docId, deltaCompletados, deltaErrores){
  if(!codigo || !docId) return;
  try{
    await setDoc(doc(db, 'sessions', codigo, 'students', docId), {
      completados: increment(deltaCompletados || 0),
      errores: increment(deltaErrores || 0),
      updatedAt: serverTimestamp()
    }, { merge: true });
  } catch(err){
    console.error('No se pudo reportar el progreso online:', err);
  }
};

// Si se llega desde el inicio con un código de clase en el enlace
// (?codigoClase=XXXX), se une solo, sin mostrar el botón ni el modal --
// ya sea con la cuenta que ya tenía la sesión, o como invitado si vino
// con ?invitado=Nombre (ese nombre ya pasó por el filtro en el inicio,
// pero se revisa una segunda vez acá por si alguien arma el enlace a mano).
// Va acá (y no en el script principal) porque recién aquí existen
// unirseClaseOnline, Online, AlumnoActual y las funciones del juego.
try{
  const parametrosUrl = new URLSearchParams(location.search);
  const codigoDesdeUrl = parametrosUrl.get('codigoClase');
  const invitadoDesdeUrl = parametrosUrl.get('invitado');
  let nombreParaUnirse = null;
  if(AlumnoActual) nombreParaUnirse = AlumnoActual.nombre;
  else if(invitadoDesdeUrl && invitadoDesdeUrl.trim() && !nombreTieneOfensa(invitadoDesdeUrl)) nombreParaUnirse = `👤 Invitado: ${invitadoDesdeUrl.trim()}`;

  if(codigoDesdeUrl && nombreParaUnirse){
    (async () => {
      const resultado = await window.unirseClaseOnline(codigoDesdeUrl.toUpperCase(), nombreParaUnirse);
      if(!resultado.ok){ alert(resultado.error); return; }
      Online.activo = true; Online.codigo = codigoDesdeUrl.toUpperCase(); Online.uid = resultado.uid; Online.nombre = nombreParaUnirse;
      document.getElementById('indicadorOnline').classList.remove('hidden');
      document.getElementById('nombreOnline').textContent = nombreParaUnirse;
      registrarInicioOnline();
      state.ambito = resultado.ambitoObjetivo || 'mixto';
      if(resultado.modoObjetivo === 'contrarreloj'){ startContrarreloj(resultado.nivelObjetivo); }
      else { startLevel(resultado.nivelObjetivo); }
    })();
  }
} catch(e){ console.error(e); }

/* ---- Ranking de aciertos de la contrarreloj: un récord por alumno y nivel; solo se reemplaza si mejora; nunca se borra ---- */
window.guardarRankingAciertos = async function(col, id, nombre, mejor){
  try{
    await signInAnonymously(auth);
    const ref = doc(db, col, id);
    const s = await getDoc(ref);
    const previo = s.exists() ? (Number(s.data().mejor) || 0) : 0;
    if(mejor > previo && mejor <= 500) await setDoc(ref, { nombre: nombre, mejor: mejor, actualizado: serverTimestamp() });
    return { previo: previo };
  } catch(err){ console.error('No se pudo guardar el récord:', err); return null; }
};
window.leerRankingAciertos = async function(col, miId){
  try{
    await signInAnonymously(auth);
    const r = await getDocs(query(collection(db, col), orderBy('mejor', 'desc'), limit(10)));
    const lista = r.docs.map(d => ({ id: d.id, ...d.data() }));
    let mio = 0;
    if(miId){ const s = await getDoc(doc(db, col, miId)); mio = s.exists() ? (Number(s.data().mejor) || 0) : 0; }
    return { lista: lista, mio: mio };
  } catch(err){ console.error('No se pudo leer el ranking:', err); return null; }
};
