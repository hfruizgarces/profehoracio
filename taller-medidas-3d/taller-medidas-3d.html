<style>

body.en-juego{overflow:hidden;height:100dvh;min-height:0}

.app-header.app-topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:none;width:100%;max-width:900px;margin:0 auto;padding:2px 10px 0;flex-wrap:nowrap}

#mvCelebra.on{animation:mvCelPop 1.6s ease both}
@keyframes mvCelPop{0%{opacity:0;transform:translateX(-50%) scale(.55)}14%{opacity:1;transform:translateX(-50%) scale(1.1)}24%{transform:translateX(-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}

 .mv-niveles.mv-p4m{aspect-ratio:100/36}

.fr b{display:block;padding:0 .2em}.fr b:first-child{border-bottom:.1em solid currentColor;padding-bottom:.05em}.fr b:last-child{padding-top:.05em}

or</span></button><button type="button" class="level-btn mv-nivel n3" onclick="abrir('llenado')" aria-label="Llenado: cilindro, cono, pirámide y esfera"><span class="fondo"></span><svg class="ico" viewBox="0 0 100 100" aria-hidden="true"><path d="M22 28v50c0 8 12 12 28 12s28-4 28-12V28z" fill="rgba(255,255,255,.9)" stroke="rgba(15,5,40,.5)" stroke-width="2" stroke-linejoin="round"/><path d="M22 52v26c0 8 12 12 28 12s28-4 28-12V52c0 8-12 12-28 12S22 60 22 52z" fill="#38bdf8" stroke="rgba(15,5,40,.5)" stroke-width="2" stroke-linejoin="round"/><ellipse cx="50" cy="28" rx="28" ry="9" fill="#fff" stroke="rgba(15,5,40,.5)" stroke-width="2" stroke-linejoin="round"/><path d="M50 4C44 12 42 16 42 19a8 8 0 0 0 16 0c0-3-2-7-8-15z" fill="#0ea5e9" stroke="rgba(15,5,40,.5)" stroke-width="2" stroke-linejoin="round"/></svg><span class="t">Llenado</span></button><button type="button" class="level-btn mv-nivel n4" onclick="abrir('envases')" aria-label="Envases del mundo real"><span class="fondo"></span><svg class="ico" viewBox="0 0 100 100" aria-hidden="true"><path d="M12 40v38c0 6 9 9 21 9s21-3 21-9V40z" fill="#fb7185" stroke="rgba(15,5,40,.5)" stroke-width="2" stroke-linejoin="round"/><ellipse cx="33" cy="40" rx="21" ry="7" fill="#fecdd3" stroke="rgba(15,5,40,.5)" stroke-width="2" stroke-linejoin="round"/><path d="M58 52L76 44L94 52L94 78L76 88L58 78Z" fill="#a78bfa" stroke="rgba(15,5,40,.5)" stroke-width="2" stroke-linejoin="round"/><path d="M58 52L76 44L94 52L76 60Z" fill="#ddd6fe" stroke="rgba(15,5,40,.5)" stroke-width="2" stroke-linejoin="round"/><path d="M76 60L94 52L94 78L76 88Z" fill="#7c3aed" stroke="rgba(15,5,40,.5)" stroke-width="2" stroke-linejoin="round"/></svg><span class="t">Envases</span></button>

<script>
window.mvExito = function(){
  try{ if(window.reaccionCompanero) window.reaccionCompanero('bien'); }catch(e){}
  var h=document.getElementById('mvCelebra'); if(!h) return;
  var img=h.querySelector('.mv-av img'); if(!img || !img.getAttribute('src')) return;
  h.classList.remove('on'); void h.offsetWidth; h.classList.add('on');
  clearTimeout(h._t); h._t=setTimeout(function(){ h.classList.remove('on'); },1700);
};
window.mvFallo = function(){ try{ if(window.reaccionCompanero) window.reaccionCompanero('mal'); }catch(e){} };
const RECURSO = 'taller-medidas-3d';
let AlumnoActual = null;
try{ var _g=JSON.parse(sessionStorage.getItem('profehoracio_alumno_actual')||'null'); if(_g && _g.id && _g.nombre) AlumnoActual=_g; }catch(e){}
function reportar(peso){ if(AlumnoActual && typeof window.reportarProgresoPractica==='function'){ try{ window.reportarProgresoPractica(AlumnoActual.id, RECURSO, 1, 0, peso); }catch(e){} } }
function iniciarHeartbeatTiempo(){
  if(typeof window.iniciarHeartbeatMathverse==='function') window.iniciarHeartbeatMathverse(function(){ return AlumnoActual && AlumnoActual.id; }, RECURSO);
  else setTimeout(iniciarHeartbeatTiempo,100);
}
if(AlumnoActual) iniciarHeartbeatTiempo();
const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
function pantalla(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active'); document.body.classList.toggle('en-juego', id==='screen-juego'); window.scrollTo(0,0);
}
const PESO={cubitos:4,pintor:6,llenado:6,envases:5};
let MOD=null;
const pick=a=>a[Math.floor(Math.random()*a.length)];
function barajar(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function abrir(m){ MOD=m; pantalla('screen-juego'); ({cubitos:iniCubitos,pintor:iniPintor,llenado:iniLlenado,envases:iniEnvases})[m](); }
window.abrir=abrir;
function msg(t,tipo){ const m=$('msg'); if(!m) return; m.textContent=t; m.className='msg'+(tipo?' '+tipo:''); }
function shake(el){ if(!el) return; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
function entrada(id,len,pre,post){ return `<div class="entrada">${pre?`<span class="eti">${pre}</span>`:''}<input id="${id}" class="caja" type="text" inputmode="numeric" autocomplete="off" maxlength="${len||6}" aria-label="Respuesta">${post?`<span class="eti">${post}</span>`:''}</div>`; }
function leer(id){ const el=$(id); if(!el) return null; const v=el.value.trim(); if(v===''||!/^\d+$/.test(v)) return null; return Number(v); }
function soloDigitos(){ document.querySelectorAll('#mod input.caja').forEach(i=>{ i.addEventListener('input',()=>{ i.value=i.value.replace(/[^0-9]/g,''); }); }); }
function btn(id,cls,ico,txt,enter){ return `<button class="btn-orbita ${cls}" id="${id}" type="button"${enter?' data-enter="1"':''}><span class="bola">${ico}</span>${txt}</button>`; }
const I_OK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const I_SIG='<svg viewBox="0 0 24 24"><path d="M5 12h14M13 5l7 7-7 7"/></svg>';
function bSiguiente(fn){ const a=$('acc'); a.innerHTML=btn('bNext','v-verde ancho',I_SIG,'Siguiente',true); $('bNext').addEventListener('click',fn); }
function exito(txt){ msg(txt,'bien'); try{ mvExito(); }catch(e){} reportar(PESO[MOD]||4); }
function fallo(txt,el){ msg(txt,'mal'); try{ mvFallo(); }catch(e){} shake(el); }
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing||e.repeat) return;
  const b=[...document.querySelectorAll('#screen-juego [data-enter]')].find(x=>x.offsetParent!==null&&!x.disabled);
  if(b){ e.preventDefault(); b.click(); }
});
function esqueleto(){
  $('mod').innerHTML='<div class="chips"><span class="chip" id="chInfo"></span></div><p class="enun" id="enun"></p><div id="stage"></div><div class="ctrl" id="ctrl"></div><div class="msg" id="msg"></div><div class="fila" id="acc"></div>';
}
const SVGNS='http://www.w3.org/2000/svg';
function ajustarVB(svg,g,pad){ const b=g.getBBox(); pad=pad||8; svg.setAttribute('viewBox',`${b.x-pad} ${b.y-pad} ${b.width+2*pad} ${b.height+2*pad}`); }

/* =====================================================================
   1. CUBITOS — volumen
   ===================================================================== */
const CAPAS=['#38bdf8','#a78bfa','#f472b6','#34d399','#fb923c','#22d3ee'];
function tono(hex,f){ const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  if(f<1){ r*=f; g*=f; b*=f; } else { const k=f-1; r+=(255-r)*k; g+=(255-g)*k; b+=(255-b)*k; }
  return `rgb(${r|0},${g|0},${b|0})`; }
const DX=0.866, DY=0.5, SC=22;
function cuboSVG(x,y,z,sepPx,extra){
  const px=(x-y)*DX*SC, py=(x+y)*DY*SC-(z+1)*SC-(sepPx||0), dx=DX*SC, dy=DY*SC, s=SC, c=CAPAS[z%CAPAS.length];
  const st='stroke="rgba(15,23,42,.6)" stroke-width="1.2" stroke-linejoin="round"';
  return `<g ${extra||''}><polygon points="${px},${py} ${px+dx},${py+dy} ${px},${py+2*dy} ${px-dx},${py+dy}" fill="${tono(c,1.35)}" ${st}/>`+
         `<polygon points="${px-dx},${py+dy} ${px},${py+2*dy} ${px},${py+2*dy+s} ${px-dx},${py+dy+s}" fill="${tono(c,.85)}" ${st}/>`+
         `<polygon points="${px},${py+2*dy} ${px+dx},${py+dy} ${px+dx},${py+dy+s} ${px},${py+2*dy+s}" fill="${tono(c,.62)}" ${st}/></g>`;
}
function suelo(x,y,extra){
  const tx=(x-y)*DX*SC, ty=(x+y)*DY*SC, dx=DX*SC, dy=DY*SC;
  return `<polygon ${extra||''} points="${tx},${ty} ${tx+dx},${ty+dy} ${tx},${ty+2*dy} ${tx-dx},${ty+dy}" fill="rgba(255,255,255,.08)" stroke="rgba(196,181,253,.55)" stroke-width="1"/>`;
}
function ordenar(celdas){ return celdas.slice().sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2])||a[2]-b[2]); }

/* --- Cuenta los cubitos (capas) --- */
function iniCubitos(){ esqueleto(); cubNuevo(); }
function cubNuevo(){ (Math.random()<.5?cubCuenta:cubConstruye)(); }
function cubCuenta(){
  const L=rnd(2,5), W=rnd(2,4), H=rnd(2,4);
  const C={L,W,H,sep:false,paso:0}; window.__q={k:'cuenta',L,W,H};
  $('chInfo').textContent='Cuenta los cubitos'; $('enun').textContent='Esta caja está armada con cubitos de 1 cm³. Descubre cuántos cubitos tiene en total.';
  $('stage').innerHTML='<svg id="svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Caja armada con cubitos"><g id="mundo"></g></svg>';
  const celdas=[]; for(let z=0;z<H;z++)for(let x=0;x<L;x++)for(let y=0;y<W;y++) celdas.push([x,y,z]);
  function dibujar(){
    const sep=C.sep?16:0;
    $('mundo').innerHTML=ordenar(celdas).map(c=>cuboSVG(c[0],c[1],c[2],c[2]*sep)).join('');
    ajustarVB($('svg'),$('mundo'),10);
  }
  dibujar();
  const pasos=[{q:'¿Cuántos cubitos hay en la capa de abajo?',r:L*W},{q:'¿Cuántas capas hay?',r:H},{q:'¿Cuántos cubitos hay en total?',r:L*W*H}];
  function pintarPaso(){
    const p=pasos[C.paso];
    $('ctrl').innerHTML=`<div class="preg">${p.q}</div>${entrada('resp',4)}`+'';
    $('acc').innerHTML=btn('bSep','v-azul sutil','<svg viewBox="0 0 24 24"><path d="M4 8l8-4 8 4-8 4zM4 13l8 4 8-4M4 17l8 4 8-4"/></svg>',C.sep?'Juntar capas':'Separar capas')+btn('bOk','v-verde',I_OK,'Comprobar',true);
    $('bSep').addEventListener('click',()=>{ C.sep=!C.sep; dibujar(); pintarPaso(); });
    $('bOk').addEventListener('click',comprobar); soloDigitos(); $('resp').focus();
  }
  function comprobar(){
    const v=leer('resp'), p=pasos[C.paso];
    if(v===null){ msg('Escribe un número.','mal'); return; }
    if(v!==p.r){ fallo(C.paso===2?'Todavía no. Piensa: ¿cuántos cubitos hay en cada capa y cuántas capas son?':'Todavía no. Prueba separando las capas y cuenta con calma.',$('resp')); $('resp').value=''; $('resp').focus(); return; }
    if(C.paso<2){ C.paso++; msg(''); pintarPaso(); return; }
    $('ctrl').innerHTML=`<div class="preg">${L} × ${W} = ${L*W} cubitos por capa, y son ${H} capas: ${L*W} × ${H} = ${L*W*H}</div>`;
    exito(`🎉 ¡Correcto! El volumen es ${L*W*H} cm³ (largo × ancho × alto = ${L} × ${W} × ${H}).`);
    bSiguiente(cubNuevo);
  }
  msg(''); pintarPaso();
}

/* --- Construye una caja --- */
function cubConstruye(){
  const N=pick([12,16,18,20,24,27,30,32,36]);
  const B={N,h:Array.from({length:6},()=>Array(6).fill(0)),tool:'add',fin:false}; window.__q={k:'construye',N,B};
  $('chInfo').textContent='Cubitos 0 / '+N;
  $('enun').textContent=`Construye una caja (un prisma completo) con exactamente ${N} cubitos.`;
  $('stage').innerHTML='<svg id="svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Zona de construcción"><g id="mundo"></g></svg>';
  $('ctrl').innerHTML=`<div class="herr">${btn('tAdd','v-verde act','<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>','Agregar')}${btn('tQuit','v-rosa','<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>','Quitar')}${btn('tVac','v-azul sutil','<svg viewBox="0 0 24 24"><path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/></svg>','Vaciar')}</div>`;
  $('acc').innerHTML=btn('bOk','v-verde',I_OK,'Comprobar',true);
  function total(){ let t=0; B.h.forEach(f=>f.forEach(v=>t+=v)); return t; }
  function dibujar(first){
    const cel=[]; for(let x=0;x<6;x++)for(let y=0;y<6;y++)for(let z=0;z<B.h[x][y];z++) cel.push([x,y,z]);
    let s='';
    for(let x=0;x<6;x++)for(let y=0;y<6;y++) if(B.h[x][y]===0) s+=suelo(x,y,`data-x="${x}" data-y="${y}" class="cara"`);
    // el suelo de las pilas se ve debajo
    s=''; for(let x=0;x<6;x++)for(let y=0;y<6;y++) s+=suelo(x,y,`data-x="${x}" data-y="${y}" class="cara"`);
    s+=ordenar(cel).map(c=>cuboSVG(c[0],c[1],c[2],0,`data-x="${c[0]}" data-y="${c[1]}" class="cara"`)).join('');
    $('mundo').innerHTML=s;
    if(first){ // encuadre fijo: suelo completo + altura máxima
      const g=$('mundo'); const tmp=document.createElementNS(SVGNS,'g'); tmp.innerHTML=cuboSVG(0,0,5,0)+suelo(5,5)+suelo(0,5)+suelo(5,0); $('svg').appendChild(tmp);
      const b1=g.getBBox(), b2=tmp.getBBox(); tmp.remove();
      const x0=Math.min(b1.x,b2.x), y0=Math.min(b1.y,b2.y), x1=Math.max(b1.x+b1.width,b2.x+b2.width), y1=Math.max(b1.y+b1.height,b2.y+b2.height);
      $('svg').setAttribute('viewBox',`${x0-6} ${y0-4} ${x1-x0+12} ${y1-y0+8}`);
    }
    $('chInfo').textContent=`Cubitos ${total()} / ${N}`;
  }
  dibujar(true);
  $('svg').addEventListener('click',e=>{
    if(B.fin) return; const t=e.target.closest('[data-x]'); if(!t) return;
    const x=+t.dataset.x, y=+t.dataset.y;
    if(B.tool==='add'){ if(B.h[x][y]>=6){ msg('Esa pila ya llegó al máximo (6).','mal'); return; } B.h[x][y]++; }
    else { if(B.h[x][y]>0) B.h[x][y]--; }
    msg(''); dibujar(false);
  });
  const setTool=t=>{ B.tool=t; $('tAdd').classList.toggle('act',t==='add'); $('tQuit').classList.toggle('act',t==='quit'); };
  $('tAdd').addEventListener('click',()=>setTool('add')); $('tQuit').addEventListener('click',()=>setTool('quit'));
  $('tVac').addEventListener('click',()=>{ if(B.fin) return; B.h.forEach(f=>f.fill(0)); msg(''); dibujar(false); });
  $('bOk').addEventListener('click',()=>{
    if(B.fin) return;
    const t=total();
    if(t===0){ msg('Toca el suelo para poner cubitos.','mal'); return; }
    let x0=9,x1=-1,y0=9,y1=-1; for(let x=0;x<6;x++)for(let y=0;y<6;y++) if(B.h[x][y]>0){ x0=Math.min(x0,x); x1=Math.max(x1,x); y0=Math.min(y0,y); y1=Math.max(y1,y); }
    const hh=B.h[x0][y0]; let caja=true;
    for(let x=0;x<6&&caja;x++)for(let y=0;y<6;y++){ const dentro=x>=x0&&x<=x1&&y>=y0&&y<=y1; if(dentro? B.h[x][y]!==hh : B.h[x][y]!==0){ caja=false; break; } }
    if(!caja){ fallo('Eso todavía no es una caja completa: no deben quedar huecos y todas las pilas deben tener la misma altura.',$('svg')); return; }
    const a=x1-x0+1, b=y1-y0+1;
    if(t!==N){ fallo(`Es una caja de ${a} × ${b} × ${hh}, pero tiene ${t} cubitos y se piden ${N}.`,$('svg')); return; }
    B.fin=true; $('tAdd').disabled=$('tQuit').disabled=$('tVac').disabled=true;
    exito(`🎉 ¡Una caja de ${a} × ${b} × ${hh}! ${a} × ${b} × ${hh} = ${N} cubitos, o sea ${N} cm³.`);
    bSiguiente(cubNuevo);
  });
  msg('');
}

/* =====================================================================
   2. PINTOR — área de las caras de una red
   ===================================================================== */
const PAL=['#f472b6','#34d399','#a78bfa','#fb923c','#38bdf8','#2dd4bf'];
function pinRed(tipo){
  const F=[]; let ancho,alto,enun,L,W,H,s;
  if(tipo==='cubo'||tipo==='prisma'){
    if(tipo==='cubo'){ L=W=H=rnd(2,5); } else { do{ L=rnd(3,6); W=rnd(2,5); H=rnd(2,5); }while(L===W&&W===H); }
    const r=(id,x,y,w,h,g)=>F.push({id,t:'r',x,y,w,h,area:w*h,g});
    r('b',H,H,L,W,'A'); r('t',H,2*H+W,L,W,'A');
    r('f1',H,0,L,H,'B'); r('f2',H,H+W,L,H,'B');
    r('l',0,H,H,W,'C'); r('rr',H+L,H,H,W,'C');
    ancho=2*H+L; alto=2*H+2*W;
    enun=tipo==='cubo'?`Esta es la red de un cubo de ${L} × ${L} × ${L}. Cada cuadradito es una unidad cuadrada (u²).`:`Esta es la red de un prisma de ${L} × ${W} × ${H} (largo × ancho × alto). Cada cuadradito es una unidad cuadrada (u²).`;
  } else {
    L=pick([2,4,6]); s=rnd(3,6);
    F.push({id:'b',t:'r',x:s,y:s,w:L,h:L,area:L*L,g:'A'});
    const A=L*s/2;
    F.push({id:'t1',t:'t',p:[[s,s],[s+L,s],[s+L/2,0]],area:A,g:'B',cx:s+L/2,cy:s*0.35});
    F.push({id:'t2',t:'t',p:[[s,s+L],[s+L,s+L],[s+L/2,2*s+L]],area:A,g:'B',cx:s+L/2,cy:s+L+s*0.65});
    F.push({id:'t3',t:'t',p:[[s,s],[s,s+L],[0,s+L/2]],area:A,g:'B',cx:s*0.35,cy:s+L/2});
    F.push({id:'t4',t:'t',p:[[s+L,s],[s+L,s+L],[2*s+L,s+L/2]],area:A,g:'B',cx:s+L+s*0.65,cy:s+L/2});
    ancho=L+2*s; alto=L+2*s;
    enun=`Esta es la red de una pirámide: la base es un cuadrado de lado ${L} y cada cara triangular tiene base ${L} y altura ${s}. Cada cuadradito es 1 u².`;
  }
  return {tipo,F,ancho,alto,enun};
}
function iniPintor(){ esqueleto(); pinNuevo(); }
function pinNuevo(){
  const tipo=pick(['cubo','prisma','prisma','piramide']);
  const R=pinRed(tipo); const grupos=[...new Set(R.F.map(f=>f.g))];
  const P={R,grupos,pintados:{},sel:null,fase:'caras'}; window.__q={k:'pintor',P};
  P.colorDe={}; grupos.forEach((g,i)=>P.colorDe[g]=PAL[i%PAL.length]);
  $('chInfo').textContent='Pintor de caras'; $('enun').textContent=R.enun;
  const m=1.2;
  let sv='';
  R.F.forEach(f=>{
    if(f.t==='r'){
      let grid=''; for(let i=1;i<f.w;i++) grid+=`M${f.x+i} ${f.y}V${f.y+f.h}`; for(let j=1;j<f.h;j++) grid+=`M${f.x} ${f.y+j}H${f.x+f.w}`;
      sv+=`<g class="cara" data-id="${f.id}"><rect id="fc-${f.id}" x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" fill="#4c1d95" stroke="#fff" stroke-width=".09" stroke-linejoin="round"/><path d="${grid}" stroke="rgba(255,255,255,.35)" stroke-width=".05" fill="none"/><text id="tx-${f.id}" x="${f.x+f.w/2}" y="${f.y+f.h/2+.4}" font-size="1.2" fill="#fff" text-anchor="middle" stroke-width=".18"></text></g>`;
    } else {
      sv+=`<g class="cara" data-id="${f.id}"><polygon id="fc-${f.id}" points="${f.p.map(q=>q.join(',')).join(' ')}" fill="#4c1d95" stroke="#fff" stroke-width=".09" stroke-linejoin="round"/><text id="tx-${f.id}" x="${f.cx}" y="${f.cy+.4}" font-size="1.2" fill="#fff" text-anchor="middle" stroke-width=".18"></text></g>`;
    }
  });
  $('stage').innerHTML=`<svg id="svg" viewBox="${-m} ${-m} ${R.ancho+2*m} ${R.alto+2*m}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Red del cuerpo">${sv}</svg>`;
  $('svg').addEventListener('click',e=>{
    if(P.fase!=='caras') return; const g=e.target.closest('[data-id]'); if(!g) return;
    const f=R.F.find(x=>x.id===g.dataset.id); if(P.pintados[f.g]) return;
    P.sel=f; document.querySelectorAll('#svg .cara').forEach(c=>c.classList.toggle('sel',c===g));
    msg(''); const r=$('resp'); if(r){ r.disabled=false; r.focus(); }
  });
  function ctrlCaras(){
    $('ctrl').innerHTML=`<div class="preg">Toca una cara de la red y cuenta: ¿cuántos cuadraditos (u²) tiene?</div>${entrada('resp',3,'','u²')}`;
    $('acc').innerHTML=btn('bOk','v-verde',I_OK,'Comprobar',true); $('bOk').addEventListener('click',comprobar); soloDigitos();
  }
  function ctrlTotal(){
    const suma=R.F.reduce((a,f)=>a+f.area,0);
    $('ctrl').innerHTML=`<div class="preg">¡Todas las caras pintadas! Ahora suma todas: ¿cuál es el área total?</div>${entrada('resp',4,'Área total =','u²')}`;
    $('acc').innerHTML=btn('bOk','v-verde',I_OK,'Comprobar',true); $('bOk').addEventListener('click',comprobar); soloDigitos(); $('resp').focus();
    P.suma=suma;
  }
  function comprobar(){
    const v=leer('resp');
    if(P.fase==='caras'){
      if(!P.sel){ msg('Primero toca una cara de la red.','mal'); return; }
      if(v===null){ msg('Escribe un número.','mal'); return; }
      if(v!==P.sel.area){ fallo(P.sel.t==='t'?'Todavía no. Un triángulo es la mitad de un rectángulo con su misma base y altura.':'Todavía no. Cuenta los cuadraditos fila por fila, o multiplica filas por columnas.',$('resp')); $('resp').value=''; $('resp').focus(); return; }
      const g=P.sel.g; P.pintados[g]=true; const iguales=R.F.filter(f=>f.g===g);
      iguales.forEach(f=>{ $('fc-'+f.id).setAttribute('fill',P.colorDe[g]); $('tx-'+f.id).textContent=f.area; });
      document.querySelectorAll('#svg .cara').forEach(c=>c.classList.remove('sel'));
      P.sel=null; $('resp').value='';
      sfxOkSuave();
      if(grupos.every(x=>P.pintados[x])){ P.fase='total'; msg(iguales.length>1?'¡Correcto! Había otras caras iguales y también se pintaron.':'¡Correcto!','bien'); ctrlTotal(); }
      else { msg(iguales.length>1?'¡Correcto! Hay otras caras iguales y se pintaron también. Sigue con otra.':'¡Correcto! Sigue con otra cara.','bien'); }
      return;
    }
    if(v===null){ msg('Escribe un número.','mal'); return; }
    if(v!==P.suma){ fallo('Todavía no. Suma el área de las 6 caras (si hay iguales, cuéntalas todas).'.replace('6 caras',R.F.length+' caras'),$('resp')); $('resp').value=''; $('resp').focus(); return; }
    $('ctrl').innerHTML=`<div class="preg">${R.F.map(f=>f.area).join(' + ')} = ${P.suma} u²</div>`;
    P.fase='fin'; exito(`🎉 ¡Correcto! El área total es ${P.suma} u².`); bSiguiente(pinNuevo);
  }
  function sfxOkSuave(){}
  ctrlCaras(); msg('');
}

/* =====================================================================
   3. LLENADO — cilindro, cono, pirámide y esfera
   ===================================================================== */
const FRAC={'1/4':[1,4],'1/3':[1,3],'1/2':[1,2],'2/3':[2,3],'3/4':[3,4]};
function fr(txt){ const [a,b]=txt.split('/'); return `<span class="fr"><b>${a}</b><b>${b}</b></span>`; }
function iniLlenado(){ esqueleto(); llNuevo(); }
function llNuevo(){
  const tipo=pick(['cono','piramide','esfera']);
  let r,h,a,cont,cuerpo,fReal,cilV,cuerV,unidadCuerpo,pi,enun,sub;
  if(tipo==='cono'){ r=pick([2,3,4,5,6]); h=pick([6,9,12]); fReal='1/3'; pi=true; cilV=r*r*h; cuerV=r*r*h/3; enun=`Un cono y un cilindro con el mismo radio (${r} cm) y la misma altura (${h} cm). Llenamos el cono con agua y la vertemos en el cilindro.`; cont='cilindro'; cuerpo='cono'; }
  else if(tipo==='piramide'){ a=pick([3,4,5,6,8]); h=pick([6,9,12]); fReal='1/3'; pi=false; cilV=a*a*h; cuerV=a*a*h/3; enun=`Una pirámide y un prisma con la misma base cuadrada (lado ${a} cm) y la misma altura (${h} cm). Llenamos la pirámide con agua y la vertemos en el prisma.`; cont='prisma'; cuerpo='pirámide'; }
  else { r=pick([3,6]); h=2*r; fReal='2/3'; pi=true; cilV=r*r*h; cuerV=4*r*r*r/3; enun=`Una esfera de radio ${r} cm y un cilindro que la ajusta justo (radio ${r} cm y altura ${h} cm). Llenamos la esfera con agua y la vertemos en el cilindro.`; cont='cilindro'; cuerpo='esfera'; }
  const Q={tipo,r,h,a,fReal,cilV,cuerV,pi,cont,cuerpo,est:null,verto:false,paso:0}; window.__q={k:'llenado',Q};

  else { der+=`<path d="M${cx2-R} ${top}V${base}H${cx2+R}V${top}" ${trazo}/><path d="M${cx2-R} ${top}L${cx2-R+22} ${top-16}H${cx2+R+22}L${cx2+R} ${top}M${cx2+R} ${base}L${cx2+R+22} ${base-16}V${top-16}" ${trazo}/>`; }
  // cuerpo (izquierda)
  let forma='';
  if(tipo==='cono') forma=`M${cx1-R} ${top}H${cx1+R}L${cx1} ${base}Z`;
  else if(tipo==='piramide') forma=`M${cx1-R} ${top}H${cx1+R}L${cx1} ${base}Z`;
  izq+=`<defs><clipPath id="cpCuerpo"><rect id="rcCuerpo" x="0" y="${top-30}" width="400" height="${HC+60}"/></clipPath></defs>`;
  if(tipo==='esfera'){ izq+=`<g clip-path="url(#cpCuerpo)"><circle cx="${cx1}" cy="${base-R}" r="${R}" fill="#38bdf8" opacity=".9"/></g><circle cx="${cx1}" cy="${base-R}" r="${R}" ${trazo}/><ellipse cx="${cx1}" cy="${base-R}" rx="${R}" ry="14" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.6" stroke-dasharray="5 4"/>`; }
  else { izq+=`<g clip-path="url(#cpCuerpo)"><path d="${forma}" fill="#38bdf8" opacity=".9"/></g><path d="${forma}" ${trazo}/>`+(tipo==='cono'?ell(cx1,top,R,14,trazo):`<path d="M${cx1-R} ${top}L${cx1-R+22} ${top-16}H${cx1+R+22}L${cx1+R} ${top}" ${trazo}/>`); }

  else { med+=rotulo(cx1,top-22,`r = ${r} cm`)+rotulo(cx2,top-22,`r = ${r} cm`)+rotulo(cx2+R+34,(top+base)/2,`${h} cm`); med+=`<path d="M${cx2+R+14} ${top} V${base}" stroke="#fff" stroke-width="1.4" stroke-dasharray="4 3"/>`; }
  med+=`<text x="${cx1}" y="${base+30}" font-size="15" text-anchor="middle" fill="#bae6fd" stroke-width="3.5">${cuerpo}</text><text x="${cx2}" y="${base+30}" font-size="15" text-anchor="middle" fill="#bae6fd" stroke-width="3.5">${cont}</text>`;
  $('stage').innerHTML=`<svg id="svg" viewBox="0 0 400 262" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Cuerpo y recipiente">${der}${izq}${med}</svg>`;
  /* --- animación del vertido --- */
  const fN=FRAC[fReal][0]/FRAC[fReal][1];
  function nivelCuerpo(t){ // altura del agua que queda dentro del cuerpo (px) para volumen restante (1-t)
    const resto=1-t;
    if(tipo==='esfera'){ let lo=0,hi=2*R; for(let i=0;i<30;i++){ const x=(lo+hi)/2; const v=x*x*(3*R-x)/(4*R*R*R); if(v<resto) lo=x; else hi=x; } return (lo+hi)/2; }
    return HC*Math.cbrt(resto);
  }
  function pintarT(t){
    const lv=nivelCuerpo(t); $('rcCuerpo').setAttribute('y',base-lv-0.5); $('rcCuerpo').setAttribute('height',lv+60);
    const hAgua=HC*fN*t; $('aguaCont').setAttribute('y',base-hAgua); $('aguaCont').setAttribute('height',hAgua);
  }
  pintarT(0);
  /* --- interfaz por pasos --- */
  function pasoEstimar(){
    $('ctrl').innerHTML=`<div class="preg">Antes de verter, estima: ¿qué parte del ${cont} se va a llenar?</div><div class="opts" id="opts">${Object.keys(FRAC).map(k=>`<button class="opt" data-f="${k}" type="button">${fr(k)}</button>`).join('')}</div>`;
    $('acc').innerHTML=btn('bVerter','v-azul',`<svg viewBox="0 0 24 24"><path d="M12 4C9 9 6 12 6 15a6 6 0 0 0 12 0c0-3-3-6-6-11z"/></svg>`,'Verter el agua',true);
    $('bVerter').disabled=true;
    document.querySelectorAll('#opts .opt').forEach(o=>o.addEventListener('click',()=>{ Q.est=o.dataset.f; document.querySelectorAll('#opts .opt').forEach(x=>x.classList.toggle('sel',x===o)); $('bVerter').disabled=false; msg(''); }));
    $('bVerter').addEventListener('click',verter);
  }
  function verter(){
    if(!Q.est) return;
    document.querySelectorAll('#opts .opt').forEach(x=>x.disabled=true); $('bVerter').disabled=true;
    const t0=performance.now(), dur=2400;
    (function paso(now){ const t=Math.min(1,(now-t0)/dur); pintarT(t); if(t<1) requestAnimationFrame(paso); else terminado(); })(t0);
  }
  function terminado(){
    Q.verto=true;
    const igual=Q.est===fReal;
    msg(igual?`¡Tu estimación fue exacta! El ${cont} se llenó ${fReal}.`:`Estimaste ${Q.est}, pero el ${cont} se llenó ${fReal}.`,igual?'bien':'');
    Q.paso=1; pasoCalc();
  }
  function pasoCalc(){
    const volTxt=pi?'π cm³':'cm³';
    if(Q.paso===1){
      const pre=cont==='cilindro'?`Volumen del cilindro = π · r² · h. Escribe cuántos π:` : `Volumen del prisma = (lado × lado) × altura:`;
      $('ctrl').innerHTML=`<div class="preg">${pre}</div>${entrada('resp',5,pi?'V =':'V =',volTxt)}`;
    } else {
      $('ctrl').innerHTML=`<div class="preg">Ya sabes qué parte del ${cont} ocupa ${cuerpo==='esfera'?'la':'el'} ${cuerpo}. ¿Cuál es su volumen?</div>${entrada('resp',5,'V =',volTxt)}`;
    }
    $('acc').innerHTML=btn('bOk','v-verde',I_OK,'Comprobar',true); $('bOk').addEventListener('click',comprobar); soloDigitos(); $('resp').focus();
  }
  function comprobar(){
    const v=leer('resp'); if(v===null){ msg('Escribe un número.','mal'); return; }
    const meta=Q.paso===1?cilV:cuerV;
    if(v!==meta){ fallo(Q.paso===1?(cont==='cilindro'?'Todavía no. Calcula r × r × h (el resultado va acompañado de π).':'Todavía no. Calcula lado × lado × altura.'):`Todavía no. Es ${fReal} del volumen del ${cont}: ${cilV} × ${fReal}.`,$('resp')); $('resp').value=''; $('resp').focus(); return; }
    if(Q.paso===1){ Q.paso=2; msg(`¡Correcto! Ahora el ${cuerpo}.`,'bien'); pasoCalc(); return; }
    const f=tipo==='esfera'?'V = ⁴⁄₃ · π · r³':(tipo==='cono'?'V = ⅓ · π · r² · h':'V = ⅓ · lado² · h');
    $('ctrl').innerHTML=`<div class="preg">${f}</div>`;
    exito(`🎉 ¡Correcto! El volumen ${cuerpo==='esfera'?'de la esfera':(cuerpo==='cono'?'del cono':'de la pirámide')} es ${cuerV}${pi?' π':''} cm³.`); bSiguiente(llNuevo);
  }
  msg(''); pasoEstimar();
}

function rot(x,y,t,cl,fs){ return `<text x="${x}" y="${y}" font-size="${fs||13}" text-anchor="middle" fill="${cl||'#fff'}" stroke-width="3.2">${t}</text>`; }
const TR='stroke="rgba(15,5,40,.55)" stroke-width="1.6" stroke-linejoin="round"';
function figCaja(L,W,H,u){
  const k=70/Math.max(L,W,H), dx=DX*k, dy=DY*k;
  const P=(x,y,z)=>[(x-y)*dx,(x+y)*dy-z*k], pt=a=>a.map(v=>v.map(n=>n.toFixed(1)).join(',')).join(' ');
  const top=[P(0,0,H),P(L,0,H),P(L,W,H),P(0,W,H)], izq=[P(0,W,H),P(L,W,H),P(L,W,0),P(0,W,0)], der=[P(L,0,H),P(L,W,H),P(L,W,0),P(L,0,0)];
  const a=P(L/2,W,0), b=P(L,W/2,0), c=P(0,W,H/2);
  const g=`<g><polygon points="${pt(top)}" fill="#a78bfa" ${TR}/><polygon points="${pt(izq)}" fill="#7c3aed" ${TR}/><polygon points="${pt(der)}" fill="#5b21b6" ${TR}/></g>`+
    rot(a[0]-6,a[1]+16,`${L} ${u}`,'#fff')+rot(b[0]+24,b[1]+14,`${W} ${u}`,'#fff')+rot(c[0]-26,c[1]+4,`${H} ${u}`,'#fff');
  return {g,w:240,h:170};
}
function figCilindro(r,h,u){
  const R=44, Hh=Math.min(110,Math.max(60,h/r*R*0.9));
  const g=`<path d="M${-R} 0V${Hh}A${R} 12 0 0 0 ${R} ${Hh}V0" fill="#fb7185" ${TR}/><ellipse cx="0" cy="0" rx="${R}" ry="12" fill="#fecdd3" ${TR}/>`+
   `<path d="M0 0H${R}" stroke="#fff" stroke-width="2"/>`+rot(R/2,-6,`r = ${r} ${u}`)+`<path d="M${R+14} 0V${Hh}" stroke="#fff" stroke-width="1.6" stroke-dasharray="4 3"/>`+rot(R+42,Hh/2+4,`${h} ${u}`);
  return {g:`<g transform="translate(0 ${20})">${g}</g>`,w:240,h:Hh+50};
}
function figCono(r,h,u){
  const R=44, Hh=Math.min(120,Math.max(70,h/r*R*0.9));
  const g=`<path d="M${-R} ${Hh}L0 0L${R} ${Hh}A${R} 12 0 0 1 ${-R} ${Hh}Z" fill="#fb923c" ${TR}/><ellipse cx="0" cy="${Hh}" rx="${R}" ry="12" fill="#fdba74" ${TR}/>`+
   `<path d="M0 ${Hh}H${R}" stroke="#fff" stroke-width="2"/>`+rot(R/2,Hh+30,`r = ${r} ${u}`)+`<path d="M0 0V${Hh}" stroke="#fff" stroke-width="1.6" stroke-dasharray="4 3"/>`+rot(26,Hh/2,`${h} ${u}`);
  return {g:`<g transform="translate(0 14)">${g}</g>`,w:240,h:Hh+60};
}
function figEsfera(r,u){
  const R=52; const g=`<defs><radialGradient id="gE" cx=".35" cy=".3"><stop offset="0" stop-color="#e0f2fe"/><stop offset=".6" stop-color="#38bdf8"/><stop offset="1" stop-color="#0369a1"/></radialGradient></defs><circle cx="0" cy="0" r="${R}" fill="url(#gE)" ${TR}/><ellipse cx="0" cy="0" rx="${R}" ry="14" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5" stroke-dasharray="5 4"/><path d="M0 0H${R}" stroke="#fff" stroke-width="2"/><circle cx="0" cy="0" r="2.5" fill="#fff"/>`+rot(R/2+4,-8,`r = ${r} ${u}`);
  return {g:`<g transform="translate(0 ${R+6})">${g}</g>`,w:240,h:2*R+14};
}
function figPiramide(a,h,u,lab){ // lab: 'h' altura o 's' altura de la cara
  const R=50, Hh=84; const dx=R, dy=R*.42;
  const A=[-dx,0],B=[0,dy],C=[dx,0],D=[0,-dy], T=[0,-Hh+0];
  const pts=a=>a.join(','); const ap=[0,-Hh];
  const g=`<polygon points="${pts(A)} ${pts(B)} ${pts(C)} ${pts(D)}" fill="#6d28d9" ${TR}/><polygon points="${pts(A)} ${pts(B)} ${pts(ap)}" fill="#a78bfa" ${TR}/><polygon points="${pts(B)} ${pts(C)} ${pts(ap)}" fill="#7c3aed" ${TR}/>`+
    rot(-R/2-18,dy+26,`lado ${a} ${u}`)+(lab==='h'?`<path d="M0 ${-Hh}V0" stroke="#fff" stroke-width="1.6" stroke-dasharray="4 3"/>`+rot(30,-Hh/2+4,`${h} ${u}`):`<path d="M0 ${-Hh}L${-R/2} ${dy/2}" stroke="#fff" stroke-width="1.6" stroke-dasharray="4 3"/>`+rot(-R-6,-Hh/2-4,`${h} ${u}`));
  return {g:`<g transform="translate(0 ${Hh+14})">${g}</g>`,w:240,h:Hh+dy+46};
}
function figCarpa(b,ht,L,u){
  const k=64/Math.max(b,ht,L), bx=b*k*.9, hy=ht*k, ly=L*k*.6;
  const g=`<polygon points="${-bx/2},${hy} 0,0 ${bx/2},${hy}" fill="#2dd4bf" ${TR}/><polygon points="0,0 ${ly*.9},${-ly*.5} ${bx/2+ly*.9},${hy-ly*.5} ${bx/2},${hy}" fill="#0f766e" ${TR}/>`+
    `<polygon points="0,0 ${ly*.9},${-ly*.5} ${ly*.9-bx/2},${hy-ly*.5} ${-bx/2},${hy}" fill="#14b8a6" ${TR}/>`.replace(/^/,'')+
    rot(0,hy+16,`base ${b} ${u}`)+rot(-bx/2-30,hy/2+4,`altura ${ht} ${u}`)+rot(bx/2+ly*.45+34,hy/2-ly*.25,`largo ${L} ${u}`);
  return {g:`<g transform="translate(-10 ${ly*.5+16})">${g}</g>`,w:260,h:hy+ly*.5+40};
}
function svgFig(f){ return `<svg id="svg" viewBox="${-f.w/2} 0 ${f.w} ${f.h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Figura del problema"><g id="fg">${f.g}</g></svg>`; }
function encuadrar(){ const sv=$('svg'), g=sv&&sv.querySelector('#fg'); if(g) ajustarVB(sv,g,12); }

 // cilindro (lata)
 ()=>{ const r=rnd(2,5), h=rnd(4,12); return {fig:figCilindro(r,h,'cm'),texto:`Una lata de conservas mide ${r} cm de radio y ${h} cm de alto.`,preg:'¿Cuánto volumen tiene? Escribe cuántos π.',unidad:'π cm³',pi:true,r:r*r*h,alt:[[2*r*(h+r),'Eso es el área total. Aquí se pide el volumen.']],exp:`V = π · ${r}² · ${h} = ${r*r*h} π cm³`}; },
 ()=>{ const r=rnd(2,5), h=rnd(4,12); return {fig:figCilindro(r,h,'cm'),texto:`Una lata mide ${r} cm de radio y ${h} cm de alto. La etiqueta cubre solo la pared curva (sin tapas).`,preg:'¿Qué área tiene la etiqueta? Escribe cuántos π.',unidad:'π cm²',pi:true,r:2*r*h,alt:[[2*r*(h+r),'Eso incluye las dos tapas. La etiqueta solo cubre la pared curva.'],[r*r*h,'Eso es el volumen. Aquí se pide un área.']],exp:`A = 2 · π · ${r} · ${h} = ${2*r*h} π cm²`}; },

let colaEnv=[];

function envNuevo(){
  if(!colaEnv.length) colaEnv=barajar(BANCO.map((_,i)=>i));
  const Q=BANCO[colaEnv.pop()](); window.__q={k:'envases',Q};

  $('acc').innerHTML=btn('bOk','v-verde',I_OK,'Comprobar',true); soloDigitos(); $('resp').focus();
  $('bOk').addEventListener('click',()=>{
    const v=leer('resp'); if(v===null){ msg('Escribe un número.','mal'); return; }
    if(v!==Q.r){
      const a=(Q.alt||[]).find(x=>x[0]===v);
      fallo(a?a[1]:(Q.pi?'Todavía no. Escribe solo el número que acompaña a π.':'Todavía no. Revisa la fórmula y los datos.'),$('resp')); $('resp').value=''; $('resp').focus(); return; }
    $('ctrl').innerHTML=`<div class="preg">${Q.exp}</div>`;
    exito('🎉 ¡Correcto!'); bSiguiente(envNuevo);

}
