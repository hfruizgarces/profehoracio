<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Multiplicación Árabe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!--
  Tipografía: Baloo 2 (interfaz y dígitos) + Nunito (texto de apoyo), la misma
  pareja usada en el resto de la colección (Sumas, Restas, Números). El
  alineamiento de los dígitos en la retícula no depende de una fuente
  monoespaciada: cada celda tiene un ancho fijo (--cell-size) definido por
  CSS, así que la cuadrícula queda perfectamente alineada de todas formas.
-->
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   MULTIPLICACIÓN EN RETÍCULA — tokens de diseño
   Misma identidad que Sumas, Restas y Números (fondo violeta oscuro,
   tarjetas de vidrio esmerilado, acento ámbar). La textura de enrejado de
   fondo se conserva como guiño temático a la retícula ("gelosia"), ahora
   muy sutil sobre el degradado oscuro. Cada diagonal sigue teniendo un
   color propio de una paleta categórica reutilizada en toda la app.
   ========================================================================== */
:root{
  --ink:        #f6f3ff;
  --ink-soft:   #c9bdf0;
  --ink-faint:  #8f7fc4;
  --paper:      #1e1147;
  --tile-line:  rgba(255,255,255,.05);
  --surface:    rgba(255,255,255,.07);
  --surface-2:  rgba(255,255,255,.12);
  --border-soft: rgba(255,255,255,.16);

  --bg-1:#1e1147; --bg-2:#3b1785; --bg-3:#5b21b6;

  --brass:      #fbbf24;
  --brass-dark: #f59e0b;
  --brass-bg:   rgba(251,191,36,.14);

  --success:    #34d399;
  --success-bg: rgba(52,211,153,.15);
  --error:      #fb7185;
  --error-bg:   rgba(251,113,133,.15);

  --radius-s: 10px;
  --radius-m: 16px;
  --radius-l: 22px;
  --shadow-card: 0 14px 34px rgba(0,0,0,.4);

  --font-ui:   'Nunito', 'Segoe UI', sans-serif;
  --font-num:  'Baloo 2', 'Segoe UI', sans-serif;

  --cell-size: clamp(48px, 11vw, 70px);
}

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; min-height:100%; }
body{
  font-family: var(--font-ui); color: var(--ink); font-weight:600;
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2)),
    repeating-linear-gradient(45deg,  var(--tile-line) 0 1px, transparent 1px 30px),
    repeating-linear-gradient(-45deg, var(--tile-line) 0 1px, transparent 1px 30px);
  background-attachment: fixed;
  min-height:100vh; display:flex; flex-direction:column; align-items:center;
  -webkit-tap-highlight-color: transparent;
}
button{ font-family:inherit; }
h1,h2,h3{ margin:0; font-family: var(--font-num); }
:focus-visible{ outline:3px solid var(--brass); outline-offset:2px; border-radius:6px; }
@media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

#app{ width:100%; max-width: 980px; padding: 28px 16px 60px; display:flex; flex-direction:column; align-items:center; }

/* ==========================================================================
   Pantalla: configuración inicial
   ========================================================================== */
.hero{ text-align:center; margin-bottom: 26px; }
.hero .eyebrow{
  display:inline-flex; align-items:center; gap:8px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
  font-size:.76rem; color: var(--brass-dark); background: var(--brass-bg); border:1px solid rgba(251,191,36,.35);
  padding:6px 14px; border-radius:999px; margin-bottom:16px;
}
.hero h1{ font-size: clamp(1.9rem,5vw,2.7rem); font-weight:800; line-height:1.1; }
.hero p{ color: var(--ink-soft); font-weight:500; font-size:1.02rem; max-width:520px; margin:10px auto 0; }

/* Pantalla de niveles — misma paleta e idea que el resto de la colección */
.level-grid{
  display:grid; grid-template-columns:repeat(2, 1fr); gap:clamp(10px, 2.5vw, 16px);
  width:100%; max-width:520px;
}
@media (max-width:480px){ .level-grid{ grid-template-columns:1fr; } }
.level-btn{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  padding:clamp(16px,4vw,22px) 10px; border-radius:var(--radius-m); border:none;
  color:#fff; cursor:pointer; font-family:var(--font-num); font-weight:700;
  font-size:clamp(1rem, 2.6vw, 1.15rem); min-height:96px; transition:transform .15s;
}
.level-btn:hover{ transform:translateY(-3px); }
.level-btn:active{ transform:scale(.97); }
.level-btn .emoji{ font-size:clamp(1.5rem, 4.5vw, 1.9rem); }
.level-btn small{ font-family:var(--font-ui); font-weight:600; opacity:.9; font-size:.7em; }
.level-btn.facil{ background:linear-gradient(140deg,#0f9d70,#34d399); }
.level-btn.intermedio{ background:linear-gradient(140deg,#1d4ed8,#38bdf8); }
.level-btn.dificil{ background:linear-gradient(140deg,#b91c66,#f472b6); }
.level-btn.custom{ background:linear-gradient(140deg,#92400e,#fbbf24); color:#fff; }

.setup-card{
  background: var(--surface); border:1px solid var(--border-soft); backdrop-filter: blur(6px);
  border-radius: var(--radius-l); box-shadow: var(--shadow-card);
  padding: 32px clamp(20px,5vw,44px); width:100%; max-width: 480px; text-align:center;
}
.setup-card label{ display:block; font-weight:700; font-size:.92rem; color: var(--ink-soft); margin-bottom:16px; }

.factor-input-row{ display:flex; align-items:center; justify-content:center; gap: clamp(10px,3vw,18px); }
.factor-input{
  width: 100%; max-width: 150px; font-family: var(--font-num); font-weight:700; font-size: clamp(1.5rem,7vw,2.1rem);
  text-align:center; letter-spacing:.02em; color: var(--ink);
  border: 2.5px solid var(--border-soft); border-radius: var(--radius-m); padding: 14px 6px; background: var(--surface-2);
  transition: border-color .15s ease, background .15s ease;
}
.factor-input:focus{ outline:none; border-color: var(--brass); background:rgba(255,255,255,.16); }
.factor-input::placeholder{ color: var(--ink-faint); font-weight:600; }
.factor-x{ font-family: var(--font-num); font-weight:800; font-size: clamp(1.5rem,6vw,2rem); color: var(--brass-dark); flex-shrink:0; }

.setup-error{
  margin-top:12px; padding:9px 14px; border-radius:10px; background: var(--error-bg); color: var(--error);
  font-weight:700; font-size:.88rem; display:none;
}
.setup-error.show{ display:block; }

.btn-comenzar{
  margin-top:24px; width:100%; background:linear-gradient(135deg, var(--success), #10b981); color:#062b1c; border:none; border-radius:999px;
  padding:15px; font-weight:800; font-size:1.05rem; cursor:pointer; transition: transform .12s ease, background .15s ease;
  box-shadow:0 6px 18px rgba(52,211,153,.35);
}
.btn-comenzar:hover{ transform: translateY(-2px); }
.btn-comenzar:active{ transform: translateY(0) scale(.98); }

/* ==========================================================================
   Laboratorio: barra superior
   ========================================================================== */
.lab-topbar{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:18px;
}
.ghost-btn{
  border:2px solid var(--border-soft); background: var(--surface); color: var(--ink-soft); font-weight:700; font-size:.88rem;
  padding:9px 15px; border-radius:999px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  transition: all .15s ease;
}
.ghost-btn:hover{ border-color: var(--brass); color: var(--brass-dark); transform: translateY(-1px); }
.ghost-btn.brass{ background: var(--brass); border-color: var(--brass); color:#3b2405; }
.ghost-btn.brass:hover{ background: var(--brass-dark); }

.problema-pill{
  font-family: var(--font-num); font-weight:700; font-size:1.3rem; color: var(--ink);
  background: var(--surface); border:2px solid var(--ink); border-radius:14px; padding:8px 20px;
}

.fase-hint{
  text-align:center; font-weight:600; color: var(--ink-soft); background: var(--surface-2);
  border:1.5px dashed var(--border-soft); border-radius:14px; padding:10px 16px; margin-bottom:18px; max-width:640px; font-size:.92rem;
}
.fase-hint b{ color: var(--brass-dark); }

/* ==========================================================================
   Retícula
   ========================================================================== */
.lattice-card{
  background: var(--surface); border:1px solid var(--border-soft); backdrop-filter: blur(6px);
  border-radius: var(--radius-l); box-shadow: var(--shadow-card);
  padding: clamp(18px,4vw,34px); width:100%; display:flex; flex-direction:column; align-items:center;
}
.lattice-row{ display:flex; align-items:flex-start; gap:6px; }
.lattice-left{ display:flex; flex-direction:column; }

.top-digits, .side-digits{ display:flex; }
.top-digits{ justify-content:flex-end; margin-bottom:6px; gap:4px; }
.side-digits{ flex-direction:column; margin-top: calc(var(--cell-size) * 0.62 + 6px); gap:4px; margin-left:4px; }

.digit-box{
  width: var(--cell-size); height: calc(var(--cell-size) * 0.62);
  display:flex; align-items:center; justify-content:center;
  font-family: var(--font-num); font-weight:700; font-size: clamp(1.1rem, 4vw, 1.6rem); color: var(--ink);
  background: var(--surface-2); border:2px solid var(--border-soft); border-radius: var(--radius-s);
}
.side-digits .digit-box{ width: calc(var(--cell-size) * 0.72); height: var(--cell-size); }

.grid-boxes{ display:grid; gap:4px; }

.cell{
  width: var(--cell-size); height: var(--cell-size); position:relative;
  border:2px solid var(--ink); border-radius:6px; overflow:hidden; background: var(--surface-2);
}
.cell .tri{ position:absolute; inset:0; transition: background-color .35s ease, opacity .35s ease; }
.tri-tens{ clip-path: polygon(0 0, 100% 0, 0 100%); background:rgba(255,255,255,.05); }
.tri-ones{ clip-path: polygon(100% 0, 100% 100%, 0 100%); background:rgba(255,255,255,.09); }
.tri.diag-dim{ opacity:.35; }
.tri.diag-active{ opacity:1; }

.cell-num{
  position:absolute; z-index:2; font-family: var(--font-num); font-weight:700;
  font-size: clamp(0.72rem, 2.6vw, 1.05rem); color: var(--ink); line-height:1; pointer-events:none;
}
.cell-num.tens-pos{ top: 15%; left: 12%; }
.cell-num.ones-pos{ bottom: 12%; right: 12%; }

.cell input.cell-input{
  position:absolute; z-index:2; width: 44%; height: 44%;
  border:none; background: rgba(255,255,255,0.55); border-radius:4px;
  text-align:center; font-family: var(--font-num); font-weight:700;
  font-size: clamp(0.8rem, 3vw, 1.1rem); color: var(--ink); outline:none; padding:0;
}
.cell input.cell-input.tens-pos{ top: 8%; left: 8%; }
.cell input.cell-input.ones-pos{ bottom: 8%; right: 8%; }
.cell input.cell-input:focus{ background:rgba(255,255,255,.18); box-shadow: 0 0 0 2px var(--brass); }
.cell input.cell-input.solved-input{ background:transparent; pointer-events:none; }
.cell input.cell-input.wrong-flash{ background: var(--error-bg); box-shadow: 0 0 0 2px var(--error); }

/* ==========================================================================
   Fase de diagonales (suma final)
   ========================================================================== */
.diag-section{ margin-top: 26px; width:100%; display:flex; flex-direction:column; align-items:center; }
.diag-section h3{
  font-size:.9rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color: var(--ink-soft); margin-bottom:16px;
}
.diag-row{ display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; justify-content:center; }

.diag-box-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; }
.carry-badge{
  position:absolute; top:-24px; left:50%; transform:translateX(-50%) scale(0); opacity:0;
  font-family: var(--font-num); font-weight:800; font-size:.78rem; color:#3b2405;
  background: var(--brass); border-radius:999px; padding:2px 9px; white-space:nowrap;
  transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
}
.carry-badge.show{ transform:translateX(-50%) scale(1); opacity:1; }

.diag-box{
  width: clamp(46px,11vw,60px); min-height: clamp(46px,11vw,60px);
  border-radius: 12px; display:flex; align-items:center; justify-content:center;
  font-family: var(--font-num); font-weight:800; font-size:1.15rem;
  border:2.5px solid var(--border-soft); background: var(--surface-2); color: var(--ink-faint);
  transition: all .25s ease;
}
.diag-box.pending{ opacity:.55; }
.diag-box input{
  width:100%; height:100%; border:none; background:transparent; text-align:center;
  font-family: var(--font-num); font-weight:800; font-size:1.2rem; color: var(--ink); outline:none;
}
.diag-box.wrong{ animation: shake .32s ease; }
@keyframes shake{ 10%,90%{transform:translateX(-2px);} 20%,80%{transform:translateX(4px);} 30%,50%,70%{transform:translateX(-7px);} 40%,60%{transform:translateX(7px);} }

.carry-fly{
  position:fixed; z-index:3000; font-family: var(--font-num); font-weight:800; font-size:.9rem; color:#3b2405;
  background: var(--brass); border-radius:999px; padding:4px 10px; pointer-events:none;
  transition: transform .55s cubic-bezier(.3,.6,.4,1), opacity .55s ease;
}

/* ==========================================================================
   Botón / panel "Mostrar desarrollo"
   ========================================================================== */
.overlay{
  position:fixed; inset:0; background:rgba(10,4,30,.6); display:flex; align-items:center; justify-content:center;
  z-index:1000; padding:18px; backdrop-filter: blur(3px);
}
.dev-card{
  background: linear-gradient(160deg, #2c1468, #4c1d95); border:1px solid var(--border-soft);
  border-radius: var(--radius-l); padding:26px clamp(18px,4vw,30px); max-width:520px; width:100%;
  max-height:80vh; overflow-y:auto; box-shadow:0 30px 60px rgba(0,0,0,0.5);
}
.dev-card h3{ font-size:1.2rem; margin-bottom:4px; }
.dev-card .dev-sub{ color: var(--ink-soft); font-size:.88rem; margin-bottom:16px; font-weight:600; }
.dev-linea{
  display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px dashed var(--border-soft); font-size:.92rem;
}
.dev-linea:first-of-type{ border-top:none; }
.dev-swatch{ width:14px; height:14px; border-radius:4px; flex-shrink:0; }
.dev-linea .dev-txt{ font-family: var(--font-num); font-weight:600; color: var(--ink); }
.dev-linea .dev-txt b{ color: var(--brass-dark); }
.dev-close{
  margin-top:18px; width:100%; background:linear-gradient(135deg, var(--success), #10b981); color:#062b1c; border:none; border-radius:999px;
  padding:12px; font-weight:800; cursor:pointer;
}

/* ==========================================================================
   Mensaje final
   ========================================================================== */
.final-banner{
  margin-top:22px; text-align:center; background: var(--success-bg); border:2px solid var(--success);
  color: var(--success); border-radius: var(--radius-m); padding:16px 24px; font-weight:800;
  font-family: var(--font-num); font-size: clamp(1.05rem, 3.6vw, 1.3rem);
}

footer.credits{ text-align:center; color: var(--ink-faint); font-weight:600; font-size:.78rem; padding:24px 10px 4px; }

@media (max-width: 480px){
  :root{ --cell-size: clamp(40px, 13vw, 56px); }
  .diag-box{ width: 44px; min-height:44px; font-size:1rem; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>

<script>
/* ============================================================================
   MULTIPLICACIÓN EN RETÍCULA (ÁRABE) — reimplementación completa
   ----------------------------------------------------------------------------
   Índice de secciones:
     1. Utilidades
     2. Parser de la entrada ("347x28")
     3. Motor matemático (diagonales, acarreos, algoritmo tradicional)
     4. Estado global
     5. Render: pantalla de inicio (niveles + crea tu ejercicio)
     6. Render: pantalla "crea tu ejercicio" (factores libres)
     7. Render: laboratorio (retícula + fases)
     8. Fase opcional: productos parciales a cargo del alumno
     9. Fase central: suma de diagonales con acarreo
    10. Panel "Mostrar desarrollo"
    11. Transformación final al algoritmo tradicional
    12. Arranque

   El motor matemático (secciones 2-3) fue validado por separado con 20.000
   casos aleatorios antes de integrarlo aquí.
   ============================================================================ */

/* ---------------------------------------------------------------------------
   1. UTILIDADES
   ------------------------------------------------------------------------- */
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html !== undefined) e.innerHTML = html;
  return e;
}
function prefersReducedMotion(){
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

/* Paleta categórica para las diagonales — se reutiliza en la celda, la ficha
   de suma y el acarreo, para reforzar la asociación visual pedida. */
const PALETA_DIAGONALES = [
  '#38bdf8','#f472b6','#34d399','#fbbf24','#a78bfa','#2dd4bf',
  '#fb923c','#818cf8','#e879f9','#a3e635','#60a5fa','#f87171',
];
function colorDiagonal(i){ return PALETA_DIAGONALES[i % PALETA_DIAGONALES.length]; }

/* ---------------------------------------------------------------------------
   2. PARSER DE LA ENTRADA
   Acepta "347x28", "347×28", "347*28", con o sin espacios.
   ------------------------------------------------------------------------- */
function parseFactores(aStrRaw, bStrRaw){
  let aStr = (aStrRaw || '').trim();
  let bStr = (bStrRaw || '').trim();
  if(!aStr || !bStr){
    return { error: 'Escribe un número en cada casillero.' };
  }
  if(!/^\d+$/.test(aStr) || !/^\d+$/.test(bStr)){
    return { error: 'Usa solo dígitos (0-9) en cada casillero.' };
  }
  aStr = aStr.replace(/^0+(?=\d)/, '');
  bStr = bStr.replace(/^0+(?=\d)/, '');
  if(aStr.length > 6 || bStr.length > 6){
    return { error: 'Por ahora, máximo 6 cifras por factor.' };
  }
  return {
    aDigits: aStr.split('').map(Number),
    bDigits: bStr.split('').map(Number),
    aVal: parseInt(aStr, 10),
    bVal: parseInt(bStr, 10),
  };
}

/* ---------------------------------------------------------------------------
   3. MOTOR MATEMÁTICO
   ------------------------------------------------------------------------- */

/* Para cada celda (r,c) — columna c = dígito del multiplicando (arriba),
   fila r = dígito del multiplicador (lateral) — el producto parcial se separa
   en decena/unidad. Cada una pertenece a una diagonal de igual valor
   posicional: la unidad de la celda pertenece a la diagonal D=(cols-1-c)+
   (rows-1-r), y la decena a la diagonal D+1 (un orden de magnitud mayor).
   Esto da exactamente cols+rows diagonales (0 = unidades del resultado). */
function construirDiagonales(cols, rows, topDigits, sideDigits){
  const numDiagonales = cols + rows;
  const diagonales = Array.from({ length: numDiagonales }, () => []);
  for(let r = 0; r < rows; r++){
    for(let c = 0; c < cols; c++){
      const prod = topDigits[c] * sideDigits[r];
      const tens = Math.floor(prod / 10), ones = prod % 10;
      const D = (cols - 1 - c) + (rows - 1 - r);
      diagonales[D].push({ r, c, tipo: 'ones', valor: ones });
      diagonales[D + 1].push({ r, c, tipo: 'tens', valor: tens });
    }
  }
  return diagonales;
}

/* Resuelve la suma de cada diagonal (de la 0 en adelante) arrastrando el
   acarreo. Se precalcula TODO el resultado correcto de una vez: así, tanto
   en modo "paso a paso" como en modo "libre", cada casilla puede validarse
   de forma independiente sin depender del orden en que el alumno la resuelva. */
function resolverDiagonales(diagonales){
  let carry = 0;
  const resultados = [];
  for(let i = 0; i < diagonales.length; i++){
    const rawSum = diagonales[i].reduce((s, x) => s + x.valor, 0);
    const total = rawSum + carry;
    const digito = total % 10;
    const carryOut = Math.floor(total / 10);
    resultados.push({ rawSum, carryIn: carry, total, digito, carryOut });
    carry = carryOut;
  }
  return resultados;
}

/* ---------------------------------------------------------------------------
   4. ESTADO GLOBAL
   ------------------------------------------------------------------------- */
const state = {
  screen: 'home',              // 'home' | 'setup' | 'lab'
  aDigits: [], bDigits: [], aVal: 0, bVal: 0, cols: 0, rows: 0,
  diagonales: [], resultados: [], numDiagonales: 0,
  fase: 'productos',           // 'productos' | 'diagonales' | 'final'
  celdaResuelta: [],           // [r][c] boolean (fase productos)
  diagResuelto: [],            // [i] boolean (fase diagonales)
  diagonalActiva: null,
  ultimaFactorA: '', ultimaFactorB: '',
};

function render(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  if(state.screen === 'home') app.appendChild(renderHome());
  else if(state.screen === 'setup') app.appendChild(renderSetup());
  else app.appendChild(renderLab());
}

/* ---------------------------------------------------------------------------
   5. PANTALLA: INICIO (niveles + crea tu ejercicio)
   ------------------------------------------------------------------------- */
function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }

/* Genera un número aleatorio con una cantidad exacta de cifras (nunca con
   cero a la izquierda). */
function generarFactorAleatorio(digitos){
  let s = String(randInt(1, 9));
  for(let i = 1; i < digitos; i++) s += String(randInt(0, 9));
  return s;
}

/* Fácil: 3 cifras × 1 cifra. Intermedio: 2 × 2 cifras. Difícil: combina al
   azar 2×3, 3×2 o 3×3 cifras. */
function generarFactoresPorNivel(nivel){
  let da, db;
  if(nivel === 'facil'){ da = 3; db = 1; }
  else if(nivel === 'intermedio'){ da = 2; db = 2; }
  else {
    const opciones = [[2,3],[3,2],[3,3]];
    [da, db] = opciones[randInt(0, opciones.length - 1)];
  }
  return parseFactores(generarFactorAleatorio(da), generarFactorAleatorio(db));
}

function comenzarNivel(nivel){
  const datos = generarFactoresPorNivel(nivel);
  if(datos.error) return; // no debería ocurrir; red de seguridad
  iniciarProblema(datos);
}

function renderHome(){
  const wrap = el('div');
  wrap.style.width = '100%';
  wrap.style.display = 'flex';
  wrap.style.flexDirection = 'column';
  wrap.style.alignItems = 'center';

  wrap.appendChild(el('div', 'hero', `
    <h1>Multiplicación Árabe</h1>
    <p>Elige un nivel para practicar, o crea tu propio ejercicio.</p>
  `));

  const grid = el('div', 'level-grid');
  const niveles = [
    { key:'facil',       cls:'facil',       emoji:'⭐',   label:'Fácil' },
    { key:'intermedio',  cls:'intermedio',  emoji:'⭐⭐',  label:'Intermedio' },
    { key:'dificil',     cls:'dificil',     emoji:'⭐⭐⭐', label:'Difícil' },
  ];
  niveles.forEach(n => {
    const btn = el('button', 'level-btn ' + n.cls, `<span class="emoji">${n.emoji}</span> ${n.label}`);
    btn.type = 'button';
    btn.onclick = () => comenzarNivel(n.key);
    grid.appendChild(btn);
  });
  const customBtn = el('button', 'level-btn custom', `<span class="emoji">✏️</span> Crea tu ejercicio`);
  customBtn.type = 'button';
  customBtn.onclick = () => { state.screen = 'setup'; render(); };
  grid.appendChild(customBtn);

  wrap.appendChild(grid);
  wrap.appendChild(el('footer', 'credits', 'Multiplicación Árabe · Material interactivo para Educación Básica'));
  return wrap;
}

/* ---------------------------------------------------------------------------
   6. PANTALLA: CREA TU EJERCICIO (factores libres)
   ------------------------------------------------------------------------- */
function renderSetup(){
  const wrap = el('div');
  wrap.style.width = '100%';
  wrap.style.display = 'flex';
  wrap.style.flexDirection = 'column';
  wrap.style.alignItems = 'center';

  const topbar = el('div', 'lab-topbar');
  const back = el('button', 'ghost-btn', '← Volver');
  back.onclick = () => { state.screen = 'home'; render(); };
  topbar.appendChild(back);
  wrap.appendChild(topbar);

  wrap.appendChild(el('div', 'hero', `
    <h1>Crea tu ejercicio</h1>
    <p>Escribe los dos factores, resuelve la cuadrícula y suma las diagonales con acarreo.</p>
  `));

  const card = el('div', 'setup-card');
  card.innerHTML = `<label>Escribe los dos factores</label>`;

  const factorRow = el('div', 'factor-input-row');
  const inputA = document.createElement('input');
  inputA.id = 'factorA'; inputA.type = 'text'; inputA.inputMode = 'numeric';
  inputA.autocomplete = 'off'; inputA.placeholder = '347'; inputA.className = 'factor-input';
  inputA.value = state.ultimaFactorA || '';

  const inputB = document.createElement('input');
  inputB.id = 'factorB'; inputB.type = 'text'; inputB.inputMode = 'numeric';
  inputB.autocomplete = 'off'; inputB.placeholder = '28'; inputB.className = 'factor-input';
  inputB.value = state.ultimaFactorB || '';

  factorRow.appendChild(inputA);
  factorRow.appendChild(el('span', 'factor-x', '×'));
  factorRow.appendChild(inputB);
  card.appendChild(factorRow);

  const errBox = el('div', 'setup-error'); errBox.id = 'setupError';
  card.appendChild(errBox);

  const btn = el('button', 'btn-comenzar', 'Comenzar');
  btn.onclick = intentarComenzar;
  card.appendChild(btn);

  wrap.appendChild(card);
  wrap.appendChild(el('footer', 'credits', 'Multiplicación Árabe · Material interactivo para Educación Básica'));

  [inputA, inputB].forEach(inp => {
    inp.addEventListener('keydown', (e) => { if(e.key === 'Enter') intentarComenzar(); });
  });
  setTimeout(() => inputA.focus(), 30);

  return wrap;
}

function intentarComenzar(){
  const inputA = document.getElementById('factorA');
  const inputB = document.getElementById('factorB');
  const errBox = document.getElementById('setupError');
  const resultado = parseFactores(inputA.value, inputB.value);
  if(resultado.error){
    errBox.textContent = resultado.error;
    errBox.classList.add('show');
    return;
  }
  errBox.classList.remove('show');
  iniciarProblema(resultado);
}

function iniciarProblema(datos){
  state.aDigits = datos.aDigits; state.bDigits = datos.bDigits;
  state.aVal = datos.aVal; state.bVal = datos.bVal;
  state.cols = datos.aDigits.length; state.rows = datos.bDigits.length;

  state.diagonales = construirDiagonales(state.cols, state.rows, state.aDigits, state.bDigits);
  state.resultados = resolverDiagonales(state.diagonales);
  state.numDiagonales = state.diagonales.length;

  // El alumno siempre completa los productos parciales y siempre resuelve
  // las diagonales paso a paso (sin opciones de modo profesor).
  state.celdaResuelta = Array.from({ length: state.rows }, () => new Array(state.cols).fill(false));
  state.diagResuelto = new Array(state.numDiagonales).fill(false);
  state.diagonalActiva = null;

  state.fase = 'productos';
  state.screen = 'lab';
  render();
}

function volverAlInicio(){
  state.ultimaFactorA = state.aDigits.join('');
  state.ultimaFactorB = state.bDigits.join('');
  state.screen = 'home';
  render();
}

/* ---------------------------------------------------------------------------
   7. LABORATORIO
   ------------------------------------------------------------------------- */
function renderLab(){
  const wrap = el('div');
  wrap.style.width = '100%'; wrap.style.display = 'flex'; wrap.style.flexDirection = 'column'; wrap.style.alignItems = 'center';

  const topbar = el('div', 'lab-topbar');
  const back = el('button', 'ghost-btn', '← Nuevo problema');
  back.onclick = volverAlInicio;
  topbar.appendChild(back);

  topbar.appendChild(el('div', 'problema-pill', `${state.aDigits.join('')} × ${state.bDigits.join('')}`));

  if(state.fase !== 'productos'){
    const devBtn = el('button', 'ghost-btn brass', '📖 Mostrar desarrollo');
    devBtn.onclick = abrirDesarrollo;
    topbar.appendChild(devBtn);
  } else {
    topbar.appendChild(el('div'));
  }
  wrap.appendChild(topbar);

  const hint = el('div', 'fase-hint');
  if(state.fase === 'productos'){
    hint.innerHTML = 'Completa cada casilla: arriba a la izquierda la <b>decena</b>, abajo a la derecha la <b>unidad</b> del producto de esos dos dígitos.';
  } else if(state.fase === 'diagonales'){
    hint.innerHTML = 'Suma los números de la diagonal activa (color resaltado) y escribe el total. Si supera 9, escribe el número completo: el acarreo viaja solo.';
  } else {
    hint.innerHTML = '¡Multiplicación resuelta!';
  }
  wrap.appendChild(hint);

  const card = el('div', 'lattice-card');
  card.appendChild(renderReticula());
  wrap.appendChild(card);

  if(state.fase === 'diagonales' || state.fase === 'final'){
    wrap.appendChild(renderSeccionDiagonales());
  }

  if(state.fase === 'final'){
    wrap.appendChild(renderTransformacionFinal());
  }

  wrap.appendChild(el('footer', 'credits', 'Multiplicación Árabe · Material interactivo para Educación Básica'));

  return wrap;
}

/* Construye la retícula: dígitos superiores, cuadrícula de celdas, dígitos
   laterales. Las celdas muestran texto estático (si ya están resueltas) o
   inputs (durante la fase de productos, para las que faltan). */
function renderReticula(){
  const row = el('div', 'lattice-row');
  const left = el('div', 'lattice-left');

  const topDigits = el('div', 'top-digits');
  state.aDigits.forEach(d => topDigits.appendChild(el('div', 'digit-box', String(d))));
  left.appendChild(topDigits);

  const grid = el('div', 'grid-boxes');
  grid.style.gridTemplateColumns = `repeat(${state.cols}, var(--cell-size))`;

  for(let r = 0; r < state.rows; r++){
    for(let c = 0; c < state.cols; c++){
      grid.appendChild(construirCelda(r, c));
    }
  }
  left.appendChild(grid);
  row.appendChild(left);

  const sideDigits = el('div', 'side-digits');
  state.bDigits.forEach(d => sideDigits.appendChild(el('div', 'digit-box', String(d))));
  row.appendChild(sideDigits);

  return row;
}

function diagonalesDeCelda(r, c){
  const D = (state.cols - 1 - c) + (state.rows - 1 - r);
  return { onesDiag: D, tensDiag: D + 1 };
}

function construirCelda(r, c){
  const cell = el('div', 'cell');
  cell.dataset.r = r; cell.dataset.c = c;

  const prod = state.aDigits[c] * state.bDigits[r];
  const tens = Math.floor(prod / 10), ones = prod % 10;
  const { onesDiag, tensDiag } = diagonalesDeCelda(r, c);

  const triTens = el('div', 'tri tri-tens'); triTens.dataset.diag = tensDiag;
  const triOnes = el('div', 'tri tri-ones'); triOnes.dataset.diag = onesDiag;
  aplicarTintaDiagonal(triTens, tensDiag);
  aplicarTintaDiagonal(triOnes, onesDiag);
  cell.appendChild(triTens); cell.appendChild(triOnes);

  const resuelta = state.celdaResuelta[r][c];

  if(resuelta){
    cell.appendChild(el('div', 'cell-num tens-pos', String(tens)));
    cell.appendChild(el('div', 'cell-num ones-pos', String(ones)));
  } else {
    const tensInput = document.createElement('input');
    tensInput.type = 'text'; tensInput.inputMode = 'numeric'; tensInput.maxLength = 1;
    tensInput.className = 'cell-input tens-pos';
    tensInput.setAttribute('aria-label', `Decena del producto de la fila ${r + 1}, columna ${c + 1}`);
    tensInput.addEventListener('input', () => manejarEntradaCelda(r, c, 'tens', tensInput, tens, ones));

    const onesInput = document.createElement('input');
    onesInput.type = 'text'; onesInput.inputMode = 'numeric'; onesInput.maxLength = 1;
    onesInput.className = 'cell-input ones-pos';
    onesInput.setAttribute('aria-label', `Unidad del producto de la fila ${r + 1}, columna ${c + 1}`);
    onesInput.addEventListener('input', () => manejarEntradaCelda(r, c, 'ones', onesInput, tens, ones));

    cell.appendChild(tensInput); cell.appendChild(onesInput);
  }

  return cell;
}

function aplicarTintaDiagonal(triEl, diagIndex){
  const activo = state.diagonalActiva;
  if(activo === null){
    triEl.style.background = '';
    triEl.classList.remove('diag-dim', 'diag-active');
    return;
  }
  if(diagIndex === activo){
    triEl.style.background = colorDiagonal(diagIndex) + '33'; // tinte translúcido
    triEl.style.borderColor = colorDiagonal(diagIndex);
    triEl.classList.add('diag-active'); triEl.classList.remove('diag-dim');
  } else {
    triEl.style.background = '';
    triEl.classList.add('diag-dim'); triEl.classList.remove('diag-active');
  }
}

/* ---------------------------------------------------------------------------
   8. FASE OPCIONAL: PRODUCTOS PARCIALES A CARGO DEL ALUMNO
   Cada mini-input (decena / unidad) se valida solo, al estilo del resto de
   la app: si es correcto, avanza automáticamente; si no, se limpia y se
   avisa sin revelar la respuesta.
   ------------------------------------------------------------------------- */
function manejarEntradaCelda(r, c, tipo, inputEl, tensCorrecta, onesCorrecta){
  const val = inputEl.value.replace(/\D/g, '').slice(-1);
  inputEl.value = val;
  if(val === '') return;

  const correcto = tipo === 'tens' ? (parseInt(val, 10) === tensCorrecta) : (parseInt(val, 10) === onesCorrecta);

  if(!correcto){
    inputEl.classList.add('wrong-flash');
    mostrarToast('Revisa esta casilla: ese dígito no es correcto.');
    setTimeout(() => { inputEl.value = ''; inputEl.classList.remove('wrong-flash'); }, 260);
    return;
  }

  if(tipo === 'tens'){
    // Avanza a la unidad de la misma celda
    const cell = inputEl.closest('.cell');
    const onesInput = cell.querySelector('.ones-pos');
    if(onesInput) onesInput.focus();
  } else {
    // Unidad correcta: la celda queda resuelta
    state.celdaResuelta[r][c] = true;
    const siguiente = siguienteCeldaRaster(r, c);
    if(siguiente){
      render();
      setTimeout(() => {
        const nextCell = document.querySelector(`.cell[data-r="${siguiente.r}"][data-c="${siguiente.c}"] .tens-pos`);
        if(nextCell) nextCell.focus();
      }, 30);
    } else {
      // Todas las celdas resueltas: pasar a la fase de diagonales
      state.fase = 'diagonales';
      render();
    }
  }
}

function siguienteCeldaRaster(r, c){
  if(c + 1 < state.cols) return { r, c: c + 1 };
  if(r + 1 < state.rows) return { r: r + 1, c: 0 };
  return null;
}

let toastTimer = null;
function mostrarToast(msg){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div'); t.id = 'toast';
    t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2c1468;border:1px solid rgba(255,255,255,.18);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;font-family:"Nunito",sans-serif;font-size:.9rem;z-index:2000;box-shadow:0 10px 24px rgba(0,0,0,0.4);max-width:90vw;text-align:center;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.transition = 'opacity .4s ease'; t.style.opacity = '0'; }, 2200);
}

/* ---------------------------------------------------------------------------
   9. FASE CENTRAL: SUMA DE DIAGONALES CON ACARREO
   Las fichas se muestran de izquierda a derecha en el mismo orden en que se
   leerá el resultado (más significativa primero), pero se resuelven de
   derecha a izquierda (unidades primero), como la suma real.
   ------------------------------------------------------------------------- */
function indiceSiguientePendiente(){
  for(let i = 0; i < state.numDiagonales; i++){
    if(!state.diagResuelto[i]) return i;
  }
  return -1;
}

function renderSeccionDiagonales(){
  const section = el('div', 'diag-section');
  section.appendChild(el('h3', '', 'Suma las diagonales (empezando por la derecha)'));

  const row = el('div', 'diag-row');
  const siguiente = indiceSiguientePendiente();

  // De más significativa (izquierda) a menos significativa (derecha)
  for(let i = state.numDiagonales - 1; i >= 0; i--){
    row.appendChild(construirFichaDiagonal(i, siguiente));
  }
  section.appendChild(row);
  return section;
}

function construirFichaDiagonal(i, siguientePendiente){
  const wrapEl = el('div', 'diag-box-wrap');
  const r = state.resultados[i];
  const habilitada = (i === siguientePendiente);
  const color = colorDiagonal(i);

  // El acarreo se muestra en cuanto la diagonal es interactiva (o ya resuelta).
  const mostrarAcarreo = r.carryIn > 0 && (state.diagResuelto[i] || habilitada);
  const carryBadge = el('div', 'carry-badge' + (mostrarAcarreo ? ' show' : ''), '+' + r.carryIn);
  wrapEl.appendChild(carryBadge);

  if(state.diagResuelto[i]){
    const box = el('div', 'diag-box', String(r.digito));
    box.style.borderColor = color; box.style.background = color + '22'; box.style.color = color;
    wrapEl.appendChild(box);
  } else if(habilitada){
    const box = el('div', 'diag-box');
    box.style.borderColor = color;
    const input = document.createElement('input');
    input.type = 'text'; input.inputMode = 'numeric'; input.maxLength = 3;
    input.dataset.diag = i;
    input.setAttribute('aria-label', 'Suma de la diagonal ' + (i + 1));
    input.addEventListener('focus', () => { state.diagonalActiva = i; refrescarTintaCeldas(); });
    input.addEventListener('input', () => manejarEntradaDiagonal(i, input, box));
    box.appendChild(input);
    wrapEl.appendChild(box);
    if(i === siguientePendiente){ setTimeout(() => input.focus(), 30); }
  } else {
    wrapEl.appendChild(el('div', 'diag-box pending', '?'));
  }

  return wrapEl;
}

/* Actualiza solo el tinte de las celdas (sin reconstruir toda la retícula)
   cuando cambia la diagonal activa, para no perder el foco del input. */
function refrescarTintaCeldas(){
  document.querySelectorAll('.tri').forEach(triEl => {
    aplicarTintaDiagonal(triEl, parseInt(triEl.dataset.diag, 10));
  });
}

function manejarEntradaDiagonal(i, inputEl, boxEl){
  const val = inputEl.value.replace(/\D/g, '');
  inputEl.value = val;
  if(val === '') return;

  const objetivo = state.resultados[i].total;
  const longitudObjetivo = String(objetivo).length;

  if(parseInt(val, 10) === objetivo){
    resolverDiagonal(i);
    return;
  }
  if(val.length >= longitudObjetivo){
    boxEl.classList.add('wrong');
    mostrarToast('Esa diagonal no está correcta todavía. Revísala.');
    setTimeout(() => {
      boxEl.classList.remove('wrong');
      inputEl.value = ''; inputEl.focus();
    }, 420);
  }
}

function resolverDiagonal(i){
  state.diagResuelto[i] = true;
  state.diagonalActiva = null;

  const cajaActual = document.querySelector(`.diag-box input[data-diag="${i}"]`)?.closest('.diag-box');
  const rectActual = cajaActual ? cajaActual.getBoundingClientRect() : null;

  const esUltima = (i === state.numDiagonales - 1);
  render();

  // Animación de acarreo volando hacia la siguiente diagonal (a la izquierda)
  const carryOut = state.resultados[i].carryOut;
  if(carryOut > 0 && !esUltima && rectActual && !prefersReducedMotion()){
    const wrapSiguiente = document.querySelectorAll('.diag-box-wrap')[state.numDiagonales - 1 - (i + 1)];
    if(wrapSiguiente){
      const rectSig = wrapSiguiente.getBoundingClientRect();
      const fly = document.createElement('div');
      fly.className = 'carry-fly';
      fly.textContent = '+' + carryOut;
      fly.style.left = (rectActual.left + rectActual.width / 2 - 20) + 'px';
      fly.style.top = (rectActual.top) + 'px';
      fly.style.opacity = '1';
      document.body.appendChild(fly);
      requestAnimationFrame(() => {
        const dx = (rectSig.left + rectSig.width / 2 - 20) - (rectActual.left + rectActual.width / 2 - 20);
        const dy = rectSig.top - rectActual.top - 22;
        fly.style.transform = `translate(${dx}px, ${dy}px)`;
        fly.style.opacity = '0.1';
      });
      setTimeout(() => fly.remove(), 600);
    }
  }

  if(esUltima){
    setTimeout(() => { state.fase = 'final'; render(); }, prefersReducedMotion() ? 0 : 500);
  }
}

/* ---------------------------------------------------------------------------
   10. PANEL "MOSTRAR DESARROLLO"
   ------------------------------------------------------------------------- */
function abrirDesarrollo(){
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
  const overlay = el('div', 'overlay');
  const card = el('div', 'dev-card');
  card.innerHTML = `<h3>Desarrollo paso a paso</h3><p class="dev-sub">Suma de cada diagonal, de las unidades hacia la izquierda.</p>`;

  for(let i = 0; i < state.numDiagonales; i++){
    const r = state.resultados[i];
    const contribuciones = state.diagonales[i].map(x => x.valor);
    const partesTxt = contribuciones.length ? contribuciones.join(' + ') : '0';
    const carryTxt = r.carryIn > 0 ? ` + acarreo <b>${r.carryIn}</b>` : '';
    const resultadoTxt = r.carryOut > 0
      ? `se anota <b>${r.digito}</b> y se lleva <b>${r.carryOut}</b>`
      : `se anota <b>${r.digito}</b>, sin acarreo`;

    const linea = el('div', 'dev-linea');
    const swatch = el('div', 'dev-swatch'); swatch.style.background = colorDiagonal(i);
    linea.appendChild(swatch);
    linea.appendChild(el('div', 'dev-txt', `Diagonal ${i + 1}: ${partesTxt}${carryTxt} = <b>${r.total}</b> → ${resultadoTxt}`));
    card.appendChild(linea);
  }

  const totalTxt = el('div', 'dev-linea');
  totalTxt.style.borderTop = '2px solid rgba(255,255,255,.25)'; totalTxt.style.marginTop = '6px'; totalTxt.style.paddingTop = '12px';
  totalTxt.appendChild(el('div', 'dev-txt', `Resultado final: <b>${state.aVal * state.bVal}</b>`));
  card.appendChild(totalTxt);

  const closeBtn = el('button', 'dev-close', 'Cerrar');
  closeBtn.onclick = () => { root.innerHTML = ''; };
  card.appendChild(closeBtn);

  overlay.appendChild(card);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) root.innerHTML = ''; });
  root.appendChild(overlay);
}

/* ---------------------------------------------------------------------------
   11. TRANSFORMACIÓN FINAL: ALGORITMO TRADICIONAL EQUIVALENTE
   ------------------------------------------------------------------------- */
function renderTransformacionFinal(){
  const container = el('div');
  container.style.width = '100%'; container.style.display = 'flex'; container.style.flexDirection = 'column'; container.style.alignItems = 'center';

  const total = state.aVal * state.bVal;
  container.appendChild(el('div', 'final-banner', `🎉 ¡Muy bien! ${state.aDigits.join('')} × ${state.bDigits.join('')} = ${total}`));

  const btnRow = el('div');
  btnRow.style.display = 'flex'; btnRow.style.gap = '10px'; btnRow.style.marginTop = '20px'; btnRow.style.flexWrap = 'wrap'; btnRow.style.justifyContent = 'center';
  const btnNuevo = el('button', 'ghost-btn brass', '➕ Nuevo problema');
  btnNuevo.onclick = volverAlInicio;
  btnRow.appendChild(btnNuevo);
  container.appendChild(btnRow);

  return container;
}

/* ---------------------------------------------------------------------------
   12. ARRANQUE
   ------------------------------------------------------------------------- */
render();
</script>
