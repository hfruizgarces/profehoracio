}
if(AlumnoActual) iniciarHeartbeatTiempo();

  $(id).classList.add('active'); document.body.classList.toggle('en-juego', id==='screen-juego'); window.scrollTo(0,0);
}
const PESO={lienzo:8};
let MOD='lienzo';

const ptsStr=P=>P.map(p=>f1(p[0])+','+f1(p[1])).join(' ');
const FORMAS=['p3','p4','p5','p6','p8','p12','rect','romb','flecha'];
const NOM={p3:'Triángulo',p4:'Cuadrado',p5:'Pentágono',p6:'Hexágono',p8:'Octágono',p12:'Dodecágono',rect:'Rectángulo',romb:'Rombo',flecha:'Flecha'};

SH.rect=[[0,0],[2,0],[2,1],[0,1]];

SH.flecha=[[0,1],[1,0],[1,.5],[2.5,.5],[2.5,1.5],[1,1.5],[1,2]];

function btn(id,cls,ico,txt){ return `<button class="btn-orbita ${cls}" id="${id}" type="button"><span class="bola">${ico}</span>${txt}</button>`; }
function tono(hex,f){ const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  if(f<1){ r*=f; g*=f; b*=f; } else { const k=f-1; r+=(255-r)*k; g+=(255-g)*k; b+=(255-b)*k; }
  return `rgb(${r|0},${g|0},${b|0})`; }
function poligono(cx,cy,n,s,rot){ const R=s/(2*Math.sin(Math.PI/n)); return Array.from({length:n},(_,k)=>{ const a=rot+2*Math.PI*k/n; return [cx+R*Math.cos(a),cy+R*Math.sin(a)]; }); }
function centro(P){ return [P.reduce((a,p)=>a+p[0],0)/P.length, P.reduce((a,p)=>a+p[1],0)/P.length]; }
function solapan(P,Q,eps){
  for(const S of [P,Q]) for(let i=0;i<S.length;i++){ const a=S[i], b=S[(i+1)%S.length], nx=b[1]-a[1], ny=a[0]-b[0], l=Math.hypot(nx,ny), ux=nx/l, uy=ny/l;
    let m1=1e9,M1=-1e9,m2=1e9,M2=-1e9; P.forEach(p=>{ const d=p[0]*ux+p[1]*uy; m1=Math.min(m1,d); M1=Math.max(M1,d); }); Q.forEach(p=>{ const d=p[0]*ux+p[1]*uy; m2=Math.min(m2,d); M2=Math.max(M2,d); });
    if(M1<=m2+eps||M2<=m1+eps) return false; }
  return true; }
function pegada(A,B,g,n){ // polígono regular de n lados sobre el borde AB, hacia afuera de g
  const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2, dx=B[0]-A[0], dy=B[1]-A[1], l=Math.hypot(dx,dy);
  let nx=dy/l, ny=-dx/l; if((mx-g[0])*nx+(my-g[1])*ny<0){ nx=-nx; ny=-ny; }
  const ap=l/(2*Math.tan(Math.PI/n)), c=[mx+nx*ap,my+ny*ap], P=[];
  for(let k=0;k<n;k++){ const t=2*Math.PI*k/n, ct=Math.cos(t), st=Math.sin(t), rx=A[0]-c[0], ry=A[1]-c[1]; P.push([c[0]+rx*ct-ry*st, c[1]+rx*st+ry*ct]); }
  return P; }

function areaFirmada(P){ let a=0; for(let i=0;i<P.length;i++){ const p=P[i],q=P[(i+1)%P.length]; a+=p[0]*q[1]-q[0]*p[1]; } return a/2; }
function dentroP(P,x,y){ let c=false; for(let i=0,j=P.length-1;i<P.length;j=i++){ const a=P[i],b=P[j]; if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0]) c=!c; } return c; }
function muestras(P,S){ const sg=areaFirmada(P)>0?1:-1, o=[]; for(let i=0;i<P.length;i++){ const a=P[i],b=P[(i+1)%P.length], dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy); o.push([(a[0]+b[0])/2+sg*(-dy/l)*S*.04,(a[1]+b[1])/2+sg*(dx/l)*S*.04]); } return o; }
function cruzan(P,Q,S){ const e=S*S*1e-3, c=(a,b,p)=>(b[0]-a[0])*(p[1]-a[1])-(b[1]-a[1])*(p[0]-a[0]);
  for(let i=0;i<P.length;i++){ const a=P[i],b=P[(i+1)%P.length]; for(let j=0;j<Q.length;j++){ const c1=Q[j],d1=Q[(j+1)%Q.length], o1=c(a,b,c1), o2=c(a,b,d1), o3=c(c1,d1,a), o4=c(c1,d1,b);
    if(Math.abs(o1)>e&&Math.abs(o2)>e&&Math.abs(o3)>e&&Math.abs(o4)>e&&o1*o2<0&&o3*o4<0) return true; } } return false; }
function encima(P,Q,S){
  const bb=R=>{ let a=1e9,b=1e9,c=-1e9,d=-1e9; R.forEach(p=>{ a=Math.min(a,p[0]); b=Math.min(b,p[1]); c=Math.max(c,p[0]); d=Math.max(d,p[1]); }); return [a,b,c,d]; };
  const A=bb(P), B=bb(Q); if(A[2]<=B[0]+S*.01||B[2]<=A[0]+S*.01||A[3]<=B[1]+S*.01||B[3]<=A[1]+S*.01) return false;
  if(cruzan(P,Q,S)) return true;
  if(muestras(P,S).some(m=>dentroP(Q,m[0],m[1]))) return true;
  if(muestras(Q,S).some(m=>dentroP(P,m[0],m[1]))) return true;
  return false; }
function llaveP(P){ return P.map(q=>Math.round(q[0]*2)+'_'+Math.round(q[1]*2)).sort().join('|'); }
// copias de la figura u (coords unitarias) pegadas sobre el borde A-B (todas las formas de apoyar un lado igual)
function pegadas(u,A,B,S,ladrillo){
  const out=[], L=Math.hypot(B[0]-A[0],B[1]-A[1]), n=u.length, seen=new Set();
  let lmax=0; for(let j=0;j<n;j++){ const p=u[j], q=u[(j+1)%n]; lmax=Math.max(lmax,Math.hypot(q[0]-p[0],q[1]-p[1])); }
  const dx0=(B[0]-A[0])/2, dy0=(B[1]-A[1])/2;
  const add=(P,t)=>{ const k=llaveP(P); if(seen.has(k)) return; seen.add(k); out.push({P,t}); };
  for(const refl of [false,true]){
    const U=refl?u.map(q=>[q[0],-q[1]]):u;
    for(let j=0;j<n;j++){ const p=U[j], q=U[(j+1)%n], dx=q[0]-p[0], dy=q[1]-p[1], le=Math.hypot(dx,dy), l=le*S; if(Math.abs(l-L)>S*.02) continue;
      for(const rev of [false,true]){
        const X=rev?B:A, Y=rev?A:B, Dx=Y[0]-X[0], Dy=Y[1]-X[1], den=dx*dx+dy*dy, re=(Dx*dx+Dy*dy)/den, im=(Dy*dx-Dx*dy)/den;
        const P=U.map(z=>{ const rx=z[0]-p[0], ry=z[1]-p[1]; return [X[0]+re*rx-im*ry, X[1]+im*rx+re*ry]; });
        add(P,.5);
        if(ladrillo&&Math.abs(le-lmax)<1e-6){ add(P.map(z=>[z[0]+dx0,z[1]+dy0]),.75); add(P.map(z=>[z[0]-dx0,z[1]-dy0]),.25); } } } }
  return out; }

  }
  { const ci=()=>$('cust'); document.addEventListener('input',e=>{ if(e.target&&e.target.id==='cust'){ Q.col=e.target.value; Q.modo='pintar'; Q.sel=null; } }); document.addEventListener('change',e=>{ if(e.target&&e.target.id==='cust'){ Q.col=e.target.value; Q.modo='pintar'; Q.sel=null; refrescar(); } }); }
  function inicial(){ const P=SH[Q.f].map(q=>[q[0]*S,q[1]*S]), c=centro(P); return P.map(q=>[q[0]-c[0]+W/2,q[1]-c[1]+H/2]); }
  function calcular(){
    Q.aristas=[]; const u=SH[Q.f];
    if(!Q.piezas.length){ Q.aristas=[{m:[W/2,H/2],cands:[inicial()]}]; return; }
    const key=(a,b)=>{ const k=p=>Math.round(p[0]*4)+'_'+Math.round(p[1]*4), x=k(a),y=k(b); return x<y?x+'|'+y:y+'|'+x; };
    const cnt={}; Q.piezas.forEach(p=>{ for(let i=0;i<p.pts.length;i++){ const k=key(p.pts[i],p.pts[(i+1)%p.pts.length]); cnt[k]=(cnt[k]||0)+1; } });
    Q.piezas.forEach(p=>{ for(let i=0;i<p.pts.length;i++){ const A=p.pts[i], B=p.pts[(i+1)%p.pts.length]; if(cnt[key(A,B)]>1) continue;

        const dx=a.B[0]-a.A[0], dy=a.B[1]-a.A[1], l=Math.hypot(dx,dy), ux=dx/l, uy=dy/l, i0=3.5, p0=[a.A[0]+dx*a.rg[0]+ux*i0,a.A[1]+dy*a.rg[0]+uy*i0], p1=[a.A[0]+dx*a.rg[1]-ux*i0,a.A[1]+dy*a.rg[1]-uy*i0];
        mk+=`<g class="mkr" data-e="${i}"><line x1="${f1(p0[0])}" y1="${f1(p0[1])}" x2="${f1(p1[0])}" y2="${f1(p1[1])}" stroke="rgba(0,0,0,.001)" stroke-width="22" stroke-linecap="round"/><line class="bd" x1="${f1(p0[0])}" y1="${f1(p0[1])}" x2="${f1(p1[0])}" y2="${f1(p1[1])}" stroke="#fff" stroke-opacity=".85" stroke-width="6" stroke-linecap="round"/><line class="bd2" x1="${f1(p0[0])}" y1="${f1(p0[1])}" x2="${f1(p1[0])}" y2="${f1(p1[1])}" stroke="#6d28d9" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 5"/></g>`; });

  }
  function refrescar(){ pal(); dibujar(); msg(Q.modo==='borrar'?'Toca una pieza para borrarla.':Q.modo==='pintar'?'Toca cada figura para pintarla. Para seguir pegando, elige una figura.':Q.modo==='gotero'?'Toca una figura del dibujo para copiar su color.':(Q.piezas.length?'Toca un borde resaltado para pegar la figura elegida.':'Toca el “+” del centro para poner tu primera figura.')); }
