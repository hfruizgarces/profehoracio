<style>

*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden;color:var(--text);font-family:var(--font-body);min-height:100vh;-webkit-tap-highlight-color:transparent;

button{font-family:inherit}
.hidden{display:none !important}
.screen{display:none;flex-direction:column;align-items:center;position:relative;z-index:1}
.screen.active{display:flex}
#app{width:100%;max-width:900px;margin:0 auto;padding:clamp(10px,2.5vw,24px);display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column}
.card{width:100%;position:relative;max-width:980px;margin:0 auto;padding:6px 10px}
.home-title{text-align:center;font-family:var(--font-display);font-weight:800;margin:0 0 6px;line-height:1.1}
.items-sub{text-align:center;color:#c9bdf0;font-size:.92rem;margin:2px 0 6px;text-wrap:balance}
.mv-pregunta{text-align:center;text-wrap:balance;font-family:var(--font-display);font-size:1.25rem;margin:6px 0 2px}
.icon-btn{display:inline-flex;align-items:center;cursor:pointer}
.mv-fila-chip{margin-top:30px}
.mv-atras-home{position:absolute;left:6px;top:6px;z-index:5}
.mv-casa-home{position:absolute;right:6px;top:6px;z-index:5}
.mv-niveles.mv-p3.mv-lv{aspect-ratio:100/90}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n1{--x:7;--y:53;--w:34}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n2{--x:50;--y:48;--w:41}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n3{--x:27;--y:1;--w:47}

.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n1{--x:10;--y:13;--w:22}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n2{--x:37;--y:8;--w:26}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n3{--x:66;--y:2;--w:31}}
.mv-nivel .ico{width:46%;height:auto;position:relative;z-index:1;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.mv-universo .mv-home .home-title{padding:0 48px}
@media (min-width:900px) and (orientation:landscape){.mv-universo .mv-home .home-title{padding:0}}
/* ---- pantalla de juego ---- */
#screen-juego{align-items:stretch;width:100%}
body.en-juego{overflow:hidden;height:100dvh;min-height:0}
body.en-juego #screen-juego{height:100dvh}
.app-header.app-topbar{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:none;width:100%;max-width:900px;margin:0 auto;padding:2px 10px 0;flex-wrap:nowrap}
.app-topbar .side{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.app-topbar .icon-btn.btn-orbita{font-size:.92rem}
.mv-universo .app-header.app-topbar .mv-av{width:clamp(56px,14vw,84px);height:clamp(56px,14vw,84px)}
#mvCelebra{position:fixed;left:50%;top:20%;transform:translateX(-50%);z-index:99990;pointer-events:none;opacity:0;width:min(86vw,300px)}
#mvCelebra.on{animation:mvCelPop 1.6s ease both}
@keyframes mvCelPop{0%{opacity:0;transform:translateX(-50%) scale(.55)}14%{opacity:1;transform:translateX(-50%) scale(1.1)}24%{transform:translateX(-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(1)}}
#mvCelebra .mv-info{display:none}
.cuerpo{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:760px;margin:0 auto;padding:2px 12px 12px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;flex:none}
.chip{padding:5px 14px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(196,181,253,.4);font-family:var(--font-display);font-weight:800;font-size:1rem}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#stage > svg{width:100%;height:100%;max-height:100%;overflow:visible}
.msg{flex:none;min-height:2.7em;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:clamp(1rem,.85rem + .7vw,1.3rem);line-height:1.25;text-wrap:balance;max-width:640px}
.msg.mal{color:#fda4af}.msg.bien{color:#6ee7b7}.msg.pista{color:#fde68a}
.fila{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;flex:none}
.btn-orbita.ancho{font-size:1.15rem;padding-right:2em}
.btn-orbita[disabled]{opacity:.45;pointer-events:none;filter:grayscale(.5)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .32s}



.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n1{--x:32;--y:3;--w:36}
.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n3{--x:24;--y:40;--w:52}
@media (min-width:700px){.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n1{--x:16;--y:7;--w:28}.mv-niveles.mv-p3.mv-lv .level-btn.mv-nivel.n3{--x:48;--y:2;--w:38}}

.cuerpo{max-width:min(1400px,98vw)}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#tgsvg{width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;display:block}
.pz{cursor:grab}
.pz.sel{filter:drop-shadow(0 0 .14px #fff) drop-shadow(0 0 .3px #fde68a)}
.pz.fin{pointer-events:none}
#tgsvg.ganado .sil{filter:drop-shadow(0 0 .4px #6ee7b7)}
.hint-slot{animation:parp .55s ease-in-out infinite alternate}
@keyframes parp{from{opacity:.35}to{opacity:1}}
.chip.rec{cursor:default}
#screen-mundos{flex-direction:column;align-items:center}
.m-cuerpo{flex:1;min-height:0;width:100%;max-width:760px;margin:0 auto;padding:4px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:10px}
.m-tit{font-family:var(--font-display);font-weight:800;font-size:clamp(1.25rem,1rem + 1.4vw,1.8rem);text-align:center;margin:2px 0 0}
.m-sub{margin:0;color:#d8ccf7;font-weight:700;text-align:center;font-size:.95rem}
.m-planetas{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:clamp(8px,3vw,22px);align-items:center;justify-items:center;padding:4px}
.mundo{position:relative;border:none;cursor:pointer;aspect-ratio:1;width:min(100%,min(40vw,28vh,230px));border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;font-family:var(--font-display);font-weight:800;
  background:radial-gradient(circle at 32% 26%,var(--c1),var(--c2) 70%);box-shadow:inset -8px -10px 18px rgba(0,0,0,.28),inset 5px 6px 12px rgba(255,255,255,.35),0 10px 26px rgba(0,0,0,.35);animation:flota 5s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.mundo:nth-child(2){animation-delay:-1.2s}.mundo:nth-child(3){animation-delay:-2.4s}.mundo:nth-child(4){animation-delay:-3.6s}
.mundo .em{font-size:clamp(2rem,9vw,3.4rem);line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.mundo .nm{font-size:clamp(1rem,4.2vw,1.35rem);line-height:1.05;text-shadow:0 2px 4px rgba(0,0,0,.4)}
.mundo .pg{font-size:clamp(.78rem,3vw,1rem);background:rgba(0,0,0,.28);border-radius:999px;padding:1px 10px}
.mundo.listo{box-shadow:inset -8px -10px 18px rgba(0,0,0,.28),inset 5px 6px 12px rgba(255,255,255,.35),0 0 0 4px #fde68a,0 0 26px rgba(253,230,138,.7)}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.g-grid{flex:1;min-height:0;width:100%;display:grid;gap:clamp(6px,1.8vw,12px);align-content:center;justify-content:center}
.fig{position:relative;border:none;cursor:pointer;padding:3px 3px 2px;min-width:0;min-height:0;border-radius:16px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(196,181,253,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:#f6f3ff;font-family:var(--font-display);font-weight:800;-webkit-tap-highlight-color:transparent}
.fig svg{width:100%;flex:1;min-height:0}
.fig .nb{font-size:clamp(.6rem,2.4vw,.8rem);line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.fig.ok{background:rgba(110,231,183,.18);box-shadow:inset 0 0 0 2px #6ee7b7}
.fig.ok::after{content:"✓";position:absolute;right:5px;top:2px;font-size:.95rem;color:#6ee7b7;font-weight:900}
.g-pie{flex:none;display:flex;align-items:center;justify-content:center;gap:14px}
.g-pie .t{font-family:var(--font-display);font-weight:800;min-width:6.5em;text-align:center}
.btn-orbita.chico .bola{width:clamp(44px,11vw,54px);height:clamp(44px,11vw,54px)}
#bFlip.off{opacity:.38}
@media (prefers-reduced-motion:reduce){.mundo{animation:none}.hint-slot{animation:none}}

  h.classList.remove('on'); void h.offsetWidth; h.classList.add('on');
  clearTimeout(h._t); h._t=setTimeout(function(){ h.classList.remove('on'); },1700);
};

      let a=1e9,b=1e9,a2=-1e9,b2=-1e9; v.forEach(q=>{a=Math.min(a,q[0]);b=Math.min(b,q[1]);a2=Math.max(a2,q[0]);b2=Math.max(b2,q[1]);});

function soltarSlot(i){ const p=S.piezas[i]; if(p.slot>=0){ S.slots[p.slot].lleno=-1; p.slot=-1; } }

svg.addEventListener('pointerdown',e=>{
  if(S.fin) return; const t=e.target.closest('.pz'); if(!t){ seleccionar(-1); return; }
  e.preventDefault(); const i=+t.dataset.i, q=aSvg(e); const yaSel=(S.sel===i);
  iniciaReloj(); alFrente(i); seleccionar(i); S.drag={i,q0:q,x0:S.piezas[i].x,y0:S.piezas[i].y,mov:false,t:performance.now(),yaSel};
  try{ svg.setPointerCapture(e.pointerId); }catch(x){}
});
svg.addEventListener('pointermove',e=>{
  const d=S.drag; if(!d) return; const q=aSvg(e), dx=q[0]-d.q0[0], dy=q[1]-d.q0[1];
  if(!d.mov && Math.hypot(dx,dy)<.18) return; if(!d.mov){ d.mov=true; soltarSlot(d.i); }
  const p=S.piezas[d.i]; p.x=d.x0+dx; p.y=d.y0+dy;
  const c=cen(pv(d.i)); const mx=S.VB[0],my=S.VB[1]; if(c[0]<.2) p.x+=.2-c[0]; if(c[0]>mx-.2) p.x-=c[0]-(mx-.2); if(c[1]<.2) p.y+=.2-c[1]; if(c[1]>my-.2) p.y-=c[1]-(my-.2);
  pintarPieza(d.i);
});
function finDrag(e){
  const d=S.drag; if(!d) return; S.drag=null;
  if(!d.mov){ if(d.yaSel) girar(d.i,1); return; }
  encajar(d.i); chequear(d.i);
}
svg.addEventListener('pointerup',finDrag); svg.addEventListener('pointercancel',finDrag);

/* verts de la silueta están en coordenadas "figura"; las piezas viven en coordenadas de tablero => convertir */
const aT=v=>v.map(p=>[p[0]+S.ox,p[1]+S.oy]);
function encajar(i){
  const p=S.piezas[i], v=pv(i);
  if(S.nivel==='f'){
    let mejor=-1,md=.34;
    S.slots.forEach((s,j)=>{ if(s.lleno>=0||s.t!==p.t) return; const sv=aT(s.v); let m=0; for(const a of sv){ let b=1e9; for(const c of v){ b=Math.min(b,Math.hypot(a[0]-c[0],a[1]-c[1])); } m=Math.max(m,b); } if(m<md){ md=m; mejor=j; } });
    if(mejor>=0){ const s=S.slots[mejor]; p.k=s.k; p.f=s.f; p.x=s.x+S.ox; p.y=s.y+S.oy; p.slot=mejor; s.lleno=i; pintarPieza(i); try{ navigator.vibrate&&navigator.vibrate(12); }catch(x){} }
  } else {
    /* imán a vértices: de la silueta y de otras fichas */
    const obj=[]; S.slots.forEach(s=>aT(s.v).forEach(q=>obj.push([q[0],q[1],0]))); S.piezas.forEach((o,j)=>{ if(j!==i) pv(j).forEach(q=>obj.push([q[0],q[1],.05])); });
    let best=null,bd=.26; v.forEach(a=>obj.forEach(b=>{ const d=Math.hypot(a[0]-b[0],a[1]-b[1])+b[2]; if(d<bd){ bd=d; best=[b[0]-a[0],b[1]-a[1]]; } }));
    if(best){ p.x+=best[0]; p.y+=best[1]; pintarPieza(i); }
  }
}
function chequear(){
  if(S.fin) return;
  if(S.nivel==='f'){ if(S.slots.every(s=>s.lleno>=0)) ganar(); return; }
  const polis=S.piezas.map((_,i)=>pv(i)); let cub=0; for(const q of S.pts){ const pt=[q[0]+S.ox,q[1]+S.oy]; if(polis.some(v=>dentro(pt,v))) cub++; }
  if(cub/S.pts.length>=.95) ganar();
}
async function ganar(){
  S.fin=true; pPon(S.fig.id,null); parar(); S.drag=null; const ms=Math.max(1,Math.round(performance.now()-S.t0)); S.t0=0; seleccionar(-1); svg.classList.add('ganado'); S.piezas.forEach(p=>p.el.classList.add('fin'));
  const nv=S.nivel, id=S.fig.id; $('chTiempo').textContent='⏱ '+fmtMs(ms);
  const m='🎉 ¡Lo lograste en '+fmtMs(ms)+'!'; msg(m,'bien'); try{ mvExito(); }catch(e){} reportar(PESO_XP[nv]);
  $('filaAcc').classList.add('hidden'); $('filaSig').classList.remove('hidden');
  if(AlumnoActual){
    const previo=REC[nv][id]||0, mejora=!previo||ms<previo; const eraNueva=!previo;
    if(mejora){ REC[nv][id]=ms; $('chRec').textContent='🏆 '+fmtMs(ms); if(window.TG) window.TG.guardar(AlumnoActual.id,nv,id,ms); if(previo) msg('🏆 ¡Nuevo récord! '+fmtMs(ms)+' (antes '+fmtMs(previo)+').','bien'); }
    else msg(m+' Tu récord es '+fmtMs(previo)+'.','bien');
    insignias(nv,ms,eraNueva);
  }
}
function insignias(nv,ms,nueva){
  if(typeof window.mvInsignia!=='function') return;
  const I=window.mvInsignia, n=hechas(nv,FIGS), total=FIGS.length;
  if(nv==='f'){ I('tg-1'); if(n>=10) I('tg-f10'); if(n>=50) I('tg-f50'); if(n>=total) I('tg-fall'); if(ms<30000) I('tg-rf'); }
  else { I('tg-d1'); if(n>=10) I('tg-d10'); if(n>=25) I('tg-d25'); if(n>=50) I('tg-d50'); if(n>=total) I('tg-dall'); if(ms<90000) I('tg-rd'); if(S.pistas===0&&nueva&&typeof window.mvInsigniaContar==='function') window.mvInsigniaContar('tg-sp',5,'tg-sp'); }
}
/* ---------- pistas ---------- */
const PMAX=2, PCOSTO=10000;
function pLee(){ try{ return JSON.parse(localStorage.getItem('tgPistas')||'{}'); }catch(e){ return {}; } }
function pGuarda(o){ try{ localStorage.setItem('tgPistas',JSON.stringify(o)); }catch(e){} }
function pDe(id){ const o=pLee(); return o[id]||{n:0,h:[]}; }
function pPon(id,P){ const o=pLee(); if(P&&P.n) o[id]=P; else delete o[id]; pGuarda(o); }
function dibujaPistas(){
  if(S.nivel!=='d'||!S.fig) return; const P=pDe(S.fig.id); const g=svg.querySelector('.sil'); if(!g) return;
  P.h.forEach(j=>{ const s=S.slots[j]; if(!s) return; g.appendChild(el('polygon',{points:pts2s(s.v),fill:'none',stroke:COL[s.nm],'stroke-width':'.12','stroke-linejoin':'round',class:'hint-slot'})); });
  $('bPista').lastChild.textContent='Pista ('+(PMAX-P.h.length)+')';
}
function pista(){
  if(S.fin||S.nivel!=='d') return;
  const id=S.fig.id, P=pDe(id);
  if(P.n>=PMAX){ msg('Ya usaste las '+PMAX+' pistas de esta figura. ¡Tú puedes con el resto!','pista'); return; }
  if(!S.conf||Date.now()-S.conf>6000){ S.conf=Date.now(); msg('⚠️ Cada pista suma 10 segundos a tu tiempo y queda marcada hasta el final. Te quedan '+(PMAX-P.n)+'. Pulsa «Pista» otra vez para confirmar.','pista'); return; }
  S.conf=0;
  const libres=S.slots.map((s,i)=>i).filter(i=>S.slots[i].lleno<0&&P.h.indexOf(i)<0); if(!libres.length) return;
  const j=libres[rnd(0,libres.length-1)]; P.n++; P.h.push(j); pPon(id,P);
  if(S.t0) S.t0-=PCOSTO; else iniciaReloj();
  $('chTiempo').textContent='⏱ '+fmtMs(performance.now()-S.t0); S.pistas++;
  const s=S.slots[j]; const g=svg.querySelector('.sil');
  g.appendChild(el('polygon',{points:pts2s(s.v),fill:'none',stroke:COL[s.nm],'stroke-width':'.12','stroke-linejoin':'round',class:'hint-slot'}));
  $('bPista').lastChild.textContent='Pista ('+(PMAX-P.n)+')';
  msg('💡 +10 segundos. Una ficha '+NOMCOL[s.nm]+' va en el contorno que parpadea (queda marcado). Pistas restantes: '+(PMAX-P.n)+'.','pista');
}
function siguiente(){ if(S.idx+1>=ORDEN.length){ msg('🏆 ¡Terminaste todas las figuras de este nivel! Vuelves a empezar.','bien'); empezar(0); return; } empezar(S.idx+1); }
$('bRot').addEventListener('click',()=>{ if(S.fin) return; if(S.sel<0){ msg('Primero toca una ficha para elegirla.'); return; } iniciaReloj(); girar(S.sel,1); });
$('bFlip').addEventListener('click',()=>{ if(S.fin) return; if(S.sel<0||S.piezas[S.sel].t!=='P'){ msg('Voltear sirve para el paralelogramo (la ficha rosada).'); return; } iniciaReloj(); voltear(S.sel); });
$('bPista').addEventListener('click',pista);
$('bRei').addEventListener('click',()=>{ if(S.fig){ empezar(S.idx); } });
$('bSig').addEventListener('click',siguiente);
window.elegirNivel=elegirNivel;

$('btn-back').addEventListener('click', function(){ pantalla('screen-home'); });
(function(){
  function montar(n){ n=n||0;
    if(typeof window.montarChipCompanero==='function'){
      [['mvChipHome',{grande:true}],['mvChipHeader',{grande:false}]].forEach(function(p){
        var e=document.getElementById(p[0]); if(e && !e.dataset.mv){ e.dataset.mv='1'; window.montarChipCompanero(e,p[1]); } });
    } else if(n<100){ setTimeout(function(){ montar(n+1); },100); } }
  montar();
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter' || e.repeat || e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
    var b=document.querySelector('#bSig'); if(!b || b.offsetParent===null || b.disabled || document.activeElement===b) return;
    e.preventDefault(); b.click();
  });
})();
</script>

/* Récord personal de cada figura: alumnosRobot/{id}.tangram = { f:{ idFigura: milisegundos }, d:{ ... } }  (solo se reemplaza si mejora) */
window.TG = {
  async cargar(id){
    try{ await signInAnonymously(auth); const s = await getDoc(doc(db, 'alumnosRobot', id)); const t = s.exists() ? (s.data().tangram || {}) : {}; return { f: t.f || {}, d: t.d || {} }; }
    catch(e){ console.warn('Tangram: no se pudo leer', e); return null; }
  },
  async guardar(id, nivel, fig, ms){
    try{ await signInAnonymously(auth); await setDoc(doc(db, 'alumnosRobot', id), { tangram: { [nivel]: { [fig]: Math.round(ms) } } }, { merge: true }); return true; }
    catch(e){ console.warn('Tangram: no se pudo guardar', e); return false; }
  }
};
</script>
