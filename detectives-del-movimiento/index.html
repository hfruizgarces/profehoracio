<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Laboratorio de Números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS DE DISEÑO
   ========================================================= */
:root{
  color-scheme: dark;
  --bg-1:#1e1147;
  --bg-2:#3b1785;
  --bg-3:#5b21b6;
  --surface:rgba(255,255,255,.07);
  --surface-strong:rgba(255,255,255,.12);
  --border-soft:rgba(255,255,255,.14);

  --primary:#34d399;
  --primary-dark:#0f9d70;
  --accent:#fbbf24;
  --accent-soft:#fde68a;
  --pink:#f472b6;
  --blue:#38bdf8;
  --error:#fb7185;
  --error-soft:#3b0f1f;

  --text:#f6f3ff;
  --text-dim:#c9bdf0;
  --text-faint:#8f7fc4;

  --r-lg:22px;
  --r-md:16px;
  --r-sm:10px;

  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;

  --shadow-1: 0 10px 30px rgba(0,0,0,.35);
  --tap-min: 48px;
}

*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; width:100%; overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
h1,h2,h3{font-family:var(--font-display); margin:0;}
button, input{ -webkit-user-select:none; user-select:none; }
input{font-family:inherit;}

.hidden{display:none !important;}
.visually-hidden{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* Foco visible para accesibilidad con teclado */
:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
  border-radius:6px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* =========================================================
   LAYOUT GENERAL
   ========================================================= */
#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding: clamp(10px, 2.5vw, 24px);
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:6px 56px 14px 2px;
  flex-wrap:wrap;
}
.app-header .side{
  display:flex; align-items:center; gap:6px;
  flex:1 1 auto;
  min-width:70px;
}
.app-header .side.right{ justify-content:flex-end; }

.icon-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--surface);
  border:1px solid var(--border-soft);
  color:var(--text);
  padding:9px 12px;
  border-radius:999px;
  font-weight:700;
  font-size:clamp(.75rem, 2vw, .9rem);
  cursor:pointer;
  min-height:var(--tap-min);
  transition: background .15s, transform .1s;
  white-space:nowrap;
}
.icon-btn:hover{ background:var(--surface-strong); }
.icon-btn:active{ transform:scale(.96); }

.brand{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.2vw, 1.6rem);
  flex:0 1 auto;
  white-space:nowrap;
}
.brand .plus{
  display:inline-flex; align-items:center; justify-content:center;
  width:1.5em; height:1.5em;
  background:linear-gradient(135deg, var(--primary), var(--blue));
  border-radius:10px;
  color:#0b1a12;
  font-size:1em;
}

main{ flex:1; display:flex; flex-direction:column; }

.screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  animation: fadeSlideIn .35s ease both;
}
@keyframes fadeSlideIn{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}

.card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(16px, 4vw, 32px);
  box-shadow:var(--shadow-1);
  backdrop-filter: blur(6px);
}

/* =========================================================
   PANTALLA INICIAL
   ========================================================= */
.home-title{
  text-align:center;
  font-size:clamp(1.4rem, 5vw, 2.2rem);
  font-weight:800;
  margin-bottom:6px;
}
.home-sub{
  text-align:center;
  color:var(--text-dim);
  font-size:clamp(.9rem, 2.4vw, 1.05rem);
  margin:0 auto clamp(18px,4vw,28px);
  max-width:46ch;
}
footer.credits{ text-align:center; color: var(--text-faint); font-weight:700; font-size:.78rem; padding:20px 10px 4px; }
.level-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:clamp(10px, 2.5vw, 16px);
  width:100%;
}
@media (max-width:420px){
  .level-grid{ grid-template-columns:1fr; }
}
.level-btn{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:clamp(16px,4vw,22px) 10px;
  border-radius:var(--r-md);
  border:1px solid var(--border-soft);
  color:var(--text);
  cursor:pointer;
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1rem, 2.6vw, 1.15rem);
  min-height:96px;
  transition:transform .15s, box-shadow .15s;
}
.level-btn:hover{ transform:translateY(-3px); }
.level-btn:active{ transform:scale(.97); }
.level-btn .emoji{ font-size:clamp(1.6rem, 5vw, 2.1rem); }
.level-btn.easy{ background:linear-gradient(140deg,#0f9d70,#34d399); }
.level-btn.mid{ background:linear-gradient(140deg,#1d4ed8,#38bdf8); }
.level-btn.hard{ background:linear-gradient(140deg,#b91c66,#f472b6); }
.level-btn.custom{ background:linear-gradient(140deg,#92400e,#fbbf24); color:#fff; }

/* =========================================================
   PANTALLA "CREA TU EJERCICIO"
   ========================================================= */
.form-title{ font-size:clamp(1.2rem,3.6vw,1.5rem); font-weight:800; text-align:center; margin-bottom:4px; }
.form-sub{ color:var(--text-dim); text-align:center; margin-bottom:18px; font-size:.95rem; }

.addend-row{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:12px;
}
.addend-index{
  width:26px; text-align:right; color:var(--text-faint); font-weight:700; flex:0 0 auto;
}
.addend-input{
  flex:0 1 180px;
  min-width:0;
  background:var(--surface-strong);
  border:2px solid var(--border-soft);
  border-radius:var(--r-sm);
  color:var(--text);
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1.1rem, 3.2vw, 1.35rem);
  text-align:center;
  padding:12px 10px;
  min-height:var(--tap-min);
  letter-spacing:1px;
}
.addend-input::placeholder{ color:var(--text-faint); font-family:var(--font-body); font-weight:600; font-size:.85em;}
.addend-remove{
  flex:0 0 auto;
  width:var(--tap-min); height:var(--tap-min);
  border-radius:50%;
  background:rgba(251,113,133,.18);
  border:1px solid var(--error);
  color:var(--error);
  font-size:1.2rem;
  font-weight:800;
  cursor:pointer;
}
.dashed-btn{
  width:100%;
  max-width:220px;
  margin-left:auto; margin-right:auto;
  display:block;
  padding:12px;
  border-radius:var(--r-sm);
  border:2px dashed var(--border-soft);
  background:transparent;
  color:var(--text-dim);
  font-weight:700;
  cursor:pointer;
  min-height:var(--tap-min);
  margin-bottom:18px;
}
.dashed-btn:hover{ border-color:var(--text-dim); color:var(--text); }
.dashed-btn:disabled{ opacity:.4; cursor:not-allowed; }

.primary-btn{
  width:100%;
  padding:14px;
  border-radius:var(--r-md);
  border:none;
  background:linear-gradient(135deg, var(--primary), #10b981);
  color:#062b1c;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1rem, 2.8vw, 1.15rem);
  cursor:pointer;
  min-height:52px;
  box-shadow:0 6px 18px rgba(52,211,153,.35);
  transition:transform .12s, box-shadow .12s;
}
.primary-btn:hover{ transform:translateY(-2px); }
.primary-btn:active{ transform:scale(.98); }
.primary-btn:disabled{
  background:#4b4b5a; color:#9a9aab; box-shadow:none; cursor:not-allowed; transform:none;
}
.form-error{
  color:var(--error);
  text-align:center;
  font-weight:700;
  font-size:.9rem;
  min-height:1.4em;
  margin-bottom:10px;
}

/* =========================================================
   PANTALLA DE EJERCICIO
   ========================================================= */
.hint-box{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-md);
  padding:12px 14px;
  margin-bottom:16px;
  width:100%;
  font-size:clamp(.82rem, 2.1vw, .95rem);
  line-height:1.45;
}
.hint-box .bulb{ font-size:1.2em; flex:0 0 auto; }
.hint-box b{ color:var(--accent); }
.hint-box .ok{ color:var(--primary); }

/* =========================================================
   MODAL (llevada / totales de columna)
   ========================================================= */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(10,4,30,.6);
  backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center;
  padding:16px;
  z-index:700;
}
.modal-box{
  width:100%; max-width:400px;
  background:linear-gradient(160deg, #2c1468, #4c1d95);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(18px,4vw,26px);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.modal-close-x{
  position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
  border:1px solid var(--border-soft); background:var(--surface); color:var(--text);
  cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; z-index:5;
}
@keyframes popIn{
  from{ transform:scale(.85); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}
@keyframes monedaFlota{
  0%{ transform:translateY(0); opacity:0; }
  15%{ opacity:1; }
  100%{ transform:translateY(-24px); opacity:0; }
}
.modal-eyebrow{
  font-size:.78rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent); margin-bottom:6px; text-align:center;
}
.modal-title{
  font-size:clamp(1.05rem, 3.2vw, 1.25rem);
  text-align:center;
  margin-bottom:14px;
  line-height:1.4;
}
.modal-title b{ color:var(--accent-soft); }
.modal-fields{
  display:flex; gap:12px; justify-content:center; margin-bottom:14px; flex-wrap:wrap;
}
.modal-field{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.modal-field label{ font-size:.8rem; color:var(--text-dim); font-weight:700; text-align:center; max-width:11em; }
.modal-field input{
  width:80px;
  text-align:center;
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.3rem;
  padding:10px 6px;
  border-radius:var(--r-sm);
  border:2px solid var(--border-soft);
  background:var(--surface-strong);
  color:var(--text);
  min-height:var(--tap-min);
}
.modal-feedback{
  text-align:center; min-height:1.6em; font-weight:700; margin-bottom:10px; font-size:.9rem;
}
.modal-feedback.err{ color:var(--error); }
.modal-feedback.ok{ color:var(--primary); }
.modal-actions{ display:flex; gap:10px; }
.modal-actions button{ flex:1; }
.secondary-btn{
  padding:12px; border-radius:var(--r-md); border:1px solid var(--border-soft);
  background:transparent; color:var(--text-dim); font-weight:700; cursor:pointer;
  min-height:48px;
}

/* =========================================================
   PANTALLA DE RESULTADO / CELEBRACIÓN
   ========================================================= */
.result-hero{
  font-size:clamp(2.2rem, 9vw, 3.4rem);
  text-align:center;
}
.result-title{
  font-size:clamp(1.3rem, 4vw, 1.8rem);
  text-align:center;
  margin:8px 0 4px;
}
.result-eq{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.6vw, 1.6rem);
  text-align:center;
  color:var(--primary);
  margin-bottom:20px;
  word-break:break-word;
}
.result-actions{
  display:flex; gap:12px; width:100%; flex-wrap:wrap;
}
.result-actions button{ flex:1 1 160px; }

.confetti-piece{
  position:fixed; top:-10px; z-index:800;
  border-radius:2px;
  animation: fall linear forwards;
  pointer-events:none;
}
@keyframes fall{
  to{ transform:translateY(105vh) rotate(360deg); opacity:.9; }
}

/* =========================================================
   BARRA DE PROGRESO DE COLUMNAS
   ========================================================= */
.progress-track{
  display:flex; gap:6px; width:100%; margin-bottom:16px;
}
.progress-seg{
  flex:1; height:6px; border-radius:4px; background:rgba(255,255,255,.12);
  overflow:hidden;
}
.progress-seg .fill{
  height:100%; width:0%; background:linear-gradient(90deg, var(--primary), var(--blue));
  transition:width .4s ease;
}

/* utilidad de botón de sonido */
.sound-icon{ font-size:1.1em; }

/* =========================================================
   MULTIPLICACIÓN ÁRABE — retícula (propio del recurso)
   ========================================================= */
:root{
  --ink:var(--text); --ink-soft:var(--text-dim); --ink-faint:var(--text-faint);
  --brass:#fbbf24; --brass-dark:#f59e0b; --success:#34d399; --success-bg:rgba(52,211,153,.15);
  --error-bg:rgba(251,113,133,.15); --radius-s:10px; --radius-m:16px; --radius-l:22px;
  --font-num:var(--font-display); --font-ui:var(--font-body);
  --cell-size:calc(var(--cell-base,56px) * var(--f,1));
}
#vista{ width:100%; display:flex; flex-direction:column; }
.hero{ text-align:center; }
.problema-pill{
  align-self:center; font-family:var(--font-num); font-weight:800; letter-spacing:.04em;
  font-size:calc(clamp(1.3rem,4.4vw,1.9rem) * var(--f,1)); color:#fff;
  background:linear-gradient(150deg, rgba(44,20,104,.75), rgba(30,17,71,.75));
  box-shadow:inset 0 0 0 1px rgba(196,181,253,.35); border-radius:16px;
  padding:calc(6px * var(--f,1)) calc(22px * var(--f,1)); margin:0 0 calc(12px * var(--f,1));
}
.lattice-card{ width:100%; display:flex; flex-direction:column; align-items:center; padding:calc(4px * var(--f,1)) 0 0; }
.lattice-row{ display:flex; align-items:flex-start; gap:6px; }
.lattice-left{ display:flex; flex-direction:column; }
.top-digits, .side-digits{ display:flex; }
.top-digits{ justify-content:flex-end; margin-bottom:5px; gap:4px; }
.side-digits{ flex-direction:column; margin-top:calc(var(--cell-size) * .62 + 5px); gap:4px; margin-left:4px; }
.digit-box{
  width:var(--cell-size); height:calc(var(--cell-size) * .62); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .46); color:#fff;
  background:linear-gradient(150deg, rgba(124,58,237,.45), rgba(44,20,104,.7)); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.45);
  border:none; border-radius:12px; text-shadow:0 2px 6px rgba(0,0,0,.45);
}
.side-digits .digit-box{ width:calc(var(--cell-size) * .72); height:var(--cell-size); }
.grid-boxes{ display:grid; gap:4px; }
.lcell{
  width:var(--cell-size); height:var(--cell-size); position:relative; overflow:hidden; border-radius:10px;
  border:2px solid rgba(196,181,253,.75); background:rgba(30,17,71,.55); box-shadow:0 0 14px rgba(124,58,237,.25);
}
.lcell .tri{ position:absolute; inset:0; transition:background-color .35s ease, opacity .35s ease; }
.tri-tens{ clip-path:polygon(0 0,100% 0,0 100%); background:rgba(255,255,255,.05); }
.tri-ones{ clip-path:polygon(100% 0,100% 100%,0 100%); background:rgba(255,255,255,.1); }
.tri.diag-dim{ opacity:.35; } .tri.diag-active{ opacity:1; }
.cell-num{
  position:absolute; z-index:2; font-family:var(--font-num); font-weight:800; line-height:1; pointer-events:none;
  font-size:calc(var(--cell-size) * .36); color:#fff; text-shadow:0 2px 5px rgba(0,0,0,.5);
}
.cell-num.tens-pos{ top:12%; left:12%; } .cell-num.ones-pos{ bottom:10%; right:12%; }
.lcell input.cell-input{
  position:absolute; z-index:2; width:42%; height:42%; border:none; border-radius:7px; padding:0; outline:none;
  background:rgba(8,3,26,.55); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.5); text-align:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .32); color:#fff; user-select:text; -webkit-user-select:text;
}
.lcell input.cell-input.tens-pos{ top:6%; left:6%; } .lcell input.cell-input.ones-pos{ bottom:6%; right:6%; }
.lcell input.cell-input:focus{ background:rgba(124,58,237,.5); box-shadow:0 0 0 2.5px var(--brass), 0 0 14px rgba(251,191,36,.6); }
.lcell input.cell-input.wrong-flash{ background:var(--error-bg); box-shadow:0 0 0 2.5px var(--error); }

.diag-section{ margin-top:calc(22px * var(--f,1)); width:100%; display:flex; flex-direction:column; align-items:center; }
.diag-section h3{ font-size:calc(.86rem * var(--f,1)); font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin-bottom:calc(30px * var(--f,1)); text-align:center; }
.diag-row{ display:flex; gap:calc(8px * var(--f,1)); align-items:flex-end; flex-wrap:wrap; justify-content:center; }
.diag-box-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; }
.carry-badge{
  position:absolute; top:calc(-24px * var(--f,1)); left:50%; transform:translateX(-50%) scale(0); opacity:0;
  font-family:var(--font-num); font-weight:800; font-size:.8rem; color:#3b2405; background:var(--brass);
  border-radius:999px; padding:2px 9px; white-space:nowrap; box-shadow:0 0 10px rgba(251,191,36,.7);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
}
.carry-badge.show{ transform:translateX(-50%) scale(1); opacity:1; }
.diag-box{
  width:calc(clamp(48px,11vw,64px) * var(--f,1)); min-height:calc(clamp(48px,11vw,64px) * var(--f,1));
  border-radius:14px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1));
  border:2.5px solid var(--border-soft); background:rgba(8,3,26,.4); color:var(--text-faint); transition:all .25s ease;
}
.diag-box.pending{ opacity:.55; }
.diag-box input{ width:100%; height:100%; border:none; background:transparent; text-align:center; font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1)); color:#fff; outline:none; user-select:text; -webkit-user-select:text; }
.diag-box.wrong{ animation:shake .32s ease; }
.carry-fly{
  position:fixed; z-index:3000; font-family:var(--font-num); font-weight:800; font-size:.95rem; color:#3b2405;
  background:var(--brass); border-radius:999px; padding:4px 10px; pointer-events:none;
  transition:transform .55s cubic-bezier(.3,.6,.4,1), opacity .55s ease;
}
.final-banner{
  margin-top:calc(16px * var(--f,1)); text-align:center; background:var(--success-bg); border:2px solid var(--success);
  color:var(--success); border-radius:16px; padding:calc(10px * var(--f,1)) 20px; font-weight:800;
  font-family:var(--font-num); font-size:calc(clamp(1.1rem,3.8vw,1.5rem) * var(--f,1));
}
.arabe-final{ width:100%; display:flex; flex-direction:column; align-items:center; }
.arabe-final .mv-fila-chip{ margin-top:calc(8px * var(--f,1)); }
.arabe-final .result-actions{ margin-top:calc(14px * var(--f,1)); }
.setup-box{ width:100%; max-width:480px; margin:0 auto; text-align:center; }
.setup-box label{ display:block; font-weight:700; font-size:.95rem; color:var(--text-dim); margin-bottom:16px; }
.factor-input-row{ display:flex; align-items:center; justify-content:center; gap:clamp(10px,3vw,18px); }
.factor-input{
  width:100%; max-width:150px; font-family:var(--font-num); font-weight:800; font-size:clamp(1.6rem,7vw,2.2rem);

<script>
window.mvExito = function(){
  try{ if(window.reaccionCompanero) window.reaccionCompanero('bien'); }catch(e){}
  var h=document.getElementById('mvCelebra'); if(!h) return;
  var img=h.querySelector('.mv-av img'); if(!img || !img.getAttribute('src')) return;

const $ = s => document.querySelector(s);
const rnd = (a,b)=> Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[rnd(0,arr.length-1)];
function barajar(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rnd(0,i); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* Sonido (Web Audio, sin archivos) */
let sonidoOn = true, ctx;
function tono(f=880, dur=.15, tipo='sine'){
  if(!sonidoOn) return;
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended') ctx.resume();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=tipo; o.frequency.value=f; g.gain.setValueAtTime(.15,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+dur);
    o.connect(g).connect(ctx.destination); o.start(); o.stop(ctx.currentTime+dur);
  }catch(e){}
}
const tintineo = ()=>{ tono(988,.12); setTimeout(()=>tono(1319,.2),110); mvExito(); };
const errorSnd = ()=>{ tono(220,.25,'triangle'); mvFallo(); };
$('#btn-sound').onclick = e => { sonidoOn=!sonidoOn; e.currentTarget.classList.toggle('apagado', !sonidoOn); };

/* Progreso al resto del sitio (las monedas las paga el motor por tiempo de actividad) */
let AlumnoActual = null;
// XP: 1 / 2 / 3 según el nivel (en el nivel 3 cada ejercicio vale 3 = 1 por reconocer + 2 por aplicar)
const pesoDe = cat => nivel===3 ? (String(cat).startsWith('rec-') ? 1 : 2) : (nivel || 1);
function registrarCompletado(peso){
  if(AlumnoActual && typeof window.reportarProgresoPractica === 'function'){
    window.reportarProgresoPractica(AlumnoActual.id, 'detectives-del-movimiento', 1, 0, peso || 1);
  }
}
const marcarActividad = () => document.dispatchEvent(new Event('click'));

/* =========================================================
   GEOMETRÍA DE CUADRITOS
   Una figura es una lista de celdas [x,y] (y crece hacia abajo).
   ========================================================= */
const V4 = [[1,0],[-1,0],[0,1],[0,-1]];
const K  = c => c[0]+','+c[1];
const tiene = (cs,x,y) => cs.some(c=>c[0]===x && c[1]===y);
const minX = cs => Math.min(...cs.map(c=>c[0])), minY = cs => Math.min(...cs.map(c=>c[1]));
const ancho = cs => Math.max(...cs.map(c=>c[0])) - minX(cs) + 1;
const alto  = cs => Math.max(...cs.map(c=>c[1])) - minY(cs) + 1;
const norm  = cs => { const mx=minX(cs), my=minY(cs); return cs.map(([x,y])=>[x-mx,y-my]); };
const canon1 = cs => norm(cs).map(K).sort().join(';');
// Las 8 maneras de orientar una figura (4 giros y 4 con espejo)
const LIN = [ ([x,y])=>[x,y], ([x,y])=>[-y,x], ([x,y])=>[-x,-y], ([x,y])=>[y,-x],
              ([x,y])=>[-x,y], ([x,y])=>[-y,-x], ([x,y])=>[x,-y], ([x,y])=>[y,x] ];
const canon = cs => LIN.map(f=>canon1(cs.map(f))).sort()[0];       // igual para figuras congruentes
const asimetrica = cs => new Set(LIN.map(f=>canon1(cs.map(f)))).size === 8;
function conexo(cs){
  if(!cs.length) return false;
  const vis=[cs[0]], pila=[cs[0]];
  while(pila.length){ const [x,y]=pila.pop();
    for(const [dx,dy] of V4){ const n=cs.find(c=>c[0]===x+dx && c[1]===y+dy); if(n && !vis.includes(n)){ vis.push(n); pila.push(n); } } }
  return vis.length===cs.length;
}
function libresAlrededor(cs){
  const out=[], vis=new Set();
  for(const [x,y] of cs) for(const [dx,dy] of V4){ const p=[x+dx,y+dy]; if(!tiene(cs,p[0],p[1]) && !vis.has(K(p))){ vis.add(K(p)); out.push(p); } }
  return out;
}
/* Catálogo de figuras con "personalidad" (letras, escaleras, ganchos…). Solo se aceptan las asimétricas y conexas,
   para que cada movimiento se note; las que se repiten girando o con espejo se descartan solas. */
const FORMAS_ASCII = [
  [".##","##.",".#."],            // F
  ["#.","#.","#.","##"],          // L larga
  ["##","##","#."],               // P
  [".#",".#","##","#."],          // N
  [".#","##",".#",".#"],          // Y
  ["###","#..","#..","#.."],      // gancho largo
  ["#..","#..","###","..#"],      // bota
  ["##.","###","#.."],            // bandera
  ["##..",".#..",".###"],         // serpiente
  ["###","#..","#.#","###"],      // G
  ["#.#","###","#.."],            // llave
  ["..#.","####","#..."],         // cohete
  ["##.","#..","###","..#"],      // zigzag
  [".###","##..",".#.."],         // pulpo
  ["#...","####",".#.."],        // pez
  ["###.","..##","...#"],         // escalera con cola
  [".#.","###","#.."],            // cruz coja
  ["##",".#","##","#."],          // S con colita
  [".##.","##..",".#..",".#.."],  // hoja
];
const CATALOGO = (()=>{
  const arr=[], vistos=new Set();
  FORMAS_ASCII.forEach(filas=>{
    const cs=[]; filas.forEach((r,y)=>[...r].forEach((ch,x)=>{ if(ch==='#') cs.push([x,y]); }));
    if(cs.length<5 || cs.length>8) return;
    const f=norm(cs);
    if(!conexo(f) || !asimetrica(f) || ancho(f)>4 || alto(f)>4) return;
    const k=canon(f); if(vistos.has(k)) return; vistos.add(k); arr.push(f);
  });
  return arr;
})();
const _recFig=[];
const recuerdaFig = f => { _recFig.push(canon(f)); while(_recFig.length>10) _recFig.shift(); return f; };
// Figura: ~60% del catálogo, ~40% inventada al azar; nunca una de las últimas 10
function polio(n, maxB=4){
  if(Math.random()<.6){
    const c=CATALOGO.filter(f=>Math.abs(f.length-n)<=1 && ancho(f)<=maxB && alto(f)<=maxB && !_recFig.includes(canon(f)));
    if(c.length) return recuerdaFig(pick(c).map(q=>[...q]));
  }
  for(let t=0;t<600;t++){
    let cs=[[0,0]], g=0;
    while(cs.length<n && g++<200){
      const [x,y]=pick(cs), [dx,dy]=pick(V4);
      if(tiene(cs,x+dx,y+dy)) continue;
      const nc=[...cs,[x+dx,y+dy]];
      if(ancho(nc)>maxB || alto(nc)>maxB) continue;
      cs=nc;
    }
    if(cs.length===n){ cs=norm(cs); if(asimetrica(cs) && !_recFig.includes(canon(cs))) return recuerdaFig(cs); }
  }
  return norm([[0,0],[0,1],[0,2],[1,2],[1,1],[2,1]]);
}
// Variantes que NO son congruentes con la figura original
const MOTIVO = {
  mover:  'cambió de forma (aunque tiene la misma cantidad de cuadritos)',
  agregar:'tiene un cuadrito de más',
  quitar: 'le falta un cuadrito',
  ampliar:'es más grande: cambió de tamaño'
};
function modificar(cs, tipo){
  if(tipo==='ampliar'){ const r=[]; cs.forEach(([x,y])=>{ for(let a=0;a<2;a++) for(let b=0;b<2;b++) r.push([2*x+a,2*y+b]); }); return r; }
  for(let t=0;t<300;t++){
    let r;
    if(tipo==='agregar'){ r=[...cs, pick(libresAlrededor(cs))]; }
    else if(tipo==='quitar'){ const i=rnd(0,cs.length-1); r=cs.filter((_,j)=>j!==i); }
    else{
      const i=rnd(0,cs.length-1), resto=cs.filter((_,j)=>j!==i);
      if(!conexo(resto)) continue;
      const p=pick(libresAlrededor(resto));
      if(p[0]===cs[i][0] && p[1]===cs[i][1]) continue;
      r=[...resto,p];
    }
    if(!conexo(r) || ancho(r)>4 || alto(r)>4) continue;
    if(canon(r)===canon(cs)) continue;
    return norm(r);
  }
  return null;
}
// Movimientos con parámetros
function aplicarT(cs,p){
  if(p.tr==='tr') return cs.map(([x,y])=>[x+p.dx,y+p.dy]);
  if(p.tr==='rf') return p.eje==='v' ? cs.map(([x,y])=>[2*p.a-1-x,y]) : cs.map(([x,y])=>[x,2*p.a-1-y]);
  return cs.map(([x,y])=>{
    const cx=2*x+1-2*p.px, cy=2*y+1-2*p.py; let nx,ny;
    if(p.ang===90){ nx=-cy; ny=cx; } else if(p.ang===-90){ nx=cy; ny=-cx; } else { nx=-cx; ny=-cy; }
    return [(2*p.px+nx-1)/2, (2*p.py+ny-1)/2];
  });
}
const dentro = (cs,c,f) => cs.every(([x,y])=> x>=0 && y>=0 && x<c && y<f);
const solapa = (a,b) => a.some(c=>tiene(b,c[0],c[1]));
function generarPar(tr, cols, rows, n){
  for(let t=0;t<1500;t++){
    const A0=polio(n,4), w=ancho(A0), h=alto(A0);
    const ox=rnd(0,cols-w), oy=rnd(0,rows-h), A=A0.map(([x,y])=>[x+ox,y+oy]);
    let p;
    if(tr==='tr'){ p={tr:'tr',dx:rnd(-cols+2,cols-2),dy:rnd(-rows+2,rows-2)}; if(Math.abs(p.dx)+Math.abs(p.dy)<4) continue; }
    else if(tr==='rf'){ p = Math.random()<.5 ? {tr:'rf',eje:'v',a:rnd(1,cols-1)} : {tr:'rf',eje:'h',a:rnd(1,rows-1)}; }
    else p={tr:'ro',px:rnd(0,cols),py:rnd(0,rows),ang:pick([90,-90,180])};
    const B=aplicarT(A,p);
    if(!dentro(B,cols,rows) || solapa(A,B)) continue;
    return {A,B,p};
  }
  return null;
}
const NOMBRE_TR = {tr:'traslación', rf:'reflexión', ro:'rotación'};
const EXPLICA = {
  tr:'<b>Traslación</b>: la figura se deslizó, sin girar ni voltearse.',
  rf:'<b>Reflexión</b>: la figura se volteó como en un espejo (la línea rosada es el eje).',
  ro:'<b>Rotación</b>: la figura giró alrededor del punto rosado.'
};

/* =========================================================
   DIBUJO (SVG: 1 unidad = 1 cuadrito)
   ========================================================= */
const COL = {az:'#38bdf8', ver:'#34d399', oro:'#fbbf24', rosa:'#f472b6'};
function figura(cs,col,{ox=0,oy=0,op=.9,dash=false}={}){
  let f='', e='';
  cs.forEach(([x,y])=>{
    const X=x+ox, Y=y+oy; f+=`M${X} ${Y}h1v1h-1z`;
    if(!tiene(cs,x,y-1)) e+=`M${X} ${Y}h1`;
    if(!tiene(cs,x,y+1)) e+=`M${X} ${Y+1}h1`;
    if(!tiene(cs,x-1,y)) e+=`M${X} ${Y}v1`;
    if(!tiene(cs,x+1,y)) e+=`M${X+1} ${Y}v1`;
  });
  return `<path d="${f}" fill="${col}" fill-opacity="${op}"/><path d="${e}" stroke="#fff" stroke-width=".12" fill="none" stroke-linecap="round"${dash?' stroke-dasharray=".3 .25"':''}/>`;
}
function cuadricula(x0,y0,w,h){
  let d=''; for(let i=0;i<=w;i++) d+=`M${x0+i} ${y0}v${h}`; for(let j=0;j<=h;j++) d+=`M${x0} ${y0+j}h${w}`;
  return `<path d="${d}" stroke="rgba(255,255,255,.2)" stroke-width=".04" fill="none"/>`;
}
const insignia = (x,y,txt,col) => `<g><circle cx="${x}" cy="${y}" r=".9" fill="${col}" stroke="#1e1147" stroke-width=".12"/><text x="${x}" y="${y+.38}" text-anchor="middle" font-size="1.1" font-weight="800" font-family="Baloo 2,sans-serif" fill="#1e1147">${txt}</text></g>`;
function panel(px,py,N,cs,col,{ox=0,oy=0,ins,clase='',data=''}={}){
  return `<g class="pan ${clase}" ${data} transform="translate(${px} ${py})">
    <rect class="pan-bg" x="-.3" y="-.3" width="${N+.6}" height="${N+.6}" rx=".6"/>
    ${cuadricula(0,0,N,N)}${figura(cs,col,{ox,oy})}${ins?insignia(.2,.2,ins,col):''}</g>`;
}
const marco = (w,h) => [-.7,-.7,w+1.4,h+1.4].join(' ');
function tamEscenario(){ const r=$('#escenario').getBoundingClientRect(); return [Math.max(r.width,50), Math.max(r.height,50)]; }
function dimsGrid(){ const [W,H]=tamEscenario(); return (W/H>=1.15) ? [12,8] : [8,10]; }

/* =========================================================
   ESTADO Y FLUJO  (juego libre: no hay número fijo de preguntas)
   ========================================================= */
let nivel=0, resultados=[], tarea=null, token=0, bloqueado=false, ultimos=[];

/* ---------- Desafío Online (clase en vivo) ---------- */
const DURACION_CONTRARRELOJ = 5*60;   // 5 minutos, en segundos
const Online = { activo:false, codigo:null, uid:null, nombre:null, docId:null, nivel:null, modo:'libre', tipo:null };
const Cont = { activo:false, fin:false, restante:0, intervalo:null };
function tipoForzado(){ return (Online.activo && Online.tipo && Online.tipo!=='todos') ? Online.tipo : null; }
function textoTiempo(){ const m=Math.floor(Cont.restante/60), s=Cont.restante%60; return `⏱️ ${m}:${String(s).padStart(2,'0')}`; }
function detenerCont(){ if(Cont.intervalo){ clearInterval(Cont.intervalo); Cont.intervalo=null; } Cont.activo=false; Cont.fin=false; }
function iniciarCont(){
  detenerCont(); Cont.activo=true; Cont.restante=DURACION_CONTRARRELOJ;
  Cont.intervalo=setInterval(()=>{ Cont.restante--; actualizarPill(); if(Cont.restante<=0) finCont(); },1000);
}
function finCont(){
  clearInterval(Cont.intervalo); Cont.intervalo=null; Cont.activo=false; Cont.fin=true; token++; bloqueado=true;
  const ok=resultados.filter(r=>r.ok).length, mal=resultados.length-ok;
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="fin-card"><h2>⏱️ ¡Se acabó el tiempo!</h2><div class="gran">${ok}</div>
    <div class="fin-ref">acierto${ok===1?'':'s'}${mal? ` · ${mal} error${mal===1?'':'es'}`:''}</div>
    <div class="fin-btns"><button class="btn verde" id="cOtra" type="button">➜ Otra ronda</button><button class="btn azul" id="cNiv" type="button">Niveles</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector('#cOtra').onclick=()=>{ ov.remove(); iniciarJuego(nivel); };
  ov.querySelector('#cNiv').onclick=()=>{ ov.remove(); detenerCont(); switchScreen('screen-niveles'); };
}
function aplicarBloqueoNivel(){
  document.querySelectorAll('#screen-niveles .level-btn').forEach(b=>{
    const bloquear = Online.activo && Online.nivel && b.dataset.n!==Online.nivel;
    b.disabled=!!bloquear; b.style.opacity=bloquear?'.35':''; b.style.pointerEvents=bloquear?'none':'';
  });
  const ind=$('#indicadorOnline'); if(ind){ ind.style.display=Online.activo?'block':'none'; $('#nombreOnline').textContent=Online.nombre||''; }
}

const NOMBRE_CAT = {
  'cong-sino':'¿Son congruentes?', 'cong-op':'Elegir la figura congruente',
  'rec-tr':'Reconocer traslaciones','rec-rf':'Reconocer reflexiones','rec-ro':'Reconocer rotaciones',
  'ap-tr':'Aplicar traslaciones','ap-rf':'Aplicar reflexiones','ap-ro':'Aplicar rotaciones'
};
function tipoSinRacha(){
  let t; for(let k=0;k<20;k++){ t=pick(['tr','rf','ro']); const n=ultimos.length; if(!(n>=2 && ultimos[n-1]===t && ultimos[n-2]===t)) break; }

/* ---------- NIVEL 1a: ¿Son congruentes? (sí / no) ---------- */
function pasoCongSiNo(p){
  const N=8, g=1.6, [W,H]=tamEscenario(), horiz = W/H>=1.25;
  const base=polio(rnd(5,6),4);
  let otra, info;
  if(p.si){ const k=rnd(0,7); otra=norm(base.map(LIN[k])); info={si:true,k}; }
  else{
    const orden=barajar(['mover','mover','agregar','quitar','ampliar']); let tipoM, m=null;
    for(const t of orden){ m=modificar(base,t); if(m){ tipoM=t; break; } }
    otra=norm(m.map(LIN[rnd(0,7)])); info={si:false,motivo:MOTIVO[tipoM]};
  }
  const o1=[Math.floor((N-ancho(base))/2),Math.floor((N-alto(base))/2)];
  const o2=[rnd(0,N-ancho(otra)),rnd(0,N-alto(otra))];
  const vw = horiz? 2*N+g : N, vh = horiz? N : 2*N+g;
  const x2 = horiz? N+g:0, y2 = horiz? 0:N+g;

    ${panel(0,0,N,base,COL.az,{ox:o1[0],oy:o1[1],ins:'A',clase:'fijo'})}
    ${panel(x2,y2,N,otra,COL.oro,{ox:o2[0],oy:o2[1],ins:'B',clase:'fijo'})}</svg>`;
  consigna('¿La figura <b class="ca">A</b> y la figura <b style="color:var(--accent)">B</b> son <b>congruentes</b>?');
  const resp = (dijoSi)=>{
    const ok = dijoSi===p.si;
    let html;
    if(p.si) html = ok ? `¡Correcto! Son congruentes: es la misma figura, solo que ${hablar(info.k)}.` : `No: sí eran congruentes. Es la misma figura, solo que ${hablar(info.k)}.`;
    else html = ok ? `¡Correcto! No son congruentes: la figura B ${info.motivo}.` : `No eran congruentes: la figura B ${info.motivo}.`;
    document.querySelectorAll('#acciones .resp').forEach(b=>{ b.disabled=true; if((b.dataset.v==='1')===p.si) b.classList.add('ok'); else if((b.dataset.v==='1')===dijoSi) b.classList.add('mal'); });
    const c=$('#acciones').innerHTML;
    cerrarPaso(ok,'cong-sino',html);
    // mantener los botones marcados junto a "Siguiente"
    const sig=$('#acciones').querySelector('.siguiente'); $('#acciones').innerHTML=c; $('#acciones').appendChild(sig);
  };
  $('#acciones').innerHTML = `<button class="resp" data-v="1" type="button">✅ Sí, son congruentes</button><button class="resp" data-v="0" type="button">❌ No son congruentes</button>`;
  $('#acciones').querySelectorAll('.resp').forEach(b=> b.onclick=()=>resp(b.dataset.v==='1'));
}

/* ---------- NIVEL 1b: ¿Cuál de las 3 es congruente? ---------- */
function pasoCongOpciones(p){
  const N=8, g=1.6, [W,H]=tamEscenario(), horiz = W/H>=1.5;
  const base=polio(rnd(5,6),4);
  // distractores distintos entre sí
  let d=[], usados=[canon(base)];
  for(const t of barajar(['mover','mover','agregar','quitar','ampliar'])){
    if(d.length===2) break;
    const m=modificar(base,t); if(!m) continue;
    const c=canon(m); if(usados.includes(c)) continue;
    usados.push(c); d.push({cs:m, motivo:MOTIVO[t]});
  }
  while(d.length<2){ const m=modificar(base,'mover'); if(m && !usados.includes(canon(m))){ usados.push(canon(m)); d.push({cs:m,motivo:MOTIVO.mover}); } }
  const kc=rnd(0,7);
  let ops=[{cs:norm(base.map(LIN[kc])), ok:true, k:kc}, ...d.map(x=>({cs:norm(x.cs.map(LIN[rnd(0,7)])), ok:false, motivo:x.motivo}))];
  ops=barajar(ops);
  const letras=['A','B','C'];
  // Arriba: la figura original (azul, enmarcada). Abajo: las 3 opciones en una fila (doradas).
  const vw=3*N+2*g, yRef=1.9, yOps=yRef+N+4.6, vh=yOps+N;
  const pos=[0,1,2].map(i=>[i*(N+g), yOps]);
  const o1=[Math.floor((N-ancho(base))/2),Math.floor((N-alto(base))/2)];
  const xRef=(vw-N)/2, cx=vw/2;
  let svg=`<svg viewBox="${marco(vw,vh)}" preserveAspectRatio="xMidYMid meet">
    <text x="${cx}" y="${yRef-.8}" font-size="1.2" fill="#38bdf8" text-anchor="middle">FIGURA ORIGINAL</text>
    ${panel(xRef,yRef,N,base,COL.az,{ox:o1[0],oy:o1[1],ins:'★',clase:'fijo ref'})}
    <path d="M${cx} ${yRef+N+.5}V${yOps-3.3}M${cx-.6} ${yOps-3.9}L${cx} ${yOps-3.3}L${cx+.6} ${yOps-3.9}" stroke="#c9bdf0" stroke-width=".18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="${cx}" y="${yOps-1.7}" font-size="1.2" fill="#fbbf24" text-anchor="middle">¿CUÁL DE ESTAS ES CONGRUENTE CON ELLA?</text>`;
  ops.forEach((o,i)=>{
    const ox=rnd(0,N-ancho(o.cs)), oy=rnd(0,N-alto(o.cs));
    svg+=panel(pos[i][0],pos[i][1],N,o.cs,COL.oro,{ox,oy,ins:letras[i],clase:'sel',data:`data-i="${i}"`});
  });
  $('#escenario').innerHTML=svg+'</svg>';
  consigna('Toca la figura (<b>A</b>, <b>B</b> o <b>C</b>) que sea <b>congruente</b> con la figura <b class="ca">★</b>.');
  document.querySelectorAll('#escenario .pan.sel').forEach(el=>{
    el.addEventListener('click',()=>{
      if(bloqueado) return;
      const i=+el.dataset.i, o=ops[i], ci=ops.findIndex(x=>x.ok);
      document.querySelectorAll('#escenario .pan.sel').forEach((e2,j)=>{ e2.classList.remove('sel'); e2.classList.add('fijo'); if(j===ci) e2.classList.add('ok'); else if(j===i) e2.classList.add('mal'); });
      const html = o.ok ? `¡Correcto! La figura ${letras[i]} es la misma, solo que ${hablar(o.k)}.`
                        : `No: la figura ${letras[i]} ${o.motivo}. La congruente era la ${letras[ci]}: es la misma figura, solo que ${hablar(ops[ci].k)}.`;
      cerrarPaso(o.ok,'cong-op',html);
    });
  });
}

/* ---------- NIVEL 2 y 3a: ¿qué le pasó a la figura? ---------- */
function guiaSVG(p,cols,rows){

                       : `<line x1="-.3" y1="${p.a}" x2="${cols+.3}" y2="${p.a}" stroke="${COL.rosa}" stroke-width=".16" stroke-dasharray=".5 .3"/>`;
  }

  return '';
}
function centro(cs){ return [cs.reduce((s,c)=>s+c[0]+.5,0)/cs.length, cs.reduce((s,c)=>s+c[1]+.5,0)/cs.length]; }
function flechaTraslacion(A,B){
  const [x1,y1]=centro(A), [x2,y2]=centro(B), a=Math.atan2(y2-y1,x2-x1), L=.55;
  const hx=[x2-L*Math.cos(a-.45), x2-L*Math.cos(a+.45)], hy=[y2-L*Math.sin(a-.45), y2-L*Math.sin(a+.45)];
  return `<path d="M${x1} ${y1}L${x2} ${y2}M${hx[0]} ${hy[0]}L${x2} ${y2}L${hx[1]} ${hy[1]}" stroke="${COL.rosa}" stroke-width=".16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function animar(p, A, cols, rows, mid){
  const my=++token, ghost=$('#anim'), fb=$('#figB');
  if(!ghost) return;
  fb.style.display='none'; ghost.style.display='';
  const dur=1100, t0=performance.now();
  const paso=now=>{
    if(token!==my) return;
    let t=Math.min(1,(now-t0)/dur); const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    let tr;
    if(p.tr==='tr') tr=`translate(${p.dx*e} ${p.dy*e})`;
    else if(p.tr==='rf') tr = p.eje==='v' ? `translate(${p.a} 0) scale(${1-2*e} 1) translate(${-p.a} 0)` : `translate(0 ${p.a}) scale(1 ${1-2*e}) translate(0 ${-p.a})`;
    else tr=`rotate(${p.ang*e} ${p.px} ${p.py})`;
    ghost.setAttribute('transform',tr);
    if(t<1) requestAnimationFrame(paso); else { fb.style.display=''; ghost.style.display='none'; }
  };
  requestAnimationFrame(paso);
}

/* ---------- NIVEL 3: descubre el movimiento y hazlo calzar (en UN solo movimiento) ---------- */
function reflejarGen(cs,px,py,d){           // reflexión respecto de una recta por (px,py) con dirección d
  return cs.map(([x,y])=>{
    const u=x+.5-px, v=y+.5-py; let nx,ny;
    if(d[0]===0){ nx=-u; ny=v; }              // recta vertical
    else if(d[1]===0){ nx=u; ny=-v; }         // recta horizontal
    else if(d[0]===d[1]){ nx=v; ny=u; }       // diagonal ↘
    else { nx=-v; ny=-u; }                    // diagonal ↗
    return [Math.round(px+nx-.5), Math.round(py+ny-.5)];
  });
}
const igualesCs = (a,b) => a.length===b.length && a.every(c=>tiene(b,c[0],c[1]));
function animarGen(tr, par, A, fin){
  const my=++token, g=$('#anim'); g.style.display=''; g.removeAttribute('transform');
  const dur=1000, t0=performance.now();
  const paso=now=>{
    if(token!==my) return;
    const t=Math.min(1,(now-t0)/dur), e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    let T;
    if(tr==='tr') T=`translate(${par.dx*e} ${par.dy*e})`;
    else if(tr==='rf'){ const ph=Math.atan2(par.d[1],par.d[0])*180/Math.PI; T=`translate(${par.px} ${par.py}) rotate(${ph}) scale(1 ${1-2*e}) rotate(${-ph}) translate(${-par.px} ${-par.py})`; }
    else T=`rotate(${par.ang*e} ${par.px} ${par.py})`;
    g.setAttribute('transform',T);
    if(t<1) requestAnimationFrame(paso); else fin&&fin();
  };
  requestAnimationFrame(paso);
}

      const [a,b]=toques, dx=b[0]-a[0], dy=b[1]-a[1], n=Math.hypot(dx,dy)||1, K=40;
      g=`<line x1="${a[0]-dx/n*K}" y1="${a[1]-dy/n*K}" x2="${a[0]+dx/n*K}" y2="${a[1]+dy/n*K}" stroke="${COL.rosa}" stroke-width=".16" stroke-dasharray=".5 .3"/>`;
    }
    if(tipoElegido==='ro' && toques.length===1){
      const [px,py]=toques[0];
      g=`<circle cx="${px}" cy="${py}" r=".75" fill="none" stroke="${COL.rosa}" stroke-width=".08"/>`;
      if(ang!==null){                       // arco con flecha: muestra el giro elegido
        const R=1.5, fe=ang*Math.PI/180, ex=px+R*Math.sin(fe), ey=py-R*Math.cos(fe), sg=ang>0?1:-1;
        const tx=sg*Math.cos(fe), ty=sg*Math.sin(fe), nx=-ty, ny=tx, L=.5;
        g+=`<path d="M${px} ${py-R}A${R} ${R} 0 0 ${ang>0?1:0} ${ex} ${ey}" stroke="${COL.rosa}" stroke-width=".16" fill="none" stroke-linecap="round"/>
            <path d="M${ex+tx*.25} ${ey+ty*.25}L${ex-tx*L+nx*L*.6} ${ey-ty*L+ny*L*.6}M${ex+tx*.25} ${ey+ty*.25}L${ex-tx*L-nx*L*.6} ${ey-ty*L-ny*L*.6}" stroke="${COL.rosa}" stroke-width=".16" fill="none" stroke-linecap="round"/>
            <text x="${px}" y="${py+R+1.15}" text-anchor="middle" font-size=".95" font-weight="800" font-family="Baloo 2,sans-serif" fill="${COL.rosa}" stroke="#1e1147" stroke-width=".18" paint-order="stroke">${ang===180?'180°':(ang>0?'↻ 90°':'↺ 90°')}</text>`;
      }
    }
    $('#marcas').innerHTML=m; $('#guiaF').innerHTML=g;
  }
  svg.addEventListener('pointerup',e=>{
    if(fase!=='aplicar' || terminado) return;
    const q=pt(e);
    if(tipoElegido==='ro'){ toques=[q]; }
    else { if(toques.length>=2) toques=[]; toques.push(q); }
    dibujarMarcas(); pintarAcciones(); marcarActividad(); tono(560,.05);
  });

  function resultadoDe(){
    if(tipoElegido==='tr'){ const [a,b]=toques, par={dx:b[0]-a[0],dy:b[1]-a[1]}; return {par, cs:A.map(([x,y])=>[x+par.dx,y+par.dy])}; }
    if(tipoElegido==='ro'){ const par={px:toques[0][0],py:toques[0][1],ang}; return {par, cs:aplicarT(A,{tr:'ro',...par})}; }
    const [a,b]=toques, dx=b[0]-a[0], dy=b[1]-a[1];
    if(dx===0&&dy===0) return {error:'Los dos puntos son el mismo: toca dos puntos distintos.'};
    if(!(dx===0 || dy===0 || Math.abs(dx)===Math.abs(dy))) return {error:'Esos dos puntos no forman una línea derecha, horizontal o diagonal. Elige otros dos puntos.'};
    const d=[Math.sign(dx),Math.sign(dy)];
    return {par:{px:a[0],py:a[1],d}, cs:reflejarGen(A,a[0],a[1],d)};
  }
  function confirmar(){
    if(!listo() || terminado) return;
    const r=resultadoDe();
    if(r.error){ aviso(r.error,'casi'); return; }
    acciones([]); aviso('');
    const ok=igualesCs(r.cs,B), primera=!registradoAp;
    if(primera){ registradoAp=true; registrar(ok && tipoElegido===p.tr,'ap-'+p.tr); }
    $('#orig').style.opacity='.35';
    animarGen(tipoElegido,r.par,A,()=>{
      if(ok){
        terminado=true; $('#puntos').style.display='none'; tintineo();
        aviso(`¡Calzó! ${EXPLICA[p.tr]}`,'bien');
        acciones([botonSiguiente()]);
      } else {
        fallos++; errorSnd();
        setTimeout(()=>{
          $('#anim').style.display='none'; $('#orig').style.opacity='';
          let pista;
          if(tipoElegido!==p.tr) pista=`Con una ${NOMBRE_TR[tipoElegido]} no se puede llegar a la figura verde. Mira cómo quedó: ¿se deslizó, se volteó o giró?`;
          else if(tipoElegido==='tr') pista='Es una traslación, pero no llegó al lugar de la figura verde. Revisa cuántos cuadritos hay que moverla.';
          else if(tipoElegido==='rf') pista='Es una reflexión, pero la línea no es la correcta. Piensa dónde pondrías el espejo para que la azul quede como la verde.';
          else pista='Es una rotación, pero el punto de giro o el giro no son los correctos.';
          aviso(pista+' <b>Tu intento sigue marcado:</b> cámbialo y confirma de nuevo.','mal');
          fase='aplicar';                       // se conservan los puntos y el giro elegidos
          dibujarMarcas(); pintarAcciones();
        },700);
      }
    });
  }
  elegir();
}

window.unirseClaseOnline = async function(codigo, nombre){
  try{
    const userCredential = await signInAnonymously(auth);
    const uid = userCredential.user.uid;
    const sessionSnap = await getDoc(doc(db, 'sessions', codigo));
    if(!sessionSnap.exists()) return { ok:false, error:'Ese código no existe. Revísalo con tu profesor.' };
    const datos = sessionSnap.data();
    if(datos.active === false) return { ok:false, error:'Tu profesor ya cerró esta sesión.' };
    if(datos.recurso && datos.recurso !== 'detectives-del-movimiento') return { ok:false, error:`Ese código es para ${datos.recurso}, no para Detectives del movimiento.` };
    const duracionMinutos = datos.duracionMinutos || 180;
    if(datos.createdAt){
      const minutosTranscurridos = (Date.now() - datos.createdAt.toDate().getTime()) / 60000;
      if(minutosTranscurridos > duracionMinutos) return { ok:false, error:'Este código ya venció. Pídele uno nuevo a tu profesor.' };
    }
    return { ok:true, uid, nivelObjetivo: datos.nivelObjetivo, modoObjetivo: datos.modoObjetivo, tipoObjetivo: datos.tipoObjetivo };
  } catch(err){
    console.error(err);
    return { ok:false, error:'Error de conexión. Intenta de nuevo.' };
  }
};
window.iniciarNuevoIntentoOnline = async function(codigo, docId, nombre, uid){
  if(!codigo || !docId) return;
  try{
    await setDoc(doc(db, 'sessions', codigo, 'students', docId), {
      name: nombre, uid: uid || null, startedAt: serverTimestamp(), completados: 0, errores: 0, mascota: (window.mascotaParaClase ? await window.mascotaParaClase() : null)
    });
  } catch(err){ console.error('No se pudo iniciar el intento online:', err); }
};
window.reportarProgresoOnline = async function(codigo, docId, deltaCompletados, deltaErrores){
  if(!codigo || !docId) return;
  try{
    await setDoc(doc(db, 'sessions', codigo, 'students', docId), {
      completados: increment(deltaCompletados || 0),
      errores: increment(deltaErrores || 0),
      updatedAt: serverTimestamp()
    }, { merge: true });
  } catch(err){ console.error('No se pudo reportar el progreso online:', err); }
};
