<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Panel del Profesor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg-1:#1e1147; --bg-2:#3b1785; --bg-3:#5b21b6;
  --primary:#34d399; --accent:#fbbf24; --error:#fb7185; --blue:#38bdf8;
  --text:#f6f3ff; --text-dim:#c9bdf0; --text-faint:#8f7fc4;
  --surface:rgba(255,255,255,.07); --surface-soft:rgba(255,255,255,.05);
  --border-soft:rgba(255,255,255,.16);
  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;
}
*{ box-sizing:border-box; }
html,body{
  margin:0; font-family:var(--font-body); font-weight:600; color:var(--text);
  background: radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed; min-height:100vh;
}
h1,h2{ font-family:var(--font-display); margin:0; }
.wrap{ max-width:640px; margin:0 auto; padding:26px 16px 60px; }
.hero{ text-align:center; padding:10px 6px 22px; }
.hero h1{ font-size:clamp(1.6rem,5.5vw,2.1rem); }
.hero p{ color:var(--text-dim); font-weight:600; margin-top:6px; }
.card{ background:var(--surface); border:1px solid var(--border-soft); backdrop-filter:blur(6px); border-radius:20px; box-shadow:0 14px 34px rgba(0,0,0,.4); padding:22px; margin-bottom:18px; }

.btn{ display:block; width:100%; padding:14px; border:none; border-radius:14px; font-family:var(--font-display); font-weight:800; font-size:1.05rem; cursor:pointer; color:#062339; background:var(--blue); box-shadow:0 4px 14px rgba(56,189,248,.35); }
.btn:hover{ filter:brightness(1.08); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

.nivel-selector{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.nivel-opt{
  padding:12px 8px; border-radius:12px; border:2px solid var(--border-soft); background:var(--surface-soft);
  color:var(--text-dim); font-family:var(--font-display); font-weight:700; font-size:.9rem; cursor:pointer;
  transition:all .15s ease; line-height:1.5;
}
.nivel-opt .nivel-desc{ font-size:.7rem; font-weight:600; opacity:.75; }
.nivel-opt.activo{ border-color:var(--primary); background:rgba(52,211,153,.16); color:var(--primary); }

.codigo-box{ text-align:center; padding:20px 10px; }
.codigo-box .etiqueta{ font-size:.8rem; color:var(--text-faint); text-transform:uppercase; letter-spacing:.06em; font-weight:700; margin-bottom:8px; }
.codigo-box .codigo{ font-family:var(--font-display); font-weight:800; font-size:2.6rem; letter-spacing:.1em; color:var(--accent); text-shadow:0 0 20px rgba(251,191,36,.4); }
.codigo-box .estado{ margin-top:10px; font-size:.85rem; color:var(--text-dim); }

table{ width:100%; border-collapse:collapse; margin-top:6px; }
th,td{ padding:10px 8px; text-align:left; border-bottom:1px solid var(--border-soft); font-size:.92rem; }
th{ color:var(--text-faint); font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; font-weight:700; }
td.nombre{ font-weight:800; font-family:var(--font-display); }
td.num{ text-align:center; font-family:var(--font-display); font-weight:800; }
tr:first-child td.num.aciertos{ color:var(--accent); }
.vacio{ text-align:center; color:var(--text-faint); padding:24px 10px; font-weight:600; }
.puesto{ display:inline-block; width:22px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>👩‍🏫 Panel del Profesor</h1>
    <p>Genera un código, compártelo con el curso, y observa en vivo cómo avanzan.</p>
  </div>

  <div class="card" id="cardGenerar">
    <div id="sinSesion">
      <p style="font-weight:800; font-family:var(--font-display); margin-bottom:10px; text-align:center;">¿A qué nivel entrarán los alumnos?</p>
      <div class="nivel-selector" id="nivelSelector">
        <button class="nivel-opt activo" data-nivel="libre">🔓 Libre<br><span class="nivel-desc">eligen ellos</span></button>
        <button class="nivel-opt" data-nivel="facil">⭐ Fácil</button>
        <button class="nivel-opt" data-nivel="intermedio">⭐⭐ Intermedio</button>
        <button class="nivel-opt" data-nivel="dificil">⭐⭐⭐ Difícil</button>
      </div>
      <p style="font-weight:800; font-family:var(--font-display); margin:16px 0 10px; text-align:center;">¿Por cuánto tiempo es válido el código?</p>
      <div class="nivel-selector" id="duracionSelector" style="grid-template-columns:repeat(3,1fr);">
        <button class="nivel-opt" data-min="45">45 min</button>
        <button class="nivel-opt activo" data-min="180">3 horas</button>
        <button class="nivel-opt" data-min="1440">Todo el día</button>
      </div>
      <button class="btn" id="btnGenerar" style="margin-top:14px;">🎲 Generar código de sesión</button>
    </div>
    <div id="conSesion" style="display:none;">
      <div class="codigo-box">
        <div class="etiqueta">Código para compartir con el curso</div>
        <div class="codigo" id="codigoTexto">------</div>
        <div class="estado" id="estadoTexto">Esperando alumnos…</div>
        <div class="estado" id="nivelElegidoTexto" style="margin-top:2px; color:var(--text-faint);"></div>
        <div class="estado" id="duracionElegidaTexto" style="margin-top:2px; color:var(--text-faint);"></div>
      </div>
      <button class="btn" id="btnNuevaSesion" style="background:var(--surface-soft); color:var(--text); border:2px solid var(--border-soft); box-shadow:none; margin-top:6px;">↺ Terminar y generar otro código</button>
    </div>
  </div>

  <div class="card" id="cardTabla" style="display:none;">
    <h2 style="font-size:1.05rem; margin-bottom:12px;">📊 Resultados en vivo</h2>
    <div id="tablaWrap">
      <p class="vacio">Todavía no se ha unido ningún alumno.</p>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
import { getFirestore, doc, setDoc, collection, onSnapshot, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

// Misma configuración real que ya usa tu página de ingreso.
const firebaseConfig = {
  apiKey: "AIzaSyDrwcG84h88gOf9FkUlZbECZ2qrO14KhO4",
  authDomain: "profehoracio-online.firebaseapp.com",
  projectId: "profehoracio-online",
  storageBucket: "profehoracio-online.firebasestorage.app",
  messagingSenderId: "TU_SENDER_ID",
  appId: "1:337766647406:web:6f13e95cb71b5f89cfc87f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore();

let unsubscribe = null;
let codigoActual = null;

function generarCodigo(){
  const letras = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sin 0/O/1/I, para que sea fácil de leer en voz alta
  let c = '';
  for(let i=0;i<5;i++) c += letras[Math.floor(Math.random()*letras.length)];
  return c;
}

let nivelSeleccionado = 'libre';
let duracionSeleccionada = 180;

document.querySelectorAll('#nivelSelector .nivel-opt').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#nivelSelector .nivel-opt').forEach(b => b.classList.remove('activo'));
    btn.classList.add('activo');
    nivelSeleccionado = btn.dataset.nivel;
  };
});
document.querySelectorAll('#duracionSelector .nivel-opt').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('#duracionSelector .nivel-opt').forEach(b => b.classList.remove('activo'));
    btn.classList.add('activo');
    duracionSeleccionada = parseInt(btn.dataset.min, 10);
  };
});

document.getElementById('btnGenerar').onclick = async () => {
  const btn = document.getElementById('btnGenerar');
  btn.disabled = true; btn.textContent = 'Generando…';
  try{
    const codigo = generarCodigo();
    await setDoc(doc(db, 'sessions', codigo), {
      active: true,
      createdAt: serverTimestamp(),
      recurso: 'coordenadas',
      nivelObjetivo: nivelSeleccionado,
      duracionMinutos: duracionSeleccionada
    });
    activarSesion(codigo);
  } catch(err){
    console.error(err);
    alert('No se pudo crear la sesión. Revisa tu conexión e inténtalo de nuevo.');
    btn.disabled = false; btn.textContent = '🎲 Generar código de sesión';
  }
};

document.getElementById('btnNuevaSesion').onclick = async () => {
  if(codigoActual){
    try{ await setDoc(doc(db,'sessions',codigoActual), {active:false}, {merge:true}); } catch(e){}
  }
  if(unsubscribe) unsubscribe();
  codigoActual = null;
  document.getElementById('sinSesion').style.display = 'block';
  document.getElementById('conSesion').style.display = 'none';
  document.getElementById('cardTabla').style.display = 'none';
  document.getElementById('btnGenerar').disabled = false;
  document.getElementById('btnGenerar').textContent = '🎲 Generar código de sesión';
  nivelSeleccionado = 'libre';
  duracionSeleccionada = 180;
  document.querySelectorAll('#nivelSelector .nivel-opt').forEach(b => b.classList.toggle('activo', b.dataset.nivel==='libre'));
  document.querySelectorAll('#duracionSelector .nivel-opt').forEach(b => b.classList.toggle('activo', b.dataset.min==='180'));
};

function activarSesion(codigo){
  codigoActual = codigo;
  document.getElementById('sinSesion').style.display = 'none';
  document.getElementById('conSesion').style.display = 'block';
  document.getElementById('cardTabla').style.display = 'block';
  document.getElementById('codigoTexto').textContent = codigo;
  const NOMBRES_NIVEL = { libre:'🔓 Libre (eligen ellos)', facil:'⭐ Fácil', intermedio:'⭐⭐ Intermedio', dificil:'⭐⭐⭐ Difícil' };
  document.getElementById('nivelElegidoTexto').textContent = 'Nivel: ' + NOMBRES_NIVEL[nivelSeleccionado];
  const NOMBRES_DURACION = { 45:'45 minutos', 180:'3 horas', 1440:'todo el día' };
  document.getElementById('duracionElegidaTexto').textContent = 'Válido por: ' + (NOMBRES_DURACION[duracionSeleccionada] || duracionSeleccionada+' min');

  const q = query(collection(db, 'sessions', codigo, 'students'), orderBy('correctas', 'desc'));
  unsubscribe = onSnapshot(q, (snap) => {
    document.getElementById('estadoTexto').textContent = snap.size + ' alumno(s) conectado(s)';
    const wrap = document.getElementById('tablaWrap');
    if(snap.empty){
      wrap.innerHTML = '<p class="vacio">Todavía no se ha unido ningún alumno.</p>';
      return;
    }
    let filas = '';
    let i = 0;
    snap.forEach(docSnap => {
      i++;
      const d = docSnap.data();
      const correctas = d.correctas ?? 0;
      const intentos = d.intentos ?? 0;
      const medalla = i===1 ? '🥇' : i===2 ? '🥈' : i===3 ? '🥉' : i;
      filas += `<tr>
        <td class="num"><span class="puesto">${medalla}</span></td>
        <td class="nombre">${escaparHtml(d.name || '(sin nombre)')}</td>
        <td class="num aciertos">${correctas}</td>
        <td class="num">${intentos}</td>
      </tr>`;
    });
    wrap.innerHTML = `<table>
      <thead><tr><th></th><th>Alumno</th><th>Aciertos</th><th>Intentos</th></tr></thead>
      <tbody>${filas}</tbody>
    </table>`;
  }, (err) => {
    console.error(err);
    document.getElementById('estadoTexto').textContent = 'Error de conexión con la sesión.';
  });
}

function escaparHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
