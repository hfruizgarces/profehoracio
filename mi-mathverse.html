<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Mathverse</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg-1:#1e1147; --bg-2:#3b1785; --bg-3:#5b21b6;
  --primary:#34d399; --accent:#fbbf24; --error:#fb7185;
  --text:#f6f3ff; --text-dim:#c9bdf0; --text-faint:#8f7fc4;
  --surface:rgba(255,255,255,.07); --surface-strong:rgba(255,255,255,.12);
  --border-soft:rgba(255,255,255,.16);
  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;
}
*{ box-sizing:border-box; }
html,body{
  margin:0; min-height:100%; font-family:var(--font-body); color:var(--text);
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.hidden{ display:none !important; }
.wrap{ max-width:480px; margin:0 auto; padding:20px 20px 60px; }

/* ---- login (mismo patrón que el resto de los recursos) ---- */
.login-card{
  background:var(--surface); border:1px solid var(--border-soft);
  border-radius:20px; padding:28px 22px; margin-top:60px;
  backdrop-filter:blur(6px); text-align:center;
}
.login-card h1{ font-family:var(--font-display); font-size:1.4rem; margin:0 0 20px; }
.login-card input{
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border-soft);
  background:rgba(255,255,255,.06); color:var(--text); font-family:var(--font-body);
  font-size:1rem; margin-bottom:12px;
}
.login-card button{
  width:100%; padding:13px; border-radius:12px; border:none;
  background:var(--primary); color:#0d2818; font-family:var(--font-display);
  font-weight:800; font-size:1rem; cursor:pointer;
}
.login-error{ color:var(--error); font-size:.85rem; margin-top:10px; min-height:1.2em; }

/* ---- home ---- */
.topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.jugando-como{ font-family:var(--font-display); font-weight:700; font-size:.95rem; }
.saldo{ display:flex; align-items:center; gap:6px; font-family:var(--font-display); font-weight:800; color:var(--accent); }

.tabs{ display:flex; gap:8px; margin-bottom:22px; }
.tab-btn{
  flex:1; padding:11px; border-radius:14px; border:1px solid var(--border-soft);
  background:var(--surface); color:var(--text-dim); font-family:var(--font-display);
  font-weight:700; font-size:.85rem; cursor:pointer;
}
.tab-btn.activo{ background:var(--primary); color:#0d2818; border-color:var(--primary); }

.pantalla{ display:none; }
.pantalla.activa{ display:block; animation:fadeIn .3s ease; }
@keyframes fadeIn{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:translateY(0); } }
@keyframes monedaFlota{ 0%{ transform:translateY(0); opacity:0; } 15%{ opacity:1; } 100%{ transform:translateY(-24px); opacity:0; } }

/* ---- tienda / inventario: grilla de tarjetas ---- */
.grilla{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.criatura-card{
  background:var(--surface); border:1px solid var(--border-soft);
  border-radius:18px; padding:14px; text-align:center;
  backdrop-filter:blur(6px);
}
.criatura-img{ width:90px; height:90px; object-fit:contain; margin:0 auto 8px; display:block; }
.criatura-img.bloqueada{ filter:brightness(0) opacity:.28; }
.criatura-nombre{ font-family:var(--font-display); font-weight:800; font-size:.95rem; }
.criatura-tipo{ color:var(--text-faint); font-size:.7rem; font-weight:700; margin-bottom:8px; }
.criatura-precio{ font-family:var(--font-display); font-weight:800; color:var(--accent); font-size:.95rem; margin-bottom:8px; }
.btn-mini{
  width:100%; padding:9px; border-radius:10px; border:none;
  font-family:var(--font-display); font-weight:800; font-size:.78rem; cursor:pointer;
}
.btn-mini.comprar{ background:var(--primary); color:#0d2818; }
.btn-mini.comprar:disabled{ background:var(--surface-strong); color:var(--text-faint); cursor:not-allowed; }
.btn-mini.equipar{ background:var(--surface-strong); color:var(--text); border:1px solid var(--border-soft); }
.btn-mini.equipado{ background:rgba(52,211,153,.16); color:var(--primary); border:1px solid rgba(52,211,153,.4); }
.sin-items{ color:var(--text-faint); text-align:center; padding:30px 10px; font-size:.9rem; grid-column:1/-1; }

/* ---- perfil ---- */
.hero{ display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:24px; }
.hero-img{ width:200px; height:200px; object-fit:contain; filter:drop-shadow(0 12px 30px rgba(251,191,36,.3)); animation:bob 3.2s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0) rotate(-1deg); } 50%{ transform:translateY(-10px) rotate(1deg); } }
.hero-vacio{
  width:200px; height:200px; border-radius:24px; border:2px dashed var(--border-soft);
  display:flex; align-items:center; justify-content:center; color:var(--text-faint);
  font-size:.85rem; font-weight:700; text-align:center; padding:20px; margin:0 auto;
}
.hero-nombre{ font-family:var(--font-display); font-size:1.4rem; font-weight:800; margin:14px 0 2px; }
.card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:18px; padding:18px; margin-bottom:14px; }
.card p{ margin:0; line-height:1.6; color:var(--text-dim); font-size:.9rem; }
</style>
</head>
<body>

<a href="index.html" title="Volver al catálogo de recursos" style="position:fixed; top:12px; right:12px; z-index:99999; width:42px; height:42px; border-radius:50%; background:rgba(30,17,71,.75); backdrop-filter:blur(6px); border:1px solid rgba(255,255,255,.25); display:flex; align-items:center; justify-content:center; font-size:1.25rem; text-decoration:none; box-shadow:0 4px 14px rgba(0,0,0,.35);">🏠</a>

<div class="wrap">

  <div id="pantallaLogin">
    <div class="login-card">
      <h1>⚔️ Mi Mathverse</h1>
      <input type="text" id="inputUsuario" placeholder="Tu usuario">
      <input type="password" id="inputPassword" placeholder="Tu contraseña">
      <button id="btnLogin">Entrar</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <div id="pantallaPrincipal" class="hidden">
    <div class="topbar">
      <div class="jugando-como" id="jugandoComo"></div>
      <div class="saldo">🪙 <span id="saldoTexto">0</span></div>
    </div>

    <div class="tabs">
      <button class="tab-btn activo" onclick="mostrarPantalla('perfil', this)">👤 Perfil</button>
      <button class="tab-btn" onclick="mostrarPantalla('tienda', this)">🛒 Tienda</button>
      <button class="tab-btn" onclick="mostrarPantalla('inventario', this)">🎒 Inventario</button>
      <button class="tab-btn" onclick="mostrarPantalla('diario', this)">📖 Diario</button>
    </div>

    <div class="pantalla activa" id="pantalla-perfil">
      <div class="hero" id="heroPerfil"></div>
      <div class="card"><p id="perfilDescripcion"></p></div>
    </div>

    <div class="pantalla" id="pantalla-tienda">
      <div class="grilla" id="grillaTienda"></div>
    </div>

    <div class="pantalla" id="pantalla-inventario">
      <div class="grilla" id="grillaInventario"></div>
    </div>

    <div class="pantalla" id="pantalla-diario">
      <p style="text-align:center; color:var(--text-faint); font-size:.85rem; margin:0 0 16px;">Descubiertas: <strong id="diarioContador" style="color:var(--primary);"></strong></p>
      <div class="grilla" id="grillaDiario"></div>
    </div>
  </div>

</div>

<script>
const CLAVE_SESION_COMPARTIDA = 'profehoracio_alumno_actual';
let AlumnoActual = null;
let datosAlumno = null; // último snapshot conocido: monedas, criaturas, companeroEquipado

function normalizarUsuarioCompartido(u){
  return u.trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, '-');
}

function mostrarPantalla(nombre, boton){
  document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
  document.getElementById('pantalla-' + nombre).classList.add('activa');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('activo'));
  boton.classList.add('activo');
  if(nombre === 'tienda') renderizarTienda();
  if(nombre === 'inventario') renderizarInventario();
  if(nombre === 'perfil') renderizarPerfil();
  if(nombre === 'diario') renderizarDiario();
}

function actualizarSaldoPantalla(){
  document.getElementById('saldoTexto').textContent = (datosAlumno && datosAlumno.monedas) || 0;
}

function renderizarTienda(){
  const cont = document.getElementById('grillaTienda');
  const catalogo = window.CATALOGO_CRIATURAS || {};
  const yaCompradas = (datosAlumno && datosAlumno.criaturas) || {};
  const saldo = (datosAlumno && datosAlumno.monedas) || 0;
  cont.innerHTML = Object.entries(catalogo).map(([id, c]) => {
    const tenida = !!yaCompradas[id];
    const alcanza = saldo >= c.precio;
    return `
      <div class="criatura-card">
        <img class="criatura-img ${tenida ? '' : ''}" src="assets/mathverse/creatures/${c.archivo}" alt="${c.nombre}">
        <div class="criatura-nombre">${c.nombre}</div>
        <div class="criatura-tipo">${c.tipo} · ${c.rareza}</div>
        ${tenida
          ? `<div class="btn-mini equipado" style="cursor:default;">✅ Ya es tuya</div>`
          : `<div class="criatura-precio">🪙 ${c.precio}</div>
             <button class="btn-mini comprar" ${alcanza ? '' : 'disabled'} onclick="comprar('${id}')">${alcanza ? 'Comprar' : 'Faltan monedas'}</button>`
        }
      </div>
    `;
  }).join('');
}

function renderizarInventario(){
  const cont = document.getElementById('grillaInventario');
  const catalogo = window.CATALOGO_CRIATURAS || {};
  const poseidas = (datosAlumno && datosAlumno.criaturas) || {};
  const equipada = datosAlumno && datosAlumno.companeroEquipado;
  const ids = Object.keys(poseidas);
  if(ids.length === 0){
    cont.innerHTML = `<div class="sin-items">Todavía no tienes ninguna criatura. Ve a la Tienda para conseguir tu primera compañera.</div>`;
    return;
  }
  cont.innerHTML = ids.map(id => {
    const c = catalogo[id];
    if(!c) return '';
    const esEquipada = equipada === id;
    return `
      <div class="criatura-card">
        <img class="criatura-img" src="assets/mathverse/creatures/${c.archivo}" alt="${c.nombre}">
        <div class="criatura-nombre">${c.nombre}</div>
        <div class="criatura-tipo">${c.tipo} · ${c.rareza}</div>
        <button class="btn-mini ${esEquipada ? 'equipado' : 'equipar'}" onclick="equipar('${id}')">
          ${esEquipada ? '✅ Equipado' : 'Equipar'}
        </button>
      </div>
    `;
  }).join('');
}

function renderizarDiario(){
  const cont = document.getElementById('grillaDiario');
  const catalogo = window.CATALOGO_CRIATURAS || {};
  const poseidas = (datosAlumno && datosAlumno.criaturas) || {};
  const ids = Object.keys(catalogo);
  const cantPoseidas = ids.filter(id => poseidas[id]).length;
  document.getElementById('diarioContador').textContent = `${cantPoseidas}/${ids.length}`;

  cont.innerHTML = ids.map(id => {
    const c = catalogo[id];
    const tenida = !!poseidas[id];
    if(tenida){
      return `
        <div class="criatura-card">
          <img class="criatura-img" src="assets/mathverse/creatures/${c.archivo}" alt="${c.nombre}">
          <div class="criatura-nombre">${c.nombre}</div>
          <div class="criatura-tipo">${c.tipo} · ${c.rareza}</div>
        </div>
      `;
    }
    const soloIcono = c.tipo.split(' ')[0];
    return `
      <div class="criatura-card">
        <img class="criatura-img bloqueada" src="assets/mathverse/creatures/${c.archivo}" alt="Criatura sin descubrir">
        <div class="criatura-nombre">???</div>
        <div class="criatura-tipo">${soloIcono} · ???</div>
      </div>
    `;
  }).join('');
}

function renderizarPerfil(){
  const catalogo = window.CATALOGO_CRIATURAS || {};
  const equipadaId = datosAlumno && datosAlumno.companeroEquipado;
  const c = equipadaId ? catalogo[equipadaId] : null;
  const hero = document.getElementById('heroPerfil');
  const desc = document.getElementById('perfilDescripcion');
  if(c){
    hero.innerHTML = `
      <img class="hero-img" src="assets/mathverse/creatures/${c.archivo}" alt="${c.nombre}">
      <div class="hero-nombre">${c.nombre}</div>
    `;
    desc.textContent = c.descripcion;
  } else {
    hero.innerHTML = `<div class="hero-vacio">Todavía no tienes un compañero equipado. Cómpralo en la Tienda o equipa uno desde tu Inventario.</div>`;
    desc.textContent = '';
  }
}

async function comprar(criaturaId){
  const resultado = await window.comprarCriatura(AlumnoActual.id, criaturaId);
  if(!resultado.ok){
    alert(resultado.error);
    return;
  }
  datosAlumno.monedas = resultado.saldoRestante;
  datosAlumno.criaturas = datosAlumno.criaturas || {};
  datosAlumno.criaturas[criaturaId] = true;
  actualizarSaldoPantalla();
  renderizarTienda();
  mostrarToastMonedas(-window.CATALOGO_CRIATURAS[criaturaId].precio, true);
}

async function equipar(criaturaId){
  const ok = await window.equiparCompanero(AlumnoActual.id, criaturaId);
  if(!ok){ alert('No se pudo equipar. Intenta de nuevo.'); return; }
  datosAlumno.companeroEquipado = criaturaId;
  renderizarInventario();
}

function mostrarToastMonedas(cantidad, esGasto){
  const toast = document.createElement('div');
  toast.textContent = `${cantidad > 0 ? '+' : ''}${cantidad} 🪙`;
  toast.style.cssText = `position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:99998; background:${esGasto ? 'var(--error)' : 'var(--accent)'}; color:#1a0f3d; font-family:var(--font-display); font-weight:800; font-size:.9rem; padding:8px 18px; border-radius:16px; animation: monedaFlota 2s ease-out forwards; pointer-events:none;`;
  document.body.appendChild(toast);
  setTimeout(()=> toast.remove(), 2000);
}

async function entrarConDatos(id, nombre){
  AlumnoActual = { id, nombre };
  document.getElementById('pantallaLogin').classList.add('hidden');
  document.getElementById('pantallaPrincipal').classList.remove('hidden');
  document.getElementById('jugandoComo').textContent = `Hola, ${nombre}`;
  datosAlumno = await window.obtenerDatosAlumno(id) || {};
  actualizarSaldoPantalla();
  renderizarPerfil();
}

function intentarSesionCompartida(){
  try{
    const guardado = JSON.parse(sessionStorage.getItem(CLAVE_SESION_COMPARTIDA) || 'null');
    if(!guardado || !guardado.id) return false;
    entrarConDatos(guardado.id, guardado.nombre);
    return true;
  } catch(e){ return false; }
}

document.getElementById('btnLogin').onclick = async () => {
  const usuario = document.getElementById('inputUsuario').value;
  const password = document.getElementById('inputPassword').value;
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';
  if(!usuario || !password){ errorEl.textContent = 'Completa usuario y contraseña.'; return; }
  const resultado = await window.verificarLoginAlumnoCompartido(usuario, password);
  if(!resultado.ok){ errorEl.textContent = resultado.error; return; }
  sessionStorage.setItem(CLAVE_SESION_COMPARTIDA, JSON.stringify({ id: resultado.id, nombre: resultado.nombre }));
  entrarConDatos(resultado.id, resultado.nombre);
};

function iniciar(){
  if(typeof window.verificarLoginAlumnoCompartido !== 'function'){
    setTimeout(iniciar, 100);
    return;
  }
  intentarSesionCompartida();
}
iniciar();
</script>

<script type="module" src="mathverse-core.js"></script>
</body>
</html>
