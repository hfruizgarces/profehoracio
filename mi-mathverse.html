<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Mi Mathverse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TOKENS DE DISEÑO
   ========================================================= */
:root{
  color-scheme: dark;
  --bg-1:#1e1147;
  --bg-2:#3b1785;
  --bg-3:#5b21b6;
  --surface:rgba(255,255,255,.07);
  --surface-strong:rgba(255,255,255,.12);
  --border-soft:rgba(255,255,255,.14);

  --primary:#34d399;
  --primary-dark:#0f9d70;
  --accent:#fbbf24;
  --accent-soft:#fde68a;
  --pink:#f472b6;
  --blue:#38bdf8;
  --error:#fb7185;
  --error-soft:#3b0f1f;

  --text:#f6f3ff;
  --text-dim:#c9bdf0;
  --text-faint:#8f7fc4;

  --r-lg:22px;
  --r-md:16px;
  --r-sm:10px;

  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Nunito', system-ui, sans-serif;

  --shadow-1: 0 10px 30px rgba(0,0,0,.35);
  --tap-min: 48px;
}

*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; width:100%; overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 0%, var(--bg-3), transparent 55%),
    radial-gradient(circle at 85% 100%, #2a0f66, transparent 55%),
    linear-gradient(160deg, var(--bg-1), var(--bg-2));
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
button{font-family:inherit;}
h1,h2,h3{font-family:var(--font-display); margin:0;}
button, input{ -webkit-user-select:none; user-select:none; }
input{font-family:inherit;}

.hidden{display:none !important;}
.visually-hidden{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* Foco visible para accesibilidad con teclado */
:focus-visible{
  outline:3px solid var(--accent);
  outline-offset:2px;
  border-radius:6px;
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; transition-duration:.001ms !important;}
}

/* =========================================================
   LAYOUT GENERAL
   ========================================================= */
#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:900px;
  margin:0 auto;
  padding: clamp(10px, 2.5vw, 24px);
  padding-bottom: max(16px, env(safe-area-inset-bottom));
}

.app-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:6px 56px 14px 2px;
  flex-wrap:wrap;
}
.app-header .side{
  display:flex; align-items:center; gap:6px;
  flex:1 1 auto;
  min-width:70px;
}
.app-header .side.right{ justify-content:flex-end; }

.icon-btn{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--surface);
  border:1px solid var(--border-soft);
  color:var(--text);
  padding:9px 12px;
  border-radius:999px;
  font-weight:700;
  font-size:clamp(.75rem, 2vw, .9rem);
  cursor:pointer;
  min-height:var(--tap-min);
  transition: background .15s, transform .1s;
  white-space:nowrap;
}
.icon-btn:hover{ background:var(--surface-strong); }
.icon-btn:active{ transform:scale(.96); }

.brand{
  display:flex; align-items:center; gap:8px;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.2vw, 1.6rem);
  flex:0 1 auto;
  white-space:nowrap;
}
.brand .plus{
  display:inline-flex; align-items:center; justify-content:center;
  width:1.5em; height:1.5em;
  background:linear-gradient(135deg, var(--primary), var(--blue));
  border-radius:10px;
  color:#0b1a12;
  font-size:1em;
}

main{ flex:1; display:flex; flex-direction:column; }

.screen{
  display:flex;
  flex-direction:column;
  align-items:center;
  animation: fadeSlideIn .35s ease both;
}
@keyframes fadeSlideIn{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}

.card{
  width:100%;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(16px, 4vw, 32px);
  box-shadow:var(--shadow-1);
  backdrop-filter: blur(6px);
}

/* =========================================================
   PANTALLA INICIAL
   ========================================================= */
.home-title{
  text-align:center;
  font-size:clamp(1.4rem, 5vw, 2.2rem);
  font-weight:800;
  margin-bottom:6px;
}
.home-sub{
  text-align:center;
  color:var(--text-dim);
  font-size:clamp(.9rem, 2.4vw, 1.05rem);
  margin:0 auto clamp(18px,4vw,28px);
  max-width:46ch;
}
footer.credits{ text-align:center; color: var(--text-faint); font-weight:700; font-size:.78rem; padding:20px 10px 4px; }
.level-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:clamp(10px, 2.5vw, 16px);
  width:100%;
}
@media (max-width:420px){
  .level-grid{ grid-template-columns:1fr; }
}
.level-btn{
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:clamp(16px,4vw,22px) 10px;
  border-radius:var(--r-md);
  border:1px solid var(--border-soft);
  color:var(--text);
  cursor:pointer;
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1rem, 2.6vw, 1.15rem);
  min-height:96px;
  transition:transform .15s, box-shadow .15s;
}
.level-btn:hover{ transform:translateY(-3px); }
.level-btn:active{ transform:scale(.97); }
.level-btn .emoji{ font-size:clamp(1.6rem, 5vw, 2.1rem); }
.level-btn.easy{ background:linear-gradient(140deg,#0f9d70,#34d399); }
.level-btn.mid{ background:linear-gradient(140deg,#1d4ed8,#38bdf8); }
.level-btn.hard{ background:linear-gradient(140deg,#b91c66,#f472b6); }
.level-btn.custom{ background:linear-gradient(140deg,#92400e,#fbbf24); color:#fff; }

/* =========================================================
   PANTALLA "CREA TU EJERCICIO"
   ========================================================= */
.form-title{ font-size:clamp(1.2rem,3.6vw,1.5rem); font-weight:800; text-align:center; margin-bottom:4px; }
.form-sub{ color:var(--text-dim); text-align:center; margin-bottom:18px; font-size:.95rem; }

.addend-row{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:12px;
}
.addend-index{
  width:26px; text-align:right; color:var(--text-faint); font-weight:700; flex:0 0 auto;
}
.addend-input{
  flex:0 1 180px;
  min-width:0;
  background:var(--surface-strong);
  border:2px solid var(--border-soft);
  border-radius:var(--r-sm);
  color:var(--text);
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(1.1rem, 3.2vw, 1.35rem);
  text-align:center;
  padding:12px 10px;
  min-height:var(--tap-min);
  letter-spacing:1px;
}
.addend-input::placeholder{ color:var(--text-faint); font-family:var(--font-body); font-weight:600; font-size:.85em;}
.addend-remove{
  flex:0 0 auto;
  width:var(--tap-min); height:var(--tap-min);
  border-radius:50%;
  background:rgba(251,113,133,.18);
  border:1px solid var(--error);
  color:var(--error);
  font-size:1.2rem;
  font-weight:800;
  cursor:pointer;
}
.dashed-btn{
  width:100%;
  max-width:220px;
  margin-left:auto; margin-right:auto;
  display:block;
  padding:12px;
  border-radius:var(--r-sm);
  border:2px dashed var(--border-soft);
  background:transparent;
  color:var(--text-dim);
  font-weight:700;
  cursor:pointer;
  min-height:var(--tap-min);
  margin-bottom:18px;
}
.dashed-btn:hover{ border-color:var(--text-dim); color:var(--text); }
.dashed-btn:disabled{ opacity:.4; cursor:not-allowed; }

.primary-btn{
  width:100%;
  padding:14px;
  border-radius:var(--r-md);
  border:none;
  background:linear-gradient(135deg, var(--primary), #10b981);
  color:#062b1c;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1rem, 2.8vw, 1.15rem);
  cursor:pointer;
  min-height:52px;
  box-shadow:0 6px 18px rgba(52,211,153,.35);
  transition:transform .12s, box-shadow .12s;
}
.primary-btn:hover{ transform:translateY(-2px); }
.primary-btn:active{ transform:scale(.98); }
.primary-btn:disabled{
  background:#4b4b5a; color:#9a9aab; box-shadow:none; cursor:not-allowed; transform:none;
}
.form-error{
  color:var(--error);
  text-align:center;
  font-weight:700;
  font-size:.9rem;
  min-height:1.4em;
  margin-bottom:10px;
}

/* =========================================================
   PANTALLA DE EJERCICIO
   ========================================================= */
.hint-box{
  display:flex; gap:10px; align-items:flex-start;
  background:var(--surface);
  border:1px solid var(--border-soft);
  border-radius:var(--r-md);
  padding:12px 14px;
  margin-bottom:16px;
  width:100%;
  font-size:clamp(.82rem, 2.1vw, .95rem);
  line-height:1.45;
}
.hint-box .bulb{ font-size:1.2em; flex:0 0 auto; }
.hint-box b{ color:var(--accent); }
.hint-box .ok{ color:var(--primary); }

/* =========================================================
   MODAL (llevada / totales de columna)
   ========================================================= */
.modal-overlay{
  position:fixed; inset:0;
  background:rgba(10,4,30,.6);
  backdrop-filter:blur(3px);
  display:flex; align-items:center; justify-content:center;
  padding:16px;
  z-index:700;
}
.modal-box{
  width:100%; max-width:400px;
  background:linear-gradient(160deg, #2c1468, #4c1d95);
  border:1px solid var(--border-soft);
  border-radius:var(--r-lg);
  padding:clamp(18px,4vw,26px);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
  animation: popIn .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;
}
.modal-close-x{
  position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
  border:1px solid var(--border-soft); background:var(--surface); color:var(--text);
  cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; z-index:5;
}
@keyframes popIn{
  from{ transform:scale(.85); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}
@keyframes monedaFlota{
  0%{ transform:translateY(0); opacity:0; }
  15%{ opacity:1; }
  100%{ transform:translateY(-24px); opacity:0; }
}
.modal-eyebrow{
  font-size:.78rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--accent); margin-bottom:6px; text-align:center;
}
.modal-title{
  font-size:clamp(1.05rem, 3.2vw, 1.25rem);
  text-align:center;
  margin-bottom:14px;
  line-height:1.4;
}
.modal-title b{ color:var(--accent-soft); }
.modal-fields{
  display:flex; gap:12px; justify-content:center; margin-bottom:14px; flex-wrap:wrap;
}
.modal-field{ display:flex; flex-direction:column; align-items:center; gap:6px; }
.modal-field label{ font-size:.8rem; color:var(--text-dim); font-weight:700; text-align:center; max-width:11em; }
.modal-field input{
  width:80px;
  text-align:center;
  font-family:var(--font-display);
  font-weight:800;
  font-size:1.3rem;
  padding:10px 6px;
  border-radius:var(--r-sm);
  border:2px solid var(--border-soft);
  background:var(--surface-strong);
  color:var(--text);
  min-height:var(--tap-min);
}
.modal-feedback{
  text-align:center; min-height:1.6em; font-weight:700; margin-bottom:10px; font-size:.9rem;
}
.modal-feedback.err{ color:var(--error); }
.modal-feedback.ok{ color:var(--primary); }
.modal-actions{ display:flex; gap:10px; }
.modal-actions button{ flex:1; }
.secondary-btn{
  padding:12px; border-radius:var(--r-md); border:1px solid var(--border-soft);
  background:transparent; color:var(--text-dim); font-weight:700; cursor:pointer;
  min-height:48px;
}

/* =========================================================
   PANTALLA DE RESULTADO / CELEBRACIÓN
   ========================================================= */
.result-hero{
  font-size:clamp(2.2rem, 9vw, 3.4rem);
  text-align:center;
}
.result-title{
  font-size:clamp(1.3rem, 4vw, 1.8rem);
  text-align:center;
  margin:8px 0 4px;
}
.result-eq{
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.1rem, 3.6vw, 1.6rem);
  text-align:center;
  color:var(--primary);
  margin-bottom:20px;
  word-break:break-word;
}
.result-actions{
  display:flex; gap:12px; width:100%; flex-wrap:wrap;
}
.result-actions button{ flex:1 1 160px; }

.confetti-piece{
  position:fixed; top:-10px; z-index:800;
  border-radius:2px;
  animation: fall linear forwards;
  pointer-events:none;
}
@keyframes fall{
  to{ transform:translateY(105vh) rotate(360deg); opacity:.9; }
}

/* =========================================================
   BARRA DE PROGRESO DE COLUMNAS
   ========================================================= */
.progress-track{
  display:flex; gap:6px; width:100%; margin-bottom:16px;
}
.progress-seg{
  flex:1; height:6px; border-radius:4px; background:rgba(255,255,255,.12);
  overflow:hidden;
}
.progress-seg .fill{
  height:100%; width:0%; background:linear-gradient(90deg, var(--primary), var(--blue));
  transition:width .4s ease;
}

/* utilidad de botón de sonido */
.sound-icon{ font-size:1.1em; }

/* =========================================================
   MULTIPLICACIÓN ÁRABE — retícula (propio del recurso)
   ========================================================= */
:root{
  --ink:var(--text); --ink-soft:var(--text-dim); --ink-faint:var(--text-faint);
  --brass:#fbbf24; --brass-dark:#f59e0b; --success:#34d399; --success-bg:rgba(52,211,153,.15);
  --error-bg:rgba(251,113,133,.15); --radius-s:10px; --radius-m:16px; --radius-l:22px;
  --font-num:var(--font-display); --font-ui:var(--font-body);
  --cell-size:calc(var(--cell-base,56px) * var(--f,1));
}
#vista{ width:100%; display:flex; flex-direction:column; }
.hero{ text-align:center; }
.problema-pill{
  align-self:center; font-family:var(--font-num); font-weight:800; letter-spacing:.04em;
  font-size:calc(clamp(1.3rem,4.4vw,1.9rem) * var(--f,1)); color:#fff;
  background:linear-gradient(150deg, rgba(44,20,104,.75), rgba(30,17,71,.75));
  box-shadow:inset 0 0 0 1px rgba(196,181,253,.35); border-radius:16px;
  padding:calc(6px * var(--f,1)) calc(22px * var(--f,1)); margin:0 0 calc(12px * var(--f,1));
}
.lattice-card{ width:100%; display:flex; flex-direction:column; align-items:center; padding:calc(4px * var(--f,1)) 0 0; }
.lattice-row{ display:flex; align-items:flex-start; gap:6px; }
.lattice-left{ display:flex; flex-direction:column; }
.top-digits, .side-digits{ display:flex; }
.top-digits{ justify-content:flex-end; margin-bottom:5px; gap:4px; }
.side-digits{ flex-direction:column; margin-top:calc(var(--cell-size) * .62 + 5px); gap:4px; margin-left:4px; }
.digit-box{
  width:var(--cell-size); height:calc(var(--cell-size) * .62); display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .46); color:#fff;
  background:linear-gradient(150deg, rgba(124,58,237,.45), rgba(44,20,104,.7)); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.45);
  border:none; border-radius:12px; text-shadow:0 2px 6px rgba(0,0,0,.45);
}
.side-digits .digit-box{ width:calc(var(--cell-size) * .72); height:var(--cell-size); }
.grid-boxes{ display:grid; gap:4px; }
.lcell{
  width:var(--cell-size); height:var(--cell-size); position:relative; overflow:hidden; border-radius:10px;
  border:2px solid rgba(196,181,253,.75); background:rgba(30,17,71,.55); box-shadow:0 0 14px rgba(124,58,237,.25);
}
.lcell .tri{ position:absolute; inset:0; transition:background-color .35s ease, opacity .35s ease; }
.tri-tens{ clip-path:polygon(0 0,100% 0,0 100%); background:rgba(255,255,255,.05); }
.tri-ones{ clip-path:polygon(100% 0,100% 100%,0 100%); background:rgba(255,255,255,.1); }
.tri.diag-dim{ opacity:.35; } .tri.diag-active{ opacity:1; }
.cell-num{
  position:absolute; z-index:2; font-family:var(--font-num); font-weight:800; line-height:1; pointer-events:none;
  font-size:calc(var(--cell-size) * .36); color:#fff; text-shadow:0 2px 5px rgba(0,0,0,.5);
}
.cell-num.tens-pos{ top:12%; left:12%; } .cell-num.ones-pos{ bottom:10%; right:12%; }
.lcell input.cell-input{
  position:absolute; z-index:2; width:42%; height:42%; border:none; border-radius:7px; padding:0; outline:none;
  background:rgba(8,3,26,.55); box-shadow:inset 0 0 0 1.5px rgba(196,181,253,.5); text-align:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(var(--cell-size) * .32); color:#fff; user-select:text; -webkit-user-select:text;
}
.lcell input.cell-input.tens-pos{ top:6%; left:6%; } .lcell input.cell-input.ones-pos{ bottom:6%; right:6%; }
.lcell input.cell-input:focus{ background:rgba(124,58,237,.5); box-shadow:0 0 0 2.5px var(--brass), 0 0 14px rgba(251,191,36,.6); }
.lcell input.cell-input.wrong-flash{ background:var(--error-bg); box-shadow:0 0 0 2.5px var(--error); }

.diag-section{ margin-top:calc(22px * var(--f,1)); width:100%; display:flex; flex-direction:column; align-items:center; }
.diag-section h3{ font-size:calc(.86rem * var(--f,1)); font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); margin-bottom:calc(30px * var(--f,1)); text-align:center; }
.diag-row{ display:flex; gap:calc(8px * var(--f,1)); align-items:flex-end; flex-wrap:wrap; justify-content:center; }
.diag-box-wrap{ position:relative; display:flex; flex-direction:column; align-items:center; }
.carry-badge{
  position:absolute; top:calc(-24px * var(--f,1)); left:50%; transform:translateX(-50%) scale(0); opacity:0;
  font-family:var(--font-num); font-weight:800; font-size:.8rem; color:#3b2405; background:var(--brass);
  border-radius:999px; padding:2px 9px; white-space:nowrap; box-shadow:0 0 10px rgba(251,191,36,.7);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
}
.carry-badge.show{ transform:translateX(-50%) scale(1); opacity:1; }
.diag-box{
  width:calc(clamp(48px,11vw,64px) * var(--f,1)); min-height:calc(clamp(48px,11vw,64px) * var(--f,1));
  border-radius:14px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1));
  border:2.5px solid var(--border-soft); background:rgba(8,3,26,.4); color:var(--text-faint); transition:all .25s ease;
}
.diag-box.pending{ opacity:.55; }
.diag-box input{ width:100%; height:100%; border:none; background:transparent; text-align:center; font-family:var(--font-num); font-weight:800; font-size:calc(1.6rem * var(--f,1)); color:#fff; outline:none; user-select:text; -webkit-user-select:text; }
.diag-box.wrong{ animation:shake .32s ease; }
.carry-fly{
  position:fixed; z-index:3000; font-family:var(--font-num); font-weight:800; font-size:.95rem; color:#3b2405;
  background:var(--brass); border-radius:999px; padding:4px 10px; pointer-events:none;
  transition:transform .55s cubic-bezier(.3,.6,.4,1), opacity .55s ease;
}
.final-banner{
  margin-top:calc(16px * var(--f,1)); text-align:center; background:var(--success-bg); border:2px solid var(--success);
  color:var(--success); border-radius:16px; padding:calc(10px * var(--f,1)) 20px; font-weight:800;
  font-family:var(--font-num); font-size:calc(clamp(1.1rem,3.8vw,1.5rem) * var(--f,1));
}
.arabe-final{ width:100%; display:flex; flex-direction:column; align-items:center; }
.arabe-final .mv-fila-chip{ margin-top:calc(8px * var(--f,1)); }
.arabe-final .result-actions{ margin-top:calc(14px * var(--f,1)); }
.setup-box{ width:100%; max-width:480px; margin:0 auto; text-align:center; }
.setup-box label{ display:block; font-weight:700; font-size:.95rem; color:var(--text-dim); margin-bottom:16px; }
.factor-input-row{ display:flex; align-items:center; justify-content:center; gap:clamp(10px,3vw,18px); }
.factor-input{
  width:100%; max-width:150px; font-family:var(--font-num); font-weight:800; font-size:clamp(1.6rem,7vw,2.2rem);

<script src="robot-skins.js"></script>
<script>

const CLAVE_SESION_COMPARTIDA = 'profehoracio_alumno_actual';
let AlumnoActual = null;
let datosAlumno = null; // último snapshot conocido: monedas, criaturas, companeroEquipado

function normalizarUsuarioCompartido(u){
  return u.trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/\s+/g, '-');
}

const FONDO_HUB = true;
function irA(n){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'screen-' + n));
  window.scrollTo(0, 0);
  if(n === 'hub') renderizarHub();
  if(n === 'perfil') renderizarPerfil();
  if(n === 'criaturas') renderizarTienda();
  if(n === 'robot') renderizarRobot();
  if(n === 'tiempo') renderizarTiempo();
}
document.querySelectorAll('[data-ir]').forEach(b => b.addEventListener('click', () => irA(b.dataset.ir)));

function renderizarHub(){
  const catalogo = window.CATALOGO_CRIATURAS || {};
  const id = datosAlumno && datosAlumno.companeroEquipado;
  const c = id ? catalogo[id] : null;
  const et = (c && window.etapaCompanero) ? window.etapaCompanero(datosAlumno.companeroXpV2 && datosAlumno.companeroXpV2[id]) : null;
  let img = '';
  if(c){
    const arch = window.archivoCompanero ? window.archivoCompanero(id, et.nivel, window.evoCompanero(datosAlumno, id)) : c.archivo;
    img = `<img src="assets/mathverse/creatures/${arch}" alt="${c.nombre}">`;
  } else { img = '<span class="hub-huevo">🥚</span>'; }
  document.querySelectorAll('.hub-comp').forEach(e => { e.innerHTML = img; });
  document.querySelectorAll('.hub-nombre').forEach(e => { e.textContent = c ? `${c.nombre} · Nv ${et.nivel}` : 'Elige un compañero en la tienda'; });
}

function renderizarRobot(){
  const catalogo = window.CATALOGO_SKINS_ROBOT || {};
  const nombresSlot = window.NOMBRES_SLOT_ROBOT || {};
  const tiene = (datosAlumno && datosAlumno.skinsRobot) || {};
  const puesto = (datosAlumno && datosAlumno.skinRobotEquipado) || {};
  const saldo = (datosAlumno && datosAlumno.monedas) || 0;
  if(typeof window.dibujarRobot !== 'function'){
    document.getElementById('grillaRobot').innerHTML = '<div class="sin-items">La ropa del robot no está disponible por ahora.</div>';
    return;
  }
  document.getElementById('robotPreview').innerHTML = window.dibujarRobot(puesto);
  const partes = ['gorro', 'camiseta'].filter(sl => puesto[sl] && catalogo[puesto[sl]]).map(sl => catalogo[puesto[sl]].nombre);
  document.getElementById('robotDetalle').textContent = partes.length ? partes.join(' · ') : 'Sin ropa todavía';
  let html = '';
  ['gorro', 'camiseta'].forEach(slot => {
    html += `<div class="grupo-titulo">${slot === 'gorro' ? '🎩' : '👕'} ${nombresSlot[slot] || slot}s</div>`;
    let grupoAct = '';
    Object.entries(catalogo).filter(([id, c]) => c.slot === slot && !(c.retirada && !tiene[id])).forEach(([id, c]) => {
      const gr = c.grupo || '';
      if(gr !== grupoAct){ grupoAct = gr; if(gr) html += `<div class="grupo-titulo sub">${gr}</div>`; }
      const tenida = !!tiene[id];
      const esPuesta = puesto[slot] === id;
      const alcanza = saldo >= c.precio;
      html += `
        <div class="criatura-card">
          <div class="orb-img"><div class="rb-mini">${window.dibujarRobot({ [slot]: id })}</div></div>
          <div class="skin-nombre">${c.nombre}</div>
          ${tenida
            ? `<button class="btn-mini ${esPuesta ? 'equipado' : 'equipar'}" onclick="${esPuesta ? `quitarSkin('${slot}')` : `ponerSkin('${slot}','${id}')`}">${esPuesta ? '✅ Equipado · Quitar' : 'Equipar'}</button>`
            : `<div class="criatura-precio">🪙 ${c.precio}</div>
               <button class="btn-mini comprar" ${alcanza ? '' : 'disabled'} onclick="comprarSkin('${id}')">${alcanza ? 'Comprar' : 'Faltan monedas'}</button>`
          }
        </div>`;
    });
  });
  document.getElementById('grillaRobot').innerHTML = html;
}

document.addEventListener('click', function(e){ var b = e.target.closest && e.target.closest('#btnCodigoCompras'); if(b && AlumnoActual && window.cambiarCodigoGasto) window.cambiarCodigoGasto(AlumnoActual.id); });
async function comprarSkin(skinId){
  const cod = await window.pedirCodigoGasto(AlumnoActual.id);
  if(!cod || !cod.ok) return;
  const resultado = await window.comprarSkinRobot(AlumnoActual.id, skinId, cod.hash);
  if(!resultado.ok){ await window.alertarPersonalizado(resultado.error); return; }
  const skin = window.CATALOGO_SKINS_ROBOT[skinId];
  datosAlumno.monedas = resultado.saldoRestante;
  datosAlumno.skinsRobot = datosAlumno.skinsRobot || {};
  datosAlumno.skinsRobot[skinId] = true;
  actualizarSaldoPantalla();
  mostrarToastMonedas(-skin.precio, true);
  // Al comprar, se la pone de inmediato (se puede cambiar o quitar después)
  await ponerSkin(skin.slot, skinId);
}
async function ponerSkin(slot, skinId){
  const ok = await window.equiparSkinRobot(AlumnoActual.id, slot, skinId);
  if(!ok){ await window.alertarPersonalizado('No se pudo poner la prenda. Intenta de nuevo.'); return; }
  datosAlumno.skinRobotEquipado = datosAlumno.skinRobotEquipado || {};
  datosAlumno.skinRobotEquipado[slot] = skinId;
  renderizarRobot();
}
async function quitarSkin(slot){ await ponerSkin(slot, null); }

function actualizarSaldoPantalla(){
  const v = (datosAlumno && datosAlumno.monedas) || 0;
  document.querySelectorAll('.saldoTexto').forEach(e => { e.textContent = v; });
}

function renderizarTienda(){
  const cont = document.getElementById('grillaTienda');
  const catalogo = window.CATALOGO_CRIATURAS || {};
  const yaCompradas = (datosAlumno && datosAlumno.criaturas) || {};
  const equipada = datosAlumno && datosAlumno.companeroEquipado;
  const saldo = (datosAlumno && datosAlumno.monedas) || 0;
  cont.innerHTML = Object.entries(catalogo).map(([id, c]) => {
    const tenida = !!yaCompradas[id];
    const alcanza = saldo >= c.precio;
    const esEquipada = equipada === id;
    return `
      <div class="criatura-card">
        <div class="orb-img"><img class="criatura-img ${tenida ? '' : 'bloqueada'}" src="assets/mathverse/creatures/${c.archivo}" alt="${tenida ? c.nombre : 'Criatura misteriosa'}"></div>
        <div class="criatura-nombre">${tenida ? c.nombre : '???'}</div>
        <div class="criatura-tipo">${tenida ? c.tipo : c.tipo.split(' ')[0]} · ${tenida ? c.rareza : '???'}</div>
        <div class="criatura-evo ${c.archivoEvo2 ? 'si' : ''}">${c.archivoEvo2 ? '✨ 3 formas' : (c.archivoEvo ? '2 formas' : '1 forma')}</div>
        ${tenida
          ? `<button class="btn-mini ${esEquipada ? 'equipado' : 'equipar'}" onclick="equipar('${id}')">${esEquipada ? '✅ Equipado' : 'Equipar'}</button>`
          : `<div class="criatura-precio">🪙 ${c.precio}</div>
             <button class="btn-mini comprar" ${alcanza ? '' : 'disabled'} onclick="comprar('${id}')">${alcanza ? 'Comprar' : 'Faltan monedas'}</button>`
        }
      </div>
    `;
  }).join('');
}

function renderizarPerfil(){
  const catalogo = window.CATALOGO_CRIATURAS || {};
  const equipadaId = datosAlumno && datosAlumno.companeroEquipado;
  const c = equipadaId ? catalogo[equipadaId] : null;
  const hero = document.getElementById('heroPerfil');
  const et = window.etapaCompanero ? window.etapaCompanero(datosAlumno && datosAlumno.companeroXpV2 && datosAlumno.companeroXpV2[equipadaId]) : { nivel:1, titulo:'Cría', pct:0, xp:0, desde:0, hasta:null };
  const desc = document.getElementById('perfilDescripcion');
  if(c){
    hero.innerHTML = `
      <img class="hero-img" src="assets/mathverse/creatures/${window.archivoCompanero ? window.archivoCompanero(equipadaId, et.nivel, window.evoCompanero(datosAlumno, equipadaId)) : c.archivo}" alt="${c.nombre}" style="${window.marcoCompanero ? window.marcoCompanero(et.nivel).replace(/border:[^;]+;/,'') : ''}">
      <div class="hero-nombre">${c.nombre}</div>
      <div class="hero-etapa">Nv ${et.nivel} · ${et.titulo}</div>
      <div class="xpbar"><i style="width:${Math.round(et.pct * 100)}%"></i></div>
      <div class="xp-txt">${et.hasta ? `${et.xp - et.desde} / ${et.hasta - et.desde} XP para ser ${et.tituloSiguiente}` : `${et.xp} XP · ¡etapa máxima!`}</div>
    `;
    desc.textContent = c.descripcion;
    try{ const imV = hero.querySelector('.hero-img'); if(imV && window.mvVida) window.mvVida.activar(imV, equipadaId, { respira:false, toque:true }); }catch(e){}
  } else {
    hero.innerHTML = `<div class="hero-vacio"><span style="font-size:3rem">🥚</span><span>Todavía no tienes un compañero equipado.</span><button type="button" class="btn-orbita v-oro" onclick="irA('criaturas')"><span class="bola">🐾</span>Ir a la tienda</button></div>`;
    desc.textContent = '';
  }
}

const MESES_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function textoDuracion(seg){
  const m = Math.round((seg || 0) / 60);
  return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`;
}
function renderizarTiempo(){
  const cont = document.getElementById('tiempoCuerpo');
  const practica = (datosAlumno && datosAlumno.practica) || {};
  const porMes = {}; let segTotal = 0, compTotal = 0;
  Object.keys(practica).forEach(recurso => {
    const meses = practica[recurso];
    if(!meses || typeof meses !== 'object') return;
    Object.keys(meses).forEach(mk => {
      const d = meses[mk]; if(!d) return;
      porMes[mk] = porMes[mk] || { seg:0, comp:0 };
      porMes[mk].seg += d.segundos || 0; porMes[mk].comp += d.completados || 0;
      segTotal += d.segundos || 0; compTotal += d.completados || 0;
    });
  });
  const claves = Object.keys(porMes).sort().reverse();
  if(!claves.length){ cont.innerHTML = '<p class="sin-items">Aún no hay tiempo registrado. ¡Practica un recurso y vuelve!</p>'; return; }
  const nombreMes = mk => { const [a, m] = mk.split('-'); return `${MESES_ES[(+m) - 1] || mk} ${a}`; };
  cont.innerHTML = `
    <div class="tiempo-orbe"><b>${textoDuracion(segTotal)}</b><span>${compTotal} ejercicios resueltos</span></div>
    <ul class="tiempo-lista">${claves.map(mk => `<li><span class="mes">${nombreMes(mk)}</span><span class="val">${textoDuracion(porMes[mk].seg)} · ${porMes[mk].comp} ejercicios</span></li>`).join('')}</ul>
    <p class="tiempo-nota">Solo cuenta el tiempo en que estás practicando de verdad.</p>`;
}

async function comprar(criaturaId){
  const cod = await window.pedirCodigoGasto(AlumnoActual.id);
  if(!cod || !cod.ok) return;
  const resultado = await window.comprarCriatura(AlumnoActual.id, criaturaId, cod.hash);
  if(!resultado.ok){
    await window.alertarPersonalizado(resultado.error);
    return;
  }
  datosAlumno.monedas = resultado.saldoRestante;
  datosAlumno.criaturas = datosAlumno.criaturas || {};
  datosAlumno.criaturas[criaturaId] = true;
  actualizarSaldoPantalla();
  renderizarTienda();
  mostrarToastMonedas(-window.CATALOGO_CRIATURAS[criaturaId].precio, true);
}

async function equipar(criaturaId){
  const ok = await window.equiparCompanero(AlumnoActual.id, criaturaId);
  if(!ok){ await window.alertarPersonalizado('No se pudo equipar. Intenta de nuevo.'); return; }
  datosAlumno.companeroEquipado = criaturaId;
  renderizarTienda();
}

function mostrarToastMonedas(cantidad, esGasto){
  const toast = document.createElement('div');
  toast.textContent = `${cantidad > 0 ? '+' : ''}${cantidad} 🪙`;
  toast.style.cssText = `position:fixed; bottom:20px; left:50%; transform:translateX(-50%); z-index:99998; background:${esGasto ? 'var(--error)' : 'var(--accent)'}; color:#1a0f3d; font-family:var(--font-display); font-weight:800; font-size:.9rem; padding:8px 18px; border-radius:16px; animation: monedaFlota 2s ease-out forwards; pointer-events:none;`;
  document.body.appendChild(toast);
  setTimeout(()=> toast.remove(), 2000);
}

async function entrarConDatos(id, nombre){
  AlumnoActual = { id, nombre };
  document.getElementById('jugandoComo').textContent = `Hola, ${nombre}`;
  datosAlumno = await window.obtenerDatosAlumno(id) || {};
  actualizarSaldoPantalla();
  irA('hub');
}

function intentarSesionCompartida(){
  try{
    const guardado = JSON.parse(sessionStorage.getItem(CLAVE_SESION_COMPARTIDA) || 'null');
    if(!guardado || !guardado.id) return false;
    entrarConDatos(guardado.id, guardado.nombre);
    return true;
  } catch(e){ return false; }
}

function iniciar(){
  if(typeof window.verificarLoginAlumnoCompartido !== 'function'){
    setTimeout(iniciar, 100);
    return;
  }
  intentarSesionCompartida();
}
iniciar();
