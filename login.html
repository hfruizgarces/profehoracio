<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ingreso de Alumnos</title>
</head>
<body>
    <h2>Ingreso a la Clase</h2>
    <input type="text" id="codigo" placeholder="Código (ej. TEST123)"><br><br>
    <input type="text" id="nombre" placeholder="Tu Nombre"><br><br>
    <button id="btnIngresar">Unirse a la clase</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDrwcG84h88gOf9FkUlZbECZ2qrO14KhO4",
          authDomain: "profehoracio-online.firebaseapp.com",
          projectId: "profehoracio-online",
          storageBucket: "profehoracio-online.firebasestorage.app",
          messagingSenderId: "TU_SENDER_ID",
          appId: "1:337766647406:web:6f13e95cb71b5f89cfc87f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth();
        const db = getFirestore();

        document.getElementById("btnIngresar").addEventListener("click", async () => {
            const codigo = document.getElementById("codigo").value;
            const nombre = document.getElementById("nombre").value;

            if (!codigo || !nombre) {
                alert("Completa ambos campos");
                return;
            }

            try {
                const sessionRef = doc(db, "sessions", codigo);
                const sessionSnap = await getDoc(sessionRef);

                if (!sessionSnap.exists()) {
                    alert("¡Ese código de sesión no existe!");
                    return;
                }

                const userCredential = await signInAnonymously(auth);
                const uid = userCredential.user.uid;

                await setDoc(doc(db, `sessions/${codigo}/students`, uid), {
                    name: nombre,
                    joinedAt: serverTimestamp(),
                    correctas: 0,
                    intentos: 0
                });

                // Enviar al recurso, pasando la sesión y el alumno por la URL
                const parametros = new URLSearchParams({ codigo, uid, nombre });
                window.location.href = `coordenadas/index.html?${parametros.toString()}`;
            } catch (error) {
                console.error(error);
                alert("Error de conexión");
            }
        });
    </script>
</body>
</html>
